# 约克城 / 大黄蜂 状态切片
# 2026-11-19 建。

ship: yorktown
slices:
  - code: Y00
    title: 订购与建造
    from: 1934-05-21
    to: 1937-09-29
    note: >-
      1934-05-21 开工；承造 Newport News Shipbuilding & Dry Dock Co.（Newport News, Virginia）；1936-04-04 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: Y0
    title: 建成至开战
    from: 1937-09-30
    to: 1941-12-06
    note: >-
      服役状态。5"/38 单装 8 座（Mk 21 Mod 16 炮架）、1.1"/75 四联装 4 座、
      20mm 若干。无 40mm。CXAM-1 雷达 1940 年装机。
      Mk 33 射击指挥仪。涂装 Measure One。

  - code: Y1
    title: 开战至珊瑚海前
    from: 1941-12-07
    to: 1942-05-07
    note: >-
      1941-12 开战后编入太平洋舰队。参加马绍尔-吉尔伯特空袭（1942-02）、
      莱城-萨拉马瓦空袭（1942-03）。

  - code: Y2
    title: 珊瑚海重伤
    from: 1942-05-08
    to: 1942-05-26
    note: >-
      1942-05-08 珊瑚海海战被日军舰载机重创：一枚 250kg 炸弹穿透飞行甲板、
      在机库内爆炸，另一枚近失在舰体上炸开裂缝。
      **损伤严重到日方以为它已沉没**，实际它挣扎回了珍珠港。

  - code: Y3
    title: 抢修出击
    from: 1942-05-27
    to: 1942-06-06
    note: >-
      5-27 抵珍珠港 → 5-28 进 1 号干船坞 → 5-30 出港。
      **1400 名修理工昼夜赶工**、檀香山轮流停电、用整块钢板直接焊盖裂缝。
      注意：DANFS 只说「around the clock」，**没给 72 小时这个数字**；
      Wikipedia 记 48 小时；原估价有 90 天（Fitch）/ 两周（船厂）/ 三个月（DANFS）三说。
      **最关键的一项没修：超热器锅炉未动，限制了最高航速**——
      这直接影响它能否跟上 TF 16。
      中途岛时 5"/38 实为 7 座可用（#2 炮哑火后弹丸卡膛退出战斗）。

  - code: Y4
    title: 中途岛·战没
    from: 1942-05-30
    to: 1942-06-07
    note: >-
      第 17 特混舰队旗舰（弗莱彻）。
      6-04 上午约克城 VB-3（Leslie）攻击苍龙；下午被飞龙两波攻击重创。
      6-05 弃舰，6-06 拖船尝试拖带，**6-07 被伊-168 命中 2 条鱼雷后沉没**。
      它一直漂在水上，美军甚至以为能救回来——这是中途岛最容易被记错的一处。
