ship: northampton
slices:
- code: P0
  title: 建造与服役（1928-1930）
  from: '1928-04-12'
  to: '1930-05-17'
  note: 1928-04-12 在 Fore River 开工，1929-09-05 下水，1930-05-17 服役。本级采用 8"/55 Mk 9。
- code: P1
  title: 战前（1930-1941-12）
  from: '1930-05-18'
  to: '1941-12-06'
  note: 1931 年拆除鱼雷发射管。
- code: P2
  title: 开战至中途岛（1941-12-07-1942-06-13）
  from: '1941-12-07'
  to: '1942-06-13'
  note: 中途岛时属 TG 16.2，护卫企业号。
- code: P3
  title: 所罗门战役与塔萨法隆加沉没（1942-06-14-1942-12-01）
  from: '1942-06-14'
  to: '1942-12-01'
  note: 1942-11-30 塔萨法隆加夜战中被两条鱼雷命中，12-01 沉没。生还 773 人。
