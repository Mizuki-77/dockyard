# ============================================================================
# 状态切片：密苏里（Missouri, BB-63）
# ----------------------------------------------------------------------------
# 切片只描述「这艘舰的外形与配置在某段时间里是什么样」，边界落在
# ships/missouri.yaml 里真实存在的 fact 时间窗与史料节点上。
#
# 密苏里的外形变化主线：
#   船台 → 下水（1944-01，掷瓶人为参议员杜鲁门之女）→ 竣工（20×4 40 mm，
#   比首舰多 5 座）→ 1945-05 加 8 座双联 20 mm 与 SP 雷达 → 受降仪式
#   → 1946 外交航行（保留全炮）→ 朝鲜战争 → 1955 封存 → 1986 复役改装
#   → 1991 海湾战争 → 1992 退役 → 1998 珍珠港博物馆舰。
# ============================================================================

ship: missouri

slices:
  - code: P0
    title: 船台建造、下水与舾装（1941-01 至 1944-06）
    from: 1941-01-06
    to: 1944-06-10
    note: >-
      1941-01-06 在纽约海军造船厂（布鲁克林）开工，是同级中开工最早的一艘
      （同为 1941-01-06 的还有 BB-65/66），但服役最晚的两艘之一——建造周期
      被其他优先级更高的舰种挤占。1944-01-29 下水，掷瓶人为密苏里州参议员
      哈里·杜鲁门之女 Margaret Truman（杜鲁门翌年成为总统）。
      舾装期特征与首舰同期一致：三座主炮塔安装中，20 座 5 英寸双联装炮座
      与 20 座四联 40 mm 炮位就位，舰桥与雷达桅仍在施工。

  - code: P1
    title: 竣工与加勒比试航（1944-06 至 1944-11）
    from: 1944-06-11
    to: 1944-11-10
    note: >-
      1944-06-11 服役，首任舰长 Callaghan 上校。竣工防空为 20 座四联 40 mm
      （80 门）+ 49 门单装 20 mm，比衣阿华号多 5 座四联 40 mm、少 11 门 20 mm。
      雷达为 SK-2 + 2 部 SG + Mk 27 + 2 部 Mk 8 + 4 部 Mk 12.22。
      在纽约外海试航、切萨皮克湾与关塔那摩进行战斗训练。

  - code: P2
    title: 太平洋战场（1944-12 至 1945-08）
    from: 1944-11-11
    to: 1945-08-31
    note: >-
      1944-11-11 离诺福克，11-18 过巴拿马运河，在旧金山完成舰队旗舰的最后舾装。
      1945 年逐段参战：02-16 首次随第 58 特混舰队空袭日本本土、02-19 硫磺岛
      火力支援、03-24 炮击冲绳东南岸、04-11 击落来袭自杀机（右翼碎片引燃
      3 号 5 英寸炮座的火，仅表面损伤）。1945-05 加装 8 座双联 20 mm 与 SP 雷达，
      即受降仪式时的配置。

  - code: P3
    title: 受降舰与战后外交航行（1945-09 至 1950-08）
    from: 1945-09-01
    to: 1950-08-18
    note: >-
      1945-09-02 在东京湾签署日本投降书，全舰保持战时防空配置。
      此后 1946-03 运送土耳其大使灵柩赴伊斯坦布尔、1946-04 访问比雷埃夫斯、
      1947-09 里约会议——这几段是「全炮保留 + 外交礼宾」的形态。
      1949-1950 年冬在诺福克大修后于 1950-01-17 在 Thimble Shoals 搁浅，
      02-01 脱困（舰体无结构损伤）。

  - code: P4
    title: 朝鲜战争（1950-09 至 1955-02）
    from: 1950-08-19
    to: 1955-02-26
    note: >-
      1950-09-15 炮击三陟（Samchok），是朝鲜战争中第一艘抵达朝鲜水域的
      美国战列舰。此后 1951、1952-53 两度入战区，1952-10-19 起任第 7 舰队旗舰。
      此段外形上仍是二战末配置（40 mm 大量保留），1951 年再加 4 座四联 40 mm
      与 32 座双联 20 mm。1955-02-26 在普吉特湾海军船厂退役。

  - code: P5
    title: 布雷默顿封存（1955-02 至 1986-05）
    from: 1955-02-27
    to: 1986-05-09
    note: >-
      入布雷默顿太平洋后备舰队，封存三十年，年均约 10 万人参观。
      外形冻结在 1950 年代中期状态：三座主炮塔、10 座 5 英寸炮座、
      大量 40 mm 四联装仍在甲板上，未做任何现代化改装。

  - code: P6
    title: 1980 年代复役改装与海湾战争（1986-05 至 1992-03）
    from: 1986-05-10
    to: 1992-03-31
    note: >-
      1986-05-10 在旧金山复役。加装 8 座四联「战斧」发射箱、4 座四联「鱼叉」、
      4 座 20 mm「密集阵」，拆除全部 40 mm 与 20 mm，增设直升机甲板与
      无人机（RPV）操作能力；雷达换 SPS-49/SPS-67/SPS-64 + 2 部 Mk 13 +
      4 部 Mk 25，加 SLQ-32(v)3、SRBOC Mk 36 与 SLQ-25 Nixie。
      1986-09 起环球航行（美国战列舰自 1907-09 大白舰队以来首次）。
      1991-01-17 起向伊拉克目标发射战斧，02-03 起炮击科威特海岸。

  - code: P7
    title: 退役与珍珠港博物馆舰（1992-04 起）
    from: 1992-04-01
    note: >-
      1992-03-31 退役，封存于布雷默顿；1995-01-12 除籍；1998-05-04 捐赠转为
      博物馆舰，后移至珍珠港 Ford Island，与亚利桑那纪念馆并泊。
      舰体保持 1991 年海湾战争结束时状态，主炮塔与 5 英寸炮座完整保留，
      受降甲板（Surrender Deck）是参观路线的核心展项。
