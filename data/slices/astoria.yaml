ship: astoria
slices:
- code: P0
  title: 建造与服役（1929-1934）
  from: '1929-02-13'
  to: '1934-04-28'
  note: 1930-09-01 在普吉特湾海军船厂开工，1933-12-16 下水，1934-04-28 服役。 订购日 1929-02-13（construction.order_date）为时间轴起点。
- code: P1
  title: 战前（1934-1941-12）
  from: '1934-04-29'
  to: '1941-12-06'
  note: 编入巡洋舰分队，太平洋舰队。
- code: P2
  title: 开战至中途岛（1941-12-07-1942-06-13）
  from: '1941-12-07'
  to: '1942-06-13'
  note: 1942-06 中途岛时属 TG 17.2（RA W. W. Smith），阿斯托里亚是该群旗舰；6-04 弗莱彻把将旗从约克城移到本舰。
- code: P3
  title: 瓜岛与萨沃岛沉没（1942-06-14-1942-08-09）
  from: '1942-06-14'
  to: '1942-08-09'
  note: 1942-08-09 萨沃岛海战中沉没，是当晚最早被击沉的美军重巡之一。
