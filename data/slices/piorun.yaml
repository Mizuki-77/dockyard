# ============================================================================
# 状态切片：ORP Piorun（闪电号，舷号 G65）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立，所以放 data/slices/ 而不是 data/classes/。
#
# 【本舰切片的分界逻辑】
# 一般舰按「改装节点」切；本舰必须先把**国籍**切开，因为
# 英国在建舰 → 波兰借调舰 → 英国归还舰这三段，连舰名和旗都换了。
# 国籍切完，再在波兰那一段里按改装与战场切。
#
# 【全生涯时间轴】
#   1939-07-26 开工 → 1940-05-07 下水 → 1940-10 转交波兰
#   → 1940-11-04 建成交接 / 11-05 升旗 → 1941-05-26 俾斯麦夜战
#   → 1941-09 地中海 Halberd → 1942 大西洋护航与改装
#   → 1943 地中海 Husky/Baytown/Avalanche → 1944 诺曼底与比斯开湾
#   → 1945 Deadlight → 1946-09-28 归还英国 → 1955-12-02 拆解
# ============================================================================
ship: piorun
slices:
  - code: P0
    title: 建造与转交（1939-1940）
    from: 1939-07-26
    to: 1940-11-03
    note: >-
      1939-07-26 在 John Brown（Clydebank，厂号 563）开工，1940-05-07 下水，
      下水时仍名 HMS Nerissa、仍属英国。

      转折点在 1940-05-04：波兰驱逐舰 ORP Grom 在挪威 Rombaken 峡湾
      被德国飞机炸沉。数日后英国海军部致函波兰海军参谋长，表示愿从在建舰中
      拨一艘补给波兰。选中的就是 Nerissa。

      1940 年 8-9 月间开始配备波兰舰员，最初约 90 人，绝大多数是
      Grom 的幸存者，另有从法国赶来的波兰志愿兵；指挥官 kmdr por.
      Eugeniusz Pławski。舾装期间还做了一件不常见的事：把舰上所有
      说明铭牌译成波兰语，内部管路的颜色标识也改成波兰标准。

      这一段的状态特征：**一艘英国在建舰正在被改成波兰船**，
      但产权与旗籍都还是英国的。

  - code: P1
    title: 交接与升旗（1940-11-04 至 11-05）
    from: 1940-11-04
    to: 1940-11-05
    note: >-
      **只有两天，但必须单独切出来，否则交接日期一定会写错。**

      1940-11-04：在 Greenock 锚地签署接船验收书（船厂方是副总经理，
      波方是 kmdr por. Pławski）。Pławski 回忆当天只喝了一杯雪利酒、
      对方握手说了句 "She is yours. Good luck to you!"。
      同日算建成（build completion）。

      1940-11-05 上午 9:00：正式升波兰海军旗、编入波兰海军、
      经总司令同意得名 ORP Piorun。这一条有一手文件：
      波兰海军 Kierownictwo Marynarki Wojennej 1940-11-13 第 20 号密令
      （伦敦），追认上述事实，并注明舰员自 1940-10-24 至 11-04
      已按 Nerissa 编制在册领薪。

      注意产权：本舰是**借调**，产权仍属英国政府。依据是 1939-11-18
      英波海军合作协定（波方签字人 Edward Raczyński，英方 Alexander Cadogan），
      协定明确借调舰「仍为英国政府财产」。这决定了 1946 年必须归还。

  - code: P2
    title: 本土水域与克莱德河大空袭（1940-11 至 1941-05）
    from: 1940-11-06
    to: 1941-05-21
    note: >-
      编入皇家海军第 7 驱逐舰分队，基地 Scapa Flow / Greenock / Gourock。
      以反潜护航与主力舰屏护为主，其间事故不断：
      1941-01-11 在 Scapa Flow 加装了混入海水的燃油，失去动力漂流撞上油轮，
      还丢了一只锚；1941-01-25 参加拦截 Scharnhorst / Gneisenau 的未果行动，
      遭遇恶劣海况舰体受损退出屏护；1941-02-23 回 Greenock 转 Glasgow 修理。

      **本片最该记住的是 1941-03-13/14 的克莱德河大空袭（Clydebank Blitz）。**
      当时本舰正在 John Brown 船厂修理。两枚燃烧弹落在舰上，被舰员
      及时处置未爆；舰员同时参加邻近舰船（包括在建的战列舰 HMS Duke of York）
      的灭火，并用火炮打掉德军伞降布置的水雷。她是当晚该区域
      唯一有组织对空抵抗的军舰。舰员因此获波兰海军参谋长通令嘉奖，
      Clydebank 至今有纪念本舰舰员的纪念碑（1994-03-13 揭幕）。

      1941-04-13 参与救援被 U-108 击沉的辅助巡洋舰 HMS Rajputana 幸存者。

  - code: P3
    title: 追猎俾斯麦（1941-05-22 至 1941-05-28）
    from: 1941-05-22
    to: 1941-05-28
    note: >-
      **本舰存在的理由，本片是全舰最重要的一段。**

      1941-05-22 随第 4 驱逐舰分队（旗舰 HMS Cossack，Capt. Philip Vian）
      加入运兵船队 WS8B 的本地护航。05-25 分队脱离船队转去搜寻俾斯麦，
      05-26 全天在恶劣海况下追击（只能维持 27 节，仅比俾斯麦快 2 节）。

      **05-26 夜的交火，按一手战报（London Gazette 1947-10-16 增刊，
      Tovey 战报 §73-75）：**

      - 2238 本舰在编队左翼（编队自东北向西南依次为 Piorun、Maori、
        Cossack、Sikh、Zulu，间隔 2.5 海里）首先发现俾斯麦，
        报距 9 海里、方位 145°。
      - 2242 德舰以主炮与副炮对 Piorun 与 Maori 开火。
      - 本舰接近至 **13,500 码**（约 12,340 m）开火，打了三发齐射后
        被一发近失弹夹叉（落点距舷侧约 20 码），随即停火、左转、施放烟幕脱离。
      - 此后在德舰火力下约一小时，**未被命中**；2355 失去接触。

      **两个必须写清的事实：**

      一、**她不在 05-27 的最终战现场。** 05-27 0500，Vian 因本舰燃油
      将尽而下令其返航（"ordered ... to proceed to Plymouth to fuel if not
      in contact with the enemy"）。Pławski 不服，又多搜了一小时，
      0600 才转向，0700 离开战区。战报原文：PIORUN continued to search
      until 0600 and left an hour later. 所以最终战（0847 起）她不在场。
      本站 data/battles/last-battle.yaml 把她列入参战名单，
      严格说应理解为「参加该役的夜间追击阶段」，不含次日上午的炮战。

      二、**双方均无命中。** 战报只写德舰火力 "unpleasantly accurate"，
      明确记「两舰均未被实际命中」。本舰 4.7 英寸炮弹即使命中也
      无法击穿俾斯麦 220-320 mm 装甲带。

      05-28 抵港时油舱仅剩约 37 t（一说 30 t），舰体因风暴受损、
      因缺油而向一侧倾斜 10-15°，在围观者眼里像受了战伤。

  - code: P4
    title: 地中海：Halberd 与马耳他护航（1941-08 至 1941-12）
    from: 1941-08-01
    to: 1941-12-18
    note: >-
      1941-09-17 起参加 Operation Halberd（马耳他补给行动 GM.2），
      编入 Force A，为战列舰 HMS Nelson / Rodney / Prince of Wales
      与航母 HMS Ark Royal 提供屏护。
      09-27 意军鱼雷机空袭中 Nelson 被命中一条鱼雷，本舰随后被派去
      专门护卫这艘受损的战列舰返 Gibraltar。
      行动期间还救起一名因座机受损而迫降海面的英军飞行员。

      1941-10 至 12 月转回大西洋与北海护航（WS 系列与 CT/TC 系列船队），
      12-18 进 Clydebank 由原厂改装。

  - code: P5
    title: 大西洋护航与 1942 年改装（1942）
    from: 1941-12-19
    to: 1942-12-18
    note: >-
      **本片的重点是改装，不是护航。** 本舰 1942 年按 N 级统一改装方案
      把建成时的「1 座五联鱼雷管 + 1 门 4 英寸高炮」换回
      「2 座五联鱼雷管」—— 即拆掉 4 英寸高炮、装回第二座鱼雷发射管；
      20 mm 厄利孔由单装改为部分双联装；Type 291 雷达替换 Type 286。
      （navypedia 记本级 1942 年改装为：
      "- 1 x 1 - 102/45, 2 x 1 - 20/70, 2 x 2 - 12.7/62;
      + 4 x 2 - 20/70 Oerlikon, 1 x 5 - 533 TT"。）

      改装后回到大西洋护航：ON70 / SC75 / HX194 / ON121 / HX202 /
      ONS126 / HX207 等。1942-03-11 在 ON70 护航中对一艘下潜的 U 艇
      实施攻击，舰上判定击沉，未获确认。

      1942-04-08 至 04-16 还有一次特殊任务：与 HMS Churchill 一起
      从英国向加拿大运送银行黄金储备，每舰 5 吨，装在封存的尾部弹药库里。
      航途中风暴导致舰体铆钉松动、前部 1 号弹药库进水。

      1942-10-01 进 Dundee 商船厂改装，12 月完成试航。

  - code: P6
    title: 地中海：Husky / Baytown / Avalanche（1943）
    from: 1942-12-19
    to: 1943-11-25
    note: >-
      1943-06 转地中海，07-06 起编入第 24 驱逐舰分队，掩护 Force H。
      参加西西里登陆（Operation Husky）：07-12 在掩护兵力屏护序列中，
      07-15 参与击落攻击航母 HMS Indomitable 的鱼雷机，并护送受损的
      Indomitable 回马耳他。

      07-21 随轻兵力编队（巡洋舰 Aurora、Penelope 加 5 艘驱逐舰）
      炮击卡拉布里亚的 Crotone，本舰发射 160 发。
      08-31 与 09-02 参加 Operation Baytown（卡拉布里亚登陆）前的
      Reggio Calabria 至 Pessaro 沿岸炮击；09-09 参加 Operation Avalanche
      （萨勒诺登陆），为 Nelson / Rodney / Valiant / Warspite 屏护。
      09-08 报告击落一架来袭飞机；09-09 数次攻击发现的潜艇。

      11-08 炮击 Volturno 与 Gaeta 湾岸上目标，随后返英，
      11-26 抵 Greenock 进厂修理。

  - code: P7
    title: 诺曼底、比斯开湾与战争结束（1944-1945）
    from: 1943-11-26
    to: 1945-09-02
    note: >-
      **本片有两次独立的水面交战，一次鱼雷战果，都值得记。**

      1944-01 修完归第 3 驱逐舰分队（Scapa Flow）。04 月参加
      Operation Tungsten（空袭提尔皮茨）的舰队油船护航，并连续参加
      4-5 月对挪威沿岸航运的多次袭击。

      1944-05-21 转第 10 驱逐舰分队（Plymouth），准备 Operation Neptune。
      06-06 登陆日当天在西南航道巡逻，任务是拦截可能出击的德国驱逐舰。
      **06-09 乌尚特海战（Battle of Ushant / Ile de Batz）**：
      与 HMS Tartar / Ashanti / Eskimo / Haida / Huron / Javelin
      及 ORP Błyskawica 一起拦截德国第 8 驱逐舰分队，
      结果 ZH1 被击沉、Z32 搁浅报废、Z24 与 T24 带伤退回 Brest。
      这是德国大型水面舰在西欧水域的最后一次进攻行动。
      **06-13 泽西海战**：与 HMS Ashanti 一起攻击德国第 24 扫雷分队的
      7 艘 M-1 型扫雷舰，本舰 00:38 在约 3.5 km 距离开火、10 分钟后
      实施鱼雷攻击，战斗中本舰被命中两次、4 人受伤，艏部弹药库起火
      被舰员扑灭。德方 3 艘沉没（含 M-83、M-343）。

      1944-08-12/13 在比斯开湾：随 Force 28（巡洋舰 HMS Diadem、
      驱逐舰 HMS Onslow）击沉德国破雷舰 Sperrbrecher 7（原商船 Sauerland，
      7,067 GRT）—— 由本舰发射的一条鱼雷命中舯部偏后，
      16:30 沉于 46°05.07′N 01°41.8′W。这是波兰海军水面舰在二战中
      击沉的最大一艘船，也是波兰海军记录最完整的一次鱼雷命中。
      此后在比斯开湾为法国抵抗组织运送物资与武器，并参与对岸炮台的交火。

      1945 年上半年在第 8 / 第 3 驱逐舰分队，参加本土水域最后阶段的巡逻。

  - code: P8
    title: 战后：Deadlight 与归还（1945-09 至 1955-12）
    from: 1945-09-03
    to: 1955-12-02
    note: >-
      **本片的关键是「借调期满」这件事，不是拆解本身。**

      1945-11 起参加 Operation Deadlight（处置投降的德国 U 艇），
      编在第 17 驱逐舰分队，任 B 组火炮处置舰，负责击沉那些
      拖缆断裂或自沉装药失效的艇。本舰在此期间击沉 6 艘
      （波方文献列 U-149、U-318、U-1022、U-244、U-2502、U-764）；
      英文文献另记 1945-11-28 与 HMS Onslow 共同击沉
      U-2329、U-2334、U-2335、U-2337、U-2350、U-2363 六艘 XXIII 型。
      两说所列艇号不同，并列保留。

      1945 年 5-11 月还以「应急驱逐舰」身份为丹麦、挪威、荷兰、法国的
      难民与被解放人员运送人道援助物资。

      1946-09-28 11:30 在 Harwich 降旗、退出波兰海军编制、归还英国，
      改名 HMS Noble（舷号 D165）。波兰旗下累计航程 218,000 海里，
      护航 81 个编队，是波兰海军舰艇中航程最长的一艘。

      归还后：Harwich 封存约两年 → Sheerness → 1953 年 Chatham 后备舰队
      → 曾选定改装为 16 型反潜护卫舰，未实施（一说 1950-51 年计划
      与其余四艘 N 级一起改为 18 型，因经费取消）→ 1954 年拖至 Hartlepool
      封存 → 1955-05 列入处置名单、1955-09 售予 BISCO
      → 1955-12-02 抵 Dunston on Tyne，由 Clayton & Davie Ltd. 拆解。
