ship: haruna
slices:
- code: P0
  title: 建造与竣工（1912-1915）
  from: '1912-03-16'
  to: '1915-04-19'
  note: 1912-03-16 在川崎神户开工，1915-04-19 竣工。英国维克斯提供图纸，本级是日本首型超无畏舰。
- code: P1
  title: 一战与战间（1915-1928）
  from: '1915-04-20'
  to: '1928-07-30'
  note: 服役后编入第一舰队。1920 年主炮仰角由 25 度提到 33 度。
- code: P2
  title: 第一次大改装（1928-1930）
  from: '1928-07-31'
  to: '1930-04-15'
  note: 1928-07-31 完成第一次大改装：主炮仰角提到 43 度、加装水上飞机与弹射器、拆除部分副炮。
- code: P3
  title: 第二次大改装（1930-1934）
  from: '1930-04-16'
  to: '1934-09-30'
  note: 1934-09-30 完成第二次大改装：动力换装舰本式锅炉、舰尾延长、航速提至 30.5 节。外形自此定型。
- code: P4
  title: 太平洋战争前期（1934-1942-07）
  from: '1934-10-01'
  to: '1942-07-14'
  note: 参加南方作战与中途岛（第 3 战队第 2 小队）。中途岛时未接敌。
- code: P5
  title: 所罗门战役（1942-07-1943-03）
  from: '1942-07-15'
  to: '1943-03-31'
  note: 1942-10 瓜岛炮击支援，10-13 对亨德森机场打出三式弹。1943-03 加装 25 mm 机炮。
- code: P6
  title: 中部太平洋与莱特湾（1943-04-1944-08）
  from: '1943-04-01'
  to: '1944-08-31'
  note: 马里亚纳、莱特湾海战（栗田部队）。
- code: P7
  title: 最后一年与坐底（1944-09-1945-07-28）
  from: '1944-09-01'
  to: '1945-07-28'
  note: 1945-07-28 在吴港空袭中坐底于浅水（34-15N 132-29E），舰体大半露出水面。
- code: P8
  title: 战后浮扬与解体（1945-1948）
  from: '1945-07-29'
  to: '1948-12-31'
  note: 1946 年浮扬，1946-1948 在吴港解体。
