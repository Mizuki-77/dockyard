# ============================================================================
# 状态切片：HMS Prince of Wales（威尔士亲王号，舷号 53）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立，所以放 data/slices/ 而不是 data/classes/。
#
# 本舰的分界逻辑很特殊：**它的一生只有 10 个月**（1941-01 服役至 1941-12 沉没），
# 但在这 10 个月里跨了两个战场、参加了两次决定性的战斗。
# 切片边界按「它当时处于什么状态」而不是「编入哪个舰队」来切，
# 因为它是战时紧急完工的舰，状态一直在变。
# ============================================================================
ship: prince-of-wales
slices:
  - code: P0
    title: 建造（1937-1939）
    from: 1937-01-01
    to: 1940-12-31
    note: >-
      1937-01-01 在 Cammell Laird（Birkenhead）开工，1939-05-03 下水。
      舾装期长，且服役前就遭过空袭（1940 年 8 月前后，日期三源不同）。

  - code: P1
    title: 未完工服役（1941-01-19）
    from: 1941-01-19
    to: 1941-03-30
    note: >-
      **这是本舰最关键的一个状态，也是最容易被搞错的。**

      1941-01-19 服役时的原文是 "Commissioned, incomplete, and with only
      half her crew, for trials" —— 未完工、半数舰员、仅作试航。
      首任舰长 Louis Henry Keppel Hamilton。

      对照首舰：两舰「服役 → 完工」间隔**恰好都是 71 天**，
      说明这是本级制度化的两段式流程，不是本舰特有的混乱。

  - code: P2
    title: 完工（豁免试验换来）
    from: 1941-03-31
    to: 1941-05-23
    note: >-
      1941-03-31 正式classified as completed。但这个「完工」
      **是靠豁免多项关键试验换来的，且当时武器系统尚未完全可用**
      (原文："The 'completion' was achieved by waiving various vital
      tests and before her armament was fully operational")。

      navypedia 那一格表头是 Comp（完工），不是服役 —— 别搞混。

      这段时间在斯卡帕湾进行训练与调试，并载丘吉尔赴纽芬兰
      参加《大西洋宪章》会谈（1941-08，见后续切片）。

  - code: P3
    title: 丹麦海峡（1941-05-24）
    from: 1941-05-24
    to: 1941-05-24
    note: >-
      服役仅 4 个月即投入丹麦海峡海战，是英方唯一能持续射击的主力舰。

      射击记录（ADM 234/509 Enclosure I 汇总）：18 次齐射、应发 74 发、
      实发 55 发，损失率 25.65%。击伤俾斯麦的命中里有本舰的贡献，
      其中一发击穿舰首燃油舱。

      **没继续追击的理由不是燃油。** 当天理由是战备状态
      （一门炮不能用、舰桥被打坏）。燃油要到 05-25 才成为理由，
      且那天真正缺油的是英王乔治五世号（剩 1,200 t / 32%），
      本舰的油量来源根本没记。

  - code: P4
    title: 大西洋宪章与地中海
    from: 1941-05-25
    to: 1941-11-30
    note: >-
      1941-08 载丘吉尔赴纽芬兰参加《大西洋宪章》会谈。
      随后调往地中海，参与护航与拦截任务。
      这段时间的雷达配置有争议：navypedia 记 279 + 284，
      但本舰舰长 1941-06-12 的 A 级炮术报告明写
      "No results were obtained from either Type 281 or 284 R.D.F." ——
      提到了 281，说明 navypedia 的记录不完整。

  - code: P5
    title: 远东与沉没（1941-12-10）
    from: 1941-12-01
    to: 1941-12-10
    note: >-
      与反击号同属 Z 舰队（Force Z），1941-12-10 在马来亚海域关丹附近
      被日军航空鱼雷击沉。

      **沉没是三条独立破坏链叠加，不是「鱼雷 vs 抽水泵」的二选一：**
      ① 鱼雷破口进水
      ② 螺旋桨轴旋转把舱壁「铰」穿（Garzke 2012 残骸法证的发现）
      ③ 电力丧失导致排水泵失效
      泵失效是③的下游症状，不是并列选项。

      阵亡数三说（327 / 323 / 377）。327 有两条独立来源且内部自洽
      （官兵分项减法 110−90=20、1502−1195=307 → 327），
      与编制 1,612 三处吻合；另两说均为二手转引。
