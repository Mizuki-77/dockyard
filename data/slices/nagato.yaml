# ============================================================================
# 状态切片：長門（Nagato）
# ----------------------------------------------------------------------------
# 切片只描述「这艘舰的外形与配置在某段时间里是什么样」，边界落在
# ships/nagato.yaml 里真实存在的 fact 时间窗上。
# 改这里不改数据，只是换一种分组方式；数据本身仍由 fact 的 valid 窗口决定。
#
# 长门的外形变化主线：
#   船台 → 竣工（世界第一艘 16 英寸炮战列舰）→ 1920s 小改（烟囱、弹射平台试验）
#   → 1932-33 防空换装 → 1934-36 大改装（换炮塔、加突出部、拆鱼雷管、换锅炉）
#   → 1938 加 25 mm → 1943-05 首装电探 → 1944-06 防空大增 + 电探
#   → 1944-11 拆烟囱主桅当防空炮台 → 1945-06 炮全部搬上岸 → 战后被拖去比基尼。
#
# 特别注意：**本级没有拆除主炮塔的改装**。四座双联 41 cm 从竣工到沉没一直在舰上，
# 这与伊势/日向改航空战舰、以及战后美军拆解时的处置都不一样。
# ============================================================================

ship: nagato

slices:
  - code: P0
    title: 船台建造（1917-08 至 1920-11）
    from: 1917-08-28
    to: 1920-11-24
    note: >-
      1917-08-28 在吴海军工厂开工，1919-11-09 下水。此阶段无舰体外形可看，
      只有分段合拢的船壳。值得一提的是两件与外形无关但与本舰身份有关的事：
      下水典礼由海相加藤友三郎主持、伏见宫博恭王到场；下水后即编入横须贺镇守府
      （不是建造地吴镇守府）。船台上没有留下任何改装痕迹——她是一艘「一次设计到位」的船，
      日后的所有改动都在服役期内完成。

  - code: P1
    title: 竣工原貌与 1920 年代小改（1920-11 至 1933-12）
    from: 1920-11-25
    to: 1933-12-31
    note: >-
      竣工时是本级最值得做成模型的状态：四座双联 41 cm 炮塔（前二后二，各带观察窗罩
      sighting hood）、舷侧 20 门 14 cm/50 单装炮廓炮、4 门 8 cm/40 高角炮、
      舷侧 8 具 53.3 cm 鱼雷发射管（水上 4 + 水下 4）、两座烟囱。
      1922 年在之前烟囱上加装弧形挡烟板（smoke deflector），舰尾带上一个系留气球。
      1924 年末至 1925 年 3 月在吴把前烟囱顶部改成后掠形。
      1925-08 德国 Heinkel 公司带来一套定制起飞平台，装在**二番炮塔顶上**，
      用 HD-25/HD-26 与横厂 Ro-Go 水上机做起飞试验（试飞员之一是后来办飞机厂的
      Carl Clemens Bücker）；试验后平台拆除，改型后用于古鹰级重巡。
      —— 这是本舰外形史上最奇特的一件临时装置，也是「炮塔顶当起飞甲板」这一
      1920 年代做法的原始现场。
      1932 年拆 8 cm 高角炮、换 4 座双联 12.7 cm/40 八九式 + 2 座双联 40 mm 维克斯机炮；
      1933 年夏在主桅与三番炮塔之间装吴式二号三型弹射器与折叠吊车。

  - code: P2
    title: 第一次大改装（1934-01 至 1936-01）
    from: 1934-01-01
    to: 1936-01-31
    note: >-
      吴海军工厂，1934-04-01 起正式施工，1936-01-31 完成。外形变化最大的一次：
      舰体尾部加长 9.1 m（全长 215.8 → 224.9 m）、加装防雷突出部（水线宽 29.0 → 34.6 m）、
      加装飞剪式舰首（clipper bow）、**拆除前烟囱**（只剩一座）、
      20 座原锅炉全部换掉（改为 4 座大型 + 6 座改造小型，共 10 座重油专烧）。
      武备上：8 具鱼雷发射管全部拆除；14 cm 副炮由 20 门减到 18 门（拆两个上甲板炮位）、
      仰角由 15°（一说 25°）提到 35°；四座主炮塔整体换成原本为加贺/土佐准备的新炮座，
      主炮仰角由 +30° 提到 +43°，最大射程随之从 30,000 m 增到 38,725 m，
      炮塔正面/侧面/顶盖装甲同时加强；炮座装甲同样加强。
      代价是航速从 26.5 节掉到 25 节。

  - code: P3
    title: 改装完成至莱特湾前（1936-02 至 1944-06）
    from: 1936-02-01
    to: 1944-06-26
    note: >-
      外形上这一段相对稳定，变化集中在防空与电子设备：
      1938 年拆 2 门 40 mm、加 10 座双联 25 mm（20 门）；
      1943-05-31 在吴第 4 船渠装二一号电探并加 1 座双联 25 mm（22 门）。
      1942-02-12 联合舰队旗从本舰移到大和——这件事不影响外形，但改变了她在照片里的
      旗帜与桅顶旗饰，是舰史照片断代的一个可靠依据。
      1936-02-26 二二六事件时本舰曾驶入东京湾泊于品川大井码头，主炮指向国会议事堂，
      这是她唯一一次以「对内」姿态出现在东京湾。
      1944-04-19 在 Lingga 训练时已「experiences difficulty in maintaining 24 knots」，
      即 25 节的设计航速此时已难保持。

  - code: P4
    title: 莱特湾与损伤（1944-06-27 至 1944-11-24）
    from: 1944-06-27
    to: 1944-11-24
    note: >-
      出击前最后一次大改装（1944-06-27 吴）：加二二号与一三号电探各 2 组、
      拆 2 门 14 cm、加 96 门 25 mm（16 座三联 + 10 座双联 + 28 座单装）、
      上甲板以下的舷窗全部封死、舰桥两侧中部装二式红外识别/信号装置。
      这是本舰防空火力的峰值状态，也是最常被做成模型的那个「捷号作战」涂装。
      1944-10-22 从文莱出击前，把全部三菱 F1M2 水上机移交大和——此后无舰载机，
      弹射器与吊车成了纯粹的载重。
      10-24 锡布延海受 2 发炸弹命中 + 3 近失（一说 3 发命中、瘫痪一座主炮塔），
      艇甲板那发炸坏一番锅炉舱进气口，一台主轴停转、航速掉到 22 节；
      10-25 萨马岛外舰艏再中 2 发。这两天的战损外观（撕裂的锚甲板、被毁的炮廓炮）
      与出港时判然不同，是模型做「战后返港」状态的依据。

  - code: P5
    title: 横须贺防空炮台（1944-11-25 至 1945-08-15）
    from: 1944-11-25
    to: 1945-08-15
    note: >-
      本舰外形史上最极端的一段，也是二战末日本战列舰的共同归宿里最特殊的一例。
      1944-11-25 在横须贺入渠，此后不再作为战舰使用：拆前部副炮 4 门（14 cm 16 → 12）、
      加 2 座双联 12.7 cm（4 座 → 6 座）、加 10 座三联 25 mm 并拆 1 座旧三联；
      **烟囱与主桅被拆除**以改善火炮射界；靠泊于横须贺香取（Koumi）基地栈桥，
      加施迷彩、外挂防雷网。
      1945-06-01 起更进一步：剩余的副炮、大部分高炮、一座弹射器全部搬上岸，
      高炮装到附近的仓库山（Urayama）山顶，副炮守着横须贺码头区；
      主炮仍留在舰上，炮口指向相模湾湾口，准备对登陆舰艇平射；
      测距仪与全部探照灯搬上岸装到奥须山（Okusuyama）；炮塔披上繁复的脚手架伪装，
      上甲板摆上盆栽松树与柳杉。舰员减到 1,000 人。
      1945-07-18 空袭中舰桥被 1 发 500/1000 磅通用炸弹直接命中、操舵室被毁，
      大塚少将以下 13 名军官阵亡；另 1 发在舰尾三番炮塔炮座根部爆炸；
      1 枚 11.75 英寸「Tiny Tom」火箭弹（未爆）从舰尾穿过。
      此后剩余的全部防空武器也搬上岸——到投降时，舰上已几乎没有可用的防空火力。

  - code: P6
    title: 战后移交与十字路口行动（1945-08-16 至 1946-07）
    from: 1945-08-16
    to: 1946-07-29
    note: >-
      1945-08-30 美军第三舰队人员登舰并「捕获」本舰——TROM 明写这一动作
      「symbolizes the unconditional surrender of the IJN」，即受降仪式上
      「日本海军投降」的实物象征就是这艘船。1945-09-15 从海军名册除籍。
      1946-03-18 在美军上校 W. J. Whipple 指挥、约 180 名美国舰员操纵下离开横须贺
      前往埃尼威托克：四轴只有两轴可用，最高航速 10 节。
      途中因 1945-07-18 空袭近失弹造成的破口从未修补，舰体持续进水，
      1946-03-26 前部舱室已进水约 150 吨、为保持平衡不得不向尾部反向注水 260 吨；
      03-28 拖带的酒匂号抛锚，本舰自己又爆了一台锅炉、烧光燃油，双双停在恶劣海况中。
      此后被拖到埃尼威托克抢修，5 月以 13 节航行 200 海里到比基尼。
      1946-07-01 Able 空爆试验（距爆心 1,640 码）只受中度损伤——上层建筑蒙皮起皱、
      水密门被吹脱、全舰油漆烤焦；1946-07-24 Baker 水下爆试验才是致命一击。
      1946-07-29 夜间翻覆沉没，倒扣在约 160 英尺深的水里，
      宝塔式舰桥折断但断桩仍撑着舰体。
      —— 这最后一年半的外形，与她在莱特湾时的样子已经不是同一条船。
