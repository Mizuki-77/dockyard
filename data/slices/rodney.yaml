# ============================================================================
# 状态切片：HMS Rodney（罗德尼号，舷号 29）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立，所以放 data/slices/ 而不是 data/classes/。
# 切片边界必须落在 ships/rodney.yaml 里真实存在的时间窗上：
# 切片是「给人看的标签」，数据本身仍由 fact 的 valid 窗口决定。
#
# 本舰的分界逻辑：它是「服役即老旧、被派到最苦的活」的典型 ——
# 1927 年服役时已落后于时代，二战里主要做护航与两栖支援，
# 唯一一次高光就是 1941-05-27 那一场。
# ============================================================================
ship: rodney
slices:
  - code: R0
    title: 建造与服役
    from: 1922-12-28
    to: 1927-12-06
    note: >-
      1922-12-11 订购、12-28 在 Cammell Laird（Birkenhead）开工，
      1925-12-17 由玛丽长公主掷瓶下水（掷瓶试了三次才砸碎），
      1927-12-07 在德文波特正式服役、编入大西洋舰队，首任舰长 Henry Kitson。
      **服役与「正式进入现役」是两个节点**，后者在 1928-03-28。

  - code: R1
    title: 两战之间的和平值勤
    from: 1927-12-07
    to: 1939-09-02
    note: >-
      属于大西洋舰队与本土舰队。本级设计于 1922 年，到 1930 年代后期
      已明显落后 —— 23 节航速追不上新式快速战列舰，
      三座炮塔全前置的形制在实战中制约射界。
      这段时间的改装记录见 navypedia 的逐年条目。

  - code: R2
    title: 战时护航与本土舰队
    from: 1939-09-03
    to: 1941-05-25
    note: >-
      二战爆发后主要执行护航与拦截任务。1941-05 参加追击俾斯麦，
      隶属本土舰队司令 Tovey，与英王乔治五世号同属主力。
      出击时原定赴波士顿修理，是被临时召回的。

  - code: R3
    title: 最终战（1941-05-27）
    from: 1941-05-26
    to: 1941-05-27
    note: >-
      本舰最著名的一战，也是史上首次以战列舰对战列舰发射鱼雷。
      弹药：16 英寸 378 发、6 英寸 706 发（本舰炮术战报原件）。

      炮术状态极差：X 塔在前 25 次齐射中只有 6 次能瞄准；
      结束时 A 塔右炮卡死、B 塔左炮 double loaded、B 塔中炮两发弹无药。
      4.7 英寸高炮全程未开火。

      ⚠️ 战报本身有三处瑕疵（B 塔算术差 3 发、齐射统计差 7 发、
      §2(a) 标题把齐射次数写成发数），引用时须带着。

  - code: R4
    title: 战后与拆解
    from: 1941-05-28
    to: 1948-03-26
    note: >-
      战后转入预备役。1948-03 列入报废，03-19 售予 BISCO，
      03-26 抵 Inverkeithing 拆解。
      **拆解要分这三段说，不能写成「1948 年拆解」一句话。**
