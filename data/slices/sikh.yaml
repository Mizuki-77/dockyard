# ============================================================================
# 状态切片：HMS Sikh（锡克人号，L82 → F82 → G82）
# ----------------------------------------------------------------------------
# 本舰的分片得把「1942-09-14 托布鲁克」这一条放对位置 ——
# 它既不是 1944 年，也不在的黎波里，更与圣纳泽尔突袭无关。
# 配置上的分界只有三处：1941 年初的 X 炮座换装、
# 1941-06 打 E 艇的 2-pdr、1941-08/09 的 285 雷达与 20 mm。
# ============================================================================
ship: sikh
slices:
  - code: P0
    title: 建造（1936-1938）
    from: 1936-09-24
    to: 1938-10-11
    note: >-
      1936-09-24 在 A. Stephen & Sons（Linthouse, Govan）开工，
      1937-12-17 下水。造价 337,704 英镑 5 先令。

      **本舰属 1936 年造舰计划，与其余三艘（1935 年计划）不是同一批下单。**
      naval-history 原句 "ordered from Stephens of Govan on 19th June 1936
      under the 1936 Build Programme"。

      **服役与完工相差一个月，必须分清：**
      1938-10-12 服役（早于完工），1938-11-02 完工。
      uboat.net 原句："she was completed on 2 November 1938 even though she had
      been commissioned a month earlier."

      服役时即定为该分队资深军官舰（Senior Officer's ship）。

  - code: P1
    title: 地中海分队与红海（1938-10 至 1939-12）
    from: 1938-10-12
    to: 1939-12-26
    note: >-
      服役时舷号 L82，1938-12 改为 F82，1938-12-12 抵马耳他加入
      第 1 部族驱逐舰分队。

      1938-11-15 与 11-18 两次运送罗马尼亚国王 Carol 与王储 Michael
      往返布洛涅—多佛（国事访问）；1939-02 随 Afridi 赴直布罗陀演习；
      1939-03-21 赴西班牙卡塔赫纳接运内战难民。

      1939-04 分队改称第 4 驱逐舰分队。开战时本舰与 Gurkha、Afridi、Mohawk
      在红海巡逻，随后回地中海执行护航与封锁。返回本土时因汽轮机故障
      在马耳他滞留，1939-12-26 才抵英。

  - code: P2
    title: 挪威战役与本土任务（1939-12 至 1941-01）
    from: 1939-12-27
    to: 1941-01-05
    note: >-
      1939-12-26 抵英后短暂修理，1940 年加入第 4 驱逐舰分队，
      执行反潜巡逻、舰队扫荡与护航。

      1940-04 参加挪威战役，在纳姆索斯外海几乎持续遭空袭
      （uboat.net 原话 "usually at meal times"）。
      返斯卡帕湾后受命参加 1940-05 初的挪威中部撤运，
      随第 6 驱逐舰分队在 Åndalsnes 一带装运部队。

      随后汽轮机再次故障，入 Govan 的 Alexander Stephen 船厂修理兼改装。

      此后是秋季与冬季的反入侵巡逻、北海巡逻、西部海口护航与
      本土舰队主力屏卫。有两件值得单记的事：
      ① 不列颠之战期间从福斯河护航一支东岸船队到泰晤士河，全程未遭空海攻击；
      ② 1940-10-16/17 夜，Fame 与 Ashanti 在 Whitburn 抢滩，本舰险些跟进。

  - code: P3
    title: 首次改装：X 炮座换成 4 英寸高平两用炮（1941-01 至 1941-04）
    from: 1941-01-06
    to: 1941-04-14
    note: >-
      **本舰最重要的一次火力配置变更。** 1941-01-06 与 Mashona 在出斯卡帕湾时
      相撞受损，入 Henry Robb（利斯）修理，同时改装：

      ① X 炮座的双联 4.7 英寸炮座换为双联 4 英寸高平两用炮座，
         主炮从 8 门减为 6 门；
      ② 装 286M 型雷达。

      naval-history 对这次改装的原文有一处笔误：
      "replacement of single 4.7in gun by twin 4in mounting" ——
      本级没有单装 4.7 英寸炮，应为 "twin 4.7in mounting" 之误。
      同级 Cossack、Maori 的同一改装，该站均写作
      "Twin 4.7in mounting in X position was replaced by twin 4in HA mounting"。

      1941-04-14 完成试航归队。

  - code: P4
    title: 俾斯麦、Force H 与地中海运输（1941-04 至 1941-08）
    from: 1941-04-15
    to: 1941-08-17
    note: >-
      **俾斯麦（1941-05-22/28）：** 05-22 在克莱德加入运兵船队 WS8B
      担任近程护航（同队有 Cossack、Maori、Zulu 与波兰 ORP Piorun）。
      05-26 奉命脱离船队，与 Cossack、Zulu 一并加入英王乔治五世号屏卫。

      0020/27 遭俾斯麦转向后射击，本欲转向发射鱼雷，
      但鱼雷控制军官视线被弹幕水柱遮挡，南撤。
      0218/27 对已停车的俾斯麦齐射 4 条鱼雷，**据信 1 条命中**
      —— 一次打光全部鱼雷。此后保持雷达接触至 0359/27。
      「据信 1 条命中」是来源原话，不是确认战果，两说并列。

      **此后（1941-06 至 08）：** 06-10 为胜利号航母护航（行动 Tracer）；
      06-13 前后在普利茅斯**舰桥两舷各加 1 门单装 2-pdr** 用于打 E 艇；
      随后参加 Substance、Style、Halberd（WS11X）、Callboy（10 月）等
      马耳他补给行动，隶属直布罗陀的 Force H。

  - code: P5
    title: 法尔茅斯改装（1941-08-18 至 1941-09-30）
    from: 1941-08-18
    to: 1941-09-30
    note: >-
      在法尔茅斯商业船厂改装（改装前该分队已被指定接替驻马耳他的
      第 8 驱逐舰分队，这次改装是为此做的准备）。内容：

      ① 加装 285 型炮术火控雷达（主炮用）；
      ② 加装 2 门单装 20 mm Oerlikon 用于近程防空。

      原句："Work included fit of fire control radar Type 285 and two single
      20mm Oerlikon guns for close range AA defence."
      09-20 完成试航后返克莱德，为地中海服役做准备。

  - code: P6
    title: 地中海舰队与 22 驱逐舰分队（1941-10 至 1942-09-10）
    from: 1941-10-01
    to: 1942-09-10
    note: >-
      **本舰战史最密集的一段。**

      1941-10-05 随 WS12 出航，10-07 抵直布罗陀，10-16 参加 Callboy。
      11-10 参加 Perpetual I（方舟号与鹰号运送飞机去马耳他），
      11-13 方舟号被 U-81 雷击后参与守候，11-20 护送受创的纳尔逊号返英。

      1941-12 东调地中海舰队：**12-13 邦角夜战**，与 Maori、Legion、
      荷兰 Isaac Sweers 一同击沉意大利轻巡洋舰 Alberico da Barbiano 与
      Alberto di Giussano（意方 960 人阵亡、650 人被 Cigno 救起）。
      12-17 参加第一次锡尔特湾海战，12-19 抵亚历山大。

      1942 年：MF2（01-05）、MF3（01-18，Gurkha 被 U-133 击沉）、
      MF5（02-13/15，Rowallan Castle 事件）→ 04/05 月海法与东地中海护航 →
      VIGOROUS（06-12/15，行动中止）→ 06-30 起支援叙利亚陆上作战，
      并参与救援被 U-372 击沉的潜艇供应舰 Medway →
      **08-04 与 Zulu、Croome、Tetcott 及 RAF 221 中队一架飞机
      分享击沉 U-372 的战果** → 08-11 参加 PEDESTAL 期间的 MG3 佯动。

      09-11 搭载皇家海军陆战队分队，为托布鲁克突袭做准备。

  - code: P7
    title: 托布鲁克突袭与沉没（1942-09-11 至 1942-09-14）
    from: 1942-09-11
    to: 1942-09-14
    note: >-
      **这是本舰的终点，也是本组最容易被讲错的一条 ——
      1942-09-14，托布鲁克外海，德国岸防炮，不是 1944 年，不在的黎波里。**

      09-11 搭载皇家海军陆战队分队；09-12 与 Zulu、Aldenham、Beaufort、
      Exmoor、Hurworth 一同航向托布鲁克（Operation Agreement）。

      09-13/14 夜用小艇接运部队时，0505 被岸上探照灯照住，岸防炮开火。
      六发 88 mm 炮弹造成致命损伤：
      ① 齿轮舱 —— 润滑供油与操舵装置失效，舰以 10 节打转并持续减速；
      ② 前部 —— A 炮待发弹药架殉爆，刚登舰的陆战队员大批死伤，
         并困住更多在住舱甲板待命的人；损管队淹了 A、B 弹药库并压制火势；
      ③ 测距指挥仪 —— 此后全部火炮只能本地控制；
      ④ 拖带中命中 Y 炮座周围发射药 —— 艉部再次大火；
      ⑤ B 炮座 —— 炮组全员阵亡，其他人补位继续射击；
      ⑥ 拖带准备阶段击毁舰桥 —— 舰长 Micklethwait 当时正在前甲板
         监督拖带作业。随后又一发打断拖缆。

      Zulu 曾以舰首切入探照灯光束吸引火力、施放烟雾并两次试图靠帮接人，
      均因炮火过密被令撤离。

      舰长下令引爆破舱阀（淹没机舱与锅炉舱），做最后一次全舰巡查后离舰。
      舰体向右倾覆，在 32°05'N 24°00'E 沉没，沉没过程中仍持续中弹。
      **生还者全部被俘。**

      naval-history 该页把经度误写为 42°00'E（应为 24°00'E），
      并在同一页把「单装 4.7 英寸炮」写成 X 炮座的原始配置 ——
      两处均为转录错误，见 RESEARCH-NOTES.md。

      **阵亡数未获取**：naval-history 与 uboat.net 都只写
      "All the survivors were taken as prisoner of war"，不给阵亡数。
