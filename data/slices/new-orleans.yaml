# 状态切片 —— USS New Orleans（CA-32）
ship: new-orleans
slices:
  - code: P0
    title: 建造与服役（1931-1934）
    from: 1931-03-14
    to: 1934-02-15
    note: >-
      1931-03-14 在 New York Navy Yard（Brooklyn）开工——开工时编号仍是
      **CL-32**（轻巡），1930 年伦敦条约后才改归重巡 CA-32。
      1933-04-12 下水（掷瓶人 Cora S. Jahncke，助理海军部长之女），
      1934-02-15 服役，首任舰长 Allen B. Reed。
      建成配置与本级标准一致：3 座三联装 8"/55 Mk 9、8 座单装 5"/25
      （**Mark 19 手动炮座**，与文森斯的 Mark 23 不同）、8 挺 .50、
      2 座弹射器、4 架水上飞机、无鱼雷发射管。

  - code: P1
    title: 战前（1934-1941）
    from: 1934-02-16
    to: 1941-12-06
    note: >-
      1934 年 5–6 月北欧试航；07-05 与 Houston 会合，载罗斯福总统经巴拿马运河
      西行，并与飞艇 Macon 及其舰载机合练。此后加入 CruDiv 6，东太平洋活动；
      1939 年初加勒比冬训，1939-10-12 加入夏威夷分遣队。
      这一片基本无结构性改装。

  - code: P2
    title: 珍珠港至珊瑚海（1941-12-07 ~ 1942-05-08）
    from: 1941-12-07
    to: 1942-05-08
    note: >-
      1941-12-07 本舰正靠泊珍珠港，靠码头供电、主机在修，全舰停电，
      工程师打手电升汽，10 分钟内全部高炮（手动）开火；一枚破片弹在舷侧爆炸
      伤了数名舰员。1942-01-13 返旧金山修轮机并**加装新搜索雷达与 20 mm 炮**
      （这是本舰装 20 mm 的最早记录）。02-12 率护航队赴布里斯班，
      后编入 TF 11。05-07~08 珊瑚海：Lexington 沉没时本舰靠帮救人，
      **救起该舰 580 名舰员**并在努美阿上陆。

  - code: P3
    title: 中途岛与东所罗门（1942-05-09 ~ 1942-11-01）
    from: 1942-05-09
    to: 1942-11-01
    note: >-
      1942-05-28 出珍珠港，06-02 与约克城部队会合，06-04 参加中途岛海战；
      属 TG 16.2 的 CTU 16.2.2（Kinkaid 直辖）。07-07 出港赴斐济参加所罗门登陆，
      掩护 Saratoga；08-24~25 东所罗门海战；08-31 Saratoga 中雷后本舰护送其
      回珍珠港（09-21 到）。**本片是「纯护航」阶段，本舰未受损。**

  - code: P4
    title: 塔萨法隆加断艏与临时艏（1942-11-02 ~ 1943-03-06）
    from: 1942-11-02
    to: 1943-03-06
    note: >-
      1942-11-02 Roper 接任舰长；11-27 抵 Espiritu Santo 归入 TF 67；
      11-30 夜塔萨法隆加：本舰在旗舰 Minneapolis 之后 1,000 码，
      旗舰中雷后右满舵规避，恰撞进另一条鱼雷航迹——**鱼雷在 2 号炮塔炮座处
      切断全艏**，同时引爆旁边的航空炸弹库（160 lb 拆除装药 + 49 枚 100 lb 炸弹），
      两座前炮塔全员阵亡。断艏漂到港侧，在 frame 53/130/136 处撞出破口，
      左内桨被打坏。航速掉到 2 节，但**靠自身动力**于 12-01 拂晓驶入 Tulagi；
      用椰木临时接艏，12-12 离 Tulagi，12-24 抵悉尼换桨；
      1943-03-07 启程赴 Puget Sound，04-03 抵达。

  - code: P5
    title: 换艏大修与重返前线（1943-03-07 ~ 1944-12-31）
    from: 1943-03-07
    to: 1944-12-31
    note: >-
      Puget Sound 换新艏、修复全部战损并做大批改装；1943-08-31 返珍珠港。
      10-05~06 炮击威克岛；11-20 吉尔伯特炮击、12-04 掩护航母袭击东马绍尔
      （新 Lexington 中雷后护送其返珍珠港）。1944-01-29 起马绍尔、02-17~18
      特鲁克（编队合击沉 1 轻巡 1 驱逐 1 拖网船 1 猎潜艇）、03 卡罗琳、
      04-22 荷兰迪亚（一架失控的约克城舰载机撞上本舰主桅，1 人阵亡）、
      06-15~16 塞班、06-19~20 菲律宾海、09 帕劳/博宁、10 莱特湾（恩加尼奥角）。
      **本片外形变化最大：1943 年底拆指挥塔、1.1"/75 换 6 座四联装 40 mm、
      加 SG/SK/Mk 4 雷达。**

  - code: P6
    title: 末期与战后（1945-01-01 ~ 1959-09-22）
    from: 1945-01-01
    to: 1959-09-22
    note: >-
      1945-01 经 Ulithi 备战明多洛；1945-04-18 返 Ulithi，04-20 出航，
      04-23 抵冲绳做 direct gunfire support，与岸炮对射近两个月。
      战争结束时在 Subic 湾。1945-08-28 随巡洋-驱逐编队赴华韩：
      在青岛监管日舰、撤离盟军战俘、掩护在华韩登陆；
      11-17 自 Peking River 河口载老兵返美，12-08 抵旧金山。
      1946-01 关岛、经巴拿马运河访同名城市，1946-03-12 抵 Philadelphia；
      **1945-03 前已拆左舷弹射器（仅存 1 座）**。
      1947-02-10 退役；1959-03-01 除名；1959-09-22 售予 Baltimore 的
      Boston Metals 拆解。
