# 胡德号状态切片
#
# 与同级的俾斯麦号（九个月、七刀）不同，胡德号是二十二年、五刀。
# 它的一生不是「打了哪些仗」，而是「每次进坞出来就变了样」——
# 1918 年下水时是一艘战巡，1931 年出坞时是另一种东西，1941 年又是第三种。
#
# 切片只对某一艘舰成立，不能从舰级继承：同级另外三艘一艘都没建成。
ship: hood
slices:
  - code: H0
    title: 建成与试航
    from: 1920-03-29
    to: 1920-12-31
    note: >
      1920-03-29 服役，当时舰员 967 人。
      04-15 至 05-06 做倾斜试验、Spotting Top 装 15 英尺测距仪、
      拆除主上桅、在 A、B 炮塔顶加装起飞平台。
      这一年的胡德号还没有任何雷达、没有高射炮——它是一艘纯一战思维的船。

  - code: H1
    title: 帝国巡游与战间常态
    from: 1921-01-01
    to: 1929-06-02
    note: >
      1923-11-27 至 1924-09-28 的「帝国巡游」（Cruise of the Special Service Squadron）
      是它成为「The Mighty Hood」的直接原因：作为核心舰环绕世界，
      在每个自治领港口接受朝拜。这八年它基本是和平状态的展示舰。
      0.5 英寸机枪尚未装、高炮仍只有旧式 4 英寸单管。

  - code: H2
    title: 大改装后
    from: 1931-03-10
    to: 1939-01-22
    note: >
      1929-06-03 至 1931-03-10 在朴茨茅斯的大改装是它一生最重要的一次变化：
      加装防雷鼓包（最大宽 31.7 → 32.0 m、水下防护纵深改善）、
      油舱扩容至 4,615 t、加装两座八联 pom-pom、
      加装 F-IV-H 弹射器与水机（1932 年中拆）、
      拆除鱼雷火控台、15 英寸备弹从 4,341 发压缩至约 944 发（省 203 t）。
      副炮仍是 12 门 5.5 英寸单装。
      1936-1939 年在地中海服役期间涂装是 507C 浅灰——
      **模型制作者最常在这里画错**，那是浅灰不是深灰。

  - code: H3
    title: 战时状态（最后一次进坞之后）
    from: 1939-01-23
    to: 1941-05-21
    note: >
      1939-01-23 至 08-12 在朴茨茅斯的改装把 4 英寸单管换成四座双联
      Mk XVI，修了汽轮机与外底。1939-06-02 重新服役，
      任本土舰队战列巡洋舰分队旗舰。
      1940-05 拆除全部 12 门 5.5 英寸副炮（换取 4 英寸高炮安装空间）；
      1940 年内加装 5 座 UP 火箭发射器与 3 座双联 4 英寸；
      1941-01-16 至 03-17 在 Rosyth 加装 Type 284 与 Type 279M 雷达，
      **为此拆掉了前上桅**（它挡住 284 天线旋转），并更换右舷汽轮机叶片。
      涂装回到本土舰队的 AP507B / 507A 深灰单色。

  - code: H4
    title: 莱茵演习出击与沉没
    from: 1941-05-22
    to: 1941-05-24
    note: >
      1941-05-22 23:56 与威尔士亲王号及护航驱逐舰起锚，
      0050 通过斯卡帕湾的 Hoxa 门。
      05-12 是最后一次记录涂装（深灰单色）。
      05-24 05:52½ 开火（打的是欧根亲王号），
      约 06:00 艉部弹药库爆炸、不到三分钟内断为两截沉没，
      1,418 名在舰人员只有 3 人生还。
