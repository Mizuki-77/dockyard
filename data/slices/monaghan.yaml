ship: monaghan
slices:
- code: P0
  title: 建造与服役（1933-1935）
  from: '1933-11-21'
  to: '1935-07-19'
  note: 1933-11-21 在 Boston 开工，1935-01-09 下水，1935-07-19 服役。法拉格特级，两根烟囱。
- code: P1
  title: 战前与开战（1935-07-1941-12）
  from: '1935-07-20'
  to: '1941-12-07'
  note: 1941-12-07 珍珠港事件中出港追击日军潜艇。
- code: P2
  title: 中途岛（1941-12-08-1942-06-13）
  from: '1941-12-08'
  to: '1942-06-13'
  note: 中途岛时属 DesRon 1，护卫企业号。
- code: P3
  title: 所罗门至台风（1942-06-14-1944-12-18）
  from: '1942-06-14'
  to: '1944-12-18'
  note: 1944-12-18 在台风「眼镜蛇」中沉没。**这是海损，不是战沉。**
