# 大黄蜂 状态切片
ship: hornet
slices:
  - code: N0
    title: 建成至开战
    from: 1941-10-20
    to: 1942-04-01
    note: >-
      服役状态。**5"/38 是 Mk 24 Mod 2 炮架**（两艘姊姊舰是 Mk 21 Mod 16），
      **Mk 37 射击指挥仪**（姊姊舰是 Mk 33）。
      **没有 CXAM，只有 SC**。1.1"/75 四联装 4 座 + 20mm 若干。无 40mm。

  - code: N1
    title: 杜立特空袭
    from: 1942-04-02
    to: 1942-04-25
    note: >-
      1942-04-18：16 架 B-25 从大黄蜂甲板起飞空袭东京。
      这是 B-25 第一次、也是唯一一次从航母起飞执行作战任务。
      甲板上塞满陆军的双发轰炸机，本舰自己的舰载机全部留在珍珠港。

  - code: N2
    title: 中途岛
    from: 1942-05-28
    to: 1942-06-13
    note: >-
      与第 16 特混舰队出击（斯普鲁恩斯旗舰企业号，大黄蜂同队）。
      6-04 上午航空队出动但攻击航线偏离，错过了第一轮攻击日军航母的机会。
      **这是中途岛战役里大黄蜂航空队表现受争议的地方**——
      它的俯冲轰炸机队与鱼雷机队多数没找到目标，鱼雷机队 15 架全灭。
      本舰全程无损伤。

  - code: N3
    title: 圣克鲁斯·战没
    from: 1942-10-26
    to: 1942-10-27
    note: >-
      1942-10-26 圣克鲁斯海战：被日军舰载机重创
      （多次命中、一门 5"/38 炮位被炸、舰体倾斜、失去动力）。
      弃舰后被己方驱逐舰（Mustin、Anderson 等）雷击处分，10-27 沉没。
      沉没坐标各来源差 9 个经度，雷击时刻两口径差 2 小时 03 分。
