# ============================================================================
# 状态切片：HMS King George V（英王乔治五世号，舷号 41）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立（同级舰的改装节奏不同，边界不能继承），
# 所以放在 data/slices/ 而不是 data/classes/。
#
# 切片的边界必须落在 data/ships/king-george-v.yaml 里真实存在的时间窗上：
# 切片是"给人看的标签"，数据本身仍由 fact 的 valid 窗口决定。
# 改这里不会改数据，只是换一种分组方式。
#
# 与提尔皮茨号的根本区别：KGV 是"有航速、有编队、有炮战"的主力舰，
# 它的分界不是"改了什么装"，而是"在哪片海、归哪个舰队、打了什么"。
# 改装只是穿插在两次部署之间的休整期。
# ============================================================================

ship: king-george-v

slices:
  - code: K00
    title: 订购与建造
    from: 1936-07-29
    to: 1936-12-31
    note: >-
      1936-07-29 订购；1937-01-01 开工；承造 Vickers-Armstrong, Walker Navy Yard（维克斯-阿姆斯特朗，沃克海军船厂）（Newcastle-upon-Tyne）；1939-02-21 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: K0
    title: 建造与舾装
    from: 1937-01-01
    to: 1940-09-30
    note: >-
      1937-01-01 在 Walker Navy Yard 开工，1939-02-21 由英王乔治六世掷瓶下水。
      舾装期近 20 个月；1940-10-01 服役时仍未完工，随后赴 Rosyth 装外侧螺旋桨、
      加强舵、完成武备与雷达。设计武装为 10 门 14 英寸、16 门 5.25 英寸、
      4 座八联 2-pdr 与 4 座 UP；0.5 英寸机枪方案在 1939 年即被 2-pdr 取代，从未装舰。

  - code: K1
    title: 试航与加入本土舰队
    from: 1940-10-01
    to: 1941-03-31
    note: >-
      1940-10-01 服役（for trials），舷号 41；1940-12-11 加入本土舰队，
      以 Scapa Flow 为主要基地。1941-01-15~25 送 Halifax 赴美就任大使并护航返程；
      1941-03-02~06 为 Claymore 突袭罗弗敦群岛提供掩护。雷达为 Type 279 + 284；
      载 2 架 Walrus（带 ASV 11N）；编制约 1,422 人。涂装资料只到"本土舰队整体中灰
      （507B）"，无一手涂装命令，具体色号标 C。

  - code: K2
    title: 本土舰队旗舰与丹麦海峡
    from: 1941-04-01
    to: 1941-12-31
    note: >-
      1941-04-01 起任本土舰队旗舰（Tovey 上将）。1941-05-22~27 参加追击俾斯麦：
      05-27 08:48 于 24,600 码开火，A/B/Y 炮塔故障导致部分齐射只有 1–2 门能打；
      Patterson 战报记 14 英寸 339 发、5.25 英寸 600 发（Tovey 战报为 660 发）。
      战后因缺油几乎必须离场——纸面续航不可当作战半径。
      1941-10 参加 EJ 行动（掩护 Victorious 袭击挪威沿岸航运），12 月为 Vaagso 突袭提供海上掩护。
      1941 年末改装：拆 4 座 UP，加 1 座八联 + 1 座四联 2-pdr、18 门 20 mm 单装，
      加装 Type 271、273 与 5 台 282。

  - code: K3
    title: 北极护航与 Punjabi 碰撞
    from: 1942-01-01
    to: 1942-12-31
    note: >-
      为北极护航编队提供远程掩护。1942-05-01 在雾中撞沉驱逐舰 Punjabi，
      舰艏被炸掉约 40 英尺（Punjabi 的深水炸弹爆炸所致），赴利物浦修理至 7 月，
      随后返回 Scapa Flow。1942 年中加装 4 台 Type 285 火控雷达。
      这一年的主炮可靠性问题已在实战中暴露，但未见系统整改记录。

  - code: K4
    title: 地中海与 Force H
    from: 1943-01-01
    to: 1943-10-31
    note: >-
      1943-05 起与 Howe 一同临时配属 Force H，支援 Husky（西西里登陆）。
      1943-07-12 炮击 Trapani 与 Levanzo 岛 Favigana；1943-09-09 参加 Slapstick
      （Taranto 登陆）。1943-05 加 20 门 20 mm 单装，累计 38 门；2-pdr 为
      5 座八联 + 1 座四联。1943-10 返回 Scapa Flow。

  - code: K5
    title: 利物浦大改装
    from: 1943-11-01
    to: 1944-06-30
    note: >-
      1943-12~1944-01 赴直布罗陀接丘吉尔（开罗/德黑兰会议后）。1944-02~06 在利物浦改装：
      拆除弹射器与水机，原位改建上层建筑安置小艇；拆 1 座四联 2-pdr 与 12 门 20 mm 单装，
      加 3 座八联 2-pdr、6 座双联 20 mm、2 座四联美制 40 mm Bofors；雷达换 277、279B、
      2 台 282、285、293。**弹射器拆除时点两说**：tyne 记 1943 年，navypedia 挂在 7/1944
      条目；以改装完成 1944-07 为界。

  - code: K6
    title: 太平洋与 BPF / TF 57
    from: 1944-07-01
    to: 1945-09-02
    note: >-
      1944-10-28 至 12-15 驶往锡兰 Trincomalee，加入英国太平洋舰队，升 Rawlings 少将旗；
      11 月途经亚历山大港时炮击爱琴海 Milos 的 Lakida 炮台。1945-01~02 赴悉尼，
      途中完成首次海上加油（12 小时）。1945-03 编入美军太平洋舰队参加 Iceberg（冲绳），
      03-20 改称 TF 57。1945-07-29 炮击本州南部滨松：23:19 开始、射程 20,075 码、
      发射 265 发 14 英寸弹（仅 7 发命中），23:56 停止——这是本舰最后一次对敌开火。
      1945-09-02 在东京湾为投降签字式提供座椅。终态武备：8 座八联 2-pdr、
      24 门单装 + 6 座双联 20 mm、2 座四联美制 + 2 门单装英制 40 mm。

  - code: K7
    title: 战后、预备役与拆解
    from: 1945-09-03
    to: 1958-12-31
    note: >-
      1946-03-02 返朴茨茅斯，任本土舰队总司令旗舰；1946-12 在 Devonport 改装；
      1947-11 起任波特兰训练战列舰；1949-07 海军部宣布本级转入预备役；
      1950-06 拖往 Gareloch 封存（cocooned），与 Anson、Duke of York 同泊。
      1957-04 批准拆解，1957-12-17 从海军名册除籍；1958 年由 Arnott Young & Co
      在 Dalmuir 拆解，舰体拖至 Troon 拆完。
