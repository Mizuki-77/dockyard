# ============================================================================
# 状态切片：Illustrious（光辉号，87）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立（同级舰的改装节奏不同，边界不能继承），
# 所以放在 data/slices/ 而不是 data/classes/。
#
# 切片的边界必须落在 data/ships/illustrious.yaml 里真实存在的时间窗上：
# 切片是"给人看的标签"，数据本身仍由 fact 的 valid 窗口决定。
# 改这里不会改数据，只是换一种分组方式。
#
# 本舰的一生可以粗分成「三段半」：
#   1940–41 地中海：打塔兰托、挨了六弹，然后去美国大修；
#   1942–44 印度洋与地中海：改装、再改装，机群从 Swordfish 换到 Corsair；
#   1945 太平洋：TF 57，神风近失，带伤返英；
#   战后七年：试飞与训练航母，最后 1957 年拆解。
#
# 每一段都注明四项最容易变的东西：雷达、涂装、飞行甲板/弹射器、防空配置。
# 查不到的写「未获取」，不拿相邻时段的色号或配置顶上。
# ============================================================================

ship: illustrious

slices:
  - code: I00
    title: 订购与建造
    from: 1936-07-08
    to: 1940-05-24
    note: >-
      1937-04-27 开工；承造 Vickers-Armstrong, Barrow（维克斯-阿姆斯特朗，巴罗船厂）（Barrow-in-Furness）；1939-04-05 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: I0
    title: 建成与试航
    from: 1940-05-25
    to: 1940-08-14
    note: >-
      1940-05-25 建成（另一说 1940-04-16 已接舰服役，口径不同），
      随后在 Bermuda 试航、working up，1940-07-23 完成、07-26 返本土。
      此时配置：8 座双联 4.5 in、6 座八联 pom-pom、无 20 mm；
      雷达为 Type 79Z（世界第一艘完工前即装雷达的航母，天线是临时后桅杆）；
      机库系留位 33 个，飞行甲板可用长度仅 190 m（620 ft，首尾 round-down 压缩）；
      1 部 BH-III 液压弹射器、6 道拦阻索；
      涂装色号**未获取**。同级唯一没有舰桥前两道应急拦阻索的就是本舰。

  - code: I1
    title: 地中海：Hats、Benghazi 与塔兰托
    from: 1940-08-15
    to: 1941-01-09
    note: >-
      1940-08-15 抵 Scapa Flow，成为 Lyster 少将旗舰；08-22 赴 Gibraltar（Operation Hats）。
      09-03 袭击 Rhodes 水上飞机基地、09-16/17 夜袭 Benghazi；
      10-18 前部机库意外火灾，2 架报废、3 架重损。
      1940-11-11/12 塔兰托夜袭：两波共 21 架可用 Swordfish，
      以 2 架损失换 3 艘意战列舰（Littorio 3 雷、Cavour 1 雷坐底、Duilio 1 雷）。
      搭载 41 架特编机群（Fulmar / Swordfish / Sea Gladiator）；
      雷达仍为 Type 79Z，无 285 炮术雷达；**塔兰托当夜涂装色号未获取**。

  - code: I2
    title: 马耳他战损与一年修理
    from: 1941-01-10
    to: 1941-12-31
    note: >-
      1941-01-10 Operation Excess：X. Fliegerkorps 五波空袭，中 6 弹 + 多枚近失，
      一枚 2,200 lb 弹打穿 3 in 飞行甲板在机库内爆炸；机库 9 架 Swordfish + 4 架 Fulmar 烧毁，
      但炸弹与鱼雷未殉爆、主机械无损，船自行驶入马耳他。
      01-16 在马耳他再中一弹（穿透后升降机之后的甲板）；01-23 无飞机状态下撤往 Alexandria。
      涂装：此时为 MS4a 覆盖在整体 B6 之上、甲板 507A、标记暗黄（唯一有据的涂装时点）。
      伤亡两说：初步电文 83 死 / 60 重伤，事后统计 126 死 / 91 伤。
      05-12 抵 Norfolk 大修：换后升降机、弹射器改为可弹美制飞机、加 Type 285 炮术雷达、
      加 10 门单装 20 mm Oerlikon；12 月返英途中与 Formidable 相撞，年底进 Cammell Laird 修理。

  - code: I3
    title: 印度洋：Ironclad、Stab 与东方舰队
    from: 1942-01-01
    to: 1943-01-12
    note: >-
      1942-01 以 Type 281 换掉 Type 79Z（281M / 281B 两说并存）。
      03-23 出航印度洋，载 21 Swordfish + 9 Martlet II + 6 Martlet I + 2 Fulmar；
      04-02 机库火灾毁 11 架、死 1 人，在 Freetown 修理并补 12 架 Martlet II，总载机达 47。
      05-05 Ironclad（马达加斯加）、08 Stab（安达曼佯动）、09 Stream/Line/Jane。
      涂装色号**未获取**（1942 年印度洋阶段无原文）。
      飞行甲板仍为短甲板状态（1941 年削平尾部 round-down 后约 204.2 m，此值仅见线索级来源）。

  - code: I4
    title: 本土改装与地中海（Salerno）
    from: 1943-01-13
    to: 1944-01-27
    note: >-
      1943-02-26 至 06-07 在 Birkenhead 改装：飞行甲板延长、换雷达、
      轻防空加强、后升降机之后加两道拦阻索（拦阻索 6 → 8）。
      雷达换为 Type 79B + 272 + 281B + 6 × 282 + 285；20 mm 大量加装为双联。
      1943-07 加入 Home Fleet，07-26 Operation Governor（挪威海）；
      08 赴地中海编入 Force H，09 支援 Salerno（意军未攻击）。
      1943-11 飞行甲板可用长度到 225.7 m（740 ft）。
      1943-10 返英短期改装，11-27 上载 Barracuda，Corsair 中队随后上舰。
      涂装色号**未获取**（1943 年地中海阶段无原文）。

  - code: I5
    title: 东方舰队：Sabang、苏门答腊与 57 架
    from: 1944-01-28
    to: 1945-03-25
    note: >-
      1944-01-28 抵 Ceylon；02 在 Trincomalee 与 Saratoga 合练，
      **尚未改刷东方舰队涂装**（这是反证，不是色号）。
      05-17 袭击 Soerabaja 炼油厂（18 Avenger + 16 Corsair）；
      06 Operation Councillor 作诱饵；07 Sabang 炮击掩护 / Operation Pedal：
      载 57 架、一度 53 架同时在空，回收耗时一小时——「operating at the edge of her capacity」。
      07-30 赴 Durban 改装（08-15 至 10-10）；10 月改装：减 1 座八联 pom-pom、
      加 3 门单装 40 mm Bofors、加 20 mm 双联/单装若干（累计数口径有分歧）。
      12-20 Belawan Deli（载 53 架）；1945-01-04 再击另一炼油厂。
      涂装色号**未获取**。

  - code: I6
    title: 太平洋：TF 57 与神风
    from: 1945-03-26
    to: 1945-05-14
    note: >-
      Iceberg I：载 36 Corsair + 16 Avenger（另有 2 架 Walrus 的线索）。
      1945-04-06 下午 4 架神风突破 CAP，一架 D4Y3「Judy」大角度俯冲，
      被舰岛前部 Bofors 打断左翼，未撞上舰，但右翼尖击碎舰桥前 Type 272 雷达罩；
      所携 1,000 kg 炸弹在离舷 50 ft 水中爆炸，冲击波损毁甲板 2 架 Corsair。
      04-08 由 Formidable 接替；04-16 抵 San Pedro Bay，潜水员发现外板开裂、横肋骨断裂；
      05-03 赴 Sydney，05-14 抵，10 天后离港返 Rosyth 永久修理。
      这是本级「装甲甲板救了船、但船体结构已经疲劳」的典型样本。
      **1945 年 BPF 涂装色号未获取。**

  - code: I7
    title: 战后：试飞与训练航母
    from: 1945-05-15
    to: 1955-02-28
    note: >-
      1945-08 后改为 Home Fleet 试飞与训练航母（trials and training carrier）。
      1946-06-24 试航，试飞 Firefly FR.4 / Firebrand TF.4 / Sea Mosquito / Sea Vampire；
      1946 年中换更强力弹射器（型号未获取）、航空汽油增载 30%、飞行甲板两端重建扩大可用面积。
      1948-01 至 08 改装，9 月初重新服役；1949 恢复试飞；1951 参加 NATO Main Brace 演习。
      1954-12-10 起进 Devonport 最后维修期。
      16 ft 机库在这一段成为致命短板：战后喷气机装不进去，同级 Essex 靠 17 ft 6 in 一路改到越战。

  - code: I8
    title: 退役与拆解
    from: 1955-03-01
    to: 1957-12-31
    note: >-
      1955-02 底退役（paid off）；1956-11 除籍（navypedia 记 stricken 11.1956，
      另说 1956-11-03 出售）；1957 年初拆解。退役与拆解的具体日期只有线索级来源，
      本切片到 1957 年底为止，是为了把「已拆解」这个结局纳入时间轴，不是精确日期。
