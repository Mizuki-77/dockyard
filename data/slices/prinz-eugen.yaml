# ============================================================================
# 状态切片：Prinz Eugen（欧根亲王号）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立，所以放 data/slices/ 而不是 data/classes/。
#
# 本舰的一生跨度很长（1940 服役 → 1946 倾覆），而且横跨三种身份：
# 德国海军重巡 → 美国战利品 → 核试验靶船 → 夸贾林的沉船。
# 切片按这三段身份变化来切，不是按德国海军编制。
# ============================================================================
ship: prinz-eugen
slices:
  - code: E00
    title: 订购与建造
    from: 1935-11-16
    to: 1936-04-22
    note: >-
      1935-11-16 订购；1936-04-23 开工；承造 Krupp Germaniawerft（Kiel）；1938-08-22 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: E0
    title: 建造（1936-1940）
    from: 1936-04-23
    to: 1940-07-31
    note: >-
      1935-11-16 签订建造合同；1936-04-23 在基尔的 Krupp Germaniawerft
      开工（船台 2，建造编号 G 564）；1938-08-22 下水，
      由匈牙利摄政霍尔蒂的妻子 Magda von Horthy 掷瓶
      （下水日另有 DANFS 记 08-20，两说并列）。

      **服役前就两次被炸**：1940-07 服役前夕，本舰在基尔船厂
      被英国炸弹命中两次。

  - code: E1
    title: 服役与丹麦海峡（1940-08 至 1941-05）
    from: 1940-08-01
    to: 1941-05-24
    note: >-
      1940-08-01 服役，首任舰长 Helmuth Brinkmann。

      1941-05 与俾斯麦一同出击（莱茵演习）。它是俾斯麦唯一的僚舰，
      在编队前方。

      ⚠️ 两舰涂装都容易搞混：1941 年 5 月两舰都刷过波罗的海条纹迷彩，
      5-21 前后又涂掉了。不要把条纹特征只归给俾斯麦。

  - code: E2
    title: 丹麦海峡（1941-05-24）
    from: 1941-05-24
    to: 1941-05-24
    note: >-
      本舰参与对胡德号与威尔士亲王号的炮击。

      **弹数三说**（157 / 179 / 183），来源互相矛盾且各有档案依据，
      本站不裁决。

      **一雷未发**，而且这不是装备故障：OKM 专门出了调查文件，
      结论是鱼雷官训练不足 + 火控雷达分配不当。
      中文资料普遍漏掉这一条。

      ⚠️ 时间基准：本舰战争日志正文用 DSZ（UTC+2），
      而 Jasper 炮术报告用 MEZ（UTC+1），差整 1 小时。
      引用 Jasper 的「0455 开火／0509 停火」必须 +1 小时换算。

  - code: E3
    title: 布列斯特与瑟布鲁斯行动（1941-06 至 1942-02）
    from: 1941-06-01
    to: 1942-02-28
    note: >-
      丹麦海峡后转往法国布列斯特。

      **1941-07-02 在布列斯特的干船坞被英军空袭炸中，60 人死亡（含副舰长）。**
      ⚠️ 常见错误说法是「1942 年瑟堡空袭受损」—— 地点和时间都不对。

      1942-02 参加瑟布鲁斯行动（Channel Dash），与沙恩霍斯特号、
      格奈森瑙号一同从布列斯特穿越英吉利海峡返回德国。

  - code: E4
    title: 挪威与波罗的海（1942-03 至 1945-05）
    from: 1942-03-01
    to: 1945-05-08
    note: >-
      返回德国后主要在挪威与波罗的海活动，执行护航与炮击支援。
      战争后期用于掩护东普鲁士的撤退。
      1945-05 向英国投降。

  - code: E5
    title: 战后：战利品与靶船（1945-05 至 1946-12）
    from: 1945-05-09
    to: 1946-12-22
    note: >-
      1945-05 移交美国。1946 年被选为比基尼环礁核试验
      （Operation Crossroads）靶船，经历 ABLE 与 BAKER 两次试验均未沉。

      **1946-12-22 倾覆于夸贾林环礁的 Enubuj 礁**，四源一致。
      ⚠️ 常见错误说法是「1960 年代倾覆」—— 大约是与 1978 年
      拆螺旋桨的事混了。

      残骸至今仍在原处，是潜水点。
