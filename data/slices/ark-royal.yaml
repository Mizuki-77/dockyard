# ============================================================================
# 状态切片：HMS Ark Royal（皇家方舟号，舷号 91）
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立，所以放 slices/ 而不是 classes/。
#
# 本舰只有三年生涯（1938-11 服役至 1941-11 沉没），而在这三年里它的
# **船体尺寸和装甲方案一次都没变过** —— 没有大改装、没有换动力。
# 真正在变的是三样东西：防空炮（1941-05 加两座 pom-pom）、
# 舰载机编制（Skua/Roc/Swordfish → Fulmar/Swordfish）、以及它在哪个建制下。
# 所以切片边界按「作战状态与舰载机编制」切，而不是按「改了什么结构」切。
#
# 边界都落在本舰日期范围内（1938-11-16 至 1941-11-14）。
# ============================================================================
ship: ark-royal
slices:
  - code: P0
    title: 建造与服役（1935-1938）
    from: 1935-09-16
    to: 1938-11-15
    note: >-
      1935-09-16 在 Cammell Laird（Birkenhead）开工，船台号 1012；
      1937-04-13 下水；1938-11-16 服役。造价 £3.215M。

      **服役日期两说并列，不裁决**：navypedia / naval-history / FAA Archive
      都记 1938-11-16（建成/服役），uboat.net 类页记 1938-12-16。

      建成即有的、此后未变的特征：双层贯通机库（上层 173.1 m、下层 137.8 m，
      各 18.3 × 4.9 m）、三部双层平台升降机、飞行甲板两端各一部弹射器
      （12,000 lb / 66 kt）、8 座双联 4.5 in、4 座八联 pom-pom、
      8 座四联 12.7 mm、4 门 3-pdr 礼炮、两台吊车。

  - code: P1
    title: 服役首年：本土舰队与南大西洋（1938-11 至 1940-03）
    from: 1938-11-16
    to: 1940-03-31
    note: >-
      第一年以训练与反潜/反袭击舰巡逻为主。1939-09-14 遭遇 U-39 三雷齐射，
      **三枚鱼雷全部提前爆炸**（磁性引信故障），英舰无恙；
      三艘护航驱逐舰随即反潜，U-39 被击沉、全体 43 人被俘 ——
      这是二战中第一艘被击沉的 U 艇。Able Seaman 级别的目视瞭望
      （Leading Signalman Joseph Ernest Hall）是这一次躲开的关键。

      1939-09 编成：800 中队 Skua、803 中队 Skua/Roc、
      810/818/820/821 中队 Swordfish。1939-09-26 803 中队击落一架 Do 18，
      是皇家海军舰载战斗机在二战中的首个战果。

      1939-10 至 1940-02 在南大西洋与印度洋搜索德国袭击舰与商船，
      期间参与对 GRAF SPEE 的间接施压（英方刻意营造「航母正在赶来」的假象）。
      1940-02 至 03 在 Portsmouth 短期改装，加装消磁线圈（degaussing）。

  - code: P2
    title: 挪威战役（1940-04 至 1940-06）
    from: 1940-04-01
    to: 1940-06-30
    note: >-
      **本舰战果最集中的一段，也是最容易被记错的一段。**

      1940-04-10 桑克德国轻巡 KÖNIGSBERG：这一击不是本舰在挪威外海放飞的 ——
      800 与 803 中队当时被留在岸上（Hatston），由岸基 Skua 执行，
      三弹命中、引爆弹药库、把舰炸成两截，只损失一架 Skua。
      **这是史上第一次由空袭击沉一艘主要战舰。**
      说法上要写清「本舰的飞机」而不是「本舰」，
      因为当时本舰还在从地中海返航的路上。

      1940-04-23 起在挪威海域与 GLORIOUS 编组（Operation DX，
      皇家海军史上第一个航母特混编队）。4-5 月间 Skua 承担战斗机巡逻，
      Swordfish 打铁路与隧道（Nordalsbroen / Hundalen / Sildvik）。

      1940-06-13 攻击 Trondheim 的 SCHARNHORST：15 架 Skua 各挂 500 lb SAP，
      撞上 II./JG 77 的 Bf109 与 I./ZG 76 的 Bf110 拦截，**损失 8 架**（一说 8，
      年表逐架列出 8 架）——「几乎打光一个中队」。
      战果判定上有一处必须并列的差异：英方当时判两弹命中，
      事后核对实际只有一弹命中且**未爆炸**。

      这一段的编制是 Skua / Roc / Swordfish 混编，
      没有战斗机掩护能力（Skua 时速 225 mph，Roc 更慢）。

  - code: P3
    title: Force H 与西地中海（1940-07 至 1940-12）
    from: 1940-07-01
    to: 1940-12-31
    note: >-
      1940-06 末调入 Force H（直布罗陀），此后半年是它战历最密的一段。

      **1940-07-03 米尔斯克比尔（Operation CATAPULT）**：本舰当日不在炮战队列里，
      它的任务是侦察、校射、以及**用 Swordfish 挂磁性水雷封锁港内出口**
      （在 Mers el Kebir 与 Oran 两处各布雷）。
      炮击从 17:54 开始，BRETAGNE 弹药库殉爆、DUNKERQUE 搁浅。
      之后 818 中队 6 架 Swordfish 各挂 4 枚 250 lb SAP 攻击出港的 STRASBOURG ——
      **炸弹对 115-125 mm 甲板的战巡完全无效**，两架被击落。
      这是「用错弹药」的典型案例，年表写得很直白：
      「their bomb load was completely inadequate for attacking a ship with
      deck armour of 115 to 125mm; so any hits were likely bounce off」。

      1940-08-02 袭击 Cagliari；1940-09-23 至 25 达喀尔（Operation MENACE，
      对 RICHELIEU）；1940-11-09 袭击西西里机场（为光辉级塔兰托空袭做牵制）；
      1940-11-27 斯帕蒂文托海战（两波共 20 架 Swordfish 攻击，
      **全部鱼雷未命中**，英方当时误判为命中 VITTORIO VENETO）。

      1940-10 起换装 Fulmar（12 架），Skua 逐步退出。

  - code: P4
    title: 1941 上半年：补给、破袭与追击俾斯麦（1941-01 至 1941-06）
    from: 1941-01-01
    to: 1941-06-30
    note: >-
      1941-02-02 攻击撒丁岛 Omodeo 湖的 Santa Chiara d'Ula 水坝
      （Operation PICKET）—— 8 架 Swordfish 挂鱼雷，4 架抵达目标，
      **无一命中**，一架被击落。1941-02 至 04 在大西洋搜索 SCHARNHORST 与
      GNEISENAU（未遇）。1941-03-22 一架 Swordfish 起飞时坠毁、深水炸弹殉爆，
      本舰受损但不严重。

      **1941-05-26 是本舰一生最关键的一天**，而它当日并不在炮战战场上 ——
      它在 Force H 编成内从直布罗陀北上，距离俾斯麦很远。
      两次空袭都有记载，且都有争议：

      ① **14:50 第一波（15 架，Stewart-Moore 少校）打错了目标**。
         舰队 13:00 已令 SHEFFIELD 脱离去跟踪俾斯麦，但**这道视觉信号没有
         转发给 ARK ROYAL**，舰上不知道 SHEFFIELD 已不在编队里。
         机群靠 ASV 在「预期阵位约 20 英里外」抓到一艘船就打了 —— 那是 SHEFFIELD。
         舰长 Larcom 认出了来袭飞机，下令全速并禁止开火。
         结果：11 枚鱼雷全部落空（2 枚入水即爆、3 枚在尾迹里爆炸、其余被规避），
         14 架全部返航，三架没投雷的还发了信号「Sorry for the Kipper」。
         **SHEFFIELD 一炮未还，是 14 架飞机全部生还的直接原因。**
         事后 Maund 舰长 14:50 前曾判断「只有一艘敌舰，证据倾向于是 PRINZ EUGEN」，
         但他同时表示相信那是 BISMARCK —— 这道判断与误击的关系，
         各来源没有定论，本站并列不裁。

      ② **19:00 第二波（15 架，Coode 少校）打对了**。
         因为第一波**约 45% 的鱼雷提前爆炸**，这一波把双联磁性引信换成了
         更老但更可靠的触发引信。机群先到 SHEFFIELD 上方取得方位距离
         （19:54 得「110°，12 英里」，20:35 因天气失散后重新定位）。
         20:47 起分小队穿云攻击。**21:05，818 中队的 5C
         （Moffatt 少校）在左舷艉部命中，打坏舵机。**
         另有一到两枚可能命中。英方当晚 22:20 报「一枚确信命中舯部」，
         战后核对才确认真正致命的是艉部那一枚。

      本舰当日**不在炮战战场**这一点，与 `data/battles/last-battle.yaml`
      里「航空母舰 · Force H」的角色记录一致。

      编制：18 Fulmar + 30 Swordfish（1941-05）。

  - code: P5
    title: 马耳他补给与最后半年（1941-07 至 1941-11-13）
    from: 1941-07-01
    to: 1941-11-13
    note: >-
      这一段的主体是「Club Run」—— 从直布罗陀把战斗机运到马耳他射程内放飞，
      本舰自己不进地中海纵深。1941-06 至 11 之间跑了多趟，
      9 月 Operation HALBERD 是规模最大的一次（护航船队 + 舰队决战准备）。

      1941-09-24 至 27 的 HALBERD 期间，本舰的 Fulmar 拦阻作战强度很高：
      一天之内 CAP 从 4 架一路加到 16 架，对抗 SM 84 鱼雷机多波次攻击。
      这一段也是 807 与 808 中队宣称战果最集中的时期
      （两中队十个月内合计宣称 19 架）。

      1941-05 加装两座八联 pom-pom，座数 4 → 6（32 门 → 48 门），
      这是本舰服役期内**唯一一次防空武备变化**。

      1941-10-10 起 Operation PERPETUAL：与 ARGUS 一起运 37 架飓风去马耳他
      （实际放飞 34 架 + 4 架 Blenheim 引导机）。10-13 完成放飞后返航。
      10 月上旬 828 中队的 Albacore 短暂在舰，10-18 飞往马耳他（Hal Far）。

      **1941-11-13  15:41，位置 36°03'N, 4°45'W，被 U-81 的一枚鱼雷命中
      右舷舯部。**当日详情见 P6。

  - code: P6
    title: 中雷与沉没（1941-11-13 至 1941-11-14）
    from: 1941-11-13
    to: 1941-11-14
    note: >-
      **过程按 naval-history 的逐刻年表记，与 uboat.net 的时刻有一处冲突，
      并列不裁决。**

      13 日 15:36 U-81（Guggenberger 上尉）以 MALAYA 为瞄准点在极远距离
      齐射 4 枚 G7e 电动鱼雷（战雷头 300 kg，定深 5 m）；
      15:41 其中一枚命中 ARK ROYAL 右舷舰桥附近。
      破口涨到约 130 × 30 ft（naval-history 另处写「a hole of about 115 feet
      length」，两处数字不同，并列）。
      右舷锅炉房、空气舱、油舱、主配电板、下层操舵位置立即进水；
      右舷传动轴失效，后半舰失电、全船通信中断。

      **致命链条**：失电 → 没有柴油发电机 → 排水泵停转 → 进水不受控；
      随后海水从下层机库底下的烟道灌入另两个锅炉房；
      17:00 左舷锅炉因失去给水被迫停炉，全船彻底无电。

      16:48 LEGION 撤走 1,487 人；舰上留约 250 人继续抢救。
      拖船 THAMES 与 ST DAY 于 20:59 起以 2 节向西拖带。
      14 日 01:30 横倾开始快速增大；02:15 左舷锅炉房起火；
      04:30 横倾 35°，下令弃舰，250 人离舰（多数顺绳下到 ST DAY）；
      06:19 横倾到 45°→90°，在 90° 停留三分钟后竖立下沉；
      06:24 舰艏没入水中。
      **uboat.net 记沉没时刻为 08:13**，与上述年表冲突，并列。

      全舰阵亡 1 人：Able Seaman E Mitchell（舰上最年长的士兵，
      当时在下层操舵位置值班）。

      沉没位置两说并列：naval-history 记 2002-12 找到残骸、
      「30 NM east of Gibraltar」、深 3,500 ft，折合 36°06'35"N, 4°43'51"W；
      FAA Archive 记「45nm ESE of Gibraltar」；navypedia 记「25 miles E of
      Gibraltar」。三说距离 25/30/45 海里不一致，不裁决。

  - code: P7
    title: 沉没之后：调查与制度性后果（1942 起）
    from: 1941-11-15
    to: 1942-12-31
    note: >-
      **这一片里已经没有「舰」了，只有它的后果 —— 但必须留着。**

      事后调查认定损管处置与人员训练不足是沉没的重要成因，并据此修改了
      全部新造舰的电力与损管设计。这条调查结论的生效日期是 1942-01，
      比沉没晚两个月；若不设这一片，时间轴会停在 1941-11-14，
      「一艘舰的死改变了整个舰队的设计」这件事就没地方放。

      这是本站切片的一个刻意设定：**切片描述的是这艘舰的状态，但当它的死
      成为后续事件的起点时，那个后果也属于它的历史。** 同类先例见
      data/slices/rodney.yaml 的战后拆解片（note 里写了它对后续设计的影响）。

      本片显示「该时期无影像」是**对的** —— 船已经没了，不该有图。
      这不是配图缺失，不要来补图。
