ship: atlanta
slices:
- code: P0
  title: 建造与服役（1940-1941-12）
  from: '1940-04-22'
  to: '1941-12-24'
  note: 1940-04-22 在 Kearny 开工，1941-09-06 下水，1941-12-24 服役。主炮为 8 座双联 5"/38，共 16 门。
- code: P1
  title: 中途岛（1941-12-25-1942-06-13）
  from: '1941-12-25'
  to: '1942-06-13'
  note: 中途岛时属 TG 16.2，护卫大黄蜂。**全程未与敌接触，一炮未发**。
- code: P2
  title: 东所罗门（1942-06-14-1942-08-24）
  from: '1942-06-14'
  to: '1942-08-24'
  note: 1942-08-24 东所罗门海战，首次真正开火，参与企业号上空的防空弹幕。
- code: P3
  title: 瓜岛夜战与沉没（1942-08-25-1942-11-13）
  from: '1942-08-25'
  to: '1942-11-13'
  note: 1942-11-13 瓜岛夜战中先被日舰射击，后遭旧金山号误击，21:15 由美军自行爆破凿沉。
