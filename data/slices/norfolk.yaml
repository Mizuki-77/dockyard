# ============================================================================
# 状态切片：HMS Norfolk（诺福克号，舷号 78）
# ----------------------------------------------------------------------------
# 切片边界按「它当时处于什么状态」切，不按「编入哪个舰队」切。
# 本舰的分界逻辑：**五轮改装是它一生的骨架**（1940-04、1941-07、1942-02、
# 1943-04、1944-02）——每一轮都换掉一批武备与雷达，外形随之改变。
# 所以切片边界尽量落在改装完成/开始的节点上，而不是战役节点上；
# 1941-05-27 是唯一一个例外，因为那一天它打出了全生涯最著名的一仗。
# ============================================================================
ship: norfolk
slices:
  - code: P0
    title: 建造与服役（1927-1930）
    from: 1927-07-08
    to: 1930-04-29
    note: >-
      1927-07-08 在 Fairfield（Govan, Glasgow）开工，船台号 628；
      1928-12-12 下水；1930-04-30 完工服役。
      **完工日期两说**：navypedia 的 Comp 栏与英文维基单舰条目记 1930-04-30，
      naval-history 与英文维基 County 级舰表记 1930-05-01，差一天，并列不裁。

      建成时武备：8 门 8 英寸（4 座双联 Mk II）+ 4 门单装 4 英寸 +
      4 门单装 2-pdr + 4 门 47 mm 礼炮 + 2 座四联 21 英寸鱼雷管。
      本级为守条约吨位，**建成时连弹射器与水上飞机都没有**。

  - code: P1
    title: 战前十二年（1930-1939）
    from: 1930-04-30
    to: 1939-09-05
    note: >-
      1931-07 与 Devonshire 成为首批访问德国基尔港的英舰；
      1931-09 舰员卷入因弗戈登兵变（Invergordon Mutiny）；
      1932–1934 任美洲与西印度站第 8 巡洋舰中队旗舰（驻百慕大）；
      1935–1939 在东印度站；1939 年返英大改装，开战时仍在船厂。

      这段的技术变化全部来自 navypedia 的改装表：
      1932 年加 S-II-L 弹射器（1934 年 Osprey 替换 Flycatcher）、
      1933 年加 2 座四联 12.7 mm 机枪、1937 年把 4 门单装 4 英寸换成
      4 座双联 Mk XVI、把 4 门单装 2-pdr 换成 2 座八联装、
      弹射器换 E-IV-H 并配 1 架 Walrus、1939 年拆掉 4 门 47 mm 礼炮。

  - code: P2
    title: 开战与北方巡逻（1939-09 至 1940-04）
    from: 1939-09-06
    to: 1940-05-31
    note: >-
      1939-09-06 改装完成编入本土舰队第 8 巡洋舰中队；
      11 月参加丹麦海峡北方巡逻。1939-11-23 德舰 Scharnhorst / Gneisenau
      击沉武装商船 Rawalpindi 后本舰参与追捕，未及。
      1939-11-27 在奥克尼外被 U-47（Prien）攻击，**鱼雷在舰尾后方爆炸**，
      未受损（naval-history 原文「torpedoes exploded astern」；
      维基另记 Prien 报称命中一雷、德方宣传称击沉该巡洋舰 —— 均不实）。

      **1940-03-16 斯卡帕湾空袭是本舰第一次真正受损**：
      19:59 一枚 250 kg 炸弹（Ju 88 投下）击中 Y 炮塔附近后甲板，
      穿透三层甲板在 Y 弹药提升井附近爆炸，X 与 Y 弹药库进水。
      阵亡 4 人、伤 6 人，修理约三个月。
      **命中舷别两源打架**：naval-history 记左舷，英文维基记右舷水线下，并列不裁。

      1940-06-24 修毕归队。此后 1940 年 10 月在泰恩河船厂装第一部雷达（Type 286M）。

  - code: P3
    title: 丹麦海峡与最终战（1941-05）
    from: 1941-05-19
    to: 1941-06-30
    note: >-
      **这是本舰一生最关键的一个月，也是全舰状态最完整的一段记录。**

      1941-05-19 接替 Suffolk 执行丹麦海峡巡逻；05-23 与 Suffolk 联合巡逻时
      由本舰发出对俾斯麦的首次接触报告，随即遭俾斯麦 5 次主炮齐射（未命中）。
      05-24 丹麦海峡海战中本舰与 Suffolk 全程跟踪，为本土舰队提供引导。

      **05-25 失去接触的技术原因必须写清**：本舰的 Type 286M 雷达天线是**固定**的，
      不能旋转，只能覆盖一个扇面；英舰为防 U 艇开始之字形航行后，
      本舰只能在之字形的第一段上保持对俾斯麦的跟踪。
      俾斯麦 05-25 03:06 向右转向脱离时，这个动作被发现得太晚。
      （英文维基原文：「Norfolk had a fixed radar, not a rotating one, and was able
      to track Bismarck only during the first leg of the zigzag.」）

      05-26 全程参与搜索，是当时少数还有足够燃油继续追击的舰之一；
      05-27 08:20 与战列线建立目视联系，整夜绕至东北为战列舰做 flank marking，
      08:54 加入射击，全天发射 8 英寸弹 527 发，并至少两次发射鱼雷（均未命中）。
      当天 X 炮塔右炮只打了 8 发（同期 B 塔右炮 103 发）。

  - code: P4
    title: 北极护航与北非（1941-07 至 1943-03）
    from: 1941-07-01
    to: 1943-03-31
    note: >-
      1941-07 至 09 在南希尔兹改装（装 Type 273 / 281 / 284 / 285 四型雷达，
      拆 8 挺 12.7 mm 机枪与两组 UP 火箭，换 6 门 20 mm）。
      这是本舰**电子设备的分水岭**：从一部固定天线的 286M 变成一整套有型号分工的雷达。

      此后近两年是单调而危险的护航生涯：
      PQ 2 / QP 2（1941-10 至 11）、PQ 14 / QP 10（1942-04）、
      PQ 16 / QP 12（1942-05）、**PQ 17（1942-07-01，7 月 4 日奉命解散船团）**、
      PQ 18 / QP 14（1942-09）、JW 53 / RA 53（1943-02 至 03）。
      1942-11 参加「火炬」行动，在亚速尔附近为美军登陆做掩护。

      1942-02 在泰恩河船厂修理（2 月）；1943-04 起在朴茨茅斯修理。

  - code: P5
    title: 北角海战与受损（1943-12）
    from: 1943-12-20
    to: 1944-01-31
    note: >-
      1943-12-23 作为 Force I（与 Belfast、Sheffield 同组）为 JW 55B / RA 55A 提供掩护。

      **1943-12-26 北角海战是本舰唯一一次与德军主力舰正面对射**：
      09:30 起对 Scharnhorst 开火，6 次齐射命中 2 发，打掉德舰后部雷达。
      12:10 起的第二轮交火中本舰被命中 2 发 283 mm 弹：
      第一发使 X 炮塔失效，第二发在舯部主甲板下方爆炸。
      **阵亡人数两说**：英文维基记 6 人，naval-history 记 7 人阵亡、5 人受伤，并列不裁。

      此后进入长时间修理：X 炮塔被整个吊下送修，1944-08 才装回。

  - code: P6
    title: 1944 年大改装（拆 X 炮塔）
    from: 1944-02-01
    to: 1944-11-30
    note: >-
      **本舰外形变化最大的一次，也是它与姊妹舰彻底分道扬镳的地方。**

      在泰恩河船厂改装：拆 X 炮塔、拆弹射器与水上飞机、拆 2 座八联 2-pdr、
      拆 Type 273 / 281 / 284 / 286M 整批旧雷达；
      加 6 座四联 2-pdr（24 门）、11 座双联 20 mm（22 门）、
      后部新增一层上层建筑以承载弹幕指挥仪（配 Type 283）、
      换装 Type 274 / 277 / 282 / 283 / 293 雷达。

      代价写在数字上：标准排水量从约 9,925 t 涨到 10,900 t，
      满载 14,600 t，吃水从 6.37 m 加深到 6.91 m。主炮从 8 门降到 6 门。

      **全级最有讽刺意味的一笔在这里**：设计时给 8 英寸炮塔留了 70° 仰角，
      想要「重巡能打飞机」；但要到 1944 年靠一部 Type 283 雷达加一座
      专用弹幕指挥仪，这个设想才真正实现（英文维基 County 级条目原文
      「which finally allowed the main armament to serve in its intended
      anti-aircraft role」）。

  - code: P7
    title: 挪威作战、战后与拆解（1945-1950）
    from: 1944-12-10
    to: 1950-02-19
    note: >-
      1944-12-10 归队第 1 巡洋舰中队。1945-01-11 参加「SPELLBINDER」行动，
      在挪威沿岸击沉德方两艘船与一艘护航舰；05-01 起参加「JUDGEMENT」行动，
      为航母空袭挪威北部 U 艇基地提供掩护（05-04 击沉德方供应舰 Black Watch 与 U-711，
      这是欧洲战场最后一次空袭）。

      1945-06-05 载挪威国王哈康七世返奥斯陆（流亡五年后归国）。
      战后 1945-10 在马耳他试航，12 月起任东印度群岛第 5 巡洋舰中队旗舰，
      驻防至 1949 年。1949-05-03 返抵德文波特，退入预备役封存于 Falmouth。
      1950-01-03 售予 BISCO，1950-02-19 拖抵 Newport（Cashmore）拆解。
