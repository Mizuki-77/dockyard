# ============================================================================
# 状态切片：HMS Belfast（贝尔法斯特号，舷号 35 → C35）
# ----------------------------------------------------------------------------
# 切片边界按「舰上装了什么、能干什么」切，不按「编入哪个舰队」切。
# 本舰的配置史有三个真正的大分界，其余是叠加：
#
#   1939-11-21 触雷 → 1942-10 大修完成：这不是一次改装，是重建。
#       加装防雷突出部（宽 19.3 → 20.2 m、深载吃水 6.48 → 7.06 m、
#       标准排水量 → 11,500 t、航速 32.5 → 30.5 kn）、首次装雷达、
#       首次装 20 mm。她在这一片里是「不存在」的状态。
#   1944-08 至 12 的远东改装：拆航空设施 + 雷达换代（281B/293/274），
#       是从大西洋舰队转向太平洋舰队的电子改造。
#   1955-1959 的德文波特现代化：拆掉所有 2-pdr 与单装 Bofors，
#       换 6 座双联 40 mm/60，加 Type 903 —— 冷战期的形态，
#       也就是今天博物馆舰呈现的那个样子（1963 年再拆 2 座双联）。
#
# 8 片，最后一片是博物馆舰，因为「她今天是什么」本身就是一种状态。
# ============================================================================
ship: belfast
slices:
  - code: P0
    title: 建造与三个月的战时服役（1936-12-10 至 1939-11-20）
    from: 1936-12-10
    to: 1939-11-20
    note: >-
      1936-08-15 向 Harland & Wolff（贝尔法斯特）订造，1936-12-10 铺龙骨
      （船台号 1000，该厂在贝尔法斯特下水过的最大一舰），1938-03-17
      圣帕特里克节下水，命名人是首相张伯伦的妻子 Anne Chamberlain；
      1939-08-03 完工并开始验收试航，1939-08-05 服役，首任舰长
      Captain G A Scott DSO RN。

      建成配置：12 × 6 in（4 座三联 Mark XXIII 炮座）＋ 12 × 4 in（6 座双联
      Mark XIX）＋ 16 × 2-pdr（2 座八联）＋ 8 × 0.5 in 机枪（2 座四联）
      ＋ 4 × 47 mm 礼炮 ＋ 6 具 21 in 鱼雷管 ＋ 3 架水上飞机 / 1 具 D-I-H 弹射器。

      **这一片最该记住的一件事：她没有任何雷达。** navypedia 的改装台账里
      本舰第一次出现雷达要等到 1942 年那一条；姊妹舰 Edinburgh 在 9/1940
      就有 Type 279，本舰一项都没有 —— 因为她那段时间全在船厂里。

      战历：编入第 18 巡洋舰分队执行对德封锁巡逻；1939-10-09 拦截并押回
      德国邮船 Cap Norte（13,000 GRT，二战中被俘的最大敌国商船，
      全舰因此拿到奖金 prize money）。1941-09 那次对俾斯麦的追踪不是她，
      是 Sheffield —— 那时本舰正在罗塞斯的船坞里。

  - code: P1
    title: 触雷与大修（1939-11-21 至 1942-10）
    from: 1939-11-21
    to: 1942-10-01
    note: >-
      **这一片是本舰配置史的分水岭，也是她「缺席二战前半段」的原因。**

      1939-11-21 上午 11 点前，她随 Aurora、Edinburgh、Sheffield 出港去
      拦截一支据报开往大西洋袭击船团的德国舰队，刚驶离罗塞斯出福斯湾，
      就引爆了一枚磁性水雷。IWM 记「the ship's back was broken」，
      naval-history 记「major 'whipping' of ships structure ... her back was
      broken」，爆炸的鞭状效应沿全舰传导致使设备普遍损坏。

      损伤判定与修理分三段：罗塞斯临时抢修（1939-11-23 起）→ 1940-06
      自行驶往德文波特、随即退役归船厂管辖 → 进干船坞，1940-08 至 12
      加装中部外部防雷突出部。

      **加装突出部带来的连锁变化（navypedia 台账全列）**：
      宽 19.3 → 20.2 m；深载吃水 6.48 → 7.06 m；
      排水量 → 标准 11,500 / 深载 14,900；最大航速 32.5 → 30.5 kn；
      突出部外侧新加 102 mm 装甲带。naval-history 对代价只写一句
      「Although stability was improved speed was reduced by 2 knots」。

      同时拆除 2 座四联 0.5 英寸机枪，加装 5 座双联 + 4 门单装 20 mm Oerlikon
      （共 14 门），并首次装上雷达：273Q / 281 / 283 / 284 / 285 五型。
      1942-10 重新服役，1942-11 赴斯卡帕湾训练。

  - code: P2
    title: 北极护航与北角海战（1942-10 至 1944-04）
    from: 1942-10-02
    to: 1944-04-30
    note: >-
      归建后编入本土舰队第 10 巡洋舰分队并任分队旗舰。IWM 的评语：
      「she was the largest and arguably the most powerful cruiser in the
      Royal Navy ... equipped with the most advanced radar systems」。

      **配置上这一片几乎没有大改**，只有一次加装：1943-06 再加 4 门单装
      20 mm（14 → 18 门）。战力稳定正是她这一段时间出勤率高的原因。

      主要任务是为俄国护航编队提供近距离重掩护：JW53 / RA53（1943-02 至 03，
      遭飓风级风暴，Sheffield 结构受损退出、由 Norfolk 接替）、
      RA54A、JW54B / RA54B、JW55A、JW55B / RA55A；其间夹着
      1943-07 的 Operation CAMERA（对挪威的佯动扫荡）与
      1943-10-04 的 Operation LEADER（掩护美军航母 Ranger 空袭博德）。

      **1943-12-26 北角海战**：Burnett 少将坐镇本舰，与 Norfolk、Sheffield
      编为 Force 1，用雷达保持接触、把沙恩霍斯特往南驱赶，直到约克公爵的
      14 英寸炮接战。最后本舰与 Jamaica 奉命用鱼雷实施击沉。
      IWM 记「Even as HMS Belfast fired, Scharnhorst's radar blip vanished」。
      全舰获 ARCTIC 1943 与 NORTH CAPE 1943 两项战功表彰。

      1944-04-03 Operation TUNGSTEN：随约克公爵、安森掩护胜利号等航母
      空袭阿尔滕峡湾的提尔皮茨。

  - code: P3
    title: 诺曼底炮击（1944-05 至 1944-08）
    from: 1944-05-01
    to: 1944-08-31
    note: >-
      **这一片只讲一件事：她是炮击编队 E 的旗舰。**

      1944-05 在克莱德河口与 Diadem 会合，任 Dalrymple-Hamilton 少将的
      炮击编队 E 旗舰，配属东特遣舰队，负责支援 Gold 与 Juno 滩头的
      英加部队。预定射击目标：Ver-sur-Mer 炮台，并为 Juno 登陆提供
      舰炮支援。

      **开火时刻必须写准**：IWM 旧版舰史页写「at 5.30 am on 6 June 1944,
      was one of the very first ships to open fire」，而 IWM 的 D-Day 专题页
      引本舰日志写得更精确 —— 0527，全舷侧向左开火；西侧另一艘巡洋舰
      0523 已先开火（舰上军官 Peter Brooke Smith 中尉日记）。所以
      「最先开火的军舰之一」对，「第一艘」不对。

      装备上没有变化（20 mm 已在此前的 1944-05 改装中调整为 22 门、
      拆 1 座双联加 6 门单装），但状态上有一件常被忽略的事：
      炮击震裂了舰上厕所的管道 —— 这是 IWM 的展陈里专门提到的一件小事。

      数字口径两说：IWM 专题页「33 days ... over 4,000 6-inch and 1,000 4-inch
      shells」；IWM 旧版舰史页「five weeks ... thousands of rounds」。
      两说并列，33 天与 5 周（35 天）大致相容。
      最后射击是 1944-07-08 与 Rodney、Roberts 一同轰击卡昂外围。

  - code: P4
    title: 远东改装与战后中国勤务（1944-09 至 1948-11）
    from: 1944-09-01
    to: 1948-11-30
    note: >-
      **1944-08 至 12 的这次改装是本舰电子配置的第二次换代**，目的很明确：
      为赴英国太平洋舰队做准备。三处换装：
      Type 281B（单桅）换掉 281 作对空警戒；Type 293 换掉 273Q 作水面警戒；
      Type 274 换掉 284 作主炮火控。另加 IFF 敌我识别、PPI 平面位置显示器
      与改进的无线电通话设备（用于引导舰载机）。

      1945-05 至 06 在斯卡帕湾完成战备训练，7 月出航赴太平洋。
      8 月日本投降后改调南中国海的英国第 111 特遣编队（TF 111），
      编为第 111.3 特遣群（与轻航母 Colossus、巡洋舰 Argonaut、Bermuda 等），
      任务是支援在华盟国侨民的康复与遣返；抵上海执行收复与英侨遣返。

      战后到 1947 年秋一直在远东做维和勤务，包括从中国撤离日本战俘营
      与平民拘留营的幸存者。1945-11 至 1946-01 在上海任第 2 巡洋舰分队旗舰。
      1946 年多次往返香港、日本、新加坡，1946-07 换舰长（Ellison 上校接替
      Dick 上校）。1947 年秋结束远东勤务回国，随后进行战后第一次和平时期改装。
      IWM 记「Following her first peacetime refit, HMS Belfast returned to the Far
      East in December 1948」——改装完成于 1948 年 11 月前后，
      **具体月份来源未给**，故本片止于 1948-11 月末。

  - code: P5
    title: 朝鲜战争（1948-12 至 1952-09）
    from: 1948-12-01
    to: 1952-09-30
    note: >-
      1948-12 结束战后第一次改装、重返远东，任第 5 巡洋舰分队旗舰。
      1949-04 紫石英号（Amethyst）事件期间，远东站总司令 Brind 上将的旗
      挂在香港的本舰上，给 Amethyst 代理舰长 Kerans 少校的全部命令都从
      本舰发出 —— 但本舰**未直接参战**（IWM 原文「Although HMS Belfast was
      not actively involved in the crisis」）。

      **1950-06 朝鲜战争爆发后，她是英国最早投入作战的军舰之一**，
      在朝鲜 invasion 后仅 11 天就开始炮击支援撤退中的韩军与美军。
      IWM 记她在这场战争中的出勤强度超过二战任何一段：
      「during which she spent no less than 404 days on active patrol」，
      并留下一句很生动的记录：「She subsequently fired so many salvoes that
      she wore out her 6-inch guns」。

      1952-09-27 启航回国，这是她最后一次实战射击。1952 年由 Ceylon 接替后
      回英国重新服役，再赴远东继续任第 5 巡洋舰分队旗舰。

      装备上无变化 —— 这一片是纯粹的消耗，不是改装。

  - code: P6
    title: 第二次远东服役、现代化改装与退役（1952-10 至 1963-08-24）
    from: 1952-10-01
    to: 1963-08-24
    note: >-
      1952-09 回国后重新服役，再赴远东继续任第 5 巡洋舰分队旗舰，
      在朝鲜西海岸再次执行联合国军的炮击任务；1953 年停战后续留远东至 1955 年。
      **1955 年退役进德文波特船厂做现代化改装，1959 年重新服役。**
      这次改装把她从二战形态改成了冷战形态，也是最彻底的一次：

      拆 —— 5 门单装 40 mm/60 Bofors、2 座八联 2-pdr、4 座四联 2-pdr、
      2 座双联 20 mm、4 门单装 20 mm；
      加 —— 6 座双联 40 mm/60 Mk 5（12 门）、4 部 Type 903 火控雷达。
      主炮 12 门 6 英寸与 8 门 4 英寸保持不变。

      IWM 的舰 specification 页给的是同一时点的独立口径，可互证：
      「ARMAMENT (1959) Twelve (4x3) 6-inch; eight (4x2) 4-inch HA/LA;
      twelve (6x2) Bofors AA」。

      1959-1962 再赴远东。1961-12 进入达累斯萨拉姆，参加坦噶尼喀独立庆典，
      承担了降下英国国旗、升起坦噶尼喀国旗的仪仗 —— 这是她最后一次
      「代表帝国」的仪式性任务。1962-03-26 离开新加坡，结束最后一次海外服役。

      1963-08-24 在德文波特退役，将官旗最后一次降下。全生涯航程近 50 万海里。
      随后系泊于 Fareham Creek 待处置，一度被用作朴次茅斯的住宿船。

  - code: P7
    title: 博物馆舰（1963-08-25 至今）
    from: 1963-08-25
    note: >-
      **这是她今天存在的意义所在，也是本舰与全库其他舰最不同的一片。**

      1963 年退役时，按常规她的下一站就是拆船厂。转折是三件事叠在一起：

      一、1967 年帝国战争博物馆开始研究「保存一艘二战巡洋舰」的可行性，
      成立 Belfast 委员会（主席为 IWM 馆长 Noble Frankland），成员含
      国家海事博物馆与 IWM 代表。委员会报告的结论是：
      「There is a very strong case for her preservation… There is really no
      question of selecting Belfast; it is rather a case of grasping the last
      opportunity.」

      二、1971-03-08 下院休会辩论，本舰前舰长 Morgan-Giles 少将力陈保存，
      国防部次官 Peter Kirk 同意「hold up until the end of June any question
      of the disposal of the hull」。当时政府与海军本已打算拆解
      （IWM 原文「As late as May 1971, the government and the Navy were intent
      on scrapping HMS Belfast」）。

      三、HMS Belfast Trust 成立并接手。1971-07 政府把舰移交 Trust，
      1971-10-14 拖抵伦敦池（塔桥旁专门疏浚的泊位），
      1971-10-21 特拉法加日对公众开放。1978 年所有权转交帝国战争博物馆。

      状态上她此后不再改动武备，只做保存性维护。今天舰上是九层甲板、
      1963 年拆除 2 座双联 Bofors 之后的形态（余 4 座 8 门 40 mm）。
      她是 IWM 藏品中体积最大的一件，也是诺曼底炮击舰队现存三艘之一
      （另两艘为美军驱逐舰 Laffey 与战列舰 Texas）。
