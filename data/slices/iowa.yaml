# ============================================================================
# 状态切片：衣阿华（Iowa, BB-61）
# ----------------------------------------------------------------------------
# 切片只描述「这艘舰的外形与配置在某段时间里是什么样」，边界落在
# ships/iowa.yaml 里真实存在的 fact 时间窗与史料节点上。
# 改这里不改数据，只是换一种分组方式；数据本身仍由 fact 的 valid 窗口决定。
#
# 衣阿华的外形变化主线：
#   船台 → 下水舾装 → 竣工（15×4 40 mm / 60×1 20 mm，本级最少的防空）
#   → 1943 年内即加装 4 座四联 40 mm → 1945 年初大改（换 SK-2/SP 雷达、
#   20 mm 改双联）→ 战后精简 → 1950 年代直升机化 → 1958 封存
#   → 1984 复役（战斧/鱼叉/密集阵，烟囱与舰桥加平台）→ 1990 退役 → 博物馆舰。
# ============================================================================

ship: iowa

slices:
  - code: P0
    title: 船台建造（1940-06 至 1942-08）
    from: 1940-06-27
    to: 1942-08-26
    note: >-
      1940-06-27 在纽约海军造船厂（布鲁克林）开工，是本级第一艘。
      此阶段无舰体外形可看，只有分段合拢的船壳与逐渐成形的舷侧装甲堡；
      16 英寸炮塔的炮座环在这一期末才落位。

  - code: P1
    title: 下水与舾装（1942-08 至 1943-02）
    from: 1942-08-27
    to: 1943-02-21
    note: >-
      1942-08-27 下水，掷瓶人为副总统华莱士夫人。舰体入水后为「裸船」状态：
      上层建筑仅具雏形，三座主炮塔尚在安装，10 座 5 英寸双联装炮座与
      全部 40 mm/20 mm 炮位空置，雷达桅未装。

  - code: P2
    title: 竣工全装（1943-02 至 1943 年底）
    from: 1943-02-22
    to: 1943-12-31
    note: >-
      1943-02-22 服役。竣工防空为本级最弱的一档：15 座四联 40 mm（60 门）
      + 60 门单装 20 mm；同级的 BB-62/63 是 20 座四联 + 49 门单装。
      雷达为 SK 对空搜索 + 2 部 SG 对海 + Mk 3/Mk 8/Mk 4 火控。
      1943 年内即撤 8 门单装 20 mm、加装 4 座四联 40 mm。

  - code: P3
    title: 二战太平洋战场（1944-01 至 1945-08）
    from: 1944-01-01
    to: 1945-08-31
    note: >-
      1944-01-02 离美赴太平洋，编入第 7 战列舰分队。这一片里外形变动集中在
      1945 年初：撤 SG/SK/Mk 3/4 部 Mk 8/4 部 Mk 4，换 SC-2、SK-2、SP、SU、
      2 部 Mk 13、4 部 Mk 12.22、Mk 27 与 TDY 电子战套件，并加 8 座双联 20 mm。
      涂装为 wartime measure 的深色舰体配浅色上层建筑。

  - code: P4
    title: 战后与朝鲜战争（1945-09 至 1958-02）
    from: 1945-09-01
    to: 1958-02-24
    note: >-
      1945-09-02 在东京湾作为哈尔西的旗舰参加受降仪式。此后拆除大部分
      40 mm（1946-1948 撤 4 座四联），20 mm 全部撤除，加装 SR-3/SPS-6 系列
      雷达；1951 年起加装直升机甲板与 3 架直升机（同级首次）。
      1951 年再加 4 座四联 40 mm。这一段的外形特征是「防空炮越拆越少、
      雷达天线越换越多」。

  - code: P5
    title: 费城后备舰队封存（1958-02 至 1984-04）
    from: 1958-02-25
    to: 1984-04-27
    note: >-
      1958-02-24 退役，入费城大西洋后备舰队。封存期外形基本冻结在 1950 年代
      末状态：三座主炮塔与 10 座 5 英寸炮座保留，40 mm 与 20 mm 陆续拆除，
      甲板上加盖防尘罩。这一段没有新的配置变化，是本舰最「静止」的时期。

  - code: P6
    title: 1980 年代复役改装（1984-04 至 1990-10）
    from: 1984-04-28
    to: 1990-10-26
    note: >-
      1984-04-28 复役。外形变化最大的一段：加装 8 座四联「战斧」巡航导弹
      发射箱（32 枚）、4 座四联「鱼叉」导弹发射箱（16 枚）、4 座 20 mm
      「密集阵」近防炮，拆除全部 40 mm 与 20 mm，增设直升机甲板；
      雷达换为 SPS-49/SPS-67/SPS-64 + 2 部 Mk 13 + 4 部 Mk 25，
      加 SLQ-32(v)3 电子战套件、8 座 SRBOC Mk 36 干扰弹发射器与 SLQ-25 Nixie。
      主炮塔射界因超压问题被收窄（一号塔 −139/+139 度）。

  - code: P7
    title: 退役、封存与博物馆舰（1990-10 至 2012 起）
    from: 1990-10-27
    note: >-
      1990-10-26 退役。二号炮塔自 1989-04-19 爆炸后即封存未再使用，
      退役时该塔仍是封闭状态——这是本舰外形上最特殊的一处。
      2006-03 除籍；2001-04-21 移入 Suisun Bay 后备舰队；
      2011-10-27 离开该舰队移交洛杉矶太平洋战列舰中心；
      2012 年起在 San Pedro 作为博物馆舰开放，主尺度与上层建筑保持
      1980 年代复役末期状态。
