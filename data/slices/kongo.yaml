ship: kongo
slices:
- code: P0
  title: 建造与竣工（1911-1913）
  from: '1911-01-17'
  to: '1913-08-16'
  note: >-
    1911-01-17 在维克斯公司巴罗因弗内斯船厂开工，船台号 414，是本级唯一在英国
    建造的一艘（另三舰在横须贺、川崎神户、三菱长崎）。1912-05-18 下水并命名，
    1913-08-16 竣工服役。设计出自维克斯-阿姆斯特朗的乔治·瑟斯顿爵士。
    主炮为英造 43 年式 35.6 cm 连装 4 座 8 门——四舰里只有金刚装这一型，
    另三舰是日产 41 年式，两者型号不可互换。
- code: P1
  title: 一战与战间（1913-1928）
  from: '1913-08-17'
  to: '1928-11-30'
  note: >-
    服役后编入第一舰队第三战队。1914 年 8 月奉命前往中途岛方向截击德国轻巡
    纽伦堡号，未获接触；日本虽参战，本舰未实际执行作战任务。1917 年 6 月加装
    火炮指挥塔，1918 年 3 月撤旧式 80 mm 炮、装 4 门 80 mm 高炮。
    这一期仍为 36 座 Yarrow 锅炉、Parsons 2 台 4 轴、27.5 节、8 具 53.3 cm
    水中鱼雷发射管，舰种仍是巡洋战舰。
- code: P2
  title: 第一次大改装（1928-1931）
  from: '1928-12-01'
  to: '1931-05-31'
  note: >-
    1928-12-01 在横须贺开工，1931-03-31 工程完成（实际延续到 9 月）。
    机舱与弹药库上方水平装甲加厚、炮塔顶盖增至 152 mm、炮座下方加强至
    152-140 mm、加防雷突出部使舰宽增至 29.3 m、拆 4 具鱼雷发射管、
    36 座 Yarrow 锅炉换成 10 座舰本式（混烧 6＋重油专烧 4），涡轮未换。
    鱼雷发射管由 8 具减为 4 具，主炮仰角由 25 度提到 33 度。
- code: P3
  title: 改级战舰与第二次大改装（1931-1937）
  from: '1931-06-01'
  to: '1937-01-08'
  note: >-
    1931-06-01 编制上改级为战舰（工程完工日 1931-03-31，两说并列）。
    1932-05-02 装 8 门 12.7 cm 八九式（4 座双联）、4 门 40 mm 维克斯炮，
    并在 3 号炮塔后方左舷装吴式二号三型弹射器（本舰第一台）。
    1935-06-01 起在横须贺做第二次大改装，1937-01-08 完成：锅炉换 8 座重油
    专烧舰本式、涡轮换新、舰尾延长、塔式舰桥重建、主炮仰角提到 43 度、
    副炮提到 30 度、40 mm 维克斯炮撤除改 10 座双联 25 mm（20 挺）、
    鱼雷发射管全撤、设 3 架水侦轨道。外形自此定型，成为「高速战列舰」。
- code: P4
  title: 太平洋战争前期（1937-1942-07）
  from: '1937-01-09'
  to: '1942-07-31'
  note: >-
    开战时第三战队第二小队为金刚＋榛名，配属近藤第二舰队南方部队主队。
    1941-12-09 主队南下准备夜战未获接触，Z 舰队由陆攻解决。
    1942-03-07 与榛名炮击圣诞岛；04-09 印度洋作战中遭 9 架布伦海姆攻击未中。
    中途岛时第二小队改为金刚＋比叡，本舰当日未受损。
    1942-07-14 编成调整后，金刚成为第三战队（金刚＋榛名）旗舰。
- code: P5
  title: 所罗门与雷达改装（1942-08-1943-12）
  from: '1942-08-01'
  to: '1943-12-31'
  note: >-
    1942-08-01 在吴装二一号电探于前桅顶部测距仪——四舰里最早的雷达记录。
    1942-10-13 与榛名炮击亨德森机场，本舰打出 435 发 14 英寸弹
    （104 发三式烧霰弹、331 发一式穿甲弹），其中三式弹是首次实战使用。
    1942-10-26 南太平洋海战遭 4 架 TBF 攻击未受损。
    1943-02-27 至 03-13 在佐世保入坞：操舵机舱加敷混凝土、拆 2 门 6 英寸副炮
    改 2 座三联 25 mm，25 mm 由 20 挺增至 26 挺。
- code: P6
  title: 马里亚纳与莱特湾（1944-01-1944-10）
  from: '1944-01-01'
  to: '1944-10-28'
  note: >-
    1944-01-30 至 02-14 在佐世保入坞：拆 4 门 152 mm 副炮改 2 座双联 127 mm
    （高炮增至 6 座 12 门）、25 mm 由 26 挺增至 34 挺。
    1944-06-20 马里亚纳海战未受损；06-30 在吴装二二号与一三号电探，
    25 mm 按分型相加为 100 挺（三联 18＋双联 8＋单装 30）；08-23 在 Seletar
    可能再加 18 挺至 118 挺（原文自标 probably）。
    1944-10-25 萨马岛海战中击沉塞缪尔·B·罗伯茨号（DE-413）、重创甘比尔湾号，
    当日消耗 14 英寸弹 310 发。
- code: P7
  title: 台湾海峡沉没与除籍（1944-11-1945-01）
  from: '1944-10-29'
  to: '1945-01-20'
  note: >-
    1944-11-21 凌晨随第二舰队经台湾海峡返吴，0301 前后被 USS Sealion II
    （SS-315）射出的鱼雷命中（美方记 3 发、日方记 2 发，两说并列）。
    六号与八号锅炉舱进水、左倾增至 15 度（日方记 18 度），0524 弹药库爆炸后
    沉于 26-09N、121-23E。约 1,200 人阵亡（日方记 1,300），浜风、矶风救起
    237 人。1945-01-20 除籍。它是日本海军在战争中被潜艇击沉的唯一一艘战列舰。
