# ============================================================================
# 状态切片：HMS Cossack（哥萨克号，L03 → F03 → G03）
# ----------------------------------------------------------------------------
# 本舰的分界逻辑抓三件事：旗舰身份、雷达、X 炮座换装。
# 它不是一艘「按改装表划线」的舰 —— 每一次进船厂都同时换了身份或火力配置，
# 所以切片边界基本落在出厂日。
# ============================================================================
ship: cossack
slices:
  - code: P0
    title: 建造（1936-1938）
    from: 1936-06-09
    to: 1938-06-06
    note: >-
      1936-06-09 在 Vickers-Armstrong（Newcastle-on-Tyne）开工，
      1937-06-08 下水，1938-06-07 完工服役，编入第 1 部族驱逐舰分队。
      navypedia 记本舰为该级中「1936 年 6 月开工、1937-06-08 下水、
      1938 年 6 月完工」，与 naval-history / uboat.net 一致。

  - code: P1
    title: 地中海与本土舰队（1938-1939）
    from: 1938-06-07
    to: 1939-12-31
    note: >-
      服役时舷号 L03，1938-12 改为 F03。在地中海舰队服役，参加西班牙内战
      期间的不干涉巡逻。1939-04 分队改称第 4 驱逐舰分队。开战时本分队在
      亚历山大，随后转回本土海域。

      1939-11-07 在福斯湾护航中与商船 Borthwick 相撞，死 4 人，
      入莱斯（Leith）Robb 船厂修理至 1940-01-09 ——
      这是本舰第一次因事故而非战伤入厂。

  - code: P2
    title: 旗舰身份、阿尔特马克与纳尔维克（1940-01 至 1940-04）
    from: 1940-01-01
    to: 1940-04-30
    note: >-
      **这是本舰最著名的一段，也是它成为分队旗舰的时点。**
      1940-01 Afridi 进厂修理，其舰长 Vian 与本舰舰长 Sherbrooke 对调，
      本舰接任第 4 驱逐舰分队旗舰。

      1940-02-16 在挪威约辛峡湾强行登上德国补给船 Altmark，
      救出 299 名英国战俘；德方 4 死 5 伤；本舰舰首外板轻微受损。

      1940-04-13 第二次纳尔维克海战：与 Foxhound 击沉 Erich Giese，
      合击 Diether von Roeder，被命中 9 发 5 英寸炮弹，11 死 23 伤，
      失去机动后搁浅，04-14 涨潮脱浅、倒车驶往 Skelfjord。

      navypedia 对这次损伤的记载是「4 发 127 mm 炮弹」，
      与 naval-history 的「9 发 5 英寸」数目不同 —— 两说并列，见单舰 fact。

  - code: P3
    title: 首次大改装：装上皇家海军驱逐舰的第一部雷达（1940-05 至 1940-06）
    from: 1940-05-01
    to: 1940-06-15
    note: >-
      1940-04-29 抵朴次茅斯，05 月起在 J I Thornycroft（Southampton）大修
      并改装。两项内容改变了本舰的火力与探测：

      ① 装 286 型雷达 —— naval-history 原句称之为
         "the first radar outfit to be fitted in RN destroyers"，
         即皇家海军驱逐舰上的第一部雷达。
      ② X 炮座的双联 4.7 英寸炮座换成双联 4 英寸高平两用炮座，
         主炮从 8 门减为 6 门，换来对空能力。

      舷号在此期间由 F03 改为 G03。06-15 完成试航。

  - code: P4
    title: 本土舰队、北方布雷与第二次改装（1940-06 至 1941-02）
    from: 1940-06-16
    to: 1941-02-20
    note: >-
      归队后任第 4 驱逐舰分队旗舰（接替 1940-05-03 在纳姆索斯外海损失的
      Afridi）。参加北方拦阻布雷的护航（SN13、SN6B、SN8 等）、
      反入侵巡逻与本土舰队屏卫。1940-10-14 参加攻击挪威外海埃格尔松
      （Egersund）德军船队（行动 MD），舵受损，入厂至 11-04。

      **1941-01-07 至 02-20 在 J I Thornycroft 第二次改装，三件事：**
      ① 286 型雷达改为可旋转天线（原文 "modified to allow use of a rotating
         aerial unit"）—— 这是 286 早期型最典型的改进；
      ② 舰体在高海况高速航行中被压出波纹的船底校平；
      ③ 因设备增加，住舱改造，**编制增至 236 人**（同级普通舰为 190）。

  - code: P5
    title: 本土任务与俾斯麦追击（1941-02-21 至 1941-05-28）
    from: 1941-02-21
    to: 1941-05-28
    note: >-
      **本舰生涯的第二个高点，也是它作为分队旗舰最完整的一次战斗。**

      05-22 在克莱德加入开往印度洋的运兵船队 WS8B 担任近程护航。
      05-25 与 Maori、Sikh、Zulu、ORP Piorun 一同脱离船队，
      转隶本土舰队参加对俾斯麦的搜索。
      05-26 奉命与 Sikh、Zulu 一并加入英王乔治五世号屏卫。

      05-26 夜至 05-27 凌晨的驱逐舰夜战中，本舰打了两次：
      2342/26 被俾斯麦主炮射击，天线被打掉，施放烟雾脱离；
      0140/27 从 6,000 码齐射 3 条鱼雷，观测到 1 条命中（俾斯麦舰首起火，
      随即熄灭）；0335/27 从 4,000 码射出最后 1 条，未命中 ——
      **4 条鱼雷全部打光**，此后退出接触是因为无雷可放，不是被击退。

  - code: P6
    title: 地中海：马耳他运输与 Force H（1941-05-29 至 1941-10-22）
    from: 1941-05-29
    to: 1941-10-22
    note: >-
      06-17 为胜利号航母提供护航（行动 Tracer）；07 月起参加
      Substance（WS9C 护航）、Style、Halberd（WS11X）、Callboy 等一系列
      马耳他补给行动，隶属直布罗陀的 Force H。

      1941-07 起舰桥两舷各加 1 门单装 2-pdr 用于打 E 艇 ——
      这一条在 navypedia 的同年表格里记的是 20 mm Oerlikon，
      两说并列（见单舰 fact 与 RESEARCH-NOTES.md）。

      08-01 与 Maori 一同炮击撒丁岛阿尔盖罗（Alghero）。

  - code: P7
    title: HG.75 护航与沉没（1941-10-23 至 1941-10-27）
    from: 1941-10-23
    to: 1941-10-27
    note: >-
      **沉没要分三段，不能写成一句话。**

      ① 10-23：在 HG.75 护航中位于船队尾部，于 35°36'N 10°04'W
         被 U-563（Bargsten）的一条鱼雷命中舰桥之前。舰桥之前结构被摧毁，
         舰长 Berthon 与 158 人阵亡、29 人受伤。弹药发生爆炸，
         1 号锅炉舱进水。幸存者乘救生浮具离舰。
      ② 稍后：幸存者返回舰上做损管，使舰能以倒车航行；
         拖船 Thames 赶到接拖，轻护卫舰 Jonquil 护航，目标直布罗陀。
      ③ 10-27 1043：天气恶化，人员转移到 Jonquil，
         舰在 35°12'N 08°17'W 沉没。

      **「1941-10-24 损失」是另一套口径**（uboat.net 的舰页与 U 艇战果表），
      指判定战损的日期，与实际沉没的 10-27 不是同一件事，两说并列。
