# ============================================================================
# 状态切片：Bismarck
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立（同级舰的改装节奏不同，边界不能继承），
# 所以放在 data/slices/ 而不是 data/classes/。
#
# 切片的边界必须落在 data/ships/<id>.yaml 里真实存在的时间窗上：
# 切片是"给人看的标签"，数据本身仍由 fact 的 valid 窗口决定。
# 改这里不会改数据，只是换一种分组方式。
# ============================================================================

ship: bismarck

slices:
  - code: S00
    title: 订购与建造
    from: 1935-11-16
    to: 1940-08-23
    note: >-
      1935-11-16 订购；1936-07-01 开工；承造 Blohm & Voss（Hamburg）；1939-02-14 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: S0
    title: 舾装未完成
    from: 1940-08-24
    to: 1940-09-14
    note: >-
      服役当天的状态。舰艉四座 10.5 cm 双联尚未安装（只有前部 6 座共 12 门），
      三个指挥所的测距仪旋转圆顶未装，无雷达，无水上飞机，无迷彩。
      来源：kbismarck-drawings 图 1、kbismarck-histoperi。

  - code: S1
    title: 波罗的海试航
    from: 1940-09-15
    to: 1940-12-08
    note: >-
      首次离开汉堡。1940-10～11 于 Gotenhafen 补装舰艉四座 C/37 双联与
      两具 10.5 m 测距仪（至此 16 门 10.5 cm）。1940-10-23 测速实测
      150,170 hp / 30.1 kn，超设计值。

  - code: S2
    title: 冬季迷彩与舾装收尾
    from: 1940-12-09
    to: 1941-03-05
    note: >-
      返汉堡完成舾装。涂波罗的海迷彩（黑白斜条纹 + 假白浪 + 艉甲板卐字）。
      此期间 Anton 炮塔的 10.5 m 测距仪因高速航行时海水起雾致无用而被拆除。

  - code: S3
    title: 全战备
    from: 1941-03-06
    to: 1941-05-17
    note: >-
      出击前的完整状态。三座指挥所装 FuMO 23 雷达，前司令塔加装 7 m 测距仪，
      1941-04 下旬两门 2 cm 单装换成两座 C/38 四联（20 cm 变成 10 单装 + 2 四联），
      03-15 与 04-02 接收共 4 架 Ar 196。

  - code: S4
    title: 莱茵演习出击
    from: 1941-05-18
    to: 1941-05-24
    note: >-
      1941-05-21 在 Korsfjord 涂掉波罗的海条纹改统一舷外灰；
      05-22 13:07 涂掉艉甲板卐字，同时拆除小艇与舰首锚（拆救生艇
      直接影响了沉没时的生还率）。05-24 06:00 前为出击状态。

  - code: S5
    title: 受损减速
    from: 1941-05-24
    to: 1941-05-26
    note: >-
      丹麦海峡后。被 Prince of Wales 命中 3 发（仅 3 发），
      左倾 9°、艏倾 3°，可达最大航速降至 28 kn（中途因放弃
      左舷 2 号锅炉曾降至 16 kn）。05-23 20:30 前向雷达被自身
      炮口冲击波损坏，剩两台。

  - code: S6
    title: 舵损瘫痪至沉没
    from: 1941-05-27
    note: >-
      1941-05-26 20:47 后两枚空投鱼雷命中，左舵卡死于 12°，
      实测最大 7 kn 且无法保持航向。05-27 晨炮塔顶涂 RAL 1003 信号黄
      （海况恶劣大部被冲掉）。四座主炮塔逐次失效：0908 Anton+Bruno →
      0921 Dora → 0927 Bruno 最后一次射击 → 0931 Cäsar 最后一次射击。
