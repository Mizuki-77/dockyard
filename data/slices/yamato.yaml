# ============================================================================
# 状态切片：大和（Yamato）
# ----------------------------------------------------------------------------
# 切片只描述「这艘舰的外形与配置在某段时间里是什么样」，边界落在
# data/ships/yamato.yaml 里真实存在的 fact 时间窗上。
# 改这里不改数据，只是换一种分组方式；数据本身仍由 fact 的 valid 窗口决定。
#
# 大和的外形变化主线：裸船体 → 下水舾装 → 竣工全装 → 1943-07 电探与 25 mm
# 首增 → 1943-12 雷伤 → 1944-02 撤副炮换高炮+电探 → 1944-07 再增 25 mm 与换甲板
# → 1944-10 黑甲板 → 1944-11 最终防空配置。
# ============================================================================

ship: yamato

slices:
  - code: P0
    title: 船台建造（1937-11 至 1940-08）
    from: 1937-11-04
    to: 1940-08-07
    note: >-
      1937-11-04 在吴海军工厂第 4 船渠开工，档案上只称「一号舰」。
      船渠为此加深约一米，跨渠龙门吊起重能力由 60 吨提高到 100 吨；
      船渠上方架起长 101.8 m 的大屋顶遮挡视线。此阶段无舰体外形可看，
      只有分段合拢的船壳与逐渐成形的舷侧防雷突出部。

  - code: P1
    title: 下水与舾装（1940-08 至 1941-03）
    from: 1940-08-08
    to: 1941-03-20
    note: >-
      1940-08-08 下水并命名，仪式无观览人、无军乐队。舰体入水后为
      「裸船」状态：上层建筑仅具雏形，三座主炮塔的炮座环空置，
      15.5 cm 与 12.7 cm 炮座均未装，无电探、无水上机设施。

  - code: P2
    title: 主炮装舰至竣工（1941-03 至 1941-12）
    from: 1941-03-21
    to: 1941-12-15
    note: >-
      主炮装舰实际在 1941 年 3 月下旬至 5 月下旬完成，比原计划提前约半年；
      预行运转提前到 10 月 16–18 日，公试提前到 10 月 22–30 日（宿毛湾，
      27.46 节）。此阶段三座 46 cm 三联装炮塔、四座 15.5 cm 三联装
      （一座在前、两座舷侧、一座在后）、六座 12.7 cm 双联陆续到位。

  - code: P3
    title: 竣工状态（1941-12 至 1943-07）
    from: 1941-12-16
    to: 1943-07-11
    note: >-
      1941-12-16 竣工时的完整配置：3×3 46 cm/45 九四式（前二后一）、
      4×3 15.5 cm/60 三年式、6×2 12.7 cm/40 八九式高角炮、
      8 座三联 25 mm（24 门）、2 座双联 13.2 mm；两座吴式二号五型弹射器，
      搭载零式水侦与水观共 6 架（另一说 7 架）。无雷达，无雷达告警装置。
      定员 2,500 人。1942-02-12 起为联合舰队旗舰。

  - code: P4
    title: 首次电探与 25 mm 增备（1943-07 至 1943-12）
    from: 1943-07-12
    to: 1943-12-24
    note: >-
      1943-07-12 入吴船坞：前桅楼测距仪臂装二一号电探（Type 21 Mod 3，
      对空对海搜索）；天甲板增设 4 座三联 25 mm，总数由 24 门增至 36 门；
      15.5 cm 耳台炮加围壁防盾、炮座补 28 mm 装甲（总厚 103 mm）；
      同时削减燃油舱容、改进主副舵操控。这是大和第一次有雷达。
      1943-07-16 德国海军武官温内克登舰，参观路线避开主炮塔。

  - code: P5
    title: 雷伤与进坞修理（1943-12 至 1944-02）
    from: 1943-12-25
    to: 1944-02-24
    note: >-
      1943-12-25 在特鲁克以北被 USS Skate 命中一雷，破口自防雷凸舱顶向下
      约 15 英尺、纵向约 75 英尺（肋位 151–173），进水约 3,000 吨，
      舰容上看不出外形变化，但 3 号炮塔上部弹药库曾进水。
      1944-01-16 入吴第 4 船坞，在两块纵舱壁之间上部空舱下角加装 45° 斜板
      ——该补强只装在大和、只装在受创段。

  - code: P6
    title: 1944-02 大改装（1944-02 至 1944-07）
    from: 1944-02-25
    to: 1944-07-01
    note: >-
      外形变化最大的一次：撤去两座舷侧 15.5 cm 三联装炮塔（副炮由 12 门减为 6 门），
      改装六座 12.7 cm 双联高角炮，高炮由 6 座增至 12 座（24 门）；
      增设 24 门三联装与 26 门单装 25 mm（新增 98 门，非总数）；
      装一三号对空电探与二二号改四对海/炮术电探，主桅改造；
      撤两具 150 cm 探照灯（后移设吴岸上）；舰桥两侧中部装二式红外识别装置，
      另装仿德 FuMB 1 Metox 的 E27 雷达告警接收机。
      上层甲板增建防空炮组掩体。弹药库外观无变化。

  - code: P7
    title: 1944-07 增备与换甲板（1944-07 至 1944-10）
    from: 1944-07-02
    to: 1944-10-17
    note: >-
      1944-07-02 至 08 在吴：增装 15 门（5 座三联装）25 mm；
      木甲板（檜甲板）整块更换。此时 25 mm 的累计配置仍以最终改装前的
      中间状态为准，逐期总数在来源里只给到「新增数」，本站不代加。

  - code: P8
    title: 莱特湾出击状态（1944-10 至 1944-11）
    from: 1944-10-18
    to: 1944-11-24
    note: >-
      1944-10-18 为圣贝纳迪诺海峡夜战突破紧急涂布黑甲板迷彩，主要原料是
      本舰烟囱的煤烟（两舰均涂，武藏只涂部分上甲板）。10-24 锡布延海
      中弹后进水约 3,000 吨、左倾 5 度、注水后压回 1 度，舰首保持
      2 英尺 8 英寸埋首；10-25 萨马岛外海以主炮对敌舰射击，这是全生涯唯一一次。

  - code: P9
    title: 最终状态（1944-11 至 1945-04）
    from: 1944-11-25
    to: 1945-04-07
    note: >-
      1944-11-25 入吴船坞完成最终防空配置：撤 24 门旧式单装 25 mm，
      改装 9 座三联装，25 mm 达 152 门（50 座三联装 + 2 门单装）；
      另一说 162 门（52 座三联 156 门 + 6 门单装），两说并列。
      防空构成为 24 门 12.7 cm、152 门 25 mm、6 门 15.5 cm。
      定员增至 3,332 人。1945-03-19 舰桥被一枚 1,000 磅炸弹命中、仅轻伤；
      1945-04-07 天一号作战沉没。
