# ============================================================================
# 状态切片：Tirpitz
# ----------------------------------------------------------------------------
# 切片只对某一艘舰成立（同级舰的改装节奏不同，边界不能继承），
# 所以放在 data/slices/ 而不是 data/classes/。
#
# 切片的边界必须落在 data/ships/tirpitz.yaml 里真实存在的时间窗上：
# 切片是"给人看的标签"，数据本身仍由 fact 的 valid 窗口决定。
# 改这里不会改数据，只是换一种分组方式。
#
# 与 Bismarck 的根本区别：Bismarck 是九个月、七刀（服役→沉没）；
# Tirpitz 是三年九个月、反复修理与改装——它的一生几乎全在锚地度过，
# 所以切片的分界不是"打了什么仗"，而是"改了什么装、挨了什么打"。
# ============================================================================

ship: tirpitz

slices:
  - code: T0
    title: 舾装与波罗的海试航
    from: 1941-02-25
    to: 1941-09-30
    note: >-
      服役时 12 门 2 cm 单装、无鱼雷管、无巡航汽轮机以外的改装，
      雷达为三台 FuMO 23。1941-03-09 离威廉港、03-13 抵格丁尼亚，
      03-21 至 04-17 在但泽湾与波罗的海试航。涂波罗的海深浅色块迷彩
      （证据仅来自照片，置信度 C）。

  - code: T1
    title: 第一批改装（鱼雷管 + 统一 C/37）
    from: 1941-10-01
    to: 1942-01-13
    note: >-
      在格丁尼亚改装：上甲板舯部两舷加装两座四联 533 mm 鱼雷管（共 8 具，
      备雷 24 发），该处上层建筑延伸至上甲板边缘、主吊车上移一层；
      10.5 cm 八座统一为 Dop. L. C/37（原两座 C/31d 换掉）；
      2 cm 由 12 门增至 24 门（六座四联）。这是两舰外观差异最大的阶段。

  - code: T2
    title: 挪威驻泊
    from: 1942-01-14
    to: 1943-09-21
    note: >-
      1942-01-14 执行"北极之夜"移驻特隆赫姆，01-16 抵 Fættenfjord。
      前桅测距仪塔顶加雷达室：FuMO 27 + FuMO 4 Samos + Sumatra；
      2 cm 增至 32 门（1942-06）、40 门（1943-03）。
      期间历"北极之夜"、"骑士行动"（PQ17）、1943-09 炮击斯匹次卑尔根。
      涂装改为分裂式迷彩，1943 年改峡湾锚地伪装。

  - code: T3
    title: 重创与长期修理
    from: 1943-09-22
    to: 1944-03-14
    note: >-
      1943-09-22 英军 X-6 与 X-7 袖珍潜艇在龙骨下放置三枚 2 t 水雷，
      全艇沉没但造成舰体严重变形、失去战斗力近六个月；1 死 40 伤。
      此段几乎全部在修理中度过，是它"从未真正出海作战"的缩影。

  - code: T4
    title: 恢复战备
    from: 1944-03-15
    to: 1944-09-14
    note: >-
      1944-03-15 恢复试航。1944-04-03 遭 40 架舰载机空袭，被 10 枚 225 kg
      与 4 枚 775 kg 命中，122 死 316 伤。修理期间换装 FuMO 26 大型天线
      （3 m × 6 m）与 FuMO 213 炮瞄雷达（第三座防空指挥仪基座抬高 2 m，
      只有本舰有此配置）；2 cm 增至 78 门；38 cm 与 15 cm 均改装为可对空射击。

  - code: T5
    title: 浮动炮台
    from: 1944-09-15
    to: 1944-11-11
    note: >-
      1944-09-15 一枚 5.4 t Tallboy 命中舰首，丧失航海能力；
      临时修补后于 10-15 以 8 节自行驶往 Tromsø，锚于 Håkøya 外充当固定炮台。
      此时吃水与编制都已非满编状态（在舰约 1,600–1,700 人）。

  - code: T6
    title: 沉没
    from: 1944-11-12
    note: >-
      1944-11-12 0940 后两枚 Tallboy 命中左舷舯部、多枚近失，
      0952 在 69°38′49"N 18°48′27"E 翻覆，971 人随舰沉没。
      代理舰长 Robert Weber 阵亡。残骸 1948–1957 年拆解。
