# 川内 状态切片
# 2026-11-23 建。切片边界落在 1922-02-16 至 1943-11-02 之间。
# 判据：外形/武备/探测三者的可见变化。

ship: sendai
slices:
  - code: P0
    title: 建造与竣工（1922-02 至 1924-04）
    from: 1922-02-16
    to: 1924-04-29
    note: >-
      1922-02-16 三菱长崎造船所开工，1923-10-30 下水命名，1924-04-29 竣工。
      竣工形态：14 cm 单装炮 7 门、8 cm/40 单装高角炮 2 门、6.5 mm 机炮 2 挺、
      61 cm 八年式连装发射管 4 基 8 门（鱼雷 16 条）、**滑走台（无弹射器）**、
      **四烟囱**（本型为 5500 吨型中唯一的四烟囱设计）。

  - code: P1
    title: 战前改装（1924 至 1937）
    from: 1924-04-30
    to: 1937-08-31
    note: >-
      ① 1933-1935 年：撤 8 cm 高角炮 2 门与 6.5 mm 机炮 2 挺，
        装九三式 13 mm 四连装机枪 1 基 4 挺 + 连装机枪 2 基 4 挺 + 7.7 mm 单装机枪 2 挺，
        **装弹射器 1 基（第 6、7 番炮之间）**，锅炉改重油专烧、载油 1,600 t
        （navypedia「1933 - 1935, Naka, Sendai: - 2 x 1 - 76/40, 2 x 1 - 6.5/115;
        + 1 x 4 - 13.2/76, 2 x 1 - 13.2/76, 2 x 1 - 7.7/80, 1 catapult
        (between No 6 & 7 guns), boilers were converted to oil burning」）。
      ② 1934-1939 年：友鹤事件后加固体/液体压载，满载升至约 8,000 t，速力降至 32 节。
      ③ 1935-09-26 第四次舰队事件中受台风损伤，进厂修理。

  - code: P2
    title: 开战至中途岛（1937-09 至 1942-06）
    from: 1937-09-01
    to: 1942-06-14
    note: >-
      1937-1938 年 13 mm 连装机枪换九六式 25 mm 连装 2 基 4 挺。
      本片是川内战历最密的一段（马来登陆、埃达乌海战、苏门答腊、安达曼、印度洋、
      中途岛），但**外形变化很小**——只在 1942-04-22 至 05-16 佐世保入坞整备。
      1942-05-29 随山本主力部队出击中途岛，全程未与美军交战。

  - code: P3
    title: 所罗门作战期（1942-06 至 1943-05）
    from: 1942-06-15
    to: 1943-05-04
    note: >-
      武备无大改，主要是作战与损伤：
      1942-08-31 起以肖特兰为基地执行瓜岛运输与炮击（09-08 炮击图拉吉、
      09-12 炮击「血岭」、09-18 炮击隆加角、10-14 运送 1,100 人上瓜岛）；
      11-15 第二次瓜岛海战被华盛顿号 16 英寸炮射击，施放烟幕规避、未受损。
      1943-01-21 从油船 SANYO MARU 移来 2 门 25 mm 机枪。
      1943-02-25 转属第八舰队。

  - code: P4
    title: 佐世保改装与终末（1943-05-05 至 1943-11-02）
    from: 1943-05-05
    to: 1943-11-02
    note: >-
      1943-05-05 佐世保改装：**装一号对空电探（Type 21）**、
      **撤 5 番 140 mm 炮**、装 25 mm 三连装 2 基（总数 4+6=10 挺）、
      加装深弹投放轨 2 座（36 枚）。
      **鱼雷发射管未动**——直到战沉都保持 61 cm 连装 4 基 8 门（未换四连装），
      弹射器与水上机也未撤。
      1943-06-25 第三水雷战队旗舰职能移交驱逐舰新月。
      1943-11-02 在奥古斯塔皇后湾海战中被四艘美军轻巡雷达射击命中、起火，
      0200 弃舰，0430 沉于 06-10S, 154-20E。
