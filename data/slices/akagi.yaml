# ============================================================================
# 赤城 状态切片
#
# 2026-11-19 建。切片边界全部落在有明确日期与来源的事件上（改装、加装、参战）。
#
# 这艘船的形态变化比现收录的 5 艘都大：三段甲板 → 单段甲板、无岛 → 左舷岛、
# 主炮 6 门 → 10 门 → 6 门、没有雷达、没有弹射器。切片是理解它的唯一方式。
# ============================================================================

ship: akagi
slices:
  - code: A00
    title: 订购与建造
    from: 1920
    to: 1927-03-24
    note: >-
      1920 订购；1920-12-06 开工；承造 呉海軍工廠（Kure Naval Arsenal）（広島県呉（Kure, Hiroshima））；1925-04-22 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: A0
    title: 竣工·三段甲板
    from: 1927-03-25
    to: 1928-11-30
    note: >-
      竣工状态。三段式飞行甲板（上段着舰+大型机、中段小型机、下段大型机），
      无岛式舰桥，指挥所在上段甲板前端下方。
      主炮只有 20cm 单装 6 门——连装炮是 1928 年末才装的，不是竣工状态。
      拦阻装置是英国式纵索（Furious 同型），性能不佳。
      1927-06-17 试航跑出 32.5 节。

  - code: A1
    title: 加装连装炮
    from: 1928-12-01
    to: 1935-10-23
    note: >-
      1928 年末工事加装 20cm 连装炮 2 基（中段甲板两舷）。至此主炮
      单装 6 + 连装 4 = 10 门。1931 年 3 月前后拦阻装置换为日本自研横索式 6 索。

  - code: A2
    title: 大改装中
    from: 1935-10-24
    to: 1938-08-30
    note: >-
      1935-10-24 入佐世保工厂，开始现代化改装。三段甲板拆除中。
      1937-07 日华事变爆发（改装期间）。此阶段不可作战。

  - code: A3
    title: 改装后·左舷岛
    from: 1938-08-31
    to: 1940-11-14
    note: >-
      改装完成。单段全通甲板 249.17 × 30.48 m，三层机库（上/中各 130×22×5 m，
      下为小型辅助库）。左舷岛式舰桥——罕见实验设计，同期仅飞龙相同。
      1938 年 10-11 月做了 451 架次实船试验，结论负面（右舷来风时气流紊乱、
      夜间着舰困难），但未改回。
      主炮减为单装 6 门（连装 2 基撤除）。
      25mm 双联机炮 14 基 28 门（替换原 13mm）。
      12cm 高角炮 6 基 12 门——至死未换装 12.7cm。
      弹射器 0 基（曾做过部分配套工程）。

  - code: A4
    title: 一航舰旗舰·全战备
    from: 1940-11-15
    to: 1941-11-25
    note: >-
      1941-04-10 第一航空舰队编成，赤城任南云忠一中将旗舰。
      1940-11-15 一度列为特设舰（特務艦）再复归。
      无雷达（整个机动部队的航母都没有）。
      舰载机：零战、九九舰爆、九七舰攻。

  - code: A5
    title: 珍珠港至印度洋
    from: 1941-11-26
    to: 1942-05-26
    note: >-
      1941-11-26 自单冠湾出击。12-07 珍珠港（第一波 27 架舰攻 + 9 架零战；
      第二波 18 架舰爆 + 9 架零战）。1942 年转战拉包尔、达尔文、印度洋，
      4-05 击沉 Cornwall / Dorsetshire，4-09 击沉竞技神号。
      4-18~22 追击杜立特空袭编队未果。
      4-25 青木泰二郎接任舰长。
      珊瑚海海战后，飞行甲板前部开始绘巨大日章旗作敌我识别。

  - code: A6
    title: 中途岛·战没
    from: 1942-05-27
    to: 1942-06-05
    note: >-
      1942-05-27 自柱岛出击参加 MI 作战，任第一航空战队旗舰。
      6-04 04:30（当地）第一波攻击中途岛：18 架九九舰爆 + 9 架零战。
      6-04 10:26（当地）被企业号 VB-6 的 Best 队 3 架 SBD 俯冲轰炸，
      1 发直击中部、在机库内爆炸。
      10:29 下令注水弹药库（前部成功、后部因阀件损坏失败）。
      10:40 舵机卡死于右 20-30°。10:46 南云移旗舰至长良号。
      19:20 青木决定弃舰；21:25 山本下令推迟处分。
      6-05 04:50 山本下令处分，05:20 被四艘驱逐舰各射 1 雷，
      向右倾覆、舰尾先沉，沉于 30°30′N 178°40′W。（当地时刻）
      注意：舰尾先沉——英文维基的「bow first」是未更新的旧说。
      Tully 据 2005 年野分舰长古贺日记考订，舰首是最后没入水面的部分。
