# 苍龙 状态切片
# 2026-11-19 建。苍龙在 1942-06-04 一天之内从完好到弃舰。

ship: soryu
slices:
  - code: S00
    title: 订购与建造
    from: 1934-11-20
    to: 1937-12-28
    note: >-
      1934-11-20 开工；承造 呉海軍工廠（Kure Naval Arsenal）（広島県呉（Kure, Hiroshima））；1935-12-23 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: S0
    title: 服役至珍珠港前
    from: 1937-12-29
    to: 1941-11-25
    note: >-
      竣工状态。右舷前部小型舰岛（与驱逐舰舰桥同规模，装在右舷外伸平台上，
      不占用飞行甲板宽度），全平衡双舵。
      25mm 连装 14 基 28 挺，其中 3 基在舰首（日本航母首次在舰首装炮）。
      12.7cm 连装高角炮 6 基 12 门。无雷达。
      1938 年参加广东攻略作战；1941-03 与驱逐舰夕月碰撞，舰首撞入对方左舷中部。

  - code: S1
    title: 珍珠港至印度洋
    from: 1941-11-26
    to: 1942-05-26
    note: >-
      1941-11-22 抵单冠湾，11-26 出击。
      12-07 珍珠港：第一波 8 架 B5N 鱼雷 + 10 架 B5N（800kg 弹）+ 8 架 A6M；
      第二波 18 架 D3A + 9 架 A6M。损失 5 架（3 零战 + 2 舰爆，全在第二波）。
      12-16 与飞龙分遣攻威克岛。1942 年转战安汶、达尔文、印度洋，
      04-05 科伦坡、04-09 亭可马里参与击沉竞技神号。

  - code: S2
    title: 中途岛·战没
    from: 1942-05-27
    to: 1942-06-04
    note: >-
      1942-05-27 06:00 从柱岛出击参加 MI 作战。
      06-04（当地）04:30 第一波：18 架 D3A + 9 架 A6M。
      06:34 攻击 Sand/Eastern 两岛，1 架被击落。
      08:50-09:10 收回中途岛攻击队。
      10:25-10:26 被约克城 VB-3 的 13 架 SBD 攻击，命中 2 弹
      （一在前升降机、一在第二升降机后方），引发大火与诱爆。
      10:29 第 3 发 1,000 磅炸弹命中舷侧烟囱处，穿透至下层机库爆炸，
      炸断锅炉舱蒸汽管。10:40 失速停船、开始左倾。
      10:45 柳本舰长下令非必要人员离舰，本人拒绝离舰、留在右舷信号塔。
      19:12 磯風发射 3 条鱼雷，3 分钟后舰尾下沉、翻覆。
      战死 718 名（柳本舰长以下准士官以上 35 + 下士官兵 683）。
