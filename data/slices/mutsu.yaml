# ============================================================================
# 状态切片：陸奥（Mutsu）
# ----------------------------------------------------------------------------
# 切片只描述「这艘舰的外形与配置在某段时间里是什么样」，边界落在
# ships/mutsu.yaml 里真实存在的 fact 时间窗上。
#
# 陆奥的外形变化主线：
#   船台 → 竣工（带防雷网撑杆，本级唯一）→ 1920s 舰首加高、烟囱改造、弹射器
#   → 1932-33 防空换装 + 测距仪 + 探照灯塔 → 1934-36 大改装（与长门同批但晚 8 个月完工）
#   → 1938-12 换 25 mm → 1943-06-08 爆沉。
#
# 与长门的关键差别（模型与画图时最容易搞错的三处）：
#   1) **陆奥没有雷达**。舰龄停在 1938 年的防空水平，一挺 25 mm 都没再加。
#   2) 竣工时带防雷网撑杆（anti-torpedo net booms），长门没有——navweaps 的
#      照片注文专门点出「something that the British had abandoned during World War I」。
#   3) 大改装完成于 1936-09-30，比长门晚 8 个月，故 1936 年内两舰状态不同步。
# ============================================================================

ship: mutsu

slices:
  - code: P0
    title: 船台建造（1918-06 至 1921-10）
    from: 1918-06-01
    to: 1921-10-23
    note: >-
      1918-06-01 在横须贺海军工厂开工，设计师是造船中佐（后造船中将）山本嘉三。
      1920-05-31 15:00 下水，典礼由贞明皇后（后称贞明皇太后）携其长子、
      海军中佐皇太子裕仁（后来的昭和天皇）出席——两舰下水礼里规格最高的一次。
      舾装期遇到一个具体障碍：西屋电气公司（Westinghouse Electric Co.）没能按期交付
      本舰订购的汽轮机减速齿轮，只好在吴海军工厂另造一套（TROM 作者注 [1]，
      引 Okumoto 2011, p. 155）。这是本舰比长门多造 55 天的原因之一。

  - code: P1
    title: 竣工原貌（1921-10 至 1927-01）
    from: 1921-10-24
    to: 1927-01-31
    note: >-
      竣工状态与长门基本同型，但有一处独有特征：**舰上带防雷网撑杆**
      （anti-torpedo net booms）。navweaps 41 cm 页的陆奥照片注文专门指出：
      「Battleship Mutsu as completed ca 1922. Note that she had anti-torpedo net booms,
      something that the British had abandoned during World War I.」
      —— 即到 1922 年还在用一战前的防雷网，而不是防雷突出部。
      1922-05~05-30 在佐世保改装：前烟囱加弧形挡烟板（比长门的那块略厚），
      舰尾带一个 Caquot 式系留气球。1924-12 又在佐世保把气球撤掉。
      1924-05~06 前桅重建：在前舰桥测距仪甲板下段加目标测绘站、主炮指挥所重建；
      同一时期可能换了全部主炮炮管、升级了主炮指挥仪（TROM 用「Probably」，
      故这一项不作 fact）。

  - code: P2
    title: 1920 年代后期小改（1927-01 至 1932-01）
    from: 1927-02-01
    to: 1932-01-31
    note: >-
      1927-01-20~05-28 佐世保：为减少大浪中的上浪，舰首加装一段 2 米长的舷弧（sheer section）；
      主桅右舷桁端加强以支撑外伸式吊机臂；搭载 1 架横厂 E1Y2 一四式水上侦察机。
      —— 这是本舰外形上一个容易漏掉的细节：**舰首比长门同期略高**。
      1927-09-12~09-30 在横须贺改装为「御召舰」（天皇检阅用舰），
      1927-10-20 横滨湾观舰式上天皇以本舰为座舰。
      1928-10~1929-02 佐世保：装一号扫雷具（paravanes）与 L 型水听器。
      1923-11~12 佐世保另换过一次后掠式前烟囱（换装日期各源不同，
      TROM 作者注 [2] 明确说明「Different sources provide different dates」，
      最终按石桥孝雄《図解 日本海軍艦艇データ》p.542 的时间框）。

  - code: P3
    title: 1932-33 防空与火控改装（1932-02 至 1934-08）
    from: 1932-02-27
    to: 1934-08-31
    note: >-
      佐世保，1932-02-27 至 1933-01-30。这是本舰第一次大改：
      全部 8 cm/40 高角炮拆除，换 4 座双联 12.7 cm/40 八九式 + 2 座双联 40 mm 维克斯机炮
      （navypedia 把这 40 mm 记成 2 座单装，两说并列）。
      两座背负式主炮塔（二番、三番）各装 10 米双联测距仪；
      前烟囱后方的探照灯塔改建成格构式，装 4 具 110 cm 探照灯（从桅上移下来）；
      主桅与三番炮塔之间装吴式二号三型改二中线弹射器；
      搭载 3 架中岛 E4N2 二型水上侦察机。
      1933-11~12 又在佐世保装 2 具九一式高射装置，配 4.5 米 Barr & Stroud 体视式测距仪，
      装在烟囱平台——这是本舰与长门的一处时间差：**陆奥先改，长门同期无对应记载**。

  - code: P4
    title: 第一次大改装（1934-09 至 1936-09）
    from: 1934-09-05
    to: 1936-09-30
    note: >-
      横须贺海军工厂，1934-09-05 至 1936-09-30。内容与长门 1934-36 那次同批，
      但**完工晚 8 个月**，故 1936 年内两舰不同步（这是本级最实质的差异之一）：
      舰体尾部加长（全长 215.8 → 224.9 m）、加防雷突出部、拆除全部鱼雷发射管、
      加厚弹药库与机舱上方水平装甲、拆除前烟囱、20 座原锅炉全换（10 座重油专烧）、
      汽轮机现代化、上层建筑重建。
      主炮：换成原本为加贺/土佐准备的新炮座，仰角由 +30° 提到 +43°，
      炮塔正面/侧面/顶盖与炮座装甲加强；14 cm 副炮由 20 门减到 18 门、仰角提到 35°。
      航空：装吴式二号五型弹射器与折叠吊车，1936-07-11 又换成二号五型改一，
      左舷加 4 吨折叠吊车，搭载 3 架中岛 E4N2。
      1936-07-27 试航实测 25.283 节（设计 25 节）。

  - code: P5
    title: 大改装后至爆沉（1936-10 至 1943-06-08）
    from: 1936-10-01
    to: 1943-06-08
    note: >-
      本舰外形定格于此，此后六年半几乎没有变化——这一点与长门截然相反。
      1937-03-28 横须贺：加装闭式循环气流式防毒气装置与洗消淋浴。
      1937-08 前后搭载 3 架中岛 E8N 九五式水上侦察机。
      1938-12-15 转入预备舰做防空强化：拆 40 mm 维克斯机炮，换 10 座双联 25 mm（20 门）；
      机载改为 1 架川崎 E7K2 九四式 + 3 架中岛 E8N2 九五式。
      **这就是她的最终防空配置，到沉没为止一挺没加过。**
      1943-01-29~02-06 横须贺第 5 船渠：清洗舰底，机载改为 2 架三菱 F1M2 零式水上观测机。
      1943-06-08 1213 停泊于柱岛与周防大岛之间的旗舰浮标时，三番炮塔弹药库爆炸，
      舰体断为两截：前部 535 英尺段向右舷倾覆迅速沉没、以宝塔式舰桅着底；
      后部 147 英尺段直立上浮，至 06-09 约 0200 才沉（33-58N, 132-24E，水深约 130 英尺）。
      —— 一艘外观停留在 1938 年、六年间几乎没动过的战列舰，就这样在内海泊地结束了。

  - code: P6
    title: 沉没之后：除籍、隐瞒与战后打捞（1943-06 起）
    from: 1943-06-09
    to: 1949-06-20
    note: >-
      本片不是「舰的状态」，而是**沉没之后发生在她名下的事**，与
      `data/slices/ark-royal.yaml` 的 P7 同一体例。
      1943-07-22 潜水员报告舰体「弯得像一枚断钉」，海军一度拟打捞拖回吴港入坞、
      三个月后重返战列，派改装的六人小型潜艇下去查看时挂住栏杆、艇上军官几乎窒息，
      最终判定无法打捞。
      随后展开大规模隐瞒：回收一切可能暴露舰名的漂浮物；无线电里偶尔仍用她的呼号
      伪造其在远方活动的假象；幸存者被分散调往塔拉瓦、马金、夸贾林，约 150 人送塞班，
      1944 年美军进攻马里亚纳时几乎全部阵亡。1943-09-01 从海军舰船名册除名。
      战后 1950 年代起多次打捞作业，1970–1972 年大规模打捞，
      遗物（主炮、螺旋桨、主舵、主锚）现存吴市海事历史科学馆等处。
      残骸至今仍在广岛湾海底，水深约 40 米。
