# ============================================================================
# 状态切片：印第安纳波利斯号（USS Indianapolis, CA-35）
# ----------------------------------------------------------------------------
# 7 片，边界全部落在 ships/indianapolis.yaml 与 classes/portland.yaml
# 真实存在的 fact 时间窗上，不落在猜出来的日期上。
#
# 本舰生涯的结构很干净：1932-11-15 服役 → 1945-07-30 沉没，13 年。
# 前 9 年是「和平年代的旗舰 + 总统座舰」，外形几乎不动；
# 后 3 年半是四次改装（1942 初 / 1943-05 / 1944 末 / 1945-07）密集改外形。
# 所以切片在战前只切 2 段，战时切 5 段。
#
# ⚠️ 最后一片的 to 是 1945-07-30（舰体状态终点）。
#    那不是舰长的死亡日 —— McVay 生还。
# ============================================================================

ship: indianapolis

slices:
  - code: P0
    title: 建造与舾装（1930-03 至 1932-11）
    from: 1929-02-13
    to: 1932-11-14
    note: >-
      1929-02-13 是造舰订单日期（construction.order_date）——本舰的最早记录节点，
      故 P0 从此起算，否则 1929 那一年没有任何切片覆盖。
      1930-03-31 在 Camden 的 New York Shipbuilding 开工（船台号 399），
      1931-11-07 下水，命名人是参议员 Thomas Taggart 之女 Lucy Taggart。
      这一片没有「外形」可看，只有分段合拢的船壳与逐渐成形的上层建筑。
      **与姊妹舰的差异从这一步就开始了**：波特兰号在 Bethlehem, Quincy 建造
      （船台号 1430），本舰在新泽西 Camden。

  - code: P1
    title: 建成服役与和平年代旗舰（1932-11 至 1941-12）
    from: 1932-11-15
    to: 1941-12-06
    note: >-
      1932-11-15 在费城海军船厂服役，首任舰长 John M. Smeallie 上校。
      建成外形：三脚桅 + 两根直筒烟囱、前二后一三座三联装 8"/55、
      八座单装 5"/25 沿两舷排开、舯部两座弹射器与吊车、无鱼雷发射管。
      1933-11-01 起为侦察舰队旗舰，此后整个和平年代都是旗舰。
      1934-05-31 纽约外海大阅兵时罗斯福总统站在二号 8" 炮塔前 ——
      那是本舰最著名的一张战前照片（NH 688），也是这一片外形的标准像。
      1936-11-18 载总统出访南美。**防空与雷达在此片内基本未动**：
      12.7 mm 机枪仍是建成时的 8 座，雷达为零。

  - code: P2
    title: 开战与首次改装（1941-12 至 1942-12）
    from: 1941-12-07
    to: 1942-12-31
    note: >-
      珍珠港事变时正在约翰斯顿岛做模拟炮击演习。这一片的外形变化是
      **开战后的第一次改装（1942 年初）**：拆掉 8 座 12.7 mm/90 机枪，
      换上 4 座四联装 1.1"/75（28 mm）与 12 座单装 20 mm 厄利孔，
      桅顶加 SC 对空搜索雷达、Mk 3 主炮火控与 Mk 4 副炮火控。
      战斗记录：1942-02-20 拉包尔以南首战（18 架双发轰炸机，16 架被击落）、
      1942-03-10 莱城-萨拉马瓦突袭，随后回 Mare Island 改装、护航一船团去澳洲，
      再北上阿留申。1942-08-07 炮击基斯卡。

  - code: P3
    title: 第二次改装与阿留申（1943-01 至 1943-10）
    from: 1943-01-01
    to: 1943-10-31
    note: >-
      1943-05-01 从 Mare Island 出厂（第二次战时改装），照片留存最密集的一段。
      外形变化：**1.1"/75 四联装全拆，换 4 座四联装 40 mm 博福斯**；
      拆 1 座弹射器；SC 雷达拆除，换 SG（水面搜索）与 SK（对空搜索）；
      后桅 Mk 33 指挥仪上加 Mk 4 雷达天线；新建后桅、新设舷侧舱门、
      前烟囱出现星形铆钉排列、舯部加装探照灯。
      战斗记录：1943-01 支援阿姆奇特卡登陆；1943-02-19 夜战击沉货船赤金丸；
      1943-05 参加阿图岛作战，随后是基斯卡（日军已在浓雾中撤空）。

  - code: P4
    title: 第五舰队旗舰（1943-11 至 1944-10）
    from: 1943-11-01
    to: 1944-10-18
    note: >-
      1943-11-10 以第五舰队旗舰身份从珍珠港出航，参加 Galvanic（吉尔伯特）。
      这一片是本舰火力与指挥设施最完整的时期，但**外形变化主要在雷达**：
      1944-03-21 定型 Measure 32 / Design 7D 迷彩（与姊妹舰同穿），
      1944-05-01 改装后照片可见「pattern camouflage」。
      战斗记录：1943-11-19 塔拉瓦、11-20 马金；1944-01-31 夸贾林；
      1944-03/04 帕劳-雅浦-乌利西-沃莱艾；1944-06-15 塞班、06-19 菲律宾海海战；
      06-23 回塞班、06-29 天宁岛；关岛阿普拉港（开战以来第一艘进港的军舰）；
      1944-09-12 至 09-29 佩莱利乌。

  - code: P5
    title: 第三次改装：Measure 22（1944-10 至 1945-04）
    from: 1944-10-19
    to: 1945-04-30
    note: >-
      Mare Island 改装 1944-10-19 至 12-10。外形变化是本舰最大的一次：
      **12 座单装 20 mm 全拆，改为 8 座双联装 20 mm；加 2 座四联装 40 mm
      （总数达 6 座 24 管）**；拆 Mk 3 / Mk 4 雷达，加 Mk 8 主炮火控与
      Mk 18 副炮火控；加装 Mk 34 主炮指挥仪（1944-12-07 照片可见「newly-fitted
      MK 34 gun director」）；前烟囱加「whip」天线；三脚主桅顶装 SK 天线。
      涂装 1944-12-09 改喷 **Measure 22**（海军蓝渐变色），此后到沉没未见再改的记载。
      战斗结局的伏笔在 1945-03-31：冲绳外海被一架单发特攻机撞中，
      炸弹穿透甲板、住舱、燃油舱，从舰底穿出后在水下爆炸，炸出两个大洞，
      9 人死；螺旋桨轴受损、燃油舱破裂、制水设备报废，仍自力横渡太平洋回厂。

  - code: P6
    title: 最后状态与最后航程（1945-05 至 1945-07-30）
    from: 1945-05-02
    to: 1945-07-30
    note: >-
      Mare Island 大修 1945-05-02 至 07-12（出厂照 19-N-86911 摄于 07-10）。
      **这是本舰外形记录最完整的一段**，也是模型制作者唯一该参照的状态：
      三脚前桅顶 Mk 34 指挥仪上加 **Mk 13 雷达**；**右舷弹射器拆除，只剩左舷 1 座**；
      艉部 6 座四联装 40 mm 与 8 座双联装 20 mm 全部在位；
      机库内为 **SC-1 水上飞机**（3 架）。
      7 月 16 日从旧金山出发执行绝密运输任务（载的是原子弹的「部件集合」，
      不是整颗弹，铀靶件走空运），07-19 过珍珠港，07-26 抵天宁岛，
      07-28 从关岛单独出航，07-30 沉没。
      ⚠️ 本片的 to 是**舰体状态的终点**，不是舰长的终点 —— McVay 生还。
