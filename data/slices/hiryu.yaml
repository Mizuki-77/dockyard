# 飞龙 状态切片
# 2026-11-19 建。飞龙是中途岛当天唯一还能反击的航母——它的切片价值就在这里。

ship: hiryu
slices:
  - code: H00
    title: 订购与建造
    from: 1936-07-08
    to: 1939-07-04
    note: >-
      1936-07-08 开工；承造 横須賀海軍工廠（Yokosuka Naval Arsenal）（神奈川県横須賀（Yokosuka, Kanagawa））；1937-11-16 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: H0
    title: 服役至珍珠港前
    from: 1939-07-05
    to: 1941-11-25
    note: >-
      竣工状态。左舷中央舰岛（日造航母仅赤城与本舰如此），比苍龙多一层
      （4 层 5 甲板）。半平衡式单舵（苍龙为全平衡双舵）。
      25mm 三联装 7 基 + 双联装 5 基 = 31 挺。12.7cm 连装高角炮 6 基 12 门。
      九一式爆雷 6 个。无雷达。
      1940-12-09 起为第二航空战队旗舰。

  - code: H1
    title: 珍珠港至印度洋
    from: 1941-11-26
    to: 1942-05-26
    note: >-
      1941-11-26 出击。12-07 珍珠港：第一波 8 架 B5N 鱼雷 +
      10 架 B5N（800kg 弹）+ 6 架 A6M。其中楠美正少佐的水平轰炸队投下的
      八〇番弹引爆了亚利桑那号前部弹药库（约 08:06-07）。
      12-16 与苍龙分遣攻威克岛。1942 年转战安汶、达尔文、印度洋。
      03-01 舰爆重创美驱逐舰 Edsall、击沉油船 Pecos。
      04-05 科伦坡、04-09 亭可马里参与击沉竞技神号。
      04-22 返佐世保入坞大修。05-15 二航战旗舰旗由苍龙移来。

  - code: H2
    title: 中途岛·最后的反击
    from: 1942-05-27
    to: 1942-06-05
    note: >-
      1942-05-27 从柱岛出击。06-04（当地）04:30 第一波：
      18 架 B5N（友永丈市大尉指挥）+ 9 架零战。
      06:34 攻击 Sand 岛，损失惨重（2 架被战斗机击落、1 架被高炮击落、
      1 架重伤迫降、1 架返航途中迫降、5 架报废）。
      10:25 前后赤城、加贺、苍龙相继起火时飞龙未受损——
      因左舷舰岛导致的航行序列，它向三舰左舷方向脱离并躲进飑区，
      避开了第一轮俯冲轰炸。这艘船因此成为当天唯一还能反击的航母。
      10:54 单舰反击：18 架 D3A（小林道雄大尉）+ 6 架零战，攻击约克城。
      12:00 前后命中约克城 3 弹（日方记录 6 弹），重创。
      13:30 第二波：10 架 B5N（含 1 架赤城机）+ 6 架零战（含 2 架加贺机），
      14:38 遭野猫突袭损失 4 架，2 架命中约克城（炸坏 3 座锅炉、全舰断电）。
      16:30 山口多闻电告南云，拟黄昏发第三波；南云令舰队西撤。
      17:03 企业号 + 约克城 SBD 共 13-24 架俯冲，命中 4 发 1,000 磅炸弹。
      首弹掀飞前升降机砸向舰桥（反成防爆墙护住了舰桥），前半个飞行甲板塌入机库。
      21:23 主机停转。次日 03:15 下令弃舰，山口多闻、加来止男留舰。
      05:10 巻雲发射 1 条鱼雷处置。09:12 舰首下沉、翻覆沉没，带走 389 具遗体。
      残存 39 人乘 cutter 漂流 14 天，被 PBY 发现后由 USS Ballard 救起（漂流中 5 人死亡）。
