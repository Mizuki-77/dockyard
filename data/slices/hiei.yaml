ship: hiei
slices:
- code: P0
  title: 建造与竣工（1911-1914）
  from: '1911-11-04'
  to: '1914-08-04'
  note: >-
    1911-11-04 在横须贺海军工厂开工（以「仮称卯号装甲巡洋艦」名义动工），
    1912-11-21 下水，1914-08-04 竣工。它是日本第一艘国产超弩级战列舰，
    四舰里唯一由海军工厂建造的一艘；但材料大半自维克斯订购（navypedia 记
    约 30% 材料与设备向国外订购），combinedfleet 与日文来源均如此记载。
    主炮为日产 41 年式 35.6 cm 连装 4 座 8 门——与金刚的英造 43 年式型号不可互换。
    本舰与金刚的外形差异：1 号烟囱加长、1、2 号烟囱位置后移。
- code: P1
  title: 一战与战间（1914-1929）
  from: '1914-08-05'
  to: '1929-10-14'
  note: >-
    服役后编入第三战队。1923-12-01 在吴改装：主炮仰角由 20 度提到 33 度
    （navypedia 记全级 1923-1925 年由 25 度提到 33 度，起点角度两说并列），
    前桅重建。1927 年 10 至 11 月在佐世保改装：设 2 架一四式（E1Y）水侦的
    设备但没有弹射器。此期仍为 36 座锅炉、Parsons 2 台 4 轴、
    8 具 53.3 cm 水中鱼雷发射管。
- code: P2
  title: 練習戦艦（1929-1933）
  from: '1929-10-15'
  to: '1932-12-31'
  note: >-
    1929-10-15 在吴解除武装、改为练习舰，以规避华盛顿条约下的报废：
    拆舰尾 14 英寸炮塔与全部鱼雷发射管、拆舷侧装甲带与全部 6 英寸炮、
    36 座锅炉中拆 25 座、降速、撤全部航空设备、烟囱由三根减为两根。
    1932-12-31 工程完成：标准排水量 19,500 t、吃水 6.3 m、18 节、16,000 马力，
    主炮 3 座 6 门（4 号炮塔原位加 500 t 压载），锅炉 11 座
    （ロ号艦本式混烧 6＋重油专烧 5）——**这 11 座属于本期，不是改装后的数**。
    舷侧装甲此期记为已拆除（0 mm）。
- code: P3
  title: 御召舰与练习舰队（1933-1937）
  from: '1933-01-01'
  to: '1937-03-31'
  note: >-
    1933-01-01 正式定级練習戦艦。1933-05-31 至 07-20 在横须贺改造为御召舰：
    设展望台与御座所、扶手以白绢包裹。此后承担观舰式与皇室航行，
    1935-11-06 供奉天皇鹿儿岛、宫崎行幸。1934-01-26 起做 4 号炮塔位的
    复原与弹药库工程，1935-03-31 完成。火力极弱、无鱼雷、18 节，
    是四舰里唯一走过这一形态的一艘。
- code: P4
  title: 1940 年大改装与复归战列舰（1937-1940）
  from: '1937-04-01'
  to: '1940-01-31'
  note: >-
    1937-04-01 在吴开始大改装，1940-01-31 完成——把其他金刚型分两次做的改装
    一次做完，比榛名的 1934-09-30 晚 5 年 4 个月。结果：锅炉 8 座重油专烧
    舰本式（不是 11 座；navypedia 记 11 座，两说并列）、艦本式齿轮传动涡轮
    4 台 4 轴、136,000 马力、29.7 节、标准排水量 32,350 t（四舰里最大）、
    全长 222.05 m、水线下幅 31.97 m；主炮仰角 43 度、副炮减为 14 门仰角 30 度、
    12.7 cm 八九式连装高炮 4 座 8 门、25 mm 连装 10 座 20 挺、
    13 mm 四连装 2 座 8 挺；弹射器 1 座（型号未获取）于 3 号炮塔后方中线。
    舰桥为塔型，是四舰里唯一，且为大和型舰桥的试验原型。
- code: P5
  title: 开战到印度洋（1940-02-1942-07）
  from: '1940-02-01'
  to: '1942-07-13'
  note: >-
    1940-10-11 作为御召舰参加帝国观舰式。开战时第三战队第一小队为比叡＋雾岛，
    随三川支援部队参加珍珠港作战（本舰任通信中枢，无线电发射设备被拆除）。
    1942-03-01 追击并击沉美军驱逐舰埃兹尔号，全战打出 210 发 14 英寸弹与
    70 发 6 英寸弹——日文来源记这是太平洋战争中日本战列舰首次击沉敌舰。
    中途岛时第一小队为金刚＋比叡，本舰未受损。
- code: P6
  title: 第十一战队与所罗门（1942-07-1942-11-12）
  from: '1942-07-14'
  to: '1942-11-12'
  note: >-
    1942-07-14 比叡（旗舰）与雾岛转隶第三舰队、编成阿部弘毅的新第十一战队；
    同日金刚与榛名编入第三战队，四舰自此分成两对。舰载机改为 1 架零式水侦
    （E13A1）＋2 架零式观测机（F1M2），尾码 CIV-x 红色。
    1942-08-24 东所罗门海战、10-26 南太平洋海战均在本队但未受损；
    09-23 降落 1 架水侦与 1 架观测机。11-10 自肖特兰出发执行瓜岛增援。
    此期武备与雷达状态未变：12.7 cm 4 座 8 门、25 mm 20 挺（终生未增装）、
    雷达未获取。
- code: P7
  title: 瓜岛第一次夜战、自沉与除籍（1942-11-13-1942-12-20）
  from: '1942-11-13'
  to: '1942-12-20'
  note: >-
    0150 与晓号开探照灯照亮亚特兰大号，混战开始；0154 在 2,500 码上向
    旧金山号开火，只打出两轮齐射即被 2 发 8 英寸弹命中（最可能来自旧金山号），
    一发自右舷舰尾穿入，进水使操舵装置失效；全战吃 30 发 8 英寸弹与多枚
    5 英寸弹，火控全毁、上层建筑起火。天亮后承受 70 架次空袭，
    被 1 发 500 磅弹、多条鱼雷命中，应急舵丢失、右倾、舰尾下沉。
    1530 阿部下令弃舰，西田正雄舰长下令打开金斯顿阀自沉；1838 山本
    「不得处置」的电令到得太晚。1900 至次日 0100 舰尾下沉于萨沃岛约 4.5 海里处
    （09-04S、159-45E，为日方记录值）。阵亡 188、伤 151。
    1942-12-20 第十一战队解队、从海军籍除籍；阿部弘毅被解除指挥、
    西田正雄转入预备役。
    它是日本海军在太平洋战争中第一艘沉没的战列舰（早于同队的雾岛两天）。
    死因三说并存不裁决：自沉（开金斯顿阀）、navypedia 的「被护航舰处置」、
    Tully 的「自沉多余，即使不自沉也会沉没」。
