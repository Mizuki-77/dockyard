ship: musashi
slices:
- code: P0
  title: 计划与船台建造（1937 至 1940-10）
  from: '1937'
  to: 1940-10-31
  note: 1938-03-29 09:55 在三菱长崎造船所 2 号船台开工，船体番号 800， 代称「第二号艦」。船台上方自龙门吊垂下棕榈纤维绳幕遮挡外国船视线， 佐世保海军区部为此购入约 400 吨棕榈纤维。此阶段只有分段合拢的船壳。 1937 年为造舰计划立项与订购（construction.order_date），作为时间轴起点。
- code: P1
  title: 下水与舾装（1940-11 至 1942-05）
  from: 1940-11-01
  to: 1942-05-25
  note: 1940-11-01 08:55 极秘下水式，海军大臣及川古志郎主持、伏见宫博恭王代表皇室； 入水后即以客货船春日丸靠帮遮挡舰影。1941-10-06 给兵舰樫野自吴运来第一批 46 cm 炮与一座炮塔（上舰后以帆布遮盖），至 1941-12-08 全部主炮装完。 1942 年 2 至 3 月改建参谋设施：作战室、电话室、密码室扩大， 幕僚住舱与办公室数处由左舷移至右舷。
- code: P2
  title: 第 4 船坞加装围壁装甲与公试（1942-05 至 1942-07）
  from: 1942-05-26
  to: 1942-07-26
  note: 1942-05-26 至 06-09 入吴第 4 船坞，为两座背负式副炮塔（一号、四号） 加装 28 mm 围壁装甲——同项改装大和要等到 1943-07-12，武藏早约一年。 1942-06-22 过载公试：70,358 吨、167,310 轴马力、28.05 节， 随后试运转注水系统后返吴。此时无雷达，无 25 mm 增备。
- code: P3
  title: 竣工状态（1942-07 至 1942-09）
  from: 1942-07-27
  to: 1942-09-02
  note: 1942-07-27 前完成首次防空强化：增设 4 座三联无防盾 25 mm（12 门）， 装于 15.5 cm 舷侧炮塔前后的天甲板上、每舷两座。 1942-08-05 09:00 服役，入横须贺镇守府籍、联合舰队第一战队。 竣工配置：3×3 46 cm/45 九四式、4×3 15.5 cm/60 三年式、 6×2 12.7 cm/40 八九式（12 门）、12 座三联 25 mm（36
    门）、 2 座双联 13.2 mm（4 门）；两座弹射器，水上机 6 架（另一说 7 架）。 无雷达。
- code: P4
  title: 二一号电探上舰与旗舰时期（1942-09 至 1944-04）
  from: 1942-09-03
  to: 1944-04-26
  note: 1942-09-03 进吴舣装，把改进型二一号电探（Type 21 Mod 3，对空搜索） 装到前桅楼测距仪臂上——比大和早约十个月。同年 10-28 试航中雷达显示器 被主炮爆风震坏；11-28 在周防滩做第二次电探射击试验，本舰方位精度被判不佳。 1943-02-11 在特鲁克接替大和为联合舰队旗舰；04-23 山本遗骨运抵秘密安置； 05-17 至 05-22 运山本遗骨回东京（木更津湾法事）；06-24
    天皇行幸 （11:03–14:25 登舰，极秘但升天皇旗）。这一年间外形无大改： 仍是 36 门 25 mm、12 门 12.7 cm，只有一部二一号电探。
- code: P5
  title: 1944-04 大改装（1944-04 至 1944-07）
  from: 1944-04-27
  to: 1944-07-01
  note: 外形变化最大的一次。撤去舷侧 15.5 cm 三联装二号、三号炮塔 （副炮由 12 门减为 6 门，只剩前部一座与后部一座）， 每舷改为三座三联无防盾 25 mm；另加 16 座三联与 25 座单装， 25 mm 总数达 115 门（30 座三联、25 门单装）；增设 2 部二二号对海电探与 2 部一三号对空电探；撤去 7、8 号 150 cm 探照灯及其实射击指挥装置 （后移设佐世保防空炮台）。因防空炮组扩大，增设第
    6（前部）与 第 7（舰尾）防空炮术分队。 **与大和的关键差别**：六座双联 12.7 cm 的增装未实施， 武藏到沉没仍是六座双联 12.7 cm（12 门），大和改装后是 12 座（24 门）。
- code: P6
  title: 1944-07 电探升级与 25 mm 再增（1944-07 至 1944-10）
  from: 1944-07-02
  to: 1944-10-17
  note: 二二号对海电探换成二二号改四（具备有限射击管制能力）； 另装 5 座三联 25 mm，总数达 130 门（35 座三联、25 门单装）。 最终防空构成为 12 门 12.7 cm、130 门 25 mm、6 门 15.5 cm。
- code: P7
  title: 莱特湾出击与沉没（1944-10）
  from: 1944-10-18
  to: 1944-10-24
  note: 1944-10-18 为圣贝纳迪诺海峡夜战突破紧急涂布黑甲板迷彩——与大和不同， 武藏只涂了部分上甲板；10-20 猪口又下令给舰体与炮塔侧面涂暗灰色调迷彩。 10-22 08:00 自文莱出击，在舰 2,417 人（本舰编制 2,399 人）。 10-23 接收摩耶幸存者 769 人。 10-24 全天六波空袭（10:29、12:04、13:31、14:20、14:55、15:25
    开始）； 至 16:21 已是 10 度左倾、舰首埋水超过 26 英尺、艏楼甲板上浪； 19:36 向左倾覆、舰首向下沉没。
