ship: kirishima
slices:
- code: P0
  title: 建造与竣工（1912-1915）
  from: '1912-03-17'
  to: '1915-04-19'
  note: 1912-03-17 在三菱长崎开工，1915-04-19 竣工。日本民间船厂建造的首艘战列舰。
- code: P1
  title: 一战与战间（1915-1930）
  from: '1915-04-20'
  to: '1930-04-15'
  note: 与榛名同期服役。
- code: P2
  title: 第一次大改装（1930-1936）
  from: '1930-04-16'
  to: '1936-06-08'
  note: 1930-04-16 开始第一次大改装，1936-06-08 完成、转入预备舰。比榛名晚约 20 个月。
- code: P3
  title: 太平洋战争前期（1936-06-1942-07）
  from: '1936-06-09'
  to: '1942-07-14'
  note: 中途岛时属第 3 战队第 2 小队，未接敌。
- code: P4
  title: 所罗门与沉没（1942-07-1942-11-15）
  from: '1942-07-15'
  to: '1942-11-15'
  note: 1942-11-13 起参与瓜岛第二次夜战。11-15 被 USS Washington 击中，凌晨倾覆沉没。这是太平洋战争第一场战列舰对轰。沉没时该舰没有雷达。
