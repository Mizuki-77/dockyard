# 加贺 状态切片
# 2026-11-19 建。加贺与赤城同病（三段甲板），但它是战列舰底子、更慢更重载机更多。

ship: kaga
slices:
  - code: K0
    title: 竣工·三段甲板
    from: 1928-03-31
    to: 1934-06-30
    note: >-
      三段式飞行甲板：上段 171.30 × 30.48 m（着舰+起飞主甲板）、
      中段 15.0 × 25.0 m（仅够轻机）、下段 55.02 × 24.38 m（大型机）。
      无岛式舰桥，但有**横贯全宽的大舰桥压在中段甲板前端**——
      正是它把中段甲板吃掉的元凶。
      主炮 20cm 单装 6 门；高角炮 45 口径 12cm 十年式连装 6 基 12 门；
      13mm 连装机枪 4 基 + 留式机枪 2 挺。无雷达。
      28 节，是四艘中途岛日军航母里最慢的。

  - code: K1
    title: 大改装中
    from: 1934-07-01
    to: 1935-06-24
    note: >-
      入佐世保工厂大改装：三段甲板拆除、改单段全通甲板、
      加装右舷岛式舰桥、加装防雷鼓包。
      动力由 91,000 hp / 26.7 节提升到 127,000 hp / 28.34 节（**仍只有 28 节**）。

  - code: K2
    title: 改装后·右舷岛
    from: 1935-06-25
    to: 1941-11-25
    note: >-
      改装完成。单段全通甲板 248.6 m，三层机库，**载机 90 架**
      （中途岛四艘日军航母里最多）。右舷舰岛（与赤城的左舷相反）。
      **高角炮换装 40 口径 89 式 12.7cm 连装 8 基 16 门**——
      这是与赤城最大的武备差别，赤城至死保留 12cm 十年式。
      25mm 九六式连装 11-14 基（22-28 挺，两说）。6.5mm 十一式轻机枪 6 挺。
      1935 年编入第二航空战队。1937 年起参加中日战争。

  - code: K3
    title: 珍珠港至触礁修理
    from: 1941-11-26
    to: 1942-05-26
    note: >-
      1941-11-26 出击珍珠港。12-07：第一波 8 架 B5N 鱼雷 +
      10 架 B5N（800kg 弹）+ 9 架 A6M；第二波 18 架 D3A + 9 架 A6M。
      **1942-02-09 在帕劳触礁**（撞上珊瑚礁），舰底受损。
      03-22 返佐世保进坞修船。
      **因此错过了印度洋作战（Operation C）、杜立特追歼、珊瑚海。**
      03-13 已被解除机动部队编成。

  - code: K4
    title: 中途岛·战没
    from: 1942-05-27
    to: 1942-06-04
    note: >-
      1942-05-27 从柱岛出击参加 MI 作战。
      06-04（当地）04:30 第一波攻击中途岛：18 架 D3A + 9 架 A6M。
      **10:22 被企业号 VB-6 与约克城 VB-3 的 SBD 俯冲轰炸命中多弹**
      （加贺是当天第一个被击中的日军航母，比赤城早几分钟）。
      命中点集中在前部与中部，引发航空燃油与弹药连锁爆炸。
      舰长冈田次作以下大批军官阵亡。
      **19:25 由驱逐舰萩风发射两枚鱼雷处分沉没**（当地时；日本时间 6/5 16:25）。
      日文维基另持「16:25 大爆炸致沉」说，与鱼雷处分说并列。
      战死 811 名——四艘里损失最惨重。
