ship: pensacola
slices:
- code: P0
  title: 建造与服役（1926-1930）
  from: '1926-10-27'
  to: '1930-02-06'
  note: 1926-10-27 在纽约海军船厂开工，1929-04-25 下水，1930-02-06 服役。主炮为 2 座三联 + 2 座双联共 10 门，布置在美国条约重巡里独一份。
- code: P1
  title: 战前（1930-1941-12）
  from: '1930-02-07'
  to: '1941-12-06'
  note: 1930 年代中期拆除鱼雷发射管。
- code: P2
  title: 开战至中途岛（1941-12-07-1942-06-13）
  from: '1941-12-07'
  to: '1942-06-13'
  note: 中途岛时属 TG 16.2，护卫企业号，6-04 1430 与文森斯一同被调去支援 TF 17。
- code: P3
  title: 所罗门与塔萨法隆加重伤（1942-06-14-1943-11）
  from: '1942-06-14'
  to: '1943-11-30'
  note: 1942-11-30 塔萨法隆加夜战中被鱼雷命中，舰尾重创、炮塔失效，自行返航。
- code: P4
  title: 大修与重返前线（1943-12-1945-09）
  from: '1943-12-01'
  to: '1945-09-02'
  note: 大修后重返前线。
- code: P5
  title: 战后与十字路口（1945-09-1948）
  from: '1945-09-03'
  to: '1948-11-10'
  note: 1948-11-10 作为靶舰（十字路口后续试验）沉没。
