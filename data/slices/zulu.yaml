# ============================================================================
# 状态切片：HMS Zulu（祖鲁人号，L18 → F18 → G18）
# ----------------------------------------------------------------------------
# 本舰分片的关键在 1941-06 的法尔茅斯改装与 1942 年的地中海战历。
# 注意 1942 年它换了三块战场（马耳他打击兵力 → 亚历山大 → 托布鲁克），
# 但配置没怎么变，所以按「部署位置」而不是「配置」切最后几片。
# ============================================================================
ship: zulu
slices:
  - code: P0
    title: 建造（1936-1938）
    from: 1936-08-10
    to: 1938-09-06
    note: >-
      1936-08-10 在 A. Stephen & Sons（Linthouse, Govan）开工，
      1937-09-23 下水，1938-09 完工。合同价 351,135 英镑。

      **本舰被定为该级的 lead ship**，naval-history 给的理由是建造速度：
      "Because of speedy construction achieved, she was nominated as Lead Ship
      for this Class." 下水时锅炉与烟囱已经装好，是速度快的原因之一。

      **下单日两说并列**：naval-history 写 1935-03-10（1935 年计划），
      uboat.net 写 1936-03-10。同批姊妹舰不可能一发 1935、一发 1936，
      单舰 fact 按 1936-03-10 登记，1935 视为程序年度。

  - code: P1
    title: 地中海分队（1938-09 至 1939-10）
    from: 1938-09-07
    to: 1939-10-01
    note: >-
      服役时舷号 L18，1938-12 改为 F18。编入第 2 部族驱逐舰分队，
      1938-11-18 抵马耳他加入分队。1939-04 分队改称第 4 驱逐舰分队。

      1940-02 曾因汽轮机故障在英格兰 Leigh 入干船坞修理并消磁，
      1940-03-09 回到现役。原计划参加挪威的 R4 计划（预防德军反应），
      实际德军先动手，本土舰队出海。

  - code: P2
    title: 本土海域与北海（1939-10 至 1941-05-21）
    from: 1939-10-02
    to: 1941-05-21
    note: >-
      以北海护航、拦截与本土舰队屏卫为主。1941-03-11 与 Cossack 一同
      为北方拦阻布雷的辅助布雷舰（Agamemnon、Port Quebec、Menestheus、
      Southern Prince）护航（行动 SN68B）。

      1941-05-22 在西部海口加入运兵船队 WS8B 担任近程护航。

  - code: P3
    title: 俾斯麦追击（1941-05-22 至 1941-05-28）
    from: 1941-05-22
    to: 1941-05-28
    note: >-
      05-26 奉命脱离船队，接替英王乔治五世号原有的驱逐舰屏卫。

      2350/26 遭俾斯麦 15 英寸主炮射击，前三群夹叉，1 名军官与 2 名士兵受伤，
      被迫大幅规避并失去接触。
      0100/27 重新发现俾斯麦（航向 340），0121/27 于 5,000 码齐射 4 条鱼雷
      —— **一次把全部鱼雷打光**，未见命中，判断从舰首前方通过。
      随后北撤以脱离其他驱逐舰。

  - code: P4
    title: 法尔茅斯改装（1941-06-10 至 1941-08）
    from: 1941-06-10
    to: 1941-08-08
    note: >-
      **本舰唯一一次大幅改装，也是它沉没时的配置雏形。**
      起因是推进机械缺陷造成过度振动，入法尔茅斯商业船厂调查，
      同时做改装：

      ① 主桅换成适配无线电测向（HF/DF）天线的新结构；
      ② 舰桥两舷各加 1 门单装 20 mm Oerlikon；
      ③ 装 285 型炮术火控雷达（主炮用）；
      ④ 深弹投射器移到艉甲板。

      1941-08-09 完成试航，08 月返斯卡帕湾。

      **20 mm 与 2-pdr 的记载冲突**：navypedia 把本舰与 Sikh 单列为
      「1941 年初 + 2 门单装 2-pdr」，其余同级舰为「+ 2 门 20 mm Oerlikon」；
      uboat.net 记 1941-07 四艘同级舰都是舰桥两舷 2-pdr。
      本片按 naval-history 的记载（20 mm Oerlikon）写，冲突并列于单舰 fact。

  - code: P5
    title: Force H 与马耳他运输（1941-08 至 1941-12）
    from: 1941-08-09
    to: 1941-12-31
    note: >-
      08-31 在克莱德加入 WS11 护航；09-05 与 Sikh 一同为北方拦阻布雷护航
      （SN5A）；随后调直布罗陀加入 Force H。

      参加了 Style II、Halberd（09-24 起，Force X 屏卫）、
      Callboy（10-16）、Perpetual I（11-10）等马耳他补给与飞机运送行动。

      11-13 方舟号（Ark Royal）被 U-81 雷击后，本舰先护送马来亚号返直布罗陀，
      再返回协助守候受创的方舟号，11-14 方舟号在拖带中沉没后返港。

      1941-12 转隶亚历山大的第 22 驱逐舰分队。

  - code: P6
    title: 马耳他打击兵力（1942-01 至 1942-06）
    from: 1942-01-01
    to: 1942-06-30
    note: >-
      作为第 22 驱逐舰分队（与 Sikh、Maori 同队）驻马耳他，
      袭击意大利—北非之间的轴心国补给船队。

      1942-02-07 与 Lively 一同巡逻，在西西里以西击沉两艘小型货船。
      02-13/14 参加 ME10 行动，接拖被炸伤的商船 Rowallan Castle，
      再遭轰炸后由 Lively 自行击沉。

      1942-03-22 第二次锡尔特湾海战：与优势意舰队周旋，
      **战后因高速机动产生结构损伤**，4 月入亚历山大船厂修理 ——
      这是本级「传统骨架」强度不足的直接证据。05 月恢复现役。

      1942-06-12 起参加 VIGOROUS 行动（亚历山大—马耳他运输），
      06-15 行动中止返航。

  - code: P7
    title: 东地中海与托布鲁克（1942-07 至 1942-09-14）
    from: 1942-07-01
    to: 1942-09-14
    note: >-
      07-08 月在叙利亚外海支援陆上作战与反潜巡逻；
      08-04 与 Sikh、Croome、Tetcott 及 RAF 221 中队一架飞机
      分享击沉 U-372 的战果（该艇 06-30 击沉了潜艇供应舰 Medway）。

      1942-09-11 搭载皇家海军陆战队分队，09-12 与 Sikh、Aldenham、
      Beaufort、Exmoor、Hurworth 一同航向托布鲁克，
      参加突袭行动（Operation Agreement）。

      **09-13/14 的经过（这是本舰与 Sikh 共同的一天）：**
      Sikh 被岸上探照灯照住并遭岸防炮连续命中，本舰先以舰首切入探照灯光束
      吸引火力，随后接拖 Sikh，拖缆两次被 88 mm 炮弹打断，Sikh 自沉。
      同日轻巡洋舰 Coventry 被炸起火后由本舰击沉（执行自沉，非战果）。

      返航途中 1600 被一枚敌机炸弹从舷侧穿入机舱爆炸，
      机舱、3 号锅炉舱与齿轮舱同时进水，舰立即停车、下沉两英尺；
      Croome 靠帮接走除拖带组以外的全部人员，Hursley 接拖；
      1900 前后在 32°00'N 28°56'E 翻沉，拖带组在敌机扫射后获救。

      伤亡：12 人阵亡、1 人受伤；失踪数两说（uboat.net 记 27、
      naval-history 记 24），并列不裁决。
