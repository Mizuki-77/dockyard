# ============================================================================
# 企业号 状态切片
#
# 2026-11-19 建。企业号服役近九年、经历多次改装，
# 但**中途岛（1942-06）是本次重点**，故切到 E4 就收；
# 之后再细化 1943-1945 的改装期。
# ============================================================================

ship: enterprise
slices:
  - code: E00
    title: 订购与建造
    from: 1933-08-03
    to: 1938-05-11
    note: >-
      1933-08-03 订购；1934-07-16 开工；承造 Newport News Shipbuilding & Dry Dock Co.（Newport News, Virginia）；1936-10-03 下水。
      这一段此前在时间轴上没有切片，拖动滑块时下方是空白的；
      补上后切片范围与 fact 的实际时间范围对齐。

  - code: E0
    title: 建成至战前
    from: 1938-05-12
    to: 1941-12-06
    note: >-
      服役状态。无雷达（CXAM-1 装机时间有争议，一说 1940 已装）。
      武备：5"/38 单装 8 座 + .50 机枪 24 门。
      涂装 Measure One（深灰），飞行甲板本色木，1941-07 才染蓝。
      1939-04 调太平洋舰队。

  - code: E1
    title: 开战至 1942-03 改装前
    from: 1941-12-07
    to: 1942-03-30
    note: >-
      珍珠港事件当天在海上，18 架 SBD 飞抵珍珠港上空、7 架被击落、8 名空勤阵亡。
      1941-12-10 舰载机击沉伊-70（美军在太平洋战争爆发后首次击沉日舰）。
      1942-02 马绍尔群岛空袭，02-24 威克岛，03-04 马库斯岛。

  - code: E2
    title: 1942-03 改装后
    from: 1942-03-31
    to: 1942-05-27
    note: >-
      珍珠港改装：拆 10 艘小艇、拆大部分 .50 机枪，加装 30 门 20mm 厄利孔与雷达。
      此时武备：5"/38 单装 8 座 + 1.1"/75 四联装 4 座 + 20mm 30 门。
      40mm Bofors 此时为 0 座。
      1942-04-18 杜立特空袭时为大黄蜂号提供战斗机巡逻与搜索。

  - code: E3
    title: 中途岛
    from: 1942-05-28
    to: 1942-06-13
    note: >-
      第 16 特混舰队旗舰（斯普鲁恩斯）。与大黄蜂号同队；
      弗莱彻的 TF 17（约克城号）为战术指挥。
      航空队 73 架：VF-6 27 架 F4F-4、VB-6 15 架 SBD、VS-6 17 架 SBD、VT-6 14 架 TBD。
      06-04 07:06 起飞攻击队（33 SBD + 14 TBD + 10 F4F，与大黄蜂合计 116 架）。
      约 12:22 麦克拉斯基队俯冲重创加贺、赤城。
      VT-6 14 架中 10 架未返（71%）；三艘航母合计 41 架 TBD 被击落 35 架。
      本舰无损伤、无阵亡。3 日合计损失飞机 31 架。
      06-13 返珍珠港。

  - code: E4
    title: 1942-07 短修后
    from: 1942-07-01
    to: 1942-09-09
    note: >-
      珍珠港短修：拆前部辅助升降机、拆弹射器、拆余下 .50 机枪，
      加前部火控雷达，舰首加 1.1 英寸炮座。
      弹射器由 3 座减为 2 座（拆除数量与位置三说并存）。

  - code: E5
    title: 1942-10 换装 40mm 后
    from: 1942-10-07
    to: 1943-10-30
    note: >-
      1942-09-10 至 10-07 抢修期间：加装 12 门 20mm（至 42 门），
      4 座 1.1"/75 换为 4 座四联 40mm（16 管），加搜索雷达。
      1942-08-24 东所罗门海战：3 弹直击 + 4 近失，死 74 伤 95。
      1942-10-26 圣克鲁斯海战：2 弹命中，死 44 伤 75，接收大黄蜂号飞机。
      1943-05-27 尼米兹授首面「总统单位嘉奖」（首艘获此的航母）。

  - code: E6
    title: 1943-10 大改装后
    from: 1943-10-31
    to: 1945-08-15
    note: >-
      普吉特湾大改装（1943-07-20 至 10-31）：加装防雷突出部（frames 36-150）、
      鞍形油箱、8 座双联 40mm（合计 40 管）、换新弹射器、加 SK/SM 雷达。
      全长增至 252.2 m，水线宽增至 29.1 m。
      换 Mk 37 指挥仪（带 Mk 4 雷达天线），取代 Mk 33。
      涂装 1943-12 为 Measure 21，1944-08 起 Measure 33/4Ab 迷彩。
      飞行甲板首尾漆白色大「6」。

  - code: E7
    title: 战后
    from: 1943-11-01
    to: 1947-02-17
    note: >-
      1943-11 大改装后编入快速航母部队，参加马里亚纳、莱特湾、硫磺岛。
      1945-05-14 被神风撞中前升降机、退出战斗，战后担任运兵船。
      1947-02-17 退役。涂装 Measure 21/22 海军蓝体系。
      这一段此前没有切片，时间轴上 1943-11 之后一直是空白。

  - code: E8
    title: 封存与拆解
    from: 1947-02-18
    to: 1960-07-01
    note: >-
      1947-02-17 退役封存于纽约。多次试图保存为博物馆舰未果，
      1958-07 售出、1958-10 拆解开工，1960 年拆解完毕。
      Navy 曾在一份 1947 年的评估里把她列为「不应保存」的那一类。
