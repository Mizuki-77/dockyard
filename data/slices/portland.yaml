ship: portland
slices:
- code: P0
  title: 建造与服役（1929-1933）
  from: '1929-02-13'
  to: '1933-02-23'
  note: 1930-02-17 在 Fore River 开工，1932-05-21 下水，1933-02-23 服役。 订购日 1929-02-13（construction.order_date）为时间轴起点。
- code: P1
  title: 战前（1933-1941-12）
  from: '1933-02-24'
  to: '1941-12-06'
  note: 太平洋舰队巡洋舰分队。
- code: P2
  title: 开战至中途岛（1941-12-07-1942-06-13）
  from: '1941-12-07'
  to: '1942-06-13'
  note: 中途岛时属 TG 17.2，与阿斯托里亚同群，护卫 TF 17。
- code: P3
  title: 瓜岛战役（1942-06-14-1943-02）
  from: '1942-06-14'
  to: '1943-02-28'
  note: 1942-11-13 瓜岛夜战中被鱼雷命中舰尾，舵机受损后仍自行返航。
- code: P4
  title: 反攻与战争结束（1943-03-1945-09）
  from: '1943-03-01'
  to: '1945-09-02'
  note: 修理后重返前线，参加阿留申、马绍尔、菲律宾诸役。
- code: P5
  title: 战后与拆解（1945-09-1959）
  from: '1945-09-03'
  to: '1959-10-01'
  note: 战后退役封存，1959 年拆解。
