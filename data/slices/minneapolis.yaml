ship: minneapolis
slices:
- code: P0
  title: 建造与服役（1931-1934）
  from: 1931-06-27
  to: 1934-05-19
  note: 1931-06-27 在 Philadelphia Navy Yard 开工，1933-09-06 下水（掷瓶人 Miss Grace L. Newton），1934-05-19 服役，首任舰长 Gordon W. Haines。 建成状态即本级标准配置：3 座三联装 8"/55 Mk 9、8 座单装 5"/25、 8 挺 .50 机枪、2 座弹射器、4 架水上飞机、无鱼雷发射管。 注意
    DANFS 把开工年印成 1921，实为 1931。
- code: P1
  title: 战前与太平洋舰队（1934-1941）
  from: 1934-05-20
  to: 1941-12-06
  note: 1934 年 7–9 月欧洲试航，返 Philadelphia 改装；1935-04-04 启程经巴拿马运河， 04-18 抵 San Diego 加入侦察舰队第 7 巡洋舰分队（CruDiv 7）。 此后以西海岸为基地，1939 年初赴加勒比，1940 年基地改珍珠港。 这一片的外形变化只有加装 .50 机枪与日常磨损，无结构性改装记录。
- code: P2
  title: 开战至中途岛（1941-12-07 ~ 1942-06-07）
  from: 1941-12-07
  to: 1942-06-07
  note: 开战时本舰正在珍珠港外 20 英里处打靶，未受损。此后编入航母特混舰队： 1942-02 掩护 Lexington 袭击吉尔伯特与马绍尔（02-01 击落 3 架「贝蒂」）、 03-10 莱城/萨拉马瓦、05-04~08 珊瑚海（击落 3 架日机，救援 Lexington 生还者）。 1941-11 完成一轮防空改装：加装 4 座四联装 1.1"/75。 1942-06-03~06 中途岛，属
    TG 16.2（Kinkaid 旗舰），掩护大黄蜂号。 **这一片的关键：本舰在 1942-01 起就是 CruDiv 6 的常任旗舰， Kinkaid 的将旗一直在本舰上，直到 1942-07 转去企业号。**
- code: P3
  title: 瓜岛战役与塔萨法隆加重伤（1942-06-08 ~ 1942-12-12）
  from: 1942-06-08
  to: 1942-12-12
  note: 1942-08-07~09 掩护瓜岛/图拉吉登陆；08-30 Saratoga 被潜艇雷击后本舰将其 拖离危险区。1942-11-27 编成 TF 67（ONI 代字 Task Force WILLIAM）， 本舰为 Wright 少将旗舰，11-29 出击。 11-30 夜塔萨法隆加：本舰以 SG 雷达率先发现日舰并首先开火； 2327 被两条鱼雷命中（一在 1 号炮塔前方航空汽油舱旁、一在
    2 号锅炉舱）， **舰艏在 frame 22 处整段撕裂下垂**，1、2、3 号锅炉舱进水，全炮塔失电。 12-01 自航抵 Tulagi，用棕榈叶伪装；12-06 制作用椰木防浪堤时气割引燃 汽油蒸汽爆炸，舰艏又失去 7 英尺干舷；12-12 离 Tulagi 赴 Espiritu Santo 制作临时钢艏。**这一片是本舰外形变化最大的一段。**
- code: P4
  title: 大修与重返前线（1942-12-13 ~ 1943-09-10）
  from: 1942-12-13
  to: 1943-09-10
  note: 经 Espiritu Santo 与珍珠港，1943-04-22 至 09-10 在 Mare Island 大修： 装新艏、修复 2 号锅炉舱、加装 SK-1 对空雷达与射击指挥仪、 并把舰桥改为「伪装成驱逐舰」的涂装（画假舷窗）。同期 20 mm 增至 24 门单装。
- code: P5
  title: 太平洋反攻（1943-09-11 ~ 1945-04-12）
  from: 1943-09-11
  to: 1945-04-12
  note: 1943-10-05 炮击威克岛、11 月马金岛；1944 年马绍尔、特鲁克、帕劳、荷兰迪亚； 06-14 塞班炮击、06-19~20 菲律宾海；07-08~08-08 关岛支援（获第 3 陆战师 Turnage 师长嘉奖）；09-06~10-14 帕劳；10-17 进莱特湾、10-24~25 苏里高海峡 （史上最后一次战列线炮战）。1945-01 林加延湾、02 巴丹/科雷希多、 03-25
    抵冲绳、04-01 炮击那霸机场。**04-12 因炮管磨损严重准备撤离， 当日击落 4 架自杀机、另 3 架擦舰落海。** 这一片的外形变化：1943 年底拆指挥塔、加装 6 座四联装 40 mm； 20 mm 由 12 门单装→24 门单装→（1945-06 前）9 座双联。
- code: P6
  title: 换炮身与战争结束（1945-04-13 ~ 1947-02-10）
  from: 1945-04-13
  to: 1947-02-10
  note: 1945-04-13 离冲绳返 Bremerton 更换炮管内衬——**本舰是本级唯一有记载 换装 8"/55 Mk 15 Mod 1 炮身的舰**（借适配套筒直接替换旧 Mk 9 族炮身）。 1945-06-27 在 Puget Sound 试航。战争结束时在菲律宾 Subic 湾。 1945-09-09 Kinkaid 上将在本舰上接受朝鲜日军投降。 此后黄海巡逻、掩护华北（Taku
    / Chinwangtao）登陆、载运老兵返美。 1946-01-14 启程经巴拿马运河返 Philadelphia；1946-05-21 转入预备役； 1947-02-10 退役。
- code: P7
  title: 退役与拆解（1947-1959）
  from: '1947-02-11'
  to: '1959-08-14'
  note: 1947-02-10 退役封存。未再重新服役，1959-08-14 拆解完毕。本片无外形变化，只是收住该舰的结局时间窗。
