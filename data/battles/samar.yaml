      en: Imperial Japanese Navy, First Diversion Attack Force (Centre Force)
    ships:
      - name: 大和
        role: { zh: 战列舰 · 第一战队（栗田健男中将座舰，10-23 由爱宕转移而来）, en: Battleship · BatDiv 1, fleet flagship }
        note: 本站本轮尚未收录该舰单页
      - name: 长门
        role: { zh: 战列舰 · 第一战队, en: Battleship · BatDiv 1 }
        note: 本站尚未收录该舰单页
      - name: 金刚
        role: { zh: 战列舰 · 第三战队, en: Battleship · BatDiv 3 }
        note: 本站尚未收录该舰单页
      - name: 榛名
        ship_id: haruna
        role: { zh: 战列舰 · 第三战队（螺旋桨在菲律宾海海战后未修复，只能跑 26 节，很快掉队）, en: Battleship · BatDiv 3; still limited to 26 knots after Philippine Sea damage }
      - name: 鸟海
