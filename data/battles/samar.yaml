      - name: 筑摩
        ship_id: chikuma
        role: { zh: 重巡 · 第七战队 · 熊野受伤后代理战队旗舰 · 当日下午翻覆沉没, en: Heavy cruiser · CruDiv 7; ad hoc flagship after Kumano was hit; capsized that afternoon }
      - name: 熊野
        role: { zh: 重巡 · 第七战队 · 07:24 被约翰斯顿号鱼雷炸掉舰艏, en: Heavy cruiser · CruDiv 7; bow blown off by a torpedo from USS Johnston at 0724 }
        note: 本站尚未收录该舰单页
      - name: 铃谷
        role: { zh: 重巡 · 第七战队 · 当日上午重伤后被己方处分, en: Heavy cruiser · CruDiv 7; crippled and scuttled }
        note: 本站尚未收录该舰单页
      - name: 能代
        role: { zh: 轻巡 · 第二水雷战队旗舰, en: Light cruiser · flagship, DesRon 2 }
        note: 本站尚未收录该舰单页
      - name: 矢矧
        role: { zh: 轻巡 · 第十水雷战队旗舰, en: Light cruiser · flagship, DesRon 10 }
        note: 本站尚未收录该舰单页

  - side: allies
