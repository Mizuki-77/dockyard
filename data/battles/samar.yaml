# ============================================================================
# 萨马岛海战（Battle off Samar）· 1944-10-25
#
# 时间基准 —— 本场是三条里时间最乱的一场，务必分清：
#
#   1) 美方一手汇编《Battle Experience: Battle for Leyte Gulf》开篇即声明：
#      「All times indicated are zone minus nine.」
#      其正文里还出现「0724I/25」这种写法，I = Item（爱称），即 Zone −9。
#      **本文件 timeline 的美方时刻全部用 Zone −9。**
#
#   2) 日方 TROM（combinedfleet）**不声明时区基准**。而且同一站内部就不一致：
#      战列舰三条（YAMATO / KONGO / HARUNA）记「0544 发现、0558 开火」，
#      重巡两条（TONE / CHIKUMA）记「0644 发现、0658 开火」——**整整差一小时**。
#      美方的 0646/0653/0658 与**重巡那两条**吻合。本站两说并列，不裁决谁对。
#      凡引 TROM 时刻，text 里注明出处与「未声明基准」。
#
#   3) USSBS 对日方人员的审讯（IJO-35、IJO-41）里，被问者自己用「0640 TOKYO time」
#      这种说法，说明日方人员在受审时混用东京时间与当地时间。本文件引用时照录原话。
# ============================================================================

id: samar
name:
  zh: 萨马岛海战
  en: Battle off Samar

date:
  from: 1944-10-25
  to: 1944-10-25
theater: pacific
period:
  zh: 1944-10-25 上午，自 06:46 接触至 09:24 日方巡洋舰停止射击，约 2.5 小时；下午为追击与空袭。美方时刻为 Zone −9
  en: Morning of 25 October 1944, 0646 to 0924, about two and a half hours; afternoon pursuit and air attacks. US times Zone −9.

location:
  zh: 菲律宾萨马岛以东海域，圣贝纳迪诺海峡以东
  en: Off the east coast of Samar Island, Philippines, east of San Bernardino Strait
coordinates: 交战海域约 11°30′N 126°30′E（各来源位置点不统一，本站不填精确单点）

scale:
  zh: >-
    日军栗田第一游击部队主力（战列舰 4、重巡 6、轻巡 2、驱逐舰约 11）；
    美军第 77.4.3 特混群（护航航母 6、驱逐舰 3、护航驱逐舰 4），另有 77.4.1 / 77.4.2 的舰载机参战
  en: >-
    Kurita's Centre Force (4 battleships, 6 heavy cruisers, 2 light cruisers, about 11 destroyers)
    against TU 77.4.3 (6 escort carriers, 3 destroyers, 4 destroyer escorts), plus aircraft from TU 77.4.1 and 77.4.2

summary:
  zh: >-
    1944 年 10 月 25 日晨，栗田健男的第一游击部队穿过圣贝纳迪诺海峡后，在萨马岛以东撞上
    斯普拉格少将的第 77.4.3 特混群——六艘护航航母与七艘护航舰艇。日方误将护航航母认作舰队航母，
    美军则以烟幕、鱼雷冲击与舰载机反击拖延了两个半小时。日方击沉一艘护航航母与三艘护航舰艇，
    却在 09:24 突然停止射击、掉头北撤，把几乎到手的战果与莱特湾入口一并放弃。
  en: >-
    On the morning of 25 October 1944 Kurita's Centre Force came through San Bernardino Strait
    and ran into Rear Admiral Clifton Sprague's TU 77.4.3 — six escort carriers and seven escorts.
    The Japanese mistook the CVEs for fleet carriers; the Americans held them off for two and a
    half hours with smoke, torpedo charges and aircraft, and at 0924 the Japanese abruptly broke
    off and turned north.

