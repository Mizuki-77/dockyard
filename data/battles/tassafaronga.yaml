      - name: 弗莱彻号
        role: { zh: 驱逐舰 · 前卫（第 1 艘）, en: Destroyer · van, leading }
        note: 本站尚未收录该舰单页
      - name: 珀金斯号
        role: { zh: 驱逐舰 · 前卫, en: Destroyer · van }
        note: 本站尚未收录该舰单页
