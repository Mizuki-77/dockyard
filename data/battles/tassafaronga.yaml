# ============================================================================
# 塔萨法隆加海战（Battle of Tassafaronga）· 1942-11-30 夜
#
# 时间基准：
#   本场用 **美方时刻**。ONI 的《The Battle of Tassafaronga》正文**没有声明时区**，
#   但同一系列 ONI 战斗叙述《The Battle of Guadalcanal》Part I 的脚注写明
#   「All times in Part I are Zone minus 11.」，Part II 写「Zone minus 12」，
#   两者本身就不统一——所以本文件**只声明「美方叙述时刻」，不声明具体 zone 编号**，
#   避免把「−11」这个数字嫁接到没有声明它的那份文件上。
#
#   日方一侧引 IJO-60（田中第二水雷战队参谋部）与 TROM 的记载，都注明是日方口径，
#   不做换算。USSBS 的 IJO 卷在个别条目上直接写「TOKYO time」，这一份没有。
#
# 跨午夜：开战 2320，北安普敦号次日 0300 后沉没，所以 time 全用 'MM-DD HH:MM'。
# ============================================================================

id: tassafaronga
name:
  zh: 塔萨法隆加海战
  en: Battle of Tassafaronga

date:
  from: 1942-11-30
  to: 1942-12-01
theater: pacific
period:
  zh: 1942-11-30 23:20 接敌至 1942-12-01 03:00 后北安普敦号沉没。全部为美方叙述时刻（ONI 未声明 zone）
  en: 2320 on 30 November to after 0300 on 1 December 1942, US narrative times

location:
  zh: 瓜达尔卡纳尔岛西北岸塔萨法隆加角外海，萨沃岛与埃斯佩兰斯角之间
  en: Off Tassafaronga Point, northwest coast of Guadalcanal, between Savo Island and Cape Esperance
coordinates: 交战海域约 09°12′S 159°45′E（各来源不给统一单点，本站不填精确坐标）

scale:
  zh: 美军重巡 4 艘 + 轻巡 1 艘 + 驱逐舰 6 艘；日军驱逐舰 8 艘（含旗舰长波）
  en: US 4 heavy cruisers, 1 light cruiser, 6 destroyers; IJN 8 destroyers

summary:
  zh: >-
    1942 年 11 月 30 日深夜，赖特少将率第 67 特混舰队（ONI 代号「WILLIAM」）在塔萨法隆加角外海
    截击田中的「东京快车」补给编队。美方先以雷达取得先手、击中并击沉高波，
    但日方在撤退前一瞬间齐射 20 余条九三式鱼雷，四分钟内连中三艘重巡、
    又在 20 分钟后命中北安普敦号。美军一沉三重创，日方仅损失一艘驱逐舰。
  en: >-
    Late on 30 November 1942 Wright's Task Force WILLIAM intercepted Tanaka's destroyer
    supply run off Tassafaronga. US radar and gunfire sank Takanami, but a single
    Japanese torpedo counter-salvo crippled three heavy cruisers within four minutes
    and sank Northampton twenty minutes later.

belligerents:
  - side: axis
    label:
      zh: 大日本帝国海军第二水雷战队
      en: Imperial Japanese Navy, Destroyer Squadron 2
    ships:
      - name: 长波
        role: { zh: 驱逐舰 · 第二水雷战队旗舰（田中赖三少将座舰）, en: Destroyer · flagship of DesRon 2 }
        note: 本站尚未收录该舰单页
      - name: 高波
        role: { zh: 驱逐舰 · 第 13 驱逐队 · 此役唯一开炮者，被集火击沉, en: Destroyer · DesDiv 13; the only Japanese ship to open fire, sunk }
        note: 本站尚未收录该舰单页
      - name: 巻波
        role: { zh: 驱逐舰 · 第 13 驱逐队, en: Destroyer · DesDiv 13 }
        note: 本站尚未收录该舰单页
      - name: 亲潮
        role: { zh: 驱逐舰 · 第 15 驱逐队, en: Destroyer · DesDiv 15 }
        note: 本站尚未收录该舰单页
      - name: 黑潮
        role: { zh: 驱逐舰 · 第 15 驱逐队, en: Destroyer · DesDiv 15 }
        note: 本站尚未收录该舰单页
      - name: 阳炎
        role: { zh: 驱逐舰 · 第 15 驱逐队, en: Destroyer · DesDiv 15 }
        note: 本站尚未收录该舰单页
      - name: 川风
        role: { zh: 驱逐舰 · 第 24 驱逐队, en: Destroyer · DesDiv 24 }
        note: 本站尚未收录该舰单页
      - name: 凉风
        role: { zh: 驱逐舰 · 第 24 驱逐队, en: Destroyer · DesDiv 24 }
        note: 本站尚未收录该舰单页

  - side: allies
    label:
      zh: 美国海军第 67 特混舰队（ONI 代号 Task Force WILLIAM）
      en: US Navy Task Force 67 (codenamed Task Force WILLIAM in ONI narratives)
    ships:
      - name: 明尼阿波利斯号
        ship_id: minneapolis
        role: { zh: 重巡 · 特混舰队旗舰（赖特少将）, en: Heavy cruiser · task force flagship }
      - name: 新奥尔良号
        ship_id: new-orleans
        role: { zh: 重巡 · 纵队第二艘, en: Heavy cruiser · second in column }
      - name: 彭萨科拉号
        ship_id: pensacola
        role: { zh: 重巡 · 纵队第三艘, en: Heavy cruiser · third in column }
      - name: 北安普敦号
        ship_id: northampton
        role: { zh: 重巡 · 纵队末艘 · 唯一沉没, en: Heavy cruiser · last in column; the only ship lost }
      - name: 檀香山号
        role: { zh: 轻巡 · 纵队第四艘（唯一以之字形规避者）, en: Light cruiser · fourth in column }
