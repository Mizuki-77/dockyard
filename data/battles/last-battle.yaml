- time: 05-27 19:30
  text:
    zh: U-74（Kentrat 艇长）从小艇救起 3 人：Herbert Manthey、Otto Höntzsch、Georg Herzog。
    en: U-74 (Kptlt Kentrat) rescued three men from a raft — Manthey, Höntzsch and Herzog.
  src:
  - kbismarck-last-battle
- time: 05-28 22:45
  text:
    zh: 德国气象船 Sachsenwald（Schütte 舰长）22:35 见左舷 2–3 海里处三颗红色信号弹，转向后发现一只木筏、2 人，22:45 靠帮用两副绳梯救起 Otto Maus
      与 Walter Lorenzen。该舰 5-30 00:45 在搜索区与西班牙重巡 Canarias 会合，6-1 靠泊波尔多。
    en: The German weather ship Sachsenwald (Kptlt Schütte) saw three red flares at 2235 and rescued Otto
      Maus and Walter Lorenzen by rope ladder at 2245, later rendezvousing with the Spanish cruiser Canarias.
  src:
  - kbismarck-sachsenwald-report
  - kbismarck-last-battle
- time: 05-30 10:00
  text:
    zh: 西班牙重巡 Canarias 在搜索区捞起两具遗体（Walter Gaszczak、Heinrich Neuschwander），5-31 10:00 海葬。她 5-27 约 11:00
      自 El Ferrol 出动。
    en: On 30 May the Spanish cruiser Canarias recovered two bodies (Gaszczak and Neuschwander), burying
      them at sea on 31 May; she had sailed from El Ferrol on 27 May.
  src:
  - kbismarck-last-battle
  - kbismarck-ktb
hits_received:
- text:
    zh: 5-24 丹麦海峡：被威尔士亲王号命中 3 发（Tovey 战报口径）。
    en: Three gunfire hits from Prince of Wales on 24 May, per Tovey's dispatch.
  src:
  - hmshood-tovey-dispatch
- text:
    zh: 5-26 20:47 起的空袭：英方与德方都确认至少 2 枚 18 英寸 Mark XII 航空鱼雷命中——一枚左舷舯部（主装甲带下缘，能量多被水下防护吸收，仅结构与轻微进水）、一枚艉部舵机区（左舵组联轴器严重损坏，两舵卡死向左
      12°）。有材料说 3 枚（第 3 枚通常指另一枚打在舯部附近）。
    en: 'At least two 18-inch Mark XII aerial torpedoes: one amidships to port with little effect, one
      in the stern steering area which wrecked the rudder coupling and jammed both rudders 12° to port.'
  src:
  - kbismarck-chase
  - kbismarck-histoperi
  - kbismarck-admiralty-war-diary
- text:
    zh: 5-27 08:54：英王乔治五世号命中俾斯麦号前上层建筑基部（该舰报告口径）。
    en: At 0854 on 27 May KGV hit the base of the forward superstructure.
  src:
  - kbismarck-patterson-report
- text:
    zh: 5-27 09:02：罗德里号 16 英寸齐射命中前上层建筑，摧毁舰桥与前桅测距仪/主火控指挥仪，当场打死舰桥内大部分军官，并波及前主炮塔。**部分材料（含德方档案整理页与英方维基）把这一击记为同时打死
      Lindemann、Lütjens 与舰桥其余人员；另一些幸存者说沉没前还看见 Lindemann 在甲板上——见争议 3。** 另：英方一手审讯记战俘称首枚中弹在 **08:57**（08:51
      罗德里号跨射之后），并记 Müllenheim-Rechberg 认为摧毁主火控的那一发其实**来自多塞特郡号**——见争议 12。
    en: At 0902 a Rodney 16-inch salvo wrecked the bridge, foretop rangefinder and main fire-control director,
      killing most of the bridge staff. Some accounts place the deaths of Lindemann and Lütjens here;
      other survivors saw Lindemann on deck later. The Admiralty interrogation puts the first hit at 0857,
      and Müllenheim-Rechberg believed the shell that destroyed the main fire control came from Dorsetshire.
  src:
  - kbismarck-histoperi
  - kbismarck-last-battle
  - admiralty-bismarck-interrogation
- text:
    zh: 5-27 约 09:40：Bruno 炮塔后壁被炸开、起火。
    en: About 0940 the rear wall of turret Bruno blew out and the turret burned.
  src:
  - kbismarck-last-battle
- text:
    zh: 5-27 约 10:00：**据单一二手叙述**，一发英王乔治五世号 14 英寸炮弹穿透上部纵深装甲带，在舰尾食堂内爆炸，炸死副舰长（First Officer）Hans Oels 与约一百人。**本条仅见于英文维基（tier
      E），本次未在一手材料中取得佐证**；Oels 下令自沉一事同样只见于二手文献与 Cameron 2002 的引文。使用前应另找一手来源，或按「存疑」标注。
    en: About 1000 a 14-inch shell from KGV reportedly penetrated the upper citadel belt and burst in
      the aft canteen, killing First Officer Oels and about a hundred men. This appears only in secondary/encyclopedic
      accounts and was not corroborated in any primary source gathered here.
  src:
  - kbismarck-last-battle
- text:
    zh: 5-27 约 10:05：英王乔治五世号自约 3,000 码打出三发可见命中——两发打进上层建筑基部甲板，一发从前部打进 B 炮塔、似将塔后半整体掀入海。
    en: About 1005, from about 3,000 yards, KGV observed three clear hits — two on the superstructure
      base and one entering B turret from forward, apparently tearing away the rear of the turret.
  src:
  - kbismarck-patterson-report
- text:
    zh: 鱼雷命中（合计，各方数字不一）：5-26 航空雷 2（或 3）；5-27 01:22–01:46 驱逐舰雷英方声称 2–3 发命中、德方最高生还军官称 0；09:56 罗德里号 2 枚（可能
      1 命中左舷）；10:00 后诺福克号 4 枚（可能 1 命中右舷）；10:22 多塞特郡号 2 枚右舷均命中；10:36 多塞特郡号 1 枚左舷命中。**英方一手审讯只记「Rodney 命中一雷」+「多塞特郡三雷全中」，不列驱逐舰战果；Tovey
      第 88 段则把 5-27 晨驱逐舰鱼雷两发计入损伤序列。见争议 6 与争议 13。**
    en: 'Torpedo hits, all sources: two (possibly three) aerial on 26 May; two to three claimed by destroyers
      in the night, denied by the German senior survivor; possibly one from Rodney at 0956 and one from
      Norfolk after 1000; two confirmed from Dorsetshire to starboard at 1022 and one to port at 1036.
      The Admiralty interrogation credits only Rodney with one torpedo hit and Dorsetshire with three.'
  src:
  - kbismarck-admiralty-war-diary
  - hmshood-tovey-dispatch
  - kbismarck-last-battle
  - kbismarck-histoperi
  - admiralty-bismarck-interrogation
- text:
    zh: '**残骸调查 + 英方一手审讯的物证口径**：可见舰体上只有 2 处 320 mm 主装甲带被完全穿透，都在右舷舯部；主装甲带与装甲甲板全程未被击穿。英方审讯记战俘一致供称「no shells
      penetrated the armour belt」（除一名下级军官外）。这是「自沉说」最重要的物证（但穿透数量取决于能否看清被泥掩埋的部分）。多名战俘还认为炮战结束时若没有最后的鱼雷与自沉，舰仍可能开回港。'
    en: 'Wreck survey: only two complete penetrations of the 320 mm main belt, both on the starboard side
      amidships; neither belt nor armoured deck was pierced through. Prisoners interrogated by the Admiralty
      agreed that no shells penetrated the armour belt. This is the strongest physical evidence for the
      scuttling argument.'
  src:
  - kbismarck-last-battle
  - kbismarck-wreck
  - admiralty-bismarck-interrogation
- text:
    zh: 炮弹发射总数：本次战斗四舰合计 2,876 发（罗德里号 40.6 cm 380、英王乔治五世号 35.6 cm 339、诺福克号 20.3 cm 527、多塞特郡号 20.3 cm 254、罗德里号
      15.2 cm 716、英王乔治五世号 13.3 cm 660）。罗德里号自己的炮术报告只给 16 英寸 378 发、6 英寸 706 发——**378 与 380、706 与 716 是同一批数字的两个版本**。
    en: 'Total rounds fired in the final action: 2,876 (Rodney 380 × 40.6 cm, KGV 339 × 35.6 cm, Norfolk
      527, Dorsetshire 254, Rodney 716 × 15.2 cm, KGV 660). Rodney''s own gunnery report gives 378 × 16-inch
      and 706 × 6-inch — the same expenditure recorded two ways.'
  src:
  - kbismarck-last-battle
  - kbismarck-rodney-report
  - kbismarck-patterson-report
  - kbismarck-admiralty-war-diary
- text:
    zh: 命中数：**永远无法确知**。kbismarck 的原话是「200、300，也许更多？」；英方维基记「四舰共发约 2,800 发、命中约 400 发」。见争议 2。
    en: 'The number of hits can never be established: specialist estimates range from 200–300 to about
      400 out of roughly 2,800 rounds fired.'
  src:
  - kbismarck-last-battle
consequences:
- text:
    zh: 舵机被毁是整场追击的转折点：两舵卡死后，俾斯麦号只能兜圈、被西北风顶向追击的英舰，5-26 夜至 5-27 晨只以 7 节左右前进，从 5-26 的 24 节一路掉到决战时的 7 节。**舵角三种口径**：向左
      12°（kbismarck）、左舵 15°（Junack）、10–15°（英方一手审讯，并称舰「向右缓慢转圈」）——见争议 5。
    en: 'The wrecked steering was the turning point of the chase: with both rudders jammed Bismarck could
      only circle and was forced up into the north-west wind towards her pursuers, dropping from 24 knots
      to about 7. The jam angle is given as 12°, 15°, or 10–15° (the last with her turning slowly to starboard).'
  src:
  - kbismarck-chase
  - kbismarck-histoperi
  - kbismarck-admiralty-war-diary
  - admiralty-bismarck-interrogation
- text:
    zh: 5-26 夜德方仍有战斗力：03:53 英方报告它「仍能进行沉重而准确的射击」，一发炮弹削掉 Cossack 的天线，另三发跨射 Zulu 伤 3 人。
    en: 'She remained dangerous through the night: at 0353 the British reported heavy and accurate fire;
      one shell carried away Cossack''s antenna and three straddled Zulu, wounding three.'
  src:
  - kbismarck-admiralty-war-diary
- text:
    zh: 5-27 决战中火控被逐层剥离：09:02 前桅测距仪失效 → 09:08 前指挥所与两座前炮塔失效、火控转后 → 09:13 后指挥所被毁 → 09:21 Dora 自爆失效 → 09:31
      Cäsar 最后一击。此后只剩局部控制的零星副炮。
    en: 'Fire control was stripped layer by layer: foretop rangefinder at 0902, forward command post and
      both forward turrets at 0908, after command post at 0913, Dora at 0921, Cäsar''s last salvo at 0931.'
  src:
  - kbismarck-histoperi
  - kbismarck-last-battle
- text:
    zh: 通信中断：07:10 之后德方再未收到该舰任何电报；德方 09:15、10:56、11:23、11:52、12:10 的询问全部无回复，Group West 从路透社报道确认其已沉没。
    en: After 0710 nothing more was heard from her; Group West's signals at 0915, 1056, 1123, 1152 and
      1210 went unanswered and the report was confirmed from a Reuters bulletin.
  src:
  - kbismarck-ktb
- text:
    zh: 舰体向左翻覆、舰艉先沉，舰旗仍在飘扬。Tovey 战后评语：「most gallant fight against impossible odds worthy of the old days
      of the Imperial German Navy, and she went down with her colours flying.」英方一手审讯同记「Bismarck sank,
      **with her colours flying**, at 1037 in position 48°09'N, 16°07'W, close to where the final action
      had started」；多塞特郡号 1107B 电报亦记「She had ceased firing but her colours were still flying」。
    en: She capsized to port and sank stern-first with her colours still flying, prompting Tovey's tribute
      to "the old days of the Imperial German Navy"; the Admiralty interrogation likewise records that
      she sank colours flying at 1037 in 48°09'N 16°07'W.
  src:
  - kbismarck-admiralty-war-diary
  - admiralty-bismarck-interrogation
- text:
    zh: 英方代价：主力舰与巡洋舰无伤亡、无损伤；Cossack、Zulu 轻微损伤与少数伤亡，Sikh 一人落海失踪。Sheffield 被破片伤 12 人（3 人后死）。5-28 返航途中 Mashona
      被 He 111 炸沉，46 人阵亡。
    en: 'British cost: no casualties or damage in the capital ships or cruisers; slight damage and a few
      casualties in Cossack and Zulu, one man lost overboard from Sikh; Sheffield lost three men later;
      on 28 May Mashona was sunk by bombers with 46 dead.'
  src:
  - kbismarck-admiralty-war-diary
  - kbismarck-chase
losses:
- side: axis
  ships_lost:
    zh: 俾斯麦号（自沉与战损复合，见争议 1）
    en: Bismarck (scuttled and/or sunk by battle damage)
  killed: 约 2200
  survivors: 114
  note:
    zh: '生还人数三种口径并列：**114**（英方维基）／**115**（Junack 回忆、kbismarck 正文「2,200 余名官兵仅 115 人生还」）／**116 被活救**（kbismarck
      脚注：多塞特郡 86 + 毛利人 25 + U-74 3 + Sachsenwald 2）。 差额来自 Maschinengefreiter Gerhard Lüttich——被救起但 1941-05-28
      伤重死于多塞特郡号上，5-28 以全军训礼海葬。故「被救 116、生还 115、返国 109」三者可以同时成立。 编制 2,220 人（2,092 舰员 + 128 舰队参谋），另加 100
      余名编外人员（训练支队、电影组等），**确切死亡数未知**。 **第三说（英方一手审讯）**：C.B. 4051 (24) 记「total number on board was given
      as between 2,300 and 2,400 ... more than 100 officers」——即舰上总数 2,300–2,400、军官 100 余名。此数与德方 2,220
      + 编外人员的算法相容，但**没有一份来源给出确切总数**，故 killed 只能写「约 2,200」。 100 名军官中仅 2 人获救。沉没前约 800 人离舰，其余随舰沉没；水温约 13
      ℃。

      '
    en: 'Survivor counts differ: 114 / 115 alive, or 116 picked up (Dorsetshire 86 + Maori 25 + U-74 3
      + Sachsenwald 2), the difference being Lüttich, who died aboard Dorsetshire on 28 May. Complement
      was 2,220 (2,092 crew + 128 fleet staff) plus over 100 supernumeraries; the Admiralty interrogation
      (C.B. 4051 (24)) was told the total on board was "between 2,300 and 2,400 ... more than 100 officers".
      No source gives an exact total, so exact casualties are unknown. Only two of about 100 officers
      survived.

      '
  src:
  - kbismarck-last-battle
  - kbismarck-last-hours
  - kbismarck-admiralty-war-diary
  - admiralty-bismarck-interrogation
- side: allies
  ships_lost:
    zh: 无（5-27 决战中）; 5-28 损失驱逐舰 Mashona
    en: none in the final action; destroyer Mashona lost on 28 May
  killed: 0
  survivors: null
  note:
    zh: '决战本身英方阵亡 0：两艘战列舰与两艘重巡无伤亡。驱逐舰有少数破片伤（Sheffield 12 伤、3 人后死；Sikh 1 人落海失踪）。 若把 5-26 至 5-28 全期算进去，英方维基给「49
      killed / 5 wounded / Mashona scuttled」——**这个 49 是全期合计，不是 5-27 炮战的**。

      '
    en: 'No British deaths in the action itself. The figure of 49 killed covers the whole operation through
      28 May, including the loss of Mashona.

      '
  src:
  - kbismarck-admiralty-war-diary
  - kbismarck-chase
outcome:
  zh: 英方达成目的：大西洋上最后一批能威胁运输线的德国水面主力被清除，此后德国水面舰队基本退回挪威水域充当存在舰队。代价是几乎耗尽本土舰队的燃油储备，多艘主力舰需要进坞。
  en: 'The British got what they wanted: the last German surface unit capable of threatening the Atlantic
    convoys was gone, and the surface fleet withdrew to Norwegian waters as a fleet in being. The cost
    was a Home Fleet left nearly dry of fuel and several capital ships needing dockyard time.'
