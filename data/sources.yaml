- id: dougakan-cl4
  title: 日本海軍史 軽巡洋艦４（軽巡の発射管と魚雷）— 図鑑置場
  url: http://dougakan675.blog49.fc2.com/blog-entry-90.html
  type: website
  tier: D
  role:
  - data
  - narrative
  operator: dougakan675.blog49.fc2.com
  lang: ja
  access: direct
  fetched: 2026-11-23
  license: all_rights_reserved
  note: "日文长篇技术随笔，逐条讲 5500 吨型轻巡的鱼雷发射管沿革。本组用它取证 「长良型/川内型各带多少条鱼雷、发射管怎么布置」。 **可用的关键原话**： ① 「八年式六一センチ魚雷搭載数は両舷各二斉射分の一六本であった」\n   —— 长良型带 16 条鱼雷 = 两舷各两个齐射份 = 8 门发射管各 1 条备份；\n② 「長良型の八年式連装水上発射管装備位置は…艦橋後部の船首楼甲板下の上甲板両舷に各一基、\n\
    \   第3煙突後方の上甲板両舷に各一基の合計四基八門」—— 四基八门的具体位置；\n③ 「発射管は…楯を有さず、管体むき出しのままであったが、魚雷を装填すると\n   全備重量は一三トンを越えるものとなり、旋回は…五馬力の電動機による機力旋回であった。\n   三六〇度旋回時間は約一分」—— 单座全备 13 t 余、5 hp 电机驱动、360° 约 1 分钟；\n④ 川内型条目「魚雷発射管＝八年式六一センチ連装発射管四基\
    \ / 魚雷＝八年式六一センチ魚雷一六本」。 **重要局限**：全文**没有出现「次発装填装置」这个词**。 它只说「16 条鱼雷」和「每舷两个齐射份」，即**推论上存在 8 条备份雷**， 但**没有任何一句说这些备份雷是靠机械再装填装置上膛的**。 本站因此不写「装几组再装填装置」，见 RESEARCH-NOTES 的「卡住的地方」。"
