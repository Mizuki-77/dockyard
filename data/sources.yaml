note: >
  来源登记表 v0。任何 fact 的 src 必须指向本表里的 id，否则校验失败。
  这里只登记"我实际用来支撑数据的来源"。搜索时扫过但没采用的不登记。
  每条的 fetched 只在真抓到内容后才填日期；没抓到就写 status: blocked/not_fetched 并说明原因。

# ---------------------------------------------------------------- 证据层级（框架 §5.2）
tiers:
  A:
    label: { zh: 一手档案, en: Primary source }
    desc: 原始文件、战时日志、试验报告、内阁/海军部公文、亲历者当时记录。争议时最高优先。
  B:
    label: { zh: 同期官方出版物, en: Contemporary official publication }
    desc: 当年度 Jane's Fighting Ships、海军年鉴、官方战史中的表格部分。
  C:
    label: { zh: 权威二次文献, en: Authoritative secondary literature }
    desc: Conway's All the World's Fighting Ships、Garzke & Dulin、Campbell、Okun 等经同行引用与再版的专著。
  D:
    label: { zh: 专题网站, en: Specialist website }
    desc: NavWeaps、KBismarck、combinedfleet、navypedia 等长期维护、逐条给出处或原始文件的专题站。
  E:
    label: { zh: 百科, en: Encyclopedia }
    desc: 维基百科等众包百科。**仅用于发现线索与定位原始出处，不作为 fact 的 src。**

# ---------------------------------------------------------------- 用途（决定这条来源能进哪一层数据）
roles:
  data:      可作 fact 的 src
  narrative: 可作 narrative 的 positions[].evidence
  rights:    仅提供授权条款，不作数据来源
  lead:      仅用于发现线索
  image:     图源

# ---------------------------------------------------------------- 访问方式
# 抓取脚本按这三个字段决定怎么请求，见框架 §10。
#   access: direct | proxy        —— 是否经 http://127.0.0.1:7897（SakuraCat）
#   ua: default | browser         —— browser 表示必须伪装浏览器 UA，否则 404/403
#   status: ok | not_fetched | blocked | gone
# 2026-11-17 实测结果（curl -o NUL -w %{http_code}）：
#   navweaps        direct=000  proxy=200   → access: proxy
#   de.wikipedia    direct=000  proxy=200   → access: proxy
#   bundesarchiv    direct=000  proxy=200   → access: proxy
#   history.navy.mil default-UA 404 / browser-UA 200 直连 → **必须带浏览器 UA**
#   iwm.org.uk      direct=403  proxy=403   → 机器访问被封，已抓内容来自 subagent
#   awm.gov.au      direct=403  proxy=404   → blocked
#   jacar.go.jp     direct=404  proxy=404   → 条款页已迁走，blocked
#   scalemates.com  direct=403  proxy=403   → Akamai，blocked
#   kbismarck / navypedia / german-navy / combinedfleet / uboat.net → 直连 200
