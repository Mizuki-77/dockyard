  note: '舰级总页。本组用它做**独立互证**：主尺度（377 ft oa）、

    排水量（1,883 t / 2,559 full）、编制（190，四艘旗舰 219）、

    功率（44,000 hp）、航速（36 kn）、武备（8×4.7in 4x2 / 4×2pdr 1x4 /

    8×0.5in MG 4x2 / 4×21in TT 1x4）与 navypedia 逐项对照。


    **设计沿革与造价的原句出处：**

    "The Tribal class destroyers trace their roots to 1934 when the British

    Admiralty evaluated the threat posed by much larger destroyers being built

    in Japan, Italy and even Germany..."

    "The Tribal was finally accepted after no less than 8 design proposals."

    "Estimated cost per ship was 340,000 pounds excluding Admiralty supplied

    armaments putting the average cost around 520,000."

    "The first 7 Tribals were ordered on 10 March, 1936 with the latter group

    of 9 Tribals being ordered on 9 June."

    "The Tribals were not really U-boat hunters but rather fleet destroyers."

    "Pennant numbers were changed from F .. to G .. in late 1940 (in or around

    December)."


    ⚠️ 该页把排水量单位标成 "BRT"（容积吨位），军舰不适用；

    数值本身应理解成吨位数字。本组照录数值，单位在 fact 里按 t 记，

    并在 note 里说明来源标注有误。

    '
