  note: "**本组唯一 A 级来源，也是「阿斯托里亚怎么沉的」最硬的一手依据。** history.navy.mil 原站在本机 TLS 握手即断（见 danfs-astoria 条说明）， 只能用 web.archive.org 的 2021 快照；实测 183,753 bytes。 价值（逐条可引）： ① 三舰当晚编制与航态：「U.S.S. VINCENNES, U.S.S. QUINCY\
    \ and\n   U.S.S. ASTORIA, plus two destroyers on the night of August 8-9, 1942\n   comprised Task Group 62.3」；\n② 阿斯托里亚中弹与失能的逐分钟过程（0155 开火、0200 副炮全失、\n   0202 航速降到 9 节、0215 全舰失电、1215 翻沉）；\n③ 逐条炮位失效清单（本文件\
    \ armament.gun_failures 的来源）； ④ 舰载机实数：「The five airplanes on each ship except QUINCY had been\n   drained of all gasoline.」——**5 架，不是级表的 4 架**；\n⑤ 报告自身承认的局限：「there is a great deal of information which,\n\
    \   naturally, is contradictory in many instances. The times and even the\n   sequence of events differ to such an extent in the various reports\n   that it has been impossible to construct an account\
    \ in which all the\n   details agree」——引用时刻数据时必须带上这句。\n口径提示：全报告**不给伤亡总数**，只到「Personnel casualties were heavy」 这一层；也不给任何雷达型号。\n"
