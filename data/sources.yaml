# ---- 2026-11-28 新增（g-belfast）----
- id: hansard-1971-03-08
  title: H.M.S. "BELFAST" — House of Commons debate, 8 March 1971 (HC Deb vol 813 cc207-16)
  url: https://api.parliament.uk/historic-hansard/commons/1971/mar/08/hms-belfast
  type: primary_archive
  tier: A
  role:
  - data
  - narrative
  operator: UK Parliament（Hansard 官方存档，api.parliament.uk）
  lang: en
  access: direct
  fetched: 2026-11-28
  license: open_parliamentary_licence
  note: "**本组保存经过那一节的一手依据，也是全组唯一 tier A 的叙事来源。** 1971-03-08 深夜休会辩论全文，提案人为 Rear-Admiral Morgan-Giles （本舰前舰长、HMS Belfast Trust 主席）。可直接引用的关键句：\n- 「She took part in the sinking of the \"Scharnhorst\" and was the covering\n  force for the attack on the \"Tirpitz\". She spearheaded the invasion of\n  Normandy and saw much action in the Korean War」\n- 「She was the largest cruiser ever built for the Royal Navy, and is now\n  the last remaining wartime big-gun ship.」\n- 「in 1967 the Belfast Committee was set up」——1967 年成立的委员会由\n  IWM 馆长 Noble Frankland 主持，成员含国家海事博物馆与 IWM 代表。\n- 委员会报告原话：「There is a very strong case for her preservation…\n  There is really no question of selecting Belfast; it is rather a case of\n  grasping the last opportunity.」\n- 「a H.M.S. \"Belfast\" Trust is being formed at the moment, with the object\n  of trying to obtain a loan of the ship to put her on exhibition afloat in\n  the London River」——1971 年 3 月时 Trust 正在组建。\n- 国防部次官 Peter Kirk 的答复：「As late as ... she has performed\
    \ the\n  slightly less glamorous, but essential, role of H.Q. ship of the Reserve\n  Ships Organisation at Portsmouth. As a result of the transfer of the\n  Reserve Ships Organisation to shore accommodation at Chatham last month,\n  this requirement has ceased and she would in the ordinary way he put on\n  the disposal list next month」——即 1971 年 4 月本应进处置清单。\n- 「I will certainly hold up until the end of June any question of the\n  disposal of the hull.」\n\n口径提示：辩论中的 1971 年时间线（3 月 Trust 在组建、6 月底前不动舰体） 与 IWM 现行页面的「1971-07 政府移交所有权、10-21 开放」是**同一条线的 两个点**，不构成矛盾。本组按「1967 委员会 → 1971-03 议会辩论 → 1971-07 Trust 接手 → 1971-10-14 抵伦敦池 → 1971-10-21 开放 → 1978 转 IWM」排列。\n"

