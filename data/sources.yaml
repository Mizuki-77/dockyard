  note: '**官僚失误链条的第一环，也是「舰长有没有被命令走之字」这个问题的直接答案。** 关岛港务主任 1945-07-28 签发的 SECRET 航线指令 PDG 1849 原件， 给出六个转向点（NNG / BMV / CFL / DCM / EHO / PG / HN 的经纬度表）、 「Speed of advance shall be at 15.7 knots」、「ETA 1100 I, 31 July」， 以及最关键的一句：「Zigzag at discretion of the Commanding Officer.」 ——**之字航线由舰长自行决定，不是强制命令**。同一份文件另写 「Commanding Officers are at all times responsible for the safe navigation of their ships. They may depart from prescribed routing when in their judgment, weather, currents, or other navigations hazards jeopardize the safety of the ship.」 附件（Intelligence Brief, 1945-07-27）列出航线 300 海里内的敌军基地与 「ENEMY SUBMARINE CONTACTS」三条（7-22、7-25 两条）， 证明本舰**确实收到过一般的潜艇活动通报**；但通报里没有 I-58， 也没有四天前 Underhill 号被击沉的消息（见 ndaa-2001-sec545）。'

