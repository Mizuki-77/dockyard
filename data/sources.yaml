      **本次解冲突的关键来源**。分栏给出舰炮 SK C/34（Fore 99.5 / Rear 111.5 或 112.5 kg）与岸防炮 Siegfried（Fore 102.0 / Rear 108.0 kg），证明英文维基的 104/108 抄的是岸防炮装药。
      另含：炮身 111,000 kg、全长 19.630 m、膛线 90 条 4.5×7.76 mm、药室 319 dm³、射速 2.3–3 rpm、炮管寿命 180–210 发、炮塔重 1,052,000 kg、仰角 −5.5/+30°、回转 ±145°、后座 1.050 m、炮轴间距 375 cm、最大射程 35,550 m @30°、炮塔装甲（Brower）。

