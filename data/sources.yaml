version: 1
updated: '2026-11-22'
note: '来源登记表 v0。任何 fact 的 src 必须指向本表里的 id，否则校验失败。 这里只登记"我实际用来支撑数据的来源"。搜索时扫过但没采用的不登记。 每条的 fetched 只在真抓到内容后才填日期；没抓到就写 status: blocked/not_fetched 并说明原因。

  '
tiers:
  A:
    label:
      zh: 一手档案
      en: Primary source
    desc: 原始文件、战时日志、试验报告、内阁/海军部公文、亲历者当时记录。争议时最高优先。
  B:
    label:
      zh: 同期官方出版物
      en: Contemporary official publication
    desc: 当年度 Jane's Fighting Ships、海军年鉴、官方战史中的表格部分。
  C:
    label:
      zh: 权威二次文献
      en: Authoritative secondary literature
    desc: Conway's All the World's Fighting Ships、Garzke & Dulin、Campbell、Okun 等经同行引用与再版的专著。
  D:
    label:
      zh: 专题网站
      en: Specialist website
    desc: NavWeaps、KBismarck、combinedfleet、navypedia 等长期维护、逐条给出处或原始文件的专题站。
  E:
    label:
      zh: 百科
      en: Encyclopedia
    desc: 维基百科等众包百科。**仅用于发现线索与定位原始出处，不作为 fact 的 src。**
roles:
  data: 可作 fact 的 src
  narrative: 可作 narrative 的 positions[].evidence
  rights: 仅提供授权条款，不作数据来源
  lead: 仅用于发现线索
  image: 图源
