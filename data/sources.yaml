- id: admiralty-bismarck-interrogation
  title: GERMAN BATTLESHIP BISMARCK — Interrogation of Survivors (C.B. 4051 (24), 1941-08)
  url: https://www.uboatarchive.net/Int/BismarckINT.htm
  type: document
  tier: A
  role:
  - data
  - narrative
  operator: uboatarchive.net（转录英海军部 SECRET 件 C.B. 4051 (24)）
  lang: en
  access: direct
  fetched: 2026-11-17
  license: all_rights_reserved
  note: '英海军部对 5 名获救者的审讯全文，238,309 字符，**是整场争议里最关键的一份一手旁证**。 原文关键处：自沉令「Abandon ship. Ship is to be sunk!」、结论措辞 **hastened**（加速不可避免的结局）、 「All prisoners, with the exception of one junior officer, state that
    no shells penetrated the armour belt」、 Lindemann/Lütjens 之死并列三种互斥证词且「nothing definite is known」、 艉部雷在**右舷**（与多数二次叙述的左舷相反）、首弹 **08:57**（不是 09:02）、 停火 **10:22**（Tovey 记 10:28 决定、Patterson 记 10:21）、多塞特郡「having
    hit with three torpedoes」、 编制「between 2,300 and 2,400 ... more than 100 officers」。 **已知错记两处**：称 Sachsenwald 救起 100 人（实际 2 人）；称水中约 400 人。 与 ADM 267/137（kbismarck 的 survivor-reports.pdf）是同一份报告的不同载体。

    '
