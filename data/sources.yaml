  note: "英文的日本鱼雷发展综述，用来做「本级为什么换 61 cm」的英文原句依据。 **可用原话**： ① 「These huge weapons were mounted on cruisers beginning with the Nagara class,\n   laid down in 1920-21, and on destroyers beginning with the Mutsuki\
    \ class」\n   —— 长良级是日本巡洋舰用 61 cm 鱼雷的起点；\n② 「During WWII the torpedo armament was twelve or sixteen 24 inch tubes and usually\n   twenty-four Type 93 torpedoes including reloads.」—— 这句讲的是**重巡**（A 类），\n\
    \   不是轻巡，引用时**必须限定范围，不可拿来套长良/川内**；\n③ 「Fifteen of the light cruisers that were commissioned in the Japanese Navy after\n   WWI were built with 24 inch tubes. ... All of these cruisers probably were\
    \ capable\n   of firing Type 93 torpedoes, but some may not have been issued oxygen torpedoes\n   until some time after Pearl Harbor if at all.」\n   —— 注意原文用的是「probably」与「may not」，**是推测措辞，不可当定论引用**。"
