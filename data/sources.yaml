  note: '**这是本站目前最好的一份胡德号证据**：英国国家档案馆 ADM 116/4351 原件转录。 报告日期 1941-09-12，签署人 L.D. Macintosh / R.D. Duke / H.T.C. Walker。 取证规模「a total of **176 eyewitnesses** … 71 from H.M.S. PRINCE OF WALES, 89 from H.M.S.
    NORFOLK, 14 from H.M.S. SUFFOLK and 2 from H.M.S. HOOD」。 技术结论给出三条可能的击穿路径（26 项第 (11)-(14) 条）： （a）主装带被击穿、（b）炮弹从带顶与主甲板平部之间约 18 英寸 × 42 英尺的 缝隙带穿过、（c）从带下方入水再穿入。 免责结论原话「no blame attaches to the Vice-Admiral
    Commanding the Squadron, the Captain or anyone else」。另附一句极关键的判断： 「It was known that HOOD''s protection was poor by modern standards and had it not been for the war she would by now have been undergoing
    complete reconstruction.」 DNC 附录结论第 112 页：「The principal lesson … is that the magazines of a warship should be so situated and protected … It was intended to reconstruct HOOD in this way after QUEEN
    ELIZABETH was completed, but the outbreak of war prevented this.」

    '
