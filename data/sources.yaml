  note: "**tier E，只能当线索。** 本笔记用它的三处： ① **利根 4 号机延误**：「利根のカタパルトが故障し…発進が30分遅れ…**とする文献がある**」\n   ——注意日文原文自己就把「30 分钟」标成「有文献如此说」；同段还给土井美二参谋\n   「4 号机罗盘失准才得以发现美舰队」的说法，以及近年研究「迟发反而发现、准时反而\n   错过」的反向结论。**三条都是线索，正文须另找\
    \ C/D 级来源。**\n② **利根 1945 年结局**：3-19 吴空袭至近弹致 3 号炮塔不可用 → 移能美岛海岸伪装 →\n   7-24 左舷中部直击弹 → 7-28 左舷后部 2 直击（1000 磅、瞬发信管、未穿水平装甲）\n   + 6 近失、左倾 20 度以上 → 7-29 着底。\n③ 1943-11-05「利根は隼鷹を曳航、11月6日呉に到着」——**TROM 未点名拖带者，此处为单源。**"
