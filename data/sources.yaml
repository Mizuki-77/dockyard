    给出双方编成与逐时进程：德方 Z-32 / Z-24 / ZH1 / T-24； 盟方 Tartar（旗舰，兼领 19 分队：Ashanti / Haida / Huron） 与 20 分队（旗舰 Błyskawica，含 Piorun）。 约 0130 德舰转向并各射 4 条鱼雷，盟方规避后进入夜战； ZH1 约 0235 被自沉，Z-32 约 0500 弹药耗尽后抢滩、次日被 RAF 击毁。
