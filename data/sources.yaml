- id: london-gazette-38098
  title: Supplement to The London Gazette, 16 October 1947 — Despatch on the sinking of the Bismarck (Admiral Sir John Tovey)
  url: https://www.thegazette.co.uk/London/issue/38098/supplement/4857/data.pdf
  type: primary_archive
  tier: A
  role:
  - data
  - narrative
  operator: The Gazette (UK official public record)
  lang: en
  access: direct
  fetched: 2026-11-22
  license: pd
  note: '**本轮唯一的一手材料，也是本舰 1941-05-26 夜战全部数值的唯一来源。**

    抓取范围是 4857-4860 四页 PDF（同一份战报连页），逐页用 pypdf 提取文本。 与本舰直接相关的是第 4858 页第 73-76 段：

    第 73 段："The BISMARCK was sighted by PIORUN, on the port wing, at 2238 ... at 2242 the enemy opened a heavy fire on PIORUN, who made a spirited reply before turning away under smoke."

    第 74 段：驱逐舰整夜保持接触至 0845，德舰 "frequently and accurately engaged" 诸舰但 "suffered a very small number of casualties"。

    第 75 段（**本舰数据的核心**）："The Piorun closed the range and herself opened fire from 13500 yards but after firing three salvoes, she was straddled by a salvo which fell about 20 yards from the ships side.
    She then ceased fire and turned away to port while making smoke. ... She remained under fire for about one hour but was not hit. ... at 0500, he was ordered ... to proceed to Plymouth to fuel if not
    in contact with the enemy. ... PIORUN continued to search until 0600 and left an hour later."

    第 76 段：对五艘驱逐舰夜战的总评，"without suffering damage, other than by splinters, to any of their ships"。

    **口径提示一：13,500 码是本舰的开火距离。** 通俗叙述里流传的 「3,500 码极近距离」在这份文件里没有对应文字；本站以本件为准。

    **口径提示二：本件明写本舰「未被命中」（was not hit）。** 任何「Piorun 命中俾斯麦数发」的说法都与本件冲突。

    **口径提示三：本件不含任何技术参数。** 排水量、主尺度、武备配置 一律不能引它。

    PDF 文本 OCR 质量一般（"PIORUN" 拼写正确但存在 "through"/"ihrough"、 "moat"/"most" 这类逐字误识），引用时以语义为准、不逐字照抄错字。 原始 PDF 与提取文本存 work/staging/g6-piorun/_raw/lg-4858.{pdf,txt}。

    '
