  note: "**本舰最关键的一份一手档案**：1945-08-13 在关岛召开的海军调查法庭 （Court of Inquiry）全部「Findings of Facts / Opinions / Recommendations」。 **直连 TLS 失败，经 Wayback 快照取得。** 提供的事实（原文照录见 RESEARCH-NOTES §2）： · 离关岛「departed Apra Harbor, Guam at about 0900 KING, 28 July」，经「Peddie」\n  航线，「making engine revolutions for seventeen knots」；\n· 沉没时刻「about 0005 July 30, 9 ½ zone time」，位置 12°02'N 134°48'E，\n  「sank in about fifteen or twenty minutes」；\n· 未规避「Indianapolis was not zigzagging at the time the explosions occurred」； · 战备状态「condition of readiness three, material condition YOKE modified」； · 无线电「no distress message did leave the ship」； · 发现幸存者「At about 1125 ITEM, 2 August ... Lieutenant (junior grade)\n  Wilbur C. Gwinn ... sighted what he estimated to be thirty survivors at\n  11° 30' North, 133° 30' East」；\n· 在舰人数「there were 82 officers and 1,114 enlisted men aboard」，\n  失踪「67 officers and 809 enlisted men」，另「Four enlisted men died while\n  enroute to the hospitals」；\n· 官僚失误的定性「failure to inquire into the reason for\
    \ non-arrival of\n  Indianapolis at Leyte on schedule was primarily due to a faulty system which\n  had grown up」，直接点名 Pacific Fleet Confidential Letter 10CL-45\n  「Arrival reports shall not be made for combatant ships」；\n· 结论「failure ... to transmit a distress message was the primary cause of\n  delay」；对舰长的意见是「failure to order zigzag courses ... was a\n  contributory cause」，并建议送军事法庭。\n⚠️ 时刻口径：发现幸存者本页作 1125 KING，DANFS 作 1025，两说并列。"

