    D/B attack； 舰队航速下 pom-pom 指挥仪振动大到 C.O.F.A.S. 整个震断； Safety Depression Control Gear, as fitted in ILLUSTRIOUS is completely useless； Under Action conditions the Evershed system failed completely； Events
    proved that 13 men were killed at Pom-Poms who in fact were serving no useful purpose on their mounting。 另有四个 4.5in 指挥仪（A/B/X/Y）在报告中逐一出现，可作 4 部的旁证。

    '
