  note: '**解"命中数争议"的一手依据**。Rodney 当日实发 16 英寸 378 发、6 英寸 706 发， 并逐炮塔逐炮管列出（A 104 / B 144 / X 130；B 塔三管 45+44+52=141，与塔的总计 144 不符， 原报告自身有 3 发误差，引用时须说明）。注意这只是 Rodney 一舰、且是 "preliminary" 报告； KGV 与 Norfolk/Dorsetshire
