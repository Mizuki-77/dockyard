  fetched: 2026-11-28
  license: public_domain_us_gov
  note: "1945-12-13 华盛顿海军船厂军事法庭上 I-58 舰长桥本以行的证词（pp. 266-276）， 经译员转述。**美军请敌方潜艇舰长出庭作证，在海军史上没有先例**，这是本案最 著名的一幕。关键问答： · 发射「at a distance of 1500 meters」，「Type 95 torpedoes, propelled by\n  oxygen」，「Five war-heads were magnetic, one, inertia type」，\n  「fired with a spread of three degrees and at intervals of three seconds」；\n· 命中「saw his torpedoes make three hits in the forward part of the ship\n  between the bridge and bow」，另听到疑似第四雷；\n· 是否规避「Was the target zigzagging at the time you sighted it?」\n  「there was an indistinct blur, and he is unable to determine whether or not\n  it was zigzagging」；\n· 最关键的一问一答「Would it have made any difference to you if the target had\n  been zigzagging on this attack?」「It would have involved no change in the\n  method of firing the torpedoes, but some changes in maneuvering.」\n法庭于 1945-12-14 继续开庭；判决日期未见于此摘录页，正文按「1945-12」记。 口径提示：桥本记命中三雷，DANFS 与调查法庭均记「两次重爆 / 两枚鱼雷」， 两说并列——鱼雷定深与磁引信在船底下方爆炸，观感与命中数不必一一对应。"

