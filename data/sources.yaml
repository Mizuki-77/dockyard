  license: all_rights_reserved
  note: '80 页残骸法证报告，约 4 MB。**本舰沉没机制研究的关键文献。**

    核心发现：沉没不是「鱼雷直接命中 vs 抽水泵失效」的二选一， 而是三条独立破坏链叠加 —— 鱼雷破口、螺旋桨轴旋转把舱壁铰穿、 电力丧失导致排水泵失效。泵失效是第三条链的下游症状。

    '
