- id: nhhc-court-martial-hashimoto
  title: Testimony of Commander Mochitsura Hashimoto at Court Martial of Captain Charles B. McVay, III（1945-12-13）
  url: https://www.history.navy.mil/research/histories/ship-histories/loss-of-uss-indianapolis-ca-35/investigation-and-court-martial/court-martial.html
  type: primary_archive
