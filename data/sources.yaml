  license: all_rights_reserved
  note: '**穿深查询器的数据源**。35 档距离（0–35,550 m）逐档给仰角、飞行时间、落角、着速、危险界、散布、穿深。 关键限制（原文自述）："All figures have been obtained extrapolating the official German projectile curves **by eye**" ——是人工读图外推，不是原始弹道表数字，因此只能作
    D 档。 穿深口径：38 cm Psgr. L/4,4 穿甲弹，命中垂直 90° 装甲带与水平甲板；**不含**横倾、纵倾、目标夹角与装甲带设计倾角。 即"穿深"一列不是实战穿深，是理想垂直命中值，页面上必须标注这一点。 示例值：10,000 m 时 93 mm（甲板）/ 0, 25,000 m 时 335 mm（装甲带）/ 100 mm（甲板）。 原始依据：Awa A IA100/40 g.Kdos
    "Unterlagen und Richtlinien zur Bestimmung der Hauptkampfentfernung und der Geschoßwahl"（由 William J. Jurens 提供）。

    '
