- id: kbismarck-debriefing
  title: Debriefing Reports from Bismarck Survivors
  url: https://www.kbismarck.com/archives/debriefing.html
  type: document
  tier: A
  role:
  - narrative
  operator: KBismarck (digitized wartime document)
  lang: en
  access: proxy
  fetched: 2026-11-17
  license: all_rights_reserved
  note: '**抓取陷阱**：真实路径在 /archives/ 下；不带 /archives/ 的 /debriefing.html 返回 404。 这是 Naval Group Command West 1941-06-14 的 B.Nr. g.Kdos. 3156/41 A1 转呈件封面， 正文只有呈文，被审讯的 5 名生还者（Manthey / Herzog / Höntzsch / Lorenzen
    / Maus）的逐人记录是附件 a–f，本页未收录。 关键证词价值：文件本身承认"实际沉没过程没有任何生还者目击"（"The actual sinking was not witnessed by any of the survivors"）， 且指出 3 名 U74 获救者的证词前后矛盾（先说带充气艇跳海、后改口被浪冲下海）——这是评估自沉说的第一手旁证。

    '
- id: navweaps-38cm-sk-c34
  title: 38 cm/52 (15") SK C/34 — Naval Weapons of the World
  url: https://www.navweaps.com/Weapons/WNGER_15-52_skc34.php
  type: website
  tier: D
