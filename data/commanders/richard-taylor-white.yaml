id: richard-taylor-white
name:
  zh: 理查德·泰勒·怀特
  en: Richard Taylor White
  full: Captain Richard Taylor White, DSO & Two Bars, RN
rank_final: Captain
rank_at_post: 'Cdr'
nation: united_kingdom
summary_zh: 祖鲁人号末任舰长，四个半月任期以随舰弃船收场，三获 DSO
life:
  born: 1908-01-29
  born_place: 蒂克希尔城堡（Tickhill Castle，约克郡）
  died: 1995-03-03
  died_place: 西莫林（West Malling，肯特郡）
intro:
  - heading: 四个半月的任期
    text: >-
      1942 年 4 月 28 日，White 接掌祖鲁人号；9 月 14 日夜里，这艘船在托布鲁克外海沉掉，
      他在最后一刻把舰员交给另一艘驱逐舰，自己留到不想再留为止。
      任期四个半月，其中一半在地中海的巡逻与护航里，另一半是运兵、挨炸、拖带、弃船。
      他此前刚在冰岛站指挥过鞑靼人号搜过提尔皮茨，再往前是两年大西洋护航。
      皇家海军驱逐舰舰长的职业生涯常常这样被切成小块，一块一段海，一段一个结局。
  - heading: 家族与学校
    text: >-
      他生于约克郡的蒂克希尔城堡，是第四代从男爵阿奇博尔德·怀特的次子，
      也是这个家族在沃林韦尔斯祖宅出生的最后一人——那座 1699 年起的宅子，
      1926 年由他父亲卖掉。13 岁入达特茅斯的不列颠尼亚皇家海军学院，
      在洛克思帕克预备学校时是全校第一名与板球、橄榄球队长。
      这条路是标准的英国海军世家路径：公学、达特茅斯、下舰队。
      非标准的是结局：他把这条路一直走到 1955 年，最后以海军少将副官身份退役。
  - heading: 三枚 DSO 与它们的来处
    text: >-
      三枚 DSO 都产生在驱逐舰舰长任上，前两枚来自同一条船、同一套动作。
      1940 年 2 月 5 日，Antelope 号在英吉利海峡护航，一个下午连打沉两艘 U 艇；
      同年 11 月 2 日又击沉 U-31。第三枚来自祖鲁人号：1942 年 9 月 14 日，
      他为拖带重伤的锡克人号两次接缆，缆索被岸炮打断，随后按对方舰长命令撤离，
      最终在本舰沉没前把全员转出。勋奖公告只写一行「mastery, determination and skill」，
      具体做了什么要到战报里找。
  - heading: 托布鲁克那三十小时
    text: >-
      协议作战是那种从计划阶段就注定要付代价的行动。9 月 13 日深夜两条部族级
      在涌浪里放艇，登陆耗时是平时的两倍；天亮后岸炮开火，锡克人号首先失去动力。
      White 两次尝试拖带，第二次缆索被炮弹打断。此后八小时是持续空袭：
      巡洋舰考文垂号被两雷击中当场沉没，祖鲁人号在 16:00 被十八架飞机轰炸，
      最终一枚炸弹穿进机舱。他把舰员转到 Croome 号，只留两名军官与九名水兵在船上，
      20:00 下令停止拖带，随后祖鲁人号向右倾覆。
timeline:
  - date: 1908-01-29
    text: >-
      生于约克郡蒂克希尔城堡，第四代从男爵 Sir Archibald White 次子。
    src: [unithistories-rn-w3, enwiki-white]
  - date: 1921-09-15
    text: 入达特茅斯不列颠尼亚皇家海军学院。
    src: [unithistories-rn-w3, enwiki-white]
  - date: 1938-09-24
    text: 首次任舰长，指挥 Antelope 号驱逐舰（朴次茅斯本地驱逐舰分队）。
    src: [unithistories-rn-w3, uboat-cdr-white]
  - date: 1940-02-05
    text: >-
      护航 OA-84 期间，Antelope 号当日击沉 U-41 与另一艘 U 艇；
      U-41 全艇 49 人阵亡。为此获 DSO（1940-07-11 公告）。
    src: [uboat-u41, unithistories-rn-w3, uboat-cdr-white]
  - date: 1940-11-02
    text: >-
      护航 OB237 期间，与阿凯茨号协同击沉 U-31（2 死 44 生还）；
      获 DSO 加衔（1941-01-14 公告）。
    src: [uboat-u31, unithistories-rn-w3]
  - date: 1942-02-17
    text: 任鞑靼人号（HMS Tartar）舰长，冰岛站，期间参与搜索提尔皮茨号；6 月 30 日已晋升中校。
    src: [unithistories-rn-w3, uboat-cdr-white]
  - date: 1942-04-28
    text: 接掌祖鲁人号（HMS Zulu），地中海舰队，基地亚历山大或海法。
    src: [uboat-zulu, unithistories-rn-w3]
  - date: 1942-08-04
    text: 与锡克人号、Croome 号、Tetcott 号及 RAF 221 中队飞机合力击沉 U-372；获通报嘉奖。
    src: [naval-history-zulu, unithistories-rn-w3]
  - date: 1942-09-13
    text: >-
      协议作战。祖鲁人号与锡克人号、考文垂号运送皇家海军陆战队第 11 营登陆托布鲁克；
      夜间放艇因涌浪耗时加倍。
    src: [enwiki-white, naval-history-zulu]
  - date: 1942-09-14
    text: >-
      锡克人号被岸炮击中失去动力，White 两次尝试拖带，缆索被炮弹打断；
      07:08 奉命放弃拖带撤往考文垂号。14:45 会合后考文垂号于 15:05 被两雷击中沉没；
      16:00 十八架德机轰炸祖鲁人号，一弹入机舱。20:00 停止拖带、转移全员，
      本舰向右倾覆沉没于 32°00'N 28°56'E。全役 12 人阵亡、27 人失踪、1 人受伤。
    src: [enwiki-white, naval-history-zulu, uboat-zulu]
  - date: 1942-10-01
    text: >-
      任风信子号（HMS Hyacinth）护卫舰舰长，该舰随后移交希腊皇家海军；至 1943-03-05 卸任，
      其后转任驻希腊海军联络官至 1944 年春。同年 12 月 22 日，因托布鲁克行动的救援与拖带
      获第二枚 DSO 加衔。
    src: [unithistories-rn-w3, uboat-cdr-white]
  - date: 1944-06-06
    text: 登陆日，任轻巡洋舰 Despatch 号舰长，该舰为黄金海滩马尔伯里人工港的指挥舰。
    src: [enwiki-white]
  - date: 1945-09-02
    text: 率 Terpsichore 号驶入东京湾，位居密西西比号战列舰编队之首，参加日本投降仪式。
    src: [enwiki-white]
  - date: 1950-05-13
    text: >-
      任哥萨克号（HMS Cossack）舰长兼第 8 驱逐舰纵队指挥官；当日截停并扣留
      被中国国民党人员劫持的货船 Ethel Moller 号，押送香港。1946-01-01 已晋升上校，
      时为皇家海军最年轻的上校。
    src: [enwiki-white, unithistories-rn-w3]
  - date: 1955-07-07
    text: 以海军少将副官（Naval ADC to the Queen）身份退役。
    src: [unithistories-rn-w3, enwiki-white]
  - date: 1995-03-03
    text: 卒于肯特郡西莫林的养老院，晚年长期患肺气肿。
    src: [enwiki-white, unithistories-rn-w3]
relations:
  ships:
    - ship: zulu
      role: 舰长（Cdr.），末任；1942-09-14 本舰沉没前将舰员转出，本人为最后离舰者之一
      from: 1942-04-28
      to: 1942-09-14
      note: >-
        本站 data/ships/zulu.yaml 记该任期，uboat.net 与 unithistories 逐日吻合。
        继任者无——本舰至此终结，White 是末任舰长。
        他本人未随舰沉没：20:00 停止拖带后，他带两名军官与九名水兵留在船上，
        最终与拖带组一同被 Hursley 与 Hurworth 救起。
  battles: []
src: [unithistories-rn-w3, uboat-cdr-white, uboat-zulu, naval-history-zulu, enwiki-white, uboat-u41, uboat-u31]
note: >-
  未收录战役关联：祖鲁人号沉于托布鲁克外海空袭（协议作战），本站无该战役条目；
  她参加的 1941-05-26/27 夜袭俾斯麦时舰长是 Harry Robert Graham，不是 White，
  故不能连 last-battle。
  第三枚 DSO 的功绩表述各源不一：英文维基与 unithistories 都写「attempt to save SHKH 09.42」，
  本站叙述以英文维基的逐时经过为骨架、以 naval-history-zulu 的逐日条目核对时点。
