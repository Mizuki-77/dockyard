note: >-
  提尔皮茨号从未与敌舰交火，故 relations.battles 留空——本站收录的三场战役它一场都没参加。
  任免日期以 kbismarck.com 与 deutsches-marinearchiv.de 的 1941-02-25 至 1943-02-24 为准，
  英文维基另作「1941 年 1 月 15 日起」，已在年表并列标注。生卒 1895-09-29 / 1981-04-24
  经德文维基与德国海军档案网两源核对一致。
