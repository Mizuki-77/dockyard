id: robert-sherbrooke
name:
  zh: 罗伯特·舍布鲁克
  en: Robert Sherbrooke
  full: Rear-Admiral Robert St Vincent Sherbrooke, VC, CB, DSO, RN

life:
  born: 1901-01-08
  born_place: Oxton Hall, Newark, Nottinghamshire, England
  died: 1972-06-13
  died_place: Oxton, Newark, Nottinghamshire, England

rank_final: Rear-Admiral
rank_at_post: 'Cdr'
nation: united_kingdom

summary_zh: 巴伦支海以重伤之身逼退德军重巡的 VC 得主

intro:
  - heading: 驱逐舰军官
    text: >-
      生于诺丁汉郡奥克顿，父亲是海军上校。1917 年 1 月入海军，在战列舰 Canada 上做海军候补少尉，逐级升到 1935 年的中校。
      两次大战之间他换过战列舰、巡洋舰、监视舰与训练舰，1939 年 7 月起指挥驱逐舰 Wakeful。
      他的战前履历没有一处显眼，真正的分野在 1939 年 12 月：他与维安对调舰只，接管了部落级驱逐舰哥萨克号。

  - heading: 与维安换舰的那三周
    text: >-
      哥萨克号当时隶属第 4 驱逐舰分队，原旗舰 Afridi 进厂修理，分队指挥官维安便与这条舰的舰长互换位置。
      于是舰长成了维安，舍布鲁克去指挥 Afridi。1940 年 1 月 18 日之后，哥萨克号开赴挪威搜捕 Altmark，
      在约辛峡湾完成那场登船——执行者是维安，不在场的是刚把这条舰交出去三周的舍布鲁克。
      3 月底两人又换回来：他重回哥萨克号，维安回 Afridi，此后 Afridi 在纳姆索斯外海被炸沉，而他在纳尔维克拿到 DSO。

  - heading: 1942 年 12 月 31 日：把敌人从船队身边推走
    text: >-
      1942 年底他以上校衔指挥第 17 驱逐舰分队，坐镇 Onslow，为开往北俄罗斯的 JW 51B 船队担任近距护航。
      12 月 31 日上午，德军重巡洋舰 Admiral Hipper、装甲舰 Lützow 与六艘驱逐舰出现在北角外海，兵力远占优势。
      他没有选择把船队护住等对方开火，而是主动率五艘驱逐舰迎上去，逼德军在鱼雷威胁下反复施放烟幕后退。
      交战四十分钟后 Onslow 中弹，他面部重伤、一只眼暂时失明，仍留在舰桥指挥，
      直到后继指挥官接手、船队脱离危险才离舰就医。

  - heading: 战后
    text: >-
      1948 年 11 月授二级准将衔，1951 年 7 月晋少将，末任职务是驻德海军司令兼盟国管制委员会英方海军首席代表（1951–1953），
      1954 年 3 月退役。任内另在 1953 年加冕授勋名单上获 CB。
      退役后他回到诺丁汉郡：1958 年任高级郡守，1968 年起任郡督，
      1954 至 1964 年任巴斯勋章骑士团团引礼官（Gentleman Usher of the Scarlet Rod），
      1964 至 1968 年任该骑士团注册与秘书。1972 年 6 月卒于奥克顿。

timeline:
  - date: 1901-01-08
    text: 生于诺丁汉郡奥克顿的奥克顿庄，父为海军上校 Henry Graham Sherbrooke（1877–1940）。
    src: [unithistories-sherbrooke, notts-sherbrooke-vc]

  - date: 1917-01-09
    text: 入海军，在战列舰 Canada 上开始服役。
    src: [unithistories-sherbrooke]

  - date: 1921-04-15
    text: 晋升上尉。
    src: [unithistories-sherbrooke]

  - date: 1929-04-15
    text: 晋升少校；1935-12-31 晋升中校。
    src: [unithistories-sherbrooke]

  - date: 1939-07-31
    text: 任驱逐舰 Wakeful 舰长。
    src: [unithistories-sherbrooke]

  - date: 1939-12-29
    text: >-
      接管哥萨克号。Afridi 进厂修理，其舰长维安与本舰舰长对调，哥萨克号由此成为第 4 驱逐舰分队的旗舰。
      本站采 uboat.net 的 1939-12-29 与 1940-01-18 两个交接日。
    src: [uboat-cossack, unithistories-sherbrooke]

  - date: 1940-01-18
    text: >-
      与维安对调，转任 Afridi 舰长；同日起哥萨克号由维安指挥。
      unithistories 记这一任期作「18.01.1940–04.1940」，与 uboat.net 记的 1940-03-29 结尾只差月份精度。
    src: [uboat-cossack, unithistories-sherbrooke]

  - date: 1940-04-13
    text: >-
      第二次纳尔维克海战，因该役获颁 DSO（授勋日期 1940-06-28）。当天他在哥萨克号上：
      该舰此役与 Foxhound、Kimberley 一同入港，击沉 German destroyer Eric Giese，自身被九发 5 英寸炮弹击中、搁浅；
      而 Afridi 当日在港外执行搜索任务，未参加港口内的战斗。
      uboat.net 记他此时已任哥萨克号舰长（1940-03-29 起），与之一致；unithistories 把 Afridi 任期结束日记作「04.1940」，只差月份精度。
    src: [unithistories-sherbrooke, uboat-cossack, naval-history-cossack, naval-history-afridi]

  - date: 1940-11
    text: 任驱逐舰 Matabele 舰长，至 1941 年 2 月。
    src: [unithistories-sherbrooke]

  - date: 1942-06-30
    text: 晋升上校。
    src: [unithistories-sherbrooke]

  - date: 1942-11-28
    text: 任 Onslow 舰长，兼第 17 驱逐舰分队指挥官。
    src: [unithistories-sherbrooke]

  - date: 1942-12-31
    text: >-
      巴伦支海海战。他率五艘驱逐舰为 JW 51B 船队护航，迎击 Admiral Hipper 与 Lützow；交战约两小时，
      Onslow 中弹，他面部重伤、一眼暂时失明，仍留舰桥指挥，待后继指挥官接手、船队脱险后方离舰。
    src: [unithistories-sherbrooke, victoriacross-sherbrooke, notts-sherbrooke-vc]

  - date: 1943-01-12
    text: 因巴伦支海行动获颁 VC，宪报日 1943-01-12，1943-06-29 在白金汉宫受勋。
    src: [unithistories-sherbrooke, victoriacross-sherbrooke]

  - date: 1945-07
    text: 任巡洋舰 Aurora 舰长，至 1946 年中。
    src: [enwiki-robert-sherbrooke]
    note: >-
      仅 E 级来源可查。naval-history 的 Aurora 舰史通篇不记舰长姓名，
      unithistories 的任免表 1944-04 至 1946-04 一段写的是「no appointment listed」。
      本条保留但降低权重，若日后拿到海军部任免公报再补 D 级以上来源。

  - date: 1948-11-29
    text: 授二级准将衔。
    src: [unithistories-sherbrooke]

  - date: 1951-07-07
    text: 晋升少将。
    src: [unithistories-sherbrooke, notts-sherbrooke-vc]

  - date: 1951-11
    text: 任驻德海军司令兼盟国管制委员会英方海军首席代表，至 1953 年 5 月。
    src: [unithistories-sherbrooke]

  - date: 1953-06-01
    text: 获颁巴斯勋章同伴（CB），1953 年加冕授勋名单。
    src: [unithistories-sherbrooke]

  - date: 1954-03-04
    text: 退役。
    src: [unithistories-sherbrooke]

  - date: 1972-06-13
    text: 卒于诺丁汉郡奥克顿，葬于奥克顿圣彼得与圣保罗教堂墓地。
    src: [unithistories-sherbrooke, notts-sherbrooke-vc]

