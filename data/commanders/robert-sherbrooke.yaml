note: >-
  最终军衔为 Rear-Admiral（少将），1954-03-04 以该衔退役。
  「巴伦支海一役导致希特勒于 1943 年初下令停用水面舰队」这一因果关系只见于英文维基（E 级），
  本档案正文不作断言；可确证的只有 VC 的 citation 内容与授勋日期。
