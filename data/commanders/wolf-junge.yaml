id: wolf-junge
name:
  zh: 沃尔夫·容格
  en: Wolf Junge
  full: Wolf Junge
rank_final: Kpt.z.S.
rank_at_post: 'Kpt.z.S'
nation: germany
summary_zh: 提尔皮茨号倒数第二任舰长，任内该舰已是一片不能动的浮炮台
life:
  born: 1903-01-05
  born_place: 施瓦岑贝格（Schwarzenberg，萨克森）
  died: 1964-02-21
  died_place: 兰布斯海姆（Lambsheim，普法尔茨）
intro:
  - heading: 接手的是一艘不动的战列舰
    text: >-
      1944 年 5 月 1 日，Junge 从负伤的 Hans Meyer 手里接过提尔皮茨号。
      这艘船当时的状态，和它 1941 年服役时已经完全不是一回事：1943 年 9 月被 X 艇
      在龙骨下炸过一轮，主机移位，修到 1944 年 3 月才重新能试航；
      4 月 3 日又在钨作战里被十发炸弹命中，死 122 人、伤 316 人。
      它锚在阿尔塔峡湾的卡峡湾里，外面围着防雷网，任务是当一支存在舰队。
      一艘开不出去的战列舰，舰长每天要管的其实是防空、损管、修理和士气。
  - heading: 钨作战那天的交接
    text: >-
      4 月 3 日 06:31，一枚炸弹命中右舷操纵台，舰桥与海图室起火，Meyer 还没进指挥室就被
      气浪炸伤。舰上战斗报告（B.Nr. Gkdos 395）在 06:36 之后记下：航海官临时接替指挥，
      舰长因伤重难以履职；07:05，舰长要求「第一军官」离开中央指挥所，
      07:10 由他接管全舰。报告通篇只写职务不写姓名——当时的第一军官正是 Junge。
      换句话说，他不是在办公室里接到任命，而是在一次空袭进行到一半时接下这艘船，
      一个月后才正式转正。
  - heading: 从参谋到舰上
    text: >-
      他和提尔皮茨号的多数舰长不同，战前战后有很长一段在岸上：
      1937 年入基尔海军学院，随后进海军最高统帅部作战处当参谋，
      一待五年多。1943 年 8 月 25 日才重新上舰，职务是第一军官，而不是舰长。
      战后文献记舰员对他评价不高，理由是海上操舰经验不足；
      这个评价经英文维基转引 Mallmann Showell 2009，不是一手材料。
      可以核实的只有一点：他的晋升节奏——1941 年 11 月海军中校、1943 年 4 月海军上校。
  - heading: 结局与身后
    text: >-
      1944 年 9 月 6 日，他因任提尔皮茨号舰长获金质德意志十字勋章。
      11 月 4 日调离，接任的是原第一军官 Robert Weber；八天后的 11 月 12 日，
      提尔皮茨号在特罗姆瑟外海被两枚高脚柜炸弹命中，倾覆沉没，971 人阵亡，Weber 亦在其中。
      他在沉没前八天离舰，战后进入私营企业，做到法兰肯塔尔 KSB 公司的人事主管，
      1964 年 2 月 21 日死于心肌梗塞，葬于兰布斯海姆。
timeline:
  - date: 1903-01-05
    text: >-
      生于萨克森施瓦岑贝格，父 Max Junge 为初级法院法官。
    src: [dewiki-junge]
    note: >-
      英文维基信息框写 1 月 3 日，与其自身正文及德文版的 1 月 5 日矛盾；
      Deutsches Marinearchiv 的舰长条目未填生卒。本站取 1 月 5 日。
  - date: 1922-03
    text: 在格里马王侯学校通过中学毕业考试，随后以志愿水兵入伍，入帝国海军。
    src: [dewiki-junge]
  - date: 1926-10-01
    text: 晋升海军少尉（Leutnant zur See）。
    src: [dewiki-junge]
  - date: 1937-10-05
    text: 入基尔海军学院进修，至 1938-07-25；随后调海军最高统帅部作战处任参谋。
    src: [dewiki-junge]
  - date: 1943-04-01
    text: 晋升海军上校（Kapitän zur See）。
    src: [dewiki-junge]
  - date: 1943-08-25
    text: 调提尔皮茨号任第一军官（I. Offizier），该舰时泊挪威。
    src: [dewiki-junge, deutsches-marinearchiv-tirpitz]
  - date: 1944-04-03
    text: >-
      钨作战。06:31 舰桥中弹，舰长 Meyer 负伤；07:10 第一军官接管全舰指挥。
      舰上战斗报告只记职务，同期第一军官为 Junge。
    src: [kbismarck-tirpitz-3444, deutsches-marinearchiv-tirpitz]
  - date: 1944-05-01
    text: 正式接任提尔皮茨号舰长（Kpt.z.S.），前任 Hans Meyer 任至 4 月 30 日。
    src: [kbismarck-tirpitz, deutsches-marinearchiv-tirpitz, dewiki-junge]
  - date: 1944-08-22
    text: 英航母编队连续空袭（8-22、8-24、8-29），8-24 两弹命中，死 8 伤 13。
    src: [kbismarck-tirpitz]
  - date: 1944-09-06
    text: 获金质德意志十字勋章，授勋时为提尔皮茨号舰长。
    src: [deutsches-marinearchiv-tirpitz, dewiki-junge]
  - date: 1944-09-15
    text: >-
      巴拉万作战。27 架兰开斯特自苏联亚戈德尼克起飞，一杖 5.4 吨高脚柜命中舰首，
      舰体严重受损、失去航海能力。
    src: [kbismarck-tirpitz, dewiki-tirpitz]
  - date: 1944-10-15
    text: 提尔皮茨号以 8 节速度自卡峡湾移泊特罗姆瑟外海，改作浮动炮台。
    src: [kbismarck-tirpitz, dewiki-tirpitz]
  - date: 1944-11-04
    text: >-
      调离提尔皮茨号，由原第一军官 Robert Weber 代理指挥。
      调任去向两说：德文维基记调国防军最高统帅部任第一海军参谋军官，
      英文维基记调海军最高统帅部任参谋，并列不裁。
    src: [deutsches-marinearchiv-tirpitz, kbismarck-tirpitz, dewiki-junge, enwiki-junge]
  - date: 1944-11-12
    text: 提尔皮茨号在特罗姆瑟外海被两枚高脚柜命中倾覆，971 人阵亡。
    src: [kbismarck-tirpitz]
  - date: 1945-01-11
    text: 任波罗的海海军高级指挥部第一指挥军官，至 1945-05-08 投降。
    src: [dewiki-junge]
  - date: 1964-02-21
    text: 死于心肌梗塞，葬于兰布斯海姆；生前任 KSB 公司人事主管。
    src: [dewiki-junge]
relations:
  ships:
    - ship: tirpitz
      role: >-
        舰长（Kpt.z.S.）。1943-08-25 起任第一军官，1944-04-03 舰长负伤后接管指挥，
        1944-05-01 正式接任。
      from: 1944-05-01
      to: 1944-11-03
      note: >-
        本站 data/ships/tirpitz.yaml 记该任期，与 kbismarck、Deutsches Marinearchiv、
        德文维基三源一致。DMA 把卸任日记作 11-04，与本站 11-03 相差一日，
        系「当日交接」的记法差别，不改数字。
  battles: []
src: [dewiki-junge, enwiki-junge, kbismarck-tirpitz, deutsches-marinearchiv-tirpitz, kbismarck-tirpitz-3444, dewiki-tirpitz]
note: >-
  Junge 的生平材料在三人中最薄：德文维基是唯一成文的完整传记（底本为 WASt 人事档案
  与 Grützner 2010 页 223-224），Deutsches Marinearchiv 只给任期与勋章日期，
  该站舰长条目的「geboren/gestorben」两栏对 Junge 是空白。
  本文件早期生平（1922 入伍、1926 晋升、1937 入海军学院）只有 E 级来源，
  已在 NOTES.md 注明；提尔皮茨号任期内的日期均有 D 级或 A 级支撑。
  未收录战役关联：本站无钨作战、巴拉万作战、教理问答作战条目，故 battles 留空。
