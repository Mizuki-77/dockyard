    \ 前一段又写 \"after she slowly split in half, the crew transferred\n    to Gwin late on the 15th\"（15 日晚）。\n(c) navsource-benham 写 \"Sunk by Japanese Warships off Guadalcanal November 15 1942.\" (d) navypedia-benham\
    \ 逐舰结局表写 \"sunk 15.11.1942\"。 本站按多数来源（c/d，以及 DANFS 自身把人员转移定在 15 日）取 1942-11-15， **但 DANFS 明写击沉时刻为 \"1938 on 14 November 1942\"，这一句原样保留在案， 不裁断。** 差异可能来自「战斗中受损」与「击沉浮体」两个不同事件的日期。\n"
- field: construction.fate_type
  value: sunk_by_scuttling
  src:
  - nhhc-danfs-benham
  valid:
    from: 1942-11-15
  confidence: B
  note: '**准确性质：被日军鱼雷致残后，由己方驱逐舰以 5 英寸炮火击沉两个浮体。** 不是直接被敌方击沉（那会在命中后短时间内沉没），也不是完全自沉（不是开阀通海）。 DANFS 原文："Because of heavy debris forward, Benham made little headway. Despite exhaustive damage control efforts,
    worsening seas progressively weakened the destroyer''s hull; and, after she slowly split in half, the crew transferred to Gwin late on the 15th. Benham''s two floating sections were then sunk by 5-inch
    gunfire off the south coast of Guadalcanal at 1938 on 14 November 1942." 本站 fate_type 枚举中最贴近的是 sunk_by_scuttling （已失去航行能力、由己方火力终结）。**不用 sunk_by_enemy**： 那样会让「被鱼雷命中即沉」与「拖了三十多小时后由友舰击沉」看起来是同一件事。 若主会话倾向于按「致沉原因」判为
    sunk_by_enemy，请在此条 note 里补一句并改值。

    '
