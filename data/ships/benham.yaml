- field: armament.mount.summary
  value: 1942 年中途岛时：4 × 5"/38 单装（前二封闭 Mk 30 Mods 0/2，后二敞开 Mk 30 Mod 1， 未拆炮）+ 6 × 20 mm 厄利孔单装 + 8 × 21 in 鱼雷管（2 座四联） + 4 座深弹投射器（共 44 枚）
  src:
  - navypedia-benham
  - navweaps-5in38-mk12
  - nhhc-danfs-benham
  valid:
    from: 1942-02
    to: 1942-11-15
  confidence: C
  note: '**炮数 4 门有第二来源佐证，是本条最硬的部分。** DANFS 记载 6 月 4 日战损时提到炮位编号："a stray antiaircraft shell hit the ship, killing Ens. Walter E. Pierce" —— 未给炮位。 但 DANFS 记 10 月 30 日的岸轰时写 "Benham alone expending 696 rounds
    of 5-inch ammunition"，与 4 门炮的配置相容（未给每门弹数，不构成证明）。 **炮座分型来自 navweaps**（见 data/classes/benham.yaml 的 mount 实体）。

    鱼雷管由 16 减为 8 的时点来自 navypedia 改装年表： "early 1942, Benham, Ellet: - 4 x 1 - 12.7/90, 2 x 4 - 533 TT; + 6 x 1 - 20/70 Mk 4, 4 DCT (44 DC at all)" —— 注意这一条把三件事合在一句话里：拆 4 挺 12.7 mm 机枪、拆 2 座四联鱼雷管、 加 6 门 20
    mm 与 4 座深弹投射器。**本舰与 Ellet 走的是单独一条改装线**， 与其余八舰（1941 年即减为 2 座鱼雷管）不同。

    **时间精度警告**：navypedia 只写 "early 1942"，中途岛（6 月）在此窗口之后， 故 8 管 / 6 门 20 mm 的配置可以认为在 6 月已经到位。 但**来源没有给出确切完成日期**，此为推定，不是记载。

    '
