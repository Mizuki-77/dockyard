# ============================================================================
# 单舰：HMS Rodney（罗德尼号战列舰，舷号 29）
# ----------------------------------------------------------------------------
# 与 tirpitz.yaml 同一套约定：只写本舰差异，舰级共有的设计数据不重复。
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 调研底稿：work/raw/rodney-tech.md（737 行，2026-11-21）
# 一手材料：work/raw/kb-rodney-report.txt（本舰炮术战报原文）
#
# 【本舰最硬的一块：最终战有一手战报】
#   她自己的《Preliminary Gunnery Report》已抓在本地并登记为
#   kbismarck-rodney-report（tier A）。弹药消耗、齐射构成、逐塔失效全部
#   来自这份原件，不是二手转述。
#
# 【但战报本身有三处瑕疵，引用时必须带着】
#   1) B 塔三管分计 45+44+52 = 141，塔总计却写 144，差 3 发
#   2) 齐射统计不平账：按次数×炮数得 371 发，与 §1 的 378 差 7 发
#   3) §2(a) 标题写「16" rounds fired」，但两个 Total 实际是齐射/舷射次数
#   这些是原件的问题，不是转录的问题。写进 note，不改数字。
# ============================================================================

id: rodney
name:
  zh: 罗德尼号
  en: HMS Rodney
class: nelson
open_ended_note: >
  纳尔逊级二号舰。1941-05-27 参与击沉俾斯麦，是当日开火最久、
  弹药消耗最多的一艘；也是史上首次以战列舰对战列舰发射鱼雷的舰。
  战后 1948-03 列入报废、1948-03-26 抵 Inverkeithing 拆解。

