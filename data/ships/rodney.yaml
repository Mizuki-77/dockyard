    note: >
      由玛丽长公主（HRH The Princess Royal）掷瓶下水。
      维基补了一个细节：掷瓶试了三次才砸碎那瓶帝国勃艮第葡萄酒。

  - field: construction.commissioned
    value: 1927-12-07
    unit: date
    src: [naval-history-rodney]
    valid: { from: 1927-12-07 }
    confidence: A
    note: >
      **注意这个日期，不是 1927-11-10**（那个常见说法是错的）。
      1927-12-07 在德文波特正式服役、编入大西洋舰队，首任舰长 Henry Kitson。
      另有一个「正式进入现役」节点 1928-03-28，两者不是同一件事 ——
      本舰 1927-12 服役时仍带一半舰员做着试航性质的值勤。

  - field: construction.fate_date
    value: 1948-03-26
    unit: date
    src: [naval-history-rodney]
    valid: { from: 1948-03-26 }
    confidence: C
    note: >
