  # 最终战的弹药消耗（本舰战绩，不属于任何单一武器实体）
  - field: armament.mount.summary
    value: >-
      1941-05-27 最终战弹药消耗：16 英寸 378 发、6 英寸 706 发；
      0916 与 0956 各射鱼雷。
    src: [kbismarck-rodney-report]
    valid: { from: 1941-05-27, to: 1941-05-27 }
    confidence: A
    note: >
      **16 英寸 378 发 vs Admiralty War Diary 记 380 发，两说并列不裁决。**
      差 2 发可能是统计口径（是否含哑火）。

      **6 英寸 706 发这一项是平账的**：六座炮塔分计
      128+93+154+97+160+74 = 706，与总计精确吻合。

      鱼雷：**史上首次以战列舰对战列舰发射鱼雷。**
      0916 第一次（一说可能 1 雷命中左舷），0956 再射 2 雷（2,700 m）。
      战报只记「发射」，是否命中三说并列，本站不裁决。
      另注：0850 一发德弹在左舷首外水中爆炸，冲击波卡死了左舷鱼雷管门 ——
      这可能是后来只从右舷射击的原因，但来源未明言因果。

  - field: armament.gun_failures
    value: >-
      X 炮塔在前 25 次齐射中只有 6 次能瞄准；25 次后又有 9 次不能（合计 28 次）。
      战斗结束时 A 塔右炮因 tilting tray 卡死；B 塔左炮因下发射药提升机
      double loaded 极短暂失效；B 塔中炮因两发弹无发射药暂时失效。
    src: [kbismarck-rodney-report]
    valid: { from: 1941-05-27, to: 1941-05-27 }
    confidence: A
    note: >
      逐条来自战报 §2 NOTE 与 §3，**原样引用，数字未改写**。

      X 塔射界本来就窄（60–130 度），但战报记的是「无法瞄准」，
      与射界限制不是一回事，不要混为一谈。
