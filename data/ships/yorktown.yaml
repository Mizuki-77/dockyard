# ============================================================================
# 约克城（USS Yorktown, CV-5）—— 约克城级首舰
#
# 2026-11-19 入库。数据来自 work/raw/yorktown-hornet-tech.md（922 行）。
#
# 与另两艘同级舰的硬差异：
#   1. 5"/38 炮架型号：约克城与企业号同为 Mk 21 Mod 16；
#      **大黄蜂是 Mk 24 Mod 2**（后改 Mod 6）——这是三舰最硬的装备差异。
#   2. 射击指挥仪：约克城与企业号 Mk 33；**大黄蜂 Mk 37**。
#   3. 雷达：约克城与企业号有 CXAM-1；**大黄蜂中途岛时只有 SC**，
#      CXAM 是 1942-06-20～28 才从加利福尼亚号拆来装上的。
#
# 中途岛时的特殊状态：
#   - 刚从珊瑚海重伤抢修回来（5-08 受损 → 5-27 抵港 → 5-28 进坞 → 5-30 出港）
#   - 5"/38 实为 7 座可用（#2 炮哑火后弹丸卡膛退出战斗）
#   - **超热器锅炉未动，限制了最高航速**——这直接影响它能否跟上 TF 16
# ============================================================================

id: yorktown
name:
  zh: 约克城号
  en: Yorktown
class: yorktown
note: >-
  约克城级首舰。中途岛战役中第 17 特混舰队旗舰（弗莱彻）。
  珊瑚海重伤后 48-72 小时抢修出战，6-07 被伊-168 击沉。

open_ended_note: >-
  本舰参数有效期自 1937-09-30 服役至 1942-06-07 沉没。
  与同级舰共用的舰体、动力、机库等数据写在 classes/yorktown.yaml。

