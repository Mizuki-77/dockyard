    value: 1474
    unit: persons
    src: [combinedfleet-mutsu-trom]
    valid: { from: 1943-06-08 }
    confidence: C
    note: >
      TROM 1943-06-08「353 survivors of the 1,474 crewmembers aboard MUTSU」——
      这是爆沉当日的在舰人数，含 113 名正在参观的予科練生徒与 40 名土浦海軍航空隊教官，
