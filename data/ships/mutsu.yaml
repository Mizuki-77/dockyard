  - field: service.fate_category
    value: 爆因第一说：内部自爆（人祸／发射药燃烧引发弹药库爆炸）
    src: [combinedfleet-mutsu-trom, navypedia-nagato]
    valid: { from: 1943-08 }
    confidence: B
    note: >-
      **两说并列之一，不裁决。**
      M 委员会两个月的调查结论：「The investigation concludes that the explosion was 'most likely
      caused by human interference'.」并指向一名被控轻微盗窃、定于 1943-06-08 在吴受军法审判的
      三番炮塔枪水兵（TROM 1943-06-09 条）。
      TROM 作者注另引战后最权威的专著：吉村昭《陸奥爆沈》（1970）采访了大部分生还者，
      他们的看法是该枪水兵「intended to escape from the ship while creating a magazine fire as a
      diversion. He must have disabled the temperature sensors prior to setting fire to several
      propellant charges, extracted from their fireproof cases, but evidently failed to exit the
      magazine before an explosion occurred.」
      navypedia 的表述更含糊但同向：「The principal cause of the explosion which has caused loss
      of the ship, often a crew negligence is specified.」
      调查同时排除了三式弹自燃（102 DC1 发射药 80 °C 以下不自燃、烟色不符），
      并因此恢复了三式弹的装舰。
      **这一说的问题**：所谓「人祸」始终没有法庭结论，1993 年后仍有日本研究者提出其他解释。

  - field: service.fate_category
    value: 爆因第二说：被潜艇（或鱼雷机／袖珍潜艇）击沉
    src: [combinedfleet-mutsu-trom]
    valid: { from: 1944-03-02 }
    confidence: C
    note: >-
      **两说并列之二，不裁决。**
      时间窗起点的取法：这一说作为**有日期的书面线索**最早见于 1944-03-02 的 FRUMEL 情报记录；
      它在 1943-08 M 委员会报告时即已被列入调查范围，但当时没有形成书面主张，故 valid.from
      取 1944-03-02 而非 1943-08。同字段两条因此不重叠，不会被校验器判成「同源自相矛盾」。
      TROM 明确记载这一说始终未被排除：「Doubts as to the cause of the disaster remain,
      especially by those who favor the explanation that a submarine attacked MUTSU.」
      三个支撑点：
      ① M 委员会本身就把「an improbable attack by a lone American torpedo plane or an attack by
         either a midget or a fleet submarine」列入调查范围（未作为不可能项排除）；
      ② 1944-03-02，美军墨尔本无线电情报单位 FRUMEL 的记录：「In regard to the continued absence
         of the battleship MUTSU from traffic, Honolulu now state they have some Jap prisoners of
         war who are definite that MUTSU was torpedoed in Home waters when on passage south and
         returned to Japan but her magazines blew up on arrival.」——这是战俘口供，不是作战记录，
         但证明美方当时也在追这条线索；
      ③ 数个月后日本海军官员曾就英国 X-craft 袭击提尔皮茨的「Operation Source」细节，
         询问德国驻东京海军武官 Paul Wenneker 少将（TROM 1943-09-01 后条）。
      另有 Fukui Shizuo 的说法：「MUTSU was destroyed by an explosive device delivered aboard by
      a Japanese sailor hired by the British naval intelligence」——同属外部破坏一路。
      **这一说的弱点**：爆沉当时柱岛泊地立即实施反潜警戒，未发现任何潜艇；
      前部 535 英尺段迅速沉没的形态也与鱼雷命中后的进水模式不完全吻合。
      本站两说并列，不裁决。

  - field: service.fate_category
    value: 停泊中第三号主炮塔弹药库爆炸，舰体断为两截沉没
    src: [combinedfleet-mutsu-trom, navypedia-nagato, kasado-nagato-names]
    valid: { from: 1943-06-08 }
    confidence: B
    note: >
      TROM 1213 条「Suddenly, MUTSU's No. 3 turret's magazine explodes. … MUTSU breaks in two.
      The 535-ft forward section collapses to starboard, sinks quickly and lies on the pagoda mast
      on the floor of the bay. The 147-ft stern section upends, but remains floating.」
      kasado「柱島泊地在泊中、爆発事故により沈没」。
      **炸的是三番炮塔，不是四番**——这一点极易记错（navweaps 41 cm 页提到
      「Turret #4 from Mutsu was erected as a static display at Etajima」，那是 1930 年代
      大改装拆下的旧炮塔，与爆沉无关；1970 年代打捞上来的才是四番残骸，
      见 TROM 1970-07-23 条「Turret No. 4 is salvaged」）。

  - field: service.fate_authority
    value: M委員会（委員長 海軍大将 塩沢幸一）
    src: [combinedfleet-mutsu-trom]
    valid: { from: 1943-06-09 }
    confidence: B
    note: >
      TROM 1943-06-09「The 'M-Commission', led by 60-year-old Admiral Shiozawa Koichi (32)
      (former CO of FURUTAKA) is convened to conduct a formal accident investigation.
      Shiozawa considers all possibilities from the possible detonation of Type 3 shells to
      improbable attacks by a lone American torpedo plane or an attack by either a midget or a
      fleet submarine. He is assisted by Rear Admiral Hoshina Zenshiro, the 22nd CO of MUTSU.」
      调查历时两个月（TROM「The 'M-Commission' labors for two months before presenting their
      report」）。

  - field: armament.gun_failures
    value: >
      1943-06-08 1213：三番主炮塔弹药库爆炸。调查结论「most likely caused by human interference」
      （最可能系人为），并指向一名因轻微盗窃案被起诉、定于 06-08 在吴接受军法审判的三番炮塔
      枪水兵；潜水员捞起第四号居住区（三番炮塔炮员住舱）的遗体，该嫌疑人的遗体不在其中。
      调查同时排除了三式弹自燃：102 DC1 发射药在常温储存下 80 °C 以下不能自燃，
      且幸存者一致看到棕红色烟（发射药燃烧的特征），而三式弹装药燃烧发白烟。
    src: [combinedfleet-mutsu-trom]
    valid: { from: 1943-06-08, to: 1943-08-31 }
    confidence: B
    note: >
      **本条记的是调查结论，不是史实定论。** TROM 原文详列了 M 委员会的排除过程：
      「A test is conducted at Kamegakubi proving ground using a specially built mock-up of
      No. 3 turret. All survivors agree that they saw a brown or reddish-brown smoke prior to
      the explosion, consistent with a propellant fire.」「Additional experiments show that under
      normal storage conditions the 102 DC1 propellant cannot ignite below 80 degrees Centigrade
      (176°F).」「The investigation concludes that the explosion was 'most likely caused by
      human interference'.」
      **爆因本身至今有四说以上，正文按两说并列处理，详见本条下一则与 RESEARCH-NOTES §3。**
      本条填在 armament.gun_failures 是因为注册表只有这个字段能容纳「逐条记录某场事故中的
      火炮/弹药失效情况」，而非因为这是炮术故障。已在 note 声明。

