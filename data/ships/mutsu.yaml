# ============================================================================
# 陸奥（Mutsu）单舰数据
# ----------------------------------------------------------------------------
# 只写与舰级文件不同的、本舰特有的项：
#   1) 建造日期、船厂、试航实测
#   2) 华盛顿条约存留经过（本级唯一一条「本来要被拆掉」的记录）
#   3) 逐次改装节点（1922 / 1927 / 1932-33 / 1934-36 / 1937-38 / 1942-43）
#   4) 1943-06-08 爆沉：伤亡、爆因（**四说并列，不裁决**）、隐蔽与调查、打捞
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
# ============================================================================

id: mutsu
name:
  zh: 陆奥
  en: Mutsu
class: nagato

open_ended_note: |
  本文件中 valid.to 留空的 fact 表示「至本舰 1943-06-08 爆沉为止持续有效」，
  不是漏填。本舰 1943-06-08 在柱岛泊地爆沉，1943-09-01 除籍，
  故未写 to 的时间窗终点即该日（除籍相关条目以 09-01 为终点）。

