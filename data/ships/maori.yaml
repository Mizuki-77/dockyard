# ============================================================================
# 单舰：HMS Maori（毛利人号，L24 → F24 → G24）
# ----------------------------------------------------------------------------
# 部族级中命运最特殊的一艘：它不是战沉于海上，而是 1942-02-12 在瓦莱塔
# 大港（Grand Harbour, Malta）的系泊浮标上被一枚炸弹命中机舱与齿轮舱，
# 当场爆炸沉没 —— 是「沉在港里」而非「沉在海里」。
#
# 因此本舰的阵亡数字极小（1 人）：驻马耳他时舰员按惯例夜宿岸上防空掩体。
# 这一条容易被误读成「损失轻微」，实际是「整艘舰报废」。
#
# 它的战史正面很亮：1941-12-13 在邦角（Cape Bon）与 Sikh / Legion /
# Isaac Sweers 一起夜袭击沉两艘意大利轻巡洋舰。
# ============================================================================

id: maori
name:
  zh: 毛利人号
  en: HMS Maori
class: tribal
open_ended_note: >
  部族级第四艘。1941-12-13 邦角海战击沉意大利轻巡洋舰两艘；
  1942-02-12 在马耳他大港系泊中被一枚炸弹命中机舱，当场爆炸沉没。

