      **这里有一处需要说明的记载差异（不是矛盾，是两个节点）。**
      uboat.net 记服役日 1939-01-02；naval-history 记
      "Build was completed on 30th November 1938"，并说 1938-11 起
      "Contractors trials and commissioning for service in 1st TRIBAL Destroyer
