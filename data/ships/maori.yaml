  - field: armament.aa_20mm.count
    value: 2
    unit: count
    src: [navypedia-tribal]
    valid: { from: 1941-01, to: 1942-02-12 }
    confidence: C
    note: >
      **两说并列，不裁决 —— 这是本组最重要的一处记载冲突，涉及四艘舰。**
      navypedia 的 1941 年初加装表分两行：
      "early 1941, Ashanti, Bedouin, Cossack, Eskimo, Maori, Mashona, Matabele,
      Mohawk, Nubian, Punjabi, Somali, Tartar: + 2 x 1 - 20/70 Oerlikon Mk II/IV"
      与 "early 1941, Sikh, Zulu: + 2 x 1 - 40/39 2pdr QF Mk VIII"。
      按这一说，本舰（与 Cossack）加的是 **20 mm Oerlikon**，
      只有 Sikh 与 Zulu 加的是 2-pdr。

      但 uboat.net 写的是另一回事："More rapid firepower was needed against
      the fast moving E-boats so HMS Cossack, HMS Maori, HMS Sikh and HMS Zulu
      had single 2 pounder guns mounted on each side of the bridge."（1941-07）
      按这一说，四艘都加的是 2-pdr。

      naval-history 的 Maori 页对这两种加装**完全没有记载**，
      无法作第三方裁判。两说并列：本字段取值依 navypedia，
      舰桥 2-pdr 一说见 armament.mount.summary 的 note。
      引用本数值时须同时说明「另一来源记为 2 门 2-pdr」。

