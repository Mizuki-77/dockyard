      即：1938-11 服役 → 1938-11-30 完工 → 1939-01-02 这个日期在
      uboat.net 上被标作服役日。两说并列，本条取 uboat.net 的
      1939-01-02（其口径明确写 "Commissioned"），完工日另见下一条。

