  # ---------------------------------------------------------------- 建造期间的保密措施（武藏独有的细节）
  - field: identity.name_note
    value: >
      建造期间以「第二号艦／Warship No. 2」代称；下水时以客货船春日丸并靠遮挡舰影；
      船台外挂棕榈纤维帷幕；动用 1,800 名警察、宪兵与水兵警戒
    src: [combinedfleet-musashi]
    valid: { from: 1938-03-29, to: 1942-08-05 }
    confidence: B
    note: >
      TROM 1938-03-29："In an attempt to hide the slipway from the foreign ships visiting
      Nagasaki a large curtain made of palm fiber rope is draped from the gantry crane over it.
      Prior to the start of construction the Sasebo Naval District authorities had purchased a
      total of 400 metric tons of wajuro palm fiber, causing a temporary shortage of that
      material in the Kyushu fishing industry."
      TROM 1940-11-01："As soon as MUSASHI is in the water, the new passenger-cargo liner
      KASUGA MARU (future escort carrier TAIYO) is towed alongside the battleship to block her
      silhouette from any foreign eyes. A combined force of 1,800 policemen, IJA Military Police
      (Kempeitai) and sailors of the Sasebo Sailor Corps patrols near the shipyard to ensure
      maximum secrecy during the launch."

  - field: identity.name_note
    value: >
      主炮装船时以帆布遮盖；46 cm 炮与炮塔由给兵舰樫野自吴运送，
      1941-10-06 起运，至 1941-12-08 全部主炮安装完毕
    src: [combinedfleet-musashi]
    valid: { from: 1941-10-06, to: 1941-12-08 }
    confidence: B
    note: >
      TROM 1941-10-06："Nagasaki. IJN special ammunition ship KASHINO arrives from Kure,
      carrying the first batch of 46-cm guns and one turret. Once aboard, the turret and gun
      are covered with canvas to maintain secrecy. By 8 December, all main guns are installed
      to the respective turrets."

  # ---------------------------------------------------------------- 本舰实测
  - field: displacement.trial
