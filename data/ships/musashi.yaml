# ============================================================================
# 武藏（Musashi）单舰数据
# ----------------------------------------------------------------------------
# 只写与舰级文件不同的、本舰特有的项：
#   1) 建造日期、船厂、建造代号、保密措施
#   2) 本舰实测值（公试 28.05 节 / 70,358 t / 167,310 shp、编制、伤亡）
#   3) 状态随时间变化（1942-07 首次防空强化、1942-09 二一号电探、1944-04 大改装）
#   4) 结局（1944-10-24 锡布延海）
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
# ============================================================================

id: musashi
name:
  zh: 武藏
  en: Musashi
class: yamato

open_ended_note: |
  本文件中 valid.to 留空的 fact 表示「至本舰战沉为止持续有效」，
  不是漏填。本舰 1944-10-24 沉没，故未写 to 的时间窗终点即该日。

