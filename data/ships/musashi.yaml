      (Nos. 7 and 8) and their directors are removed to make room for new 25-mm mounts and
      their directors. The searchlights are later reinstalled for use by Sasebo's AA batteries.
      … As a result of increased AA suite, the crew of MUSASHI is increased by two AA gunner
      divisions Nos. 6 (forward batteries) and 7 (stern area batteries)."

