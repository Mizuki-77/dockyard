    note: >
      **本舰独有的实测记录。** TROM 1942-06-22："On 22 June, MUSASHI achieves 28.05 kts in
      overload condition at 70,358 tons displacement (167,310 shp)."
      这是「overload condition」（过载状态）的排水量，不能当公试排水量标准值引用。

  - field: propulsion.power.trial
