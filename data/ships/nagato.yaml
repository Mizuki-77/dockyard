  # ---------------------------------------------------------------- 1944-10 莱特湾
  - field: armament.gun_failures
    value: >
      1944-10-24 锡布延海：一发炸弹击中艇甲板，炸坏一番锅炉舱进气口，
      导致一台螺旋桨轴停转、航速降至 22 节（1440 恢复）；炮廓炮 2 号、4 号被毁，
