# ============================================================================
# 長門（Nagato）单舰数据
# ----------------------------------------------------------------------------
# 只写与舰级文件不同的、本舰特有的项：
#   1) 建造日期、船厂、试航实测
#   2) 逐任旗舰身份（本级最关键的一条：**开战时旗舰已不是她**）
#   3) 逐次改装节点（1925 / 1932-33 / 1934-36 / 1938 / 1943 / 1944-06 / 1944-11 / 1945-06）
#   4) 1944-10 莱特湾的战损与伤亡
#   5) 结局：1946 年十字路口行动
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
# ============================================================================

id: nagato
name:
  zh: 长门
  en: Nagato
class: nagato

open_ended_note: |
  本文件中 valid.to 留空的 fact 表示「至本舰 1946-07 沉没为止持续有效」，
  不是漏填。本舰 1946-07-25 受重创、07-29 前后翻覆沉没，故未写 to 的
  时间窗终点即该日。

