    src: [combinedfleet-nagato-trom]
    valid: { from: 1944-10-24, to: 1944-10-25 }
    confidence: B
    note: >
      TROM 1944-10-24 1416 条「NAGATO is hit by two bombs and suffers three near misses.
      The first bomb explodes on the boat deck, damages the air intake of No. 1 boiler room,
      wrecks casemate guns Nos. 2, 4, disables three more guns and jams 127-mm AA gun No. 2.
      Due to the damage to the boiler room's air intake, it is shut down and causes one propeller
      shaft to stop. NAGATO's speed drops to 22 knots until 1440 when the boiler is put back on.」
      10-25 1243 条「Two bombs hit NAGATO in the bow; one ruptures her anchor deck, the other
      strikes a roller and explodes in the sea alongside, holing her bow.」
      **与 navypedia 冲突**：navypedia 记「received hits of three bombs which have put out of
