  - field: armament.aa_25mm.count
    value: 22
    unit: count
    src: [combinedfleet-nagato-trom, navypedia-nagato]
    valid: { from: 1943-05-31, to: 1944-06-26 }
    confidence: C
    note: >
      TROM 1943-05-31「Kure. Drydocked at No. 4 drydock. A Type 21 radar set and two 25-mm AA
      guns (twin mount) are fitted.」即 20 + 2 = 22 门。
      navypedia 同年条记「6/1943, Nagato: + 1 x 2 - 25/60 96-shiki, 1-shiki 2-go radar」，
      与 TROM 自洽（1 座双联 = 2 门）。

  - field: armament.aa_25mm.count
    value: 118
    unit: count
    src: [combinedfleet-nagato-trom]
    valid: { from: 1944-06-27, to: 1944-11-24 }
    confidence: C
    note: >
      TROM 1944-06-27「Two 140 mm. (5.5-in.) guns are removed and ninety-six (16 triple mount,
      10 twin mount, 28 single) 25-mm AA guns are added.」——16×3 + 10×2 + 28×1 = 96 门，
      原文说的是**新增 96 门**，不是总数。
      本字段按注册表口径只装「总数」，故：原有 22 门 + 新增 96 门 = 118 门。
      **118 是本站加法结果，TROM 原件没有这个数**，引用时必须注明。
      navypedia 同年条记「+ 16 x 3 - 25/60 96-shiki, 28 x 1 - 25/60 96-shiki」
      （未提 10 座双联 = 20 门），若按它算则为 22 + 48 + 28 = 98 门，与 118 并列不裁决。
      kasado 的 1944-10 栏另记「三連装14基 + 連装10基 + 単装30基」= 92 门，第三说。

  # armament.aa_25mm.count 1945 年状态：两个来源对不上，且都不可直接搬进 fact。
  #   · kasado 1945-02 栏「三連装14基 + 連装10基 + 単装30基」= 42 + 20 + 30 = 92 门（原文直接给的分基数列，本站换算管数）
  #   · TROM 1944-11-25「+ thirty (10 triple mount) 25-mm, minus one older triple mount」= +27 门，
  #     以 118 为基数得 145 门 —— 这是本站加减推算
  # 两者差 53 门，无法调和（可能一为「按座」一为「按管」，也可能部分炮已移上岸）。
  # 按红线 §3「推断值不进 fact」与 §1「查不到就写查不到」，只在下面保留可追原文的 92，
  # 145 一步列为推算并明确标注，见 RESEARCH-NOTES §7。
  - field: armament.aa_25mm.count
    value: 92
    unit: count
    src: [kasado-nagato]
    valid: { from: 1945-02-01 }
    confidence: C
    note: >
      kasado「長門:1945年2月頃」栏「九六式 60口径25mm三連装機銃:14基／連装機銃:10基／
      単装機銃:30基」。按管数换算：14×3 + 10×2 + 30×1 = 92 门。
      **这是本站按 kasado 的「基」数换算出的管数，kasado 原件只给座数。**
      注意本栏与 kasado 的「1944年10月頃」栏数字完全相同（14/10/30），
      即该表认为 1944-11 那次增装没有改变 25 mm 总数——这与 TROM 的「+27 门」直接冲突。
      **第三说（本站不写成 fact）**：若按 TROM 1944-11-25「+ thirty (10 triple mount),
      minus one older triple mount」= +27 门，以 118 为基数得 145 门。
      145 是「推算之上再推算」，按红线 §3 不进 fact，只在此留档。
      三说并列，不裁决。

  # 另注：TROM 1945-06-01 记「most AA guns … moved ashore」，Kasado 的 1945-02 栏 92 门
  # 是「移上岸之前」的舰上数。移岸后舰上还剩多少，两源均未给，故不写。

