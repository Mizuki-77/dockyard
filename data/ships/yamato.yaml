# ============================================================================
# 大和（Yamato）单舰数据
# ----------------------------------------------------------------------------
# 只写与舰级文件不同的、本舰特有的项：
#   1) 建造日期、船厂、编制、战历、结局
#   2) 本舰实测值（试航排水量/出力/航速、编制）
#   3) 状态随时间变化（雷达加装、防空强化、装甲局部增厚）
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
# ============================================================================

id: yamato
name:
  zh: 大和
  en: Yamato
class: yamato

open_ended_note: |
  本文件中 valid.to 留空的 fact 表示「至本舰沉没为止持续有效」，
  不是漏填。本舰 1945-04-07 沉没，故未写 to 的时间窗终点即该日。

