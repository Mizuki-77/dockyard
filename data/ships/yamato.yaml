    confidence: B
    note: >
      博物馆与 kasado 均记 27.46 节。注意 kasado 把 27.46 同时用于
      「大和型竣工時／大和 1944-10／大和 最終時／武蔵 最終時」四列，
      即该站把它当级的设计值而非单舰实测值；而武藏的实测是 28.05 节（见 musashi.yaml）。
      故本值对本舰而言是「公试速力」口径。

