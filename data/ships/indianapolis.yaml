  # ============================================================ 结局
  - field: construction.fate_date
    value: 1945-07-30
    unit: date
    src: [danfs-indianapolis, nhhc-court-of-inquiry-findings]
    valid: { from: 1945-07-30 }
    confidence: A
    note: >-
      **日期以美方 9½ 时区为准。** 调查法庭原句「an explosion occurred aboard
      Indianapolis shortly after midnight about 0005, zone time 9 ½, July 30」；
      DANFS 作「Early in the morning, 15 minutes into the mid watch on 30 July 1945」。
      ⚠️ **navypedia 把沉没日记成「sunk 29.7.1945」**，那是日方 I-58 的日期
      （-9 时区，7-29 2332 发射），不是错记，但本站日期字段统一用美方口径 1945-07-30，
      两说并列记在此 note。

  - field: construction.fate_type
    value: sunk_by_enemy
    src: [nhhc-court-of-inquiry-findings, ndaa-2001-sec545]
    valid: { from: 1945-07-30 }
    confidence: A
    note: >-
      国会 §545(a)(1) 原句「was torpedoed and sunk by the Japanese submarine I-58
      in what became the worst sea disaster in the history of the United States Navy」。
      调查法庭的措辞更谨慎：「the most probable cause of the explosions was that the
      ship been struck almost simultaneously by two torpedoes from and enemy
      submarine」，并列出次可能（水雷）与最不可能（内部爆炸）两种备选——
      1945 年 8 月时法庭还无法确证，1945-12 桥本出庭后才闭环。

  - field: service.fate_category
    value: >-
      战斗损失：1945-07-30 在菲律宾海被日本潜艇 I-58 以鱼雷击沉，两次重爆后
      12-20 分钟内倾覆（DANFS 记 12 分钟，调查法庭记「about fifteen or twenty
      minutes」，两说并列），位置 12°02′N 134°48′E。1945-09-01 除籍。
      舰体未打捞；2017-08-18 Paul G. Allen 的调查船 Petrel 在约 5,500 米深处
      发现残骸。**舰沉，舰长生还。**
    src: [danfs-indianapolis, nhhc-court-of-inquiry-findings, navsource-ca35]
    valid: { from: 1945-09-01 }
    confidence: A
    note: >-
      除籍日 navsource 原句「Stricken 01 SEP 1945」。
      沉没时长：DANFS「sank in 12 minutes」vs 调查法庭「sank in about fifteen or
      twenty minutes」，**两说并列，不裁决**。
      残骸海域：DANFS 作「resting on the floor of the North Pacific」，navsource 作
      「in the Philippine Sea」，**两说并列，不裁决**；深度两源一致（约 5,500 m）。

