# ============================================================================
# 印第安纳波利斯号（USS Indianapolis, CA-35）—— 波特兰级二号舰 · 单舰差异文件
# ----------------------------------------------------------------------------
# 【本文件只写差异】
#   主尺度、排水量、动力、装甲方案与厚度、8"/55 主炮三座三联装炮位、
#   5"/25 八座单装炮位、鱼雷管 0 —— 全部已在 data/classes/portland.yaml
#   的 56 条 fact 里，此处**一条都不重复**。
#   本文件写的是「换一艘同级舰就会变」的东西：建造节点、舰长、旗舰任期、
#   逐次改装后的防空/雷达/涂装、以及 1945-07-30 这一天的结局与伤亡。
#
# 【本舰最容易写错的三件事，先在这里说清】
#   一、**舰沉 ≠ 舰长死。** 1945-07-30 本舰沉没；舰长 Charles B. McVay III
#       生还（获救名单里排第一位），1945-12 受军事法庭审判，1968 年自杀。
#       沉没、审判、平反、自杀 是四件独立的事，绝不合并成一句。
#   二、**运的是「部件」，不是「整颗原子弹」。** 国家档案馆原句是
#       "shipped the collection of parts"；浓缩铀靶件（target component）
#       是 C-54 空运到天宁岛的，不在这条船上。正文按原句写，不自行升级措辞。
#   三、**平反是 2000-10-30，不是 2001。** 2001-07-11 是海军部长 England
#       把国会 §545 原文插入 McVay 人事档案的日期。两个日期都在本文件里，
#       但「平反」这件事挂在 2000-10-30 上。
#
# 【合并时必须做的一件事】把 indianapolis 加进 data/classes/portland.yaml 的
#   class_of（现为 [portland]）。依据交接报告 §3.6 与 audit_data.py 第 1 项：
#   「有舰 class 指向本级却没写进 class_of」报硬问题。
#
# 调研底稿：work/staging/g-indy2/RESEARCH-NOTES.md
# ============================================================================

id: indianapolis
name:
  zh: 印第安纳波利斯号
  en: Indianapolis
class: portland

note: >-
  波特兰级二号舰，舷号 CA-35。以印第安纳州首府命名（姊妹舰波特兰号取缅因州
  波特兰市，两舰同级但命名来源不同）。本舰是美国海军史上单舰沉没死亡人数最多的
  一艘，也是曼哈顿计划链条上唯一被击沉的运载舰。1945-07-30 在菲律宾海被日本
  潜艇 I-58 击沉，全舰 1,196 人（DANFS 作 1,195）中 316 人获救。
  本文件只写与波特兰级的差异；主尺度、装甲、动力、炮位布置见
  classes/portland.yaml。

open_ended_note: >-
  本文件多数 fact 的 valid.to 留空是结构性的：本舰 1945-07-30 沉没后不再有
  任何状态变化，故沉没之后的取值即为终值，「无已知终止事件」等同于「到舰体
  沉没为止」。状态变化集中在 1932-1945 的历次改装与旗舰任期，已按小段分别给出
  valid 窗口。凡 valid.to 落在 1945-07-30 的条目，指的是舰体状态的终点，
  与舰长、舰员的生死无关。

