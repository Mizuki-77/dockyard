  # ============================================================ 战历：1942
  - field: service.unit
    value: Task Force 17（中途岛，1942-06-02 至 1942-06-06）
    src: [danfs-portland, navweaps-oob-midway]
    valid: { from: 1942-06-02, to: 1942-06-06 }
    confidence: B
    note: >-
      DANFS 原句：「She was in Rear Admiral F. J. Fletcher's TF 17 carrier screen
      during the Battle of Midway (2-6 June) when the Japanese lost four of
      their carriers.」
      战斗序列页把它与阿斯托里亚号并列在「Task Group 17.2 Cruiser Group /
      RA William Ward Smith / Position: ComCruTF-17」之下。

  - field: service.unit
    value: Task Force 17 巡洋舰群（珊瑚海，1942-05-04 至 1942-05-08）
    src: [danfs-portland]
    valid: { from: 1942-05-04, to: 1942-05-08 }
    confidence: B
    note: >-
      DANFS 原句：「Portland served in Rear Admiral T. C. Kinkaid's Attack Group
      4-8 May when a Japanese invasion force was turned back from Port Moresby,
      New Guinea during the two-day battle of the Coral Sea. When Lexington
      (CV-2) was lost, the cruiser took on 722 survivors.」
      **注意编队名称的两说**：DANFS 说「Kinkaid's Attack Group」，
      navalenc 说「Task Group 17.2 (Rear Admiral Thomas C. Kinkaid) Was the new
      assignation for USS Portland」——两说说的是同一件事，
      但「TG 17.2」这个编号在珊瑚海时的指挥官是 Kinkaid，
      中途岛时是 William W. Smith，**同一个编号换了指挥官**。

  - field: service.unit
    value: TG 61.1.2（太平洋舰队第 16 特混舰队，随企业号掩护瓜岛登陆）
    src: [danfs-portland, savo-nwc-3]
    valid: { from: 1942-08-07, to: 1942-08-09 }
    confidence: C
    note: >-
      **这一条纠正了一个很容易犯的错误：波特兰号在瓜岛登陆时不在
      TG 62.3 里，所以萨沃岛夜战没有她。**
      DANFS 只写到「Portland provided cover and support for the Marine
      landings at Tulagi and Guadalcanal, the Solomons 7 through 9 August」，
      不给编队号。编队号出自 NWC 萨沃岛分析报告第 3 章的兵力编成表：
      「(b) TG 61.2, Amphibious Force ... (3) TG 62.3 Fire Support Group LOVE /
      Quincy, Vincennes, Astoria, Hull, Dewey, Ellet, Wilson 4 DD /
      (4) TG S62.4 Fire Support Group MIKE / San Juan 1 CL (AA) /
      Monssen, Buchanan 2 DD」
      而本舰出现在上面另一个位置：「(2) TG 61.1.2 (Pacific Fleet Task Force 16) /
      Enterprise (38 VF, 36 VD, 10 VT) 1 CV / North Carolina 1 BB /
      Portland 1 CA / Atlanta 1 CL (AA) / Balch, Maury, Gwin, Benham,
      Grayson 5 DD」
      ——**她在企业号那一边，与阿斯托里亚号分属两个不同的特混群。**
      这也解释了为什么 1942-08-09 的夜战损失名单里没有她。

  - field: service.unit
    value: Task Force 16（圣克鲁斯，1942-10-26 至 1942-10-27）
    src: [danfs-portland]
    valid: { from: 1942-10-26, to: 1942-10-27 }
    confidence: B
    note: >-
      DANFS 原句：「She then steamed south to take part in the Battle of Santa
      Cruz 26-27 October as one of the escorts for Enterprise (CV-6).」

  # ============================================================ 1942-11-13 战伤（一手细节）
  - field: armament.gun_failures
    value: >-
      1942-11-13 瓜岛海战：0158 中雷，三号炮塔在方向与俯仰上双双卡死；
      舰桥转向失灵，只能右转兜圈继续作战。
    src: [danfs-portland, navsource-portland]
    valid: { from: 1942-11-13, to: 1942-11-13 }
    confidence: B
    note: >-
      DANFS 原句：「During this action 13 November 1942, Portland took a torpedo
      hit at 0158 on the starboard quarter, which blew off both inboard
      propellers, jammed the rudder five degrees right, and jammed number three
      turret in train and elevation. A four degree list was quickly corrected by
      shifting ballast, but the steering casualty could not be overcome and the
      ship was forced to steam in circles to starboard.」
      navsource 的图注**逐字引用了同一段**，作为战损照片的说明
      （「To quote DANFS - "..."」），所以两处不是独立来源，是一个来源两处引用。

  # ============================================================ 武备：逐期（不带 about）
  - field: armament.mount.summary
    value: >-
      建成时：9 × 8"/55 Mk 9 系列（3 座三联装 triple mount）+ 8 × 5"/25
      （8 座单装）+ 8 × 12.7 mm 机枪；2 座弹射器、4 架水上飞机；无鱼雷管
    src: [navypedia-portland, danfs-portland, navsource-portland]
    valid: { from: 1933-02-23, to: 1942-02-01 }
    confidence: B
    note: >-
      三源一致（详见 classes/portland.yaml 的 armament.mount.summary 条）。
      **DANFS 舰首行写「a. 9 8", 8 5", 8 .50 cal.」——没有 3-pdr 礼炮，
      而阿斯托里亚号的 DANFS 行有多 2 门 3-pdr**，这是两舰 DANFS 条目的
      一处不一致，两处都按原文照抄。

  - field: armament.mount.summary
    value: >-
      1942 年初改装后：9 × 8"/55 + 8 × 5"/25 + 4 座四联 1.1"/75（28 mm）
      + 12 座单装 20 mm 厄利孔；SC / Mk 3 / Mk 4 雷达；仍无 40 mm
    src: [navypedia-portland, navalenc-portland, navweaps-8in55-mk12-15]
    valid: { from: 1942-02-01, to: 1943-05-01 }
    confidence: C
    note: >-
      navypedia 原句「early 1942, both: - 8 x 1 -12.7/90; + 4 x 4 - 28/75 Mk 1,
      12 x 1 - 20/70 Mk 4, SC, Mk 3, Mk 4 radars」。
      **主炮仍是 Mk 9 系列**：navweaps 的 8"/55 Mk 12/15 页装舰名单里
      （Tuscaloosa 子级 CA-37/38/39/44、Wichita、Baltimore、Oregon City）
      **没有 CA-33**，故中途岛当天本舰主炮必为 Mk 9 系列。
      navalenc 独立印证：「starting in early 1942: Four quadruple 1.1in were
      fitted abreast the bridge and close to the 5in guns. Later, twelve 20mm
      guns were added instead of the twin 0.5 in cal HMGs. They were fitted with
      radars: SC, Mk 3, Mk 4 radars.」
      **中途岛（1942-06-04）正好落在这个窗口内**，所以那天她就是这套配置。

  - field: armament.mount.summary
    value: >-
      1943-05 大改装后：9 × 8"/55 + 8 × 5"/25 + 4 座四联 40 mm Bofors
      + 4 座双联 40 mm Bofors（合计 24 管）+ 12 座单装 20 mm；
      SG / SK 雷达；拆除 1 座弹射器，载机降为 2 架
    src: [navypedia-portland, navalenc-portland]
    valid: { from: 1943-05-01, to: 1944-05-01 }
    confidence: C
    note: >-
      navypedia 原句「5/1943, both: - 4 x 4 - 28/75, 1 catapult, SC radar;
      + 4 x 4 - 40/56 Mk 1.2, SG, SK radars. Portland can carry 2 seaplanes and
      Indianapolis 3.」
      navalenc 原句「The AA saw four extra quadruple and four twin 40 mm
      Bofors, plus 12 supplementary 20 mm Oerlikon guns.」
      **「4 x 4 - 40/56」是 16 管，「四座双联」是 8 管，合计 24 管。**

  - field: armament.aa_40mm.count
    value: 0
    unit: count
    src: [navypedia-portland, navalenc-portland]
    valid: { from: 1933-02-23, to: 1943-05-01 }
    confidence: C
    note: >-
      **中途岛时是 0，不是「未获取」。**
      navypedia 的 40 mm 首次出现在「5/1943」那一条改装记录里；
      navalenc 也把 40 mm 写在 1943-05 的改装段。
      两源一致，故 1942-06-04 当天本舰 40 mm 数为 0。

  - field: armament.aa_20mm.count
    value: 12
    unit: count
    src: [navypedia-portland, navalenc-portland]
    valid: { from: 1942-02-01, to: 1943-05-01 }
    confidence: C
    note: >-
      navypedia 原句「+ 12 x 1 - 20/70 Mk 4」；navalenc「twelve 20mm guns were
      added instead of the twin 0.5 in cal HMGs」。两源互证。
      **这也是中途岛当天的数。**

  - field: armament.aa_40mm.count
    value: 24
    unit: count
    src: [navypedia-portland, navalenc-portland]
    valid: { from: 1943-05-01, to: 1944-05-01 }
    confidence: C
    note: >-
      navypedia「+ 4 x 4 - 40/56 Mk 1.2」= 16 管；
      navalenc「four extra quadruple and four twin 40 mm Bofors」= 16 + 8 = 24 管。
      **两源在这里的数字对不上**：navypedia 的改装条只写了 4 座四联，
      没写四联之外的 4 座双联。本条存 24（含 navalenc 补上的双联），
      两说并列。

  - field: armament.torpedo.tubes
    value: 0
    unit: count
    src: [navypedia-portland]
    valid: { from: 1933-02-23, to: 1946-07-12 }
    confidence: C
    note: >-
      见 classes/portland.yaml 同名 fact 的依据句。

