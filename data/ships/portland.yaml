# ============================================================================
# 波特兰号（USS Portland, CA-33）—— 波特兰级首舰
#
# 2026-11-23 建：为中途岛 TG 17.2 入库。
#
# 三处必须记住的事：
#   1. 她和新奥尔良级**不是同级**。本级只有两艘（CA-33 波特兰、CA-35 印第安
#      纳波利斯），炮塔是老的 triple mount（247-250 t，无旋转 stalk），
#      炮塔正面只有 64 mm、炮座只有 38 mm、司令塔只有 32 mm。
#   2. 中途岛时她的防空是 1.1"/75 四联装 + 20 mm 厄利孔，**40 mm 为 0**。
#      40 mm 是 1943-05 那次大改装才装的。
#   3. 她活到了战后：1946-07-12 退役、1959-03-01 除籍、1959-10-06 出售拆解。
#      中途岛只是她 16 枚战斗之星里的一枚。
#
# 【最容易搞错的一个日期】
#   她服役于 1933-02-23，比阿斯托里亚号（1934-04-28）早一年两个月。
#   navypedia 与 DANFS 在这一项上一致。
#
# 调研底稿：work/staging/tg172/RESEARCH-NOTES.md
# ============================================================================

id: portland
name:
  zh: 波特兰号
  en: Portland
class: portland
note: >-
  波特兰级首舰。舷号 CA-33。中途岛海战时与阿斯托里亚号同属 TG 17.2 巡洋舰群
  （RA William W. Smith 指挥，阿斯托里亚号为旗舰）。1942-11-13 瓜岛海战中
  被一条鱼雷打掉两个内侧螺旋桨、舵卡死在右 5 度，靠转圈继续作战并击沉一艘
  日军驱逐舰。战后 1959 年拆解。

open_ended_note: >-
  本舰生涯长达 13 年（1933-1946），战时经过 1942 初、1943-05、1944 夏三次
  主要改装，防空与雷达随之变化，用不同时间窗区分。未变的舰体参数
  valid.to 留空。

