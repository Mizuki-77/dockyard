  - field: aviation.aircraft.types
    value: SOC Seagull
    src: [navsource-portland]
    valid: { from: 1941-12-01, to: 1942-12-31 }
    confidence: C
    note: >-
      navsource 图注原句（1941-12 照片）：「Note the SOC-1 Seagull of Cruiser
