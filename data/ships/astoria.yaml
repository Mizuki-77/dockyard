  # ============================================================ 编制
  - field: service.complement.standard
    value: 899
    unit: persons
    src: [danfs-astoria]
    valid: { from: 1934-04-28 }
    confidence: B
    note: >-
      DANFS 舰首数据行原句「cpl. 899」。**与 navypedia 的级值 868、
      navsource 的 800 三说并列**，没有来源说明各自口径。
      DANFS 与 navsource 都不区分平时/战时。

  - field: service.complement.wartime
    value: 1074
    unit: persons
    src: [ussastoria-org]
    valid: { from: 1942-08-08, to: 1942-08-09 }
    confidence: C
    note: >-
      **1942-08-09 萨沃岛海战当夜的实际在舰人数**，不是编制表数字。
      ussastoria.org 转录的 CAPT Greenman 战报原句：「Out of a total of 83
      officers, 990 enlisted men, and one civilian newspaper correspondent,
      Joe J. Custer, on board」——83 + 990 + 1 = 1,074。
      载体是 D 级专题站的转录页，按 SCHEMA §2.1 记 C。

  - field: service.casualties
    value: 160
    unit: persons
    src: [ussastoria-org]
    valid: { from: 1942-08-09 }
    confidence: C
    note: >-
      ussastoria.org 转录的 CAPT Greenman 战报原句：「incomplete information now
      at hand indicated 61 officers, the news correspondent and 629 men were
      rescued. Of this number 7 officers and 78 men are wounded, many seriously.
      20 officers known dead, 2 unaccounted for. 138 enlisted men are known to
      be dead.」
      本条 = 已知阵亡 20 名军官 + 138 名水兵 + 2 名军官失踪 = 160。
      原文用的是「known dead」与「incomplete information now at hand」——
      这是当时能确认的数，不是最终核定数。
      **最终阵亡核定数未获取**：WDR No.29 谈伤亡只到「Personnel casualties
      were heavy during the twenty-minute action」这一层，没给总数；
      DANFS 通篇不给伤亡数。可核来源里没有最终数。

  - field: service.survivors
    value: 691
    unit: persons
    src: [ussastoria-org]
    valid: { from: 1942-08-09 }
    confidence: C
    note: >-
      同一句战报原文：「61 officers, the news correspondent and 629 men were
      rescued」——61 + 1（记者 Joe J. Custer）+ 629 = 691。
      **这是原始来源直接给的数，不是本文件算的。**
      同源另给在舰总数 83 + 990 + 1 = 1,074。
      1,074 − 691 = 383 人未生还，而同一份战报的「已知阵亡 + 失踪」只有 160
      （见上一行）——中间 223 人的差额原文未解释，很可能是尚未核实的失踪者。
      **这个差额是已知缺口，不要用 383 替代 casualties 字段。**

