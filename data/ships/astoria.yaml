# ============================================================================
# 阿斯托里亚号（USS Astoria, CA-34）—— 新奥尔良级 CA-32/34/36 组的三号舰
#
# 2026-11-23 建：为中途岛 TG 17.2 入库。
#
# 三处必须记住的事：
#   1. 她的生涯终点是 1942-08-09 萨沃岛海战，**就在中途岛之后两个月**。
#      所以「中途岛时的她」是一个只有严格时间窗才有意义的概念：
#      1942-06-04 那天她还在，1942-08-09 1215 沉没。
#   2. 中途岛时她的防空是 1.1"/75 四联装 + 20 mm 厄利孔，**40 mm 为 0**。
#      40 mm Bofors 她一天都没装过（navypedia 的 40 mm 换装记录是
#      「late 1943, all survived」，而她 1942-08 就没了）。
#   3. 1942-06-13 回珍珠港后装了 Mk 3 主炮火控雷达，1942-06-14 换了舰长
#      （Scanland → Greenman）。中途岛当时的主炮火控雷达是有还是无，
#      来源之间需要分开读，详见 sensors-radar 一节。
#
# 【本舰的「不一致」要提前说清】
#   DANFS 的舰首数据行给的是「dp. 9.950；cpl. 899」，而 1942-08-09 当夜
#   舰长战报的实载是 83 名军官 + 990 名水兵 + 1 名记者 = 1,074 人。
#   这两个 899 与 1,074 不是矛盾，是「设计编制」与「战时实载」的差别。
#
# 调研底稿：work/staging/tg172/RESEARCH-NOTES.md
# ============================================================================

id: astoria
name:
  zh: 阿斯托里亚号
  en: Astoria
class: new-orleans
note: >-
  新奥尔良级（CA-32/34/36 组）。舷号 CA-34，开工时编号 CL-34，1931-07-01
  改类为重巡。中途岛海战时为 TG 17.2 巡洋舰群旗舰（RA William W. Smith 坐舰），
  1942-06-04 午后约 1310 起一度兼作 TF 17 旗舰（Fletcher 从约克城号移旗上来）。
  1942-08-09 在萨沃岛海战中被日方炮火击沉，是「铁底湾」三艘被击沉的美军重巡之一。

open_ended_note: >-
  本舰 1941-04 至 1942-08 之间做过两次改装（1941-07 出坞、1942-06/07 珍珠港），
  防空与雷达随之变化，用不同时间窗区分。未变的舰体参数 valid.to 留空。

