  # ============================================================ 战斗经过（一手战报细节）
  - field: armament.gun_failures
    value: >-
      1942-08-09 萨沃岛：一号炮塔被击中面盘与炮座失效；二号炮塔因二号炮塔
      爆炸与前部 20 mm 弹药室起火而 2 号炮失效；后部 1.1 英寸 3 号炮座中弹
      起火、其结构破片使 4 号炮座失效；到 0200 时除 1 号炮外两舷副炮全部失效。
    src: [nhhc-wdr29]
    valid: { from: 1942-08-09, to: 1942-08-09 }
    confidence: A
    note: >-
      战损报告原文（逐句）：
      「The sixth 8" salvo hit the face plate and barbette of turret I putting
      it out of action and killing the personnel within the turret and the
      barbette.」
      「Gun No. 2, although not hit, was out of action because of the explosion
      and fire in turret II and the fire in forward 20mm clipping room.」
      「The first hit (No. 36) received by the ship was in mount No. 3 of the
      after 1.1" battery. A fire was started on the fantail ... Structural
      fragments from the No. 3 mount put No. 4 mount out of action.」
      「By about 0200 the port and starboard secondary batteries, except gun
      No. 1, were completely out of commission due to direct hits and to the
      fire amidships on the upper deck.」
      主炮射击数：战报原文另记「Estimate ten salvos were fired by main
      battery」，DANFS 记「When the turret responded with Astoria's 12th and
      final salvo」——**「十次齐射」与「第 12 次也是最后一次齐射」两说不裁。**


  # ============================================================ 结局判定（叙述）
  - field: service.fate_category
    value: >-
      1942-08-09 萨沃岛海战中被日军巡洋舰炮火击沉。破坏链是：中弹后机库内
      三架飞机与甲板上的艇起火 -> 火势引燃 5 英寸与 1.1 英寸弹药提升通道
      -> 前部 5 英寸弹药库在 1130 前后爆炸，把舷侧炸穿到水线以下
      -> 进水使左倾由 10 度增至 15 度 -> 1215 向左翻覆、尾部下坐沉没。
      这条链的每一环都出自 BuShips 战损报告 No.29 的原文。
    src: [nhhc-wdr29, danfs-astoria]
    valid: { from: 1942-08-09 }
    confidence: A
    note: >-
      战损报告原文（依次）：「the deck beneath grew hot」；
      「The fire by now had reached the lower 5" and 1.1" hoists as frequent
      explosions were heard below decks」；
      「a heavy explosion took place on the port side in way of the forward 5"
      magazines. The ship listed about 15° to port.」
      结论段：「In ASTORIA the initial heel was caused by the flooding of port
      side compartments due to the explosion of the 5" magazine.」
      **注意这不是「被鱼雷击沉」**：报告在 Quincy 与 Vincennes 两节都提到
      疑似鱼雷命中，在 Astoria 一节没有提；DANFS 也把 Astoria 的死因写作
      炮火与随之而来的火灾进水。这与 construction.fate_type 记的
      sunk_by_enemy 不冲突（fate_type 只分「被敌方击沉」这一类）。
