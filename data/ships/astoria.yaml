    note: >-
      navypedia 原句「2 catapults」。战损报告另有一手旁证：
      「... on the port catapult was set afire and shortly thereafter, was
      knocked off the catapult inboard onto the well deck」——
      提到「port catapult」，说明至少两座（左右各一）。

  - field: aviation.aircraft.capacity
    value: 4
    unit: count
    src: [navypedia-neworleans]
    valid: { from: 1934-04-28, to: 1942-08-09 }
    confidence: C
    note: >-
      navypedia 原句「4 seaplanes (OL, O2U, O3U, OJ)」——这是级表列举的
      **机型谱**，不是某一天的实载。战损报告给的是当夜实数：
      「The five airplanes on each ship except QUINCY had been drained of all
      gasoline.」**即 1942-08-08 夜本舰实载 5 架，不是 4 架**——
      这 5 架里包括机库里的 3 架（「setting afire the boats on the boat deck
      and the three planes in the hangar」）。两说并列：级表 4 架、
      战报 5 架，本条存级表值，战时实载写在这里。

  - field: aviation.aircraft.types
