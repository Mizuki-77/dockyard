  # ============================================================ 武备：逐期（不带 about）
  - field: armament.mount.summary
    value: >-
      1941-07 改装后：9 × 8"/55 Mk 9 系列（3 座三联装）+ 8 × 5"/25
      （8 座单装）+ 4 座四联 1.1"/75（28 mm）高炮 + 若干 12.7 mm 机枪；
      无 40 mm，无 20 mm
    src: [danfs-astoria, navweaps-11in75-mk1, ussastoria-org]
    valid: { from: 1941-07-11, to: 1942-06-13 }
    confidence: B
    note: >-
      DANFS 原句：「During her refit, she received quadruple-mount 1.1-inch
      antiaircraft machine guns and a pedestal fitted at her foremast in
      anticipation of the imminent installation of the new air-search radar.」
      ussastoria.org 原文把数量写清了：「She was modernized with the addition of
      quad 1.1-inch antiaircraft guns fore and aft.」
      炮座数另有独立来源：navweaps 1.1"/75 页的两张本舰照片图注
      「Newly added 1.1" (28 mm) anti-aircraft mount on USS Astoria (CA-34) in
      July 1941」与「1.1" (28 mm) anti-aircraft mounts on fantail of USS
      Astoria (CA-34) in July 1941」——即 1941-07 确实装上了。
      **navypedia 的对应改装条是「Astoria, 6.1941; ... : + 4 x 4 - 28/75
      Mk 1」，把日期记为 1941-06，与 DANFS 的 1941-07-11 出坞日差一个月，
      两说并列（DANFS 说的是「出坞日」，navypedia 说的是「改装动作」，
      很可能是同一件事的两个节点）。**

  - field: armament.mount.summary
    value: >-
      1942-06 珍珠港改装后：9 × 8"/55 Mk 9 系列 + 8 × 5"/25 + 4 座四联
      1.1"/75 + 6 座单装 20 mm 厄利孔；仍无 40 mm
    src: [navypedia-neworleans, ussastoria-org, navweaps-8in55-mk12-15]
    valid: { from: 1942-06-14, to: 1942-08-09 }
    confidence: C
    note: >-
      navypedia 改装表原句「mid-1942, all: - 8 x 1 - 12.7/90; + 6 x 1 - 20/70
      Mk 4, SC, Mk 3 radars」——**「all」指全级**，本舰的时间窗按
      「1942-06-14 改装完成」起算。
      **主炮仍是 Mk 9 系列，这一点有反面证据**：navweaps 的 8"/55 Mk 12/15
      页把装舰对象写成「Mark 12: Tuscaloosa (CA-37) sub-class, Wichita (CA-45)
      and Baltimore (CA-68)」并注明「The Tuscaloosa sub-class consisted of
      Tuscaloosa (CA-37), San Francisco (CA-38), Quincy (CA-39) and
      Vincennes (CA-44)」——**CA-32/34/36 一艘都不在这份名单里**。
      所以本舰从建成到沉没，主炮一直是 Mk 9 系列。
      20 mm 的存在另有战损报告的一手印证（本文件 armament.aa_20mm.count 条）。
      ussastoria.org 只提到「addition of new main battery fire control radar and
      blast bags」，没提 20 mm，故本条主要依 navypedia 的级改装表，记 C。

  - field: armament.aa_40mm.count
    value: 0
    unit: count
    src: [navypedia-neworleans, navweaps-40mm-bofors]
    valid: { from: 1934-04-28, to: 1942-08-09 }
    confidence: B
    note: >-
      **是 0，不是「未获取」，而且她整个生涯都是 0。**
      navypedia 的 40 mm 换装记录只覆盖「late 1943, all survived」——
      本舰 1942-08-09 沉没，从未进入这次改装。
      navweaps 也给时间下限：「Date In Service ... USA: 1942」，
      而美军重巡的 40 mm 换装普遍在 1943 年。
      中途岛（1942-06-04）当天的 40 mm 数为 0，有战斗序列与改装表两重支持。

  - field: armament.aa_20mm.count
    value: 6
    unit: count
    src: [navypedia-neworleans, nhhc-wdr29]
    valid: { from: 1942-06-14, to: 1942-08-09 }
    confidence: C
    note: >-
      navypedia 原句「mid-1942, all: ... + 6 x 1 - 20/70 Mk 4」。
      **20 mm 当时已经在舰上，有战损报告的一手旁证**：报告多处提到
      「the 20mm clipping room located immediately below the bridge」
      「the boats and the 20mm clipping room burned fiercely」
      「Gun No. 2 ... was out of action because of the explosion and fire in
      turret II and the fire in forward 20mm clipping room」——
      这些只能说明有 20 mm 弹药室，不能说明管数，故管数仍按 navypedia 记 C。

  - field: armament.aa_25mm.count
    value: 0
    unit: count
    src: [navypedia-neworleans]
    valid: { from: 1934-04-28, to: 1942-08-09 }
    confidence: C
    note: >-
      美舰不装日制 25 mm。此条只为「同级舰横向对比时不留空」而写，
