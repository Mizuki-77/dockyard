  - field: armament.mount.summary
    value: >-
      1941-05-24 丹麦海峡：本舰在编队前方，参与对胡德号与威尔士亲王号的炮击。
      主炮发射弹数 157 / 179 / 183 三说并存（来源互相矛盾，本站不裁决）。
