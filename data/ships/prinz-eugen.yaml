# ============================================================================
# 单舰：Prinz Eugen（欧根亲王号重巡洋舰）
# ----------------------------------------------------------------------------
# 挂靠舰级类：hipper（希佩尔海军上将级）。
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 调研底稿：work/raw/prinz-eugen-tech.md（1304 行，2026-11-21）
# 一手材料：本舰战争日志全译本（kbismarck-prinz-eugen-ktb，122 页 PDF，A 级）
#
# 【本舰的特殊地位】
#   它是俾斯麦在丹麦海峡唯一的僚舰。两舰的涂装、开火顺序、命中归属
#   都容易搞混，写作时必须分清。
#
# 【三条容易搞错的事实】
#
# 1) 它没有在「1942 年瑟堡空袭」中受损。
#    实际是 1941-07-02 在**布列斯特**干船坞被英军炸中，60 人死亡（含副舰长）。
#
# 2) 它不是「1960 年代倾覆」。
#    1946-12-22 就倾覆于夸贾林环礁的 Enubuj 礁，四源一致。
#    1960 年代大概是和 1978 年拆螺旋桨那次混了。
#
# 3) 丹麦海峡它一雷未发，而且这不是装备故障。
#    OKM 专门出了调查文件，结论是鱼雷官训练不足 + 火控雷达分配不当。
#    中文资料普遍漏掉这一条。
#
# 【资料状况：比预想好得多】
#   kbismarck 有本舰完整页面（prinzeugen.html，注意无连字符），
#   并挂着 122 页战争日志全译本的入口。本舰的一手档案并不缺。
#   但舰体细节（垂线间长、干舷、系数、GM、装甲总重）仍然大面积未获取。
# ============================================================================

id: prinz-eugen
name:
  zh: 欧根亲王号
  en: Prinz Eugen
class: hipper
open_ended_note: >
  希佩尔海军上将级三号舰。1941-05-24 丹麦海峡海战时是俾斯麦唯一的僚舰。
  战后 1945 年移交美国，1946 年被用作比基尼环礁核试验靶船，
  同年 12-22 倾覆于夸贾林，至今仍在原处。

