    src: [kbismarck-prinz-eugen-ktb, kbismarck-ds-bonomi]
    valid: { from: 1941-05-24, to: 1941-05-24 }
    confidence: A
    note: >
      **弹数三说并列**：157（一说）/ 179（一说）/ 183（一说）。
      来源互相矛盾且各自都有档案依据，本站不做裁决。

      **一雷未发这件事值得单说**：OKM（德国海军最高统帅部）为此专门出了
      调查文件，结论是鱼雷官训练不足 + 火控雷达分配不当，**不是装备故障**。
      中文资料普遍漏掉这一条，容易被误写成「鱼雷管故障」。

      ⚠️ 时间基准：本舰战争日志正文用 DSZ（UTC+2），
      而 Jasper 炮术报告用 MEZ（UTC+1），差整 1 小时。
      本站 denmark-strait.yaml 用 DSZ 是对的；引用 Jasper 报告的
      「0455 开火／0509 停火」必须 +1 小时换算。

