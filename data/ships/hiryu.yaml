# ============================================================================
# 飞龙（ひりゅう / Hiryū）—— 苍龙的改进型，日本海军唯一另一艘左舷舰岛航母
#
# 2026-11-19 入库。数据来自 work/raw/soryu-hiryu-tech.md（覆盖 87.1%）。
#
# **识别特征（最要紧的一条）：舰岛在左舷中央。**
# 日造航母中只有两艘用左舷舰岛——赤城与飞龙。
# 原文（Kojinsha Vol.6 p.91）：「The main difference in comparison with SORYU
# was the port amidships location of the island」。
# 英文维基：「one of only two carriers ever built whose island was on the
# port side (Akagi was the other)」。
#
# **「飞龙的舰岛与赤城设计互换」这个说法查不到任何依据。**
# 实际情况：1935 年航空本部同一份通達要求「舰桥与烟囱分置两舷、舰桥置于舰体中央附近」，
# 赤城先做木模型验证、飞龙因已接近完工来不及改，所以两舰都成了左舷。
# 不是互换，是同一指令并行 + 时间差。
# ============================================================================

id: hiryu
name:
  zh: 飞龙
  en: Hiryū
class: soryu
note: >-
  苍龙的改进型（基本计划番号 G10），按两型处理。
  舰岛在左舷中央——日造航母中仅赤城与本舰如此。

open_ended_note: >-
  本舰参数有效期自 1939-07-05 服役至 1942-06-05 沉没。
  与苍龙共用的动力、机库、拦阻索等数据写在 classes/soryu.yaml。

