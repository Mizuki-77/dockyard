    value: 昭和 9 年度（1934 年）②計画；基本计划番号 G10；名义为「蒼龍型二番艦」
    src: [japanese-warship-soryu]
    valid: { from: 1934 }
    confidence: C
    note: >-
      原文「当初は蒼龍の同型艦として計画・建造されていた。だが軍縮条約破棄により
      設計の自由度が増したため、飛行甲板幅を1m広げ艦幅を若干太くし、
      さらに第四艦隊事件による船体構造溶接化の破棄、凌波性向上のため
      艦首1m・艦尾40cm乾舷を高めるなど蒼龍とは違う図面で建造された空母となった。」
      即：条约废除后设计自由度增大 + 第四舰队事件后放弃焊接船体 + 提高干舷，
      所以两舰用的是**不同的图纸**。

