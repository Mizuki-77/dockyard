# ============================================================================
# 加贺（かが / Kaga）—— 加贺级战列舰改装航空母舰
#
# 2026-11-19 入库。数据来自 work/raw/kaga-tech.md（774 行，覆盖 84%）。
#
# **与赤城不是同一舰级。** 加贺原设计是**加贺级战列舰**（长门级改良型，
# 日方档案用「加賀型」，美英文献用「Tosa-class」，同一级）。
# 赤城来自天城型战列巡洋舰。两舰底子完全不同。
#
# 与赤城的三个实质差别：
#   1. **加贺换装了 12.7cm 八九式高角炮（8 基 16 门）；赤城至死保留 12cm 十年式。**
#      NavWeaps 原句：「The carrier Kaga … replaced by the 12.7 cm/40 Type 89 …
#      However, Akagi carried them to her end at Midway.」
#   2. 加贺 1942 年春因触礁修理，**错过了印度洋作战、杜立特追歼、珊瑚海**。
#   3. 沉没方式：当地 6/4 19:25 由萩风号两枚鱼雷处分。
#      日文维基另持「16:25 大爆炸致沉」说，两说并列。
# ============================================================================

id: kaga
name:
  zh: 加贺
  en: Kaga
class: kaga
note: >-
  加贺级战列舰（Tosa-class）改装航母。与赤城不同级——赤城来自天城型战巡。
  1935 年大改装后换装 12.7cm 高角炮，这是与赤城最大的武备差别。

open_ended_note: >-
  本舰参数有效期从 1928 竣工到 1942-06 战没，中间有 1935 年大改装。
  改装前后两套数据用不同时间窗区分。

