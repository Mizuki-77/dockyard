  # ============================================================ 改装与设备（逐次）
  - field: armament.mount.summary
    value: >-
      建成：8 × 4.7 in/45 QF Mk XII（4 座双联）+ 4 × 40 mm 2-pdr（1 座四联）
      + 8 × 12.7 mm 机枪 + 1 座四联 21 in 鱼雷发射管 + 深弹 30 枚。
      1941 年初：舰桥两舷各加 1 门单装 2-pdr（navypedia 记本舰与 Sikh 加的是
      2-pdr，而非 20 mm Oerlikon —— 见 note）。
      1941-06-10 至 07 法尔茅斯改装：主桅改为适配无线电测向天线的新结构、
      舰桥两舷加单装 20 mm Oerlikon、装 285 型炮术火控雷达、
      深弹投射器移到艉甲板。
    src: [naval-history-zulu, navypedia-tribal]
    valid: { from: 1938-09-07, to: 1942-09-14 }
    confidence: B
    note: >
      1941-06 法尔茅斯改装原句（naval-history）："replacement of mainmast by a
      new structure to suit fit of aerial for wireless direction finding outfit.
      20mm single Oerlikon mountings were fitted on bridge wings, Radar Type 285
      for main armament gunnery fire control installed and depth charge throwers
      re-sited on quarter deck."
      改装起于 1941-06-12（"Taken in hand by commercial shipyard"），
      8 月返斯卡帕湾。

      **20 mm 与 2-pdr 的记载冲突（涉及四艘舰）：**
      navypedia 的 1941 年初表把本舰与 Sikh 单列为「+ 2 门单装 2-pdr」，
      其余同级舰为「+ 2 门单装 20 mm Oerlikon」；
      而 uboat.net 记 1941-07 是 Cossack / Maori / Sikh / Zulu 四艘
      舰桥两舷各加 1 门 2-pdr。
      naval-history 的本舰页只记了 1941-06 改装里加 20 mm Oerlikon。
      三源在「到底加的是 2-pdr 还是 20 mm」上不一致，两说并列，不裁决。

