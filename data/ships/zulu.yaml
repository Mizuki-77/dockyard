# ============================================================================
# 单舰：HMS Zulu（祖鲁人号，L18 → F18 → G18）
# ----------------------------------------------------------------------------
# 部族级第二艘。本舰的结局是四艘里唯一「被拖带中因空袭沉没」的一条：
# 1942-09-14 托布鲁克突袭（Operation Agreement）之后返航途中，
# 16:00 被一枚炸弹从舷侧穿入机舱爆炸，失去动力，由 HMS Hursley 拖带，
# 19:00 在 32°00'N 28°56'E 翻沉。
#
# 它与 Sikh 是一对：同一场行动、同一天沉没，但死因不同 ——
# Sikh 死于岸防炮，Zulu 死于空袭。
#
# 本舰另有一条容易被忽略的荣誉：因为是本级建造最快的（naval-history 原话
# "Because of speedy construction achieved, she was nominated as Lead Ship for
# this Class"），被定为该级的 lead ship。
# ============================================================================

id: zulu
name:
  zh: 祖鲁人号
  en: HMS Zulu
class: tribal
open_ended_note: >
  部族级第二艘，被定为该级 lead ship（因建造速度最快）。
  1942-09-14 托布鲁克突袭返航途中被空袭击沉。

