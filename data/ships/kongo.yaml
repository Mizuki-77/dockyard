  - field: armament.mount.summary
    value: >-
      沈没前（1944-07-10 状态）：35.6 cm 连装 4 座 8 门（**英造 43 年式/毘式**）／
      15.2 cm 单装 8 门／12.7 cm 连装高角 6 座 12 门／25 mm 18 座三联（54）＋
      8 座双联（16）＋30 座单装（30）＝100 挺／电探 21 号 1、22 号 2、13 号 1／
      鱼雷发射管全撤。
    src: [japanese-warship-kongo, combinedfleet-kongo, navypedia-kongo,
          navweaps-36cm-45-t41]
    valid: { from: 1944-07-10, to: 1944-11-21 }
    confidence: B
    note: >-
      **本条含两件事，都不可省**：
      （一）**主炮型号是本舰最独特的一点**：35.6 cm 连装 4 座 8 门装的是
      **英造 43 年式（毘式 / 14-in Vickers Mark "A"）**，另三舰装的是
      日产 41 年式（四一式，Model 1908）。**两者型号不可互换。**
      原文（navypedia as completed 装备栏，逐舰分列）：「**Kongo**: 4 x 2 -
      356/45 **43-shiki**, 16 x 1 - 152/50 41-shiki, 16 x 1 - 76/40 41-shiki,
      8 - 533 TT (beam) / **others**: 4 x 2 - 356/45 **41-shiki**, …」
      ——该分法在三个状态栏全部保留（第一次、第二次改装后仍写 Kongo 43-shiki）。
      原文（navweaps 命名沿革）：「Later, the guns built by **Vickers** were known
      as the 14-in Vickers Mark "A" and to the Japanese as the 14-in **43rd Year
      Type (Model 1910)**. Guns **manufactured in Japan** were known as 14-in
      **41st Year Type (Model 1908)**.」
      **一个必须提防的陷阱**：日文来源四页都把主炮写成「45口径**毘式**35.6cm
      連装砲」（毘式＝Vickers 式），比叡/榛名/雾岛页也这么写——**日文这一层
      不能用来区分四舰**，区分只能靠 navypedia 的 43-shiki/41-shiki 与 navweaps
      的命名沿革。
      又（navweaps）：「In addition to those guns on Kongô, Vickers supplied a
      number of complete guns and individual forgings to the Japanese for a few
      years, but most guns were built by Kure Arsenal and by Japan Steel Works,
      LTD (Muroran Plant).」→ 金刚这一批是维克斯原厂造，后续备件与另三舰的炮
      由吴工厂/日本制钢所造。「性能相近但不等于同型」——navweaps 说的
      「they and the Vickers guns had similar performance and can be considered
      together」是**弹道数据层面可合并考虑**，型号名与备件互换性不因此成立。
      （二）**1944-07-10 的完整兵装状态**（日文来源「TECHNICAL DATA / 05
      昭和19年/1944年7月10日時点の兵装」整栏）。
      **与榛名 1944-10-05 表逐项不同**：榛名 25 mm 为 28 座三联＋2 座双联＋
      20 座单装＝108 挺、15.2 cm 为 8 门（同）、12.7 cm 为 6 座（同）、
      电探 21 号 1／22 号 2／13 号 **2**（金刚 1）。四舰不可互推。

