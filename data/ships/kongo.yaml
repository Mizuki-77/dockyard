# ============================================================================
# 金刚（こんごう / Kongō）—— 金刚型一番舰，英国维克斯建造
#
# 2026-11-25 建（kongo-ships 组）。舰级共用数据见 classes/kongo.yaml，
# 本文件只写与舰级不同的、本舰特有的、以及随时间变化的部分。
#
# **本舰五个必须记住的识别点：**
#   1. **唯一在英国建造的一艘**：Vickers, Barrow-in-Furness, Yard No. 414。
#      原文：「Yard No. 414, a 32,200 ton battlecruiser designed by Sir George
#      Thurston of Vickers-Armstrong, is laid down at Vicker's shipyard for the IJN.」
#   2. **主炮是英造 43 年式（毘式），不是日产 41 年式**——四舰里只有金刚如此。
#      navypedia 逐舰列装：「Kongo: 4 x 2 - 356/45 **43-shiki** … others: 41-shiki」；
#      navweaps 命名沿革亦分「Vickers built guns → 43rd Year Type /
#      Guns manufactured in Japan → 41st Year Type」。**型号不可互换。**
#   3. 第二次改装后**锅炉 8 座**（与雾岛同组），涡轮换艦本式齿轮传动 4 台。
#      第一次改装后是 **10 座**（混烧 6＋重油专烧 4）——注意榛名同阶段是 16 座。
#   4. 1942-08-01 在吴工厂装**二一号电探**，是四舰里**最早**有雷达记录的一艘
#      （早于榛名的 1943-03）。1944-06-30 再加二二号与一三号。
#   5. **太平洋战争中唯一被潜艇击沉的日本战列舰**，也是史上最后一艘被潜艇
#      击沉的战列舰（combinedfleet 原文）。但「太平洋战争中唯一被潜艇击沉的
#      **战列舰**」这个更强的说法要限定战区才成立——见 RESEARCH-NOTES §8。
#
# 结局：1944-11-21 台湾海峡被 USS SEALION II (SS-315) 雷击，0301 中雷三发
# （日方记命中 2 发），0524 弹药库爆炸，0530 沉没于 26-09N, 121-23E。
# 约 1,200 人阵亡（日方记 1,300），驱逐舰浜风/矶风救起 237 人。
# ============================================================================

id: kongo
name:
  zh: 金刚
  en: Kongo
  ja: 金剛（こんごう）
class: kongo
note: >-
  金刚型一番舰。英国维克斯（Barrow-in-Furness，船台 414）建造，1913-08-16 竣工，
  是日本海军第一艘超弩级巡洋战列舰。1944-11-21 在台湾海峡被 USS SEALION II 击沉。

open_ended_note: |
  本文件里 valid.to 留空的 fact 都是「无已知终止事件」的项：
  该舰 1944-11-21 沉没后舰体仍在海底，1945-01-20 除籍。
  故所有 open 时间窗的实际终点都是 1944-11-21；个别参数（如 1944-08 的 25 mm
  增装）终点更早，已在各条 note 内注明。

