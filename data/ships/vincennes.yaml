# ============================================================================
# 单舰：USS Vincennes（CA-44，文森斯号重巡洋舰）
# ----------------------------------------------------------------------------
# 只写本舰与舰级（new-orleans）不同的值与本舰特有的事实。
#
# 【本舰与本级另两艘的硬差别 —— 这是最容易写错的一处】
#   1) 主炮不是 Mk 9！本舰属 CA-39/44 这一批，装 8"/55 **Mk 12**
#      （更轻的新炮 + 更紧凑的炮塔）。navweaps Mk 12 页脚注原文：
#      「The Tuscaloosa sub-class consisted of Tuscaloosa (CA-37), San Francisco
#      (CA-38), Quincy (CA-39) and Vincennes (CA-44)」。
#      navypedia 的逐子级清单亦作「CA37 - 39, 44: 3 x 3 - 203/55 Mk 12.15」。
#   2) 炮座装甲被减薄：navypedia 记本舰炮座 **133 mm**，而 CA-32/34/36 是 127 mm、
#      CA-37/38 是 152 mm。原因是 CA-37/38 装甲加过头逼近吨位上限，
#      CA-39/44 只好减回去（historyofwar 原文：「In order to counter this Quincy
#      and Vincennes had some armour removed, especially in the barbettes」）。
#   3) 副炮座是 5"/25 **Mark 23**（动力驱动，配 Mk 33 指挥仪），
#      不是 New Orleans/Minneapolis 的 Mark 19（手动）。
#
# 【本舰的结局】
#   1942-08-09 萨沃岛海战（第一次萨沃岛）夜战中被击沉，是「北区三舰」
#   （Vincennes / Quincy / Astoria）之一。**中途岛时它还在**——
#   1942-06 属 TG 16.2，掩护企业号，6-04 下午被派去支援约克城。
#   WDR-29 一手计数：「VINCENNES received 57 known hits as well as one torpedo
#   hit (possibly two) on the port side in way of the forward magazine group」。
#
# 【未获取】
#   轮机厂与型号（DANFS/navsource 均未给）、试航实测功率与航速、
#   阵亡人数的官方数字（historyofwar 给 332，另需交叉）、造价、
#   失事前的雷达型号与装舰日期、残骸确切位置坐标。
# ============================================================================

id: vincennes
name:
  zh: 文森斯号
  en: USS Vincennes
class: new-orleans

open_ended_note: >
  CA-44。1934-01-02 开工、1936-05-21 下水、1937-02-24 服役。
  1942-04 参加杜立特空袭（TF 18 掩护大黄蜂号）、1942-06 中途岛（TG 16.2，
  掩护企业号，6-04 调去支援约克城）、1942-08 瓜岛登陆，08-09 萨沃岛海战
  被击沉。两枚战斗之星（中途岛、瓜达尔卡纳尔登陆）。

