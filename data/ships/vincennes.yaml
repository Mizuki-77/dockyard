      1942」；DANFS 正文记 1941-12 遇风暴时「ripping a Curtiss SOC Seagull
      floatplane from its "moorings" on the storm-lashed well-deck amidships」。
      两条都是 SOC，故型号确证；**换装年月未获取**。

  - field: sensors.radar.installed
    value: SC 与 Mk 3 雷达（1942-04 前加装）
    src: [navypedia-neworleans, historyofwar-ca44]
    valid: { from: 1942-04, to: 1942-08-09 }
    confidence: C
    note: >
      navypedia 把本舰列在「Tuscaloosa, San Francisco, Quincy, Vincennes
      12.1941 - 4.1942」这一批改装里，同批内容含「+ … SC, Mk 3 radars」（该句
