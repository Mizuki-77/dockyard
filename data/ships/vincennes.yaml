  # ============================================================ 本舰特异：防护（炮座减薄）
  - field: protection.armor.thickness
    value: 133
    unit: mm
    qual: { part: barbette, region: main }
    src: [navypedia-neworleans]
    valid: { from: 1937-02-24, to: 1942-08-09 }
    confidence: B
    note: >
      **本条覆盖舰级值。** navypedia 逐子级清单：
      「CA32, 34, 36: … barbettes: 127」「CA37, 38: … barbettes: 152」
      「CA39, 44: … barbettes: 133」——本舰是 133 mm。
      historyofwar 给了这串往复的成因：「The previous pair of ships,
      Tuscaloosa (CA-37) and San Francisco (CA-38) had been given a lighter 8in
      gun and a smaller turret, saving around 40 tons. This weight was used to
      increase the amount of barbette armour, but this turned out to bring them
      very close to the treaty limits. In order to counter this Quincy and
      Vincennes had some armour removed, especially in the barbettes」。
      即本舰炮座比前一批薄 19 mm、比 CA-32/34/36 厚 6 mm。

  - field: protection.armor.thickness
    value: 152
    unit: mm
    qual: { part: turret, region: face }
    src: [historyofwar-ca44]
    valid: { from: 1937-02-24, to: 1942-08-09 }
    confidence: C
    note: >
      **本条与舰级值（203 mm）冲突，两说并列不裁。** historyofwar 在文森斯
      专页的装甲栏给「turrets: 6in face」（= 152 mm），而同级页与 navypedia
      都给 203 mm。可能的解释是这页把「炮座」与「炮塔面板」的值串了行
      （同一页的 barbettes 写 6in-5in），但**来源未解释，不作推断**。
      单列此条正是为了让这个冲突被看见，而不是被舰级值盖掉。

  - field: protection.armor.thickness
    value: 57
    unit: mm
    qual: { part: deck, region: main }
    src: [navypedia-neworleans, wdr-29]
    valid: { from: 1942-08-09, to: 1942-08-09 }
    confidence: C
    note: >
      **本条给战损分析留对照点。** navypedia 记主装甲甲板 57 mm；
      WDR-29 的一手观察与之相符：「a projectile … penetrated the second deck
      amidships (90 lb. special treatment …)」——即 8 英寸弹轻易穿透
      2 层甲板。另记同级 Astoria 的一处关键实况：8 英寸 AP 在约 5,000 码
      距离上「made a clean hole 11 inches in diameter through the 8" class "B"
      face plate」——**203 mm 面板挡不住同口径 AP**，这是该级防护的真实上限。

  # ============================================================ 本舰特异：沉没
  - field: service.fate_category
    value: 1942-08-09 萨沃岛海战被日舰炮火与鱼雷击沉，中弹 57 发、鱼雷 1–2 条，0210 日舰停火、0230 弃舰、约 0250 翻转沉没
    src: [wdr-29, danfs-ca44, oni-combat-narrative-savo]
    valid: { from: 1942-08-09 }
    confidence: A
    note: >
      **三份来源的对照，全部并列**：
      ① WDR-29 一手计数：「VINCENNES received 57 known hits as well as one
      torpedo hit (possibly two) on the port side in way of the forward magazine
      group」，结论「Damage to QUINCY and VINCENNES was so extensive that loss of
      the vessels was inevitable. It is not possible for any lightly protected
      vessel to absorb such punishment and survive」。
      ② DANFS 逐分钟：0135 首见照明弹、0155 被探照灯照中、
      「One or two "long lance" torpedoes then ripped into the ship's number 1
      fireroom」、「Losing steering control five minutes later」、
      「At 0210, the Japanese ceased fire」、「Riefkohl circulated the command to
      abandon ship at 0230」、「rolled over and then sank at about 0250」。
      ③ ONI 官方叙述给第一条反击的细节：「The Vincennes replied with an 8-inch
      salvo, using a radar range of 8,250 yards」，以及命中序列
      「Before the Vincennes could fire again an enemy salvo landed on the well
      deck and hangar, where intense fires broke out. The bridge, too, was hit」。
      **三源的沉没时刻一致（约 0250）**，中弹数与鱼雷数各有细差（57 发 /
      1–2 条），已在上面并列。

  - field: aviation.aircraft.types
    value: SOC Seagull（1942 年在役，VCS-7）
    src: [navsource-ca44, danfs-ca44]
    valid: { from: 1942-04, to: 1942-08-09 }
    confidence: C
    note: >
      navsource 图注：「A 1/32nd scale model of an SOC-3 Seagull … It represents an
