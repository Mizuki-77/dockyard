# ============================================================================
# 单舰：HMS King George V（英王乔治五世号战列舰，舷号 41）
# ----------------------------------------------------------------------------
# 与 tirpitz.yaml 同一套约定：
#   1) 建造/服役/损失等单舰事件
#   2) 单舰实测值（试航）——与舰级设计值不是分歧，是两件事
#   3) 状态切片：随时间变化的字段，用 valid 窗口表达"当时是什么样"
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 本文件命中即覆盖舰级，**不算分歧**。
#
# 本文件只写 King George V 本体：舰名与舷号、建造节点、舰长与隶属、
# 逐年高炮/雷达配置、弹射器拆除、结局。舰级共有的主尺度、排水量、
# 装甲、主副炮与武器本体参数在 data/classes/king-george-v.yaml。
#
# 【两个必须并列、不许裁决的争议】
# 1) 14 英寸四联炮塔的可靠性：设计时就知道机械复杂（3,000+ 活动件、
#    防闪爆措施繁复），战时暴露为卡弹与齐射不全。这不是"英舰造得差"
#    一句话能收的，单舰 fact 只记参数，评价留给叙事层。
# 2) 姊妹舰 Prince of Wales 的沉没原因：1941-12-10 被日军航空鱼雷击沉，
#    2007/2009 年残骸调查认为四雷中三雷落在 SPS 防雷区之外、第四雷处
#    保持舱壁完好，主因是"B"螺旋桨轴支架断裂撕裂舱壁。本条属 PoW，
#    本文件不据此改写 KGV 的防雷数据，只在舰级 note 里并列。
# ============================================================================

id: king-george-v
name:
  zh: 英王乔治五世号
  en: HMS King George V
class: king-george-v

open_ended_note: |
  本文件中 valid.to 留空的 fact，均为"至今为止仍成立的单舰事实"
  （如结局、拆解），不存在后续变化事件。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: King George V
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1936-07-29 }
    confidence: A
    note: >
      正式舰名 HMS King George V，舷号 41。建造代号未见记载；
      navypedia 记 Yard No 10。这是英国海军第二次用该舰名
      （前一艘是 1911 年级战列舰，1926 年出售）。

  - field: identity.name_zh
    value: 英王乔治五世号
    src: [rmg-kgv-guide]
    valid: { from: 1936-07-29 }
    confidence: B
    note: 大陆通行译名。另有"乔治五世国王"等写法，本站取前者。

  - field: identity.name_en
    value: HMS King George V
    src: [rmg-kgv-guide]
    valid: { from: 1936-07-29 }
    confidence: A

  - field: identity.name_note
    value: >-
      原拟名 HMS King George VI（新朝第一艘主力舰按例用在位君主名），
      国王本人要求改为纪念其父乔治五世；国王的名号让给二号舰 Duke of York
    src: [rmg-kgv-guide]
    valid: { from: 1936-07-29 }
    confidence: A
    note: >
      RMG 原话「Originally, she was to have been named HMS King George VI …
      The King requested that the ship be named in honour of his late father,
      King George V … A later member of this class of battleship was named
      HMS Duke of York in honour of the King instead」。掷瓶人也是乔治六世本人，
      与命名让渡互为因果。

  - field: identity.namesake
    value: 英王乔治五世（George V，1865–1936）
