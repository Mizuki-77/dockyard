# ============================================================================
# 单舰：Illustrious（光辉号航空母舰，舷号 87）
# ----------------------------------------------------------------------------
# 与 bismarck.yaml / tirpitz.yaml 同一套约定：
#   1) 建造/服役/结局等单舰事件
#   2) 单舰实测值与状态变化——与舰级设计值不是分歧，是两件事
#   3) 状态切片：随时间变化的字段，用 valid 窗口表达"当时是什么样"
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 本文件命中即覆盖舰级，**不算分歧**。
#
# 本文件的意义：Illustrious 是光辉级的首舰（lead ship），设计参数都在
# data/classes/illustrious.yaml，这里只写真正属于这一艘船的东西——
# 建造日期、战损、逐次改装的雷达与防空配置、涂装、以及一条同级独有的记录
# （没有舰桥前方的应急拦阻索）。
#
# 三条真实性说明：
#   ① 舰名典故与 "Lusty" 绰号在 1940 年代的当舰用法：**未获取**。
#      已抓的 1940–41 一手转录页面里没有把本舰称为 Lusty 的原句；
#      唯一出现处是 armouredcarriers.com 的页面标题（2020 年代行文），
#      而该绰号有官方原文支持的是 1982 年的 HMS Illustrious (R06)，不是本舰。
#   ② UP 火箭（Unrotated Projectile）的装舰证据：**未获取**。
#      NavWeaps 装舰清单与 ADM 1/23040 首批 40 座分配令**双双没有本舰，
#      也没有任何航空母舰**。本文件据此写"无装舰证据"，不写座数。
#   ③ HACS 的具体 Mark：**未获取**。只能给 Mk IV 指挥仪 ×4。
# ============================================================================

id: illustrious
name:
  zh: 光辉
  en: Illustrious
class: illustrious

open_ended_note: |
  本文件中 valid.to 留空的 fact，均为"至今为止仍成立的单舰事实"
  （如结局、除籍），不存在后续变化事件。
  涂装一条例外：它只在 1941-01-10 这一个时点有据，之后色号未获取，
  所以 to 也留空并在 note 里写明"下一个可证时点未知"。

