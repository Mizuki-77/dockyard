# 胡德号（HMS Hood，舷号 51）— 单舰数据
#
# 本文件只写「胡德号这一艘船」的事实：它的实际建成状态、它经历的改装、
# 它被击沉的过程。四艘同级的共同设计值写在 data/classes/admiral.yaml。
#
# 解析顺序：单舰 fact → 舰级 fact → 未记载。单舰命中即覆盖舰级。
#
# 【这一条船为什么值得单列】
# 它是 1941 年 5 月 24 日之前全世界最大的军舰，是两战之间英国海军的门面，
# 也是「战列巡洋舰」这个舰种最后的海战牺牲品。
# 它下水时的名字是一次政治决定：日德兰之后英国公众需要一个「我们的新舰能打」的象征，
# 于是主装带从 9 英寸加到 12 英寸、排水量涨了六千吨，但水平装甲与炮塔顶
# 仍停在战巡水平——因为 32 节的指标不肯放。
# 二十二年后，那个没改到位的水平防护成了它的死因。
#
# 【置信度说明】
# 技术数据多取自 H.M.S. Hood Association（C 档，但它是这一艘船最专的来源，
# 且大部分内容转引自 Bruce Taylor 的专著）。
# 沉没过程与调查结论取自 ADM 116/4351 原件转录（A 档）。
# 凡图上只给定义没给数值的字段（方形系数、水线面积、水密段数、标准/满载排水量），
# 一律不写 fact —— 不推算填充是本项目的硬规则。

id: hood
name:
  zh: 胡德
  en: HMS Hood
class: admiral
open_ended_note: >
  本舰参数的有效期到 1941-05-24 沉没为止。
  1929-1931 年大改装前后、以及 1939-1941 年各次小改装前后，
  很多数字都变过——这些变化落在状态切片里，不在本节重复。

