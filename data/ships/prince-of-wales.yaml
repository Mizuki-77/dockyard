# ============================================================================
# 单舰：HMS Prince of Wales（威尔士亲王号战列舰，舷号 53）
# ----------------------------------------------------------------------------
# 挂靠舰级类：king-george-v（176 条 fact 已存在，主尺度/排水量/装甲/主炮
# 性能参数一律不重复，只写本舰差异）。
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 调研底稿：work/raw/prince-of-wales-tech.md（872 行，2026-11-21）
#
# 【这一舰的三个关键事实，都容易被搞错】
#
# 1) 「1941-03-31 服役」是错的。
#    1941-01-19 才是服役（commissioned, incomplete, and with only half
#    her crew, for trials）；1941-03-31 是**完工**（classified as completed），
#    而且这个「完工」是靠豁免多项关键试验换来的，服役时武器系统尚未完全可用。
#    navypedia 那一格表头是 Comp（完工），不是服役。
#
# 2) 1941-05-24 没继续追击，理由不是燃油。
#    05-24 当天的理由是战备状态（一门炮不能用、舰桥被打坏），
#    燃油要到 05-25 才成为理由，而且那天真正缺油的是英王乔治五世号
#    （剩 1,200 t / 32%），本舰的油量来源根本没记。
#
# 3) 沉没原因不是「鱼雷 vs 抽水泵」二选一。
#    这是三条独立的破坏链：鱼雷破口 → 螺旋桨轴把舱壁铰穿
#    （Garzke 2012 残骸法证的发现）→ 电力丧失导致泵失效。
#    泵失效是第三条链的下游症状，不是并列选项。
# ============================================================================

id: prince-of-wales
name:
  zh: 威尔士亲王号
  en: HMS Prince of Wales
class: king-george-v
open_ended_note: >
  英王乔治五世级五号舰。服役不足两个月就参加丹麦海峡海战并击伤俾斯麦；
  1941-12-10 在马来亚海域被日军航空鱼雷击沉，与反击号同时。
  它是本站目前唯一一艘串起大西洋与远东两个战场的舰。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: HMS Prince of Wales
    src: [naval-history-pow]
    valid: { from: 1939-05-03 }
    confidence: C

  - field: identity.name_zh
    value: 威尔士亲王号
    src: [naval-history-pow]
    valid: { from: 1939-05-03 }
    confidence: C

  - field: identity.pennant_number
    value: '53'
    src: [naval-history-pow, navypedia-kgv]
    valid: { from: 1941-01-19, to: 1941-12-10 }
    confidence: C

  - field: identity.ship_type
    value: battleship
    src: [naval-history-pow]
    valid: { from: 1941-01-19, to: 1941-12-10 }
    confidence: A

  - field: identity.nation
    value: united_kingdom
    src: [naval-history-pow]
    valid: { from: 1941-01-19, to: 1941-12-10 }
