    value: ww2
    src: [naval-history-pow]
    valid: { from: 1939-09-03, to: 1941-12-10 }
    confidence: A

  # ============================================================ 建造
  - field: construction.builder
    value: Cammell Laird
    src: [naval-history-pow, navypedia-kgv]
    valid: { from: 1937-01-01 }
    confidence: C

  - field: construction.builder_location
    value: Birkenhead
    src: [navypedia-kgv]
    valid: { from: 1937-01-01 }
    confidence: C

  - field: construction.laid_down
    value: 1937-01-01
    unit: date
    src: [navypedia-kgv]
    valid: { from: 1937-01-01 }
    confidence: C

  - field: construction.launched
    value: 1939-05-03
    unit: date
    src: [naval-history-pow, navypedia-kgv]
    valid: { from: 1939-05-03 }
    confidence: A

  - field: construction.commissioned
    value: 1941-01-19
    unit: date
    src: [naval-history-pow]
    valid: { from: 1941-01-19 }
    confidence: A
    note: >
      **不是 1941-03-31。** 那天是**完工**（classified as completed），
      且是靠豁免多项关键试验换来的，服役时武器系统尚未完全可用。

      本舰 1941-01-19 服役时状态很差：未完工、只有半数舰员、仅作试航性质。
      首任舰长 Louis Henry Keppel Hamilton。

      对照首舰：两舰「服役 → 完工」的间隔**恰好都是 71 天**，
      说明这是本级制度化的两段式流程，不是本舰特有的混乱。

  - field: construction.building_time_days
    value: 1479
    unit: count
    src: [navypedia-kgv]
    valid: { from: 1937-01-01, to: 1941-03-31 }
    confidence: C
    note: 从开工 1937-01-01 到完工 1941-03-31，共 1,479 天（本站按日期差计算）。

  - field: construction.fate_date
    value: 1941-12-10
    unit: date
    src: [naval-history-pow, london-gazette-force-z]
    valid: { from: 1941-12-10 }
    confidence: A
    note: 在马来亚海域关丹附近被日军航空鱼雷击沉，与反击号同一场战斗。

  - field: construction.fate_type
    value: sunk_by_enemy
    src: [naval-history-pow]
    valid: { from: 1941-12-10 }
    confidence: A

  # ============================================================ 服役
  - field: service.commander
    value: Captain Louis Henry Keppel Hamilton（首任，1941-01-19 至 1941-02-15）
    src: [naval-history-pow, uboatnet-cmdr-hamilton]
    valid: { from: 1941-01-19, to: 1941-02-15 }
    confidence: C
    note: >-
      **他不是丹麦海峡海战（1941-05-24）当天的舰长。**
      2026-11-23 核实，三源一致：unithistories 记 1940-10-05 至 1941-02-15；
      uboat.net 舰长表记 1941-02-15 交接；naval-history-pow 明写
      「February 15th … new CO Captain John Catterall Leach MVO RN took command」。
      05-24 在舰桥上的是 **Leach** —— 俾斯麦首轮齐射的炮弹穿过罗经平台，
      除 Leach 与值更军士长外全数阵亡。
      本条原写作「首任，1941-01-19 任职」且 to 留空，读起来像他指挥到
      1941-12 沉没；实际只带了 27 天。已补 to 与说明。

  # ============================================================ 丹麦海峡（1941-05-24）
  - field: armament.mount.summary
    value: >-
      1941-05-24 丹麦海峡时：本舰是英方唯一能持续射击的主力舰，
      前后共发射 18 次齐射、应发 74 发、实发 55 发（损失率 25.65%）。
      同日击伤俾斯麦的命中中有本舰的贡献，其中一发击穿舰首燃油舱。
    src: [hoodadm234-guns]
    valid: { from: 1941-05-24, to: 1941-05-24 }
    confidence: A
    note: >
      齐射与发数出自 ADM 234/509 的 Enclosure I 汇总。

      **注意「7 门可用」这个说法在本项目里欠缺出处。**
      项目原有的 denmark-strait 数据里写过「A 塔 3、B 塔 2、Y 塔 2，仅 7 门可用」，
      但通读 ADM 234/509 全文定位不到这句。方向（不是满 10 门）大概率对，
      但具体数字目前只有二手支撑，故本 fact 不写「7 门」。

  # ============================================================ 沉没（1941-12-10）
  - field: service.fate_category
    value: >-
      1941-12-10 被日军航空鱼雷击沉。沉没是三条独立破坏链叠加：
      鱼雷破口进水 → 螺旋桨轴旋转把舱壁铰穿 → 电力丧失导致排水泵失效。
    src: [garzke-pow-wreck-2012, london-gazette-force-z]
    valid: { from: 1941-12-10, to: 1941-12-10 }
    confidence: C
    note: >
      **这不是「鱼雷直接命中 vs 抽水泵失效」的二选一。**
      泵失效是第三条链的下游症状，不是并列选项。
      「螺旋桨轴把舱壁铰穿」这一发现来自 Garzke 2012 年的残骸法证报告，
      是本舰沉没机制研究的关键进展。

      由于注册表里没有专门的「沉没机制」字段，本条用 service.fate_category
      记录这段说明。数值型的死因分类已在 construction.fate_type 里写为
      sunk_in_action。
