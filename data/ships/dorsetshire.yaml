  - field: sensors.radar.installed
    value: Type 290（水面搜索）
    src: [combinedfleet-cornwall-dorsetshire]
    valid: { from: 1941-07, to: 1942-04-05 }
    confidence: B
    note: >
      combinedfleet 专题文原文：「In 1941 Dorsetshire was fitted with two radar sets,
      a Type 284 and a Type 290. ... The Type 290 was a surface search set for detecting
      ships. It could also detect aircraft but only out to 30,000 yards (15 miles).
      The operator had to turn the antenna by hand and the display screen was an A-scan
      rather than the Plan Position Indicator (PPI) of today. The Type 290
      "never functioned as planned", according to one source.」
      **这一点直接关系到本舰的沉没**：它名义上能探飞机，实际只到 15 英里、
      天线要人手转、显示屏是 A 型示波而非平面显示 —— 1942-04-05 当天
