# ============================================================================
# 单舰：HMS Dorsetshire（多塞特郡号重巡洋舰，舷号 40）
# ----------------------------------------------------------------------------
# 只写本舰与郡级（Norfolk 子级）不同的值与本舰特有的事实。
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 【本舰与姊妹舰 Norfolk 的分野 —— 这份文件最该说清的事】
#   两舰同级同型、同在 1941-05-27 合击俾斯麦，但结局完全相反：
#     Norfolk     —— 打满六年，五轮改装，1950 年拆解；
#     Dorsetshire —— 1942-04-05 在印度洋被日本舰爆击沉，连 1944 年那轮
#                    大改装都没等到。
#   所以「X 炮塔 1944 年被拆」这件事只属于 Norfolk。
#   本级「拆 X 塔减重」的通行叙述不能套到本舰头上。
#
# 【已确认的一条关键事实：击沉 Atlantis 的不是本舰】
#   本舰 1941-11 奉命搜捕德国袭击舰 Atlantis；实际击沉 Atlantis（1941-11-22）
#   的是重巡 HMS Devonshire。本舰在 1941-12-01 截住并迫使德方自沉的，
#   是 Atlantis 的姊妹补给船 Python。两条船不要混。
#   详见 RESEARCH-NOTES.md 的「有争议的记载」一节。
#
# 【本舰最有据的一块：沉没过程有一手战报口径】
#   1942-04-05 的沉没细节（8 分钟、10 发命中、弹药库爆炸）有
#   uboat.net（引 H.M. Ships Damaged or Sunk by Enemy Action 官方汇编）
#   与 combinedfleet 专题文（Robert Stuart 2019，逐分钟时间线）两条独立来源，
#   故相关 fact 给 A/B，不给 C。
# ============================================================================

id: dorsetshire
name:
  zh: 多塞特郡号
  en: HMS Dorsetshire
class: county

open_ended_note: >
  Norfolk 子级二号舰（舷号 40）。1940-09-30 完工服役，一生不足十二年：
  中国站 → 南大西洋追歼 Graf Spee → 1940 年监视法国舰队 →
  1941-05-27 合击俾斯麦并执行最后雷击 → 1941-12 截沉 Python →
  1942-04-05 在锡兰西南被日本舰爆击沉，舰长 Augustus Agar VC。
  阵亡 234 人。

