  # ============================================================ 1941-12-01 截沉 Python
  - field: armament.mount.summary
    value: >-
      1941-12-01 在圣赫勒拿以西截住德国潜艇补给船 Python（3,664 GRT），
      该船正为 U-68 与 U-A 补给；德方自沉，U-A 向本舰发射 5 枚鱼雷均未命中。
    src: [uboat-dorsetshire, naval-history-dorsetshire]
    valid: { from: 1941-12-01, to: 1941-12-01 }
    confidence: A
    note: >
      **必须与「击沉 Atlantis」分开写，这是两个不同的事件、两条不同的船。**
      Atlantis 是 1941-11-22 被重巡 HMS **Devonshire** 击沉的；
      本舰当时正参与搜捕 Atlantis（naval-history 记 1941-11-11
      「Deployed for search for German commerce raiders ATLANTIS and
      U-Boat Supply ship PYTHON」）。
      本舰实际的战果是 Python，且严格说是「迫使自沉」而非「击沉」。
      nav-history 原文：「1st Sighted German U-Boat supply ship PYTHON with
      submarines UA and U68 alongside. Submarines departed and made torpedo attack
      which failed. PYTHON scuttled.」
      德文维基另记 Python 全体船员由 U-68 救起。

      **本舰没有接收 Python 的生还者**，原因是当时仍有两艘 U 艇在场：
      uboat.net 原文「HMS Dorsetshire was unable to close to pick up survivors
      as the German supply ship was in the process of transferring supplies
      and fuel to two submarines, U-68 and U-A」。

  # ============================================================ 1942-04-05 沉没
  - field: armament.gun_failures
    value: >-
      1942-04-05：第一波三机同时攻击，三弹全中——一弹穿透后甲板使舵机失效，
      一弹穿透弹射器位置使两处无线电室失效，一弹命中左舷舯部打哑除 pom-pom 外
      全部左舷高炮。随后「三机一组」的编队连续进入，命中前烟囱基部
      （打哑前部右舷高炮组 S1-H/A 与 A 锅炉舱）、后甲板（X 炮塔失效）、
      后烟囱基部（烟囱倒塌并引爆高射弹药库，同时打哑两座 pom-pom）。
      首次攻击 4 分钟后（Agar 首份报告记 5 分钟）舰体明显左倾，
      舰桥与全舰各处的通信全部中断。命中累计至少 10 发，另有多枚近失弹。
