  # ============================================================ 1941-05-27 最终战
  - field: armament.mount.summary
    value: >-
      1941-05-27 最终战：09:04 加入射击，全天发射 8 英寸弹 254 发；
      10:22 自 3,000 m 向右舷发射 2 枚 21 英寸 Mark VII 鱼雷，
      10:36 转向后自 2,200 m 向左舷再射 1 枚。
    src: [kbismarck-last-battle, kbismarck-histoperi, navypedia-norfolk, combinedfleet-cornwall-dorsetshire]
    valid: { from: 1941-05-27, to: 1941-05-27 }
    confidence: A
    note: >
      **本舰在这一天的角色是「执行最后雷击」，这是它最值得记的一件事。**
      254 发这个数有两个来源：kbismarck 全战统计表「254 of 20.3 cm from
      Dorsetshire」与 combinedfleet 专题文（同引该统计表）。
      对照同战 Norfolk 527 发、Rodney 380 发 16 英寸、KGV 339 发 14 英寸。

      **鱼雷时间两说，并列不裁**：
      ① kbismarck 与本站 data/battles/last-battle.yaml 都用 10:22（右舷两枚）；
      ② combinedfleet 专题文写「firing two torpedoes into Bismarck's starboard side
         at 1025 and a third into her port side at 1036」——即 10:25。
      本条取 10:22 以与本站海战文件保持一致，10:25 一说记在此处；
      差 3 分钟，来源均未给秒级时刻，无法判定孰是。

      **三枚鱼雷分两段，不要合并成「三枚齐射」**：中间本舰有一次转向。
      kbismarck 原文：「Dorsetshire fired two 21-inch Mark VII
      torpedoes at 3,000 m into the starboard side; both hit」
      「Dorsetshire turned and fired one more torpedo at 2,200 m into the port side」。

      **鱼雷命中数有三说，并列不裁**：
      ① 本舰战报口径（经 kbismarck 整理）：2 + 1 = 3 枚全中；
      ② 英方一手审讯记「having hit with three torpedoes」（同为 3 雷）；
      ③ 发射 3 枚、2 枚命中（Campbell《Naval Weapons of World War Two》口径，
         本站经英文维基 Dorsetshire 条目的引注取得，未取得 Campbell 原书）。
      差异在第三枚是否命中，两说（3 中 / 2 中）均有一手或权威二手依据。

      一个必须保留的细节：前两雷命中后「几乎没有使她震动」
      （kbismarck 原文「with almost no visible effect」）。
      这不是鱼雷无效，而是当时俾斯麦号已经进水严重、横倾明显。

