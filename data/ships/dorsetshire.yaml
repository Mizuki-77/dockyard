      位置 01°54'N 77°45'E（锡兰西南）。naval-history 记
      「Sighted by aircraft from Japanese cruiser TONE in position 01.54N 77.45E
      south of Ceylon. Came under heavy dive bombing attacks and sank within 8 minutes」。
      攻击兵力：53 架 D3A1「Val」（combinedfleet 专题文与英文维基同数；
      navypedia 记其来自 Akagi / Hiryu / Soryu）。
      命中数：本舰 10 发（250–550 磅，即约 110–250 kg）、另有多枚近失弹；
      姊妹舰 Cornwall 被命中 8 发，晚约 10 分钟以舰艏先沉。
      全体 106 名日军空勤无伤亡（combinedfleet 原文
      「There were no casualties among the 106 Japanese airmen」）。

      **沉没时间两说，并列不裁**：
      naval-history 与 uboat.net 都写「about 8 minutes」后沉没；
      navypedia 亦写「received up to 10 bombing hits in 8 minutes」。
      但三处都没有给出精确的分秒时刻 —— 不要把 8 分钟倒推成一个具体时间点。

      一个必须说清的因果：**本舰当时正在返回科伦坡，
      且 03-27 起就在科伦坡船坞里做改装，03-31 因敌情中断改装出海，
      04-02 随 Cornwall 被派回锡兰继续改装，04-04 又被召回**
      （naval-history 与 combinedfleet 附录 2 时间线一致）。
      它的位置是「被命令挪来挪去」的结果，不是主动搜寻日军。
