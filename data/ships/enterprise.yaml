  # ============================================================
  - field: protection.scheme
    value: other
    src: [nhhc-danfs-enterprise]
    valid: { from: 1938-05-12 }
    confidence: B
    note: >-
      所谓「受保护箱体」（protected box）：顶部防护甲板 + 双层底 +
      舷侧装甲带 + 横向装甲舱壁，只包住弹药库、锅炉、机舱与通信中枢。
      原句「Protection came mainly from a protected box」。
      注册表枚举无对应值，用 other 并在本条说明。

  - field: protection.armor.thickness
    value: 102
    unit: mm
    src: [nhhc-danfs-enterprise]
    valid: { from: 1938-05-12 }
    confidence: B
    qual: { part: belt, region: main }
    note: >-
      舷侧装甲带 2.5-4 in（64-102 mm），贴于 30 磅（19 mm）STS 背板上，
      位于舰体外侧。102 mm 为最厚处。

  - field: protection.armor.thickness
    value: 38
    unit: mm
    src: [nhhc-danfs-enterprise]
    valid: { from: 1938-05-12 }
    confidence: B
    qual: { part: deck, region: main }
    note: >-
      防护甲板（第 4 甲板）60 磅 STS = 1.5 in = 38 mm，位于水线上约 3 ft。
      这是箱体的核心。
      注意：飞行甲板与机库甲板均无装甲。

  - field: protection.armor.thickness
    value: 0
    unit: mm
    src: [nhhc-danfs-enterprise]
    valid: { from: 1938-05-12 }
    confidence: B
    qual: { part: flight_deck, region: main }
    note: >-
      这是「0」，有原句：「The flight and hangar decks of the ships were unarmored.」
      这是约克城级与英国装甲航母（光辉级）的核心区别：
      约克城级选择不装甲甲板、带尽可能多的飞机。

  - field: protection.underwater.depth
    value: 0
