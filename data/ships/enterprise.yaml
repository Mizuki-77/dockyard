# ============================================================================
# 企业号（USS Enterprise, CV-6）—— 约克城级二号舰
#
# 2026-11-19 入库。数据来自 work/raw/enterprise-tech.md（508 行调研，85.6% 覆盖）。
#
# 三处必须记住的事：
#   1. 5"/38 是 8 座单装（Mark 21 Mod 16 开放式基座炮架），不是双联装。
#   2. 中途岛时 40mm 为 0 座——当时装的是 1.1"/75 四联装 4 座。
#      40mm 是 1942 年 9-10 月才换装的。
#   3. 结局：1958-07-01 出售、08-21 拖走，拆完是 1960 年 2 月。
#      fate_date 取「拆解完成」这个节点，与 danmark-strait 那批「沉没日」口径一致。
# ============================================================================

id: enterprise
name:
  zh: 企业号
  en: Enterprise
class: yorktown
note: >-
  约克城级二号舰，舷号 CV-6。二战中获战斗之星最多的美军军舰之一。
  中途岛时为第 16 特混舰队旗舰（斯普鲁恩斯）。
  绰号 The Big E / Lucky E / The Grey Ghost / The Galloping Ghost。

open_ended_note: >-
  本舰战时多次改装（1942-03、1942-07、1943-10 等），
  武备与雷达随改装变化，用不同时间窗区分；未变的舰体参数 valid.to 留空。

