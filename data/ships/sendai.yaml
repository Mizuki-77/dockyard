id: sendai
name:
  zh: 川内
  en: Sendai
class: sendai
note: 川内型命名舰。1922-02-16 三菱长崎造船所开工，1923-10-30 下水，1924-04-29 竣工。 太平洋战争全程任第三水雷战队（DesRon 3）旗舰，参与马来半岛登陆、埃达乌海战、 瓜岛多次炮击与运输、第二次瓜岛海战，1943-11-02 在布干维尔岛奥古斯塔皇后湾海战中 被美军巡洋舰击沉。她是川内型三舰中唯一有「击沉敌舰认定」战果的一艘（埃达乌海战）。
open_ended_note: 本文件 fact 的 valid 窗口按「该状态从何时起」记录；改装造成的中断由下一条 fact 接续（同一 field 多个时间窗），不合并、不覆盖。
