# ============================================================================
# 北安普敦号（USS Northampton, CL/CA-26）—— 北安普敦级首舰
#
# 2026-11-23 tg162b 入库。舰级共用参数见 classes/northampton.yaml，
# 本文件只写**本舰特有的**：建造日期、编制、战历节点、结局。
#
# 三件必须记住的事：
#   1. **1942-06 中途岛时，本舰不是 TG 16.2 旗舰。**
#      TG 16.2 司令金凯德少将（RA Thomas C. Kinkaid）的坐舰是明尼阿波利斯号（CA-36）。
#      依据是一手战报：企业号 1942 年 6 月战报原文
#      "Task Group 16.2, Rear Admiral T.O. Kinkaid in MINNEAPOLIS,
#      NORTHAMPTON, PENSACOLA, ATLANTA, NEW ORLEANS, VINCENNES"。
#      Kinkaid 的职务是 ComCruDiv 6（第 6 巡洋舰分队司令），
#      不是「第 6 巡洋舰队旗舰」这种说法。
#   2. **1942 年本舰没有鱼雷管**（1931 年已拆）。「北安普敦级有鱼雷管」
#      只对建成后的头一年多成立，见舰级文件的同名字段。
#   3. 沉没有两个日期写法：战斗始于 1942-11-30 深夜（2300 前 40 分钟），
#      舰在次日（12-01）沉没。DANFS 与本文件取 1942-12-01 为 fate_date。
# ============================================================================

id: northampton
name:
  zh: 北安普敦号
  en: USS Northampton
class: northampton
note: >-
  北安普敦级首舰，舷号 CL-26（1931-07-01 改 CA-26）。
  以马萨诸塞州北安普敦市命名。DANFS 原句：
  "A city in Massachusetts; the first vessel of this name retained its former name."
  二战获 6 颗战斗之星。

open_ended_note: >-
  本舰多数 fact 的 valid.to 取 1942-12-01（沉没日），因为舰在此时终结。
  武备与雷达的逐期状态另用不同时间窗区分；来源只能给到年份粒度的，
  在 note 里明确标出「无法闭合到月」的地方。

