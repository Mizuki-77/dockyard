  # ============================================================ 战历节点（只写与舰级文件无关的本舰事件）
  - field: service.survivors
    value: 773
    unit: persons
    src: [oni-tassafaronga]
    valid: { from: 1942-12-01 }
    confidence: A
    note: >-
      **本条是补到的硬数据，来自一手战斗叙事（ONI Combat Narrative）。**
      原句："An hour later, the Fletcher and Drayton had completed their search for
      survivors, rescuing all **57 officers and 716 men**."
      57 + 716 = **773**（加法是本站做的，来源把两个数分开写）。
      同文的分舰明细可交叉核对："the Fletcher picked up 42 officers and over 600
      men from the Northampton ... the Drayton, who took aboard 15 officers and
      113 men"——42+15 = 57 名军官，600+113 = 713 至 716 名士兵，与合计数吻合。
      **这一条推翻了 RESEARCH-NOTES 早期版本里「生还数未获取」的标注。**

  - field: service.fate_category
    value: 战斗中雷沉没
    src: [danfs-northampton, navsource-northampton]
    valid: { from: 1942-12-01 }
    confidence: B
    note: >-
      DANFS 原句："Close to the end of the engagement, Northampton was struck by
      two torpedoes, which tore a huge hole in her port side, ripping away decks
      and bulkheads. Flaming diesel oil sprayed over the ship, she took on water
      rapidly and began to list. Three hours later, as she began to sink stern
      first, she had to be abandoned. So orderly and controlled was the process
      that loss of life was surprisingly light, and the survivors were all picked
      up within an hour by destroyers."
      **DANFS 只给定性描述，不给数字**；生还数（773）由 ONI 战斗叙事补到，
      见上一条。**阵亡数仍然缺**，原因见 RESEARCH-NOTES §11.1。
      ONI 的作战细节（可作叙事素材）：
      "One torpedo hit frame 108 at the waterline, the other struck frame 98,
      10 feet below. ... The explosion blew out the ship's port side between
      frames 105 and 113, leaving eight feet of skin plate protruding over the
      side. The main and second decks were torn away from frame 105 to frame 107,
      then aft to frame 112, and outboard along frame 117."
      以及倾覆过程："At first the Northampton listed to port 10°, then ...
      the angle increased to 20° ... At 0240, when the list reached 35°, Capt.
      Kitts and the salvage party abandoned ship. On the morning of 1 December,
      just after 0300, the Northampton turned on her beam ends, then rolled over
      and sank stern first."

