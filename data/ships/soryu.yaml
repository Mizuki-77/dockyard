# ============================================================================
# 苍龙（そうりゅう / Sōryū）—— 日本海军条约时代中型正规航母
#
# 2026-11-19 入库。数据来自 work/raw/soryu-hiryu-tech.md（741 行，覆盖 88.6%）。
#
# 识别特征：
#   - 舰岛在**右舷前部**，体积极小（与驱逐舰舰桥同规模），
#     建在右舷外伸平台上、不占用飞行甲板宽度。
#   - 双舵（全平衡式）；飞龙是单舵（半平衡式）——两舰最容易被忽略的差异。
#   - 25mm 高炮 14 基双联 = 28 挺；其中 3 基在舰首
#     （日本航母首次在舰首装炮）。
#
# 苍龙与飞龙按两型处理（G9 / G10），不按一个级的两个成员。
# ============================================================================

id: soryu
name:
  zh: 苍龙号
  en: Sōryū
class: soryu
note: >-
  与飞龙是「準同型艦 / near sister」关系，实为两型（基本计划番号 G9 / G10）。
  舰岛在右舷前部、体积仅与驱逐舰舰桥相当。

open_ended_note: >-
  本舰参数有效期自 1937-12-29 服役至 1942-06-05 沉没。
  与飞龙共用的动力、机库、拦阻索等数据写在 classes/soryu.yaml。

