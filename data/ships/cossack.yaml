  # ============================================================ 阿尔特马克事件（1940-02-16）
  # ============================================================ 1940 年 4 月：纳尔维克
  - field: armament.gun_failures
    value: >-
      1940-04-13 第二次纳尔维克海战中，与 Foxhound 一同击沉德军驱逐舰
      Erich Giese，并与另两艘本土舰队驱逐舰合力攻击已受伤的 Diether von Roeder；
      回击中被命中 9 发 5 英寸炮弹，11 人阵亡、23 人受伤；
      一发炮弹在前部结构内爆炸，A 炮供弹组全员阵亡；锅炉舱中弹后失去机动，
      舰搁浅。
    src: [naval-history-cossack]
    valid: { from: 1940-04-13, to: 1940-04-13 }
    confidence: B
    note: >
      同上，用 armament.gun_failures 承载战斗细节。naval-history 原句：
      "Engaged and sank German destroyer ERIC GIESE with HMS FOXHOUND ...
      hit by nine 5in shells in return fire ... 11 killed and 23 of ship's
      company wounded. One shell exploded in forward structure killing all of
      the ammunition supply party for 'A' gun ... disabled ship which grounded"。

      **与 navypedia 的记载有出入，两说并列：** navypedia 记
      "Cossack 13.4.1940 was seriously damaged by hits of four 127mm shells
      from German destroyers and as a result of beaching in harbour of Narvik"
      —— 4 发 127 mm，而 naval-history 记 9 发 5 英寸（=127 mm）。
      数目不同（4 vs 9），口径相同，不裁决。

      另：naval-history 自己注明「有一份来源记录该德舰是被自沉的」。

  # ============================================================ 俾斯麦追击（1941-05-26/27）
  - field: armament.torpedo.tubes
