      0335/27 从 4,000 码射出最后 1 条。这解释了它为什么之后退出接触 ——
      不是被击退，是没雷了。

  # ============================================================ 改装与设备（逐次）
  - field: armament.mount.summary
    value: >-
      建成：8 × 4.7 in/45 QF Mk XII（4 座双联 CPXIX）+ 4 × 40 mm 2-pdr（1 座四联）
      + 8 × 12.7 mm 机枪（2 座四联）+ 1 座四联 21 in 鱼雷发射管 + 深弹 30 枚。
      1940 年 5-6 月改装后：X 炮座的双联 4.7 in 换为双联 4 in 高平两用炮座，
      主炮减为 6 门。
      1941 年 7 月起：舰桥两舷各加 1 门单装 2-pdr。
    src: [naval-history-cossack, navypedia-tribal, uboat-cossack]
    valid: { from: 1938-06-07, to: 1941-10-27 }
    confidence: B
    note: >
      1940 年改装原句（naval-history）："Twin 4.7in mounting in X position was
      replaced by twin 4in HA mounting and modifications were made to other ship
      services." 时间：1940-05 在 J I Thornycroft（Southampton）入坞，
      1940-06-15 完成后试航。

      1941-07 加装 2-pdr 的原句（uboat.net）："More rapid firepower was needed
      against the fast moving E-boats so HMS Cossack, HMS Maori, HMS Sikh and
      HMS Zulu had single 2 pounder guns mounted on each side of the bridge."

      navypedia 把 X 炮座换装列为 1940 年夏季的全级改装（名单含本舰），
      与本条时间吻合。

