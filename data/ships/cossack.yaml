# ============================================================================
# 单舰：HMS Cossack（哥萨克号，L03 → F03 → G03）
# ----------------------------------------------------------------------------
# 部族级第三艘。本级唯一一艘「单舰行动进了英国报纸头条」的舰：
# 1940-02-16 在挪威约辛峡湾（Jøssingfjord）强行登上德国补给船 Altmark，
# 救出 299 名英国战俘。
#
# 本舰还有两个容易被漏掉的事实：
#   1. 它是皇家海军第一艘装雷达的驱逐舰（1940 年 5-6 月 Thornycroft 改装，
#      装 286 型）。这条在 naval-history 的原话里写得很明确。
#   2. 它不是「被一发鱼雷击沉」的：1941-10-23 中雷后一度被重新登舰、
#      由拖船拖带，四天后（10-27）才在拖带中沉没。
# ============================================================================

id: cossack
name:
  zh: 哥萨克号
  en: HMS Cossack
class: tribal
open_ended_note: >
  部族级第三艘（按服役顺序）。1940-02 阿尔特马克事件使其成为二战英国
  最著名的驱逐舰单舰行动之一。1941-10-23 被 U-563 雷击，10-27 在拖带中沉没。

