  - field: construction.fate_date
    value: 1942-06-05
    unit: date
    src: [combinedfleet-akagi]
    valid: { from: 1942-06-05 }
    confidence: C
    note: >-
      当地时间（中途岛当地）6 月 5 日 05:20 沉没。
      日本时间记 6 月 6 日，是同一时刻的两种时区写法。
      Tully 在 TROM 开头专门说明用当地时区。引用时必须注明是哪个时区，
      否则会与「6 月 4 日被弹」读成隔了一天多。

  - field: construction.fate_type
    value: scuttled
    src: [combinedfleet-akagi, ussbs-aoki-akagi]
    valid: { from: 1942-06-05 }
    confidence: C
    note: >-
      己方驱逐舰雷击处分。原话「AKAGI lay over to starboard and sank tail first
      after two or three torpedo hits out of four fired into her starboard side」。
      注意：损伤来自美军俯冲轰炸，处分由日方执行——两者要分清。

