# ============================================================================
# 赤城（あかぎ / Akagi）—— 天城型战列巡洋舰改装航空母舰
#
# 2026-11-19 入库。数据来自 work/raw/akagi-tech.md（773 行调研）。
#
# 赤城不属于任何「赤城级」。 航母化后日文 Wikipedia 的级名栏写的是
# 「空母：未分類」——它是唯一舰。战巡时代属天城型（天城号因关东大地震损毁，
# 改装中止）。kasado.net 把它单列「赤城型」是编目习惯，不代表有同级舰。
# 加贺来自加贺级战列舰，与赤城不同级——不要把两者写成同级。
#
# 三个 20cm 主炮状态（不是两个）：
#   1927-03 竣工 = 单装 6 门
#   1928 末起   = 单装 6 + 连装 4 = 10 门
#   1938 改装后 = 单装 6 门（连装撤除）
# ============================================================================

id: akagi
name:
  zh: 赤城
  en: Akagi
class: akagi
note: >-
  天城型战列巡洋舰 2 号舰，因华盛顿条约改装为航母。航母化后无同级舰。
  1935-1938 年大改装：三段式飞行甲板改为单段全通甲板，加装左舷岛式舰桥。

open_ended_note: >-
  本舰多数参数的有效期从各自状态起始日到该状态结束（改装或战没），
  改装前后的两套数据用不同时间窗区分，故部分 valid.to 留空。

