    note: >-
      左舷岛式舰桥，罕见的实验性设计。 原话「An island superstructure is
      added on the ship's port side, an unusual arrangement which will be later
      shared by carrier HIRYU. However, this experiment will not be continued on
      other future carriers.」
      放左舷的原因：赤城由战巡改装，舰体细长，舰桥若放右舷会与右舷大烟囱
      一起造成重量偏右（「艦橋を左舷に移せば煙突とのバランスが取りやすい」）。
      1938 年 10-11 月做了 451 架次实船试验，结论是负面的
      （右舷来风时气流紊乱、夜间着舰困难），但改装已成事实，至死未改。
      改装前（1927-1938）无岛式舰桥，指挥所在上段甲板前端下方。

