# ============================================================================
# 单舰：Tirpitz（提尔皮茨号战列舰）
# ----------------------------------------------------------------------------
# 与 bismarck.yaml 同一套约定：
#   1) 建造/服役/损失等单舰事件
#   2) 单舰实测值（试航）——与舰级设计值不是分歧，是两件事
#   3) 状态切片：随时间变化的字段，用 valid 窗口表达"当时是什么样"
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 本文件命中即覆盖舰级，**不算分歧**。
#
# 本文件的意义：Tirpitz 与 Bismarck 同级，绝大多数字段靠继承；这里只写
# 真正不同的地方——更长更重、独有的巡航汽轮机、统一为 C/37 的 10.5 cm 炮座、
# 两座四联鱼雷管、从 12 门加到 78 门的 2 cm 高炮、以及一路升级的雷达。
# ============================================================================

id: tirpitz
name:
  zh: 提尔皮茨号
  en: Tirpitz
class: bismarck

open_ended_note: |
  本文件中 valid.to 留空的 fact，均为"至今为止仍成立的单舰事实"
  （如损失结局、编制），不存在后续变化事件。

