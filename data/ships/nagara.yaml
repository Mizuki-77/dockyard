id: nagara
name:
  zh: 长良
  en: Nagara
class: nagara
note: 长良型命名舰。1920-09-09 佐世保海军工厂开工，1921-04-25 下水，1922-04-21 竣工。 全生涯多数时间担任水雷战队旗舰（第四急袭队→第十战队→第四水雷战队→第二水雷战队→ 第十一水雷战队→第四舰队），是中太平洋—所罗门战役里出勤最频繁的日本轻巡之一。 1944-08-07 在天草诸岛以西被 USS Croaker (SS-246) 击沉。
open_ended_note: 本文件 fact 的 valid 窗口按「该状态从何时起」记录；改装造成的中断由下一条 fact 接续（同一 field 多个时间窗），不合并、不覆盖。
