# ============================================================================
# 单舰：Missouri（密苏里号战列舰，BB-63）
# ----------------------------------------------------------------------------
# 与 classes/iowa.yaml 同一套约定。本文件只写差异与单舰事件。
#
# 本舰在三件事上与其他同级舰不同，也是本文件存在的理由：
#   a) 装甲：BB-63/64 的首部横舱壁为 368 mm（下部 297 mm），
#      BB-61/62 为 287 mm（下部 216 mm）。navypedia 原文按两批分列。
#   b) 竣工防空：20 × 四联 40 mm（80 门）/ 49 × 单装 20 mm（navypedia BB62/63 行）。
#   c) 1945-09-02 在东京湾签署日本投降书——本舰最大的历史意义，
#      仪式时序见 danfs-missouri-iii。
#
# 本舰 1992 年退役后成为珍珠港博物馆舰，结局为 preserved。
# ============================================================================

id: missouri
name:
  zh: 密苏里号
  en: Missouri
class: iowa

open_ended_note: |
  本文件中 valid.to 留空的 fact，均为「至今为止仍成立的单舰事实」
  （如博物馆舰身份、除籍日期），不存在后续变化事件。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: Missouri
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1941-01-06 }
    confidence: A
    note: >-
      舰名取密苏里州。DANFS 记 "The 24th State, admitted to the Union 10 August
      1821, Missouri was named for the Missouri River, an Indian name meaning
      'muddy waters.'"——即舰名源自州名，而州名源自密苏里河。

  - field: identity.name_zh
    value: 密苏里号
    src: [danfs-missouri-iii]
    valid: { from: 1941-01-06 }
    confidence: B
    note: 中文通行译名。本舰是第三艘用此名的美国军舰（DANFS 标题 "Missouri III (BB-63)"）。

  - field: identity.name_en
    value: Missouri
    src: [danfs-missouri-iii]
    valid: { from: 1941-01-06 }
    confidence: A

  - field: identity.pennant_number
    value: BB-63
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1941-01-06 }
    confidence: A
    note: 两源一致。

  - field: identity.namesake
    value: 美国密苏里州（第 24 州，1821-08-10 加入联邦）；州名源自密苏里河
    src: [danfs-missouri-iii]
    valid: { from: 1941-01-06 }
    confidence: B
    note: >-
      DANFS 原文 "The 24th State, admitted to the Union 10 August 1821, Missouri
      was named for the Missouri River, an Indian name meaning 'muddy waters.'"

  - field: identity.ship_type
    value: battleship
    src: [danfs-missouri-iii]
    valid: { from: 1944-06-11 }
    confidence: A

  - field: identity.nation
    value: united_states
    src: [danfs-missouri-iii]
    valid: { from: 1944-06-11 }
    confidence: A

  - field: identity.operator
    value: United States Navy（美国海军）
    src: [danfs-missouri-iii]
    valid: { from: 1944-06-11 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [danfs-missouri-iii]
    valid: { from: 1944-06-11 }
    confidence: B
    note: >-
      按服役期定位。本舰 1944-06 服役，二战、朝鲜战争、1991 海湾战争三段
      均在役；1986-05-10 复役至 1992-03-31 的冷战段由切片与 fact 时间窗表达。

  # ============================================================ 建造
  - field: construction.builder
    value: New York Navy Yard（纽约海军造船厂）
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1941-01-06 }
    confidence: A
    note: 'DANFS "laid down on 6 January 1941 at Brooklyn, N.Y., by the New York Navy Yard"。'

  - field: construction.builder_location
    value: 美国纽约州布鲁克林（Brooklyn, New York）
    src: [danfs-missouri-iii]
    valid: { from: 1941-01-06 }
    confidence: A
    note: DANFS 明确写 "Brooklyn, N.Y."。

  - field: construction.laid_down
    value: 1941-01-06
    unit: date
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1941-01-06 }
    confidence: A
    note: 两源一致（navypedia "6.1.1941"）。

  - field: construction.launched
    value: 1944-01-29
    unit: date
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1944-01-29 }
    confidence: A
    note: >-
      两源一致（navypedia "29.1.1944"）。DANFS 补下水掷瓶人：
      "sponsored by Miss Margaret Truman, daughter of then-Senator from Missouri
      Harry S Truman"——即后来接任总统的那位参议员之女。

  - field: construction.commissioned
    value: 1944-06-11
    unit: date
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1944-06-11 }
    confidence: A
    note: >-
      两源一致。DANFS 记首任舰长："commissioned on 11 June 1944, Capt. William M.
      Callaghan in command"。本舰是四舰中第三艘服役、最后一艘建成服役的
      同级舰（Wisconsin 早两个月）。

  - field: service.commander
    value: William M. Callaghan（上校）
    src: [danfs-missouri-iii]
    valid: { from: 1944-06-11 }
    confidence: B
    note: DANFS 原文 "commissioned on 11 June 1944, Capt. William M. Callaghan in command"。

  - field: service.commander
    value: Warner R. Edsall（上校），1953-03-26 在佐世保港内因心脏病突发殉职
    src: [danfs-missouri-iii]
    valid: { from: 1952-09, to: 1953-03-26 }
    confidence: B
    note: >-
      DANFS "She sustained a grievous casualty on 26 March, when Capt. Warner R.
      Edsall, her commanding officer, suffered a fatal heart attack while conning
      her through the submarine net at Sasebo"。任期起点按该次朝鲜战区部署
      履任月份 1952-09（同段 "stood out of Hampton Roads on 11 September 1952"
      为该任内出航）。

  # ============================================== 装甲（逐舰差异）
  - field: protection.armor.thickness
    value: 368
    unit: mm
    qual: { part: bulkhead, region: fore }
    src: [navypedia-iowa]
    valid: { from: 1944-06-11 }
    confidence: C
    note: >-
      navypedia "(BB63, 64): ... Thickness of fore bulkhead was 368mm, but at
      lower part of bulkhead it was decreased to 297mm"。
      同页另注明该加厚**自本级三号舰起**实施："Unique difference became increased
      to 368mm transverse bulkheads thickness, since the third ship of a class"。
      故 BB-61/62 为 287 mm（见 ships/iowa.yaml），BB-63/64 为 368 mm。

  - field: protection.armor.thickness
    value: 297
    unit: mm
    qual: { part: bulkhead, region: lower }
    src: [navypedia-iowa]
    valid: { from: 1944-06-11 }
    confidence: C
    note: 同上句 "at lower part of bulkhead it was decreased to 297mm"。

  # ======================================== 武备（竣工状态，逐舰差异）
  - field: armament.aa_40mm.count
    value: 80
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1944-06-11, to: 1945-04-30 }
    confidence: C
    note: >-
      navypedia 武器栏 (BB62, 63) "20 x 4 - 40/56 Mk 1.2"，即 20 座四联 = 80 门。
      **BB-61 为 15 座四联 = 60 门**，本舰比首舰多 5 座。
      时间窗截止取 1945-04 底，因同页改装表 "5/1945, Missouri: + 8 x 2 - 20/70
      Mk 4, SP radar, TDY ECM suite" 记该月有加改装。

  - field: armament.aa_20mm.count
    value: 49
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1944-06-11, to: 1945-04-30 }
    confidence: C
    note: >-
      navypedia (BB62, 63) "49 x 1 - 20/70 Mk 4"，按管数记 49 门单装。
      DANFS 词条首部亦作 "49 20 millimeter"，两源一致。

  - field: armament.mount.summary
    value: >
      1944-06 竣工：3 × 3 16"/50 Mark 7 + 10 × 2 5"/38 Mark 12
      + 20 × 4 40 mm Bofors（80 门）+ 49 × 1 20 mm Oerlikon
      + 2 部弹射器、3 架水上飞机
    src: [navypedia-iowa, danfs-missouri-iii]
    valid: { from: 1944-06-11, to: 1945-04-30 }
    confidence: C
    note: >-
      navypedia (BB62, 63) 行原文与 DANFS 首部 "armament 9 16-inch, 20 5-inch,
      80 40 millimeter, 49 20 millimeter" 完全一致，是本轮少见的
      「专题站与官方出版物逐项互证」。

  - field: armament.mount.summary
    value: >
      1945-01 状态（受降仪式时）：3 × 3 16"/50 Mark 7 + 10 × 2 5"/38 Mark 28
      + 20 × 4 40 mm（80 门）+ 8 × 2 与 32 × 1 20 mm + 2 部弹射器、3 架水上飞机
      + SK-2、2 × SG、SP、Mk 27、2 × Mk 8、4 × Mk 12.22 雷达、TDY 电子战套件
    src: [navypedia-iowa]
    valid: { from: 1945-05, to: 1945-12 }
    confidence: C
    note: >-
      navypedia 改装表 "1/1946, BB63 Missouri: 3 x 3 - 406/50 Mk 7, 10 x 2 -
      127/38 Mk 28, 20 x 4 - 40/60 Mk 2, 8 x 2 - 20/70 Mk 24, 32 x 1 - 20/70
      Mk 10, 2 catapults, 3 seaplanes, SK-2, 2x SG, SP, Mk 27, 2x Mk 8,
      4x Mk 12.22 radars, TDY ECM suite"。时间窗起点取 5/1945（同页记该月
      +8 × 2 20 mm 与 SP 雷达），代表受降仪式前后状态。

