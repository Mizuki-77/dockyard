  # ============================================== 服役与战历（骨架）
  - field: service.unit
    value: 第 3 舰队旗舰（Third Fleet，Admiral William F. Halsey Jr. 座舰）
    src: [danfs-missouri-iii]
    valid: { from: 1945-05-18, to: 1945-09-05 }
    confidence: B
    note: >-
      DANFS "That afternoon Adm. William F. Halsey, Jr., Commander 3d Fleet,
      broke his flag in Missouri"（1945-05-18 于关岛阿普拉港）。
      同词条 "The afternoon of 5 September 1945, Adm. Halsey transferred his flag
      to battleship South Dakota (BB-57)"，故任期止于 1945-09-05。

  - field: service.unit
    value: 第 7 舰队旗舰（Seventh Fleet）
    src: [danfs-missouri-iii]
    valid: { from: 1950-10-14, to: 1951-03-28 }
    confidence: B
    note: >-
      DANFS "She arrived at Sasebo on 14 October, where she became flagship of
      Vice Adm. A. D. Struble, Commander, 7th Fleet"；
      "She arrived at Yokosuka on 24 March [1951], and 4 days later was relieved
      of duty in the Far East"。

  - field: service.unit
    value: 第 7 舰队旗舰（Seventh Fleet，Vice Adm. J. J. Clark）
    src: [danfs-missouri-iii]
    valid: { from: 1952-10-19, to: 1953-04-06 }
    confidence: B
    note: >-
      DANFS "arrived at Yokosuka on 17 October, where she broke the flag of Vice
      Adm. J. J. Clark, commander of the 7th Fleet, on 19 October"；
      "She was relieved as 7th Fleet flagship on 6 April by sister ship New Jersey
      (BB-62)"。

  - field: service.unit
    value: 第 3 舰队参加对日本本土的航母打击与炮击（1945-07 起）
    src: [danfs-missouri-iii]
    valid: { from: 1945-07-08, to: 1945-08-15 }
    confidence: B
    note: >-
      DANFS "The task force set a northerly course on 8 July 1945 to approach the
      Japanese mainland ... For the first time, a naval gunfire force wrought
      destruction on a major installation within the home islands when Missouri
      closed the shore to join in a bombardment 15 July that damaged the Nihon
      Steel Co. and the Wanishi Ironworks at Muroran, Hokkaido"。

  # ============================================== 结局与博物馆舰
  - field: construction.fate_type
    value: preserved
    src: [danfs-missouri-iii, ussmissouri-memorial, navypedia-iowa]
    valid: { from: 1998-05-04 }
    confidence: B
    note: >-
      DANFS "Donated as a museum and memorial ship on 4 May 1998, she was later
      transferred to Pearl Harbor where the old battleship rests near the Arizona
      (BB-39) Memorial and is open for tours by the public"。
      馆方官网 "The Battleship Missouri Memorial is a Pearl Harbor museum ...
      located on Ford Island in Honolulu, Hawaii"，两源一致。

  - field: construction.fate_date
    value: 1998-05-04
    unit: date
    src: [danfs-missouri-iii]
    valid: { from: 1998-05-04 }
    confidence: B
    note: >-
      捐赠（转为博物馆舰）日期。此后的移交珍珠港日期 DANFS 未给具体日，
      navypedia 建造表亦只记 "stricken 1.1995"，故移交日不填。

  - field: service.fate_category
    value: >-
      1944-06-11 服役 → 1947 年两度赴地中海/里约热内卢外交航行 → 1950-02 起
      入朝鲜战区 → 1955-02-26 退役入布雷默顿太平洋后备舰队 → 1986-05-10 复役
      → 1991 参加"沙漠风暴" → 1992-03-31 退役 → 1995-01-12 除籍
      → 1998-05-04 转为博物馆舰（珍珠港）
    src: [danfs-missouri-iii, navypedia-iowa]
    valid: { from: 1944-06-11 }
    confidence: B
    note: >-
      逐段来源：DANFS "decommissioned 26 February 1955, entering the Bremerton
      Group, Pacific Reserve Fleet" / "modernized and recommissioned at San
      Francisco on 10 May 1986" / "was decommissioned on 31 March 1992" /
      "she was stricken from the Naval Vessel Register"（1995-01-12）/
      "Donated as a museum and memorial ship on 4 May 1998"；
      navypedia 建造表 "stricken 1.1995"。

