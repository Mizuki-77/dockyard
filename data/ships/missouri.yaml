  - field: armament.mount.summary
    value: >
      1986 年复役改装后：3 × 3 16"/50 Mark 7 保留 + 6 × 2 5"/38 Mark 28
      + 8 × 4「战斧」巡航导弹发射箱（32 枚 BGM-109B）
      + 4 × 4「鱼叉」反舰导弹发射箱（16 枚 RGM-84A）
      + 4 × 6 20 mm「密集阵」近防炮 + 直升机甲板
    src: [navypedia-iowa, nhhc-h029-4]
    valid: { from: 1986-05-10, to: 1992-03-31 }
    confidence: C
    note: >-
      navypedia 现代化栏原文 "8 x 4 Tomahawk CruM (32 BGM-109B), 4 x 4 Harpoon SSM
      (16 RGM-84A), 3 x 3 - 406/50 Mk 7 (BB61), 6 x 2 - 127/38 Mk 28,
      4 x 6 - 20/76 Mk 15 Phalanx, helicopter deck"（该栏以 BB61 标注仍保留
      三座主炮塔，同级四舰相同）。**5 英寸炮座由 10 座减到 6 座**，
      是复役改装对二战形态最大的一处改动。DANFS 记 1990-08 后
      "installed more point defense weapons" 并搭载无人机（RPV）。

