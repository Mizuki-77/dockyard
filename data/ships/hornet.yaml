# ============================================================================
# 大黄蜂（USS Hornet, CV-8）—— 约克城级三号舰
#
# 2026-11-19 入库。数据来自 work/raw/yorktown-hornet-tech.md。
#
# **DANFS 路径是 hornet-vii，不是 hornet-viii。**
# CV-8 在 DANFS 里是 Hornet VII；hornet-viii.html 是 CV-12（埃塞克斯级）。
#
# 与另两艘同级舰的三处硬差异：
#   1. **5"/38 炮架型号 Mk 24 Mod 2**（后改 Mod 6）—— 姊妹舰是 Mk 21 Mod 16
#   2. **射击指挥仪 Mk 37** —— 姊妹舰是 Mk 33
#   3. **中途岛时没有 CXAM，只有 SC**；CXAM 是 1942-06-20～28
#      才从加利福尼亚号拆来装上的
#
# 关于「按战时标准建造」：不准确。原句是「minimally modified Yorktown design」，
# 1939-09 开工，属战前。
# ============================================================================

id: hornet
name:
  zh: 大黄蜂号
  en: Hornet
class: yorktown
note: >-
  约克城级三号舰。杜立特空袭东京的起飞母舰。
  圣克鲁斯海战后于 1942-10-27 沉没。

open_ended_note: >-
  本舰参数有效期自 1941-10-20 服役至 1942-10-27 沉没。
  与同级舰共用的舰体、动力、机库等数据写在 classes/yorktown.yaml。

facts:
  # ============================================================
  # 身份
  # ============================================================
  - field: identity.name_original
    value: Hornet
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1940-12-14 }
    confidence: B

  - field: identity.name_zh
    value: 大黄蜂号
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1940-12-14 }
    confidence: B

