    valid: { from: 1941-10-20 }
    confidence: B

  - field: identity.era
    value: ww2
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1941-10-20 }
    confidence: B

  - field: identity.building_program
    value: >-
      1933-06-16 国会法案授权的同级舰；1939-09 开工，属战前建造。
      设计上只是「minimally modified Yorktown design」，
      **不是「按战时标准建造」**。
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1939-09-25 }
    confidence: B

  # ============================================================
  # 建造
  # ============================================================
  - field: construction.builder
    value: Newport News Shipbuilding & Dry Dock Co.
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1939-09-25 }
    confidence: B
    note: 三舰同一建造厂，差异只在船台号（约克城 359 / 企业 360 / **大黄蜂 385**）。

  - field: construction.builder_location
    value: Newport News, Virginia
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1939-09-25 }
    confidence: B

  - field: construction.yard_number
    value: "385"
    src: [navypedia-yorktown-class]
    valid: { from: 1939-09-25 }
    confidence: C

  - field: construction.laid_down
    value: 1939-09-25
    unit: date
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1939-09-25 }
    confidence: B

  - field: construction.launched
    value: 1940-12-14
    unit: date
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1940-12-14 }
    confidence: B

  - field: construction.commissioned
    value: 1941-10-20
    unit: date
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1941-10-20 }
    confidence: B

  - field: construction.fate_date
    value: 1942-10-27
    unit: date
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1942-10-27 }
    confidence: B
    note: >-
      圣克鲁斯海战（1942-10-26）重伤后被放弃，10-27 由己方驱逐舰
      雷击处分（含 Mustin、Anderson 等）。沉没坐标各来源差 9 个经度。

  - field: construction.fate_type
    value: sunk_by_enemy
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1942-10-27 }
    confidence: B
    note: >-
      严格说是「先被敌机重创、后被己方处分」。
      注：此处记 sunk_by_enemy 而非 scuttled，因为致命损伤来自日军空袭；
      若按「谁让它沉」的严格口径应记 scuttled。两种口径都能自圆，不裁决。

  # ============================================================
  # 武备（本舰特有 —— 三舰最硬的装备差异）
  # ============================================================
  - field: armament.mount.summary
    value: >-
      1942-06 中途岛时：5"/38 单装 8 座（**Mk 24 Mod 2 炮架**）+
      1.1"/75 四联装 4 座（16 管）+ 20mm 厄利孔若干
    src: [nhhc-hornet-midway-report]
    valid: { from: 1942-05-28, to: 1942-06-13 }
    confidence: A
    note: >-
      **5"/38 的炮架型号与两艘姊姊舰不同**：约克城与企业号是 Mk 21 Mod 16，
      大黄蜂是 Mk 24 Mod 2（后改 Mod 6）。
      这是同级舰里最硬的一处装备差异。

  - field: armament.aa_40mm.count
    value: 0
    unit: count
    src: [nhhc-hornet-midway-report]
    valid: { from: 1941-10-20, to: 1942-06-13 }
    confidence: A
    note: >-
      这是「0」，有一手战报支撑。大黄蜂的中途岛战报与损管表逐项列全了
      全自动武器——只有 1.1"/75 与 20mm，没有 40mm。
      全美首装四联 40mm 是 1942-06-22 的怀俄明号训练舰，比中途岛晚 18 天。

  - field: armament.torpedo.tubes
    value: 0
    unit: count
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1941-10-20, to: 1942-10-27 }
    confidence: B

  # ============================================================
  # 雷达与火控（与姊姊舰不同）
  # ============================================================
  - field: sensors.radar.installed
    value: SC 对空搜索雷达
    src: [nhhc-hornet-midway-report]
    valid: { from: 1941-10-20, to: 1942-06-19 }
    confidence: A
    note: >-
      **中途岛时大黄蜂没有 CXAM，只有 SC。**
      CXAM 是 1942-06-20 至 28 才从加利福尼亚号拆来装上的——
      也就是说它在圣克鲁斯海战前才有 CXAM。
      这是三舰在雷达上的实际差异，不是笔误。

  - field: sensors.director.type
    value: Mk 37
    src: [navweaps-5in38-mk24]
    valid: { from: 1941-10-20, to: 1942-10-27 }
    confidence: C
    note: >-
      与两艘姊姊舰不同：约克城与企业号是 Mk 33，大黄蜂是 Mk 37。
      这跟它的 Mk 24 炮架配套。

