    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1940-12-14 }
    confidence: B

  - field: identity.pennant_number
    value: CV-8
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1941-10-20 }
    confidence: B

  - field: identity.ship_type
    value: aircraft_carrier
    src: [nhhc-danfs-hornet-vii]
    valid: { from: 1941-10-20 }
    confidence: B

  - field: identity.nation
    value: united_states
