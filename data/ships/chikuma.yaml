# ============================================================================
# 单舰：筑摩（Chikuma）—— 利根级重巡洋舰 2 番舰
# ----------------------------------------------------------------------------
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
# 本文件只写「与舰级不同 / 本舰独有」的值。
# 全部技术骨架见 classes/tone.yaml。
#
# 【与利根的三处真差异】
#   1) 舰体工艺：利根保留部分焊接，筑摩改为全铆接（pwe 原文见 construction.builder 条）。
#   2) 雷达：筑摩 1943-02 装 21 号后**再没撤过**；利根 1944-11 把 21 号换成了 22 号。
#      两舰最终雷达配置因此不同（筑摩 21×1 + 22×2 + 13×1；利根 22×3 + 13×1）。
#   3) 结局：筑摩 1944-10-25 在萨马岛外海沉没，是两舰里先沉的一艘；
#      而且「是谁把它打沉的」两源有分歧，见 fate 各条。
#
# 调研底稿：work/staging/tone/RESEARCH-NOTES.md
# ============================================================================

id: chikuma
name:
  zh: 筑摩
  en: Japanese cruiser Chikuma

class: tone

open_ended_note: >
  本舰 1939-05-20 竣工于三菱长崎，1944-10-25 在萨马岛以东沉没，
  1945-04-20 除籍。战时无大规模改装，只有雷达与 25 mm 机铳逐次加装（见下）。

