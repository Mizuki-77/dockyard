  # ============================================================ 战历编制
  - field: service.unit
    value: >-
      CruDiv 8 / 第八戦隊（至 1944-01-01 解散，本舰与利根同队，真珠湾攻击时隶属南云机动部队）
      → CruDiv 7 / 第七戦隊（1944-01-01 起，与熊野、铃谷同队）
    src: [combinedfleet-chikuma-trom]
    valid: { from: 1941-11-26, to: 1944-10-25 }
    confidence: C
    note: >
      **起点取 TROM 能直接佐证的日期。** 本舰所属 CruDiv 8 最早出现在
      "26 November 1941: CruDiv 8's CHIKUMA and TONE depart Hitokappu Bay"；
      **CruDiv 8 的成立日期 TROM 未记**（日文来源记 1939-11-15，属 tier E，未采用）。
      转入 CruDiv 7 的原文："1 January 1944: CruDiv 8 is disbanded. CHIKUMA and TONE are
      assigned to Rear Admiral ... Nishimura Shoji's ... CruDiv 7 with KUMANO and SUZUYA."
      本舰两次短期任旗舰：1944-03-24 至 04-07（"Flagship of CruDiv 7."），
      萨马岛海战中熊野中雷后 "CHIKUMA is designated the ad hoc flagship of CruDiv 7."

  - field: service.casualties
    value: 190
    unit: persons
    src: [combinedfleet-chikuma-trom]
    valid: { from: 1942-10-26, to: 1942-10-26 }
    confidence: C
    note: >
      **这是单场战斗的阵亡数，不是全生涯数。** TROM 原文：
      "CHIKUMA jettisons her torpedoes before a 500-lb bomb dropped by a Douglas SBD-3
      "Dauntless" dive-bomber from HORNET hits her starboard forward torpedo room.
      She is also hit by two other bombs. She loses one E13A1 "Jake" on the catapult.
      Her crew suffers 190 killed and 154 wounded including Captain Komura."
      伤 154 人另记，本站无「负伤」字段。

  # ============================================================ 战时改装：雷达
  - field: sensors.radar.installed
    value: 二一号電波探信儀（Type 21 air-search radar）
    src: [combinedfleet-chikuma-trom]
    valid: { from: 1943-02-27 }
    confidence: C
    note: >
      TROM 原文："CHIKUMA is repaired and undergoes a refit. Two additional 25-mm twin
      mounts are installed and a Type 21 air-search radar is fitted."
      随后 "27 February 1943: The refit is completed."，故装舰时点在本条起始日之前，
      本条取「改装完工、确定已装」的 1943-02-27。
      **与利根不同：本舰的 21 号雷达此后从未撤除**，故 valid.to 留空。

  - field: sensors.radar.installed
    value: 二二号電波探信儀 ×2（Type 22 surface-search radar）
    src: [navypedia-tone]
    valid: { from: 1944-07 }
    confidence: C
    note: >
      navypedia 现代化栏原文："6 - 7.1944, Chikuma: - 4 x 1 - 13.2/76;
      + 4 x 3 - 25/60 96-shiki, 23 x 1 - 25/60 96-shiki, 2x 2-shiki 2-go,
      3-shiki 1-go radars"。
      「2-shiki 2-go」即二二号（二号二型）；「3-shiki 1-go」即一三号。
      **原文只给到月份区间（6-7.1944），本条按 YYYY-MM 取 1944-07，
      不是精确到日——不要把它写成某一天。** 同期 combinedfleet 只记
      "26 June 1944: Arrives at Kure. Drydocked."，未列加装明细。

  - field: sensors.radar.installed
    value: 一三号電波探信儀（Type 13 air-search radar）
    src: [navypedia-tone]
    valid: { from: 1944-07 }
    confidence: C
    note: 同条 navypedia 原文的 "3-shiki 1-go radar"，月份口径同上。

  # ============================================================ 战时改装：25 mm 机铳
  - field: armament.aa_25mm.count
    value: 20
    unit: count
    src: [combinedfleet-chikuma-trom]
    valid: { from: 1944-02-01, to: 1944-06-30 }
    confidence: C
    note: >
      TROM 原文："12 December 1943: Arrives at Kure. Begins refit. The forward 25-mm twin
      AA mounts are replaced by four triple mounts, bringing the total number of 25-mm
      AA guns to 20 (4 x 3 and 4 x 2)." / "1 February 1944: At Kure. The refit is completed."
      与利根同期的 20 挺构成相同（4 座三联 + 4 座双联）。
      起始日取改装完工日 1944-02-01；终止日取 1944-06-30，因为 TROM 记
      "26 June 1944: Arrives at Kure. Drydocked."，此后 6-7 月的改装又加装了机铳，
      **20 这个数字在这次改装之后就作废了**（新总数未获取，见下方说明）。

  # 1944 年 6-7 月改装之后（即本舰最终状态）的 25 mm 总数 **未获取，故意不登记。**
  # 理由：navypedia 只给增量（"+ 4 x 3 - 25/60 96-shiki, 23 x 1 - 25/60 96-shiki"），
  # 没说改装前的双联座是否保留、也没给总数；把 20 加上 12+23 得到 57 属自算，
  # 而 55 这个合计只出现在日文百科（tier E）且原文自称「推定」。
  # 两条路径一条是推算、一条是 tier E，都不能进 fact（SCHEMA §1 红线）。
  # 详见 RESEARCH-NOTES 的「未获取」一节。

  # ============================================================ 结局
  - field: construction.fate_date
    value: 1944-10-25
    unit: date
    src: [navypedia-tone, combinedfleet-chikuma-trom]
    valid: { from: 1944-10-25 }
    confidence: C
    note: >
      两源一致 1944-10-25（萨马岛海战当日）。
      combinedfleet 原文："Around 1430, CHIKUMA capsizes and sinks by the stern at
      11-52N, 126-36E. NOWAKI rescues some 120 survivors."

  - field: construction.fate_type
    value: sunk_by_enemy
    src: [combinedfleet-chikuma-trom]
    valid: { from: 1944-10-25 }
    confidence: C
    note: >
      **两说并列，不裁决。** 本条依据 combinedfleet 的逐时记录：本舰先被 TBM 投放的
      Mk.13 鱼雷打瘫，末次空袭中再中三条鱼雷后倾覆沉没，原文："After 1415, CHIKUMA is
      attacked by three TBM-1Cs from OMANNEY BAY (CVE-79) ... Three torpedoes hit her
      port side amidships. Around 1430, CHIKUMA capsizes and sinks by the stern"。
      另一说见下一条。

  - field: construction.fate_type
    value: sunk_by_own_forces
    src: [navypedia-tone]
    valid: { from: 1944-10-25 }
    confidence: C
    note: >
      **两说并列，不裁决。** navypedia 原文："In battle at Samar 25.10.1944 she was
      heavy damaged by American carrier aircraft and sunk by destroyer Nowaki."
      即：被美机重创后，由己方驱逐舰野分以鱼雷处分。
      日文来源（tier E）亦记「駆逐艦野分により雷撃処分された」，与 navypedia 同侧。
      两条 fate_type 各自带来源保留，谁对由读者判断。

  - field: service.fate_category
    value: 萨马岛海战中被美军舰载机重创后沉没；沉没时舰长则满宰次以下多数阵亡，野分救起约 120 人
    src: [combinedfleet-chikuma-trom, navypedia-tone]
    valid: { from: 1944-10-25 }
    confidence: C
    note: >
      combinedfleet 原文："NOWAKI rescues some 120 survivors."，
      并在作者注里补："A single survivor from CHIKUMA was picked up by an American
      warship three days later."，另记野分当夜被美军击沉、
      "NOWAKI goes down with all hands, including CHIKUMA's survivors."
      **本舰阵亡总数的确切数字未获取**（来源只给「约 120 人生还」这一个中间数字，
      由 850 编制减 121 属推算，本站不做），故不登记 service.casualties 的全生涯值。

