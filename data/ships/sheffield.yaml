# ============================================================================
# 单舰：HMS Sheffield（谢菲尔德号轻巡洋舰，舷号 24 / 战后 C24）
# ----------------------------------------------------------------------------
# 属 Town class 的 Southampton 子级（5 艘中的第 3 艘）。舰级设计值见
# data/classes/town.yaml，本文件只写本舰特有的：建造、改装、战历、编制变化。
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 【本舰最常被写错的三处，本文件逐条锁定】
#   1) 1941-05-26 被皇家方舟的 Swordfish 误击这件事，**不是本舰认错目标**：
#      是她被派去跟踪俾斯麦，而飞行员没被告知附近有友舰。她一枚没打、
#      一颗雷没中（11 雷：2 入水即爆、3 横穿尾迹时爆、6 被规避）。
#   2) 同日晚 2140 左右，俾斯麦向她打了 6 次齐射，**未直接命中**，
#      但破片打坏雷达、伤 12 人、3 人后来死亡。这一条与误击是两件事。
#   3) 1967 年拆解要分三段：1964 列入处置清单 → 1967 在 Rosyth 拆除设备
#      → 1967-09-18 拖抵 Faslane 交 Shipbreaking Industries 拆毁。
# ============================================================================

id: sheffield
name:
  zh: 谢菲尔德号
  en: HMS Sheffield
class: town
open_ended_note: >
  Southampton 子级（城级第一组）第 3 艘。二战中在北海、大西洋、地中海、
  北极四个战场均有作战记录，获 12 项战功表彰（battle honours）。
  战后长期担任美洲与西印度群岛站旗舰，1959 年转入预备役，
  1967 年在 Faslane 拆解。

