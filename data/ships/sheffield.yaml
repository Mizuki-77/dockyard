    value: >-
      1945 年状态：9 × 6 in（3 座三联，X 塔已拆）
      ＋ 8 × 4 in（4 座双联）＋ 16 × 2-pdr（2 座八联 pom-pom）
      ＋ 16 × 40 mm Bofors（4 座四联）＋ 20 mm Oerlikon 若干（双联为主）
      ＋ 6 具 21 in 鱼雷管
    src: [navypedia-town]
    valid: { from: 1945-05-01, to: 1946-01-31 }
