  # ============================================================ 伤亡
  # 注册表没有「战损」字段，故战损叙述放切片与正文；这里只登记有据可查的人数。
  - field: service.casualties
    value: 3
    unit: persons
    src: [kbismarck-chase, hmshood-tovey-dispatch, kbismarck-admiralty-war-diary]
    valid: { from: 1941-05-26, to: 1941-05-28 }
    confidence: A
    note: >
      **这是 1941-05-26 夜被俾斯麦号炮击造成的死亡数，不是全舰战历总和。**
      俾斯麦在约 9 英里距离上向她打了 6 次齐射，无直接命中；破片打坏雷达
      与上层甲板结构，伤 12 人，其中 3 人后来死亡。
      Admiralty War Diary 原文「At 2140 the enemy fired 6 accurate salvoes at
      her and caused some casualties and slight damage」；
      kbismarck 原文「some splinters disabled her radar and injured twelve men
      of whom three died later」。

      三名死者（kbismarck 脚注 9 逐名给出）：
      Ordinary Seaman David T. George 1941-05-26 阵亡、
      Able Seaman Ambrose Ling 1941-05-27 阵亡（伤重不治）、
      Able Seaman Raymond C. Taylor 1941-05-28 阵亡（伤重不治）。

      **必须与当日更早那次「被自己人雷击」分开**：那次 11 枚鱼雷全部落空，
      本舰无一伤亡，也一炮未还。两件事不要混成一件。

  - field: service.casualties
    value: 1
    unit: persons
    src: [naval-history-sheffield]
    valid: { from: 1942-03-04, to: 1942-03-04 }
    confidence: C
    note: >
      1942-03-04 在冰岛东北触雷，原文「Major damage was sustained aft and a
