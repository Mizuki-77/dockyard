  - field: service.casualties
    value: 47
    unit: persons
    src: [nhhc-h029-4]
    valid: { from: 1989-04-19 }
    confidence: B
    note: >-
      NHHC 引 CNO 背书原文："On 19 April 1989 a rapid series of three explosions
      within turret II aboard USS IOWA (BB 61) resulted in the instantaneous
      deaths of 47 American Sailors"。47 人全部是二号炮塔及其相邻弹药
      转运舱内的人员，事故原因至 1991 年仍未定论（详见正文与
      RESEARCH-NOTES 的「有争议的记载」）。

  # ============================================== 结局与博物馆舰
  - field: construction.fate_type
    value: preserved
    src: [marad-vessel-iowa, pacificbattleship-iowa]
    valid: { from: 2012 }
    confidence: B
    note: >-
      作为博物馆舰保存。MARAD 记录 2011-10-27 离开 Suisun Bay 后备舰队、
      移交洛杉矶 Pacific Battleship Center；馆方官网记 "Since 2012, more than
      three million people have visited"。故保存状态自 2012 年起成立。

  - field: construction.fate_date
    value: 2011-10-27
    unit: date
    src: [marad-vessel-iowa]
    valid: { from: 2011-10-27 }
    confidence: B
    note: >-
      MARAD "Withdrawal | 10/27/2011 | Departed the Suisun Bay Reserve Fleet to be
      transferred to the Pacific Battleship Center in Los Angeles, California"。
      这是移交（不是退役）日期；退役日期见下面 fact。

  - field: service.fate_category
    value: >-
      1949-03-24 首次退役 → 1951-08-25 因朝鲜战争复役 → 1958-02-24 二次退役
      入费城大西洋后备舰队 → 1984-04-28 复役（1980 年代 600 舰海军计划）
      → 1990-10-26 最终退役 → 2006-03 除籍 → 2012 起为洛杉矶博物馆舰
    src: [danfs-iowa-iii, nhhc-h029-4, marad-vessel-iowa, navypedia-iowa]
    valid: { from: 1949-03-24 }
    confidence: B
    note: >-
      逐段来源：DANFS "decommissioned 24 March 1949" / "recommissioned 25 August
      1951" / "She decommissioned 24 February 1958 and entered the Atlantic
      Reserve Fleet at Philadelphia"；NHHC H-029-4 "Iowa was re-commissioned on
      28 April 1984" / "She was decommissioned on 26 October 1990"；
      navypedia 建造表 "stricken 3.2006"；MARAD 记 2011-10-27 移交。
      **1958 与 1959 两说**：DANFS 作 1958-02-24，NHHC H-029-4 作
      "decommissioned again in 1959"——两说并列，不裁决。
