  # ============================================== 装甲（逐舰差异）
  - field: protection.armor.thickness
    value: 287
    unit: mm
    qual: { part: bulkhead, region: fore }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "(BB61, 62): ... Thickness of fore bulkhead was 287mm, but at
      lower part of bulkhead it was decreased to 216mm"。
      **BB-63/64 同一处为 368 mm**（原文 "(BB63, 64): Thickness of fore bulkhead
      was 368mm ... decreased to 297mm"）。这是舰级内真实差异，不是两说，
      故写在本舰与 missouri.yaml，而不写进 classes/iowa.yaml。

  - field: protection.armor.thickness
    value: 216
    unit: mm
    qual: { part: bulkhead, region: lower }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 同上句 "at lower part of bulkhead it was decreased to 216mm"。

  # ======================================== 武备（竣工状态，逐舰差异）
  - field: armament.aa_40mm.count
    value: 60
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1943-02-22, to: 1943-12-31 }
    confidence: C
    note: >-
      navypedia 武器栏 (BB61) "15 x 4 - 40/56 Mk 1.2"，即 15 座四联装 = 60 门。
      **BB-62/63 为 20 座四联 = 80 门**，本舰是四舰里 40 mm 最少的一艘。
      时间窗截止取 1943 年底，因为同页改装表记 "1943, Iowa: - 8 x 1 - 20/70;
      + 4 x 4 - 40/56 Mk 1.2"，即同年内即有增装，竣工值只在这一段成立。

  - field: armament.aa_20mm.count
    value: 60
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1943-02-22, to: 1943-12-31 }
    confidence: C
    note: >-
      navypedia (BB61) "60 x 1 - 20/70 Mk 4"，按管数记 60 门单装。
      BB-62/63 为 49 门，BB-64 另有 2 座双联 + 49 门单装。
      同页改装表 "1943, Iowa: - 8 x 1 - 20/70"，故竣工值只到 1943 年底。

  - field: armament.mount.summary
    value: >
      1943-02 竣工：3 × 3 16"/50 Mark 7 + 10 × 2 5"/38 Mark 12
      + 15 × 4 40 mm Bofors（60 门）+ 60 × 1 20 mm Oerlikon
      + 2 部弹射器、3 架水上飞机（OS2U/SOC/SO3C）
    src: [navypedia-iowa, danfs-iowa-iii]
    valid: { from: 1943-02-22, to: 1943-12-31 }
    confidence: C
    note: >-
      navypedia (BB61) 武器行原文 "3 x 3 - 406/50 Mk 7, 10 x 2 - 127/38 Mk 12,
      15 x 4 - 40/56 Mk 1.2, 60 x 1 - 20/70 Mk 4, 2 catapults, 3 seaplanes
      (OS2U, SOC, SO3C)"。DANFS Iowa 词条只给 "a. 9 16\", 20 5\""（不含高炮），
      与本条不冲突。

  - field: armament.mount.summary
    value: >
      1945-01 状态：3 × 3 16"/50 Mark 7 + 10 × 2 5"/38 Mark 28
      + 19 × 4 40 mm Bofors（76 门）+ 8 × 2 与 32 × 1 20 mm Oerlikon
      + 2 部弹射器、3 架水上飞机、SC-2/SK-2/SP/SU/SG 雷达
    src: [navypedia-iowa]
    valid: { from: 1945-01, to: 1945-12 }
    confidence: C
    note: >-
      navypedia 改装表 "1/1946, BB61 Iowa: 3 x 3 - 406/50 Mk 7, 10 x 2 - 127/38
      Mk 28, 19 x 4 - 40/60 Mk 2, 8 x 2 - 20/70 Mk 24, 32 x 1 - 20/70 Mk 10,
      2 catapults, 3 seaplanes, SC-2, SK-2, SP, SU, SG, Mk 27, 2x Mk 13,
      4x Mk 12.22 radars, TDY ECM suite"。
      时间窗取 1945-01 起是因为同页 "3/1945, Iowa" 一条已记 +8 × 2 20 mm 与
      换雷达，1/1946 条是其后的完整快照。

