  - field: service.unit
    value: 第 5 舰队旗舰（Fifth Fleet）
    src: [danfs-iowa-iii]
    valid: { from: 1946-01 }
    confidence: B
    note: DANFS "returned to Japanese waters in January 1946 and became flagship of the 5th Fleet"。

  - field: service.unit
    value: 第 7 舰队旗舰（Seventh Fleet）
    src: [danfs-iowa-iii]
    valid: { from: 1952-04-01, to: 1952-10-17 }
    confidence: B
    note: >-
      DANFS "On 1 April 1952, Iowa became the flagship of Vice Admiral Robert T.
      Briscoe, Commander, 7th Fleet"。继任的 J. J. Clark 中将继续以本舰为旗舰
      直到 1952-10-17。

  - field: service.unit
    value: 第 2 舰队旗舰（Second Fleet，北约 "Mariner" 演习期间）
    src: [danfs-iowa-iii]
    valid: { from: 1953-07 }
    confidence: B
