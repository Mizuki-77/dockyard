  - field: construction.builder_location
    value: 美国纽约州布鲁克林（Brooklyn, New York）
    src: [navypedia-iowa]
    valid: { from: 1940-06-27 }
    confidence: C
    note: navypedia 明写 "New York N Yd, Brooklyn"；DANFS 只写 "New York Navy Yard"。

  - field: construction.laid_down
    value: 1940-06-27
    unit: date
    src: [danfs-iowa-iii, navypedia-iowa]
    valid: { from: 1940-06-27 }
