  - field: construction.builder
    value: New York Navy Yard（纽约海军造船厂）
    src: [danfs-iowa-iii, navypedia-iowa]
    valid: { from: 1940-06-27 }
    confidence: A
    note: >-
      DANFS "laid down at New York Navy Yard, 27 June 1940"；
