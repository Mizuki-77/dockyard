  # ---------------------------------------- 1980 年代复役的武器与航空设施
  - field: armament.mount.summary
    value: >
      1984 年复役改装后：3 × 3 16"/50 Mark 7 保留 + 6 × 2 5"/38 Mark 28
      + 8 × 4「战斧」巡航导弹发射箱（32 枚 BGM-109B）
      + 4 × 4「鱼叉」反舰导弹发射箱（16 枚 RGM-84A）
      + 4 × 6 20 mm「密集阵」近防炮 + 直升机甲板
    src: [navypedia-iowa, nhhc-h029-4]
    valid: { from: 1984-04-28, to: 1990-10-26 }
    confidence: C
    note: >-
      navypedia 现代化栏原文 "8 x 4 Tomahawk CruM (32 BGM-109B), 4 x 4 Harpoon SSM
      (16 RGM-84A), 3 x 3 - 406/50 Mk 7 (BB61), 6 x 2 - 127/38 Mk 28,
      4 x 6 - 20/76 Mk 15 Phalanx, helicopter deck"。
      **5 英寸炮座由 10 座减到 6 座**（拆 4 座），这是本舰与二战状态最大的一处
      差异；NHHC 记 "The battleships still retained their three triple 16-inch main
      battery turrets and most of the secondary 5-inch/38-caliber dual purpose
      mounts"，未给具体数。

  - field: aviation.aircraft.types
    value: 直升机（1980 年代复役后以直升机甲板取代水上飞机）
    src: [navypedia-iowa]
    valid: { from: 1984-04-28, to: 1990-10-26 }
    confidence: C
    note: navypedia 现代化栏 "helicopter deck"；同页 1948-1951 改装表另记
      "- 8 x 2 - 20/70; + 3 helicopters"，即直升机自 1950 年代已登舰。

