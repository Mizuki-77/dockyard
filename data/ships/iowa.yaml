# ============================================================================
# 单舰：Iowa（衣阿华号战列舰，BB-61）
# ----------------------------------------------------------------------------
# 与 classes/iowa.yaml 同一套约定：
#   1) 建造/服役/退役/结局等单舰事件
#   2) 本舰特有的值（覆盖舰级）
#   3) 状态切片：随时间变化的字段，用 valid 窗口表达"当时是什么样"
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 本文件命中即覆盖舰级，**不算分歧**。
#
# 本舰与舰级的三处真实差异（不是分歧，是逐舰不同）：
#   a) 装甲横舱壁：BB-61/62 首部横隔壁 287 mm（下部 216 mm），
#      BB-63/64 为 368 mm（下部 297 mm）——navypedia 原文按两批分列。
#      舰级文件记的是四舰不共有的那一半，故不作舰级 fact，只写这里。
#   b) 竣工防空：15 × 四联 40 mm / 60 × 单装 20 mm（navypedia BB61 行）；
#      BB-62/63 为 20 × 四联 40 mm / 49 × 单装 20 mm。**逐舰不同**。
#   c) 1984 年复役：本级四舰各自复役时间不同（Iowa 1984-04-28）。
# ============================================================================

id: iowa
name:
  zh: 衣阿华号
  en: Iowa
class: iowa

open_ended_note: |
  本文件中 valid.to 留空的 fact，均为「至今为止仍成立的单舰事实」
  （如结局、博物馆舰身份、编号），不存在后续变化事件。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: Iowa
    src: [danfs-iowa-iii, navypedia-iowa]
    valid: { from: 1940-06-27 }
    confidence: A
    note: 舰名取美国第 29 州艾奥瓦州；DANFS 记 "Iowa, the 29th state, was admitted to the Union, 28 December 1846, and was named for a Sioux Indian tribe"。

  - field: identity.name_zh
    value: 衣阿华号
    src: [danfs-iowa-iii]
    valid: { from: 1940-06-27 }
    confidence: C
    note: >-
      中文通行译名，另有「艾奥瓦号」「爱荷华号」两种写法，同指本舰。
      本站取「衣阿华」，与舰级名一致。

  - field: identity.name_en
    value: Iowa
    src: [danfs-iowa-iii]
    valid: { from: 1940-06-27 }
    confidence: A
    note: 本舰是第三艘用此名的美国军舰（DANFS 标题 "Iowa III (BB-61)"）。

  - field: identity.pennant_number
    value: BB-61
    src: [danfs-iowa-iii, navypedia-iowa]
    valid: { from: 1940-06-27 }
    confidence: A
    note: 两源一致。

  - field: identity.namesake
    value: 美国艾奥瓦州（第 29 州，1846-12-28 加入联邦）
    src: [danfs-iowa-iii]
    valid: { from: 1940-06-27 }
    confidence: B
    note: >-
      DANFS 原文 "Iowa, the 29th state, was admitted to the Union, 28 December
      1846, and was named for a Sioux Indian tribe that originally inhabited the
      Missouri Territory"。舰名本身取自州名。

  - field: identity.ship_type
    value: battleship
    src: [danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: A

  - field: identity.nation
    value: united_states
    src: [danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: A

  - field: identity.operator
    value: United States Navy（美国海军）
    src: [danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: 按服役期定位。本舰 1943-02 服役，二战全程在役；1984-04-28 复役至 1990-10-26 的冷战段由下面的切片与 fact 时间窗表达。

