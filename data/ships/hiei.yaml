# ============================================================================
# 比叡（ひえい / Hiei）—— 金刚型二番舰，横须贺海军工厂建造
#
# 2026-11-25 建（kongo-ships 组）。舰级共用数据见 classes/kongo.yaml，
# 本文件只写与舰级不同的、本舰特有的、以及随时间变化的部分。
#
# **本舰六个必须记住的识别点（前三个是四舰里独一无二的）：**
#   1. **日本第一艘国产超弩级战列舰**（横须贺海军工厂，1914-08-04 竣工）。
#      但材料大半仍从维克斯订购——日文来源自己说「実は材料の大半はヴィッカース社に
#      注文しており、純国産、とは言いづらい建造過程です」；combinedfleet 亦记
#      「Most of the parts used in her construction are imported from England.」
#   2. **唯一被降格为「練習戦艦」的一艘**（1929-1932 撤武装、拆 4 号炮塔、
#      拆舷侧装甲、锅炉 36→11 座、速力掉到 18 kn）。这段历史四舰里只有比叡有，
#      也是她 1940 年「一次性做完别人两次改装」的原因。
#   3. **唯一塔型舰桥的一艘**（另三舰是檣楼型）——日文来源：「他の『金剛型』の
#      艦橋は檣楼型ですが、【比叡】のみ塔型となっている」，且是**大和型舰桥的
#      试验原型**（combinedfleet：「She receives a new bridge structure that is a
#      prototype for the YAMATO-class then under design.」）→ 模型识别第一特征。
#   4. **锅炉 8 座**（1940 年大改装后）——但这与舰级文件冲突，必须知道：
#      combinedfleet 明写「She receives **eight** new oil-fired Kampon boilers」，
#      日文来源亦写「ロ号艦本式ボイラー　8基」，而 navypedia 的 1934-1940 栏把
#      「Haruna, **Hiei**: … 11 Kampon boilers」并写。**两说并列，本站不裁决**，
#      但**认定比叡属「8 座」组**（两源记 8、一源记 11，理由见 RESEARCH-NOTES §2.1）。
#      另注：11 座是她**練習戦艦时期**的锅炉数（36−25＝11，两源互证）——
#      两个 11 数字巧合相同、时点与含义完全不同，这是本舰最易被误读的一处。
#   5. 1940-01-31 大改装完成。副炮 14 门、12.7 cm 连装高角 **4 座 8 门**、
#      25 mm 连装 10 座 20 挺、13 mm 四连装 2 座 8 挺。**全生涯未再增装 25 mm**。
#   6. **雷达：未获取。** combinedfleet / navypedia 的逐舰雷达台账里都没有比叡
#      任何一条装设记录（navypedia 只给金刚与榛名），故不写"有"也不写"无"。
#
# 结局：1942-11-13 第三次所罗门海战（第一次夜战）被美巡洋舰炮火打坏舵机，
# 白天空袭中再被命中，当日 1530 阿部弘毅下令弃舰、西田正雄舰长开金斯顿阀自沉，
# 1900-0100 间沉于萨沃岛附近（09-04S, 159-45E）。阵亡 188、伤 151。
# **她是日本海军在太平洋战争中第一艘沉没的战列舰**（早于雾岛两天）。
# ============================================================================

id: hiei
name:
  zh: 比叡
  en: Hiei
  ja: 比叡（ひえい）
class: kongo
note: >-
  金刚型二番舰。横须贺海军工厂建造，1914-08-04 竣工，是日本第一艘国产超弩级战列舰。
  1929-1932 降格为練習戦艦，1940-01-31 大改装完成复归高速战列舰。
  1942-11-13 在瓜岛第一次夜战受重创后自沉。

open_ended_note: |
  本舰 1942-11-13 沉没，故所有 valid.to 为空且无终止事件的 fact，
  其实际终点都是 1942-11-13（部分记录记 11-14，因沉没发生在 13 日 1900 至
  14 日 0100 之间，见 construction.fate_date 的 note）。
  1942-12-20 从海军籍除籍（「BatDiv 11 is deactivated and HIEI is removed from
  the Navy List.」）。

