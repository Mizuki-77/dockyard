      11 Kampon boilers」并写，容易被当成二次改装后的值；但比叡的 11 座属于
      **練習戦艦期**，1940 年大改装后是 8 座（见下条）。榛名的 11 座才是
      二次改装后的 11 座。两者数字巧合相同、**时点与含义完全不同**。

