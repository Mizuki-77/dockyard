      ① navypedia 记「lost speed and **sunk by escort**」（被护航舰处置），
         与「自开阀门」不是同一表述；
      ② Tully 的专题文（combinedfleet atully03）讨论「自沉是否多余」，
         结论倾向「即使不自沉也会沉没」，并指出山本的电令到达太晚。
      → 直接致沉动作是自沉，但**战伤（炮火＋空袭）是根本原因**，两者不可割裂。

