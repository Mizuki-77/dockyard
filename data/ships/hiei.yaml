  - field: armament.mount.summary
    value: >-
      沈没时（1942-11-13）：35.6 cm 连装 4 座 8 门（**日产 41 年式/毘式**）／
      15.2 cm 单装 14 门／12.7 cm 八九式连装高角 **4 座 8 门**／
      25 mm 九六式连装 10 座 20 挺／13 mm 四连装 2 座 8 挺／鱼雷发射管全撤／
      雷达未获取。
    src: [japanese-warship-hiei, navypedia-kongo, combinedfleet-hiei,
          navweaps-36cm-45-t41]
    valid: { from: 1940-01-31, to: 1942-11-13 }
    confidence: B
    note: >-
      **本条含三件事，都不可省**：
      （一）**主炮型号与金刚不同**：35.6 cm 连装 4 座 8 门装的是
      **日产 41 年式（四一式，Model 1908）**，金刚装的是英造 43 年式（毘式）。
      **两者型号不可互换。**
      原文（navypedia as completed 装备栏）：「Kongo: 4 x 2 - 356/45 **43-shiki** …
      **others: 4 x 2 - 356/45 41-shiki**」——比叡属 others，即 41 年式；
      该分法在三个状态栏全部保留。
      原文（navweaps 命名沿革）：「Later, the guns built by **Vickers** were known
      as the 14-in Vickers Mark "A" and to the Japanese as the 14-in **43rd Year
      Type (Model 1910)**. Guns **manufactured in Japan** were known as 14-in
      **41st Year Type (Model 1908)**.」
      **一个必须提防的陷阱**：日文来源四页都把主炮写成「45口径**毘式**35.6cm
      連装砲」（毘式＝Vickers 式），比叡页也这么写——**日文这一层不能用来区分
      四舰**，区分只能靠 navypedia 的 43-shiki/41-shiki 与 navweaps 的沿革。
      比叡的炮为国产（吴工厂/日本制钢所），番号仍沿用「毘式」是型式名。
      （二）**1940 年大改装后的完整兵装状态**（日文来源 1940 年栏整栏）：
      「主砲 45口径毘式35.6cm連装砲 4基8門／副砲・備砲 50口径15.2cm単装砲
      14基14門、40口径12.7cm連装砲 4基8門／機銃 25mm連装機銃 10基20挺、
      13mm四連装機銃 2基8挺」。
      **12.7 cm 只有 4 座**——这是本舰与金刚/榛名最易混的一处：
      金刚与榛名在 1944 年各加 2 座（→6 座 12 门），
      而比叡 1942-11 就战没了，从未获得这两次增装。
      **25 mm 20 挺全生涯未增装**（combinedfleet 比叡 TROM 从 1940-01-31 到
      1942-11-13 没有任何 25 mm 增装记载）。
      （三）**练习战舰期（1933-01-01～1940-01-31）的兵装状态，四舰独有**：
      35.6 cm 连装 **3 座 6 门**（4 号炮塔已拆，原址加 500 t 压载）／
      15.2 cm 单装 16 门／8 cm 单装高角 4 门／25 mm 连装 10 座 20 挺＋
      13 mm 四连装 1 座 4 挺／鱼雷发射管全撤（比另三舰早）／舷侧装甲拆除／
      速力 18 kn、标准排水量 19,500 t（6.3 m 吃水）。
      该段三源各记一部分，且**有两处直接冲突**：
      ① **4 号炮塔**：navypedia「- 1 x 2 - 356/45 (No4)」；日文来源「主砲
         45口径毘式35.6cm連装砲　**3基6門**」；combinedfleet「Her aft 14-inch
         turret … removed」。三源一致（3 座 6 门）。
      ② **15.2 cm 副炮**：combinedfleet 记「**all of** her 6-inch guns are
         removed」；日文来源 1932 年栏仍写「50口径15.2cm単装砲　**16門**」；
         navypedia 装备栏亦仍列「16 x 1 - 152/50」。
         → **两说相反，并列不裁决**。
      ③ **13 mm**：日文来源 1932 年栏「13mm四連装機銃　1基4挺」，
         1940 年栏变「2基8挺」；本站无 13 mm 字段，只在此保留原文。

