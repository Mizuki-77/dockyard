  # ============================================================ 武备概览
  - field: armament.mount.summary
    value: >-
      12 × 6 in/50 BL Mk XXIII（4 座三联，Mark XXII 炮座，A/B/X/Y）
      + 8 × 4 in/45 QF Mk XVI（4 座双联 Mark XIX 两用炮座）
