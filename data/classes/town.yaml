  # ============================================================ 排水量
  # ⚠️ navypedia 的表头写 t，但数值 9,100 / 11,350 恰是皇家海军的长吨口径
  #    （9,100 lt = 9,246 t）。这是口径陷阱，故两条都标 comparable: false。
  - field: displacement.standard
    value: 9100
    unit: t
    src: [navypedia-town]
    valid: { from: 1937-03-06 }
    confidence: C
    comparable: false
    note: >
      **口径陷阱，不要直接与公吨口径的舰对比。** navypedia 表头写
      「Displacement standard, t 9100」，但皇家海军的设计值是 9,100 长吨，
      折 9,246 公吨。navypedia 只改了表头没换算，故本值实为长吨数。
      按规矩不擅自换算（换算后就成了我算的数，不是来源的数），
      整条标 comparable: false。

  - field: displacement.full
    value: 11350
    unit: t
    src: [navypedia-town]
    valid: { from: 1937-03-06 }
    confidence: C
    comparable: false
    note: >
      同上，11,350 为长吨口径的深载/满载值。navypedia 同格注「later 12190」，
