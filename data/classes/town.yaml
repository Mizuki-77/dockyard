    note: >
      建成时（设计状态）的基准配置，逐舰逐年改装见 data/ships/ 与 slices/。
      两处必须留意：

      一、**主炮是 Mk XXIII 炮身，但炮座是 Mark XXII**。navweaps 的装舰表
      把 Southampton（4 座）与 Gloucester（4 座）都记作 Mark XXII 炮座，
