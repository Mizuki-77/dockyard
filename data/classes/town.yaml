# ============================================================================
# 舰级：Town class（城级轻巡洋舰，含 Southampton / Gloucester / Edinburgh 三个子级）
# ----------------------------------------------------------------------------
# 本轮只入库 Sheffield（属 Southampton 子级）。**城级是通称，不是一个设计**：
#   Southampton 子级 5 艘：Southampton / Newcastle / Sheffield / Glasgow / Birmingham
#   Gloucester  子级 3 艘：Gloucester / Liverpool / Manchester（炮塔装甲加厚到 102 mm）
#   Edinburgh   子级 2 艘：Edinburgh / Belfast（舰体放大、6 座双联 4 英寸）
# 三个子级的排水量 / 主尺度 / 装甲 / 副炮数量都不同，本文件只登记 **Southampton
# 子级（即 Sheffield 所在那一批）** 的设计值，另两个子级的差异写在 note 里作参照，
# 不写入 fact —— 否则同一字段会同时背上三个子级互斥的数。
#
# 【这一级为什么长成这样】
# 1930 年伦敦海军条约把巡洋舰主炮上限定在 6 英寸，日本最上级却装了 15 门 155 mm。
# 英国的对策是：6 英寸炮改三联装、把炮塔数拉到 4 座（12 门），以此在条约框架内
# 追平舷侧投射量。三联装炮座（Mark XXII）本身自动化程度比前代高，
# 但代价是炮塔装甲只剩 25 mm —— 这是本级最被诟病的一处不均衡。
#
# 【哪些数据没查到 —— 必须如实留着】
#   装甲总重、装甲占比、重量分配表、型深、方形系数、水线面积、干舷数值、
#   锅炉蒸汽压力/温度、发电机功率、螺旋桨直径、舵面积、造价、
#   标准排水量状态的「平均吃水」（navypedia 只给深载吃水）。
#   「装甲总重与占比」是最大空洞：整级一个数都没有，不要用别级的值填充。
#
# 调研底稿：work/staging/g2-sheffield/RESEARCH-NOTES.md
# ============================================================================

id: town
name:
  zh: 城级轻巡洋舰（Southampton 子级）
  en: Town-class light cruiser
class_of: [sheffield]

note: |
  舰级 id 用 town（通称），但本文件只登记 Southampton 子级的设计值。
  三个子级的差异（引自 navypedia 各分页）：

    Southampton 子级（5 艘）：标准 9,100 t / 宽 18.8 m / 主炮塔 25 mm /
      4 座双联 102 mm；本文件即此组。
    Gloucester 子级（3 艘）：标准 9,400 t / 宽 19.0 m / 炮塔正面 102 mm、
      顶 51 mm / 甲板机枪段 51 mm / 4 座双联 102 mm。
    Edinburgh 子级（2 艘）：标准 10,550 t / 长 187.0 m oa / 宽 19.3 m /
      6 座双联 102 mm / 甲板 76–38 mm。

  这些数字**不写成本文件的 fact**：它们是另外两级的设计值，写进来会让
  「本级标准排水量」同时存在三个互斥答案。要看 M2 阶段建 class 文件。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

