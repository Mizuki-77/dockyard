    note: >
      navypedia 把三个子级分成三个独立分页（SOUTHAMPTON / GLOUCESTER /
      EDINBURGH light cruisers），英国海军内部与战后文献统称 Town class。
      本文件取 Southampton 子级的数据。

  - field: identity.name_note
    value: >
      「城级」是通称，来自该级各舰均以英国城市命名（Southampton、Sheffield、
      Glasgow、Edinburgh、Belfast 等）。三个子级分属三份不同的设计：
      Southampton（1937 年完工，5 艘）、Gloucester（1938-39，3 艘）、
      Edinburgh（1939，2 艘）。Sheffield 属第一组。
    src: [navypedia-town, navypedia-gloucester, navypedia-edinburgh]
    valid: { from: 1934-12-17 }
    confidence: C
    note: 三个子级的舰名归属按 navypedia 各分页的 Ships 表逐舰核对。

