# ============================================================================
# 舰级：Illustrious class（光辉级装甲航空母舰）
# ----------------------------------------------------------------------------
# 本级在皇家海军航母谱系里的位置很特殊：它是世界上第一级把「装甲飞行甲板
# 同时当作强度甲板」的设计，也是把「载机量」明确拿去换「抗弹能力」的第一级。
#
# 本级建成 4 艘：Illustrious / Formidable / Victorious / Indomitable。
# 但 Indomitable 是改型（加了一层 14 ft 矮机库），前三艘才是单层机库、三轴。
# 所以本文件的「本级」参数以前三艘为准，凡 Indomitable 不同的地方逐条注明。
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact → 舰级 fact → 未记载。
# 单舰命中即覆盖舰级，**不算分歧**。
#
# 本文件只写「这一级本来长什么样」——设计值、图纸值、1936 年参谋要求。
# 逐舰的建造日期、战损、雷达与防空改装节奏，写 data/ships/illustrious.yaml；
# 各时段的状态分组写 data/slices/illustrious.yaml。
#
# 数据口径提醒：本级的 1940 年状态与 1945 年状态差别很大（三次大改装），
# 凡「建成时」参数均以 1940-05 完工状态为准，改装后的值另立时间窗。
# ============================================================================

id: illustrious
name:
  zh: 光辉级航空母舰
  en: Illustrious-class aircraft carrier
class_of: [illustrious]

open_ended_note: >
  舰级设计参数的有效期到本级各舰退役（1953–1968）为止，多数条目不写 to。
  但请注意这些数字的「时间底色」：它们主要是 1936-07-08 参谋要求与 1940 年
  完工状态，不是「这艘船任何时刻的参数」。本级在 1941、1943、1944–46 年
  各做过一次大改装，排水量、载机量、防空配置、雷达都在变——
  那些变化写在单舰文件与状态切片里，不在本文件。

