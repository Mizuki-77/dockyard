      机制：把机库做成一个四面有装甲的盒子，盒顶即飞行甲板、同时充当强度甲板；
      盒壁 4.5 in C 装甲，盒底（机库甲板）3 in NC。不是 all-or-nothing，
      也不是传统的 incremental——装甲只包住机库这一段，首尾与非装甲区仍按
      普通船体结构处理。

