      476 mm——三者是三种记法，不是三种史料，故不并列成多条 fact。

  - field: protection.armor.material
    value: Class B（非渗碳均质镍钢）＋ STS 背板
    qual: { part: turret, region: face }
    src: [navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
    note: navweaps "17.0 in (43.2 cm) of Class B armor plate" / "2.5 in (6.4 cm) STS"。

  - field: protection.armor.thickness
    value: 241
    unit: mm
    qual: { part: turret, region: side }
    src: [navypedia-iowa, navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia 保护段 "241mm (on 19mm plating) sides"；navweaps "9.5 in (24.1 cm)
      Class A armor plates" 于 0.75 in (1.9 cm) STS 枪室侧板之上。
      navypedia 炮塔总表另作 260 mm（= 241 + 19 mm 背板），是同一处的含背板记法，
      故不并列成第二条。

  - field: protection.armor.material
    value: Class A（渗碳表面硬化钢）＋ STS 背板
    qual: { part: turret, region: side }
    src: [navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
    note: navweaps "9.5 in (24.1 cm) Class A armor plates" 覆于 0.75 in STS 侧板之上。

  - field: protection.armor.thickness
    value: 300
    unit: mm
    qual: { part: turret, region: rear }
    src: [navypedia-iowa, navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia 保护段 "300mm rears"；navweaps "The turret back was 0.75 in (1.9 cm)
      STS over which was 12.0 in (30.5 cm) of Class A armor plate"。
      **navypedia 炮塔总表另作 305 mm**（"305 rear"），与该站自己保护段的
      300 mm 及 navweaps 的 305 mm 各差 5 mm；305 是按英制 12 in 换算的取整，
      故本条记 300 mm，并在 note 里保留 305 mm 一说，不另立 fact。

  - field: protection.armor.thickness
    value: 184
    unit: mm
    qual: { part: turret, region: roof }
    src: [navypedia-iowa, navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
