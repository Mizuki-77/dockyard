# ============================================================================
# Iowa 级（Iowa class）舰级公共数据
# ----------------------------------------------------------------------------
# 这里只放 Iowa / Missouri（以及同级 New Jersey、Wisconsin）**共有**的
# 设计参数与武器/炮位实体。单舰的建造日期、编制、战历、改装与装甲差异
# 一律写在 work/staging/g-iowa/ships/<id>.yaml。
#
# 约定（照 data/classes/bismarck.yaml）：
#   about 缺省       -> 本文件主体（舰级本身）
#   about: weapon:x  -> 武器实体 x（weapon.* 字段）
#   about: mount:x   -> 炮位实体 x（mount.* 字段）
#
# 本轮三处必须记住的口径问题，逐条写进 note，不在正文里裁决：
#   1) 排水量：navypedia 的 "Displacement standard/full, t" 与英文文献
#      （DANFS 45,000 / MARAD 57,271）互不换算，本站按各自原文数值录入并
#      标明「口径未定」，不做长吨→公吨的推算。
#   2) 主炮是 16"/50 (40.6 cm) Mark 7，**不是** 16"/45 Mark 6（后者是
#      North Carolina / South Dakota 级的炮）。navweaps 原文明确
#      "16\"/50 (40.6 cm) Mark 7 ... Iowa (BB-61) and Montana (BB-67) Classes"。
#   3) 本舰级**不是**史上最大战列舰：NHHC 原文 "Although the Japanese
#      super-battleships Yamato and Musashi were heavier and had larger guns
#      (nine 18.1-inch)"。正文与 fact 里都不写「最大」。
# ============================================================================

id: iowa
name:
  zh: 衣阿华级
  en: Iowa class
class_of: [iowa, missouri]
note: |
  舰级层只登记四舰共有的设计值。凡 Iowa 与 Missouri 不同的项（建造厂、
  日期、编制、装甲横舱壁厚度、雷达配置、40 mm/20 mm 数量）一律不写在这里，
  由单舰文件覆盖或补写。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘退役或拆解为止，
  期间不因改装而改变（1980 年代现代化另有独立时间窗，见对应 fact）；
  实际战备状态随时间的变化写在 data/ships/<id>.yaml 的状态切片里，
  由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

facts:
  # ---------------------------------------------------------------- 身份
  - field: identity.name_original
    value: Iowa
    src: [navypedia-iowa, danfs-iowa-iii]
    valid: { from: 1938-06 }
    confidence: B
    note: 舰级名取首舰名。设计 1938 年 6 月定案。

  - field: identity.name_zh
    value: 衣阿华级
    src: [navypedia-iowa]
    valid: { from: 1938-06 }
    confidence: C
    note: 中文通行译名。另有「爱荷华级」写法，同指一级。

  - field: identity.name_en
    value: Iowa class
    src: [navypedia-iowa, danfs-iowa-iii]
    valid: { from: 1938-06 }
    confidence: B

  - field: identity.ship_type
    value: battleship
    src: [navypedia-iowa, danfs-iowa-iii]
    valid: { from: 1938-06 }
    confidence: A
    note: 两源一致（DANFS 归类为 battleship，navypedia 归入 "CAPITAL SHIPS AND MONITORS — IOWA battleships"）。

  - field: identity.nation
    value: united_states
    src: [navypedia-iowa]
    valid: { from: 1938-06 }
    confidence: A

  - field: identity.operator
    value: United States Navy（美国海军）
    src: [navypedia-iowa, danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: >-
      按该级作为一级舰的定位取 ww2（首舰 1943-02 服役，四舰全部赶在二战内
      建成）。四舰均续用到 1990 年代初，1984-1992 的复役期属 cold_war 语境，
      该段状态另由单舰 fact 的时间窗表达，不改本条。

  - field: identity.building_program
    value: >-
      FY1940 造舰计划（BB-61/62 于 1939 年订货；1939-07 决定建造 BB-63/64，
      同为 FY1940；BB-65/66 于 1939-09 批准）
    src: [navypedia-iowa]
    valid: { from: 1939 }
    confidence: C
    note: >-
      navypedia 原文："next year the order for ВВ61 and ВВ62 under the FY1940
      programme was given out. In July, 1939 the decision about building of
      ВВ63 and ВВ64 (FY1940) followed, and in September, 1939 building of
      ВВ65 and ВВ66 was approved."（原文用西里尔字母 В 代 B，系该站俄文底稿
      替换错误，按 BB 读。）

  # ------------------------------------------------------------ 排水量
  # 口径警告：本节两个来源各自没有把「长吨/公吨」说清，本站不换算、只并列。
  - field: displacement.standard
    value: 48110
    unit: t
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "Data variant: as commissioned | Displacement standard, t | 48110"。
      **口径未定**：该站列名写 t，但英文文献同一组数字（48,110 / 57,540）
      惯以长吨计；本站按原文数值录入，不换算、不改写为公吨。

  - field: displacement.standard
    value: 45000
    unit: t
    src: [danfs-iowa-iii, danfs-missouri-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: >-
      DANFS 两舰词条均作 "(BB-61: dp. 45,000 t. ...)" / "(BB-63: displacement
      45,000 ...)"。这是设计标准排水量的通行记法（45,000 长吨量级），
      与 navypedia 的 48,110 不是同一口径，**两说并列，不裁决**。

  - field: displacement.full
    value: 57540
    unit: t
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "Displacement full, t | 57540"。口径同样未定（见 standard 条）。

  - field: displacement.full
    value: 57271
    unit: t
    src: [marad-vessel-iowa]
    valid: { from: 1945 }
    confidence: C
    note: >-
      MARAD 船舶史数据库 "Displacement, Summer | 57271.00 tons"。这是美方
      政府数据库的夏季满载口径，与 navypedia 的 57,540 相差 269，属口径/状态
      差异，两条并列。原文单位为 "tons"，未注明长吨或公吨。

  - field: displacement.empty
    value: 45231
    unit: t
    src: [marad-vessel-iowa]
    valid: { from: 1945 }
    confidence: C
    note: >-
      MARAD "Displacement, Lightweight | 45231.00 tons"，即轻载/空船排水量。
      与「标准排水量」不是同一口径，故不并入 displacement.standard。

  - field: displacement.standard
    value: 50453
    unit: t
    src: [navypedia-iowa]
    valid: { from: 1984 }
    confidence: C
    note: >-
      navypedia "Data variant: 1982-1988 modernization | Displacement standard, t |
      50453"。1980 年代复役改装（战斧/鱼叉/密集阵）后的标准排水量。

  - field: displacement.full
    value: 59065
    unit: t
    src: [navypedia-iowa]
    valid: { from: 1984 }
    confidence: C
    note: navypedia 同一 variant 列的满载值 59,065 t。

  # ---------------------------------------------------------------- 主尺度
  - field: dimensions.length.oa
    value: 270.4
    unit: m
    src: [navypedia-iowa, danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: >-
      navypedia "Length, m | 262,1 wl 270.4 oa"；DANFS "l. 887'3\"" = 270.44 m。
      两源在 0.04 m 内一致，取 270.4。

  - field: dimensions.length.wl
    value: 262.1
    unit: m
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: navypedia "262,1 wl"。

  - field: dimensions.beam.wl
    value: 33.0
    unit: m
    src: [navypedia-iowa, danfs-missouri-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: >-
      navypedia "Breadth, m | 33.0"（未区分水线宽/最大宽，故只记这一条，
      不另造 beam.max）；DANFS "b. 108'2\"" = 32.97 m。
      33.0 m 是巴拿马运河船闸宽度限制下的设计上限。

  - field: dimensions.draught.mean
    value: 11.0
    unit: m
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 'navypedia "Draught, m | 11.0 full load"，明确标注为满载吃水。'

  - field: dimensions.draught.mean
    value: 11.51
    unit: m
    src: [danfs-iowa-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: >-
      DANFS Iowa 词条 "dr. 37'9\"" = 11.51 m。与 navypedia 的 11.0 m 相差
      0.5 m，DANFS 未注明对应哪个排水量状态，**两说并列，不裁决**。

  # ---------------------------------------------------------------- 动力
  - field: propulsion.plant_type
    value: steam_turbine
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: B
    note: 'navypedia "Machinery | 4 sets General Electric geared steam turbines, 8 Babcock & Wilcox boilers"。'

  - field: propulsion.shafts
    value: 4
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: B
    note: navypedia "No of shafts | 4"。

  - field: propulsion.boiler.count
    value: 8
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: B
    note: navypedia "8 Babcock & Wilcox boilers"。四轴四组汽轮机对应八座锅炉。

  - field: propulsion.boiler.type
    value: Babcock & Wilcox 水管锅炉（重油专烧）
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia 只写厂名 "Babcock & Wilcox boilers"，未给型号代号；
      「水管锅炉 / 重油专烧」为 M 型（M-type）美海军标准锅炉的通行描述，
      本条按来源仅记厂名与型式，不补型号编号。

  - field: propulsion.turbine.count
    value: 4
    unit: count
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: B
    note: 'navypedia "4 sets General Electric geared steam turbines"。'

  - field: propulsion.turbine.type
    value: General Electric 齿轮传动汽轮机（4 组）
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: B
    note: navypedia 原文同上。齿轮传动（geared）即减速齿轮箱与螺旋桨轴之间非直联。

  - field: propulsion.power.design
    value: 212000
    unit: hp
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "Power, h. p. | 212000"。该站未注明是设计值还是试航值，
      按上下文（Data variant: as commissioned 的设计栏）记作设计功率。

  - field: propulsion.speed.design
    value: 32.5
    unit: kn
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 'navypedia "Max speed, kts | 32.5"，标注为 Max speed。'

  - field: propulsion.speed.design
    value: 33
    unit: kn
    src: [danfs-iowa-iii, danfs-missouri-iii]
    valid: { from: 1943-02-22 }
    confidence: B
    note: >-
      DANFS 两舰词条均作 "s. 33 k." / "speed 33 knots"。与 navypedia 的 32.5 kn
      相差 0.5 kn，**两说并列，不裁决**（很可能是取整与试航实测之别）。

  - field: propulsion.fuel.capacity
    value: 7621
    unit: t
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "Fuel, t | oil 7621"。原文单位写 t，未注明长吨或公吨；
      同页排水量亦存在同一口径问题（见 displacement 各条）。

  - field: propulsion.fuel.type
    value: 重油（fuel oil）
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: B
    note: navypedia 燃料栏写作 "oil"。

  - field: propulsion.range.max
    value: 15000
    unit: nmi
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 'navypedia "Endurance, nm(kts) | 15000 (15)"，即 15 节下 15,000 海里。'

  - field: propulsion.range.at_speed
    value: 15
    unit: kn
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 与上一条续航力成对，原文 "(15)" 即该续航对应的航速。

  # ---------------------------------------------------------------- 装甲
  - field: protection.scheme
    value: all_or_nothing
    src: [navypedia-iowa, navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      两源均未直接使用 "all-or-nothing" 一词，但所述构造符合该体系：
      navypedia 给出 141.4 m 长的内装甲带（19° 倾斜、307 mm）、
      与装甲带上缘相接的平甲板 178–152 mm、以及装甲堡之外的薄结构甲板；
      navweaps 记炮塔为 Class A / Class B 表面硬化与非渗碳钢 + STS 背板。
      本条为体系归类，置信度按 C 记。

  - field: protection.armor.thickness
    value: 307
    unit: mm
    qual: { part: belt, region: main }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "(BB61, 62) ... 141.4m inner belt, inclined at 19° to vertical,
      had 3.2m height and was 307mm thick (on 51mm cement layer and 22mm plating)"。
      307 mm 为装甲板本身，不含 51 mm 水泥衬层与 22 mm 船体板。

  - field: protection.armor.angle
    value: 19
    unit: deg
    qual: { part: belt, region: main }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 'navypedia "inclined at 19° to vertical"，即相对垂直面内倾 19°。'

  - field: protection.armor.thickness
    value: 38
    unit: mm
    qual: { part: upper_belt, region: main }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "This belt was covered by vertical 38mm outer belt"，
      即主装甲带外侧的垂直 38 mm 外板（剥被帽层）。

  - field: protection.armor.thickness
    value: 307
    unit: mm
    qual: { part: lower_belt, region: upper }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "19°inclined 8.5m in height lower belt ... tapered from 307mm at
      upper edge to 41mm at lower edge"，本条记上缘值，下缘 41 mm 见下一条。

  - field: protection.armor.thickness
    value: 41
    unit: mm
    qual: { part: lower_belt, region: lower }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 同句下半段 "to 41mm at lower edge"。

  - field: protection.armor.angle
    value: 19
    unit: deg
    qual: { part: belt, region: lower }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "19°inclined 8.5m in height lower belt"，即下装甲带同样内倾 19°。
      本字段的 part 枚举不含 lower_belt，故用 part: belt + region: lower 表达。

  - field: protection.armor.thickness
    value: 178
    unit: mm
    qual: { part: deck, region: main }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "Flat main armour deck was connected with upper edge of belt and
      was 178 (near sides)-152mm (near center line) over citadel"。
      本条记舷侧一侧的 178 mm；向中线减薄至 152 mm，同句原文并存，
      因同一时间窗同一限定词只能有一条 fact，故写入本 note 而不另立条目。

  - field: protection.armor.thickness
    value: 38
    unit: mm
    qual: { part: deck, region: upper }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 'navypedia "One level higher there was 38mm upper deck"。'

  - field: protection.armor.thickness
    value: 16
    unit: mm
    qual: { part: deck, region: splinter }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "One level lower there was flat 16mm (25mm over magazines)
      splinter deck. This deck extended aft from No3 barbette and was 157-142mm
      over steering gear belt"。本条记一般部位的 16 mm；弹药库上方 25 mm
      见下一条。

  - field: protection.armor.thickness
    value: 25
    unit: mm
    qual: { part: magazine, region: roof }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia 同句 "(25mm over magazines)"。qual 的 part 取 allowed 值
      magazine、region 取 roof（弹库顶部的防破片甲板）。

  - field: protection.armor.thickness
    value: 343
    unit: mm
    qual: { part: belt, region: aft }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navypedia "Steering gear compartment had 343mm 19°inclined belt and 287mm
      bulkhead expanded up to lower (splinter) deck"，即舵机舱两侧的 343 mm
      19° 倾斜装甲带。

  - field: protection.armor.thickness
    value: 287
    unit: mm
    qual: { part: bulkhead, region: aft }
    src: [navypedia-iowa]
    valid: { from: 1943-02-22 }
    confidence: C
    note: 同句 287 mm 舵机舱横隔壁。注意与首部横隔壁的 287/368 mm 不是同一处。

  - field: protection.armor.thickness
    value: 432
    unit: mm
    qual: { part: turret, region: face }
    src: [navypedia-iowa, navweaps-16in-50-mk7]
    valid: { from: 1943-02-22 }
    confidence: C
    note: >-
      navweaps "The turret face ... was made up of 2.5 in (6.4 cm) STS steel over
      which was 17.0 in (43.2 cm) of Class B armor plate, equivalent to a single
      plate 18.75 in (47.6 cm) thick"；navypedia 保护段作 "432mm (on 63mm plating)"。
      两源一致，本条记装甲板本身 432 mm。**同一处另有两种记法**：navypedia
