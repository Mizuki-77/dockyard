  # ============================================================ 武备概览
  - field: armament.mount.summary
    value: >-
      6 × 4.7 in/45 QF Mk XII（3 座双联 CPXIX，A、B 前置、X 后置）
      + 1 × 4 in/45 QF Mk V 高平两用炮（单装，原后部鱼雷管位置）
      + 4 × 40 mm 2-pdr「pom-pom」（1 座四联）
      + 4 × 20 mm 厄利孔（单装）
      + 2 × 四联 0.5 in 维克斯机枪（后甲板）
      + 1 × 五联 21 in 鱼雷发射管
    src: [navypedia-piorun, navypedia-jkn, navweaps-4-7in-45-mk9]
    valid: { from: 1940-11-04 }
    confidence: C
    note: >
      建成时（1940-11）的配置，也是本级 N 级的**建成标准态**，不是改装结果。

      **三处必须说清：**

      一、主炮只有 6 门。N 级是 3 座双联，不是部族级的 4 座双联 8 门。
      navweaps 在 CPXIX 双联装座一栏明确列 "Abdiel (3), Tribal (4), J (3), K (3)
      and N (3): CPXIX" —— 括注就是座数。

      二、鱼雷管只有 1 座五联 5 管。J/K 级设计是 2 座五联 10 管，
      N 级在建造期间就把后部那一座拆掉换了 4 英寸高炮。
      所以本级不存在「建成时 10 管」的阶段。

      三、设计图纸上的 2 座四联 0.5 英寸机枪**没有装在舰桥两翼**，
      而是改到后甲板；舰桥两翼换成了 20 mm 厄利孔。

      本级的具体改装沿革（1942 年换回第二座鱼雷管等）写在单舰文件里。

  - field: armament.torpedo.tubes
    value: 5
    unit: count
    src: [navypedia-piorun, navypedia-jkn]
    valid: { from: 1940-11-04 }
    confidence: C
    note: >
      1 座五联装，5 管。**不是 10 管。** 设计值 2 座 × 5 管 = 10 管在建造期间
      即改为 1 座，用于换装 4 英寸高炮。1942 年本级多数舰又装回第二座五联，
      恢复到 10 管——但那已经是改装后的状态，见单舰切片。

  - field: armament.torpedo.diameter
