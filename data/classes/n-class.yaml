    confidence: A
    note: >
      **两锅炉舱并排布置，就是本级「一根烟囱 + 低矮舯部」这条外形来源。**
      这是皇家海军驱逐舰设计上的一次刻意倒退：从 F 级起一直是三锅炉舱，
