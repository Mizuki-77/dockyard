  # ============================================================ 防护
  # 2026-11-22 主会话补：原分片在这个字段上留空，理由是「枚举里没有『无装甲』
  # 选项，硬填会误导」。那个顾虑是对的，但解法是加枚举值而不是留空 ——
  # 已往 data/fields.yaml 的 protection.scheme 加了 none。
  # 留空在页面上显示「未记载」，读者会以为没查完；而这艘舰是真的没有装甲。
  # 不写 protection.armor.thickness：那会让「没有装甲」变成「装甲厚度 0」。
  - field: protection.scheme
    value: none
    src: [navypedia-jkn]
    valid: { from: 1940-11-04 }
    confidence: C
    note: >
      N 级（含 J/K 级）是 1930 年代英国标准驱逐舰，**设计上就没有装甲带**，
      只有船壳与局部防破片隔板。navypedia 的 armor 栏对本级为空白。
      这里写 none 而不是留空，是为了区分「确认无装甲」与「未查到」——
      本站对这两件事用不同的值表达，页面上也不一样。
      这条 confidence 只到 C：它是「D 级来源没有记载装甲」这个事实，
      不是从一手设计书里读到的「无装甲」明确陈述。

