# ============================================================================
# 舰级：N class（N 级驱逐舰）
# ----------------------------------------------------------------------------
# 本站新登记舰级。同级八舰：Napier（RAN）/ Nizam（RAN）/ Nestor（RAN）/
# Norman（RAN）/ Nepal（ex-Norseman，RAN）/ Noble（→荷兰 Van Galen）/
# Nonpareil（→荷兰 Tjerk Hiddes）/ Nerissa（→波兰 Piorun）。
#
# 本站目前只入库其中一艘：ORP Piorun（原 HMS Nerissa，舷号 G65）。
# N 级本身是「J/K 级的第三次重复」——不是新设计，而是 1939 年应急追加的一批，
# 目的是在 L/M 级因主炮塔供应延误而拖期时保住驱逐舰数量。
#
# 【本级最容易写错的一件事：主炮是 3 座双联，不是 4 座双联】
#   J/K/N 三级一律 3 座双联 4.7 英寸（6 门），布置为 A、B 在前（B 为超越射击），
#   X 在后。部族级才是 4 座双联（8 门）。
#   N 级相对 J/K 的唯一设计改动是把 X 炮位的 20° 射击盲区从正后方改到正前方——
#   这个改动正是「N 级与 J/K 级不是同一批」的判据。
#
# 【本级最容易被漏掉的一件事：建成时的鱼雷管只有 1 座五联，不是 2 座】
#   J/K 级设计是 2 座五联（10 管）。N 级在**建造期间**就按 1940 年的战时改装
#   改掉了：拆掉后部鱼雷管，换成 1 门 4 英寸 QF Mk V 高平两用炮；
#   舰桥两翼的四联 0.5 英寸机枪也换成了 20 mm 厄利孔。
#   所以 N 级「建成即改装完毕」，没有「原始 10 管状态」这一段历史。
#
# 调研底稿：work/staging/g6-piorun/RESEARCH-NOTES.md
# ============================================================================

id: n-class
name:
  zh: N 级驱逐舰
  en: N class destroyer
class_of: [piorun]
open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: N class
    src: [navypedia-jkn]
    valid: { from: 1939-04-15 }
    confidence: C
    note: >
      级名按英国驱逐舰字母序列取 "N"。本级八舰全部以 N 开头命名
      （Napier / Nizam / Nestor / Norman / Nepal / Noble / Nonpareil / Nerissa）。
      本级用驱逐舰通行的字母序命名法，八舰同批同字母，故级名直接取字母。

  - field: identity.ship_type
    value: destroyer
    src: [navypedia-jkn]
    valid: { from: 1939-04-15 }
    confidence: C
    note: >
      英国官方分类 "fleet destroyer"。本级无专门的 flotilla leader 加大舰体，
      Napier 作为领舰与其余七舰同尺度，只是编制人数较多（218 对 183）。

  - field: identity.nation
    value: united_kingdom
    src: [navypedia-jkn]
    valid: { from: 1939-04-15 }
    confidence: A
    note: >
      舰级本身登记为英国。N 级是皇家海军 1939 年造舰计划的一批，
      八舰由英国政府出资、英国船厂建造、产权属英国政府。
      其中 Nerissa 自 1940-10 起借给波兰海军并改名 Piorun，
      该舰的单舰文件把 nation 按时间窗覆盖为 poland（借调期）。
      两处不矛盾：舰级记设计归属，单舰记实际服役国籍。

  - field: identity.operator
    value: Royal Navy
    src: [navypedia-jkn]
    valid: { from: 1939-04-15 }
    confidence: A
    note: >
      八舰建成后分属皇家海军（Noble / Nonpareil 建成即转荷兰）、
      澳大利亚皇家海军（Napier / Nizam / Nestor / Norman / Nepal）与波兰海军（Piorun）。
      荷兰、澳大利亚两处转交都不改变产权归属英国政府这一事实。

  - field: identity.era
    value: ww2
    src: [navypedia-jkn]
    valid: { from: 1939-09-03, to: 1945-09-02 }
    confidence: A
    note: >
      按服役与作战期定位在 ww2。本级设计定案于 1939-04，全部八舰在 1940-1942 年间建成。

  - field: identity.building_program
    value: 1939 年造舰计划（1939-04-15 下订 8 艘），J/K 级设计的第三次重复
    src: [navypedia-jkn]
    valid: { from: 1939-04-15 }
    confidence: C
    note: >
      **这一级存在的理由不是技术进步，是排期。** 1937 与 1939 年度计划里的
      L/M 级因主炮塔供应跟不上而普遍拖期，海军部于是回头追加一批已经成熟的
      J/K 级设计，用「不需要新炮塔」换取「能在战争爆发前完工」。
      navypedia 的原话是：most of "N" class of 1939 Programme were completed
      earlier than ships of "L" and "M" classes —— 结果证明这个判断是对的。
      本级首舰 Napier 1940-12 建成，而 L 级首舰 1941 年才陆续完工。

