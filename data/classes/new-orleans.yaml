  # ============================================================ 防护
  - field: protection.scheme
    value: incremental
    src: [navypedia-neworleans]
    valid: { from: 1934-02-15 }
    confidence: C
    note: >-
      **属归纳判定，不是来源原话。** 依据 navypedia 的防护段：舷侧主带只覆盖机舱段
      （127 mm，下缘 76 mm），弹药库段另设较窄的 102 mm 带；
      甲板 57 mm 只铺在主带上方，弹药库段另在 1st platform deck 单铺一层，
      主带之前的首部削到 32 mm。这是「要害局部加厚 + 其余靠分舱」的叠加式
      防护，不是把全舰分成「装甲区/非装甲区」的 all-or-nothing。
      与同级 CA37/38、CA39/44 的差别只在炮座厚度与主炮，方案本身相同。

