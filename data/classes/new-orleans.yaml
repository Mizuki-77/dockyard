    from: 1934-02-15
  confidence: C
  note: '**属归类判定，不是来源原话。** 本级不是 all-or-nothing：装甲带只覆盖动力舱段， 弹药库用独立的窄装甲带+前后 37 mm 舱壁围成盒子，舰体首尾无舷侧装甲， 主装甲甲板为单层 57 mm（弹药库段在 1 层平台、动力舱段在 2 层甲板， 不在同一水平面）。这正是「逐段防护」的定义特征。 pwencycl 给免疫区「12,000 to 24,000 yards against
    8" gunfire」， 可佐证这套分段设计对 8 英寸弹成立；navypedia 则给 「immune zone under fire of 203mm guns at a relative 60° bearing laid in a band between 60 and 120 cables」（= 12,000–24,000 码），两源吻合。

    '
