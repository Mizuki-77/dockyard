  valid:
    from: 1929
  confidence: C
  note: '美国海军官方分类是「heavy cruiser (CA)」，级别名随命名舰 New Orleans 而定。 historyofwar 原文另记一层：本级「was also sometimes known as the Astoria class, as she was the first of the class to have been laid down. The New Orleans
