# ============================================================================
# 新奥尔良级重巡洋舰（New Orleans class）—— CA-32 / 34 / 36 这一批
#
# 2026-11-23 建：为中途岛 TG 17.2 入库。本级共 7 艘，但内部不是铁板一块，
# navypedia 把装甲与主炮按三组分开写，本文件只登记 **CA-32 / CA-34 / CA-36**
# 这一组（FY1929 计划、海军船厂建造的三艘）：
#   CA32 New Orleans、CA34 Astoria、CA36 Minneapolis
# 另两组（CA37/38 Tuscaloosa & San Francisco、CA39/44 Quincy & Vincennes）的
# 炮座、炮塔与主炮型号都不同，**不能拿本文件的值去填那四艘**。
#
# 【本级和波特兰级最容易被搞混的地方 —— 主炮炮座不是一种东西】
#   新奥尔良级 CA32/34/36 用的是 navweaps 所称的 "triple turret"（294 tons，
#   有旋转炮座 stalk）；波特兰级 CA33 用的是老式的 "triple mount"
#   （247-250 tons，炮位下方直接是操作室，没有旋转 stalk）。
#   两者炮管同为 8"/55，但炮座不是同一型，重量差 45 吨。
#
# 【本级最容易被写错的一件事：主炮型号】
#   建成时是 8"/55 (20.3 cm) Mark 9 系列。Mark 13 是 Mark 9 的换衬里版，
#   Mark 14 是「全镀铬膛 + 小药室」的再换衬里版，navweaps 明说
#   "The Mark 14 was used for most regunnings during World War II"——
#   即 Mk 14 是**战时换装**的产物，不是建成状态。中途岛（1942-06）时
#   Astoria 装的仍是 Mk 9 系列，不是 Mk 14。
#
# 【没查到的项，如实留着】
#   装甲总重（只在 navypedia 找到「protection weight made 15% of standard
#   displacement」这个比例，没有吨数——比例记 fact，吨数不推算）、
#   水下防护纵深、锅炉蒸汽压力/温度、发电机功率、螺旋桨直径、造价、
#   试航实测功率与航速、各舰主机制造厂。
#
# 调研底稿：work/staging/tg172/RESEARCH-NOTES.md
# ============================================================================

id: new-orleans
name:
  zh: 新奥尔良级重巡洋舰（CA-32/34/36 组）
  en: New Orleans-class heavy cruiser (CA-32/34/36 group)
class_of: [astoria]
note: |
  本级 7 艘分三组建造，本文件只登记 CA-32 / CA-34 / CA-36 这一组的设计值。
  另两组的关键差异（引自 navypedia 同级页原文）：
    CA37、CA38（Tuscaloosa、San Francisco）：炮座 152 mm、
      主炮为较新的 203/55 Mk 12/15、炮塔更紧凑；
    CA39、CA44（Quincy、Vincennes）：炮座 133 mm（为给 28 mm 高炮留
      排水量余量而减薄）、主炮 Mk 12/15。
  这些数字**不写成本文件的 fact**：它们是同级另两组的设计值，写进来会让
  「本级炮座厚度」同时存在三个互斥答案。要看那四艘时另建文件。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

