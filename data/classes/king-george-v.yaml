# ============================================================================
# 舰级：King George V class（英王乔治五世级战列舰）
# ----------------------------------------------------------------------------
# 同级建成 5 艘：King George V（41）/ Prince of Wales（53）/
# Duke of York（17，ex-Anson）/ Anson（79，ex-Jellicoe）/ Howe（32，ex-Beatty）。
# 本站目前只入库首舰 King George V 本体，本文件写足五舰共有的设计数据；
# 单舰的建造日期、实测值、编制、改装与损失写 data/ships/king-george-v.yaml。
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 单舰命中即覆盖舰级，不与舰级值构成分歧。
#
# 【这一级为什么长成 10 门 14 英寸】
# 1936-03 第二次伦敦海军条约把主力舰主炮上限定为 14 英寸、标准排水量
# 35,000 t。英国不愿启动 16 英寸升级条款（会拖 18 个月工期），于是只能在
# 条约框里凑火力：初版是 3 座四联（12 门），但 35,000 t 装不下 12 门炮 +
# 想要的防护，最终 B 炮塔降为双联，变成 2 座四联（A/Y）+ 1 座双联（B）。
# 十门 14 英寸的舷侧投射量仍优于九门 15 英寸，这是四联装方案保留下来的
# 根本算术；代价是四联炮塔的机械复杂度（3,000+ 活动件）在战时暴露为可靠性
# 问题——这条争议在单舰文件与叙事里并列保留，本文件不裁决。
#
# 【两个口径提醒】
# 1) 主带厚度：英国按「每平方英尺 40 磅 = 1 英寸」的重量法标板厚。
#    navypedia 的 381 / 356 mm 是重量口径，名义厚度是 373 / 349 mm
#    （后者只见于维基级页转引，E 层，未采信为 fact）。两者不是分歧。
# 2) 排水量：36,727 t 是设计标准排水量；38,031 t 是 RMG 据 1940 年
#    实际状态给的标准排水量。相差约 1,300 t 是建成后增重，不是两种说法。
# ============================================================================

id: king-george-v
name:
  zh: 英王乔治五世级战列舰
  en: King George V-class battleship
class_of: [king-george-v]
open_ended_note: >
  本文件多数 fact 的 valid.to 留空，是结构性的，不是漏填：舰级设计参数的
  生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，期间不因改装而
  改变；随时间的实际状态变化写在单舰文件的切片里，由单舰 fact 覆盖。
  因此这里的开放时间窗表示「无已知终止事件」，逐条写 note 只会是同一句
  话复制上百遍。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: King George V class
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1936-07-29 }
    confidence: A
    note: >
      级名取自首舰舰名。五舰：King George V / Prince of Wales /
      Duke of York（ex-Anson）/ Anson（ex-Jellicoe）/ Howe（ex-Beatty）。
      注意 navypedia 另有一级 1912 年的 King George V 战列舰，与本级无关。

  - field: identity.ship_type
    value: battleship
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1936-07-29 }
    confidence: A
    note: 英国官方分类为 battleship；建成时是世界上最后一级按条约限制设计的主力舰。

  - field: identity.nation
    value: united_kingdom
    src: [rmg-kgv-guide]
    valid: { from: 1936-07-29 }
    confidence: A

  - field: identity.operator
    value: Royal Navy
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01, to: 1945-09-02 }
    confidence: A
    note: >
      按服役期定位：五舰 1940-1942 年陆续服役，全部在二战期间作战；
      战后 1949-1950 年陆续转入预备役，1957-1958 年拆解。

  - field: identity.building_program
    value: 1936 年造舰计划（华盛顿/伦敦条约 35,000 t 与 14 英寸主炮限制下设计）
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1936-07-29 }
    confidence: B
    note: >
      RMG 原话「designed by the Admiralty in 1936 under the restrictions of
      the Washington Treaty」。设计在 1936 年定案，五舰分两批订购。

  # ============================================================ 主尺度
  - field: dimensions.length.oa
    value: 227.1
    unit: m
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A
    note: >
      RMG 原值 745 ft 0.13 in，另作 745 ft 1 in；两者差 2 cm 级，公制同为
      227.1 m，属英制取整口径，不构成分歧。

  - field: dimensions.length.wl
    value: 225.6
    unit: m
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B
    note: RMG 原值 740 ft 0.25 in（本报告换算 225.55 m）。其余来源未给水线长。

  - field: dimensions.length.pp
    value: 213.4
    unit: m
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A
    note: RMG 原值 700 ft 0.25 in；navypedia 同给 213.4 m。

  - field: dimensions.beam.max
    value: 34.2
    unit: m
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: A
    note: >
      RMG 原值 112 ft 4.25 in（本报告换算 34.24 m）。含防雷突出部/外板突出部；
      navypedia 的 31.4 与 wiki 级页的 31.5 都是水线宽，不是最大宽。

  - field: dimensions.beam.wl
    value: 31.5
    unit: m
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: RMG 原值 103 ft 2.56 in；navypedia 记 31.4 m，差 1 dm 级，疑为换算取整。

  - field: dimensions.draught.mean
    value: 8.84
    unit: m
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01, to: 1944-05-31 }
    confidence: B
    note: >
      1940 年标准状态平均吃水。RMG 原值 29 ft（mean）；
      navypedia 给 8.84 m（deep load 9.90 m 为平均值）。与排水量状态绑定解读。

  - field: dimensions.draught.max
    value: 9.9
    unit: m
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01, to: 1944-05-31 }
    confidence: B
    note: >
      1940 年深载平均吃水。RMG 原值 32 ft 6 in。
      另有 10.2 m（33 ft 7.5 in）之说，指战时超载后的实际吃水，
      wiki 级页给出但属 E 层，本表未采信为 fact，仅在此并列。

  - field: dimensions.depth.molded
    value: 15.6
    unit: m
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B
    note: RMG 原值 51 ft 1.31 in（本报告换算）。其余来源未给型深。

  # ============================================================ 排水量
  # 设计值与建成实测值分列：不是分歧，是不同状态。
  - field: displacement.standard
    value: 36727
    unit: t
    src: [navypedia-kgv]
    valid: { from: 1937-01-01, to: 1940-09-30 }
    confidence: B
    note: >
      设计标准排水量，navypedia 与 maritimequest/tynebuiltships 的 36,730 t
      同源（差 3 t 为换算）。条约口径的 35,000 t 是设计上限，实际设计已超。

  - field: displacement.standard
    value: 38031
    unit: t
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01, to: 1944-05-31 }
    confidence: A
    note: >
      RMG 记 1940 年标准排水量 38,031 t，比设计值多约 1,300 t，原因是建成后
      增设高炮、雷达与装甲补强。wiki 单舰页把同一数值称作 normal load，
      与 RMG 的 Standard 不同名——同名不同义，引用时须带口径。

  - field: displacement.full
    value: 42076
    unit: t
    src: [navypedia-kgv]
    valid: { from: 1937-01-01, to: 1940-09-30 }
    confidence: B
    note: 设计满载排水量；maritimequest/tyne 记 42,080 t，差 4 t 为换算。

  - field: displacement.deep
    value: 42237
    unit: t
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01, to: 1944-05-31 }
    confidence: A
    note: RMG 记 1940 年 deep load 42,237 t，与设计满载差 161 t。

  # 注：1945 年状态（39,100 t / 44,460 t）不写在舰级里。
  # 本级五舰的结局差异极大：Prince of Wales 1941-12 沉没、
  # King George V 活到 1957、Duke of York 1949 退役。
  # 把「1945 年状态」当全级通用会污染早已沉没的舰
  # （2026-11-22 排查发现：PoW 页面曾显示一条它沉没三年后才存在的排水量）。
  # 该数据已移到 data/ships/king-george-v.yaml。
    confidence: B
    note: >
      1945 年 deep load。kbismarck 的最终战参战表另给 44,400 mt，
      比此值低 60 t，疑为其自算的战时满载，并列不裁。
      空载与「最大排水量」两档：所有来源都不设，未获取，故不写 0。

  # ============================================================ 动力
  - field: propulsion.plant_type
    value: steam_turbine
    src: [navypedia-kgv, rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: propulsion.boiler.count
    value: 8
    unit: count
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: propulsion.boiler.type
    value: Admiralty 三鼓小管锅炉（带过热器）
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A
    note: >
      RMG 原话「8 x Admiralty 3-drum small-tube with superheaters」。
      八台锅炉在空间与燃油经济性上都优于胡德号的二十四台，是这一级
      动力舱设计的核心取舍。

  - field: propulsion.boiler.pressure
    value: 27.6
    unit: atm
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      RMG 原值「Working pressure (max): 400 lb/sq in」，本报告换算为 27.6 atm
      （400 psi ≈ 27.58 atm）。蒸汽温度：未获取，不填。

  - field: propulsion.turbine.count
    value: 4
    unit: count
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: propulsion.turbine.type
    value: Parsons 单级减速齿轮汽轮机
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A
    note: RMG 原话「4 x Parsons single-reduction geared, 4 shafts」。

  - field: propulsion.turbine.manufacturer
    value: Vickers-Armstrongs Ltd, Barrow
    src: [tyne-kgv]
    valid: { from: 1940-10-01 }
    confidence: C
    note: >-
      仅 tynebuiltships 给出主机承造厂（原话「Engines by Vickers-Armstrongs
      Ltd, Barrow」），孤证。

  - field: propulsion.power.design
    value: 110000
    unit: hp
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A
    note: >
      设计持续功率。另有试航 125,000 shp 一说，只见于 wiki 单舰页 infobox，
      疑为 overload 功率且未找到原始试航报告，E 层不采信为 fact，仅此并列。
      同一页正文的设计分档：标准排水量正常输出 28.5 kn、满载 27.5 kn；
      overload 时分别为 29.25 / 28.25 kn。

  - field: propulsion.speed.design
    value: 28
    unit: kn
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: propulsion.speed.trial
    value: 28.25
    unit: kn
    src: [tyne-kgv]
    valid: { from: 1941-01-01 }
    confidence: C
    note: >
      tynebuiltships 记 28.25 kn，与 wiki 单舰页「overload 28.25 kn at full
      load」数值吻合，疑为试航实测档。wiki 另记 28.0 kn（1941 trials），
      E 层未采信；两说并列不裁。

  - field: propulsion.shafts
    value: 4
    unit: count
    src: [rmg-kgv-guide, navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: propulsion.propeller.count
    value: 4
    unit: count
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: A

  - field: propulsion.propeller.diameter
    value: 4.42
    unit: m
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B
    note: RMG 原值 14.5 ft（= 14 ft 6 in），本报告换算 4.42 m。两种写法是同一个数。

  - field: propulsion.propeller.type
    value: 三叶锰青铜
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B

  - field: propulsion.fuel.capacity
    value: 3700
    unit: t
    src: [navypedia-kgv]
    valid: { from: 1940-10-01, to: 1941-12-31 }
    confidence: B
    note: >
      navypedia 记「3700 oil, later 4030」——后期增到 4,030 t，但**改装时点未获取**，
      故不另立一条带推断时间窗的 fact，只在此注明。
      另有 3,918 t（wiki 单舰页，E 层未采信）与 max 4,100 / avg 3,886
      （naval-history.net，未登记来源）两说，并列不裁。

  - field: propulsion.range.max
    value: 15600
    unit: nmi
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: C
    note: >
      navypedia 的 10 kn 档。明显高于其它来源，疑为理论极值/未扣储备。
      与 14,000 nmi 并列，见下条。

  - field: propulsion.range.at_speed
    value: 10
    unit: kn
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: C

  - field: propulsion.range.max
    value: 14000
    unit: nmi
    src: [maritimequest-kgv]
    valid: { from: 1940-10-01 }
    confidence: C
    note: >
      10 kn 档 14,000 nmi。另有 14,400 nmi（wiki 单舰页设计值）与
      5,400 nmi @18 kn（wiki infobox）两说，均属 E 层，未采信为 fact。
      实战反证：1941-05-27 追击俾斯麦后 KGV 因缺油几乎必须离场，
      纸面续航不可直接当作战半径用。

  - field: propulsion.range.at_speed
    value: 10
    unit: kn
    src: [maritimequest-kgv]
    valid: { from: 1940-10-01 }
    confidence: C

  # ============================================================ 防护
  - field: protection.scheme
    value: all_or_nothing
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      navypedia 原话「Here, as well as on Nelson, the principle "all or nothing"
      was used.」。主带无倾角，靠「深带」而不是「斜带」对付水中弹。

  - field: protection.armor.thickness
    value: 381
    unit: mm
    qual: { part: belt, region: main }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      弹药库段主带，重量口径（每平方英尺 40 磅 = 1 英寸）。名义厚度 373 mm
      只见于 wiki 级页转引，E 层未采信。带高 7.16 m、长 126.5 m，
      覆盖两端炮座之间的 citadel；上段高 4.62 m、下段 2.54 m。
      **同一带在机舱段为 356 mm（名义 349 mm）**——同一条带的不同舱段，
      不是两种说法，故只写一条、此处注明。下段自 381 mm 递减至 140 mm
      （弹药库段）/ 114 mm（机舱段）。kbismarck 的 348–374 mm 区间即由此派生。

  - field: protection.armor.angle
    value: 0
    unit: deg
    qual: { part: belt, region: main }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      navypedia 原话「The main belt placed without a declination」。
      0° 是真实的「无倾角」记载，不是未获取。

  - field: protection.armor.thickness
    value: 152
    unit: mm
    qual: { part: deck, region: main }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      citadel 内主装甲甲板（弹药库上方）。机舱上方降为 127 mm。
      wiki 级页的分层口径为 149 mm 非渗碳装甲 + 13 mm Ducol（共 232 mm
      含天甲板 32 mm），属 E 层转引，未采信为 fact，仅此并列。

  - field: protection.armor.thickness
    value: 127
    unit: mm
    qual: { part: deck, region: lower }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      citadel 外的下甲板 127–64 mm；尾部 114 mm（舵机上方 127 mm），
      由 102 mm 舱壁封闭。

  - field: protection.armor.thickness
    value: 324
    unit: mm
    qual: { part: turret, region: face }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: A
    note: >
      炮塔正面。相对同期战列舰偏薄，是「把重量让给弹药库防护」的取舍；
      该级炮塔低矮、正面平直，远距离抗弹反而有补偿。

  - field: protection.armor.thickness
    value: 224
    unit: mm
    qual: { part: turret, region: side }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      炮塔侧面 224–174 mm。navypedia 汇总行给「turrets: 330 - 152」，
      与本条的 324 面 / 224–174 侧不是同一分区口径；330 疑含背板或取整。
      顶部 149 mm 只见于 wiki 级页，E 层未采信。

  - field: protection.armor.thickness
    value: 330
    unit: mm
    qual: { part: barbette, region: main }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      navypedia：侧面 330 mm、向舯部 280 mm、向舰端 305 mm。
      wiki 级页按炮塔前后分区给 324/298/275 mm，分区方式不同，
      两组并列不裁；单舰 infobox 的 330 与本条一致。

  - field: protection.armor.thickness
    value: 114
    unit: mm
    qual: { part: conning_tower, region: main }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      navypedia：司令塔侧 114–76 mm、顶/甲板/通话管 51 mm。
      wiki 级页给 102/75/38 mm，差 10 mm 级，疑为名义值 vs 含衬板，
      并列不裁。

  - field: protection.armor.thickness
    value: 305
    unit: mm
    qual: { part: bulkhead, region: fore }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B
    note: 前部横向装甲舱壁，下甲板以上；下甲板以下降至 51 mm。

  - field: protection.armor.thickness
    value: 254
    unit: mm
    qual: { part: bulkhead, region: aft }
    src: [navypedia-kgv]
    valid: { from: 1940-10-01 }
    confidence: B

  - field: protection.armor.weight
    value: 12413
    unit: t
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B
    note: >
      RMG 重量分组表：Hull 13,830 t / Outfit 1,619 / Machinery 2,768 /
      Armament 7,401 / Armour 12,413。五项相加 32,031 t，与隐含分母
      34,133 t 差 2,102 t，RMG 未解释。

  - field: protection.armor.weight_ratio
    value: 32.5
    unit: pct
    src: [rmg-kgv-guide]
    valid: { from: 1940-10-01 }
    confidence: B
    note: RMG 原表直接给 32.5%（分母 34,133 t）。对照俾斯麦约 40%，差距即「防护让位给火力密度」的量化体现。

  - field: protection.underwater.depth
    value: 4.1
    unit: m
