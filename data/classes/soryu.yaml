  - field: identity.building_program
    value: >-
      昭和 9 年度（1934 年）②計画（第二次海军军备补充计划）。
      苍龙基本计划番号 G9，飞龙 G10——**两舰按两型建造**。
    src: [japanese-warship-soryu]
