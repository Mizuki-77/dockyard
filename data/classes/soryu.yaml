    src: [japanese-warship-soryu]
    valid: { from: 1937 }
    confidence: C

  - field: identity.nation
    value: japan
    src: [japanese-warship-soryu]
    valid: { from: 1937 }
    confidence: C

  - field: identity.operator
    value: 大日本帝国海軍（Imperial Japanese Navy）
    src: [japanese-warship-soryu]
    valid: { from: 1937 }
    confidence: C

  - field: identity.era
    value: ww2
    src: [combinedfleet-soryu]
