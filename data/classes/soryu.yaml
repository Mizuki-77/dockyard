# ============================================================================
# 苍龙级 / 苍龙・飞龙 —— 日本海军条约时代的中型正规航母
#
# 2026-11-19 建。
#
# **重要：苍龙与飞龙实际上是两型，不是一个级的两个成员。**
# 两舰在同一造舰计划（昭和 9 年度②計画）下起案，最初确实按同型舰设计，
# 但飞龙建造期间设计大幅修改，基本计划编号也不同（苍龙 G9 / 飞龙 G10）。
# 英文维基：「Generally regarded as the only ship of her class, she was built
# to a modified Sōryū design.」日文原文用「準同型艦 / near sister」。
#
# 所以本文件的分工是：
#   - 放两舰**真正共有**的数据（动力系统、拦阻索型号、机库尺寸、25mm 指挥仪等）
#   - 两舰不同的（主尺度、排水量、舰岛位置、25mm 管数）**一律写进各自的单舰文件**
#
# 舰岛位置是两舰最容易搞错的识别特征：
#   苍龙 = 右舷前部（小型，与驱逐舰舰桥同规模，装在右舷外伸平台上）
#   飞龙 = **左舷中央**（与赤城同为左舷，日造航母中仅此两艘）
#   ← 这条曾被多个二手资料写错成「飞龙右舷」，Kojinsha Vol.6 p.91 明确原文
#     "the port amidships location of the island"
# ============================================================================

id: soryu
name:
  zh: 苍龙级
  en: Sōryū class
class_of:
  - soryu
  - hiryu

open_ended_note: >-
  本级（严格说是「同型计划舰」）两舰的共用数据写在此文件；
  主尺度、排水量、舰岛位置、防空炮管数等**两舰不同**的项写在各自单舰文件里。
  绝大多数参数的有效期到 1942-06 两舰战没为止。

facts:
