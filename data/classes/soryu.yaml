  - field: propulsion.boiler.type
    value: ロ号艦本式（附空气预热器）
    src: [japanese-warship-soryu]
    valid: { from: 1937-12-29 }
    confidence: C

  - field: propulsion.turbine.count
    value: 4
    unit: count
    src: [japanese-warship-soryu]
    valid: { from: 1937-12-29 }
    confidence: C
    note: 舰本式汽轮机（高/中/低压）4 基。原句「艦本式タービン(高中低圧)4基」。

  - field: propulsion.turbine.type
    value: 舰本式齿轮传动蒸汽轮机（与最上级巡洋舰同型）
    src: [japanese-warship-soryu]
    valid: { from: 1937-12-29 }
    confidence: C
