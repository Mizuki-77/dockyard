    valid: { from: 1917-08-28 }
    confidence: C
    note: navypedia 页题「NAGATO battleships (1920 - 1921)」；combinedfleet 页题「Nagato-class Battleship」。

  - field: identity.name_note
    value: 官方文书长期称主炮为「四〇糎」（40 cm），实际口径 41.0 cm
    src: [navweaps-41cm-45-3ns]
    valid: { from: 1922-03-29 }
    confidence: B
    note: >
      navweaps 原文："These guns were originally designated as 41 cm/45 3rd Year Type.
      Redesignated as 40 cm/45 3rd Year Type on 29 March 1922. One Japanese historian
      speculates that this was done so as to hide that the bore diameter exceeded the size
      mandated by the Washington Naval Limitation Treaty of 1922. Actual bore diameter was
      41.0 cm (16.14 inch)."
      这是本站把任务书「注意是 41cm 不是 40cm」落到实处的依据：41 cm 是 1922 年前的旧称，
      40 cm 才是 1922 年后的官方称法，两个都是真名，取决于时点。

  - field: identity.ship_type
    value: battleship
    src: [navypedia-nagato, kasado-nagato]
    valid: { from: 1920-11-25 }
    confidence: B

  - field: identity.nation
    value: japan
    src: [navypedia-nagato]
    valid: { from: 1920-11-25 }
    confidence: B

  - field: identity.operator
    value: 大日本帝国海軍
    src: [kasado-nagato]
    valid: { from: 1920-11-25 }
    confidence: B

  - field: identity.era
    value: ww2
    src: [combinedfleet-nagato-trom]
    valid: { from: 1941-12-08 }
    confidence: C
    note: >-
      按本站收录口径（二战资料站）归 ww2。本级实际横跨 ww1 末与 interwar：
      1920-11 / 1921-10 服役，长门活到 1946 年，舰龄 25 年以上。

  - field: identity.building_program
    value: 八四艦隊計画（"8-4" program），开工后并入八八艦隊計画
    src: [navypedia-nagato]
    valid: { from: 1917-08-28 }
    confidence: C
    note: >
      navypedia 原文："In reply to accepted in the USA in 1916 ambitious shipbuilding program
      Japanese parliament has approved the so-called '8-4' program ... it was provided to build
      four more battleships. Nagato and Mutsu should become the first Japanese battleships not
      only built, but also completely designed in Japan."
      同段另记两舰开工后「moved to the program '8-8', becoming the first of eight battleships
      and eight battlecruisers with guns in not less than 410mm calibre」，该计划被 1922 年
      华盛顿会议取消。

