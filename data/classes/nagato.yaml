# ============================================================================
# 長門型戦艦（Nagato class）舰级公共数据
# ----------------------------------------------------------------------------
# 只放长门与陆奥两舰**共有**的设计值、装甲布置与武器/炮位实体。
# 两舰不同的部分（建造日期、逐次改装节点、编制、雷达、战历、结局）
# 写在 ships/nagato.yaml 与 ships/mutsu.yaml。
#
# 来源口径说明（写在这里，免得每条 fact 重复一遍）：
#   · navypedia 的排水量只有 normal / full 两档，**竣工时不给 standard**（原文写 "---"）；
#     改装后给 standard 39,120 + full 42,850。kasado 给「基準／公試」两档。
#     两种口径体系不合并，各自成 fact。
#   · 装甲厚度有三套独立来源：navypedia 的 Ship protection 两段（竣工时 / 改装后）、
#     kasado 的六列装甲表（逐甲板逐炮塔分面）、navweaps 41 cm 页里引的
#     Kindsepp「Nagato Details」与 Campbell「Naval Weapons of World War Two」。
#     三家在炮塔正面与司令塔上直接打架，一律并列不裁决。
#   · 主炮 41 cm/45 三年式的全部参数出自 navweaps 单页（tier C）。
#     该页正文自己写「原本称 41 cm，1922-03-29 改称 40 cm，实际口径 41.0 cm」，
#     本站按实际口径记 410 mm，伪装口径写进 note。
#   · 副炮 14 cm/50、高炮 8 cm/40、25 mm 九六式、12.7 cm 八九式的 weapon 实体
#     已在 data/classes/hosho.yaml、kongo.yaml、yamato.yaml 登记过，
#     **本文件不重复登记**，只在炮位实体里用 mount.weapon 指过去。
# ============================================================================

id: nagato
name:
  zh: 长门型
  en: Nagato class
class_of: [nagato, mutsu]
note: |
  本文件登记两舰共有的设计值与武备布置，武备数量取「竣工时」与
  「两舰均完成大改装后（1936-10 起）」两个状态；中间的逐舰改装节点
  由单舰 fact 覆盖。
  两舰最容易被写成「同级同型」的地方有三处，均已按来源分开：
    1) 大改装工期不同（长门 1934-04 ~ 1936-01-31；陆奥 1934-09-05 ~ 1936-09-30），
       故本文件的「改装后」状态一律从 1936-10-01 起算。
    2) 陆奥竣工日 navypedia 记 1921-11-22，TROM 与 kasado 记 1921-10-24，
       两说并列（见 ships/mutsu.yaml）。
    3) 陆奥 1943-06-08 爆沉，此后本文件的舰级参数只对长门有效，
       由 ships/nagato.yaml 的单舰 fact 接续。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。
  注意：本级的「最后一艘」是长门（1946-07 沉没），而陆奥早在 1943-06 已损失，
  故 1943-06 之后仍标注为有效的舰级参数，实际只对长门成立。

