# ============================================================================
# 波特兰级重巡洋舰（Portland class）—— CA-33 / CA-35
#
# 2026-11-23 建：为中途岛 TG 17.2 入库。本级只有两艘：
#   CA33 Portland、CA35 Indianapolis。
#
# 【本级在新奥尔良级之前，但比它弱 —— 这是最容易搞反的一件事】
#   本级 1929 年设计批准，原本基本是北安普顿级的加长复制品；设计批准后才发现
#   北安普顿级是「轻载」的，还有排水量余量可用，于是把余量拿去加防护。
#   结果就是：本级舷侧主带 127 mm（弹药库段 146 mm）、甲板 54-64 mm，
#   比后建的新奥尔良级**不弱**；但炮塔正面只有 64 mm、炮座只有 38 mm，
#   这是它落后的地方（新奥尔良级炮塔正面 203 mm、炮座 127 mm）。
#   navypedia 原句：「for the first time USN ships had immune zone under 203mm
#   shells, the truth, it concerned magazines only」。
#
# 【本级最容易被写错的两件事】
#   一、主炮是**老式 triple mount**（247-250 t，无旋转 stalk），
#       不是新奥尔良级 CA32/34/36 那种 triple turret（294 t，有 stalk）。
#       两者炮管同为 8"/55 Mk 9 系列。
#   二、本级**没有鱼雷发射管**，而 5"/25 高炮是 8 座单装（比北安普顿级翻倍）。
#       navypedia 原句：「Portland class differed from predecessors by absence
#       of TTs and doubled number of 127mm AA guns.」
#
# 【没查到的项，如实留着】
#   装甲总重与占比、水下防护纵深、锅炉压力/温度、发电机功率、螺旋桨直径、
#   造价、试航实测功率与航速、两舰各自的主机制造厂。
#
# 调研底稿：work/staging/tg172/RESEARCH-NOTES.md
# ============================================================================

id: portland
name:
  zh: 波特兰级重巡洋舰
  en: Portland-class heavy cruiser
class_of: [portland, indianapolis]
note: |
  本级两艘的设计值基本一致，但有几处逐舰差异需要注意：
    · 编制：navypedia 原文「CA33: 807  CA35: 917 inc flag」
      ——印第安纳波利斯号作为舰队旗舰多编 110 人；
    · 舰载机数：1943-05 改装后「Portland can carry 2 seaplanes and
      Indianapolis 3」（navypedia 原句），波特兰号少一架是因为该次改装拆了
      一座弹射器；
    · 1944 年后的防空配置两舰不同（见 navypedia 改装表），
      写在本文件之外的单舰状态里。
  本文件只登记两舰共享的设计值。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

