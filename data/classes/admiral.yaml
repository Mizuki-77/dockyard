  # ========== 防护（本级全部争议的核心）==========
  - field: protection.scheme
    value: incremental
    unit: null
    src: [navypedia-hood]
    valid: { from: 1918-08-22 }
    confidence: B
    note: >
      不是 all-or-nothing。胡德号保留了防弹片装甲、多层薄甲板、
      以及一处致命的构造：主装带的上缘与主装甲甲板的平部之间，
      存在一条「弹道可以钻过去」的缝隙带——1941 年调查委员会的
      技术结论里专门描述了它（见单舰文件的 narrative）。

  - field: protection.armor.thickness
    value: 305
    unit: mm
    qual: { part: belt, region: main }
    src: [navypedia-hood, hmshood-construction]
    valid: { from: 1916-08-04 }
    confidence: A
    note: >
      主装甲带 12 英寸。这个数字本身就是历史：初版设计是 9 英寸，
      日德兰之后加到 12 英寸。construction.htm 原话：
      「The thickness of the main armoured belt was raised from 9" to 12"
      the same as the Queen Elizabeth Class battleships.」
      带高 2.9 m，长 171.3 m（frame 区间对应 barbette A 至 Y），向内倾 12°。

  - field: protection.armor.thickness
    value: 178
    unit: mm
