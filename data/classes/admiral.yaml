# 海军上将级战列巡洋舰（Admiral class）— 舰级公共数据
#
# 这一级只建成一艘（胡德号），另外三艘（Howe / Rodney / Anson）在 1918 年 10 月取消。
# 所以本文件同时承担两个角色：
#   1. 「这一级本来应该长什么样」——设计意图、四艘的计划
#   2. 「胡德号继承了哪些参数」——凡四艘共有的设计值都写在这里
# 单舰独有的事实（实际建成状态、改装、损失）写 data/ships/hood.yaml。
#
# 解析顺序：单舰 fact → 舰级 fact → 未记载。
# 单舰命中即覆盖舰级，不与舰级值构成分歧。
#
# 【一个必须讲清楚的历史事实】
# 本级的初版设计（1916-04-07 批准）是 4 艘 36,000 t、8 门 15 英寸、32 节的战列巡洋舰，
# 主装带 9 英寸——和已经被击沉的几级战巡一样薄。
# 1916-05-31 日德兰海战中三艘英国战列巡洋舰爆炸沉没，英国海军部在两个月内重审设计，
# 主装带从 9 英寸加到 12 英寸（与伊丽莎白女王级战列舰同级），1916-08-04 批准改版。
# 结果就是胡德号：一艘防护接近战列舰、但为了 32 节航速把水平装甲与炮塔顶
# 留在战巡水平的 42,000 吨级大舰。
#
# 这个「改了一半」的取舍，正是 1941-05-24 那天它在八分钟内被击沉的结构性原因。
# 调查委员会 1941-09-12 的原话是：
#   "It was known that HOOD's protection was poor by modern standards and had it not
#    been for the war she would by now have been undergoing complete reconstruction."

id: admiral
name:
  zh: 海军上将级战列巡洋舰
  en: Admiral class battlecruiser
class_of: [hood]
open_ended_note: >
  舰级参数的有效期到本级全损或退役为止。本级只建成一艘，
  且下面这些设计值多为 1916-1918 年的设计口径——胡德号实际建成时
  与设计已有出入（见数据缺口的注记），1929-1931 年大改装后又变过一次。
  引用时请注意对应的年份，不要把这些数字当成「胡德号任何时刻的参数」。

facts:
  # ========== 身份 ==========
  - field: identity.name_original
    value: Admiral class
    unit: null
    src: [hmshood-construction]
    valid: { from: 1916-04-21 }
    confidence: A
    note: >
      级名取自「海军上将」序列。四艘舰名全部来自英国海军史上的海军上将：
      Hood（第一代胡德子爵 Samuel Hood）、Howe（Richard Howe）、
      Rodney（George Brydges Rodney）、Anson（George Anson）。

  - field: identity.ship_type
    value: battlecruiser
    unit: null
    src: [hmshood-construction, navypedia-hood]
    valid: { from: 1916-04-21 }
    confidence: A
    note: >
      官方分类是战列巡洋舰（battlecruiser），不是快速战列舰。
      但改版后的防护接近伊丽莎白女王级战列舰，所以文献里常见
      「a fast battleship in all but name」这类说法。
      本站按官方分类记 battlecruiser。

  - field: identity.nation
    value: united_kingdom
    unit: null
    src: [hmshood-construction]
    valid: { from: 1916-04-21 }
    confidence: A

  - field: identity.operator
    value: Royal Navy
    unit: null
    src: [hmshood-timeline]
    valid: { from: 1920-03-29 }
    confidence: B

  - field: identity.era
    value: ww2
    unit: null
    src: [hmshood-timeline]
    valid: { from: 1916-09-01 }
    confidence: B
    note: >
      按服役期定位：1920-03-29 服役至 1941-05-24 沉没，横跨战间期与二战，
      按「沉没时所处的战争」归二战。设计年代是一战，这个区别在页面上会提醒读者。

  - field: identity.building_program
    value: 1916 年造舰计划（初版设计 1916-04-07 批准，日德兰后改版 1916-08-04 批准）
    unit: null
    src: [hmshood-construction]
    valid: { from: 1916-04-07 }
    confidence: A
    note: >
      原话：「The design was approved by the Admiralty on 7 April 1916…
      The reworked design was approved on 4 August 1916.」

  # ========== 设计取舍（本级最该记住的部分）==========
  - field: dimensions.length.oa
    value: 262.3
    unit: m
    src: [hoodspecs-dimensions]
    valid: { from: 1918-08-22 }
    confidence: B
    note: 原值 860 ft 7 in。三条来源一致，见单舰文件里的并列。

  - field: dimensions.beam.max
    value: 32.0
