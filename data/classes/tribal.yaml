# ============================================================================
# 舰级：Tribal class（部族级驱逐舰）
# ----------------------------------------------------------------------------
# 本站入库四艘（均英国皇家海军）：Cossack / Maori / Zulu / Sikh。
# 本级是英国在 1930 年代对「外国大型驱逐舰」的回应 —— 这是它的定义性特征。
#
# 【这一级为什么长成这样】
# 起点是日本吹雪型（3x2 127 mm + 3x3 鱼雷发射管）与意大利、德国的大型驱逐舰。
# 皇家海军当时的标准驱逐舰约 1,300 t、装 4 门 120 mm；对手已接近 2,000 t。
# 海军部最初的要求是装十门 120 mm 炮，但 1930 年伦敦会议把「领舰」上限定在
# 1,850 t，十门炮在吨位里放不下，经过至少 8 轮方案才定为
# 8 门 120 mm（4 座双联）+ 1 座四联 40 mm pom-pom + 1 座四联 21 英寸鱼雷发射管。
#
# 代价与收益都很清楚：
#   收益 —— 4 座双联 120 mm 是英国驱逐舰第一次拿到专门设计的动力炮座（CPXIX）；
#   代价 —— 炮座只能仰到 +40 度，没有对空能力，而这批舰在战争中
#           「死于空袭多于其他任何原因」（navweaps 原句）。
# 战争中期把 X 炮座换成双联 4 英寸高平两用炮座，就是针对这一点的补救。
#
# 【哪些数据没查到 —— 必须如实留着】
#   装甲重量 / 装甲占比（本级无装甲带，本来就没有这类数据，不要用别级填充）；
#   试航实测功率与试航航速的逐舰值（navypedia 只给 36.25–36.5 kn 一个区间）；
#   逐舰的转向性能、续航实测；鱼雷型号（只查到 21 英寸、四联一座的管数）。
# ============================================================================

id: tribal
name:
  zh: 部族级（Tribal class）
  en: Tribal-class destroyer
class_of: [cossack, maori, zulu, sikh]
open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: Tribal class
    src: [navypedia-tribal, uboat-tribal-class]
    valid: { from: 1936-03-10 }
    confidence: B
    note: >
      级名取自「部族」——本级各舰以民族/部族命名（Cossack、Maori、Zulu、Sikh、
      Gurkha、Afridi、Punjabi、Mohawk、Nubian、Somali、Tartar、Bedouin、
      Ashanti、Eskimo、Mashona、Matabele）。沿用的是 1905-1908 年那一批
      「部族级」驱逐舰的命名传统（那批也被称为 original 33-knotters）。

      全级 27 艘（含澳大利亚 3 艘、加拿大 8 艘），其中英国皇家海军 16 艘。

  - field: identity.ship_type
    value: destroyer
    src: [uboat-tribal-class, navypedia-tribal]
    valid: { from: 1938-06-07 }
    confidence: A
    note: >
      英国官方分类 fleet destroyer（舰队驱逐舰），不是护航驱逐舰。
      uboat.net 原句："The Tribals were not really U-boat hunters but rather
      fleet destroyers." 这一点在评本级战史时很关键 ——
      它们被当成主力舰队的屏卫与雷击兵力使用，而不是反潜护航舰。

  - field: identity.nation
    value: united_kingdom
    src: [uboat-tribal-class]
    valid: { from: 1936-03-10 }
    confidence: A

  - field: identity.operator
    value: Royal Navy
    src: [uboat-tribal-class]
    valid: { from: 1938-06-07 }
    confidence: A
    note: 本站入库的四艘均为皇家海军舰；澳、加两国建造的同级舰不在本轮范围。

  - field: identity.era
    value: ww2
    src: [naval-history-cossack]
    valid: { from: 1939-09-03, to: 1945-09-02 }
    confidence: B
    note: 设计与开工在间战期（1936），但按服役与作战期定位在 ww2。

  - field: identity.building_program
    value: 1935 年与 1936 年造舰计划（应对日、意、德的大型驱逐舰）
    src: [navypedia-tribal, uboat-tribal-class]
    valid: { from: 1936-03-10 }
    confidence: B
    note: >
      起因写在 navypedia 的 project history 里：本级是英国对「潜在对手海军
      出现大幅超过英国标准驱逐舰的大型驱逐舰」的回应，起点是日本吹雪型
      （3x2 127 mm 炮、3x3 鱼雷发射管）。

      海军部最初要求装十门 120 mm 炮，但 1930 年伦敦会议给「领舰」定的上限是
      1,850 t，十门炮在吨位内放不下；考虑多个方案后定为 8 门 120 mm、
      两座四联 40 mm pom-pom（其中一座在开工后从指标里删去）、
      一座四联鱼雷发射管。本级因此「最终是经过不少于 8 个设计方案才被接受的」。

      订购节奏：首批 7 艘 1936-03-10 下单，后一批 9 艘 1936-06-09 下单
      （uboat.net 原句）。单舰估算造价 34 万英镑（不含海军部供给的武备），
      含武备后平均约 52 万英镑。

