# ============================================================================
# 利根级重巡洋舰（Tone class heavy cruisers）—— 利根 / 筑摩
#
# 2026-11-23 建级（技术数据分片，切片/正文/配图由主会话另行安排）。
#
# 【本级的技术身份只有一句话：把全部主炮搬到舰艏，把整个舰尾让给航空兵装】
#   四座双联 20 cm 炮塔全部在前部、舰尾无一门主炮，后部是水侦甲板与弹射器。
#   这不是审美选择：日方要的是给机动部队当长程侦察舰（每舰 6 机编制）。
#   因此本文件里 aviation.* 的权重不低于 armament.*。
#
# 【主炮是 No.2 炮，不是 No.1 炮】
#   NavWeaps 原话："the design of the Tone class was altered during construction
#   to use these guns"，且该页 Ship Class Used On 栏把它列在
#   "As Completed: Takao and Tone classes"。实弹径 20.32 cm、初速 840 mps。
#   本站已有的 weapon:20cm-3ns 记的是 No.1 炮（20.0 cm、870 mps），
#   两者不是一门炮，故本级另立 weapon:20cm-3ns-no2，见该实体各条的 note。
#
# 【本级几乎所有「差异」都是两源口径差，不是史料打架】
#   长度 201.6 / 201.50、吃水 6.47 / 6.45、载油 2,690 / 2,163、
#   续航 8,000 / 9,000、司令塔 100/50 与 130-70/40。
#   每条都保留、各带 src、各带 note，不裁决（SCHEMA §1.2）。
#   全部 6 处两说并列与 3 处「tier E 独有、故不采用」的数字，
#   单列在 RESEARCH-NOTES.md 的「有争议的记载」与「未获取」两节。
#
# 调研底稿：work/staging/tone/RESEARCH-NOTES.md
# 原始页面：work/staging/tone/_raw/
# ============================================================================

id: tone
name:
  zh: 利根级
  en: Tone class

class_of:
  - tone
  - chikuma

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

