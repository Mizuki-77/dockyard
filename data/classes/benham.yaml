# ============================================================================
# 舰级：Benham class（本汉级驱逐舰，DD-397 – DD-408）
# ----------------------------------------------------------------------------
# 十舰：Benham / Ellet / Lang / Mayrant / Trippe / Rhind / Rowan / Stack /
#       Sterett / Wilson
# 本组只入库其中一艘：USS Benham (DD-397)。
#
# 【本级的三条关键判据】
#
# 一、**本级是最后一级名义 1,500 吨的美军驱逐舰，但实际严重超重。**
#    destroyerhistory 原文："the Benhams were also the last class to displace a nominal
#    1500 tons, though they proved overweight by as much as ten per cent."
#    navypedia 原文："Though nominally Benham class concerned to a series of so-called
#    1500t destroyers (Mahan, Bagley and Gridley classes), their actual standard
#    displacement was significant more than official 1500t."
#    —— navypedia 给的实测标准排水量是 1,657 t，比 1,500 长吨（1,524 t）高 133 t。
#
# 二、**本级是「三锅炉汇入一根烟囱」，不是四烟囱也不是三烟囱。**
#    navypedia 原文："Thanks to presence of only three smoke pipes trunked to a funnel,
#    its size was less, in comparison with previous class."
#    即三个烟道管汇入一个烟囱。destroyerhistory 同页正文也说 "three boilers at 565 psi
#    instead of the Bagley class' four at 400 psi, and thus did not need the Bagleys'
#    prominent boiler uptakes"。
#    **但 destroyerhistory 的技术行同一页写 "4 x Babcock & Wilcox boilers; 400 psi"，
#    与它自己的正文矛盾**——本站采用与 navypedia 一致的三锅炉说，冲突记录在案。
#
# 三、**主炮 4 门，不是 5 门。** 前二封闭（Mk 30 Mods 0/2）、后二敞开（Mk 30 Mod 1）。
#    navweaps 原文分两行给出："Benham (2) 11e: Mark 30 Mods 0 and 2 [bow mounts]"
#    与 "Benham (2) 11e: Mark 30 Mod 1 [stern mounts]"。
#    相比 Sims 级的 5 门，本级少一门而多两座鱼雷管——这是两级最核心的取舍差别。
#
# 调研底稿：work/staging/us-dd/RESEARCH-NOTES.md
# ============================================================================

id: benham
name:
  zh: 本汉级驱逐舰
  en: Benham class destroyer
# 注意：舰级 id 与单舰 id 同名（都叫 benham），这是任务书指定的文件名所致。
# 两者靠目录区分（data/classes/ 与 data/ships/）。合并前请主会话确认
# 加载器是否用 (kind, id) 作键；若只用 id 作键，建议把舰级改成 benham-class。
class_of: [benham]
open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

