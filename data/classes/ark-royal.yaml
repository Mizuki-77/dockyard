  # ============================================================ 防护
  - field: protection.scheme
    value: incremental
    src: [navypedia-arkroyal, uboatnet-arkroyal-class]
    valid: { from: 1938-11-16 }
    confidence: B
    note: >
      逐段防护（incremental），不是 all-or-nothing，也不是光辉级那种装甲盒。
      构造为三层叠加：① 水线主装甲带，舯部向上延伸到下层机库甲板、
      烟囱前后降到上甲板、弹药库段降到下甲板；② 一层 3.5 in 装甲甲板；
      ③ 舷侧「三明治」式水下防护（空舱 + 燃油舱 + 防雷纵舱壁）。
      **机库侧壁本身没有装甲** —— 这是它与光辉级的根本差别。
      uboat.net 原文：「The belt was taken to the lower hangar deck abreast
      the funnel, to the upper deck fore and aft of this and to the lower deck
      by the forward and aft 4.5in magazines; there was a 3½in armour deck at
      the various levels of the upper edge and over the steering gear」。

