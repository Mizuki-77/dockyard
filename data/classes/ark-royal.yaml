# ============================================================================
# 舰级：Ark Royal class（皇家方舟级航空母舰）
# ----------------------------------------------------------------------------
# 这一级只建成一艘（HMS Ark Royal，舷号 91），所以本文件同时承担两个角色：
#   1. 「这一级本来应该长什么样」——1931 年起研制的设计意图、图纸值
#   2. 「皇家方舟号继承了哪些参数」——凡属设计值而不随战历改变的都写在这里
# 单舰独有的东西（建造日期、战历、编制、损失过程、逐期舰载机）写
# work/staging/g5-arkroyal/ships/ark-royal.yaml。
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact → 舰级 fact → 未记载。
# 单舰命中即覆盖舰级，**不算分歧**。
#
# 【本级在皇家海军航母谱系里的位置】
# 它是皇家海军第一艘「从铺龙骨起就按航母设计」的大型舰队航母（此前六艘都是
# 战巡/客船改装）。两个技术决定影响了此后全部英国航母：
#   ① 飞行甲板成为船体的**结构组成部分**，兼作上层强度甲板——而不是架在船体上；
#   ② 舷侧板一直包到飞行甲板，形成全封闭舰艏（此后英国航母的标志性外形）。
# 但它**没有**装甲飞行甲板：真正把装甲甲板当强度甲板的是后来的光辉级。
# 本级的取舍是「高干舷 + 双层大机库 + 60 架载机」，
# 代价是机库侧壁只有结构钢、只有局部装甲带，以及最后那条致命的设计缺陷：
# 三组锅炉房排成一列横贯全船，烟道从下层机库底下穿过。
#
# 【本文件不重复的东西】
# 逐月战历、每次改装的防空炮增减、舰载机编制的逐期变化，都在单舰文件里。
# ============================================================================

id: ark-royal
name:
  zh: 皇家方舟级航空母舰
  en: Ark Royal-class aircraft carrier
class_of: [ark-royal]

open_ended_note: >
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在
  work/staging/g5-arkroyal/ships/ark-royal.yaml 的状态切片里，由单舰 fact 覆盖。
  因此这里的 open 时间窗表示「无已知终止事件」。
  另请注意这些数字的「时间底色」：它们主要是 1935-1938 年的设计值与建成状态，
  不是「这艘船任何时刻的参数」——1941-05 加装两座 pom-pom 之后防空配置就变过。

