  - field: identity.building_program
    value: 1911 年度海军紧急扩张案（Naval Emergency Expansion Bill）
    src: [combinedfleet-haruna]
    valid: { from: 1910 }
    confidence: C
    note: >-
      原文：「The Diet passes and funds the 1911 Naval Emergency Expansion bill
      received from the cabinet. The bill authorizes the design and construction
      of a battleship and four armored cruisers. The battleship is FUSO.
      HARUNA is the third of the four high-speed armored cruisers, after KONGO
      and HIEI.」
      即同案一舰战列舰（扶桑）+ 四艘「高速装甲巡洋舰」，后者即金刚型。
      设计出自英国 Vickers 的 Sir George Thurston，以 Lion 级为起点改型：
      「Japanese have preferred Vickers, with which in October, 1910 they have
      signed the contract. As starting point at designing of Kongo Lion has
      served design project」（navypedia）。

