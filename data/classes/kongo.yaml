    value: >-
      25 mm 九六式机炮：1930 年代大改装后 10 座双联（20 挺）。
      战时逐次增装，四舰数量差别极大——雾岛沉没时仍为 20 挺（1942-11），
      榛名 1944-10 已达 108 挺（28 座三联＋2 座双联＋20 座单装）。
    src: [navweaps-25mm-96, navypedia-kongo, japanese-warship-haruna]
    valid: { from: 1936 }
    confidence: B
    note: >-
      navweaps 引 USNTMJ O-47(N)-2 的同级装机表：「Ise, Fuso and Kongô classes
      20 triples / 6 twins / 30 singles」——**这是该报告统计的该级某艘（很可能是
      1945 年状态的最重一舰）合计值，不能直接套到任一单舰**。
      逐舰真实数字一律以各舰 TROM 与日文来源的兵装表为准，见 ships/*.yaml。

  - field: armament.mount.summary
    value: >-
      建成时：35.6 cm 连装炮塔 4 座（8 门）＋15.2 cm 单装炮 16 门（舷侧炮廓）
      ＋7.6 cm 单装炮 8 门＋53.3 cm 水下鱼雷发射管 8 具。
      1930 年代大改装后：主炮 4 座 8 门不变；副炮减为 14 门；7.6 cm 炮撤除，
      换 12.7 cm 八九式连装高射炮 4 座 8 门＋25 mm 九六式机炮 10 座 20 挺；
      鱼雷发射管全撤。
    src: [navypedia-kongo, japanese-warship-haruna, japanese-warship-kirishima]
    valid: { from: 1915-04-19 }
    confidence: C
    note: >-
      本节是**人读概览**，结构化数据一律在 mount:* 实体与 armament.aa_* 字段。
      原文（navypedia, as completed）：「4 x 2 - 356/45 41-shiki, 16 x 1 -
      152/50 41-shiki, 8 x 1 - 76/40 41-shiki, 8 - 533 TT (beam)」；
      日文来源（榛名竣工时）：「45口径35.6cm連装砲 4基8門／50口径15.2cm単装砲
      16基16門／40口径短7.6cm単装砲 4基4門／40口径8cm単装砲 8基8門／
      53.3cm魚雷発射管 8門（水中）」——7.6 cm 一项两源分列方式不同
      （navypedia 8 门 vs 日文 4+8=12 门），未裁决，详见 RESEARCH-NOTES。
      12.7 cm 高角炮的全级规律（navweaps 原文）：「Older battleships of the
      Kongô, Fuso, Ise and Nagato classes had their 8 cm (3") 41st Year Type and
      3rd Year Type AA guns removed during their 1930s rebuilds and replaced with
      the new 12.7 cm/40 (5") Type 89 in four twin mounts. Kongô and Haruna had
      two additional twin mountings added in 1944.」
      → ① 四舰都从 4 座起步（A1 型，navweaps：「The A1 mount was unshielded.」）；
      ② 1944 年**只有金刚与榛名**各加 2 座（→ 6 座 12 门）；
      雾岛/比叡 1942 年即战没，终生只有 4 座。这一条是两舰防空火力最易混的地方。

