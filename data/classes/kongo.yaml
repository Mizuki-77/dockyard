# ============================================================================
# 金刚型（金剛型戦艦 / Kongō class）—— 日本海军最后的英国血统战列巡洋舰
#
# 2026-11-23 建。本文件只放**四舰共享**的设计值；逐舰不同的
# （排水量终值、锅炉数、涡轮型号、改装完成日、结局）写在 ships/haruna.yaml
# 与 ships/kirishima.yaml。
#
# 三条必须写在文件头的事实，防止后来者搞混：
#   1. **只有金刚是在英国造的**（Vickers, Barrow-in-Furness, Yard No.414）。
#      比叡（横须贺）、榛名（川崎神户）、雾岛（三菱长崎）都是日本造。
#      navypedia 原文把四舰列在同一页，但 Builder 栏逐舰不同：
#        「金剛 [Kongo] 414 Vickers, Barrow, UK」「比叡 [Hiei] Yokosuka K K」
#        「霧島 [Kirishima] 225 Mitsubishi, Nagasaki」「榛名 [Haruna] Kawasaki, Kobe」
#      combinedfleet 的 TROM 亦逐舰写明：
#        Haruna「Kobe. Battlecruiser HARUNA is laid down on No. 4 slip at Kawasaki's shipyard.」
#        Kirishima「Nagasaki. A battlecruiser is laid down at Mitsubishi Zosen Kaisha's shipyard.」
#      → 任务书「榛名与雾岛都是英国建造」的说法与两处来源直接冲突，本站按来源写。
#   2. **四舰的锅炉数在 1930 年代大改装后各不同**，而且「11」这个数字有两个不同来源，
#      极易混为一谈（2026-11-25 修正，原注释误写成「榛名/比叡 11 座」）：
#        · 榛名 — 改装后 11 座重油专烧锅炉（navypedia + 日文「ロ号艦本式ボイラー（重油専焼） 11基」）
#        · 比叡 — 改装后 8 座（combinedfleet「She receives eight new oil-fired Kampon boilers」
#                + 日文「ロ号艦本式ボイラー 8基」）。她的 11 座是**練習戦艦期**（1933-1940，
#                36−25=11）的数，与榛名那个 11 时点与含义都不同。只有 navypedia 写 11，已并列保留。
#        · 金刚 — 改装后 8 座（中间过渡期 10 座）
#        · 雾岛 — 改装后 8 座（中间过渡期 10 座）
#      **比叡的二次改装完成日是 1940-01-31，比榛名晚 5 年 4 个月**，不是 20 个月。
#      在 1934-09 ~ 1940-01 这段，舰级文件按「已改装」给的值对比叡全错
#      （她当时是 19,500 t / 18 kn 的練習戦艦、25 mm 是 0 挺）。
#      这是本级最容易被写成「同级同型」的一处差异，必须逐舰记。
#   3. 本级最初分类是**战列巡洋舰**（巡洋戦艦），1930 年代改装后成为「高速戦艦」。
#      navypedia 页标题即「KONGO battlecruisers (1913 - 1915)」；日文来源用
#      「金剛型戦艦」并明确写改装后「高速戦艦」诞生。改级的具体日期未获取，
#      故舰种只按「改装完成后」这个节点切换，见各单舰文件。
# ============================================================================

id: kongo
name:
  zh: 金刚型
  en: Kongō class
class_of:
  - kongo
  - hiei
  - haruna
  - kirishima

date_convention_note: |
  **本文件三段式时间窗用的是「该状态最早完成日」，即榛名的改装完成日**：
    第一次改装段：1928-07-31（榛名，横须贺，1924-03-01 至 1928-07-31）
    第二次改装段：1934-09-30（榛名，横须贺，1933-08-01 至 1934-09-30）
  这是**刻意的简化**，不是史实错误，但必须知道它意味着什么：
  雾岛的两次改装分别完成于 1930-04-16（吴）与 1936-06-08（佐世保），
  比榛名晚 20 个月与 20 个月。所以在 1928-07-31～1930-04-16 与
  1934-09-30～1936-06-08 这两段里，本文件按「已改装」给的宽、吃水、燃油、
  续航、武备等值，对雾岛其实**尚未生效**。
  逐舰真实节点以 ships/<id>.yaml 里的 fact 为准；主会话合并时若要做
  逐舰时间轴，应以单舰文件的窗口覆盖本文件的窗口。
  **未做逐条拆窗的原因**：拆开会把 51 处同名日期改成逐舰一对，属结构性重写，
  本轮按主会话「立即收尾、不追求完整」的指令保留现状并在此明示。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/该状态完成起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变（改装带来的变化另立一条 fact，用新的 valid.from）。
  因此这里的 open 时间窗表示「无已知终止事件」。
  四舰的结局不同（金刚 1944-11-21 被潜艇击沉、比叡 1942-11-13 自沉、
  雾岛 1942-11-15 沉没、榛名 1945-07-28 空袭坐底后 1946-48 解体），
  结局数据一律写单舰文件，本文件不写。

