  # ============================================================
  # 防护
  # 口径提示：navypedia 的装甲栏是一个**纵列字符串**，多数项给的是区间
  # （如 belt: 203 - 76）。本站逐部位拆条，区间内部的分配关系原文没写，
  # 一律在 note 里保留原句，不自行把区间拆给具体部位。
