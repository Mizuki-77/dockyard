  - field: protection.scheme
    value: incremental
    src: [navypedia-kongo]
    valid: { from: 1915-04-19 }
    confidence: C
    note: >-
      **这是分类判断，来源没有用过「incremental」这个词，故 confidence 记 C。**
      判断依据是 navypedia 的装甲描述为一整套**分部位、分高度、不封闭成单盒**的
      布置，而不是把所有防护集中成一条装甲堡：
      「3.8m-high main belt extended from No1 to No4 barbettes and had 203mm
      thickness between barbettes… Ship ends from end barbettes to ship ends were
      protected by 76mm belt. Upper 152mm belt extended from main belt to upper
      deck and from No1 to No4 barbette… Casemates had also 152mm armor. Main
      19mm deck connected with lower edge of main belt by 19mm slopes. Forecastle
      deck and upper deck aft from No3 barbette had 38mm protection.」
      → 舷侧带 203 收薄到舰端 76、其上再接 152 上带、炮廓单独 152、
      甲板分 19/38 两层并由 19 mm 斜板与主带下缘相接。这种「越靠两端越薄、
      多层叠加」是 incremental 的特征；all_or_nothing 的核心恰恰是取消这种削薄、
      只保一条完整装甲盒。**若日后主会话找到明写该舰防护体系的文献，应以文献为准。**

