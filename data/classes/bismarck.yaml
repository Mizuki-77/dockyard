# ============================================================================
# Bismarck 级（Bismarck class）舰级公共数据
# ----------------------------------------------------------------------------
# 这里只放 Bismarck 与 Tirpitz 两舰**共有**的设计参数与武器/炮位实体。
# 单舰的实测值、建造日期、编制、时间轴状态变化一律写在 data/ships/<id>.yaml，
# 解析顺序见 docs/00-framework.md §3.6：单舰 fact -> 舰级 fact -> 未记载。
#
# 约定：facts 里每条可带一个 about 键指明归属实体。
#   about 缺省       -> 本文件主体（舰级本身）
#   about: weapon:x  -> 武器实体 x（weapon.* 字段）
#   about: mount:x   -> 炮位实体 x（mount.* 字段）
# 校验器不认识 about，只按 field/unit/type/qual 校验，不影响契约。
# ============================================================================

id: bismarck
name:
  zh: 俾斯麦级
  en: Bismarck class
class_of: [bismarck, tirpitz]
note: |
  舰级层只登记两舰共有的设计值。凡 Bismarck 与 Tirpitz 不同的项，
  一律不写在这里，由单舰文件覆盖。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」，
  逐条写 note 只会是同一句话复制上百遍。

facts:
  # ---------------------------------------------------------------- 身份
  - field: identity.name_original
    value: Bismarck
    src: [kbismarck-genedata]
    valid: { from: 1936-07-01 }
    confidence: A
    note: 舰级名取首舰名；Schlachtschiff F 为建造代号。

  - field: identity.ship_type
    value: battleship
    src: [kbismarck-genedata, navypedia-bismarck]
    valid: { from: 1936-07-01 }
    confidence: A
    note: 两源一致。

  - field: identity.nation
    value: germany
    src: [kbismarck-genedata]
    valid: { from: 1936-07-01 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [kbismarck-genedata]
    valid: { from: 1936-07-01 }
    confidence: A
    note: 按服役期定位（1940-08-24 服役至 1941-05-27 沉没），不是按设计年份。

  - field: identity.operator
    value: Kriegsmarine
    src: [kbismarck-genedata]
    valid: { from: 1940-08-24 }
    confidence: A

  - field: identity.building_program
    value: Schlachtschiff F / G（Z 计划前身，1934 起设计研究）
    src: [kbismarck-genedata, german-navy-bismarck]
    valid: { from: 1934 }
    confidence: C
    note: german-navy 记 1934 年 Panzerschiff F 设计研究起点为 35,000 t / 8×33 cm，后因敦刻尔克级加厚装甲而放大。

  # ---------------------------------------------------------------- 排水量
  # 五个口径各自独立成字段，绝不合并。Bismarck 的数值见 ships/bismarck.yaml。
  # 口径定义来自 kbismarck-bsweights 的逐项分解表。

  - field: displacement.empty
    value: 40250
    unit: t
    src: [kbismarck-bsweights]
    valid: { from: 1940-08-24 }
    confidence: A
    note: Schiff Fertig Leer（空载完工状态）。bsweights 逐项累加得出，非概略值。

  - field: displacement.standard
    value: 43978
    unit: t
    src: [kbismarck-bsweights]
    valid: { from: 1940-08-24 }
    confidence: A
    note: >
      按 1922 华盛顿条约定义（不含燃油与备用给水）逐项累加得出，
      口径在脚注 1 里自证，故可作主值。英文维基的 41,700 t 未标口径，
      按 §3.9 主值规则落选，但仍保留为单舰 fact 的并列说法。

  - field: displacement.standard_metric
    value: 43313
    unit: t
    src: [kbismarck-bsweights]
    valid: { from: 1940-08-24 }
    confidence: A
    note: >
      Typverdrängung（型号/设计排水量），kbismarck bsweights 页原值 43,313 mt。
      这不是标准排水量（不含饮水 155 + 洗涤水 510 的 43,978 才是），
      故按注册表定义单列此字段，不与 displacement.standard 混用。
      德军自己的口径里它是设计状态的基本重量，出图与配重计算用的就是它。

  - field: displacement.construction
    value: 47870
    unit: t
    src: [kbismarck-bsweights]
    valid: { from: 1940-08-24 }
    confidence: A
    note: Construction displacement，装甲重量占比的分母用的就是这个值。

  - field: displacement.full
    value: 51760
    unit: t
    src: [kbismarck-bsweights, kbismarck-genedata]
    valid: { from: 1940-08-24 }
    confidence: A
    note: >
      bsweights 逐项表与 genedata 主表一致。但 genedata 同页三张对比表把
      full load 写成 51,700 mt，属同页自相矛盾，已作单舰分歧另行登记。

  - field: displacement.maximum
    value: 53486
    unit: t
    src: [kbismarck-bsweights]
    valid: { from: 1940-08-24 }
    confidence: A
    note: 含备用燃油与洗涤水的极限排水量。

