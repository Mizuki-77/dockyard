# ============================================================================
# 大和型戦艦（Yamato class）舰级公共数据
# ----------------------------------------------------------------------------
# 只放大和与武藏两舰**共有**的设计参数与武器/炮位实体。
# 两舰不同的部分（建造日期、改装史、编制、战历、结局）写在 ships/<id>.yaml。
#
# 来源口径说明：
#   · 日方口径（「基準排水量／公試排水量／満載排水量」）与英美口径不同，
#     各口径分别成字段，绝不合并。
#   · 装甲厚度的「部位—分段」来自 navypedia 的 Ship protection 段与
#     kasado 的装甲防御表、pwe 的 Protection 表；三份互相独立。
#   · 材质（VH / MNC / CNC / Ducol）只在 pwe 的 Protection 表里逐行给出，
#     故材质 fact 只有 pwe 一个来源，confidence 记 C。
# ============================================================================

id: yamato
name:
  zh: 大和型
  en: Yamato class
class_of: [yamato, musashi]
note: |
  本文件登记两舰共有的设计值与武备布置。凡大和与武藏不同的项
  （建造日期、改装节点、编制、雷达加装时间、结局）一律写进单舰文件。
  舰级层的武备数量取「竣工时」状态；改装后的数量变化由单舰 fact 覆盖。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

