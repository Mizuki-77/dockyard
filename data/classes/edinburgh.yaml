# ============================================================================
# 舰级：Edinburgh class（爱丁堡级轻巡洋舰）—— 城级第三组
# ----------------------------------------------------------------------------
# 【它和 town.yaml 是什么关系，别搞混】
# 「城级（Town class）」是通称，不是一份设计。皇家海军内部与战后文献把三批
# 以城市命名的 6 英寸条约巡洋舰统称 Town class，但三者是三次独立的设计演进：
#
#   Southampton 子级 5 艘：Southampton / Newcastle / Sheffield / Glasgow / Birmingham
#   Gloucester  子级 3 艘：Gloucester / Liverpool / Manchester
#   Edinburgh   子级 2 艘：Edinburgh / Belfast      ← 本文件
#
# data/classes/town.yaml 登记的是 **Southampton 子级**（class_of 只有 sheffield）。
# 本级的尺度、排水量、武备、装甲与它逐项不同，不能共用一份 fact：
#   全长 187.0 m（Southampton 180.3 m）／标准 10,550 t（9,100 t）
#   主炮 4 座三联 12 门（3 座 9 门）／4 英寸炮 6 座双联 12 门（4 座 8 门）
#   装甲带 114 mm 延伸至 A–Y 炮座（Southampton 只护机舱与弹药库）
# 因此单独建 edinburgh.yaml。城级的通称与三子级的差异说明仍留在 town.yaml。
#
# 【这一级为什么长成这样】（navypedia 与 navweaps 的原话在 note 里）
# 设计起点是「Gloucester 的放大版」，最初打算上 4 座四联装 6 英寸炮（16 门）。
# 1936 年初 Shoeburyness 用等间距四联模型试验，弹道互相干扰严重、散布过大；
# 改成两两成对的方案也不合格，四联炮座与配套的 Mark XXIV 炮身一并取消，
# 退回改进型三联装（Mark XXIII 炮座）。这就是本级最终 12 门而不是 16 门的原因。
#
# 【本级相对 Southampton 的实质改动】
#   1) 装甲带加长到 A–Y 炮座，前后都封住；装甲甲板加厚（弹药库上方 76 mm）。
#   2) 4 英寸双联炮座 4 座 → 6 座。
#   3) 四联 2-pdr 换成八联 pom-pom。
#   4) 弹射器从两烟囱之间前移到前烟囱与前部上层建筑之间，外形因此很有辨识度。
#   5) 代价：4 英寸炮的弹药库布置得离炮位太远，本级因此装了 33.5 m 的
#      轨道小车输弹系统，被 "British Cruisers of World War Two" 评为
#      「a complicated arrangement which in action could easily be disrupted」。
#
# 【哪些数据没查到 —— 如实留着】
#   装甲总重与占比、重量分配表、型深、方形系数、干舷、锅炉蒸汽压力/温度、
#   发电机功率、螺旋桨直径、舵面积、造价、标准排水量状态的平均吃水
#   （navypedia 只给深载吃水 6.48 m）、防空炮座的具体位置。
#
# 调研底稿：work/staging/g-belfast/RESEARCH-NOTES.md
# ============================================================================

id: edinburgh
name:
  zh: 爱丁堡级轻巡洋舰（城级第三组）
  en: Edinburgh class light cruiser
class_of: [belfast]

note: |
  城级（Town class）的第三个子级，英国文献亦称 "Modified Town"。
  同级 2 艘：Edinburgh（Swan Hunter, Wallsend，1939-07-06 服役，1942-05-02 战沉）、
  Belfast（Harland & Wolff, Belfast，1939-08-05 服役，1971 年起为博物馆舰）。

  与 data/classes/town.yaml（Southampton 子级）的关系：
    - 同属城级通称下的 6 英寸条约型巡洋舰，主炮同为 6"/50 Mk XXIII 炮身；
    - 但本级炮座是 **Mark XXIII**（三联，炮塔装甲正面 102 mm、其余 51 mm，
      单座 185 t），Southampton 子级是 **Mark XXII**（三联，全周 25 mm，单座 148 t）；
    - 本级舰体放大、装甲带加长、4 英寸炮增至 6 座双联、弹射器前移，
      因此主尺度 / 排水量 / 武备 / 装甲四组数值都不能与 town.yaml 共用。

  **本库尚未收 Edinburgh 本舰的单舰文件**，class_of 只列 belfast。
  Edinburgh 的结局（1942-04-30 被 U456 两条鱼雷击中、05-02 与德军驱逐舰
  Z24 交战时中第三条鱼雷、失去动力后由英方驱逐舰 Foresight 用鱼雷击沉）
  出自 navypedia 与 naval-history，本文件不写成 fact —— 那是单舰级的历史，
  不是舰级设计参数。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: Edinburgh class（Modified Town）
    src: [navypedia-edinburgh, navweaps-6in-50-mk23]
    valid: { from: 1936-08-15 }
    confidence: C
    note: >
      navypedia 页标题「EDINBURGH light cruisers (2, 1939)」；
      navweaps 的装舰表把本级记作「Edinburgh ("Modified Town")」与
      「Edinburgh ["Modified Town"] (4)」。两处都用「改进型城级」这个说法。

  - field: identity.name_zh
    value: 爱丁堡级轻巡洋舰（城级第三组）
    src: [navypedia-edinburgh]
    valid: { from: 1936-08-15 }
    confidence: C

  - field: identity.name_en
    value: Edinburgh class light cruiser
    src: [navypedia-edinburgh]
    valid: { from: 1936-08-15 }
    confidence: C

  - field: identity.name_note
    value: >
      「城级」是通称，来自该级各舰均以英国城市命名。三个子级分属三份不同的设计：
      Southampton（5 艘）、Gloucester（3 艘）、Edinburgh（2 艘）。
      本级两艘舰名分别取自苏格兰首府爱丁堡与北爱尔兰首府贝尔法斯特，
      后者同时是 Harland & Wolff 船厂所在地。
    src: [navypedia-edinburgh, navypedia-town, navypedia-gloucester]
    valid: { from: 1936-08-15 }
    confidence: C
    note: 三个子级的舰名归属按 navypedia 各分页的 Ships 表逐舰核对。

  - field: identity.ship_type
    value: light_cruiser
    src: [naval-history-belfast, navypedia-edinburgh]
    valid: { from: 1939-07-06 }
    confidence: A
    note: >
      英国官方分类 light cruiser，按 1930 年伦敦条约的 6 英寸主炮定义归类。
      naval-history 页标题即「HMS BELFAST - Edinburgh-class Light Cruiser」，
      但正文第一句又写「Improved SOUTHAMPTON-Class heavy cruiser」——
      同一页内自称不一致，重巡是英式旧习惯用词，本站按官方分类取轻巡。

  - field: identity.nation
    value: united_kingdom
    src: [navypedia-edinburgh]
    valid: { from: 1939-07-06 }
    confidence: A

  - field: identity.operator
    value: Royal Navy
    src: [naval-history-belfast, navypedia-edinburgh]
    valid: { from: 1939-07-06 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [naval-history-belfast]
    valid: { from: 1939-09-03, to: 1945-09-02 }
    confidence: A
    note: >
      按服役与作战期定位。本级两艘都在 1939 年 7–8 月服役，都在二战中作战；
      Belfast 战后一直用到 1963 年并保存至今，冷战段见单舰文件与切片。

  - field: identity.building_program
    value: >
      1930 年伦敦海军条约（巡洋舰主炮上限 6 英寸）之后的条约型巡洋舰，
      1936 年估算案（1936 Estimates）下订造；设计起点是 Gloucester 子级的放大版，
      最初计划装 4 座四联 6 英寸炮（16 门），因弹道干扰试验失败改为 4 座三联（12 门）。
    src: [navypedia-edinburgh, navweaps-6in-50-mk23, naval-history-belfast]
    valid: { from: 1936-08-15 }
    confidence: C
    note: >
      订造日期两源一致：naval-history 写「ordered on 15th August 1936 from Harland
      and Wolff at Belfast under the 1936 Estimates on with sister ship HMS EDINBURGH
      from Swan Hunter in Newcastle」。
      四联改三联的原因见 navweaps 注 7：「Tests at Shoeburyness in early 1936 with a
      mockup where all four guns were equally spaced at 42 inches (106.7 cm) apart
      showed considerable shell interference and collision problems」。

  - field: construction.order_date
    value: 1936-08-15
    unit: date
    src: [naval-history-belfast, naval-history-edinburgh]
    valid: { from: 1936-08-15 }
    confidence: A
    note: >
      同级两艘同日订造。两页原文措辞几乎相同：「ordered on 15th August 1936」。
      舰级文件只登记订货日；开工/下水/服役逐舰不同，写在单舰文件里。

