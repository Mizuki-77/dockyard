      一、**炮身与炮座型号不同**。炮身是 6"/50 Mk XXIII，本级炮座也是
      **Mark XXIII**（这不是笔误：navweaps 的装舰表把 Edinburgh / Fiji / Ceylon /
      Swiftsure 都记在 Mark XXIII 炮座之下，而 Southampton 与 Gloucester 是
      Mark XXII）。写成「Mk XXIII 炮塔」口语没问题，但数据层必须分清。

