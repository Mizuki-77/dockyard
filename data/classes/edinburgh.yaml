      + 4 × 47 mm Hotchkiss 礼炮（单装，1939 年拆除）
      + 6 具 21 in 鱼雷发射管（2 座三联，水上）
      + 3 架水上飞机 / 1 具 D-I-H 弹射器
    src: [navypedia-edinburgh, navweaps-6in-50-mk23, navweaps-4in-45-mk16, navweaps-2pdr-mk8]
