  note: 'japanese-warship 原话「ロ号艦本式ボイラー　混焼4基、重油8基」； kasado 原话「ロ号艦本式重油専焼水管罐:12基」（记作 12 基全部重油专烧， **与 japanese-warship 的混烧 4 基冲突，两说并列不裁决**）。 **本级是为省重油而把混烧炉由 2 基增加到 4 基的设计**，这是它比长良型多一根 烟囱的直接原因。navypedia 原话：「Differences
