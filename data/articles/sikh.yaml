# ============================================================================
# 舰艇正文 —— 锡克人号
#
# 本舰正文的抓手是「这一级的设计缺陷在它身上一次付清」。
# 部族级用鱼雷兵力换主炮，用对空能力换吨位；这两笔账在 1942 年 9 月 14 日
# 的托布鲁克外海同时到期 —— 四座只能仰到 40 度的炮座，
# 在岸防炮的平射火力面前几乎无法还手。
#
# ⚠️ 时间与地点必须写对：1942-09-14，托布鲁克外海，德国岸防炮。
#    不是 1944 年，不在的黎波里，也与圣纳泽尔突袭无关。
# ============================================================================
ship: sikh
updated: 2026-11-22

intro:
  lead:
    zh: >-
      锡克人号是部族级里死得最难看的一艘，也是最能说明这一级设计代价的一艘。
      1942 年 9 月 14 日，它在托布鲁克外海用小艇接运皇家海军陆战队时
      被岸上探照灯照住，德国岸防炮的六发 88 毫米炮弹逐一打掉了它的齿轮舱、
      前部弹药架、测距指挥仪、Y 炮座的发射药、B 炮座的炮组和舰桥。
      拖带失败后舰长下令自沉，生还者全部被俘。
      不到一个月前，它刚刚参与击沉一艘德国潜艇；
      九个月前，它在邦角夜战里击沉过两艘意大利轻巡洋舰。
    en: >-
      Sikh had the ugliest end of any Tribal, and she is the one that best shows
      what the class's design cost. On 14 September 1942, recovering Royal
      Marines by boat off Tobruk, she was caught in a shore searchlight and six
      88 mm shells from German coastal batteries methodically took out her gear
      room, her forward ready-use ammunition, her rangefinder director, the
      charges around Y mounting, the crew of B mounting and her bridge. When the
      tow failed her captain ordered her scuttled, and every survivor was taken
      prisoner. Less than a month earlier she had helped sink a German
      submarine; nine months before that she had helped sink two Italian light
      cruisers at Cape Bon.

  paragraphs:
    - heading: 一个用主炮换掉鱼雷和对空的舰级
      text:
        zh: >-
          部族级的设计是一场交易。为了在 1,850 吨的「领舰」上限内装下
          八门 120 毫米炮，它砍掉了英国驱逐舰传统的另一半火力：
          鱼雷发射管只有一座四联（同期英国驱逐舰是两座四联），
          四座 CPXIX 炮座只能仰到 40 度，没有对空能力。
          navweaps 对这笔账的总结很直接：整个战争期间英国驱逐舰
          「死于空袭多于其他任何原因」。本级因此在 1941 年陆续把 X 炮座
          换成双联 4 英寸高平两用炮座 —— 本舰是 1941 年 1 月到 3 月做的，
          在利斯（Leith）的 Henry Robb 船厂。
        en: >-
          The Tribal design was a bargain. To fit eight 120 mm guns inside the
          1,850-ton leader limit it cut away the other half of the British
          destroyer's firepower: a single quadruple torpedo tube set where
          contemporary ships had two, and four CPXIX mountings limited to 40
          degrees of elevation with no DP capability. NavWeaps sums the bargain
          up plainly: throughout the war more British destroyers were sunk by
          air attack than from any other cause. The class therefore replaced the
          X mounting with a twin 4-inch HA mounting through 1941 - Sikh had hers
          done between January and March 1941 at Henry Robb's yard at Leith.
      src: [navypedia-tribal, navweaps-4-7in-45-mk12, naval-history-sikh]

    - heading: 服役比完工早一个月
      text:
        zh: >-
          本舰 1938 年 10 月 12 日服役，但 11 月 2 日才完工 ——
          服役早于完工一个月。这不是记录混乱，是英国造舰的常规两段式流程：
          先服役、编入分队、开始试航与训练，完工与验收试验随后完成。
          服役时它被定为该分队的资深军官舰。造价 337,704 英镑 5 先令。
          还有一件容易漏掉的事：它属 1936 年造舰计划，
          与另外三艘入库的姊妹舰（1935 年计划）不是同一批下单的。
        en: >-
          She commissioned on 12 October 1938 but was not completed until
          2 November - commissioned a month before completion. This is not
          confused record-keeping but the Royal Navy's normal two-stage practice:
          commission, join the flotilla, begin trials and work-up, with
          completion and acceptance trials following. On commissioning she was
          the flotilla's senior officer's ship. Cost was £337,704 5s. One easily
          missed point: she belonged to the 1936 Build Programme, and so was not
          ordered in the same batch as the other three ships recorded here (1935
          programme).
      src: [naval-history-sikh, uboat-sikh]

    - heading: 1941 年 12 月 13 日：邦角
      text:
        zh: >-
          1941 年 12 月，本舰与毛利人号、Legion、荷兰的 Isaac Sweers 一同东调，
          13 日在突尼斯邦角外海拦住了意大利轻巡洋舰 Alberico da Barbiano 与
          Alberto di Giussano，以鱼雷和舰炮击沉两舰。
          意方 960 人阵亡，650 人被意方鱼雷艇 Cigno 救起。
          这是 1941 年 12 月皇家海军在地中海唯一一次干净的胜利 ——
          三天后意军人操鱼雷在亚历山大重创两艘战列舰，Force K 又在
          的黎波里外海触雷，战局立刻反转。
        en: >-
          In December 1941 she moved east with Maori, Legion and the Dutch Isaac
          Sweers, and on the 13th they caught the Italian light cruisers
          Alberico da Barbiano and Alberto di Guissano off Cape Bon, sinking both
          with torpedoes and gunfire. 960 Italians died and 650 were rescued by
          the Italian torpedo boat Cigno. It was the Royal Navy's one clean
          Mediterranean victory in December 1941 - three days later Italian
          human torpedoes crippled two battleships at Alexandria and Force K ran
          into a minefield off Tripoli, and the balance turned over at once.
      src: [naval-history-sikh, naval-history-maori]

    - heading: 俾斯麦夜战：一次没打成的攻击
      text:
        zh: >-
          1941 年 5 月 27 日凌晨零时二十分，本舰在俾斯麦后方跟踪，
          敌舰转向并开始向它射击。它转向左舷准备发射鱼雷，
          但鱼雷控制军官的视线被弹幕水柱挡住，攻击没能成立，只好南撤。
          两小时后（零时二十八分）它对已经停车的俾斯麦齐射四条鱼雷，
          来源的写法是「相信获得了一次命中」（it is believed that one hit was
          obtained）。此后它保持雷达接触直到三时五十九分。
          四条雷一次打光 —— 这一级只有一次雷击机会，这就是它的实际含义。
        en: >-
          At 0020 on 27 May 1941 Sikh was shadowing astern of Bismarck when the
          German ship turned and opened fire on her. She turned to port intending
          to fire torpedoes, but the torpedo control officer's view was obscured
          by shell splashes, the attack could not be made, and she withdrew to the
          southward. Two hours later, at 0218, she fired four torpedoes at the
          stopped battleship, recorded as "it is believed that one hit was
          obtained". She kept radar contact until 0359. Four torpedoes gone in
          one salvo - that is what having a single tube set actually meant.
      src: [naval-history-sikh, uboat-cossack]

    - heading: 一份「相信命中」的记录，不是确认战果
      text:
        zh: >-
          上面那句是来源的原话。战后对俾斯麦残骸的调查一般认为，
          驱逐舰在 1941 年 5 月 26/27 日夜间的雷击没有取得确认命中。
          这两件事不矛盾：夜暗、暴雨、一艘正在开火的战列舰周围的水柱，
          与战后逐条比对破口的清单，是两种不同强度的证据。
          本站把两种都写出来，不替读者裁决。
        en: >-
          That phrase is the source's own wording. Post-war examination of
          Bismarck's wreck is generally taken to show that the destroyers'
          torpedo attacks on the night of 26/27 May 1941 achieved no confirmed
          hits. The two are not contradictory: darkness, driving rain and shell
          splashes around a firing battleship on one hand, and a post-war list of
          individual holes on the other, are evidence of two different strengths.
          Both are recorded here without adjudicating for the reader.
      src: [naval-history-sikh, uboat-cossack]

    - heading: 托布鲁克：六发炮弹
      text:
        zh: >-
          1942 年 9 月 13/14 日夜，本舰与祖鲁人号各载一支皇家海军陆战队分队，
          在托布鲁克用小艇送人上岸（Operation Agreement）。
          五时零五分，在接运部队时岸上探照灯突然照住了本舰。
          祖鲁人号先退开，再以舰首切入光束吸引火力，岸防炮随即开火。
          第一发 88 毫米炮弹在齿轮舱爆炸，打坏了润滑供油系统与操舵装置；
          第二发在前部爆炸，引爆了 A 炮的待发弹药架，
          正在登舰的陆战队员死伤大半，并困住了更多在住舱甲板待命的人；
          第三发击中测距指挥仪，此后全部火炮只能本地控制。
          舰以 10 节打转并持续减速。
        en: >-
          On the night of 13/14 September 1942 Sikh and Zulu, each carrying a
          detachment of Royal Marines, put them ashore by boat at Tobruk
          (Operation Agreement). At 0505, while recovering troops, a shore
          searchlight suddenly held Sikh. Zulu first moved away, then came in bow
          first into the beam to draw fire, and the coastal batteries opened.
          The first 88 mm shell exploded in the gear room, wrecking the
          lubrication feed and the steering gear; the second burst forward,
          detonating the ready-use locker for A gun, killing and maiming the
          Marines who had just been embarked and trapping more waiting in the
          messdecks; the third struck the rangefinder director, after which every
          gun had to fire under local control. She was steaming in circles at ten
          knots and getting slower.
      src: [uboat-sikh, naval-history-sikh]

    - heading: 最后三发，与自沉
      text:
        zh: >-
          第四发在拖带中命中了 Y 炮座周围的发射药，艉部再次大火；
          第五发击中 B 炮座，炮组全员阵亡，其他人补位继续射击；
          第六发在拖带准备阶段击毁了舰桥 —— 舰长 Micklethwait 当时正在
          前甲板监督拖带作业。祖鲁人号的拖缆两次被炮弹打断，
          第二次就在它准备起拖的时候；祖鲁人号放下烟幕、两次试图靠帮接人，
          都因炮火过密被令撤离。舰长最终下令引爆破舱阀，淹没机舱与锅炉舱，
          做最后一次全舰巡查后离舰。舰体向右倾覆，
          在 32°05'N 24°00'E 沉没，沉没过程中仍在持续中弹。
          生还者全部被俘 —— 阵亡数两个主力来源都没有给出。
        en: >-
          The fourth shell, during the towing attempt, set off the charges around
          Y mounting and started another bad fire aft; the fifth struck B
          mounting and killed its crew, others taking their places and the guns
          continuing to fire; the sixth smashed the bridge during the towing
          preparations, with Captain Micklethwait forward supervising them at the
          time. Zulu's towline was severed twice, the second time as she was
          getting under way; Zulu laid smoke and twice tried to come alongside for
          the crew and was each time ordered away. The captain finally fired the
          scuttling charges, flooding the engine and boiler rooms, made a final
          tour of the ship and left. She heeled to starboard and sank at 32°05'N
          24°00'E while still being hit. Every survivor was taken prisoner -
          neither of the two principal sources gives a death toll.
      src: [uboat-sikh, naval-history-sikh]

    - heading: 一处需要更正的记载
      text:
        zh: >-
          naval-history 的本舰页把沉没位置写成 32°05'N 42°00'E。
          经度 42 度在托布鲁克以东很远、深入埃及内陆，
          而同一页写的是「在托布鲁克外海」。navypedia 与 uboat.net 都记
          24°00'E，与托布鲁克的实际经度吻合。本站采用 24°00'E，
          42°00'E 记为转录错误。
          同一页还有一处笔误：把 1941 年初的改装写成
          「单装 4.7 英寸炮换成双联 4 英寸炮座」，而本级根本没有单装
          4.7 英寸炮 —— 同级两艘的同一改装，该站都写作
          「X 炮座的双联 4.7 英寸换成双联 4 英寸」。
        en: >-
          Naval-History's page for this ship gives the sinking position as
          32°05'N 42°00'E. A longitude of 42 east lies far beyond Tobruk,
          deep inside Egypt, while the same page says she sank off Tobruk.
          Navypedia and Uboat.net both give 24°00'E, which matches Tobruk's
          actual longitude. 24°00'E is used here and 42°00'E is recorded as a
          transcription error. The same page contains a second slip: it describes
          the early 1941 refit as replacing a single 4.7-inch gun with a twin
          4-inch mounting, when the class never carried a single 4.7-inch gun -
          the same refit on two sister ships is described on that site as
          replacing the twin 4.7-inch in X with a twin 4-inch.
      src: [naval-history-sikh, navypedia-tribal, uboat-sikh]

history:
  - id: build
    title: { zh: 建造, en: Building }
    range: { from: 1936, to: 1938 }
    events:
      - date: 1936-06-19
        text:
          zh: 在 1936 年造舰计划下向 A. Stephen & Sons（Govan）下单。
          en: Ordered from A. Stephen & Sons, Govan, under the 1936 Build Programme.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1936-09-24
        text:
          zh: 开工。
          en: Laid down.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1937-12-17
        text:
          zh: 下水。
          en: Launched.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1938-10-12
        text:
          zh: 服役，编入第 1 部族驱逐舰分队，任资深军官舰；舷号 L82。
          en: >-
            Commissioned into the 1st Tribal Destroyer Flotilla as senior
            officer's ship; pennant L82.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1938-11-02
        text:
          zh: 建造完工（服役一个月之后）。
          en: Build completed, a month after commissioning.
        src: [uboat-sikh]

  - id: early
    title: { zh: 战前与挪威, en: Pre-war and Norway }
    range: { from: 1938, to: 1940 }
    events:
      - date: 1938-11-15
        text:
          zh: 运送罗马尼亚国王 Carol 与王储 Michael 赴多佛（国事访问）。
          en: >-
            Embarked King Carol and Crown Prince Michael of Romania at Boulogne
            for passage to Dover on an official visit.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1939-03-21
        text:
          zh: 赴西班牙卡塔赫纳接运西班牙内战难民。
          en: Sailed to Cartagena, Spain, to embark refugees from the Civil War.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1940-04
        text:
          zh: 参加挪威战役，在纳姆索斯外海几乎持续遭空袭。
          en: >-
            Took part in the Norwegian campaign, under almost continuous air
            attack off Namsos.
        src: [naval-history-sikh, uboat-sikh]
      - date: 1940-10-16
        text:
          zh: 夜航中 Fame 与 Ashanti 在 Whitburn 抢滩，本舰险些跟进。
          en: >-
            On the night of 16/17 October Fame and Ashanti ran aground at
            Whitburn and Sikh narrowly avoided following them.
        src: [uboat-sikh]

  - id: refit
    title: { zh: 改装与俾斯麦, en: Refit and Bismarck }
    range: { from: 1941-01, to: 1941-05 }
    events:
      - date: 1941-01-06
        text:
          zh: >-
            与 Mashona 在出斯卡帕湾时相撞受损，入 Henry Robb（利斯）修理并改装：
            X 炮座的双联 4.7 英寸换为双联 4 英寸高平两用炮座，装 286M 型雷达。
          en: >-
            Collided with Mashona while leaving Scapa Flow and went into Henry
            Robb's yard at Leith for repair and refit: the twin 4.7-inch in X
            replaced by a twin 4-inch HA mounting, and Type 286M radar fitted.
        src: [naval-history-sikh]
      - date: 1941-05-22
        text:
          zh: 在克莱德加入运兵船队 WS8B 担任近程护航。
          en: Joined troopship convoy WS8B in the Clyde as local escort.
        src: [naval-history-sikh]
      - date: 1941-05-27
        text:
          zh: >-
            0020 攻击受阻（视线被弹幕水柱遮挡）；0218 对停车的俾斯麦齐射四条鱼雷，
            来源写「相信获得一次命中」（one hit believed obtained）。
          en: >-
            At 0020 the attack was blocked when the torpedo control officer's
            view was obscured by shell splashes; at 0218 fired four torpedoes at
            the stopped Bismarck, one hit believed obtained.
        src: [naval-history-sikh, uboat-cossack]

  - id: mediterranean
    title: { zh: 地中海, en: The Mediterranean }
    range: { from: 1941-06, to: 1942-08 }
    events:
      - date: 1941-12-13
        text:
          zh: >-
            邦角夜战：与 Maori、Legion、荷兰 Isaac Sweers 一同击沉意大利轻巡洋舰
            Alberico da Barbiano 与 Alberto di Guissano。
          en: >-
            Night action off Cape Bon: with Maori, Legion and the Dutch Isaac
            Sweers, sank the Italian light cruisers Alberico da Barbiano and
            Alberto di Guissano.
        src: [naval-history-sikh, naval-history-maori]
      - date: 1942-01-18
        text:
          zh: 参加 MF3 行动；护航中姊妹舰 Gurkha 于 1 月 17 日被 U-133 击沉。
          en: >-
            Took part in Operation MF3; during the escort her sister Gurkha was
            torpedoed and sunk by U-133 on 17 January.
        src: [naval-history-sikh]
      - date: 1942-06-15
        text:
          zh: >-
            VIGOROUS 行动（亚历山大—马耳他运输）因岸上指令反复与弹药消耗过大而中止。
          en: >-
            Operation Vigorous, the Alexandria-to-Malta run, was abandoned after
            conflicting instructions from ashore and heavy expenditure of AA
            ammunition.
        src: [naval-history-sikh]
      - date: 1942-08-04
        text:
          zh: 与 Zulu、Croome、Tetcott 及 RAF 221 中队一架飞机分享击沉 U-372 的战果。
          en: >-
            Shared credit with Zulu, Croome, Tetcott and an RAF 221 Squadron
            aircraft for sinking U-372.
        src: [naval-history-sikh, naval-history-zulu]

  - id: loss
    title: { zh: 托布鲁克与沉没, en: Tobruk and loss }
    range: { from: 1942-09, to: 1942-09 }
    events:
      - date: 1942-09-11
        text:
          zh: 搭载皇家海军陆战队分队，为托布鲁克突袭做准备。
          en: Embarked a detachment of Royal Marines for the Tobruk raid.
        src: [naval-history-sikh]
      - date: 1942-09-13
        text:
          zh: >-
            与 Zulu、Aldenham、Beaufort、Exmoor、Hurworth 一同在托布鲁克
            用小艇送陆战队登岸（Operation Agreement）。
          en: >-
            With Zulu, Aldenham, Beaufort, Exmoor and Hurworth, put Royal
            Marines ashore by boat at Tobruk, Operation Agreement.
        src: [naval-history-sikh]
      - date: 1942-09-14
        text:
          zh: >-
            0505 在接运部队时被岸上探照灯照住，遭德国岸防炮连续命中六发 88 mm
            炮弹；拖带失败后舰长下令自沉，生还者全部被俘。
          en: >-
            At 0505, while recovering troops, caught in a shore searchlight and
            hit six times by 88 mm shells from German coastal batteries; after
            the tow failed her captain ordered her scuttled, and every survivor
            was taken prisoner.
        src: [naval-history-sikh, uboat-sikh]
