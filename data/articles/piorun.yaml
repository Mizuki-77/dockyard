# ============================================================================
# 舰艇正文 —— 闪电号（ORP Piorun）
#
# 本舰正文的抓手是「一艘借来的船，打了一场不属于她能打的仗」。
#
# 【为什么这艘小舰值得单独写】
#   她是波兰海军二战最出名的一艘舰，靠的是 1941-05-26 夜里那一小时：
#   一艘 1,773 吨的驱逐舰，跑到距德国战列舰 13,500 码处开了三炮齐射。
#   这件事的军事意义接近于零（4.7 英寸炮弹打不穿 320 mm 装甲带），
#   但它是被占领国家的一支流亡海军能在战场上做出的最直接的表态。
#
# 【正文要守住的三条线】
#   1) 开火距离是 13,500 码，不是流传的 3,500 码 —— 有一手战报。
#   2) 双方都没命中 —— 一手战报明写两舰均未被命中。
#   3) 她不在 05-27 上午的最终战现场 —— 0500 被命令返航，0700 离开战区。
#
# 【有争议的地方怎么处理】
#   「I am a Pole」/「三齐射向波兰致敬」这两个说法都只有二手转述，
#   正文写成「两类记载并存」，各给来源，不下结论。
# ============================================================================
ship: piorun
updated: 2026-11-22

intro:
  lead:
    zh: >-
      闪电号是波兰海军在二战中最出名的一艘军舰，而这份名气全部来自
      1941 年 5 月 26 日夜里的一小时。她是追猎俾斯麦的驱逐舰群里
      第一艘发现德国战列舰的舰，也是唯一一艘开到距它 13,500 码处
      开火对射的波兰军舰。第二天上午皇家海军主力把俾斯麦打成废铁时，
      她已经因为燃油将尽被命令返航，不在战场上。
    en: >-
      ORP Piorun is the best known ship of the Polish Navy in the Second
      World War, and that reputation rests entirely on one hour on the night
      of 26 May 1941. She was the first of the hunting destroyers to sight the
      German battleship, and the only Polish warship to close to 13,500 yards
      and open fire on her. By the time the British battlefleet reduced
      Bismarck to a wreck the next morning, Piorun had been ordered home with
      her fuel nearly gone and was no longer on the scene.

  paragraphs:
    - heading: 一艘借来的船
      text:
        zh: >-
          闪电号原本不叫这个名字，也不是波兰的船。她 1939 年 7 月 26 日
          以 HMS Nerissa 的名义在克莱德河畔的 John Brown 船厂开工，
          是英国皇家海军 N 级驱逐舰的第八艘。转折发生在 1940 年 5 月 4 日：
          波兰驱逐舰闪电号的姊妹舰雷霆号（ORP Grom）在挪威的罗姆巴肯峡湾
          被德国飞机炸沉。几天后英国海军部致函波兰海军，表示愿意从在建舰中
          拨一艘补上这个缺口。选中的就是 Nerissa。

          所以这艘舰上从一开始就有一个特殊之处：舰员几乎全是从雷霆号上
          活下来的人。她们接手的不是一艘新船，是一份继承。
        en: >-
          She was not built as Piorun and she was not a Polish ship. She was
          laid down on 26 July 1939 on the Clyde as HMS Nerissa, the eighth of
          the Royal Navy's N-class destroyers. The turn came on 4 May 1940,
          when the Polish destroyer ORP Grom was bombed and sunk in Rombaken
          Fjord, Norway. Days later the British Admiralty wrote to the Polish
          Navy offering one of the destroyers under construction to fill the
          gap. The ship chosen was Nerissa.

          From the start there was something particular about her crew: nearly
          all of them were survivors of Grom. What they took over was not a new
          ship but an inheritance.
      src: [naval-history-nerissa, facta-nautica-piorun]

    - heading: 交接只有两天，但这两天必须说清
      text:
        zh: >-
          1940 年 11 月 4 日，波兰方面在格里诺克锚地签署接船验收书，
          舰长帕瓦夫斯基（kmdr por. Eugeniusz Pławski）后来回忆，
          船厂副总经理握了握他的手说了一句「She is yours. Good luck to you!」，
          仪式就结束了。第二天上午九点，波兰海军旗升起，她正式编入波兰海军，
          得名 ORP Piorun——波兰语「闪电」。

          需要说明的是产权：这是借调，不是转让。1939 年 11 月 18 日的
          英波海军合作协定写明借调舰仍属英国政府财产。这一点不是程序细节，
          它直接决定了六年之后她必须被还回去。
        en: >-
          On 4 November 1940 the Polish side signed the acceptance papers at
          anchor off Greenock. Her commanding officer, Commander Eugeniusz
          Pławski, later recalled that the yard's deputy director shook his
          hand, said "She is yours. Good luck to you!", and that was the end of
          the ceremony. At nine the next morning the Polish ensign went up, she
          was formally taken into the Polish Navy, and she was named ORP
          Piorun - Polish for thunderbolt.

          Ownership is the point worth stating: this was a loan, not a
          transfer. The Anglo-Polish naval agreement of 18 November 1939
          provided that ships lent this way remained the property of the
          British government. That is not a procedural footnote; it is the
          reason she had to be given back six years later.
      src: [facta-nautica-piorun, naval-history-nerissa]

    - heading: 一万三千五百码，不是三千五百码
      text:
        zh: >-
          关于这一夜流传最广的一个数字是错的。很多叙述说她开到距俾斯麦
          「约 3,500 码」的极近距离才开火。一手战报不是这么写的：
          托维上将的正式战报（1947 年 10 月刊于《伦敦公报》增刊）原文为
          「Piorun 接近后自 13,500 码开火，发射三次齐射后，被一发落点距
          舷侧约 20 码的齐射夹叉」。

          13,500 码约合 12,340 米、6.7 海里。这个距离上，一门 4.7 英寸炮
          的对手是一艘正在用 15 英寸主炮和 6 英寸副炮还击的战列舰。
          一手战报还明确记了一句：德舰火力「准得令人不愉快」，
          但两艘驱逐舰都没有被实际命中。
        en: >-
          The most widely repeated number about that night is wrong. Many
          accounts have her closing to "about 3,500 yards" before opening fire.
          The primary despatch does not say that: Admiral Tovey's official
          report, published in the London Gazette supplement of October 1947,
          reads that Piorun "closed the range and herself opened fire from
          13500 yards but after firing three salvoes, she was straddled by a
          salvo which fell about 20 yards from the ships side".

          13,500 yards is roughly 12,340 metres, or 6.7 nautical miles. At that
          range a 4.7-inch gun was up against a battleship answering with
          15-inch main and 6-inch secondary armament. The same despatch records
          that the German fire was "unpleasantly accurate" and that neither
          destroyer was actually hit.
      src: [london-gazette-38098, uboat-piorun]

    - heading: 她不在第二天上午的战场上
      text:
        zh: >-
          5 月 27 日清晨五点，第 4 驱逐舰分队指挥官维安上校下令闪电号返航：
          她的燃油已经不够再打下去。战报原文是「若非仍与敌接触，即前往
          Plymouth 加油」。帕瓦夫斯基不服，又搜了一个小时，六点才转向，
          七点离开战区。皇家海军主力是在八点四十五分之后才与俾斯麦交火的。

          所以「闪电号参加了击沉俾斯麦的战斗」这句话，准确的说法是：
          她参加了这一役的夜间追击与接触阶段，没有参加次日上午的炮战。
          本站的战役页把她列在参战名单里，指的也是前一个阶段。
          她 5 月 28 日抵港时油舱只剩约 37 吨，因缺油向一侧倾斜十余度，
          在码头围观者看来像是挨了打。
        en: >-
          At five on the morning of 27 May Captain Vian, commanding the 4th
          Destroyer Flotilla, ordered Piorun home: she no longer had the fuel
          to stay. The despatch wording is that she was to "proceed to Plymouth
          to fuel if not in contact with the enemy". Pławski was reluctant,
          searched for another hour, turned at six and left the area at seven.
          The British battlefleet did not open fire on Bismarck until after 0845.

          So the claim that Piorun "took part in the sinking of Bismarck" is
          accurate only in the sense that she took part in the night shadowing
          and contact phase, not in the battlefleet action the next morning.
          She reached port on 28 May with about 37 tons of fuel left and a list
          of ten to fifteen degrees from the empty tanks, which to onlookers on
          the quay made her look as though she had been hit.
      src: [london-gazette-38098, uboat-piorun]

    - heading: 两句话，两类记载
      text:
        zh: >-
          关于开火前帕瓦夫斯基说了什么，有两类并存的记载，本站不裁决。

          一类说他对德舰发出「我是波兰人」（I am a Pole）的信号，
          这一说法被记录在奥斯威辛一号营的展览说明里。另一类说他下达的
          开火口令是「三齐射，向波兰致敬」（Trzy salwy na cześć Polski）。
          还有一说认为整场交火期间信号兵一直在用信号灯重复「我是波兰人」，
          但这一条在英文资料里被明确标注为需要引证，属可能的小说化加工。

          需要说明的是：帕瓦夫斯基确实在交火中持续发报报告德舰位置，
          这部分有一手战报支持。至于口令的原话，目前能追到的都是回忆与
          转述，没有原始信号记录。
        en: >-
          Two families of account exist about what Pławski said before opening
          fire, and this site does not adjudicate between them.

          One holds that he signalled "I am a Pole" to the German ship, a
          version recorded in the exhibition text at Auschwitz I. The other
          holds that his order to open fire was "Trzy salwy na cześć Polski" -
          three salvoes in honour of Poland. A further variant has the
          signalman repeating "I am a Pole" by lamp throughout the engagement,
          but that one is explicitly flagged in English-language sources as
          needing a citation, and reads as embellishment.

          What the primary despatch does support is that Pławski kept
          transmitting position reports during the action. The exact wording of
          the order survives only in reminiscence and secondary retelling; no
          original signal log has been produced.
      src: [uboat-piorun, london-gazette-38098]

    - heading: 之后还有四年战争
      text:
        zh: >-
          俾斯麦这一夜之后，闪电号还有四年仗要打，而且打得不轻松。
          1941 年 9 月她参加向马耳他运送补给的「戟」行动（Operation Halberd），
          在那次行动里纳尔逊号被鱼雷命中，是她把这条受伤的战列舰护回直布罗陀。
          1942 年主要在大西洋护航，其间按 N 级统一方案改装：拆掉 4 英寸高炮，
          装回第二座五联鱼雷发射管。

          1943 年转地中海，参加西西里登陆、卡拉布里亚登陆与萨勒诺登陆，
          并在 7 月 21 日随轻兵力编队炮击克罗托内。1944 年回到本土，
          参加诺曼底登陆的海峡巡逻，6 月 9 日在乌尚特海战中参与击沉
          ZH1、逼沉 Z32；6 月 13 日在泽西海域与阿善提号一起打垮一支
          德国扫雷分队，本舰被命中两次、四人受伤。8 月 12 至 13 日，
          她在比斯开湾用一条鱼雷击沉德国破雷舰 Sperrbrecher 7 ——
          7,067 总吨，是波兰海军水面舰在二战中击沉的最大一艘船。
        en: >-
          After the night of Bismarck there were still four years of war, and
          they were not light ones. In September 1941 she took part in
          Operation Halberd, the Malta relief run, during which Nelson was
          torpedoed; it was Piorun that escorted the damaged battleship back to
          Gibraltar. Through 1942 she was mostly on Atlantic convoy duty, and
          was modified to the standard N-class scheme, losing her 4-inch AA gun
          and shipping a second quintuple torpedo mount.

          In 1943 she moved to the Mediterranean for the Sicily, Calabria and
          Salerno landings, and on 21 July was with the light force that
          bombarded Crotone. In 1944 she returned home for the Normandy channel
          patrols: on 9 June she helped sink ZH1 and drive Z32 ashore at the
          Battle of Ushant, and on 13 June off Jersey, with Ashanti, she helped
          break a German minesweeper force, taking two hits and four wounded.
          On 12-13 August in the Bay of Biscay she sank the German mine
          destructor ship Sperrbrecher 7 with a torpedo - 7,067 gross tons, the
          largest vessel sunk by a Polish surface ship in the war.
      src: [naval-history-nerissa, muzeum-ushant, naval-history-aurora]

    - heading: 还回去，然后拆掉
      text:
        zh: >-
          战争结束后她还有一段不常见的差事：1945 年 11 月起参加「死光」行动
          （Operation Deadlight），处置投降的德国潜艇，专门负责用火炮击沉
          那些拖缆断裂或自沉装药失效的艇。同时她还以「应急驱逐舰」身份
          往丹麦、挪威、荷兰、法国运送人道援助物资。

          1946 年 9 月 28 日上午十一点半，她在哈里奇降下波兰旗，
          退出波兰海军编制，归还英国，改名 HMS Noble。波兰旗下累计航程
          218,000 海里，护航 81 个编队。归还后她在哈里奇封存了约两年，
          1953 年转查塔姆后备舰队，曾被选定改装为 16 型反潜护卫舰但未实施，
          1955 年 9 月售予英国钢铁公司拆船部，12 月 2 日拖到泰恩河畔的
          Dunston，由 Clayton & Davie 拆解。

          有一个数字值得单独留下：在波兰旗下服役的近六年里，
          没有一名舰员在她的舰上阵亡。她的舰员叫她「幸运舰」。
        en: >-
          After the war she had an unusual last job: from November 1945 she took
          part in Operation Deadlight, the disposal of surrendered U-boats,
          tasked specifically with sinking by gunfire those that broke their
          tow or whose scuttling charges failed. At the same time she served as
          an emergency destroyer carrying humanitarian relief to Denmark,
          Norway, the Netherlands and France.

          At 11.30 on 28 September 1946 she struck the Polish ensign at
          Harwich, left the Polish Navy and was returned to Britain as HMS
          Noble. Under the Polish flag she had steamed 218,000 miles and
          escorted 81 convoys. Afterwards she lay in reserve at Harwich for
          about two years, moved to the Chatham reserve fleet in 1953, was
          selected for conversion to a Type 16 anti-submarine frigate but the
          work was never done, was sold to BISCO in September 1955 and was
          towed to Dunston on the Tyne on 2 December, where Clayton & Davie
          broke her up.

          One figure deserves to be kept separately: in nearly six years under
          the Polish flag, not one of her crew was killed aboard her. Her
          sailors called her a lucky ship.
      src: [naval-history-nerissa, polishforces-deadlight]

history:
  - id: build
    title: { zh: 建造与转交波兰, en: Building and transfer to Poland }
    range: { from: 1939, to: 1940 }
    events:
      - date: 1939-04-15
        text:
          zh: 皇家海军下订 N 级八舰，本舰为其中之一，厂号 563。
          en: >-
            The Royal Navy ordered the eight ships of the N class, including
            this one, yard number 563.
        src: [navypedia-piorun, uboat-piorun]
      - date: 1939-07-26
        text:
          zh: 在 John Brown & Company（Clydebank）开工，当时舰名 HMS Nerissa。
          en: >-
            Laid down at John Brown & Company, Clydebank, as HMS Nerissa.
        src: [navypedia-piorun, naval-history-nerissa]
      - date: 1940-05-04
        text:
          zh: >-
            波兰驱逐舰雷霆号（ORP Grom）在挪威罗姆巴肯峡湾被德国飞机炸沉。
            此后英国海军部决定从在建舰中拨一艘补给波兰海军。
          en: >-
            The Polish destroyer ORP Grom was bombed and sunk in Rombaken
            Fjord, Norway. The Admiralty subsequently decided to make good the
            loss from ships under construction.
        src: [naval-history-nerissa, facta-nautica-piorun]
      - date: 1940-05-07
        text:
          zh: 下水，下水时仍名 Nerissa。
          en: Launched, still under the name Nerissa.
        src: [navypedia-piorun, uboat-piorun]
      - date: 1940-10
        text:
          zh: >-
            转交波兰海军。舰员自 10 月 24 日起按 Nerissa 编制在册，
            多数为雷霆号幸存者，指挥官帕瓦夫斯基。
          en: >-
            Transferred to the Polish Navy. Her crew was borne on Nerissa's
            books from 24 October, mostly survivors of Grom, under Commander
            Pławski.
        src: [navypedia-piorun, facta-nautica-piorun]
      - date: 1940-11-04
        text:
          zh: 在格里诺克签署接船验收书，同日算建成。
          en: >-
            Acceptance papers signed at Greenock; build completion the same day.
        src: [facta-nautica-piorun, uboat-piorun]
      - date: 1940-11-05
        text:
          zh: >-
            上午九时升波兰海军旗，正式编入波兰海军，得名 ORP Piorun。
            此事实由波兰海军 1940-11-13 第 20 号密令追认。
          en: >-
            At 09:00 the Polish ensign was hoisted, the ship was formally taken
            into the Polish Navy and named ORP Piorun, confirmed by Polish naval
            secret order no. 20 of 13 November 1940.
        src: [facta-nautica-piorun]

  - id: bismarck
    title: { zh: 追猎俾斯麦（1941 年 5 月）, en: The hunt for Bismarck, May 1941 }
    range: { from: 1941-05, to: 1941-05 }
    events:
      - date: 1941-05-22
        text:
          zh: >-
            随第 4 驱逐舰分队（旗舰 HMS Cossack，维安上校）加入运兵船队
            WS8B 的本地护航。
          en: >-
            Joined the local escort of troop convoy WS8B with the 4th Destroyer
            Flotilla under Captain Vian in HMS Cossack.
        src: [naval-history-nerissa, uboat-piorun]
      - date: 1941-05-25
        text:
          zh: 分队脱离船队，转去参加对俾斯麦的搜寻。
          en: >-
            The flotilla was detached from the convoy to join the search for
            Bismarck.
        src: [naval-history-nerissa, london-gazette-38098]
      - date: 1941-05-26
        text:
          zh: >-
            2238 在编队左翼首先发现俾斯麦，报距 9 海里、方位 145°。
            2242 德舰以主炮与副炮向本舰与 Maori 开火。
          en: >-
            At 2238, on the port wing of the formation, she was the first to
            sight Bismarck, reporting her nine nautical miles distant on
            bearing 145. At 2242 the German ship opened heavy fire with main
            and secondary armament on Piorun and Maori.
        src: [london-gazette-38098, uboat-piorun]
      - date: 1941-05-26
        text:
          zh: >-
            接近至 13,500 码开火，发射三次齐射后被一发落点距舷侧约 20 码的
            齐射夹叉，随即停火、左转、施放烟幕脱离。此后在德舰火力下约一小时，
            未被命中；2355 失去接触。
          en: >-
            Closed to 13,500 yards and opened fire; after three salvoes she was
            straddled by a salvo falling about 20 yards from her side, ceased
            fire, turned away to port under smoke, and remained under fire for
            about an hour without being hit. Contact was lost at 2355.
        src: [london-gazette-38098]
      - date: 1941-05-27
        text:
          zh: >-
            0500 因燃油将尽被维安上校命令返航。她继续搜寻至 0600，0700 离开
            战区，因此未参加当日上午皇家海军主力对俾斯麦的炮战。
          en: >-
            At 0500, short of fuel, she was ordered by Captain Vian to proceed
            to Plymouth. She continued searching until 0600 and left an hour
            later, and so was not present for the battlefleet action that
            morning.
        src: [london-gazette-38098, uboat-piorun]
      - date: 1941-05-28
        text:
          zh: 抵港，油舱仅剩约 37 吨（一说 30 吨），因缺油向一侧倾斜十余度。
          en: >-
            Reached port with only about 37 tons of fuel remaining (one account
            says 30), listing ten to fifteen degrees from the empty tanks.
        src: [uboat-piorun]

  - id: atlantic
    title: { zh: 大西洋与地中海（1941-1942）, en: Atlantic and Mediterranean, 1941-42 }
    range: { from: 1941-06, to: 1942-12 }
    events:
      - date: 1941-09-17
        text:
          zh: >-
            参加「戟」行动（Operation Halberd），为纳尔逊号、罗德尼号、
            威尔士亲王号与皇家方舟号提供屏护，护送马耳他补给船队。
          en: >-
            Took part in Operation Halberd, screening Nelson, Rodney, Prince of
            Wales and Ark Royal for the Malta supply convoy.
        src: [naval-history-nerissa]
      - date: 1941-09-27
        text:
          zh: >-
            意军鱼雷机空袭中纳尔逊号被命中一条鱼雷，本舰随后被派去专门护卫
            这艘受损的战列舰返回直布罗陀。
          en: >-
            Nelson was torpedoed during Italian torpedo-bomber attacks; Piorun
            was then detached to escort the damaged battleship back to
            Gibraltar.
        src: [naval-history-nerissa]
      - date: 1942-10-01
        text:
          zh: >-
            进邓迪商船厂改装：拆 4 英寸高炮、装回第二座五联鱼雷发射管，
            20 mm 厄利孔部分改双联，换装新型雷达。
          en: >-
            Entered a Dundee commercial yard for modification: the 4-inch AA gun
            came out, a second quintuple torpedo mount went back, some Oerlikons
            were paired, and new radar was fitted.
        src: [naval-history-nerissa, navypedia-jkn]

  - id: mediterranean
    title: { zh: 地中海登陆战（1943）, en: The Mediterranean landings, 1943 }
    range: { from: 1943-06, to: 1943-11 }
    events:
      - date: 1943-07-12
        text:
          zh: >-
            参加西西里登陆（Operation Husky），在掩护兵力屏护序列中，
            任务是阻止意大利舰队干扰登陆。
          en: >-
            Took part in Operation Husky in the Covering Force screen, tasked
            with preventing interference by Italian fleet units.
        src: [naval-history-nerissa]
      - date: 1943-07-21
        text:
          zh: >-
            随轻兵力编队炮击卡拉布里亚的克罗托内。同一天奥罗拉号与佩内洛普号
            也在该地实施炮击，本舰属该编队的驱逐舰屏护。
          en: >-
            Took part in the bombardment of Crotone in Calabria; the cruisers
            Aurora and Penelope also bombarded Crotone that day and Piorun was
            in that force's destroyer screen.
        src: [naval-history-aurora, naval-history-nerissa]
      - date: 1943-08-31
        text:
          zh: >-
            参加卡拉布里亚登陆前的沿岸炮击，目标为雷焦卡拉布里亚至佩萨罗之间
            的海岸（Operation Baytown）。
          en: >-
            Bombarded the coast between Reggio Calabria and Pessaro ahead of the
            Calabria landings (Operation Baytown).
        src: [naval-history-nerissa]
      - date: 1943-09-09
        text:
          zh: >-
            参加萨勒诺登陆（Operation Avalanche），为纳尔逊号、罗德尼号、
            勇士号与厌战号提供屏护与炮火支援。
          en: >-
            Took part in Operation Avalanche at Salerno, screening and supporting
            Nelson, Rodney, Valiant and Warspite.
        src: [naval-history-nerissa]

  - id: normandy
    title: { zh: 诺曼底与比斯开湾（1944）, en: Normandy and the Bay of Biscay, 1944 }
    range: { from: 1944-05, to: 1944-10 }
    events:
      - date: 1944-05-21
        text:
          zh: >-
            转第 10 驱逐舰分队（普利茅斯），准备诺曼底登陆的海峡作战
            （Operation Neptune）。
          en: >-
            Transferred to the 10th Destroyer Flotilla at Plymouth in preparation
            for Operation Neptune.
        src: [naval-history-nerissa]
      - date: 1944-06-06
        text:
          zh: >-
            登陆日当天在西南航道巡逻，任务是拦截可能出击的德国驱逐舰，
            防止其干扰登陆编队。
          en: >-
            Patrolled the South-Western Approaches on D-Day to prevent
            interference by German destroyers with the assault shipping.
        src: [naval-history-nerissa]
      - date: 1944-06-09
        text:
          zh: >-
            乌尚特海战：与 Tartar、Ashanti、Eskimo、Haida、Huron、Javelin
            及闪电号的同乡 Błyskawica 一起拦截德国第 8 驱逐舰分队，
            ZH1 被击沉、Z32 搁浅报废、Z24 与 T24 带伤退回布雷斯特。
          en: >-
            Battle of Ushant: with Tartar, Ashanti, Eskimo, Haida, Huron,
            Javelin and the Polish Błyskawica, intercepted the German 8th
            Destroyer Flotilla. ZH1 was sunk, Z32 driven ashore and wrecked,
            Z24 and T24 withdrew damaged to Brest.
        src: [naval-history-nerissa, muzeum-ushant]
      - date: 1944-06-13
        text:
          zh: >-
            泽西海战：与阿善提号一起攻击一支德国扫雷分队。战斗中本舰被命中两次、
            四人受伤，艏部弹药库起火被舰员扑灭；德方三艘沉没。
          en: >-
            Battle of Jersey: with Ashanti, attacked a German minesweeper force.
            Piorun was hit twice and suffered four wounded, with a forecastle
            magazine fire extinguished by her crew; three German ships were
            sunk.
        src: [naval-history-nerissa, junobeach-piorun]
      - date: 1944-08-12
        text:
          zh: >-
            在比斯开湾随 Force 28（巡洋舰 Diadem、驱逐舰 Onslow）击沉德国
            破雷舰 Sperrbrecher 7（原商船 Sauerland，7,067 总吨）。
            本舰发射的一条鱼雷命中舯部偏后，该舰 16:30 沉没。
          en: >-
            In the Bay of Biscay with Force 28 (the cruiser Diadem and the
            destroyer Onslow), sank the German mine destructor ship Sperrbrecher
            7, ex-merchantman Sauerland, of 7,067 gross tons. One torpedo from
            Piorun hit her just abaft midships and she went down at 16:30.
        src: [naval-history-nerissa]

  - id: aftermath
    title: { zh: 战后与拆解（1945-1955）, en: Post-war and disposal, 1945-55 }
    range: { from: 1945, to: 1955 }
    events:
      - date: 1945-11
        text:
          zh: >-
            参加「死光」行动（Operation Deadlight），编在第 17 驱逐舰分队，
            任火炮处置舰，负责击沉拖缆断裂或自沉装药失效的德国潜艇。
          en: >-
            Took part in Operation Deadlight with the 17th Destroyer Flotilla as
            a gunfire disposal ship, sinking U-boats that broke tow or whose
            scuttling charges failed.
        src: [polishforces-deadlight]
      - date: 1946-09-28
        text:
          zh: >-
            11:30 在哈里奇降下波兰旗，退出波兰海军编制，归还英国并改名
            HMS Noble。波兰旗下累计航程 218,000 海里，护航 81 个编队。
          en: >-
            At 11:30 she struck the Polish ensign at Harwich, left the Polish
            Navy and was returned to Britain as HMS Noble. Under the Polish flag
            she had steamed 218,000 miles and escorted 81 convoys.
        src: [naval-history-nerissa, facta-nautica-piorun]
      - date: 1955-09
        text:
          zh: 售予英国钢铁公司拆船部（BISCO）。
          en: Sold to BISCO for demolition.
        src: [naval-history-nerissa]
      - date: 1955-12-02
        text:
          zh: 拖抵泰恩河畔 Dunston，由 Clayton & Davie Ltd. 拆解。
          en: Arrived at Dunston on the Tyne for breaking up by Clayton & Davie Ltd.
        src: [naval-history-nerissa, navypedia-piorun]
