ship: hosho
updated: 2026-11-23

intro:
  lead:
    zh: >-
      凤翔是世界上第一艘「从设计阶段起就作为航空母舰设计、并建成服役」的军舰。
      它 1922 年 12 月 27 日服役，比英国 Hermes 早 13 个月建成；
      此后二十三年里，它从日本航母部队的试验母舰，一路退成训练舰、防空炮台和复员运输船。
    en: >-
      Hōshō was the first warship in the world designed from the keel up as an aircraft carrier
      to be completed and commissioned. She entered service on 27 December 1922, thirteen months
      before Britain's Hermes, and over the next twenty-three years passed from experimental
      mother ship of Japanese carrier aviation to training carrier, anti-aircraft battery and
      repatriation transport.

  paragraphs:
    - heading: 「世界第一」到底第一在哪
      text:
        zh: >-
          这句话必须说得精确。全通式飞行甲板的第一艘是英国用货客船改装的 Argus；
          最早「按航母设计」开工的是英国 Hermes（1918 年 1 月动工），但它赶上一战结束、
          不必急造，反而落到凤翔后面。凤翔 1920 年 12 月在横浜鶴見的浅野造船所起工，
          1922 年 12 月 27 日服役，是这个类别里最早建成的。
          combinedfleet 的原文写得很干脆：HOSHO is the first purpose-built carrier commissioned
          in the world, 13 months before Royal Navy's HERMES。光人社《军舰》系列英译也给出同一判断：
          the world's first dedicated aircraft carrier HOSHO was commissioned by IJN in December 1922。
          但同一天 combinedfleet 还补了一句:However much of her aviation equipment is still lacking.
          建成不等于完备——它服役时大量航空设备还没装上。
      src: [combinedfleet-hosho-trom, kojinsha-vol6-carriers]

    - heading: 为什么一条本可以当特務船的船体变成了航母
      text:
        zh: >-
          凤翔的出身不是一张白纸。它计划时是特務船，japanese-warship 注出「建造当初は「龍飛」」——
          建造当初的舰名不是凤翔。日本海军最初想造的是像 HMS Campania 那样的水上机母舰，
          从舰首滑出飞机，载机 32 架，装四门 140mm 低角炮和四门 76mm 高炮；后来派去英国的观察员
          看到陆基飞机从舰上起降的价值，全套图纸推倒重画，改成接近 HMS Furious 1918 年
          加装后部飞行甲板时的样子。航速指标一开始定 30 节（要跟得上战列舰队），
          战后读了英国的报告又降到 25 节。英国顾问参与设计，日本还专门请英国技术人员
          协助建造、并指导舰载机运用。
          舰体最终长 168.25 m、水线宽 17.98 m，飞行甲板宽 22.62 m——
          naval-encyclopedia 对后者的评语是：那大约就是两架战斗机并排的宽度。
      src: [naval-encyclopedia-hosho, combinedfleet-hosho-trom, japanese-warship-hosho, hazegray-ijn-carriers]

    - heading: 一条试验舰，和它身上那些后来被全日本抄走的做法
      text:
        zh: >-
          凤翔服役头几年基本是日本航母事业的试验台：各种拦阻装置、光学助降装置、
          航母运用战术，都是在它身上试出来的。它自己却没少走弯路。
          竣工时右舷前部有个小舰岛，加三脚桅和吊车，飞行甲板前部还向下倾斜 5 度帮飞机加速；
          用下来发现舰岛对这么小的舰来说太大、位置又正好在甲板收窄处，起飞时挡路，倾斜段也毫无用处。
          1924 年 8 月出坞时，舰岛、三脚桅、吊车全部拆掉，甲板前部改成水平，
          飞行指挥挪到从甲板侧面向外伸出的平台上——日本航母此后二十年的「平甲板」传统，
          就是从这一次拆除开始的。它还有一处很特别的结构：前后机库完全隔开、互不相通，
          前部放战斗机，后部放攻击机、还分上下两段，靠各自的升降机进出。
          拦阻装置最初用的是英国式纵索——japanese-warship 记「【鳳翔】もイギリスも、
          索道索はこの縦索式を使っています」——后来才换成横索。
      src: [combinedfleet-hosho-trom, navypedia-hosho, japanese-warship-hosho]

    - heading: 它在二战里干了什么，没干什么
      text:
        zh: >-
          凤翔的二战战历很短，而且是配角。珍珠港那天它编在山本主力部队里，
          任务是接应从夏威夷返航的机动部队；中途岛时它仍在主力部队，
          夹在战列舰纵队之间、大和号左后方，整个作战期间与美军没有接触。
          它当时能飞的只有八架九六式舰攻 B4Y1——一款 1936 年起投产、
          战争爆发时已属二线的旧机；1940 年 12 月日本海军自己就下过结论，
          说凤翔无法在战斗中运用零战、九九舰爆、九七舰攻这些新机。
          1942 年 6 月 5 日凌晨，它派出的一架 B4Y 发现了漂流中的飞龙并拍照，
          这是它在这场海战里留下的最实的一件事。一个月后它转成着舰练习舰，
          再没出过濑户内海。它是少数熬到终战的日本航母之一，也是其中受损最轻的一艘——
          全生涯唯一确认的被弹是 1945 年 3 月 19 日吴军港空袭中的三枚 50 公斤以下小弹，
          甲板穿了四个洞，战死六人。
      src: [combinedfleet-hosho-trom, jm93-midway-operations, combinedfleet-b4y, hazegray-ijn-carriers]

history:
  - id: build
    title: { zh: 建造与初期试验, en: Construction and early trials }
    range: { from: 1920, to: 1928 }
    events:
      - date: 1920-12-16
        text:
          zh: >-
            在横浜鶴見的浅野造船所以航空母舰名义起工。建造训令上写的是横須賀海軍工廠，
            实际因一战后的不景气救济政策，以请负形式委托给 1916 年才创业的浅野造船所。
        src: [combinedfleet-hosho-trom, japanese-warship-hosho]

      - date: 1921-11-13
        text:
          zh: >-
            下水并命名「鳳翔」（Flying Phoenix）。当天下水后即被拖往横須賀海軍工廠进行艤装。
        src: [combinedfleet-hosho-trom]

      - date: 1922-11-30
        text:
          zh: >-
            全力公试，测得 26.66 节（设计 25 节）。同日留下的照片是现存最早的凤翔航行影像之一。
        src: [naval-encyclopedia-hosho]

      - date: 1922-12-27
        text:
          zh: >-
            服役（竣工）。它是世界上第一艘专门设计建造并建成服役的航空母舰，
            比英国 Hermes 早 13 个月。但服役时大量航空设备仍未到位。
        src: [combinedfleet-hosho-trom, kojinsha-vol6-carriers]

      - date: 1923-02
        text:
          zh: >-
            开始着舰试验。先由受雇的英国飞行员（William Jordan）驾国产一〇式舰战试降，
            随后由塞姆皮尔航空团的飞行员接续。
        src: [combinedfleet-hosho-trom]

      - date: 1924-06-06
        text:
          zh: >-
            因大量初期故障与乘员提出的修改要求，入横須賀海軍工廠船坞改装。
        src: [combinedfleet-hosho-trom]

      - date: 1924-08-20
        text:
          zh: >-
            出坞。舰岛、三脚桅、吊车全部拆除（原因：部分遮挡飞行甲板、妨碍飞行员视线），
            飞行甲板前部改为水平，两门 8cm 高角炮前移至原舰岛位置附近。
            飞行指挥改在从甲板侧面向外伸出的平台上进行——日本航母的平甲板外形自此确立。
        src: [combinedfleet-hosho-trom, navypedia-hosho]

      - date: 1925-07-02
        text:
          zh: >-
            出坞。前升降机后方加装防冲网，液压驱动、3 秒即可立起，
            用于阻止着舰飞机撞上正在准备起飞的飞机、或掉进敞开的升降机井。
        src: [combinedfleet-hosho-trom]

      - date: 1926
        text:
          zh: >-
            至 1928 年间密集试验：各种拦阻装置、光学助降装置、航母运用方法与战术，
            都在本舰上验证。日本海军关于航母的一手经验主要来自这几年。
        src: [combinedfleet-hosho-trom]

      - date: 1928-04-01
        text:
          zh: >-
            编入第一航空战队，同战队另一艘是赤城。同年九架一〇式舰战换装为中岛三式 A1N1。
        src: [combinedfleet-hosho-trom]

  - id: interwar
    title: { zh: 上海事变到中日战争, en: Shanghai and the China war }
    range: { from: 1932, to: 1937 }
    events:
      - date: 1932-02-01
        text:
          zh: >-
            抵长江口，与加贺同属第三舰队第一航空战队。当时舰载机为九架中岛三式 A1N 战斗机、
            三架三菱一三式 B1M 舰攻、三架一〇式 C1M（2MR）侦察机。
        src: [combinedfleet-hosho-trom]

      - date: 1932-02-05
        text:
          zh: >-
            三架战斗机护航两架攻击机，与九架中国战斗机交战，击伤一架。
            这是日本海军首次空战。
        src: [combinedfleet-hosho-trom]

      - date: 1932-02-26
        text:
          zh: >-
            六架战斗机自本舰起飞，为加贺的九架攻击机护航，与来袭的五架中国战斗机交战，击落两架。
        src: [combinedfleet-hosho-trom]

      - date: 1935-09-25
        text:
          zh: >-
            第四舰队事件。舰队在北海道以东的西北太平洋遭遇强台风，
            本舰与龙骧的飞行甲板及上部结构受损，全舰队 54 人死亡。
            naval-encyclopedia 记本舰前部飞行甲板塌陷。
        src: [combinedfleet-hosho-trom, naval-encyclopedia-hosho]

      - date: 1936-03-31
        text:
          zh: >-
            大改装出坞。三部可倒式烟囱固定为水平（口部略朝下），起倒机构整体废除；
            前部飞行甲板支撑加强并增加数量；撤去 8cm 高角炮、吊车与上部航空燃油舱；
            加装九三式 13.2mm 连装机枪六座十二挺；前部机库与舰桥前侧、后部机库附近舰体加强。
        src: [combinedfleet-hosho-trom, japanese-warship-hosho]

      - date: 1937-07-11
        text:
          zh: >-
            中日战争爆发时，日本海军在中国战区的航母兵力只有加贺、龙骧、凤翔三艘约八十架飞机。
            本舰航空队为九架中岛九五式 A4N1 战斗机与六架横须贺九二式 B3Y 舰攻。
        src: [combinedfleet-hosho-trom]

      - date: 1937-09-21
        text:
          zh: >-
            与龙骧赴华南，攻击广州附近。当日派出六架战斗机护航轰炸天生、白云机场的轰炸机，
            宣称击落六架敌机；但航程过远，五架战斗机燃油耗尽迫降海面，乘员全部获救。
        src: [combinedfleet-hosho-trom]

      - date: 1937-12-01
        text:
          zh: >-
            转入预备。此后一年多本舰主要作为练习舰使用。
        src: [combinedfleet-hosho-trom]

  - id: ww2
    title: { zh: 太平洋战争, en: The Pacific War }
    range: { from: 1939, to: 1942 }
    events:
      - date: 1939-08
        text:
          zh: >-
            出坞。两部升降机为新一代舰载机扩大：前部改为 12.8 × 8.5 m，后部改为 13.7 × 7.0 m。
        src: [combinedfleet-hosho-trom]

      - date: 1940-10
        text:
          zh: >-
            撤去可降入甲板的 8cm 高角炮，换装九六式 25mm 连装机枪，
            并在舷侧增设突出炮座（スポンソン）。座数与管数两说：
            四座八挺（navypedia、combinedfleet）或六座十二挺（日文资料）。
        src: [navypedia-hosho, combinedfleet-hosho-trom, japanese-warship-hosho]

      - date: 1940-12-23
        text:
          zh: >-
            日本海军调查得出结论：凤翔无法在战斗中运用三菱零战、爱知九九舰爆、
            中岛九七舰攻等最新机型；且其航空队规模太小，对舰队在未来冲突中的价值有限。
        src: [combinedfleet-hosho-trom]

      - date: 1941-09-28
        text:
          zh: >-
            航空队编成为十一架三菱九六式 A5M4 战斗机与八架横须贺九六式 B4Y1 舰攻。
        src: [combinedfleet-hosho-trom, combinedfleet-a5m, combinedfleet-b4y]

      - date: 1941-12-08
        text:
          zh: >-
            珍珠港作战当日，本舰与瑞凤随山本主力部队（八艘战列舰、七艘巡洋舰、二十八艘驱逐舰）
            出丰后水道进入太平洋，任务是在海上接应从夏威夷返航的机动部队并提供支援。
        src: [combinedfleet-hosho-trom]

      - date: 1941-12-10
        text:
          zh: >-
            日落后发现美军潜艇跟踪，舰长梅谷薰仍下令放飞飞机；为收回飞机打开飞行甲板灯，
            飞机全部安全回收，但本舰因此转向、远离本队，在无线电静默与夜色中与主力失去联络。
        src: [combinedfleet-hosho-trom]

      - date: 1941-12-11
        text:
          zh: >-
            天亮后巡逻机在小笠原群岛以东五百海里处找到本舰与三艘驱逐舰，随后与返航的主力会合。
        src: [combinedfleet-hosho-trom]

      - date: 1942-05-29
        text:
          zh: >-
            中途岛作战，从柱岛随山本主力部队出击。本舰位置在战列舰纵队之间、
            大和—长门—陆奥这一列的左后方；护航为川内与第十一、第十九驱逐队。
            主力部队位于南云机动部队后方三百英里，整个作战期间未与美军交战。
        src: [combinedfleet-hosho-trom, jm93-midway-operations]

      - date: 1942-06-03
        text:
          zh: >-
            因前夜浓雾，川内与矶波失踪。本舰派出九六式舰攻搜索，数小时无结果；
            13:15 搜索机在主力前方四十三海里处找到两舰，三小时后归队。
        src: [combinedfleet-hosho-trom]

      - date: 1942-06-05
        text:
          zh: >-
            山本命本舰派出仅有的八架九六式舰攻 B4Y1 中的数架搜索南云。04:20，
            一架 B4Y 在 FU RO RI 43 位置发现浓烟中漂流、已被放弃的飞龙，报告舰上尚有生还者并拍照。
            一小时后驱逐舰谷风奉命前往搜索未果。13:00，靠本舰飞机的引导，
            南云机动部队与山本、近藤会合。
        src: [combinedfleet-hosho-trom, jm93-midway-operations, kojinsha-vol6-carriers]

      - date: 1942-06-14
        text:
          zh: >-
            主力部队返泊柱岛，本舰锚泊岩国。6 月 20 日重归第一航空舰队，全部九六式飞机下舰，
            舰载机定数归零。
        src: [combinedfleet-hosho-trom]

  - id: training
    title: { zh: 训练舰到终战, en: Training carrier to the end }
    range: { from: 1942, to: 1947 }
    events:
      - date: 1942-07-14
        text:
          zh: >-
            自第一舰队转隶第三舰队（附属机动部队），此后专任着舰练习舰，护航为驱逐舰夕风。
        src: [combinedfleet-hosho-trom]

      - date: 1943-01-15
        text:
          zh: >-
            与轻航母龙鳯、鹿屋航空队、筑城航空队、驱逐舰夕风编成第五十航空战队，
            隶属第三舰队，专司舰载机乘员养成。此后一年在本州西部内海反复训练。
        src: [combinedfleet-hosho-trom, japanese-warship-hosho]

      - date: 1944-06-24
        text:
          zh: >-
            出坞。飞行甲板前后延长至 180.8 m（宽度仍是 22.7 m，受船宽限制无法加宽），
            升降机再扩大为前 8.5 × 12.8 m、后 13.7 × 11.0 m，烟囱改为下倾；
            四门 14cm 单装炮撤除。甲板延长导致舰桥前方视界与复原性显著恶化，外洋航行事实上不可能。
        src: [combinedfleet-hosho-trom, navypedia-hosho, japanese-warship-hosho]

      - date: 1945-03-19
        text:
          zh: >-
            吴军港空袭。05:32 遭七架飞机攻击，后部飞行甲板中三弹，
            弹重不超过 50 kg，损伤轻微：甲板被击穿四个小洞，最大者不过一米。
            战死六人。这是本舰全生涯唯一确认的被弹。
        src: [combinedfleet-hosho-trom]

      - date: 1945-06-01
        text:
          zh: >-
            定为四级预备舰，附吴港防备队，乘员减半。
        src: [combinedfleet-hosho-trom]

      - date: 1945-07-05
        text:
          zh: >-
            仍系泊于西ノ見島（西海町）东岸、龙鳯泊地以南的小湾内，并施以严密伪装。
            自 1945 年 5 月 28 日被侦察发现起，本舰已在该处停泊月余。
        src: [combinedfleet-hosho-trom]

      - date: 1945-10-05
        text:
          zh: >-
            从海军名册除籍，但仍留盟军使用。与轻巡鹿岛赴 Wotje、Eniwetok、Jaluit 接运日方人员：
            10 月 16 日在 Wotje 上船 700 人，10 月 22 日到 Jaluit，11 月 3 日返浦贺（700 + 311 人）。
            此后至 1946 年 8 月，共在内地与南方之间往返九次，运送约四万人
            （往返次数与人数出自 japanese-warship：「復員船として南方と日本を9往復します」、
            「日本の地へ送り届けた兵士の数、およそ4万人」）。
        src: [combinedfleet-hosho-trom, japanese-warship-hosho]

      - date: 1945-12-05
        text:
          zh: >-
            入日立造船因岛船厂船坞修理，并拆除覆盖舰首的前部飞行甲板，以改善舰桥视野。
            复员期的凤翔因此与战时外形不同。
        src: [combinedfleet-hosho-trom]

      - date: 1947-05-01
        text:
          zh: >-
            在日立造船桜島工场解体完毕（1946 年 8 月 31 日移交内务省、同日开工解体）。
            同一工场随后拆解了日本最后一艘航母葛城——日本航母的第一艘与最后一艘在同一处消失。
        src: [combinedfleet-hosho-trom, kojinsha-vol6-carriers]
