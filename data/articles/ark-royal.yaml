# ============================================================================
# 舰艇正文 —— 皇家方舟号（HMS Ark Royal，91）
#
# 本舰正文的抓手是「两次打错」：一次是把本方巡洋舰当成俾斯麦打，
# 一次是把不可靠的磁性引信当成可靠的东西用。两次都有明确的一手记述，
# 两次都没有被掩盖。
#
# 篇幅按「有特殊意义的舰」定：intro 4 段 + history 4 节、共 20 条事件。
# ============================================================================
ship: ark-royal
updated: 2026-11-22

intro:
  lead:
    zh: >-
      皇家方舟号是皇家海军第一艘从铺龙骨起就按航母设计的大型舰队航母，
      也是二战英国最出名的航母。它服役只有三年，却跑遍了早期几乎所有战场：
      挪威、米尔斯克比尔、达喀尔、斯帕蒂文托、追击俾斯麦、马耳他补给。
      它最著名的一次行动里，第一个被它攻击的「敌舰」是自己人。
    en: >-
      Ark Royal was the first large fleet carrier the Royal Navy laid down as a
      carrier from the keel up, and the best known British carrier of the Second
      World War. Her career lasted only three years, yet it covered almost every
      early theatre: Norway, Mers-el-Kebir, Dakar, Cape Spartivento, the hunt for
      Bismarck and the Malta runs. In her most famous action, the first ship her
      aircraft attacked was one of her own.

  paragraphs:
    - heading: 它把英国航母的外形定了下来，但它不是装甲航母
      text:
        zh: >-
          在它之前，皇家海军的六艘大型航母都是战列巡洋舰或商船改的。
          皇家方舟号改了两件事：飞行甲板不再是架在船体上的平台，而是船体结构的
          一部分、兼作上层强度甲板；舷侧板一直包到飞行甲板，于是有了那个此后
          成为英国航母标志的全封闭舰艏。它也确实有装甲：水线一条 114 毫米的主
          装甲带，覆盖约 45% 的水线长度；一层 3.5 英寸装甲甲板；舷侧一套
          「三明治」式水下防护，纵深 4.08 米。但机库侧壁是结构钢，不是装甲，
          飞行甲板也没有装甲——真正把装甲飞行甲板当强度甲板用的是后来的光辉级。
          本级的取舍是高干舷（到飞行甲板 17.1 米，比光辉级高 5.5 米）、
          双层贯通机库、60 架载机。
        en: >-
          Before her, all six large Royal Navy carriers had been converted from
          battlecruisers or merchant hulls. Ark Royal changed two things: the
          flight deck stopped being a platform carried on the hull and became
          part of the hull structure, serving as the upper strength deck; and the
          side plating ran up to the flight deck, producing the fully enclosed
          bow that became the mark of British carriers. She did have armour: a
          114 mm main belt over about 45 per cent of the waterline, a 3.5-inch
          armour deck, and a sandwich-type underwater system 4.08 m deep. But her
          hangar sides were structural steel, not armour, and her flight deck was
          not armoured - it was the later Illustrious class that made an armoured
          flight deck carry the hull's strength. Her own trade was high freeboard
          (17.1 m to the flight deck, 5.5 m more than Illustrious), a two-level
          full-length hangar and sixty aircraft.
      src: [navypedia-arkroyal, uboatnet-arkroyal-class, historyofwar-arkroyal]

    - heading: 德国人宣布击沉过它很多次
      text:
        zh: >-
          从 1939 年 9 月到 1941 年 11 月，德国宣传机构反复宣布皇家方舟号已被
          击沉，次数多到 naval-history 的年表专门写了一句评语：二战英国最出名的
          航母，也经常被宣称已被德国人击沉。这件事有一半是宣传，另一半是真的
          打得很悬：1939 年 9 月 14 日 U-39 对它齐射三枚鱼雷，三枚全部提前爆炸，
          一枚都没命中——磁性引信故障救了它。三艘护航驱逐舰随即反潜击沉 U-39，
          那是二战中第一艘被击沉的 U 艇。
        en: >-
          Between September 1939 and November 1941 German propaganda announced
          Ark Royal sunk again and again, often enough that Naval-History's
          chronology notes she was the best known British carrier of the war and
          was repeatedly claimed sunk. Half of that was propaganda; the other
          half was genuine danger. On 14 September 1939 U-39 fired three
          torpedoes at her and all three exploded prematurely - faulty magnetic
          pistols saved her. Her three escorts counter-attacked and sank U-39,
          the first U-boat lost in the war.
      src: [naval-history-arkroyal, historyofwar-arkroyal]

    - heading: 1941 年 5 月 26 日，它打了两次，第一次打错了
      text:
        zh: >-
          追击俾斯麦那两天，皇家方舟号在 Force H 编成内从直布罗陀北上，
          并不在炮战战场上。它那天起飞两次打击机群，第一次打错了目标。
          失误有一个很具体的原因：舰队当天 13:00 已经命令轻巡谢菲尔德号脱离编队
          去跟踪俾斯麦，但**这道视觉信号没有转发给皇家方舟号**，舰上并不知道
          谢菲尔德已经不在附近。机群靠机载雷达在「预期阵位外二十英里」抓到一艘船
          就投了雷。谢菲尔德号的舰长认出了来袭飞机，下令全速规避并禁止开火，
          十一枚鱼雷全部落空，十四架飞机全部返航——其中三架没投雷的，
          还给谢菲尔德号发了一句「抱歉，打错鱼了」。
          第二波 15 架在 19:00 起飞，这次打对了，而且靠的是换引信：
          第一波之所以全部落空，除了打错船，还因为**约 45% 的鱼雷提前爆炸**——
          双联磁性引信在那个海况下不可靠，所以第二波换回了更老但更可靠的触发引信。
          机群先飞到谢菲尔德号上方取得方位与距离，20:47 起分小队穿云进入；
          21:05，818 中队的 5C 在俾斯麦号左舷艉部命中，打坏舵机。
          当晚英方报的是「一枚确信命中舯部」，战后核对才确认真正致命的是艉部那一枚。
        en: >-
          During the two days of the Bismarck chase Ark Royal was with Force H
          coming north from Gibraltar and was not on the gunnery battlefield. She
          flew two strikes that day; the first hit the wrong ship. The mistake
          had a concrete cause: at 1300 the fleet ordered the light cruiser
          Sheffield to detach and shadow Bismarck, but that visual signal was
          never repeated to Ark Royal, so the carrier did not know Sheffield was
          no longer in company. The aircraft picked up a ship on ASV about twenty
          miles from the expected position and attacked it. Sheffield's captain
          recognised his attackers, rang for full ahead and ordered his guns not
          to fire. Eleven torpedoes all missed and all fourteen aircraft
          returned; three that had not dropped signalled "Sorry for the Kipper".
          The second wave of fifteen went off at 1900 and this time hit the right
          ship - and it got there by changing fuzes. The first wave had missed
          not only because it attacked the wrong ship, but because about 45 per
          cent of its torpedoes exploded prematurely; the duplex magnetic pistols
          were unreliable in that sea state, so the second wave reverted to the
          older contact exploders. The aircraft flew over Sheffield for a bearing
          and range, then began diving through cloud at 2047; at 2105, 5C of 818
          Squadron hit Bismarck's port quarter aft and jammed her rudder. The
          British report that night claimed one certain hit amidships; only after
          the war was it established that the fatal hit had been the one aft.
      src: [naval-history-arkroyal, uboatnet-arkroyal-class, historyofwar-arkroyal]

    - heading: 它不是因为装甲薄沉的
      text:
        zh: >-
          1941 年 11 月 13 日，一枚 300 公斤战雷头的鱼雷命中它右舷舯部，
          十四小时后它翻沉了。一艘两万两千吨的航母被一发鱼雷弄沉，
          原因不是装甲厚度，而是一条设计链：三组锅炉房排成一列横贯全船，
          所以右舷中雷会同时打穿右舷锅炉房和主配电板；而全船没有柴油发电机，
          电力全靠汽轮发电机。失电，泵就停，进水就不再受控。还有一条更隐蔽的：
          三组锅炉的烟道从下层机库底下穿过，水位一涨，海水就从烟道灌进另外
          两个锅炉房。英国海军部事后的调查把这些都改掉了——电力分配、
          柴油发电机、损管规程、电池应急照明。全舰阵亡一人。
        en: >-
          On 13 November 1941 a torpedo with a 300 kg warhead hit her starboard
          side amidships and fourteen hours later she capsized. A 22,000-ton
          carrier lost to one torpedo, and the reason was not armour thickness
          but a chain of design decisions: her three boiler rooms were arranged
          in a row across the ship, so a starboard hit took out the starboard
          boiler room and the main switchboard together; and she had no diesel
          generators at all, all power coming from steam turbo-generators. Lose
          the power and the pumps stop, and the flooding runs unchecked. There
          was a subtler link too: the smoke ducts from the three machinery groups
          ran beneath the lower hangar, so as the water rose it poured through
          the uptakes into the other two boiler rooms. The Admiralty's inquiry
          changed all of it. One man died.
      src: [naval-history-arkroyal, navypedia-arkroyal, historyofwar-arkroyal]

history:
  - id: build
    title: { zh: 建造、服役与挪威战役, en: Building, service and Norway }
    range: { from: 1931, to: 1940 }
    events:
      - date: 1931
        text:
          zh: 开始新型舰队航母的设计工作，这一设计后来成为皇家方舟级。
          en: >-
            Design work began on a new fleet aircraft carrier, the design that
            became the Ark Royal class.
        src: [naval-history-arkroyal]
      - date: 1935-09-16
        text:
          zh: >-
            在 1934 年造舰计划下向 Cammell Laird（Birkenhead）下单后开工，
            船台号 1012。
          en: >-
            Laid down at Cammell Laird of Birkenhead under the 1934 estimates,
            yard number 1012.
        src: [navypedia-arkroyal, uboatnet-arkroyal-class]
      - date: 1937-04-13
        text:
          zh: 下水。
          en: Launched.
        src: [navypedia-arkroyal, naval-history-arkroyal]
      - date: 1938-11-16
        text:
          zh: >-
            服役，造价 £3.215M。uboat.net 另记 1938-12-16，两说并列不裁决。
          en: >-
            Commissioned, at a build cost of £3.215M. Uboat.net records
            16 December 1938 instead; both dates are given, neither is preferred.
        src: [navypedia-arkroyal, naval-history-arkroyal, uboatnet-arkroyal-class]
      - date: 1939-09-14
        text:
          zh: >-
            U-39 齐射三枚鱼雷，全部因磁性引信故障提前爆炸，无一命中。
            三艘护航驱逐舰反潜击沉 U-39，全体 43 人被俘——二战中第一艘被击沉的 U 艇。
          en: >-
            U-39 fired three torpedoes; all exploded prematurely on faulty
            magnetic pistols and none hit. Her three escorts counter-attacked
            and sank U-39, taking all 43 of her crew prisoner - the first U-boat
            lost in the war.
        src: [naval-history-arkroyal]
      - date: 1939-09-26
        text:
          zh: 803 中队的一架 Skua 击落一架 Do 18，是皇家海军舰载战斗机在二战中的首个战果。
          en: >-
            A Skua of 803 Squadron shot down a Do 18 - the Fleet Air Arm's first
            kill of the war.
        src: [faa-arkroyal-archive, historyofwar-arkroyal]
      - date: 1940-04-10
        text:
          zh: >-
            本舰留在岸上的 800、803 中队以 Skua 空袭卑尔根，三弹命中德国轻巡
            KÖNIGSBERG，引爆弹药库使其断成两截，只损失一架。这是史上第一次
            由空袭击沉主要战舰。当日该舰尚在从地中海返航途中。
          en: >-
            Her shore-based 800 and 803 Squadrons attacked Bergen with Skuas,
            hitting the German light cruiser KÖNIGSBERG three times and
            detonating her magazines; she split in two, for the loss of one
            Skua. It was the first sinking of a major warship by air attack. The
            ship herself was still returning from the Mediterranean that day.
        src: [historyofwar-arkroyal, faa-arkroyal-archive]
      - date: 1940-06-13
        text:
          zh: >-
            15 架 Skua 各挂 500 lb SAP 攻击 Trondheim 的 SCHARNHORST，
            遭 Bf109 与 Bf110 拦截，损失 8 架。战果判定存两说：
            英方当时判两弹命中，事后核对实际只有一弹命中且未爆炸。
          en: >-
            Fifteen Skuas with 500 lb SAP bombs attacked Scharnhorst at
            Trondheim and ran into Bf 109s and Bf 110s; eight were lost. The
            bomb damage was assessed at the time as two hits; post-war checking
            found one hit that failed to explode.
        src: [naval-history-arkroyal]

  - id: forceh
    title: { zh: Force H 与西地中海, en: Force H and the western Mediterranean }
    range: { from: 1940-07, to: 1940-12 }
    events:
      - date: 1940-07-03
        text:
          zh: >-
            米尔斯克比尔。本舰不在炮战队列里，任务是侦察、校射与布雷：
            Swordfish 分别在 Mers el Kebir 与 Oran 港内出口布磁性水雷。
            炮击于 17:54 开始，BRETAGNE 弹药库殉爆、DUNKERQUE 搁浅。
          en: >-
            Mers-el-Kebir. She was not in the gun line: her Swordfish flew
            reconnaissance, spotting and mining sorties, laying magnetic mines
            in the exits of both Mers-el-Kebir and Oran. Fire opened at 1754;
            Bretagne's magazines detonated and Dunkerque was beached.
        src: [naval-history-arkroyal]
      - date: 1940-07-03
        text:
          zh: >-
            818 中队 6 架 Swordfish 各挂 4 枚 250 lb SAP 攻击出港的 STRASBOURG，
            炸弹对 115-125 毫米甲板无效，两架被击落。
          en: >-
            Six Swordfish of 818 Squadron, each with four 250 lb SAP bombs,
            attacked Strasbourg as she sortied. The bombs could not defeat
            115-125 mm deck armour; two aircraft were shot down.
        src: [naval-history-arkroyal]
      - date: 1940-09-23
        text:
          zh: >-
            参加 Operation MENACE 攻击达喀尔，舰载机对 RICHELIEU 实施鱼雷攻击。
            行动失败，维希守军无意倒向自由法国。
          en: >-
            Took part in Operation Menace against Dakar, her aircraft making
            torpedo attacks on Richelieu. The operation failed; the Vichy
            defenders would not come over to the Free French.
        src: [historyofwar-arkroyal, faa-arkroyal-archive]
      - date: 1940-11-27
        text:
          zh: >-
            斯帕蒂文托海战。两波共 20 架 Swordfish 攻击意大利舰队，全部鱼雷未命中；
            英方当时误判为命中 VITTORIO VENETO。
          en: >-
            Battle of Cape Spartivento. Twenty Swordfish in two strikes attacked
            the Italian fleet and every torpedo missed; the British at the time
            believed Vittorio Veneto had been hit.
        src: [naval-history-arkroyal]

  - id: bismarck
    title: { zh: 1941 年 5 月：改装与追击俾斯麦, en: May 1941 - refit and the Bismarck chase }
    range: { from: 1941-05, to: 1941-05 }
    events:
      - date: 1941-05-01
        text:
          zh: >-
            加装两座八联 2-pdr pom-pom，座数由 4 增至 6（32 门增到 48 门）。
            这是本舰服役期内唯一一次防空武备变化。
          en: >-
            Two more octuple 2-pdr pom-pom mountings were added, taking the
            total from four to six (32 to 48 barrels) - the only change to her
            anti-aircraft armament during her service.
        src: [navypedia-arkroyal, historyofwar-arkroyal]
      - date: 1941-05-26
        text:
          zh: >-
            14:50 第一波 15 架 Swordfish（Stewart-Moore 少校）起飞，奉命攻击俾斯麦。
            舰队 13:00 令谢菲尔德号脱离跟踪的视觉信号没有转发给本舰，
            舰上不知道她已经不在附近。15:50 机群靠 ASV 在「预期阵位约 20 英里外」
            发现一艘军舰并穿云攻击——那是轻巡谢菲尔德号。
          en: >-
            At 1450 the first strike of fifteen Swordfish (Lt-Cdr Stewart-Moore)
            took off against Bismarck. The 1300 visual signal detaching
            Sheffield to shadow had not been repeated to the carrier, which did
            not know she was no longer in company. At 1550 the aircraft picked up
            a ship on ASV about twenty miles from the expected position and
            attacked through cloud - it was the light cruiser Sheffield.
        src: [naval-history-arkroyal, uboatnet-arkroyal-class]
      - date: 1941-05-26
        text:
          zh: >-
            11 枚鱼雷全部落空（2 枚入水即爆、3 枚在尾迹中爆炸、其余被规避），
            14 架全部返航。谢菲尔德号舰长 Larcom 认出了来袭飞机，下令全速并
            禁止开火，一炮未还。三架未投雷的发出信号「Sorry for the Kipper」。
          en: >-
            All eleven torpedoes missed (two exploded on entering the water,
            three on crossing the wake, the rest were avoided) and all fourteen
            aircraft returned. Sheffield's captain Larcom recognised his
            attackers, ordered full ahead and forbade his guns to fire; not a
            round was fired in reply. The three that had not dropped signalled
            "Sorry for the Kipper".
        src: [naval-history-arkroyal, uboatnet-arkroyal-class]
      - date: 1941-05-26
        text:
          zh: >-
            19:00 第二波 15 架（Coode 少校）起飞。因为第一波约 45% 的鱼雷提前爆炸，
            这一波换装触发引信。机群先到谢菲尔德号上方取得方位距离。
          en: >-
            At 1900 the second strike of fifteen (Lt-Cdr Coode) took off. Because
            some 45 per cent of the first wave's torpedoes had exploded
            prematurely, this wave carried contact exploders instead. The
            aircraft first went over Sheffield for a bearing and range.
        src: [naval-history-arkroyal]
      - date: 1941-05-26
        text:
          zh: >-
            20:47 起分小队穿云攻击。21:05，818 中队 5C（Moffatt 少校）在左舷艉部命中，
            打坏舵机，俾斯麦号失去操舵能力。
          en: >-
            From 2047 the sub-flights dived through cloud. At 2105, 5C of 818
            Squadron (S/Lt Moffatt) hit the port quarter aft and jammed the
            rudder; Bismarck could no longer steer.
        src: [naval-history-arkroyal, uboatnet-arkroyal-class]

  - id: loss
    title: { zh: 马耳他补给与沉没, en: The Malta runs and the loss }
    range: { from: 1941-08, to: 1941-11 }
    events:
      - date: 1941-08-02
        text:
          zh: >-
            8 架 Swordfish 挂鱼雷攻击撒丁岛 Omodeo 湖的 Santa Chiara d'Ula 水坝
            （Operation PICKET）。4 架抵达目标，无一命中，一架被击落。
          en: >-
            Eight Swordfish attacked the Santa Chiara d'Ula dam on Lake Omodeo,
            Sardinia, with torpedoes (Operation Picket). Four reached the target,
            none hit, one was shot down.
        src: [naval-history-arkroyal]
      - date: 1941-09-24
        text:
          zh: >-
            Operation HALBERD：与 RODNEY 编组掩护开往马耳他的运输船队。
            26 日至 27 日间 Fulmar 的 CAP 从 4 架加到 16 架，对抗 SM 84 鱼雷机多波攻击。
          en: >-
            Operation Halberd: with Rodney, covering a convoy to Malta. Between
            26 and 27 September the Fulmar CAP was built up from four to sixteen
            against repeated waves of SM 84 torpedo bombers.
        src: [naval-history-arkroyal]
      - date: 1941-11-13
        text:
          zh: >-
            15:41 在 36°03'N, 4°45'W 被 U-81 的一枚鱼雷命中右舷舯部，
            破口涨到约 130 × 30 ft。右舷锅炉房、主配电板、下层操舵位置同时进水。
          en: >-
            At 1541, in 36°03'N 4°45'W, one torpedo from U-81 hit her starboard
            side amidships and the hole grew to about 130 by 30 feet. The
            starboard boiler room, main switchboard and lower steering position
            flooded at once.
        src: [naval-history-arkroyal, uboatnet-arkroyal-class]
      - date: 1941-11-13
        text:
          zh: >-
            全船失电——没有柴油发电机，排水泵无法运转，进水不受控。
            17:00 左舷锅炉因失去给水被迫停炉。16:48 LEGION 撤走 1,487 人，
            舰上留约 250 人继续抢救；20:59 两艘拖船开始以 2 节向西拖带。
          en: >-
            The ship lost all electrical power - with no diesel generators the
            pumps could not run and the flooding went unchecked. At 1700 the
            port boilers had to be shut down for lack of feed water. By 1648
            Legion had taken off 1,487 men, about 250 staying aboard to fight
            the ship; at 2059 two tugs began towing west at two knots.
        src: [naval-history-arkroyal]
      - date: 1941-11-14
        text:
          zh: >-
            01:30 起横倾快速增大，04:30 达 35°，下令弃舰；06:19 横倾 45°后翻到 90°，
            竖立三分钟后下沉，06:24 舰艏没入水中。uboat.net 记沉没时刻 08:13，
            两说并列不裁决。全舰阵亡 1 人：Able Seaman E Mitchell。
          en: >-
            From 0130 the list increased rapidly and by 0430 it had reached 35
            degrees, when abandon ship was ordered. At 0619 she rolled from 45
            to 90 degrees, stayed there three minutes, went upright on her stern
            and sank, the bow going under at 0624. Uboat.net gives 0813; both
            times are recorded, neither is preferred. One man was killed: Able
            Seaman E Mitchell.
        src: [naval-history-arkroyal, uboatnet-arkroyal-class, historyofwar-arkroyal]
