# ============================================================================
# 武器正文 —— 4.7"/45 (12 cm) QF Mark XII
#
# ⚠️ 来源说明：任务下发的 URL（WNBR_47-45_mk12.php）实测 404。
#    Mark IX 与 Mark XII 在 NavWeaps 上是同一页：
#    WNBR_47-45_mk9.php，标题 "4.7"/45 (12 cm) QF Mark IX and Mark XII"。
#    本文件的数据全部取自该页，来源 id 仍用 navweaps-4-7in-45-mk12，
#    url 填实际抓到的这一页。
#
# 主线三条：
#   1. 它不是「一门新炮」，而是 Mk IX 为双联装炮座做的加长加重版本 ——
#      英国驱逐舰第一次拿到专门设计的动力炮座（CPXIX）；
#   2. 双联装炮座解决了人力问题，但没解决「没有对空能力」这个根本问题，
#      而英国驱逐舰在战争中死于空袭多于其他任何原因；
#   3. 部族级后来把「X」炮座换成 4 英寸高平两用炮座，
#      正是对第 2 条的补救，而不是对炮本身的否定。
# ============================================================================
weapon: 47in-45-mk12
updated: 2026-11-22

intro:
  lead:
    zh: >-
      4.7"/45 (12 cm) QF Mark XII 是英国 1930 年代驱逐舰的双联装主炮，
      装在部族级、J/K/N 级与阿布迪尔级布雷舰上。
      它与同页的 Mark IX 是几乎相同的两门炮，区别只有一处：
      Mark XII 是为了用在双联装炮座里而做的加长加重版本。
      跟随它一起上舰的 CPXIX，是英国第一个专门为驱逐舰设计的动力炮座。
    en: >-
      The 4.7"/45 (12 cm) QF Mark XII was the twin-mounted destroyer gun of the
      1930s, arming the Tribal, J, K and N classes and the Abdiel class minelayers.
      It is almost identical to the Mark IX on the same data page, with one
      difference: the Mark XII was made slightly heavier and longer so it could be
      used in twin mountings. The CPXIX mounting that came with it was the first
      British power mounting designed specifically for destroyers.

  paragraphs:
    - heading: 它不是新炮，是为双联装炮座改出来的版本
      text:
        zh: >-
          navweaps 的描述很短但很明确：Mark IX 装在 1930 与 1940 年代建造的
          大多数驱逐舰上；而「几乎相同的 Mark XII 是为用在双联装炮座里设计的，
          与 Mark IX 的差别是稍重、稍长」。
          两型都使用分装弹药，除此以外与更早的 4.7"/45 BL Mark I 相似。
          这不是一次新设计，是一次针对炮座的适配 ——
          而这次适配要解决的问题是人力：单装炮座全靠手摇，双联装炮座有动力。
        en: >-
          NavWeaps is brief but precise: the Mark IX went on most destroyers built in
          the 1930s and 1940s, while "the almost identical Mark XII was designed for
          use in twin mountings and differed from the Mark IX in being slightly
          heavier and longer". Both fired separate ammunition and were otherwise
          similar to the earlier 4.7"/45 BL Mark I. This was not a new design but an
          adaptation to a mounting - and the problem that adaptation solved was
          manpower, since the single mountings were entirely hand worked while the
          twin had power.
      src: [navweaps-4-7in-45-mk12]

    - heading: 主要参数
      text:
        zh: >-
          名义口径 4.7 英寸，实际膛径 4.724 英寸（12 厘米）；
          身管全长 5.692 米（Mark IX 为 5.604 米），膛线长 4.552 米，药室 10.29 立方分米；
          炮重 3,290 到 3,297 公斤（Mark IX 为 3,011 到 3,032 公斤）。
          弹药为分装式：高爆弹与半穿甲弹均为 50 磅（22.68 公斤），
          药筒为黄铜制 120 × 785.42 毫米；
          初速 808 米/秒，膛压 20 吨/平方英寸，身管寿命约 1,400 发。
          射程：30 度 15,800 码（14,450 米），40 度 17,000 码（15,545 米）。
          射速：CPXIX 双联装炮座 10 到 12 发/分，其他炮座 7 到 10 发/分。
          穿甲能力：半穿甲弹在 6,500 码（5,950 米）可穿透 2.5 英寸（63 毫米）非渗碳装甲。
          产量：Mark XII 各亚型合计 372 门（同页的 Mark IX 为 742 门）。
        en: >-
          Nominal calibre 4.7 inches, actual bore 4.724 inches (12 cm); gun length
          overall 5.692 m against 5.604 m for the Mark IX, with 4.552 m of rifling
          and a 10.29 dm3 chamber; gun weight 3,290 to 3,297 kg against 3,011 to
          3,032 kg. Ammunition was separate, with both HE and SAP projectiles at 50
          lb (22.68 kg) and a brass cartridge case of 120 x 785.42 mm. Muzzle
          velocity 808 m/s, working pressure 20 tons/in2, barrel life about 1,400
          rounds. Range 15,800 yards (14,450 m) at 30 degrees and 17,000 yards
          (15,545 m) at 40 degrees. Rate of fire 10 to 12 rounds per minute in the
          CPXIX twin mounting and 7 to 10 in other mountings. The SAP shell could
          penetrate 2.5 inches (63 mm) of non-cemented armour at 6,500 yards
          (5,950 m). Production ran to 372 Mark XII guns of all variants, against
          742 Mark IX.
      src: [navweaps-4-7in-45-mk12]

    - heading: CPXIX 是英国第一个为驱逐舰专门设计的动力炮座
      text:
        zh: >-
          这一条是这型炮在技术史上的位置：CPXIX 双联装炮座是
          「英国第一个专门为驱逐舰设计的动力炮座」。
          它带来的改动不只是射速 —— 这型炮座的火线比单装炮座高了 13 英寸（33 厘米），
          于是驱逐舰不得不把罗经舰桥抬高，好让舵手能越过防盾看出去。
          炮座的两门炮共用一座摇架，不能独立俯仰；
          炮轴间距 38 英寸（96.5 厘米）。
          动力来源按舰级不同：部族级的四座炮座分成两组，
          每组由一台 140 马力蒸汽轮机与油压泵驱动；
          J、K、N 级则是每座炮座各配一台 70 马力电动机与泵。
          弹药方面，每座炮座有两台提弹机从弹库垂直升到炮位下一层甲板，
          弹丸再经人工滑槽送到炮甲板；发射药筒由人从弹库传到炮位。
          重要的是：这套炮座有动力推弹、动力回旋与俯仰，但没有装 RPC（遥控动力控制）。
        en: >-
          This is the weapon's place in technical history: the CPXIX twin mounting
          was "the first British power mounting specifically designed for
          destroyers". What it changed was not only rate of fire - its trunnion
          height was 13 inches (33 cm) higher than the single mountings, which forced
          the wheelhouse to be raised so the helmsman could see over the gun
          shields. The two guns shared a cradle and could not elevate independently;
          gun axes were 38 inches (96.5 cm) apart. Power came differently by class:
          the Tribal class had four mountings in two groups, each driven by a 140 hp
          steam turbine and oil hydraulic pump, while the J, K and N classes had a
          70 hp electric motor and pump on each individual mounting. Each mounting
          had two dredger projectile hoists running up from the shell rooms, with
          hand-operated sliding chutes carrying projectiles to the gun deck, while
          propellant cartridges were passed up by hand. Critically, the mounting had
          power ramming, power training and power elevation, but no RPC gear.
      src: [navweaps-4-7in-45-mk12]

    - heading: 它没有对空能力，而这是要命的
      text:
        zh: >-
          navweaps 对这批炮的批评集中在一处，而且用词很重：
          「这些炮缺乏对空（DP）功能这一点，在整个战争期间都被痛切地感受到，
          因为被空袭击沉的英国驱逐舰比死于其他任何原因的都多。」
          它同时说明了原因不止一个：这型炮仅有的一点防空能力，
          还被两件事拖累 —— 缺少速射式（预测式）火控系统，以及高爆弹时间引信要人工设定。
          这不是「炮不好」，是整套系统（炮座仰角、火控、引信）都不足以打飞机。
          需要并列的另一面是：CPXIX 的最大仰角是 +40 度，
          高于当时单装炮座的 +30 度 —— 它是这一代里最好的，
          但 40 度仍然不够。
        en: >-
          NavWeaps concentrates its criticism in one sentence and the wording is
          strong: "The lack of a DP function for these weapons was keenly felt
          throughout the war as more British destroyers were sunk by air attack than
          from any other cause." It also shows the cause was not single: what little
          AA capability the guns had was hindered by the absence of a tachymetric
          (predictive) fire control system and by HE time fuzes being set by hand.
          The problem was the whole system - mounting elevation, fire control and
          fuzing - not the gun alone. The other side must be recorded too: CPXIX
          allowed +40 degrees, against +30 in the single mountings of the period, so
          it was the best of its generation - and forty degrees was still not enough.
      src: [navweaps-4-7in-45-mk12, navweaps-4-7in-40-mk8]

    - heading: 部族级把「X」炮座换掉了，这是补救不是否定
      text:
        zh: >-
          战争中的实际处置说明了问题怎么被承认：大多数部族级把「X」炮座拆掉，
          原位换成一座双联 4"/45 高平两用炮座，以提高防空能力。
          出于同样的理由，阿布迪尔级快速布雷舰的三座 4.7 英寸双联装炮座
          也被换成了三座双联 4"/45 高平两用炮座。
          也就是说，这型炮在服役后期是被「降级使用」的：
          留在前面的炮座继续当水面火炮用，最危险的那个位置让给了高射炮。
          另一处细节值得记下：J 级与 K 级「X」炮座的原始设置让中间回旋位置朝正前方，
          导致尾炮无法直接向正后方射击，目标从一舷过到另一舷时炮座要绕远路；
          战争初期这些炮座被改成正常的正后方中位，N 级出厂即是新配置。
        en: >-
          What happened in service shows how the problem was acknowledged: most of
          the Tribal class had "X" mounting removed and a twin 4"/45 HA/LA mounting
          installed in its place to increase anti-aircraft capability. For the same
          reason the fast minelayers of the Abdiel class had their three 4.7-inch
          twin mountings replaced with three twin 4"/45 HA/LA mountings. The weapon
          was, in effect, demoted late in its career: the forward mountings stayed as
          surface guns while the most exposed position went to a dual-purpose
          mounting. One further detail is worth recording: "X" mounting on the J and
          K classes was originally set up with its mid-training position dead ahead,
          so the stern mounting could not bear directly astern and had to slew the
          long way round to follow a target crossing the stern; early in the war the
          mountings were modified to the normal dead-astern mid-position, and the N
          class was completed to that configuration.
      src: [navweaps-4-7in-45-mk12]

    - heading: 一个反直觉的副作用：它逼着船体加了两块挡板
      text:
        zh: >-
          装这批炮的驱逐舰有一个很显眼的特征：在「B」炮位前方与「X」炮位后方
          各有一块很大的防浪板（sprayshield）。它们确实减少了上浪，
          但真正的用途是减弱上层火炮的炮口暴风对下层炮位炮组的冲击。
          结果是：选了「轻量」的敞开式炮座，设计者反而要付出加装这两块结构的重量代价；
          而装有封闭式 4.7 英寸炮座的 L 至 M 级，则因为可以取消这些挡板
          而省回了相应的重量。navweaps 把这件事当作
          「武器设计如何反过来影响舰体设计」的一个不显眼的例子。
        en: >-
          Destroyers with these guns carried a conspicuous feature: a large
          "sprayshield" forward of "B" gun platform and aft of "X" gun platform.
          They did reduce spray, but their true purpose was to reduce the blast from
          the upper guns disrupting the crews of the guns on the lower decks. The
          result: by choosing "lightweight" open mountings the designers paid a
          weight penalty in having to add these structures, while the L to M classes
          with their enclosed 4.7-inch mountings saved compensating weight by being
          able to eliminate them. NavWeaps treats this as a rather unobvious example
          of how weapon design influences the design of the rest of the ship.
      src: [navweaps-4-7in-45-mk12]

history:
  - id: origin
    title: { zh: 从 Mk IX 分出来, en: Split from the Mark IX }
    range: { from: 1928, to: 1936 }
    lead:
      zh: >-
        同一门炮的两个版本，一个给单装炮座，一个给双联装。
      en: >-
        Two versions of one gun, one for single mountings and one for twins.
    events:
      - date: 1928
        text:
          zh: >-
            完成设计（navweaps 给的是「约 1928 年」）。
            Mark XII 为用在双联装炮座而设计，与 Mark IX 的差别是稍重、稍长；
            两型都用分装弹药。
          en: >-
            Design completed; NavWeaps gives "about 1928". The Mark XII was designed
            for use in twin mountings and differed from the Mark IX in being slightly
            heavier and longer; both fired separate ammunition.
        src: [navweaps-4-7in-45-mk12]
      - date: 1930
        text:
          zh: >-
            进入服役。原型炮装在赫里沃德号（HMS Hereward）上；
            与之配套的 CPXIX 双联装炮座是英国第一个专门为驱逐舰设计的动力炮座。
            这型炮的装舰对象是部族级、J 级、K 级、N 级驱逐舰与阿布迪尔级布雷舰；
            部族级每舰四座 CPXIX 双联装炮座，备弹为每舰 200 发半穿甲弹、
            50 发高爆弹与 50 发照明弹。
          en: >-
            Entered service. The prototype was mounted on HMS Hereward, and the
            CPXIX twin mounting it came with was the first British power mounting
            designed specifically for destroyers. The ships that carried it were the
            Tribal, J, K and N class destroyers and the Abdiel class minelayers; the
            Tribals had four CPXIX twin mountings per ship and an outfit of 200
            rounds of SAP, 50 of HE and 50 star shell per ship.
        src: [navweaps-4-7in-45-mk12]

  - id: service
    title: { zh: 战时使用与改装, en: Wartime service and conversion }
    range: { from: 1939-09, to: 1945 }
    lead:
      zh: >-
        它打了整个战争，但多数舰在战争结束前就把尾炮换成了高射炮。
      en: >-
        It served throughout the war, but most ships had the stern mounting replaced
        by an AA mounting before the end.
    events:
      - date: 1939-09
        text:
          zh: >-
            开战时 J、K、N 级各装三座 CPXIX 双联装炮座，
            每座各配一台 70 马力电动机与泵。
            J 级与 K 级「X」炮座的中间回旋位置原设为正前方，
            尾炮不能直接向正后方射击；战争初期改为正常的正后方中位，N 级出厂即新配置。
          en: >-
            At the outbreak of war the J, K and N classes each carried three CPXIX
            twin mountings, each with its own 70 hp electric motor and pump. On the J
            and K classes the mid-training position of "X" mounting was originally
            dead ahead, so the stern mounting could not bear directly astern; early
            in the war this was changed to the normal dead-astern position, and the N
            class was completed that way.
        src: [navweaps-4-7in-45-mk12]
      - date: 1941
        text:
          zh: >-
            部族级陆续把「X」炮座拆掉，原位换成一座双联 4"/45 高平两用炮座 ——
            这是对「4.7 英寸没有对空能力」最直接的补救。
            阿布迪尔级布雷舰的三座 4.7 英寸双联装炮座也因同样理由
            全部换成双联 4"/45 高平两用炮座。
          en: >-
            The Tribal class progressively had "X" mounting removed and a twin
            4"/45 HA/LA mounting installed in its place - the most direct remedy for
            the 4.7-inch's lack of a dual-purpose capability. For the same reason the
            Abdiel class minelayers had all three of their 4.7-inch twin mountings
            replaced with twin 4"/45 HA/LA mountings.
        src: [navweaps-4-7in-45-mk12]
      - date: 1942
        text:
          zh: >-
            两艘「N」级驱逐舰（原皇家海军 Noble 与 Nonpareil）转交荷兰皇家海军，
            改名为 Van Galen (ii) 与 Tjerk Hiddes。
            这型炮因此也在荷兰海军服役。
          en: >-
            Two "N" class destroyers, ex-RN Noble and ex-RN Nonpareil, were
            transferred to the Royal Netherlands Navy as Van Galen (ii) and Tjerk
            Hiddes, so the weapon also served under the Dutch flag.
        src: [navweaps-4-7in-45-mk12]
      - date: 1945
        text:
          zh: >-
            到战争末期，每门炮配 10 发装 RDX/TNT 炸药的专用反潜高爆弹；
            照明弹搭载量为每舰 150 到 200 发。
            近炸引信自 1944 年起供应，到战争结束时约占高爆弹发放量的一半。
          en: >-
            By the end of the war each gun had ten special anti-submarine HE shells
            filled with RDX/TNT, and star shell complement was 150 to 200 rounds per
            ship. VT fuzes were supplied from 1944 and by the war's end made up about
            half of the HE projectiles issued.
        src: [navweaps-4-7in-45-mk12]
