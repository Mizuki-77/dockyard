# ============================================================================
# 武器正文 —— Blackburn Roc
#
# ⚠️ 这一篇有一个必须并列的矛盾，写在正文第三段与 RESEARCH-NOTES 里：
#    historyofwar：「Both squadrons were land-based, and the Roc was never used
#    from an aircraft carrier.」
#    naval-history：1939-09-11 与 09-22、09-25 逐条记「Blackburn Skuas and Rocs
#    of 803 Sqd embarked」；1940-03-22 记「landed on six Skuas and five Rocs
#    of 800 and 801 Sqds」；1940-03-23 记「18 Skuas & 5 Rocs of 800 & 801」。
#    Fleet Air Arm Archive 中队表：803 中队「April-Oct 1940, Skua II/Roc I」。
#    navypedia 机群表：4.1940 记 5 Roc。
#    两说直接冲突，本站并列不裁决，也不把任何一边写成定论。
#
# 另有一条必须写清的：Roc 与 Skua 不是两种无关的飞机 —— Roc 是 Skua 的改型，
# 用来满足 O.30/35 规范，加了一个电动炮塔，于是性能被压到追不上任何德国轰炸机。
# ============================================================================
weapon: roc
updated: 2026-11-22

intro:
  lead:
    zh: >-
      Blackburn Roc 是皇家海军版的 Boulton Paul Defiant：
      一架把火力全放在动力炮塔里、不靠飞行员瞄准的战斗机。
      它是 Skua 俯冲轰炸机的改型，为满足空军部 O.30/35 号规范而做，
      在机身后座装一座 Bolton Paul 电动炮塔，四挺 .303 英寸 Browning。
      炮塔的重量把 Skua 本来只是平庸的性能压到「追不上任何一种现代德国轰炸机」，
      于是它在第一线只待了几个月，成了一种失败的设计。
      至于它有没有在皇家方舟号上服役过，来源之间直接冲突。
    en: >-
      The Blackburn Roc was the Royal Navy's equivalent to the Boulton Paul Defiant: a
      fighter that put its firepower in a power-operated turret instead of relying on the
      pilot to aim. It was a development of the Skua dive bomber, built to Air Ministry
      Specification O.30/35, with a Bolton Paul power-operated turret of four .303 inch
      Brownings behind the cockpit. The weight of that turret pressed the Skua's merely
      moderate performance down to the point where it "could not have caught up with any
      modern German bomber", so it lasted only a few months in the front line and stands
      as a failed design. Whether it ever served aboard HMS Ark Royal is a direct conflict
      between sources.
  paragraphs:
    - heading: 它的设计逻辑是「从侧面打轰炸机」，不是「追上轰炸机」
      text:
        zh: >-
          这一点与 Defiant 不同，而 historyofwar 把两者的区别写得很清楚。
          Defiant 之所以出现，是因为「有些专家相信现代战斗机太快，
          飞行员无法既驾驶飞机又对同样快速移动的敌机实施准确攻击」，
          动力炮塔可以让第二名乘员专心射击。
          而 Roc 的任务不一样：「Roc 被设计用来攻击敌方轰炸机。
          它的打法是飞到来袭敌机旁边 —— 敌机为了准确攻击海军舰艇
          必须平直飞行 —— 然后用四炮塔向它侧射。」
          也就是说，Roc 不打算追尾、不打算爬高占位，
          它假定目标会保持平直飞行。这个假定只在一种场景下成立：反舰轰炸。
          一旦德国轰炸机不再按那个姿态飞，整套设计的前提就没了。
        en: >-
          This differs from the Defiant, and historyofwar draws the distinction clearly.
          The Defiant existed because "some experts believed that modern fighter aircraft
          were too fast for the pilot to be able to both fly the aircraft and make
          accurate attacks on equally fast moving enemy aircraft", so a power turret let a
          second crewman concentrate on gunnery. The Roc's task was different: "the Roc
          was designed to attack enemy bombers. It was to fly alongside the incoming
          attacker, which would have to be flying straight and level to make an accurate
          attack on the Navy's warships, and fire broadsides from the four-gun turret."
          The Roc did not intend to chase, nor to climb into position; it assumed the
          target would hold a straight, level course. That assumption holds in exactly one
          situation - anti-shipping bombing. Once German bombers stopped flying that way,
          the premise of the whole design was gone.
      src: [historyofwar-roc]
    - heading: 它是 Skua 的改型，而炮塔吃掉了它全部的性能余量
      text:
        zh: >-
          这一条是理解 Roc 的关键，也是它为什么注定失败的原因。
          它是响应 O.30/35 号规范（要求单发双座战斗机、四挺 0.303 英寸 Browning
          装在动力炮塔里）的产物，Blackburn 的回应是「Skua 俯冲轰炸机的改进型」。
          Blackburn 于 1937-04-28 拿到 136 架的合同，
          但因为忙于生产 Skua、又要准备生产同样不成功的 Botha，
          生产被转包给了 Boulton Paul。
          然后是那句判决：「Roc 的根本问题在于，炮塔的额外重量
          把 Skua 本来就中等的性能压低到了它追不上任何一种现代德国轰炸机的程度。
          Skua 本身作为舰载战斗机反而有更长的服役生涯。」
          也就是说，同一副机体，去掉炮塔的版本活得比加炮塔的版本久。
        en: >-
          This is the key to understanding the Roc and why it was bound to fail. It
          answered Specification O.30/35, which called for a single-engined two-man
          fighter armed with four 0.303 inch Brownings in a power-operated turret, and
          Blackburn's response was "a modified version of the Skua dive bomber". Blackburn
          were given a contract for 136 Rocs on 28 April 1937, but being busy producing
          the Skua and preparing to produce the equally unsuccessful Botha, they
          sub-contracted production to Boulton Paul. Then comes the verdict: "The basic
          problem with the Roc was that the extra weight of the turret reduced the
          moderate performance of the Skua to a point where it could not have caught up
          with any modern German bomber. The Skua itself would have a longer career as a
          naval fighter." The same airframe, without the turret, outlasted the version
          with it.
      src: [historyofwar-roc]
    - heading: 它到底上没上过航空母舰：来源直接冲突
      text:
        zh: >-
          这一条本站并列两种说法，不裁决。
          historyofwar 写得很绝对：「801 与 806 两个中队都在 1940 年接收了这型机，
          与它们的 Skua 一同使用。两个中队都是岸基的，
          Roc 从未从航空母舰上使用过。」（Both squadrons were land-based, and the Roc
          was never used from an aircraft carrier.）
          但 naval-history 的皇家方舟号年表在 1939 年 9 月 11 日、9 月 22 日、
          9 月 25 日三处都记着本舰编成里有「Blackburn Skuas and Rocs of 803 Sqd」；
          1940 年 3 月 22 日记「landed on six Skuas and five Rocs of 800 and 801 Sqds」，
          3 月 23 日记「18 Skuas & 5 Rocs of 800 & 801 and 21 Swordfish of 810 & 820
          embarked」。Fleet Air Arm Archive 的中队表把 803 中队 1940 年 4 月至 10 月
          的机型记作「Skua II/Roc I」；navypedia 的机群附表在 1940 年 4 月一栏记「5 Roc」。
          两种说法无法同时成立，本站两边都写，不选边。
        en: >-
          Two accounts are set side by side here without adjudication. historyofwar is
          absolute: "Nos.801 and 806 Squadrons both received the type during 1940,
          operating them alongside their Skuas. Both squadrons were land-based, and the
          Roc was never used from an aircraft carrier." But naval-history's Ark Royal
          chronology records "Blackburn Skuas and Rocs of 803 Sqd" embarked on 11, 22 and
          25 September 1939; for 22 March 1940 it records the ship landing on "six Skuas
          and five Rocs of 800 and 801 Sqds", and on 23 March 1940 "18 Skuas & 5 Rocs of
          800 & 801 and 21 Swordfish of 810 & 820 embarked". The Fleet Air Arm Archive's
          squadron table gives 803 Squadron's type for April to October 1940 as "Skua
          II/Roc I", and Navypedia's air-group table gives "5 Roc" for April 1940. The two
          positions cannot both be true; both are written here and neither is chosen.
      src: [historyofwar-roc, naval-history-arkroyal, faa-arkroyal-archive, navypedia-arkroyal]
    - heading: 主要参数
      text:
        zh: >-
          按 historyofwar 的陆基型数据：发动机 Bristol Perseus XII，890 马力；
          翼展 46 英尺 0 英寸，机长 35 英尺 7 英寸，机高 12 英尺 1 英寸；
          全重 7,950 磅（陆基型）；最大速度陆基型 223 mph、水上型 193 mph；
          武器为 Bolton Paul 炮塔内四挺 0.303 英寸机枪。
          naval-history 在同一段机型说明里另给了几条：它是「Skua 的双座
          战斗/轰炸机改型，性能与 Skua 相近但航程更短，
          装有 Bolton Paul 电动旋转炮塔、内装四挺 Browning .303 英寸机枪，
          挂弹 250 磅」。两源在武器与挂弹上一致；
          最大速度 223 mph 只有 historyofwar 给，naval-history 未给 Roc 的速度数字。
        en: >-
          On historyofwar's landplane figures: Bristol Perseus XII engine of 890 hp; wing
          span 46 ft 0 in, length 35 ft 7 in, height 12 ft 1 in; all-up weight 7,950 lb as
          a landplane; maximum speed 223 mph as a landplane and 193 mph as a seaplane;
          armament four 0.303 inch machine guns in a Boulton Paul turret. naval-history's
          type note adds that it was "a two seat fighter/bomber development of the Skua,
          performance similar to Skua but a shorter range, fitted with a Bolton Paul
          rotating electrically powered turret mounting four Browning .303" machine-guns.
          Bomb load 250lb." The two agree on armament and bomb load; the 223 mph figure
          comes from historyofwar alone, as naval-history gives no speed for the Roc.
      src: [historyofwar-roc, naval-history-arkroyal]
    - heading: 它还有一个水上型，而那个更失败
      text:
        zh: >-
          historyofwar 用两句把这个支线交代完了：Roc 也按 26/36 号规范
          做过水上型，但「这个版本并不比战斗机版更成功。
          浮筒让飞机航向上不稳定，第一架水上型在试飞中坠毁。
          此后只又造了两架。」
          也就是说，整型 136 架的合同里，水上型的产量是三架。
          这一条与皇家方舟号无关，但它说明 Roc 这个方案
          在任何一种形态下都没有走通。
        en: >-
          historyofwar disposes of this offshoot in two sentences: the Roc was also
          produced as a floatplane to specification 26/36, "but this version was no more
          successful than the fighter. The floats made the aircraft directionally
          unstable, and the first floatplane crashed during testing. Only two more were
          produced." Of a contract for 136 aircraft, the floatplane total was three. It
          has nothing to do with Ark Royal, but it shows that the Roc concept failed to
          work in any form.
      src: [historyofwar-roc]
history:
  - id: origin
    title: { zh: 从 Skua 派生, en: Derived from the Skua }
    range: { from: 1935, to: 1938-12 }
    lead:
      zh: >-
        一份要求「四挺机枪装在动力炮塔里」的规范，加上一副 Skua 的机体。
      en: >-
        A specification demanding four guns in a power turret, married to a Skua airframe.
    events:
      - date: 1935
        text:
          zh: >-
            空军部发布 O.30/35 号规范，要求单发双座战斗机、
            四挺 0.303 英寸 Browning 机枪装在动力炮塔内。
            Blackburn 以 Skua 的改进型回应。
          en: >-
            The Air Ministry issued Specification O.30/35, calling for a single-engined
            two-man fighter armed with four 0.303 inch Browning guns mounted in a power
            operated turret. Blackburn responded with a modified version of the Skua.
        src: [historyofwar-roc]
      - date: 1937-04-28
        text:
          zh: >-
            Blackburn 拿到 136 架的合同，但因忙于 Skua 与 Botha，
            生产转包给 Boulton Paul。
          en: >-
            Blackburn were given a contract for 136 Rocs, but being busy with the Skua and
            the Botha, sub-contracted production to Boulton Paul.
        src: [historyofwar-roc]
      - date: 1938-12-23
        text:
          zh: >-
            第一架首飞。此后为提高性能做过努力，但没有改变结果。
          en: >-
            The first aircraft made its maiden flight. Efforts to improve its performance
            followed but did not change the outcome.
        src: [historyofwar-roc]
  - id: service
    title: { zh: 短暂的一线生涯, en: A brief front-line career }
    range: { from: 1939-09, to: 1943 }
    lead:
      zh: >-
        一线只待了几个月，其余时间在二线单位，有些一直用到 1943 年。
      en: >-
        A few months in the front line, then second-line units, some surviving until 1943.
    events:
      - date: 1939-09
        text:
          zh: >-
            naval-history 记本舰 9 月 11 日、22 日、25 日三次编成里都含
            「Blackburn Skuas and Rocs of 803 Sqd」。
            这与 historyofwar「Roc 从未从航空母舰上使用过」的说法直接冲突，
            两说并列见简介第三段。
          en: >-
            naval-history records "Blackburn Skuas and Rocs of 803 Sqd" in the ship's
            establishment on 11, 22 and 25 September. This directly conflicts with
            historyofwar's statement that the Roc was never used from an aircraft carrier;
            both positions stand together and are set out in the third intro paragraph.
        src: [naval-history-arkroyal, historyofwar-roc]
      - date: 1940
        text:
          zh: >-
            801 与 806 两个中队在这一年接收该型，与各自的 Skua 混用；
            按 historyofwar 的说法两中队都是岸基。
            这一年也是它一线生涯的全部：此后它退到二线单位，
            有些一直存留到 1943 年。
          en: >-
            Nos. 801 and 806 Squadrons received the type during this year, operating it
            alongside their Skuas, and per historyofwar both squadrons were land-based.
            This year was also the whole of its front-line career: afterwards it went to
            second-line units, where some survived until 1943.
        src: [historyofwar-roc]
      - date: 1940-04
        text:
          zh: >-
            navypedia 的机群附表在 1940 年 4 月一栏记本舰有「5 Roc」，
            同月记 18 Skua、21 Swordfish、1 Walrus；5 月一栏已无 Roc。
            Fleet Air Arm Archive 把 803 中队 1940 年 4 月至 10 月的机型
            记作「Skua II/Roc I」。这三个来源与 historyofwar 的说法不一致。
          en: >-
            Navypedia's air-group table gives the ship "5 Roc" for April 1940, alongside 18
            Skua, 21 Swordfish and 1 Walrus for the same month; by May the Roc entry is
            gone. The Fleet Air Arm Archive gives 803 Squadron's type for April to October
            1940 as "Skua II/Roc I". These three sources do not agree with historyofwar.
        src: [navypedia-arkroyal, faa-arkroyal-archive, historyofwar-roc]
      - date: 1940-06
        text:
          zh: >-
            一个具体的旁证：1940-04-25 海军部下发的一份空中政策说明里，
            提到在纳姆索斯地区「有可能找到一处基地，供十二架装浮筒的 Roc 使用，
            此事正由海军与空军参谋部门积极调查」。
            也就是说，Roc 在这一时期被考虑过以水上型部署到挪威前线，
            但这段记载讲的是计划，不是它已经上舰或上阵。
          en: >-
            One concrete sidelight: in an air policy statement circulated by the Admiralty
            on 25 April 1940, it was noted that in the Namsos area "it appears possible
            that a base for twelve Rocs on floats might be found in the vicinity. This is
            being actively investigated by Naval and Air staffs." The Roc was therefore
            being considered for deployment to the Norwegian front as a floatplane in this
            period - but the record describes a plan, not the type already in action or
            embarked.
        src: [naval-history-arkroyal]
