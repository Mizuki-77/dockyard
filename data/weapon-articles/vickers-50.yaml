# ============================================================================
# 武器正文 —— 0.5"/62 (12.7 mm) MG Mark III（维克斯 .50 四联高射机枪）
#
# 主线四条：
#   1. 它是「几乎所有英国军舰都装过」的东西，产量 12,500 挺；
#   2. 它比美国同口径的 Browning M2 明显更弱 —— 这是 NavWeaps 的原话；
#   3. 英国人自己就判定这类小口径机枪打不了现代飞机，于是它在战争中
#      被 20 mm Oerlikon 一批批换掉（逐舰记录见 navypedia 的改装台账）；
#   4. 皇家方舟号是个例外：一般大舰装四座四联，它装了八座。
#
# ⚠️ 来源说明：任务下发的 URL 写作 WNBR_05_50_vickers.php，实测 404。
#    NavWeaps 上这一型的实际页是 WNBR_5-62_mk3.php
#    （标题 "0.50"/62 (12.7 mm) MG Mark III"），从 WNBR_Main.php 索引页取到。
# ============================================================================
weapon: vickers-50
updated: 2026-11-22

intro:
  lead:
    zh: >-
      0.5"/62 (12.7 mm) Mark III 是英国皇家海军在 1930 年代到二战中期
      普遍装备的四联装高射机枪，也就是通常说的维克斯 .50。
      1926 年开始生产，1932 年之后才大批上舰，二战中总产量 12,500 挺。
      它在设计上并不差，问题出在口径：英国人在战争中自己判定，
      这类小口径机枪对现代飞机已经无效，于是用 20 mm Oerlikon 逐批替换。
      皇家方舟号是这型武器装得最多的一条船 —— 八座四联，32 挺。
    en: >-
      The 0.5"/62 (12.7 mm) Mark III was the quadruple anti-aircraft machine gun
      carried by most of the Royal Navy from the 1930s into the middle of the war -
      the Vickers .50. Production began in 1926, widespread fitting followed only after
      1932, and 12,500 were built during the war. The design was not the problem; the
      calibre was. The British concluded during the war that small-calibre machine guns
      of this class were ineffective against modern aircraft and replaced them batch by
      batch with the 20 mm Oerlikon. HMS Ark Royal was the ship that carried more of
      them than any other - eight quadruple mountings, thirty-two guns.
  paragraphs:
    - heading: 它的产量与装舰范围，本身就是它的问题所在
      text:
        zh: >-
          NavWeaps 的表述按顺序给了三件事。第一，装舰范围：
          这型武器「在二战期间几乎装在所有的英国军舰上，很多是四联装」。
          第二，性质：它是后坐式、水冷、链式弹带供弹的机枪，
          「威力明显不如美国海军的 0.50 英寸 Browning M2」。
          第三，评价：「与美国和大多数其他国家一样，英国人发现
          这类小口径机枪对现代飞机是无效的。尽管如此，
          这型武器在战争中仍然大量生产，总产量 12,500 挺。」
          三句话连起来是一件事：它之所以到处都是，不是因为它好用，
          是因为在更好的东西能大批到货之前，只有它。
        en: >-
          NavWeaps gives three things in order. First, the extent of fitting: the
          weapon "was used on almost all British warships during World War II, many in
          quad mounts". Second, what it was: a recoil-operated, water-cooled gun with
          link-belt feed that was significantly less powerful than the USN's 0.50-inch
          (12.7 mm) Browning M2 BMG. Third, the verdict: "Like the US and most other
          nations, the British found small-caliber machine guns like these to be
          ineffective against modern aircraft. Nonetheless, this weapon was still
          produced in large numbers during the war with an overall total of 12,500 being
          built." Read together they say one thing: it was everywhere not because it was
          good, but because until something better could be had in quantity, it was all
          there was.
      src: [navweaps-vickers-50]
    - heading: 主要参数
      text:
        zh: >-
          名义口径 0.5 英寸（12.7 毫米），实际膛长 62.5 倍口径；
          炮身长 35 英寸（89 厘米），膛长 31.25 英寸（79.4 厘米）；
          炮重 25.4 公斤，灌满冷却水后 28.1 公斤。
          弹药为整装式，弹丸为实心弹（ball），重 580 格令（37.6 克），
          发射药 142 格令（9.2 克）Cordite 7/2，初速 768 米/秒。
          射速：循环射速 600 到 700 发/分；加延时棘爪后 450 发/分；
          实际射速 150 到 200 发/分。
          每个弹鼓装 200 发，约合 20 秒的射击量，装满的弹鼓重 27.2 公斤；
          四联装炮座的四个弹鼓由熟练炮组可在 30 秒内换完；每门炮备弹约 2,500 发。
          射程：有效 800 码（730 米），最大约 5,000 码（4,570 米）。
          炮座回旋 360 度，后坐行程 1.25 英寸（3.2 厘米）。
        en: >-
          Nominal calibre 0.5 inch (12.7 mm), actual bore length 62.5 calibres; gun
          length overall 35 in (89 cm) with 31.25 in (79.4 cm) of bore; gun weight
          25.4 kg, or 28.1 kg with the cooling jacket filled. Ammunition was fixed, the
          ball projectile weighing 580 gr (37.6 g) over 142 gr (9.2 g) of Cordite 7/2,
          for a muzzle velocity of 768 m/s. Rate of fire: 600 to 700 rounds per minute
          cyclic, 450 cyclic with a delay pawl, and 150 to 200 practical. Each drum held
          200 rounds, about twenty seconds of firing, and a loaded drum weighed 27.2 kg;
          the four drums of a quad mounting could be replaced within thirty seconds by
          a well-trained crew, and magazine capacity was about 2,500 rounds per gun.
          Range was 800 yards (730 m) effective and about 5,000 yards (4,570 m) maximum.
          The mounting trained through 360 degrees and recoil was 1.25 in (3.2 cm).
      src: [navweaps-vickers-50]
    - heading: 战前算出来的命中率，是一道算术题，不是实测
      text:
        zh: >-
          这一条值得单独写，因为它解释了「为什么纸面上看起来还行」。
          战前的计算是：一座四联装打一个十秒的连发，约合 400 到 450 发，
          预期能有 40 发命中。但 NavWeaps 紧接着说明了这个数字的前提 ——
          这道计算假定「目标在整个连发期间完全落在散布范围内」，
          而这意味着方向手与高低手必须准确判断来袭飞机的接近速度，
          并在这十秒里持续人工修正瞄准，不管舰体当时在横摇、纵摇还是偏航。
          换句话说：40 发的预期命中率成立的条件，是炮手在一条摇动的船上
          用手轮完美跟踪一个高速接近的目标十秒钟。这不是对这型武器的特别挖苦，
          这是那个年代所有人力瞄准小口径高炮的共同处境。
        en: >-
          This deserves its own paragraph because it explains why the weapon looked
          adequate on paper. The pre-war calculation was that a ten-second burst from a
          quad mounting, about 400 to 450 rounds, could expect 40 rounds to hit. NavWeaps
          states the assumption immediately: the analysis "assumed that the target area
          was entirely within the pattern of spread for the duration of the burst",
          which meant both the layer and the trainer had to judge the approach speed of
          the attacking aircraft perfectly and then constantly adjust their aiming by
          hand during those ten seconds, regardless of how the ship rolled, pitched and
          yawed. The forty-hit expectation therefore required a crew to track a
          fast-closing target perfectly by handwheel, for ten seconds, from a moving
          deck. That is not a particular dig at this weapon; it is the common position of
          every manually aimed light AA mounting of the period.
      src: [navweaps-vickers-50]
    - heading: 四联装炮座不是一个型号，是四个
      text:
        zh: >-
          这一条最容易写错。「0.5 英寸四联装」不是单一炮座：
          NavWeaps 列出四联装 Mark I、Mark I**、Mark II、Mark II** 与 Mark III。
          重量差别很大：Mark I 728 公斤、Mark I* 998 公斤、Mark II 1,310 公斤、
          Mark III 1,170 公斤。俯仰范围也不同：Mark I 与 I** 是 -10 到 +70 度，
          Mark II、II** 与 III 是 -10 到 +80 度。
          Mark III 的改动是换了直径更大、更结实的底板；旧炮座有机会就按这个标准改，
          改过的分别叫 Mark I* 与 Mark II*。
          除 Mark V 与 VC 之外，所有炮座的俯仰与回旋都是纯人力，没有动力。
          另有一处细节：四联装的四根炮管彼此略微不平行，刻意造出一点「散布」。
        en: >-
          This is the point most often got wrong. "The 0.5-inch quad" is not one
          mounting: NavWeaps lists quad Mark I, Mark I**, Mark II, Mark II** and Mark
          III. Weights differ widely - Mark I 728 kg, Mark I* 998 kg, Mark II 1,310 kg,
          Mark III 1,170 kg - and so does elevation: -10 to +70 degrees on the Mark I and
          I**, -10 to +80 on the Mark II, II** and III. The Mark III's change was a new
          base plate, more robust and of larger diameter than the earlier types; older
          Mark I and Mark II mountings were modified to match as opportunity offered and
          the modified mounts were redesignated Mark I* and Mark II*. Apart from the
          Mark V and VC, every mounting was manually operated only, with no power. One
          further detail: the quad mounting's barrels were slightly misaligned from each
          other in order to give a "scatter" effect.
      src: [navweaps-vickers-50]
    - heading: 皇家方舟号装了八座，这是全海军最多的
      text:
        zh: >-
          NavWeaps 在这一型的炮座注释里专门点了名：「大型舰通常装四座四联装炮座，
          但皇家方舟号装了八座。」巡洋舰是两到四座，驱逐舰是两座。
          八座四联即 32 挺，这与另外两个独立来源对得上：
          navypedia 的皇家方舟号装备栏写「8 x 4 - 12.7/62」，
          Fleet Air Arm Archive 的该舰页写「32 x 0.5 inch AA」。
          也就是说，本舰的近程防空在建成时是由这 32 挺机枪承担的，
          而它所依赖的正是上面那段「十秒连发预期 40 发命中」的计算。
        en: >-
          NavWeaps names the ship in its mounting note: "Large ships usually had four
          quad mountings, but HMS Ark Royal had eight." Cruisers had two to four and
          destroyers two. Eight quads means thirty-two guns, which agrees with two other
          independent sources: Navypedia's armament line for Ark Royal reads "8 x 4 -
          12.7/62", and the Fleet Air Arm Archive's page for the ship gives "32 x 0.5
          inch AA". At completion, then, the ship's close-range anti-aircraft defence
          rested on those thirty-two guns - and on the ten-second, forty-hit calculation
          described above.
      src: [navweaps-vickers-50, navypedia-arkroyal, faa-arkroyal-archive]
    - heading: 替换是逐舰进行的，有台账可查
      text:
        zh: >-
          这一条要写清「被取代」到底是怎么发生的，因为它不是一次性换装。
          navypedia 的城级改装台账把它记成了逐舰逐月的动作：
          1941 年 9 月谢菲尔德号「- 2 x 4 - 12.7/62 …… + 6 x 1 - 20/70 Oerlikon
          Mk II/IV」；1942 年 3 月伯明翰号、8 月格拉斯哥号、11 月纽卡斯尔号
          各自以同样的方式拆掉 12.7 mm 四联、换上 20 mm Oerlikon。
          也就是说，替换的时间点由各舰的改装档期决定，而不是由某个统一命令决定。
          至于皇家方舟号本舰有没有在 1941 年 11 月沉没前拆掉这八座，
          已查来源均未记载，本站不写。
        en: >-
          How the replacement actually happened has to be stated, because it was not a
          single re-armament. Navypedia's modernisation ledger for the Town class records
          it ship by ship and month by month: in September 1941 Sheffield shows "- 2 x 4
          - 12.7/62 ... + 6 x 1 - 20/70 Oerlikon Mk II/IV"; in March 1942 Birmingham, in
          August 1942 Glasgow and in November 1942 Newcastle each removed their 12.7 mm
          quads and took 20 mm Oerlikons in the same fashion. The timing was therefore
          set by each ship's own refit slot rather than by a single fleet order. Whether
          Ark Royal herself had her eight mountings removed before she sank in November
          1941 is not recorded in any source consulted, and is not written here.
      src: [navypedia-town]
    - heading: 它还被卖到了日本和中国
      text:
        zh: >-
          这一型不只在英国服役。NavWeaps 记载：1930 年代后期有少量炮出口到日本，
          日方定型为 12 mm/62「BI」式（也称「HI」式）；
          这些日本炮在太平洋战争爆发前大多被更好的 13 mm 九三式
          与 25 mm 九六式（Hotchkiss）取代。中国在战前购买了 19 门英国炮。
          这两条与皇家方舟号无关，但它说明这型武器在 1930 年代
          是被当作一种可以出口的成熟产品看待的。
        en: >-
          The type did not serve only in Britain. NavWeaps records that a few guns were
          exported to Japan during the late 1930s, where they were designated the 12
          mm/62 "BI" Type (also known as the "HI" Type); the Japanese guns were mostly
          replaced by the start of the Pacific War by the superior 13 mm Type 93 and 25
          mm Type 96 Hotchkiss guns. China purchased 19 British guns pre-war. Neither
          point concerns Ark Royal, but together they show the weapon being treated in
          the 1930s as a mature product fit for export.
      src: [navweaps-vickers-50]
history:
  - id: origin
    title: { zh: 设计、生产与上舰, en: Design, production and service entry }
    range: { from: 1926, to: 1932 }
    lead:
      zh: >-
        1926 年投产，但真正大批上舰是 1932 年以后 —— 这两件事之间隔了六年。
      en: >-
        Production began in 1926, but widespread fitting only came after 1932 - six years
        apart.
    events:
      - date: 1926
        text:
          zh: >-
            维克斯开始生产这型炮。NavWeaps 给的设计年份与服役年份都是 1926，
            但同一页的描述段写着「英国军舰上的服役引入看来不早于 1932 年」——
            两处口径不一致，本站并列不裁决。
          en: >-
            Vickers started production. NavWeaps gives both the date of design and the
            date in service as 1926, yet the description on the same page states that
            service introduction on British ships "does not seem to have taken place
            prior to 1932". The two statements do not agree and both are recorded without
            adjudication.
        src: [navweaps-vickers-50]
      - date: 1932
        text:
          zh: >-
            按 NavWeaps 描述段的说法，这型武器到这一年前后才在英国军舰上普及。
            此后它成为皇家海军近程防空的标配，绝大多数舰只以四联装形式安装。
          en: >-
            According to NavWeaps's description, the weapon became widespread aboard
            British ships only around this year. From then on it was standard close-range
            anti-aircraft equipment in the Royal Navy, fitted in quad mountings on the
            great majority of ships.
        src: [navweaps-vickers-50]
  - id: service
    title: { zh: 战时使用与逐舰替换, en: Wartime service and piecemeal replacement }
    range: { from: 1938-11, to: 1945 }
    lead:
      zh: >-
        它在战争前半段撑着英国军舰的近程防空，后半段被一门 20 mm 炮一船一船换掉。
      en: >-
        It held up British close-range AA through the first half of the war, then was
        replaced a ship at a time by a 20 mm gun.
    events:
      - date: 1938-11
        text:
          zh: >-
            皇家方舟号建成，装八座四联装共 32 挺 —— 这是 NavWeaps 明确指出的
            全海军最多的一例（大舰通常四座）。同年 navypedia 的装备栏与本舰页
            分别记作「8 x 4 - 12.7/62」与「32 x 0.5 inch AA」。
          en: >-
            Ark Royal completed with eight quadruple mountings, thirty-two guns - the
            case NavWeaps singles out as the largest in the navy, against the usual four
            in a large ship. Navypedia's armament line and the ship's own archive page
            record the same as "8 x 4 - 12.7/62" and "32 x 0.5 inch AA" respectively.
        src: [navweaps-vickers-50, navypedia-arkroyal, faa-arkroyal-archive]
      - date: 1941-09
        text:
          zh: >-
            谢菲尔德号在这一次改装中拆掉两座四联 12.7 mm，换装六门单装 20 mm
            Oerlikon Mk II/IV。这是城级台账里第一处明确的「0.5 换 20 mm」记录，
            也是「小口径机枪无效」这个判断落到实处的样子。
          en: >-
            Sheffield had two quadruple 12.7 mm mountings removed in this refit and took
            six single 20 mm Oerlikon Mk II/IV in their place. This is the first explicit
            "0.5 out, 20 mm in" entry in the Town class ledger, and it is what the
            judgement that small-calibre machine guns were ineffective looked like when
            it was carried out.
        src: [navypedia-town, navweaps-vickers-50]
      - date: 1942
        text:
          zh: >-
            同年内伯明翰号（3 月）、格拉斯哥号（8 月）、纽卡斯尔号（11 月）
            相继完成同样的替换。替换节奏由各舰的改装档期决定。
          en: >-
            Within the same year Birmingham (March), Glasgow (August) and Newcastle
            (November) completed the same substitution in turn. The pace was set by each
            ship's own refit schedule.
        src: [navypedia-town]
