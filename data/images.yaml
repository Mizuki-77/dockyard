  图片登记表。授权三档规则（详见 docs/00-framework.md §5.4 与 data/sources.yaml）：
  A = 公有领域或 CC0，可站内归档、可商用，署名是礼貌而非义务；
  B = CC BY / CC BY-SA，可站内归档，但必须署作者、链授权条款、标明是否改作；
  C = 仅外链，不得归档（IWM 全站、大和ミュージアム、Europeana 的 NoC-NC 件、一切 editorial use only）。
  本表 file 字段为空表示只能外链。license_raw 是 Commons 上的原始授权字符串，原样保留以便复核。
  IWM 判例（2026-11-18 定）：原件藏 IWM 的英国战时官方摄影，若 Commons 上的数字化副本标为 Public domain（Crown Copyright 已过期、无署名义务），按 A 档归档，note 必须写明 IWM 编号并说明「IWM 官网对其网站副本另有非商业条款，本站引用的是 Commons 的公有领域版本」；从 IWM 站内直接取得、或 Commons 上无 PD 依据的副本，一律 C 档禁用。依据 §5.4 硬约束 1——授权跟这张数字化副本走。
  注意：Commons 的 PD 标签是社区标注，不是法律担保（见 work/raw/image-sources.md §4.3 第 4 条）。归档条目一旦被发现有误标，立刻撤下并改外链。
  所有条目均逐张读过 Commons imageinfo.extmetadata；source_url 是 Commons 文件页，不是原机构页面。
  width / height 记的是站内落盘文件的实际像素，不是源图尺寸。

