  - { id: appearance.island_position,      label: { zh: 舰岛位置, en: Island position },               type: enum, unit: null, group: appearance, compare: false, better: none, values: [starboard, port, none, other], note: 航母的舰岛在左舷还是右舷。赤城左舷（实验性设计）、飞龙右舷、约克城级右舷。战列舰不写此项。 }

