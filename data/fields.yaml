  - { id: aviation.fuel.capacity,          label: { zh: 航空燃油容量, en: Aviation fuel capacity },      type: number, unit: t, group: aviation, compare: false, better: none, note: 全库暂无数据。来源一律只给体积（见 aviation.fuel.volume），换算重量属推断，不入库。 }
