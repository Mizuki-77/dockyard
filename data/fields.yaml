  # ===== aviation =====
  - { id: aviation.aircraft.capacity,      label: { zh: 搭载机数, en: Aircraft capacity },             type: integer, unit: count, group: aviation, compare: true, better: higher }
  - { id: aviation.aircraft.types,         label: { zh: 搭载机型, en: Aircraft types },                type: string, unit: null, group: aviation, compare: false, better: none }
  - { id: aviation.catapult.count,         label: { zh: 弹射器数, en: Catapults },                     type: integer, unit: count, group: aviation, compare: true, better: higher }
  - { id: aviation.catapult.type,          label: { zh: 弹射器型式, en: Catapult type },               type: string, unit: null, group: aviation, compare: false, better: none }
  - { id: aviation.crane.count,            label: { zh: 吊车数, en: Cranes },                          type: integer, unit: count, group: aviation, compare: false, better: none }
  - { id: aviation.deck.length,            label: { zh: 飞行甲板长, en: Flight deck length },          type: number, unit: m, group: aviation, compare: true, better: higher }
  # 2026-11-19 为赤城的三段式甲板补。三段甲板航母（赤城 1927-1935、加贺同期）
  # 的上/中/下三段各有独立长度与用途，用单一 aviation.deck.length 表达不了：
  # 赤城上段 190.20 m（着舰 + 大型机起飞）、中段 15.0 m（只够轻机）、
  # 下段 55.02 m（大型机起飞）。中段 15 m 这个数字本身就是设计失败的直接证据，
  # 混进一个「249 m 全通甲板」里就看不见了。
  # 单段全通甲板的航母不写这三个字段，只写 aviation.deck.length。
  - { id: aviation.deck.upper.length,      label: { zh: 上段甲板长, en: Upper flight deck length },    type: number, unit: m, group: aviation, compare: false, better: none, note: 三段式甲板的着舰段与大型机起飞段。单段全通甲板的航母不写此项。 }
  - { id: aviation.deck.middle.length,     label: { zh: 中段甲板长, en: Middle flight deck length },   type: number, unit: m, group: aviation, compare: false, better: none, note: 三段式甲板的中段，通常只够极轻的飞机起降。赤城的中段仅 15 m，是该设计失败的直接证据。 }
  - { id: aviation.deck.lower.length,      label: { zh: 下段甲板长, en: Lower flight deck length },    type: number, unit: m, group: aviation, compare: false, better: none, note: 三段式甲板的下段，用于大型机起飞。 }
  - { id: aviation.deck.width,             label: { zh: 飞行甲板宽, en: Flight deck width },           type: number, unit: m, group: aviation, compare: true, better: higher }
  - { id: aviation.elevator.count,         label: { zh: 升降机数, en: Elevators },                     type: integer, unit: count, group: aviation, compare: true, better: higher }
  - { id: aviation.hangar.count,           label: { zh: 机库数, en: Hangars },                         type: integer, unit: count, group: aviation, compare: false, better: none }
  - { id: aviation.hangar.height,          label: { zh: 机库净高, en: Hangar clear height },          type: number, unit: m, group: aviation, compare: true, better: higher, note: 装甲航母的核心代价就写在这一个数上：机库越矮，能塞进去的飞机越小。日后换装更大机型的瓶颈通常不是甲板长度而是机库高度 }
  - { id: aviation.hangar.length,          label: { zh: 机库总长, en: Hangar length },                  type: number, unit: m, group: aviation, compare: true, better: higher }
  - { id: aviation.hangar.width,           label: { zh: 机库宽, en: Hangar width },                     type: number, unit: m, group: aviation, compare: true, better: higher }
  - { id: aviation.elevator.dimensions,    label: { zh: 升降机尺寸, en: Elevator dimensions },          type: string, unit: null, group: aviation, compare: false, better: none, note: 写成长×宽，如 45 x 22 ft。升降机尺寸常常比机库高度更早成为换装的限制 }
  - { id: aviation.fuel.volume,           label: { zh: 航空汽油容量（体积）, en: Aviation fuel capacity (volume) }, type: number, unit: dm3, group: aviation, compare: false, better: none,
                                                                                                         note: 文献常以加仑或升给出航空汽油容量，而重量随温度与牌号变化。体积是原话直接给的量，重量是换算结果——不要把换算值当记载值。1 升 = 1 dm³。 }
  # 2026-11-18 对比器开工：改为 compare:false。原因不是没数据，是口径不可比——
  # navyed 一向只给「体积」（dm3，见上一行 aviation.fuel.volume，illustrious 有 230,000 L），
  # 换算成重量要乘密度，而航空汽油密度随牌号与温度变化。把换算值写进「容量(t)」
