version: 1
updated: 2026-11-17
note: >
  字段注册表 v0。任何 fact 的 field 必须出现在本表，否则校验失败。
  新增字段 = 改本文件 → 提 PR → 过校验。不允许在数据文件里现造字段名。
  命名规则：namespace.name[.sub]，全小写 + 下划线，至少两段，第一段必须属于 namespaces。

# ---------------------------------------------------------------- 单位
# 存储层统一公制。英制/其它单位在录入时换算，不收。
units:
  t:        { zh: 公吨,       en: metric tonne,   kind: mass }
  kg:       { zh: 千克,       en: kilogram,       kind: mass }
  m:        { zh: 米,         en: metre,          kind: length }
  cm:       { zh: 厘米,       en: centimetre,     kind: length }
  mm:       { zh: 毫米,       en: millimetre,     kind: length }
  kn:       { zh: 节,         en: knot,           kind: speed }
  mps:      { zh: 米/秒,      en: metre/second,   kind: speed }
  nmi:      { zh: 海里,       en: nautical mile,  kind: distance }
  km:       { zh: 千米,       en: kilometre,      kind: distance }
  kph:      { zh: 千米/时,    en: kilometre/hour, kind: speed }
  hp:       { zh: 马力,       en: shaft horsepower, kind: power }
  kW:       { zh: 千瓦,       en: kilowatt,       kind: power }
  deg:      { zh: 度,         en: degree,         kind: angle }
  celsius:  { zh: 摄氏度,     en: degree Celsius, kind: temperature }
  s:        { zh: 秒,         en: second,         kind: time }
  rpm:      { zh: 发/分,      en: rounds per minute, kind: rate }
  atm:      { zh: 大气压,     en: atmosphere,     kind: pressure }
  dm3:      { zh: 立方分米,   en: cubic decimetre, kind: volume }
  count:    { zh: 个,         en: count,          kind: count }
  persons:  { zh: 人,         en: persons,        kind: count }
  ratio:    { zh: 比值,       en: ratio,          kind: dimensionless }
  pct:      { zh: 百分比,     en: percent,        kind: dimensionless }
  date:     { zh: 日期,       en: date,           kind: date }

# 明确拒收的单位 —— 报错时给出换算提示。防止把公吨写成 mt、长度写成英尺。
rejected_units:
  mt:  公吨请写 t。mt 在部分文献里指 metric ton、在另一些文献里指 measurement ton，含义不唯一。
  tonne: 请写 t。
  lt: 长吨（long ton）请在录入时换算为 t。
  st: 短吨（short ton）请在录入时换算为 t。
  ft: 英尺请换算为 m。
  in: 英寸请换算为 cm 或 mm。
  yd: 码请换算为 m。
  mi: 英里请换算为 km。
  psi: 请换算为 atm 或 kg/cm²。
  kn_: 节请写 kn。

# ---------------------------------------------------------------- 命名空间
namespaces:
  identity:     身份标识
  displacement: 排水量
  dimensions:   尺度
  propulsion:   动力与推进
  protection:   装甲与防护
  armament:     武备装载
  weapon:       武器本体
  mount:        炮位实例
  sensors:      探测与火控
  aviation:     航空设施
  construction: 建造
  service:      服役与编制
  appearance:   涂装与标识
  media:        影像与线图
  modelling:    模型套件

# ---------------------------------------------------------------- 字段分组
groups:
  - { id: identity,     label: { zh: 身份标识, en: Identity },           order: 1 }
  - { id: dimensions,   label: { zh: 尺寸与排水, en: Dimensions },        order: 2 }
  - { id: propulsion,   label: { zh: 动力与推进, en: Propulsion },        order: 3 }
  - { id: protection,   label: { zh: 装甲与防护, en: Protection },        order: 4 }
  - { id: armament,     label: { zh: 武备装载, en: Armament },            order: 5 }
  - { id: sensors,      label: { zh: 探测与火控, en: Sensors & Fire Control }, order: 6 }
  - { id: aviation,     label: { zh: 航空设施, en: Aviation },            order: 7 }
  - { id: construction, label: { zh: 建造, en: Construction },            order: 8 }
  - { id: service,      label: { zh: 服役与编制, en: Service },           order: 9 }
  - { id: appearance,   label: { zh: 涂装与标识, en: Appearance },        order: 10 }
  - { id: media,        label: { zh: 影像与线图, en: Media },             order: 11 }
  - { id: modelling,    label: { zh: 模型套件, en: Modelling },           order: 12 }
  - { id: weapon,       label: { zh: 武器本体, en: Weapon },              order: 13 }

# ---------------------------------------------------------------- 字段
# 默认 applies_to: [class, ship]。比较器只遍历 compare: true。
# better: higher | lower | context | none
fields:

  # ===== identity =====
  - { id: identity.name_original,          label: { zh: 原名, en: Name (original) },        type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.name_zh,                label: { zh: 中文名, en: Name (zh) },            type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.name_en,                label: { zh: 英文名, en: Name (en) },            type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.name_note,              label: { zh: 译名说明, en: Name note },          type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.ship_type,              label: { zh: 舰种, en: Ship type },              type: enum,   unit: null, group: identity, compare: false, better: none, values: [battleship, battlecruiser, heavy_cruiser, light_cruiser, armored_cruiser, protected_cruiser, aircraft_carrier, escort_carrier, seaplane_carrier, destroyer, destroyer_leader, torpedo_boat, frigate, corvette, submarine, monitor, coastal_defence_ship, minelayer, auxiliary, other] }
  - { id: identity.nation,                 label: { zh: 所属国家, en: Nation },             type: enum,   unit: null, group: identity, compare: false, better: none, values: [germany, united_kingdom, united_states, japan, italy, france, soviet_union, china, netherlands, australia, canada, poland, norway, sweden, greece, turkey, spain, finland, romania, other] }
  - { id: identity.operator,               label: { zh: 所属海军, en: Operator },           type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.pennant_number,         label: { zh: 旗号/舷号, en: Pennant / hull number }, type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.namesake,               label: { zh: 命名来源, en: Namesake },           type: string, unit: null, group: identity, compare: false, better: none }
  - { id: identity.building_program,       label: { zh: 建造计划, en: Building programme }, type: string, unit: null, group: identity, compare: false, better: none }
  # 时代：分类浏览的第一级轴。不填则按 construction.commissioned 的年份自动推（见 data.ts 的 eraFromYear），
  # 所以能填就填——一艘 1943 年服役、1980 年还在跑的舰，自动推会判成二战，但你可能想归冷战。
  - { id: identity.era,                    label: { zh: 时代, en: Era },                     type: enum,   unit: null, group: identity, compare: false, better: none, values: [ww1, interwar, ww2, cold_war, modern], note: 按服役期定位，不是按设计年份。全级同代就写在舰级，个别舰不同才写单舰。 }

  # ===== dimensions: 排水量（口径必须拆开，见框架 3.5） =====
  - { id: displacement.standard,           label: { zh: 标准排水量, en: Standard displacement },        type: number, unit: t, group: dimensions, compare: true, better: none, note: 华盛顿/伦敦条约定义口径。来源须自述其定义，否则降级。 }
  - { id: displacement.standard_metric,    label: { zh: 标准排水量（公制口径）, en: Standard displacement (metric) }, type: number, unit: t, group: dimensions, compare: true, better: none, note: 德制 Typverdrängung 等非条约口径的标准状态，与 displacement.standard 不可混用。2026-11-18 已补俾斯麦级 43,313 t（kbismarck bsweights）。 }
  - { id: displacement.construction,       label: { zh: 建造排水量, en: Construction displacement },    type: number, unit: t, group: dimensions, compare: false, better: none }
  - { id: displacement.empty,              label: { zh: 空载排水量, en: Empty displacement },           type: number, unit: t, group: dimensions, compare: false, better: none }
  - { id: displacement.full,               label: { zh: 满载排水量, en: Full load displacement },       type: number, unit: t, group: dimensions, compare: true,  better: none }
  - { id: displacement.deep,               label: { zh: 深载排水量, en: Deep load displacement },       type: number, unit: t, group: dimensions, compare: true,  better: none }
  - { id: displacement.maximum,            label: { zh: 最大排水量, en: Maximum displacement },         type: number, unit: t, group: dimensions, compare: false, better: none }
  - { id: displacement.declared,           label: { zh: 对外申报排水量, en: Declared displacement },    type: number, unit: t, group: dimensions, compare: false, better: none, note: 政治申报值，与真实值并存，不构成分歧。 }
  - { id: displacement.measurement,        label: { zh: 容积吨位, en: Measurement tonnage (GRT) },      type: number, unit: t, group: dimensions, compare: false, better: none, note: 商船口径，军舰通常不适用。 }
  - { id: displacement.trial,              label: { zh: 试验排水量, en: Trial displacement },            type: number, unit: t, group: dimensions, compare: false, better: none, note: 试航或倾斜试验当时的实测排水量，含试验压载。既不是空载也不是标准排水量，不可当二者引用。 }

  # ===== dimensions: 尺度（口径后缀必填，见 field-design 硬结论 2） =====
  - { id: dimensions.length.oa,            label: { zh: 全长, en: Length overall },                    type: number, unit: m, group: dimensions, compare: true,  better: none }
  - { id: dimensions.length.wl,            label: { zh: 水线长, en: Length at waterline },             type: number, unit: m, group: dimensions, compare: true,  better: none }
  - { id: dimensions.length.pp,            label: { zh: 垂线间长, en: Length between perpendiculars }, type: number, unit: m, group: dimensions, compare: true,  better: none }
  - { id: dimensions.length.dl,            label: { zh: 甲板长, en: Length on deck },                  type: number, unit: m, group: dimensions, compare: false, better: none }
  - { id: dimensions.beam.wl,              label: { zh: 水线宽, en: Beam at waterline },               type: number, unit: m, group: dimensions, compare: true,  better: none }
  - { id: dimensions.beam.max,             label: { zh: 最大宽, en: Beam maximum },                    type: number, unit: m, group: dimensions, compare: true,  better: none }
  - { id: dimensions.beam.molded,          label: { zh: 型宽, en: Beam molded },                       type: number, unit: m, group: dimensions, compare: false, better: none }
  - { id: dimensions.draught.mean,         label: { zh: 平均吃水, en: Draught mean },                  type: number, unit: m, group: dimensions, compare: true,  better: none, note: 必须与排水量状态绑定，否则不可比。 }
  - { id: dimensions.draught.max,          label: { zh: 最大吃水, en: Draught maximum },               type: number, unit: m, group: dimensions, compare: true,  better: none }
  - { id: dimensions.depth.molded,         label: { zh: 型深, en: Depth molded },                      type: number, unit: m, group: dimensions, compare: false, better: none }
  - { id: dimensions.freeboard,            label: { zh: 干舷, en: Freeboard },                         type: number, unit: m, group: dimensions, compare: false, better: none }
  - { id: dimensions.metacentric_height,   label: { zh: 稳心高 GM, en: Metacentric height },           type: number, unit: m, group: dimensions, compare: false, better: context }
  - { id: dimensions.block_coefficient,    label: { zh: 方形系数, en: Block coefficient },             type: number, unit: ratio, group: dimensions, compare: false, better: none }
  - { id: dimensions.prismatic_coefficient, label: { zh: 棱形系数, en: Prismatic coefficient },        type: number, unit: ratio, group: dimensions, compare: false, better: none }
  - { id: dimensions.watertight_compartments, label: { zh: 水密隔舱数, en: Watertight compartments },  type: integer, unit: count, group: dimensions, compare: false, better: none }

  # ===== propulsion =====
  - { id: propulsion.plant_type,           label: { zh: 动力型式, en: Propulsion type },              type: enum,   unit: null, group: propulsion, compare: false, better: none, values: [steam_turbine, steam_reciprocating, diesel, diesel_electric, gas_turbine, nuclear, combined_diesel_gas, turbo_electric, other] }
  - { id: propulsion.shafts,               label: { zh: 轴数, en: Shafts },                            type: integer, unit: count, group: propulsion, compare: false, better: none }
  - { id: propulsion.boiler.count,         label: { zh: 锅炉数, en: Boilers },                         type: integer, unit: count, group: propulsion, compare: false, better: none }
  - { id: propulsion.boiler.type,          label: { zh: 锅炉型号, en: Boiler type },                   type: string, unit: null, group: propulsion, compare: false, better: none }
  - { id: propulsion.boiler.manufacturer,  label: { zh: 锅炉制造厂, en: Boiler manufacturer },         type: string, unit: null, group: propulsion, compare: false, better: none }
  - { id: propulsion.boiler.pressure,      label: { zh: 锅炉蒸汽压力, en: Boiler pressure },           type: number, unit: atm, group: propulsion, compare: false, better: none }
  - { id: propulsion.boiler.temperature,   label: { zh: 锅炉蒸汽温度, en: Boiler temperature },        type: number, unit: celsius, group: propulsion, compare: false, better: none }
  - { id: propulsion.turbine.count,        label: { zh: 主机数量, en: Turbines/engines },              type: integer, unit: count, group: propulsion, compare: false, better: none }
  - { id: propulsion.turbine.type,         label: { zh: 主机型号, en: Turbine type },                  type: string, unit: null, group: propulsion, compare: false, better: none }
  - { id: propulsion.turbine.manufacturer, label: { zh: 主机制造厂, en: Turbine manufacturer },        type: string, unit: null, group: propulsion, compare: false, better: none, note: 逐舰不同，Bismarck 用 Blohm & Voss，Tirpitz 用 Brown-Boveri。 }
  - { id: propulsion.power.design,         label: { zh: 设计功率, en: Design shaft power },            type: number, unit: hp, group: propulsion, compare: true,  better: higher }
  - { id: propulsion.power.trial,          label: { zh: 试航实测功率, en: Trial shaft power },         type: number, unit: hp, group: propulsion, compare: true,  better: higher }
  - { id: propulsion.speed.design,         label: { zh: 设计航速, en: Design speed },                  type: number, unit: kn, group: propulsion, compare: true,  better: higher }
  - { id: propulsion.speed.trial,          label: { zh: 试航实测航速, en: Trial speed },               type: number, unit: kn, group: propulsion, compare: true,  better: higher }
  - { id: propulsion.speed.max,            label: { zh: 最大航速, en: Maximum speed },                 type: number, unit: kn, group: propulsion, compare: true,  better: higher }
  # 2026-11-18 对比器开工：改为 compare:false。巡航航速只有在来源自己给出
  # 「某航速下的续航」时才有意义（如「9,250 nm @ 14 kn」）。现收录 5 舰里
  # illustrious / KGV 的续航带了对应航速，但那是续航条件，不是独立的巡航航速指标；
  # 由它反推出「巡航航速」属于推断，违反红线 §2.2。真要补，必须连
  # propulsion.range.at_speed 一起成对记录。
  - { id: propulsion.speed.cruise,         label: { zh: 巡航航速, en: Cruising speed },                type: number, unit: kn, group: propulsion, compare: false, better: none, note: 全库暂无数据。此值必须与对应续航成对出现，单填一个数会被误读为经济航速。 }
  - { id: propulsion.range.max,            label: { zh: 最大续航力, en: Maximum range },               type: number, unit: nmi, group: propulsion, compare: true, better: higher, note: 续航力必须与对应航速成对解读，单看数值会误判。 }
  - { id: propulsion.range.at_speed,       label: { zh: 续航力对应航速, en: Range at speed },          type: number, unit: kn, group: propulsion, compare: false, better: none }
  - { id: propulsion.fuel.capacity,        label: { zh: 燃油装载量, en: Fuel oil capacity },           type: number, unit: t, group: propulsion, compare: false, better: none }
  - { id: propulsion.fuel.type,            label: { zh: 燃料种类, en: Fuel type },                     type: string, unit: null, group: propulsion, compare: false, better: none }
  - { id: propulsion.propeller.count,      label: { zh: 螺旋桨数, en: Propellers },                    type: integer, unit: count, group: propulsion, compare: false, better: none }
  - { id: propulsion.propeller.diameter,   label: { zh: 螺旋桨直径, en: Propeller diameter },          type: number, unit: m, group: propulsion, compare: false, better: none }
  - { id: propulsion.propeller.type,       label: { zh: 螺旋桨型式, en: Propeller type },              type: string, unit: null, group: propulsion, compare: false, better: none }
  - { id: propulsion.rudder.count,         label: { zh: 舵数, en: Rudders },                           type: integer, unit: count, group: propulsion, compare: false, better: none }
  - { id: propulsion.rudder.angle_max,     label: { zh: 最大舵角, en: Maximum rudder angle },          type: number, unit: deg, group: propulsion, compare: false, better: none }
  # 2026-11-18：改为 compare:false。回转直径在 work/raw 里只在
  # field-design-refs.md（别人的字段方案）和我们自己的 field 命名建议里出现，
  # 没有任何一条真实的战术直径数据。且这个指标必须绑定航速与舵角才有可比性，
  # 裸值横向比较就是错的（自己也在 note 里写了这句）。
  - { id: propulsion.turning_diameter,     label: { zh: 回转直径, en: Turning diameter },              type: number, unit: m, group: propulsion, compare: false, better: none, note: 全库暂无数据。越小越灵活，但受排水量与舵面积共同影响、且必须绑定航速与舵角才可比，故不参与横向对比着色。 }
  - { id: propulsion.electrical.output,    label: { zh: 发电机总功率, en: Electrical output },         type: number, unit: kW, group: propulsion, compare: false, better: none }

  # ===== protection =====
  - { id: protection.scheme,               label: { zh: 装甲体系, en: Protection scheme },             type: enum,   unit: null, group: protection, compare: false, better: none, values: [all_or_nothing, incremental, turtle_back, other] }
  - { id: protection.armor.thickness,      label: { zh: 装甲厚度, en: Armour thickness },              type: number, unit: mm, group: protection, compare: false, better: context,
                                                                                                         qual_keys: [part, region],
                                                                                                         qual_values: { part: [belt, upper_belt, lower_belt, deck, slope, bulkhead, turret, barbette, conning_tower, funnel_uptake, splinter_belt, main_belt_aft, flight_deck, hangar_side, hangar_deck, magazine], region: [main, fore, aft, upper, lower, face, side, rear, roof, top, bottom, torpedo, splinter] },
                                                                                                         note: 部位索引。厚度不是越大越好，比较器须结合倾角与材质。 }
  - { id: protection.armor.angle,          label: { zh: 装甲倾角, en: Armour inclination },            type: number, unit: deg, group: protection, compare: false, better: context,
                                                                                                         qual_keys: [part, region],
                                                                                                         qual_values: { part: [belt, upper_belt, deck, slope, turret, flight_deck, hangar_deck], region: [main, upper, lower, face, side] } }
  - { id: protection.armor.material,       label: { zh: 装甲材质, en: Armour material },               type: string, unit: null, group: protection, compare: false, better: none,
                                                                                                         qual_keys: [part, region],
                                                                                                         qual_values: { part: [belt, upper_belt, lower_belt, deck, slope, bulkhead, splinter_belt, turret, barbette, conning_tower, flight_deck, hangar_side, hangar_deck, magazine], region: [main, upper, lower, fore, aft, face, side, rear, roof, torpedo, splinter] },
                                                                                                         note: 例：KC n/A（克虏伯渗碳）、Wh（均质）、STS。材质影响等效厚度，必须记录。 }
  - { id: protection.armor.weight,         label: { zh: 装甲总重, en: Armour weight },                 type: number, unit: t, group: protection, compare: false, better: none }
  - { id: protection.armor.weight_ratio,   label: { zh: 装甲占排水量比, en: Armour weight ratio },     type: number, unit: pct, group: protection, compare: true, better: context }
  - { id: protection.torpedo_bulge.type,   label: { zh: 防雷突出部型式, en: Torpedo bulge type },      type: string, unit: null, group: protection, compare: false, better: none }
  - { id: protection.underwater.depth,     label: { zh: 水下防护纵深, en: Underwater protection depth }, type: number, unit: m, group: protection, compare: true, better: higher }
  - { id: protection.mine_protection,      label: { zh: 防雷/防磁措施, en: Mine protection },          type: string, unit: null, group: protection, compare: false, better: none }

  # ===== armament（装载层；武器本体见 weapon.*，炮位实例见 mount 实体） =====
  - { id: armament.mount.summary,          label: { zh: 武备概览, en: Armament summary },              type: string, unit: null, group: armament, compare: false, better: none, note: 人读概览，非结构化数据源。结构化数据一律进 mount 实体。 }
  - { id: armament.torpedo.tubes,          label: { zh: 鱼雷发射管数, en: Torpedo tubes },             type: integer, unit: count, group: armament, compare: true, better: none }
  - { id: armament.torpedo.diameter,       label: { zh: 鱼雷口径, en: Torpedo diameter },              type: number, unit: mm, group: armament, compare: false, better: none }
  - { id: armament.aa_20mm.count,          label: { zh: 2 cm 高炮数, en: 2 cm AA guns },             type: integer, unit: count, group: armament, compare: true, better: higher, note: 轻型高炮逐次加装的量，随时间窗变化。只记该口径总数，不区分单装与四联；炮位实例进 mount 实体。 }
  # 2026-11-19 为中途岛入库补：日本海军没有 20 mm，主轻高炮是 25 mm（九六式三联装为主）；
  # 美军航母主轻高炮是 40 mm Bofors + 20 mm Oerlikon 混装。只有一个 20 mm 字段
  # 会让赤城/加贺/苍龙/飞龙的防空火力无处可记，也会让美舰漏掉 40 mm 那半边。
  # 分口径各列，不合并成「轻型高炮总数」——口径不同混成一个数是失真。
  - { id: armament.aa_25mm.count,          label: { zh: 25 mm 高炮数, en: 25 mm AA guns },           type: integer, unit: count, group: armament, compare: true, better: higher, note: 日本海军九六式 25 mm（单装/双联/三联）。按管数记，不按座数；炮位实例进 mount 实体。 }
  - { id: armament.aa_40mm.count,          label: { zh: 40 mm 高炮数, en: 40 mm AA guns },           type: integer, unit: count, group: armament, compare: true, better: higher, note: 美军 40 mm Bofors（多为四联）。按管数记，不按座数。 }
  - { id: armament.depth_charge.count,     label: { zh: 深水炸弹数, en: Depth charges },               type: integer, unit: count, group: armament, compare: true, better: none }
  # 2026-11-18 对比器开工：全库 0 条 fact，且 work/raw 里 11 份原始材料零命中
  #（「mine capacity / mines carried / 载雷 / mine rails」全无）。不是漏采，
  # 是这 5 艘本来就都不是布雷舰。改为 false，等真做布雷舰（如阿波罗级、HMS Manxman）
  # 或者哪天补到俾斯麦的布雷改装方案时再翻回来。留着 true 会让对比表多一行全空。
  - { id: armament.mine.capacity,          label: { zh: 载雷量, en: Mine capacity },                   type: integer, unit: count, group: armament, compare: false, better: none, note: 全库暂无数据（现收录的 5 舰均非布雷舰），暂不参与对比。 }
  - { id: armament.broadside_weight,       label: { zh: 舷侧齐射重量, en: Broadside weight },           type: number, unit: kg, group: armament, compare: true, better: higher, note: 对比器最好用的一项，可派生但建议显式记录来源值。 }
  - { id: armament.total_weight,           label: { zh: 武备总重, en: Armament weight },               type: number, unit: t, group: armament, compare: false, better: none }
  - { id: armament.gun_failures,           label: { zh: 炮术故障记录, en: Gun failures in action },    type: string, unit: null, group: armament, compare: false, better: none, note: 逐条记录某一场战斗中的炮塔/火炮失效情况，含失效次数、原因与原文措辞。用于把一手战报里的故障清单结构化落库，而不是塞进 armament.broadside_weight（那字段是数值型，塞文本会被校验器拒绝）。2026-11-22 为罗德尼号最终战新增。 }

