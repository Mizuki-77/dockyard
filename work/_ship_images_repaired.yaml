  - fn: monaghan-09-TBD-sinking-astern-of-USS-Enterprise-CV-6-in.jpg
    idx: 9
    commons_title: File:TBD sinking astern of USS Enterprise (CV-6) in May 1942.jpg
    license_raw: Public domain
    descr: U.S. Navy Lieutenant Commander Eugene E. Lindsey's Douglas TBD-1 Devastator (BuNo 0370) sinking astern of the aircraft carrier USS Enterprise (CV-6) after a deck landing accident on 28 May 1942.
      The plane guard destroyer, USS Monaghan (DD-354) is in the left background. Enterprise was then en route to the Midway area. LCdr. Lindsey, Commanding Officer of Torpedo Squadron 6 (VT-6), was flying
      out with the rest of the air group to join the ship when the crash took place. He, and the other members of the plane's crew, were rescued by Monaghan.Although injured in this accident, Lindsey led
      the attack of VT-6 on the Japanese carriers off Midway. He died in action 4 June 1942 with his rear-seat gunner C.T. Grant, ACRM, when their Devastator was shot down by Japanese A6M2 Zero fighters,
      while attacking the Japanese aircraft carrier Kaga. VT-6 lost 10 out of 14 planes. Lindsey was posthumously awarded the Navy Cross.
    author: ''
    source_url: https://commons.wikimedia.org/wiki/File:TBD_sinking_astern_of_USS_Enterprise_(CV-6)_in_May_1942.jpg
    width: 5607
    height: 4204
