    descr: The U.S. Navy aircraft carrier USS Hornet (CV-8), the light anti-aircraft cruiser USS Atlanta (CL-51), left, and the heavy cruiser USS New Orleans (CA-32), center, and the destroyer USS Phelps
      (DD-360), right, following the Battle of Midway on 6 June 1942. The photo was taken as Atlanta came up to offer assistance to the Phelps (DD-360) which had broken down temporarily because of fuel
      shortage.
