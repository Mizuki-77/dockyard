  - fn: monaghan-06-Ditched-VT-3-TBD-during-Battle-of-Midway-194.jpg
    idx: 6
    commons_title: File:Ditched VT-3 TBD during Battle of Midway 1942.jpg
    license_raw: Public domain
    descr: The U.S. Navy Douglas TBD-1 Devastator (BuNo 0303, "T-3") from Torpedo Squadron VT-3 sinking after a water landing alongside the destroyer USS Monaghan (DD-354), ca. at 1305 hrs on 4 June 1942
      during the Battle of Midway. Pilot Machinist Harry Lee Corl and his gunner Lloyd Fred Childers, ARM3c, were launched from the aircraft carrier USS Yorktown (CV-5) and had attacked the Japanese carrier
      Hiryu. "T-3" was heavily damaged by fighters and Corl had to jettison his torpedo but managed to reach Task Force 16. Only two of 12 VT-3 planes were not shot down, but the other two had to ditch.
      Corl himself was lost during the Battle of Eastern Solomons on 24 August 1942.
    author: Lt. JG H.H. Kait, USN (aboard USS Monaghan)
    source_url: https://commons.wikimedia.org/wiki/File:Ditched_VT-3_TBD_during_Battle_of_Midway_1942.jpg
    width: 665
    height: 550
  - fn: monaghan-07-Japanese-midget-submarine-h54302.jpg
    idx: 7
    commons_title: File:Japanese midget submarine h54302.jpg
    license_raw: Public domain
    descr: 'A Japanese midget submarine after having been raised by the U.S. Navy at the Pearl Harbor Navy Yard in December 1941. This submarine had been sunk by USS Monaghan (DD-354) in Pearl Harbor during
      the 7 December 1941 Japanese attack and was subsequently recovered and buried in a landfill. The submarine''s hull shows the effects of depth charges and ramming. A hole visible in the after part
      of the conning tower may be from a 5" shell.

      The upper background had been overpainted for censorship purposes.'
    author: USN
    source_url: https://commons.wikimedia.org/wiki/File:Japanese_midget_submarine_h54302.jpg
    width: 740
    height: 596
