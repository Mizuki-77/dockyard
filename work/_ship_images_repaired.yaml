    license_raw: Public domain
    descr: View of the U.S. Navy Mare Island Naval Shipyard, California (USA) during the Second World War. The distilling ship USS Abatan (AW-4) is in dry dock No. 3, the heavy cruiser USS New Orleans (CA-32)
      (only her funnels are visible) in dry dock No. 2 to right of Abatan. Floating drydock ARD-32 is on the quay wall with USS Cod (SS-224) docked inside.
    author: 'Mare Island Naval Shipyard photo # 610-45.'
    source_url: https://commons.wikimedia.org/wiki/File:Ships_in_drydock_at_Mare_Island_Naval_Shipyard_c1944.jpg
    width: 4330
    height: 3208
