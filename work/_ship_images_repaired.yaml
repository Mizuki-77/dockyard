  - fn: new-orleans-08-Retired-US-cruisers-at-Philadelphia-Navy-Yar.jpg
    idx: 8
    commons_title: File:Retired US cruisers at Philadelphia Navy Yard 1947.jpg
    license_raw: Public domain
    descr: 'Decommissioned U.S. Navy cruisers in the Reserve Basin of the Philadelphia Naval Shipyard, Pennsylvania (USA), in 1947. In the foreground are three Brooklyn-class light cruisers. The four surviving
      New Orleans-class heavy cruisers are visible in the center background, with Northampton-class heavy cruisers tied up to the right.


      The first ship on the left is USS Honolulu (CL-48), the outboard ship in the left group is USS St. Louis (CL-49). The ships in background include (in no order)(center) : USS San Francisco (CA-38),
      USS Tuscaloosa (CA-37), USS Minneapolis (CA-36), USS New Orleans (CA-32), and (right side) USS Augusta  (CA-31), USS Louisville (CA-28), and USS Portland (CA-33).'
    author: U.S. Navy
    source_url: https://commons.wikimedia.org/wiki/File:Retired_US_cruisers_at_Philadelphia_Navy_Yard_1947.jpg
    width: 5717
    height: 4278
