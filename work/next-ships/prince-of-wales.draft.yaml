# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 本文件命中即覆盖舰级，**不算分歧**。
#
# 【这一舰为什么值得单独入库】
#   1) 它是击伤俾斯麦的那一方 —— 一发 14 英寸弹击穿舰首燃油舱，
#      这是俾斯麦四天后覆灭的直接伏笔之一
#   2) 它服役不足两个月就投入丹麦海峡（1941-03-31 服役 / 05-24 交战）
#   3) 它 1941-12-10 在马来亚海域被日军航空鱼雷击沉，与反击号同时
#   → 一舰串起大西洋与远东两个战场，是本站目前唯一能这样串的舰
#
# 【开工前必须查清的（不要照抄舰级）】
#   - 丹麦海峡当时的实际武备配置（它在舾装收尾期，可能与首舰不同）
#   - 7 发命中的具体部位与后果（舰桥、雷达、炮塔、吃水线）
#   - 沉没时被命中的鱼雷数（日方记录 vs 英方说法）
#   - 沉没主因：鱼雷直接命中 vs 抽水泵失效导致的结构性进水
# ============================================================================

