#    所有 `value: TODO` 都是待填位，validate.py 会因为不合法而报错 ——
#    这是故意的：宁可构建失败，也不要让空骨架混进已完成的站点。
#
# 与 king-george-v.yaml 同一套约定：只写本舰差异，不重复舰级数据。
