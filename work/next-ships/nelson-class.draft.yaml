# ============================================================================
# 舰级：Nelson class（纳尔逊级战列舰）
# ----------------------------------------------------------------------------
# ⚠️ 骨架，2026-11-21 建，等调研数据填入。
#    value: TODO 会让 validate.py 报错 —— 故意的，防止空骨架被部署。
#
# 同级两舰：Nelson（28）/ Rodney（29）。
#
# 【这一级为什么长成这样 —— 本文件的重点】
# 它是华盛顿条约的产物。条约给主力舰定了 35,000 t 上限、16 英寸主炮上限，
# 英国要把 9 门 16 英寸塞进 35,000 t，唯一可行的办法是把三座三联炮塔
# **全部前置**、舰桥后置 —— 这样弹药库集中在一处，防护范围缩小，
# 省下的重量给动力与装甲。代价是全舰重心集中、适航性差、后向射界为零。
#
# 读者第一次看到总图会以为画错了，所以这个形制必须在正文里解释清楚。
# ============================================================================

id: nelson
name:
  zh: 纳尔逊级战列舰
  en: Nelson-class battleship
class_of: [rodney]
open_ended_note: >
  同级两舰：Nelson（舷号 28，1927-08 服役）、Rodney（舷号 29，1927-11 服役）。
  两舰均参加二战，Rodney 在 1941-05-27 参与击沉俾斯麦；Nelson 曾触雷修理。
  战后 1948-1949 年陆续拆解。

