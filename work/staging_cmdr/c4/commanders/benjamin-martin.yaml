note: >-
  「第一」的两句须分开读：其一，他是格林尼治皇家海军医院学校出身者中第一个达到将官的人；
  其二，他是近代第一个从下甲板升到现役少将的人，且是同一时期继 Sir Thomas Spence Lyne 之后
  第二个以这种方式达到将官的人。两句同时见于 1957 年讣闻与英文维基，本站照录其原意，
  未合并成一句更强的说法。
