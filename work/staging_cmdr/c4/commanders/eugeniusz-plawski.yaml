id: eugeniusz-plawski
name:
  zh: 欧根纽什·普瓦夫斯基
  en: Eugeniusz Pławski
  full: Eugeniusz Józef Stanisław Pławski
rank_final: komandor
rank_at_post: 'kmdr por'
nation: poland
summary_zh: 从沙俄黑海舰队到波兰流亡海军，闪电号首任波兰舰长
life:
  born: 1895-03-26
  born_place: 新罗西斯克（Novorossiysk，时为俄罗斯帝国）
  died: 1972-05-23
  died_place: 温哥华（Vancouver，加拿大）
intro:
  - heading: 一艘英国船，一面波兰旗
    text: >-
      1940 年 11 月 5 日，克莱德河畔的约翰·布朗船厂交出来的一艘 N 级驱逐舰降下英国旗，
      升起波兰海军旗，改名闪电号。船体是英国的，火炮与弹药由英国海军部供给，
      连报价单上都把设备另算；舰员却是波兰人，一大半是从挪威外海沉没的雷霆号上救回来的。
      Pławski 接手的正是这样一艘船：两套操船习惯、两套口令、两套作息，
      要在同一条甲板上合成一套。他此前指挥的是潜艇，水面舰艇的编队战术对他并不熟悉。
  - heading: 没有本土的海军
    text: >-
      他这一代波兰海军军官的处境，是本国海岸线已经不存在。1939 年 9 月他在法国，
      任务是去要援助，等他辗转到了伦敦，要保卫的那个国家已经不存在了。
      舰队只剩几艘借来的驱逐舰和潜艇，挂波兰旗，归英国作战指挥，补给、船坞、人事全在别人手里。
      在这种结构里，舰长要替自己的水兵向两个上级负责：一个是波兰海军司令部，
      一个是眼前的英国分舰队指挥官。这一层压力不出现在任何战报里，却是他每天的实际工作。
  - heading: 1941 年 5 月 26 日夜里的一小时
    text: >-
      追击俾斯麦号的那晚，闪电号在左翼首先发现目标，随即遭到德舰主炮与副炮射击。
      Pławski 下的命令是打三发齐射，为波兰。Tovey 的战报里专门写了他：
      这位舰长没和第 4 驱逐舰分队合作过，不熟悉他们的打法，于是决定把自己排在最后攻击，
      以免妨碍别人；结果在黄昏时段替全队引开火力将近一小时，天黑后才退到六至八海里外等待。
      凌晨他奉命返航加油，又自行搜索到 06:00 才走。这些都是英方一手战报里的话。
  - heading: 之后二十六年
    text: >-
      1941 至 1943 年他在斯德哥尔摩当武官，随后回海上指挥租借来的龙号巡洋舰，
      1944 年任波兰海军参谋长，1945 年任海军监察长。战争结束、西方波兰军队解散后，
      他把海军军旗与舰旗交给伦敦的西科尔斯基研究所，然后去了加拿大，
      在农场与木材厂做工，1952 年起为加拿大政府做翻译，一直做到 1971 年。
      1972 年 5 月 23 日卒于温哥华，葬于 Gethsemani 花园公墓；2004 年 6 月 16 日，
      骨灰由儿子送回波兰，安葬在格丁尼亚奥克西维的海军公墓。
timeline:
  - date: 1895-03-26
    text: 生于新罗西斯克，父亲 Aleksander Pławski 是沙俄陆军旅长。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1914
    text: 以海军准尉（miczman）身份入沙俄黑海舰队，任驱逐舰杰尔兹基号值更官，全程参加一战。
    src: [plwiki-plawski]
  - date: 1917
    text: 任驱逐舰格涅夫内号航海官；十月革命后由舰员推举为驱逐舰佐尔基号指挥官。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1920
    text: 波兰与海结缘典礼（Zaślubiny Polski z morzem）在普茨克举行，升旗口令由他下达。
    src: [plwiki-plawski, enwiki-plawski]
  - date: 1931
    text: 任潜艇 Žbik 号指挥官，并兼潜艇群指挥。
    src: [plwiki-plawski, enwiki-plawski]
  - date: 1932
    text: 任波兰海军潜艇分队（Dywizjon Okrętów Podwodnych）首任指挥官，至 1936 年。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1939
    text: 受派出使法国，争取德方入侵时的军事援助；开战时本人在法国。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1940-11-05
    text: >-
      任闪电号（ORP Piorun，原 HMS Nerissa）指挥官。波方命令原文记该舰当日升旗入列，
      舰员自 10 月 24 日起已在该舰上。
    src: [uboat-piorun, facta-nautica-piorun]
  - date: 1941-05-26
    text: >-
      22:38 闪电号在左翼发现俾斯麦号；22:42 德舰开火，本舰还击后施放烟幕脱离，
      在黄昏时段持续吸引德舰火力约一小时。
    src: [hmshood-tovey-dispatch, kbismarck-chase]
  - date: 1941-05-27
    text: >-
      05:00 奉命返航普利茅斯加油，实际继续搜索至 06:00 方离去；返航途中遭六次空袭，均以火炮驱离。
    src: [hmshood-tovey-dispatch]
  - date: 1941-08-02
    text: 卸任闪电号指挥，由 Stanisław Hryniewiecki 接任；8 月 30 日复任，至 12 月 21 日再次交卸。
    src: [uboat-piorun]
  - date: 1942
    text: 晋升 komandor（上校）。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1943-05-15
    text: 任租借自英国皇家海军的龙号（ORP Dragon）巡洋舰指挥官。
    src: [enwiki-plawski, plwiki-plawski]
  - date: 1944
    text: 任波兰海军参谋部参谋长（szef Sztabu Kierownictwa Marynarki Wojennej）。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1945
    text: 任海军监察长（szef Inspektoratu Marynarki Wojennej），为军旅生涯最后一职。
    src: [plwiki-plawski, polska-zbrojna-plawski]
  - date: 1972-05-23
    text: 卒于温哥华，葬 Gethsemani 花园公墓；2004-06-16 骨灰迁葬格丁尼亚奥克维西海军公墓。
    src: [plwiki-plawski, pamietam-plawski]
relations:
  ships:
    - ship: piorun
      role: 舰长（kmdr por.）；两度任职，中间 1941-08-02 至 08-30 由 Hryniewiecki 代理
      from: 1940-11-05
      to: 1941-12-21
      note: >-
        本站 data/ships/piorun.yaml 的任期即此窗口。英语维基写「1940-10-24 任舰长」，
        与波方命令（11-05 升旗入列）和 uboat.net（11-05 起）差 12 天，取后者。
        返回日期 1946-10-26。
  battles:
    - battle: last-battle
      role: >-
        闪电号舰长，1941-05-26 夜战当事人。本站 last-battle 的参战名单已注明本舰
        5-27 05:00 因燃油返航，最终战开始时不在场；此条只对应 5-26 夜间接触与交火。
      note: >-
        Tovey 战报第 73、75 段直接点名 Commander E. Plawski，为其决策留下一手记录。
src: [plwiki-plawski, enwiki-plawski, polska-zbrojna-plawski, uboat-piorun, facta-nautica-piorun, hmshood-tovey-dispatch, kbismarck-chase, pamietam-plawski]
note: >-
  rank_final 取最终军衔 komandor（1942 晋升）。指挥闪电号时为 kmdr por.（中校），
  两者不要混。英语维基「In exile」段把卒年写成 1973-05-22，与其自身信息框及
  全部波方来源的 1972-05-23 冲突，本站取 1972-05-23。
