sources:
  - id: unithistories-rn-w3
    title: Royal Navy (RN) Officers 1939-1945 — W（WHITE, Richard Taylor 条）
    url: https://www.unithistories.com/officers/RN_officersW3.html
    type: database
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    operator: J.N. Houterman
    note: >-
      逐任职务表 + 军衔晋升日 + 勋奖授与日 + 生卒地与家族，颗粒度比维基细一个量级。
      数据编纂自 Navy List 一类官方名录，属二手编纂，故记 D 不记 A。
      用于 White 的任免、晋升、勋奖与生卒核对。

  - id: unithistories-rn-m2
    title: Royal Navy (RN) Officers 1939-1945 — M（MARTIN, [Sir] Benjamin Charles Stanley 条）
    url: https://www.unithistories.com/officers/RN_officersM2.html
    type: database
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    operator: J.N. Houterman
    note: >-
      与 W3 同源同体例。Education 一栏明写「RN Hospital School, Greenwich」，
      是本站 Martin「医院学校出身第一人」说法的直接出处之一。

  - id: uboat-cdr-white
    title: Cdr. Richard Taylor White, DSO, RN — Allied Warship Commanders of WWII
    url: https://uboat.net/allies/commanders/2643.html
    type: database
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      uboat.net 的舰长条目：任期表 + 军衔 + 勋奖 + 家属提供的生涯小传。
      舰长任期与 unithistories 逐条吻合，但 uboat.net 退役年写 1955-07-07（Ventaxia 说法见维基），两源一致。

  - id: uboat-cdr-martin
    title: Rear-Admiral (Retired) Benjamin Charles Stanley Martin, DSO, RN — Allied Warship Commanders of WWII
    url: https://uboat.net/allies/commanders/1632.html
    type: database
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      只有任期与勋奖，无传记正文（该站自述「We currently have no career information」），
      故 Martin 的年表另靠 unithistories-rn-m2 与 naval-history-dorsetshire。

  - id: uboat-u41
    title: U-41 — German U-boat, uboat.net
    url: https://uboat.net/boats/u41.htm
    type: database
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      记 U-41 于 1940-02-05 在爱尔兰西南被 HMS Antelope 深弹击沉、49 人全损。
      注意：U-41 的击沉在各站偶有记在英国驱逐舰 Antelope 与另舰合击名下，此页单独归 Antelope。

  - id: uboat-u31
    title: U-31 — German U-boat, uboat.net
    url: https://uboat.net/boats/u31.htm
    type: database
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      记 U-31 于 1940-11-02 在爱尔兰西北被 HMS Antelope 深弹击沉，2 死 44 生还。
      同页另记该艇 1940-03-11 已被 RAF 炸沉一次、后打捞修复，是同一艇的两次沉没。

  - id: pamietam-plawski
    title: kmdr Pławski Eugeniusz — Pamietam.eu（波兰西方武装力量阵亡/安葬者名录）
    url: http://www.pamietam.eu/details-209.php
    type: database
    tier: D
    role: [data]
    lang: pl
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      名录条目，只给生卒与墓位（格丁尼亚奥克维西海军公墓，alleja 第 12 位），
      并注明该墓已录入波兰「独立战争老兵墓」登记册。用于核对卒地与迁葬地，
      不用其任何生平常叙述。

  - id: polska-zbrojna-plawski
    title: Komandor, który podjął walkę z „Bismarckiem” — Polska Zbrojna
    url: https://www.polska-zbrojna.pl/home/articleshow/18911
    type: website
    tier: D
    role: [data]
    lang: pl
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    operator: Wojskowy Instytut Wydawniczy
    note: >-
      波兰军方出版机构旗下刊物的人物稿，直接引用格丁尼亚海军博物馆副馆长
      Lech Trawicki 的口述与馆藏照片。三发齐射口令、木材厂与翻译工作、
      家族离散细节均出此篇，为一手访谈性质的报道。

  - id: wns-martin-obituary
    title: Vice-Admiral Sir B. Martin（讣闻转载）— World Naval Ships Forums Archive
    url: https://www.worldnavalships.com/forums/thread.php?threadid=5240
    type: website
    tier: D
    role: [data]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      1957 年讣闻全文转载，未标原刊。内容是「医院学校出身第一个到将官」
      「下甲板出身 87 年来第一个现役将官」「日德兰时任准尉」的同期表述，
      用于印证维基的那两句「第一」，不作年表主源。

  - id: plwiki-plawski
    title: Eugeniusz Pławski — Wikipedia (pl)
    url: https://pl.wikipedia.org/wiki/Eugeniusz_P%C5%82awski
    type: encyclopedia
    tier: E
    role: [lead]
    lang: pl
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      波兰语版比英语版长得多，含晋升表与勋章清单，且注明《Polski Słownik Biograficzny》
      卷 26 页 773 与 Kadry Morskie Tom II 为底本。仅用于搭骨架与找线索。

  - id: enwiki-plawski
    title: Eugeniusz Pławski — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Eugeniusz_P%C5%82awski
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      「1940-10-24 任 Piorun 舰长」与本站采信的 1940-11-05（波方命令 + uboat.net）
      差 12 天，见 NOTES.md。

  - id: dewiki-junge
    title: Wolf Junge — Wikipedia (de)
    url: https://de.wikipedia.org/wiki/Wolf_Junge
    type: encyclopedia
    tier: E
    role: [lead]
    lang: de
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      德文版是三人中唯一有完整青年与战后经历的版本，底本为 WASt 人事档案与
      Grützner《Ernst Lindemann》页 223-224。Junge 的生日、赴舰日、调离日、
      战后履历只此一处成文，故其年表 E 级比重偏高。

  - id: enwiki-junge
    title: Wolf Junge — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Wolf_Junge
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      正文引 Koop & Schmolke 2014 页 67 与 Bishop 2012，可循此上溯专著。
      信息框写生日 1903-01-03，与正文及德文版的 1 月 5 日矛盾，见 NOTES.md。

  - id: dewiki-tirpitz
    title: Tirpitz (Schiff, 1941) — Wikipedia (de)
    url: https://de.wikipedia.org/wiki/Tirpitz_(Schiff,_1941)
    type: encyclopedia
    tier: E
    role: [lead]
    lang: de
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      Junge 任期内提尔皮茨号的舰况背景（X 艇后的修复期、巴拉万的一弹命中位置、
      移泊特罗姆瑟的航速）以此页核对措辞。同页的「Kommandanten」名单与
      kbismarck、Deutsches Marinearchiv 三源一致。

  - id: enwiki-white
    title: Richard Taylor White — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Richard_Taylor_White
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      唯一给出祖鲁人号沉没逐小时经过（0310 放艇至 2000 弃舰）的成文叙述，
      与 naval-history-zulu 的逐日条目在时点上互相印证。

  - id: enwiki-martin
    title: Benjamin Martin (Royal Navy officer) — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Benjamin_Martin_(Royal_Navy_officer)
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      「第一个从医院学校到将官」与「下甲板出身 87 年来第一人」两句的出处。
      其 DSO 的 Gazette 期号标作 1942-10-14，与 unithistories 的 1941-10-14 冲突，见 NOTES.md。
