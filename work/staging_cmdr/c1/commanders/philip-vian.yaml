  battles:
    - battle: last-battle
      role: 第 4 驱逐舰分队指挥官，率五艘驱逐舰夜间跟踪与鱼雷攻击
      note: >-
        他在 1941-05-26 夜至 05-27 08:45 之间负责保持接触并组织鱼雷攻击；
        主力舰接火后炮战由战列舰完成，他与分队不在当日白昼的炮战序列内。

