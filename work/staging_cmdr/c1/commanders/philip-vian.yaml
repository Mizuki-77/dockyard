id: philip-vian
name:
  zh: 菲利普·维安
  en: Philip Vian
  full: Admiral of the Fleet Sir Philip Louis Vian, GCB, KBE, DSO and Two Bars

life:
  born: 1894-06-15
  born_place: London, England
  died: 1968-05-27
  died_place: Ashford Hill, Hampshire, England

rank_final: Admiral of the Fleet
rank_at_post: 'Capt'
nation: united_kingdom

summary_zh: 从驱逐舰分队指挥官做到海军元帅，敢在挪威领海强行登船

intro:
  - heading: 炮术军官的底子
    text: >-
      生于伦敦，1907 年 5 月入海军，在奥斯本与达特茅斯受训，1912 年 1 月 15 日到前无畏舰 Lord Nelson 上做候补少尉。
      大战头两年他在旧舰上：先在 Argonaut 巡洋舰上远赴东非搜索德国巡洋舰 Karlsruhe，1915 年 9 月调往新建的驱逐舰 Morning Star。
      日德兰海战时 Morning Star 在场，但只是见证者。1918 至 1919 年他在朴次茅斯的枪炮学校进修，
      此后十余年是专职炮术军官。这段履历决定了他带兵的方式：先算射程与弹药，再谈勇气。

  - heading: 约辛峡湾：有授权，但仍然可能引发战争
    text: >-
      1940 年 2 月，第 4 驱逐舰分队受命搜捕德国补给船 Altmark，情报说她船上关着约三百名被施佩伯爵号俘获的英国商船船员。
      难题不在找船，而在船停在挪威领海。维安先走交涉程序：向挪威鱼雷艇提议由英挪共同押送该船回卑尔根复检，被拒。
      随后他收到经海军部转来的指令：复检被拒即登船；挪威舰艇阻拦只可警告；对方开火才还击，且以必要为限。
      这道授权把「是否侵犯中立」的政治责任留在伦敦，把「怎么在浮冰里靠上一条一万三千吨的油船」留给了他。

  - heading: 追击俾斯麦：他要的是不丢失接触
    text: >-
      1941 年 5 月 26 日夜，维安率哥萨克号、Maori、Zulu、Sikh 与波兰闪电号接替 Sheffield 跟踪俾斯麦号。
      他放弃对英王乔治五世号与罗德尼号的屏护任务，抢在天黑前接触目标——托维在战报里写，这是「我知道他会做的决定」。
      他把主目标定为保持接触，次目标才是鱼雷攻击，并授权各舰自行择机进攻。整夜五舰在暴雨与低能见度下轮番接近，共射出十六枚鱼雷。
      命中与否英德两说，但俾斯麦号整夜被钉住，天亮时交到了战列舰手里。

  - heading: 地中海、诺曼底与最后十年
    text: >-
      1941 年 7 月晋升少将，此后近三年在地中海：第 15 巡洋舰队、两次锡尔特海战、1942 年 3 月旗舰 Naiad 被 U-565 击沉，
      以及马耳他运输船队换来的 KBE。1942 年秋他染上疟疾，一度被判定不宜再出海，却在 1943 年回到地中海指挥萨勒诺的护航航母编队，
      1944 年指挥诺曼底的东特混舰队。战争最后一年他在英国太平洋舰队管航母。
      战后任第五海务大臣与本土舰队总司令，1952 年 6 月 1 日晋海军元帅，同日退役。

timeline:
  - date: 1894-06-15
    text: 生于伦敦，父 Alsager Richard Vian，母 Ada Frances（娘家姓 Renault）。
    src: [unithistories-vian]

  - date: 1907-05-15
    text: 入海军，先后就读奥斯本与达特茅斯两所皇家海军学院。
    src: [unithistories-vian]

  - date: 1916-05-31
    text: 日德兰海战时在驱逐舰 Morning Star 上，该舰未参与战斗，他在场观战。
    src: [unithistories-vian]

  - date: 1933-03-31
    text: 首次担任舰艇指挥官：驱逐舰 Active，并任第 3 驱逐舰分队分队长。
    src: [unithistories-vian]

  - date: 1934-12-31
    text: 晋升上校。
    src: [unithistories-vian]

  - date: 1940-01-18
    text: >-
      接任哥萨克号舰长并任第 4 驱逐舰分队指挥官（Captain (D)）；
      原旗舰 Afridi 进厂修理，他与该舰舰长舍布鲁克对调。
    src: [unithistories-vian, uboat-cossack]

  - date: 1940-02-16
    text: >-
      23:12 率哥萨克号在挪威约辛峡湾靠帮 Altmark，登船队由三名军官、三十名士兵组成；
      交火中德方 4 死 5 伤，救出 299 名英国战俘。此前他建议由英挪共同押送该船回卑尔根复检，
      挪威方面以舰小、冰厚无法配合为由拒绝。
    src: [bbc-altmark, historyofwar-altmark, uboat-cossack]

  - date: 1940-04-12
    text: 因阿尔特马克事件获颁 DSO，宪报日为 1940-04-12。
    src: [unithistories-vian]

  - date: 1940-05-03
    text: >-
      他自 1940-03-29 起重返 Afridi 任舰长；该舰当日在纳姆索斯撤运返航途中被两枚炸弹命中翻沉，
      100 人亡，沉于 66°14′N 05°45′E，他生还。
      uboat.net 记他 1940-03-29 至 1940-05-21 并不在哥萨克号上，与这条任期吻合。
    src: [naval-history-afridi, unithistories-vian, uboat-cossack]

  - date: 1940-05-21
    text: >-
      回任哥萨克号舰长，再次兼第 4 驱逐舰分队指挥官。
      uboat.net 记本日接任；unithistories 记 1940-05-05，两说并列，不裁决。
    src: [uboat-cossack, unithistories-vian]

  - date: 1941-05-26
    text: >-
      22:00 Sheffield 把俾斯麦号方位距离交给他的分队；23:00 前后哥萨克号建立接触，23:42 一发近失弹破片打掉本舰天线。
      整夜他指挥五舰轮流接近攻击，共射 16 枚鱼雷。托维战报记哥萨克号与 Maori 各有一雷命中，
      德舰生还军官则称驱逐舰鱼雷无一命中。
    src: [kbismarck-chase, hmshood-tovey-dispatch]

  - date: 1941-07-08
    text: 晋升少将。
    src: [unithistories-vian]

  - date: 1941-10-15
    text: 任第 15 巡洋舰队指挥官，旗舰 Naiad，隶地中海舰队。
    src: [unithistories-vian]

  - date: 1942-03-11
    text: 旗舰 Naiad 在索卢姆外被 U-565 雷击，35 分钟翻沉，86 人亡；他把将旗转至 Dido。
    src: [naval-history-naiad]

  - date: 1942-10-07
    text: 因健康恶化离队休养，途中在西非染上疟疾；至 1943-01 才被判定适合服役。
    src: [unithistories-vian, enwiki-philip-vian]

  - date: 1943-09
    text: 指挥萨勒诺登陆的护航航母编队（Force V / Task Force 88）。
    src: [unithistories-vian]

  - date: 1944-01-22
    text: 任诺曼底登陆东特混舰队司令；1944-07-25 因策划与实施该登陆获 KCB。
    src: [unithistories-vian]

  - date: 1945-05-08
    text: >-
      晋升中将。此前自 1944-11-15 起任英国太平洋舰队航母部队司令，1945-02-23 起兼第 1 航空母舰中队司令，
      1945-10-27 起任英国太平洋舰队副司令。
    src: [unithistories-vian]

  - date: 1952-06-01
    text: 晋海军元帅，同日退役；退役前为本土舰队总司令（1950-01-12 起）。
    src: [unithistories-vian]

  - date: 1968-05-27
    text: 卒于汉普郡 Ashford Hill 自宅，葬于圣保罗大教堂。
    src: [unithistories-vian]

