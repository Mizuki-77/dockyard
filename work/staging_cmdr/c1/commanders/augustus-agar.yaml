note: >-
  最终军衔按实衔记为 Captain（上校）。他 1943-11-15 授二级准将（Commodore 2nd class）属退休名册上的晋衔，
  任满即回为上校实衔，故不以准将为最终军衔。
  Dorsetshire 沉没前那一段决策（会合点选择、是否继续南驶）目前只有英文维基给出叙述，属 E 级；
  能为 D 级来源确证的只有：4 日奉命归队、5 日被利根号水侦发现、8 分钟沉没、234 人阵亡、约 30 小时后获救。
