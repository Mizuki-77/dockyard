id: arthur-power
name:
  zh: 阿瑟·鲍尔
  en: Arthur John Power
  full: Admiral of the Fleet Sir Arthur John Power, GCB, GBE, CVO
nation: united_kingdom
rank_final: Admiral of the Fleet
summary_zh: 皇家方舟号舰长出身，战后做到海军元帅
life:
  born: 1889-04-12
  died: 1960-01-28
  died_place: Gosport, Hampshire
intro:
  - heading: 出身与早年
    text: 1889 年 4 月 12 日生，父亲 Edward John Power，母亲 Harriet Maud（娘家姓 Windeler），家中无海军渊源。1904 年 5 月 15 日进入训练舰 HMS Britannia，1910 年 4 月 15 日升 lieutenant，第一处任职是本土舰队的战列巡洋舰 HMS Indomitable。此后他走的是炮术专精线——这条线决定了他大半生的岗位。
  - heading: 炮术军官与战间期
    text: 一战期间他一直是炮术军官：先在战列舰 Magnificent，转到巡洋舰 Royal Arthur，然后上浅水重炮舰 Raglan 随舰参加达达尼尔战役，最后到主力舰队的战列巡洋舰 Princess Royal。战后回朴茨茅斯的炮术学校 HMS Excellent 任教官，1922 年底升 commander，1929 年 6 月 30 日升 captain，1935 年 10 月起任该校校长。
  - heading: 皇家方舟号
    text: 1938 年 1 月 17 日他被派到还在舾装的皇家方舟号——舰长在舾装期到任是常态。1939 年 9 月 14 日，U-39 向她齐射三条磁性引信鱼雷，全部提前爆炸或偏出，护航驱逐舰随后把 U-39 打沉，43 名艇员全数被俘。9 月 26 日本土舰队遭空袭，一架 Ju 88 专挑她俯冲，他转舵让那枚 500 公斤炸弹落在左舷首约 1000 英尺外。
  - heading: 南大西洋与交舰
    text: 1939 年秋到 1940 年初他带着这条舰在南大西洋与西非一带转：11 月随 Force K 从弗里敦出海搜索施佩伯爵号，1940 年 2 月又执行拦截德国商船的 Operation VO。4 月上旬该舰还在亚历山大港外做飞行训练，9 日德国入侵挪威后被急召回本土，4 月 20 日抵格里诺克，当天他把指挥权交给 Cedric Holland。
  - heading: 高层路线
    text: 交舰之后他没再回海上指挥一线。1940 年 5 月 28 日起任海务委员兼助理海军参谋长（本土），6 月 25 日升 rear admiral。此后全是高层岗位：地中海舰队第 15 巡洋舰分队、马耳他海军司令、驻意大利联络将官、东印度舰队总司令。战后任第二海务大臣、地中海舰队总司令、朴茨茅斯总司令，1952 年 4 月 22 日升海军元帅，1960 年 1 月 28 日卒于戈斯波特。
timeline:
  - date: 1889-04-12
    text: 生于 Edward John Power 与 Harriet Maud 之家，父系母系均无海军任职记录。
    src: [unithistories-power]
  - date: 1910-04-15
    text: 升 lieutenant，任职本土舰队战列巡洋舰 HMS Indomitable。此前 1904 年 5 月以 cadet 身份进入训练舰 HMS Britannia。
    src: [unithistories-power]
  - date: 1915
    text: 一战期间任炮术军官，随浅水重炮舰 HMS Raglan 参加达达尼尔战役；此前先后在战列舰 Magnificent、巡洋舰 Royal Arthur 任职。
    src: [unithistories-power]
  - date: 1929-06-30
    text: 升 captain。此后任伍利奇军械委员会成员、巡洋舰 HMS Dorsetshire 上的巡洋舰分队旗舰长、帝国国防学院教官；1935 年 10 月 3 日起任朴茨茅斯炮术学校 HMS Excellent 校长至 1937 年 7 月。
    src: [unithistories-power]
  - date: 1938-01-17
    text: 受命指挥还在舾装的 HMS Ark Royal；1938 年 7 月 26 日转任该舰海上指挥官，1939 年 7 月 26 日起兼航空母舰编队将官的舰旗舰长与参谋长。
    src: [unithistories-power, uboatnet-cmdr-power]
  - date: 1939-09-14
    text: U-39 向皇家方舟号齐射三条磁性引信鱼雷，全部提前爆炸或偏出；护航驱逐舰 Faulknor、Firedrake、Foxhound 随后以深水炸弹击沉 U-39，43 名艇员全数被俘。
    src: [naval-history-arkroyal]
  - date: 1939-09-26
    text: 本土舰队在北海遭空袭。一架 Ju 88（飞行员 Adolf Francke）专挑皇家方舟号俯冲，鲍尔转舵使 500 公斤炸弹落在左舷首约 1000 英尺处，水柱高过飞行甲板，舰体受震动但未受损。
    src: [naval-history-arkroyal]
  - date: 1939-11-18
    text: 率皇家方舟号随 Force K（含战列巡洋舰 HMS Renown）自弗里敦南下，在南大西洋搜索施佩伯爵号。
    src: [naval-history-arkroyal]
  - date: 1940-02-10
    text: 皇家方舟号被置于西航道总司令指挥下，执行拦截六艘自西班牙比戈出港德国商船的 Operation VO。
    note: 原始年表把这两天写作「9-10/2/39」，但同段引用的命令时间为 1940-02-11 1351，年份应为 1940，属来源笔误。
    src: [naval-history-arkroyal]
  - date: 1940-04-20
    text: 皇家方舟号自直布罗陀抵格里诺克，当日他将指挥权交给 Cedric Swinton Holland。四日后该舰才随本土舰队出海执行挪威方向的掩护行动。
    note: naval-history 的叙事把交接记在 1940-05-03（该舰返抵斯卡帕湾、新舰长接任当天），与 uboat.net / unit histories 的 1940-04-20 差十余日，两说并列，不裁决。
    src: [naval-history-arkroyal, uboatnet-cmdr-power, unithistories-power]
  - date: 1940-06-25
    text: 升 rear admiral。此前 5 月 28 日起任海务委员兼海军部助理海军参谋长（本土），至 1942 年 5 月 27 日。
    src: [unithistories-power, uboatnet-cmdr-power]
  - date: 1941-07-01
    text: 获 CB（英王寿辰授勋）。
    src: [unithistories-power]
  - date: 1942-08-01
    text: 受命指挥地中海舰队第 15 巡洋舰分队，旗舰轻巡洋舰 HMS Cleopatra（9 月 12 日接掌），至 1943 年 5 月 6 日。
    src: [unithistories-power]
  - date: 1943-05-07
    text: 任马耳他海军司令（HMS St Angelo），至同年 9 月。
    src: [unithistories-power]
  - date: 1943-08-04
    text: 升 vice admiral。同年 9 月 24 日起任驻意大利联络将官。
    src: [unithistories-power, uboatnet-cmdr-power]
  - date: 1944-11-22
    text: 任东印度舰队总司令（HMS Lanka，后 HMS Landguard），至 1945 年 10 月。
    src: [unithistories-power]
  - date: 1946-02-27
    text: 任海务委员兼第二海务大臣、海军人事总监，至 1948 年。
    src: [unithistories-power]
  - date: 1948-05-13
    text: 任地中海舰队总司令（HMS St Angelo），至 1950 年 5 月；1950 年 10 月 18 日起改任朴茨茅斯总司令至 1952 年 10 月 17 日。
    src: [unithistories-power]
  - date: 1952-04-22
    text: 升 Admiral of the Fleet。1953 年 4 月 27 日任南安普敦副郡尉。
    src: [unithistories-power, uboatnet-cmdr-power]
  - date: 1960-01-28
    text: 卒于汉普郡戈斯波特。
    src: [unithistories-power]
relations:
  ships:
    - ship: ark-royal
      role: 舰长
      from: 1938-01-17
      to: 1940-04-20
      note: 1938-01-17 是受命日，早于该舰服役日 1938-11-16（舾装期舰长即到任）。离任日两说：uboat.net / unit histories 作 1940-04-20，naval-history 的叙事把新舰长接任记在 1940-05-03 返抵斯卡帕湾当天，并列不裁决。
  battles: []
src: [unithistories-power, uboatnet-cmdr-power, naval-history-arkroyal]
note: |
  本站舰目里他指挥过的只有皇家方舟号，故 relations.ships 一条。挪威战役海上阶段（1940-04-23 起）与米尔斯克比尔
  （1940-07-03）都在他交舰之后、由 Holland 指挥，不计入他的任内，relations.battles 留空。
  uboat.net 记其生年为 1899，unit histories 与维基均作 1889——按 1899 他会 15 岁入 Britannia、10 岁任
  sub-lieutenant，不成立，本站采 1889。出生地两份来源都没给，故 life.born_place 留空。
