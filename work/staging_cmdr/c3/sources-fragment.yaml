sources:
  - id: kbismarck-crew-lindemann
    title: Ernst Lindemann — Bismarck Crew
    url: https://www.kbismarck.com/crew/lindemann.html
    type: website
    tier: D
    role: [data, narrative]
    operator: KBismarck (José M. Rico)
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      舰员页，篇幅很短（约 870 字符正文）但字段密：生卒、逝世年龄 47、殉职时军衔 Kpt.z.S.、
      逐级晋升表（1915 Oberleutnant zur See / 1925 KptLt / 1932 KKpt / 1936 FKpt / 1938 Kpt.z.S.）、
      追授骑士铁十字日期 1941-12-27，以及「舰体倾覆前不久在前部区域最后一次被看到生还」。
      注意：本站与全站其它页面的晋升年份并不完全一致（本页 1915 年记 Oberleutnant zur See，
      德文维基记 1915-09-18 为 Leutnant zur See、1920-01-07 升 Oberleutnant zur See），引用时说明来源。

  - id: kbismarck-seamanship
    title: Battleship Bismarck and Seamanship（Schulze-Hinrichs, MOV-Nachrichten 1968）
    url: https://www.kbismarck.com/bismarck-seamanship.html
    type: article
    tier: D
    role: [narrative]
    operator: KBismarck (reprint)
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      退役海军上校 Alfred Schulze-Hinrichs 1968 年发表于海军军官协会通讯的技术复盘，
      逐项论证 1941-05-26 艉部中雷后俾斯麦号为何无法靠螺旋桨操舵：
      应急舵具只适用于小艇、水下爆破舵杆无成功可能、潜艇拖带质量比不成立。
      用于「最终战之前的处境」段落，不作战果数据来源。

  - id: nhhc-cruise-of-bismarck
    title: Bismarck — The Cruise of the Bismarck（US Navy, Office of Naval Intelligence 战时叙述）
    url: https://www.history.navy.mil/research/library/online-reading-room/title-list-alphabetically/s/sinking-of-the-bismarck/the-cruise-of-the-bismarck.html
    type: official_publication
    tier: B
    role: [narrative]
    operator: Naval History and Heritage Command
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      战时美军情报部门的叙述性小册，非一手档案但属同期官方出版物。
      **唯一明确记录「林德曼主张立即退回卑尔根」这一方向性分歧**，并记录吕特晏斯向全体舰员讲话后
      「参谋与舰上军官之间产生摩擦」。措辞谨慎（「There appears then to have been a dispute」），
      引用时必须保留这层不确定性。注意其中部分战术细节（如命中弹数）与后来的研究有出入，
      只用于分歧本身，不用于战果数字。

  - id: wiki-en-lindemann
    title: Ernst Lindemann — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Ernst_Lindemann
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      仅用于找线索与搭建年表骨架，不单独支撑任何 fact。其价值在于汇总了德文一手文献的引注：
      舰桥上的「我不让人把我的船从我屁股底下打掉」一语引自 Müllenheim-Rechberg；
      舵手 Heinz Staat 对 Oels 电话的回忆、传令兵的「dicke Luft」；
      Paul Hillen 与 Rudolf Römer 关于舰艏白帽军官的证词。

  - id: wiki-de-lindemann
    title: Ernst Lindemann (Marineoffizier) — Wikipedia (de)
    url: https://de.wikipedia.org/wiki/Ernst_Lindemann_(Marineoffizier)
    type: encyclopedia
    tier: E
    role: [lead]
    lang: de
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      德文版比英文版更细，尤其晋升日期（1913-04-01 Seekadett、1915-09-18 Lt.z.S.、1920-01-07 Oblt.z.S.、
      1925-01-01 KptLt、1932-04-01 KKpt、1936-10-01 FKpt、1938-04-01 Kpt.z.S.）与舰职起止。
      关于他死亡的两说，de 版直接并列并给出出处（Marineoffizier als Führer im Gefecht 1984；
      Afflerbach, Mit wehender Fahne untergehen, VfZ 2001），是本篇并列处理的依据。
      同页记录了「战斗中擅自下达开火许可、越过吕特晏斯，而吕特晏斯未予追究」这一判断。

  - id: wiki-en-brinkmann
    title: Helmuth Brinkmann — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Helmuth_Brinkmann
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: 用于莱茵演习段落的骨架与授勋清单（金质德意志十字 1942-03-25、骑士铁十字 1944-05-17）。不单独支撑 fact。

  - id: wiki-de-brinkmann
    title: Helmuth Brinkmann — Wikipedia (de)
    url: https://de.wikipedia.org/wiki/Helmuth_Brinkmann
    type: encyclopedia
    tier: E
    role: [lead]
    lang: de
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      逐段履历最全的一版，生卒精确到日（1895-03-12 吕贝克 / 1983-09-26 迪森），
      并记有战后交卸舰职回布雷斯特述职时「除一名军官外全体参谋告假」这一细节（引自 Schmalenbach 1978）。
      舰长交接日记为 1942-08-04，与 kbismarck.com 的「至 1942-08-04」一致，但与同站另一处「7 月」有出入。

  - id: wiki-de-prinz-eugen
    title: Prinz Eugen (Schiff, 1940) — Wikipedia (de)
    url: https://de.wikipedia.org/wiki/Prinz_Eugen_(Schiff,_1940)
    type: encyclopedia
    tier: E
    role: [lead]
    lang: de
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: 用于 1941-07-02 空袭伤亡（60 人死、副舰长 Stooß 阵亡）与「刻耳柏洛斯」行动日期的交叉核对。

  - id: wiki-de-topp
    title: Karl Topp — Wikipedia (de)
    url: https://de.wikipedia.org/wiki/Karl_Topp
    type: encyclopedia
    tier: E
    role: [lead]
    lang: de
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: 生卒与战俘营起止（1945-10-15 至 1946-12-02）、舰船建造委员会职务由此页核对。

  - id: wiki-en-topp
    title: Karl Topp — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/Karl_Topp
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      极短的存根条目。唯一独有信息是「1941-01-15 至 1943-02-24 任提尔皮茨号首任舰长」，
      与德文来源的服役日 1941-02-25 不一致，已按两说并列处理。

  - id: wiki-en-luetjens
    title: Günther Lütjens — Wikipedia (en)
    url: https://en.wikipedia.org/wiki/G%C3%BCnther_L%C3%BCtjens
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >-
      用于两位舰长与舰队司令之间的沟通问题。该页记载：吕特晏斯在 5 月 22 日前未向林德曼与布林克曼
      说明意图；布林克曼在欧根亲王号战争日志中记下对「每次改向都通报岸上并要回令」的批评；
      以及两舰交错时「俾斯麦号电动按钮舵机卡死、直冲欧根亲王号，布林克曼当机立断避免相撞」。
      最后这一条未在战争日志原文中直接找到对应表述，正文未采用，仅记录在此。

  - id: deutsches-marinearchiv-prinz-eugen
    title: Schwerer Kreuzer Prinz Eugen — Deutsches Marinearchiv
    url: http://www.deutsches-marinearchiv.de/Archiv/1935-1945/Schiffe/schwere-kreuzer/prinzeugen.htm
    type: website
    tier: D
    role: [data]
    operator: Deutsches Marinearchiv
    lang: de
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      技术数据与舰长序列（08.40–07.42 Kpt.z.S. Helmuth Brinkmann）。该站 TLS 证书链不完整，
      抓取时需跳过证书校验。注意其舰长任期写作「08.40–07.42」，与 kbismarck.com 的「08-01 至 08-04」精度不同。

  - id: wlb-1941-02
    title: Seekrieg 1941, Februar（Rohwer/Hümmelchen 海战年表，符腾堡州立图书馆版）
    url: https://www.wlb-stuttgart.de/seekrieg/41-02.htm
    type: website
    tier: C
    role: [data]
    operator: Württembergische Landesbibliothek Stuttgart
    lang: de
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      Rohwer/Hümmelchen《海战年表》的网页版，逐日体。本条目只用到 1941-02-25
      「Indienststellung des Schlachtschiffes Tirpitz (52.600 t) in Wilhelmshaven」一句。
      该站首页返回 403，但月份页可直接抓取；TLS 证书链不完整，需跳过校验。

  - id: wlb-1941-05
    title: Seekrieg 1941, Mai（Rohwer/Hümmelchen 海战年表）
    url: https://www.wlb-stuttgart.de/seekrieg/41-05.htm
    type: website
    tier: C
    role: [data, narrative]
    operator: Württembergische Landesbibliothek Stuttgart
    lang: de
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      莱茵演习全段的德方年表，逐日列出航向、命令与交战。**关键价值：它以德文原制式同时标注两位舰长的军衔**
      ——「Schlachtschiff Bismarck (Kpt.z.S. Lindemann †) und des Schweren Kreuzers Prinz Eugen
      (Kpt.z.S. Brinkmann)」——可直接支撑本站「军衔保留德制」的写法。
      另记 5 月 27 日「2106 人及全体舰队参谋阵亡」，与 kbismarck.com 的 116 人获救可互补。

  - id: wlb-1942-01
    title: Seekrieg 1942, Januar（Rohwer/Hümmelchen 海战年表）
    url: https://www.wlb-stuttgart.de/seekrieg/42-01.htm
    type: website
    tier: C
    role: [data]
    operator: Württembergische Landesbibliothek Stuttgart
    lang: de
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: 1942-01-14 至 17「极夜」行动（提尔皮茨号由威廉港转往特隆赫姆，四艘驱逐舰护航）的德方记载。

  - id: wlb-1942-07
    title: Seekrieg 1942, Juli（Rohwer/Hümmelchen 海战年表）
    url: https://www.wlb-stuttgart.de/seekrieg/42-07.htm
    type: website
    tier: C
    role: [data, narrative]
    operator: Württembergische Landesbibliothek Stuttgart
    lang: de
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      「骑士跳跃」行动与 PQ-17 的德方记载。**原文以「Tirpitz (Kpt.z.S. Karl Topp)」标注舰长军衔与姓名**，
      是托普任内这条时间线上最直接的非 E 级佐证；并明确记「编队最终未与敌交战，
      但 Luftwaffe 与 U-Boot 击沉 22 艘商船，载 430 辆坦克、210 架飞机、3 350 辆车辆、逾 99 000 吨物资」。
