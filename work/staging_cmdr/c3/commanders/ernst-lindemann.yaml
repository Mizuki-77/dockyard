id: ernst-lindemann
name:
  zh: 恩斯特·林德曼
  en: Ernst Lindemann
  full: Otto Ernst Lindemann

life:
  born: 1894-03-28
  born_place: 阿尔滕基兴（Altenkirchen，韦斯特瓦尔德）
  died: 1941-05-27
  died_place: 北大西洋，俾斯麦号上

rank_final: Kapitän zur See
rank_at_post: 'Kapitän zur See'
nation: germany

summary_zh: 俾斯麦号唯一一任舰长，随舰沉没

intro:
  - heading: 九个月零三天
    text: >-
      1940 年 8 月 24 日 12:30，汉堡布洛姆与福斯船厂，林德曼在俾斯麦号上升起战旗，
      把这艘当时世界上排水量最大的现役战列舰接进海军序列。到他 1941 年 5 月 27 日随舰沉没，
      中间只有九个月零三天，这也是俾斯麦号全部的在役生涯——他既是首任，也是唯一一任舰长。
      没有前任留下操舰记录，试航、炮术射击、雷达标定、与欧根亲王号的双舰协同，
      都要在这九个月里从零做完。而它的第一次战斗出航，就是最后一次。
  - heading: 丹麦海峡的三分钟
    text: >-
      丹麦海峡那三分钟是理解他的入口。5 月 24 日 05:52，胡德号先开火，德舰的炮口还静着：
      舰队司令吕特晏斯迟迟不下开火令。前桅指挥所的一号炮兵官施奈德一再请示，最后是林德曼越过了
      自己的上级，直接给出「开火许可」——他当时说的是：我不让人把我的船从我屁股底下打掉。
      这个决定在军纪上是越权，在战术上让德舰抢到了先手。当天舰桥上的气氛传到了下层：
      一名传令兵回到舱里，只说了「空气很厚」。
  - heading: 两次被否决的判断
    text: >-
      打完之后的两次分歧更见他的位置。他想追上去把重创的英舰彻底解决，吕特晏斯没有讨论就否决；
      他主张原路退回丹麦海峡、进卑尔根，吕特晏斯改令南下圣纳泽尔。他不是决策者，只能提意见，
      而意见两次都没被采纳。直接的目击者没有活下来：这些细节出自英军的俘虏审讯、
      舵手施塔特对一通电话的回忆、以及战后僚属的追述。证词链是间接的，但方向一致——
      舰长与舰队司令在这条船的下一步上确实闹僵了。
  - heading: 5 月 27 日
    text: >-
      5 月 27 日上午，四座主炮塔先后哑火。09:31 最后一炮打完后，他下令弃舰、自沉。
      他自己怎么死的没有定论：一说是 08:53 至 09:02 之间舰桥中弹时，他与吕特晏斯一同阵亡；
      一说是他下到前甲板，在舰体倾覆中立于舰艏敬礼入水。英军审讯报告的措辞是
      「关于舰队司令与舰长之死，无任何确证」。那年 12 月 27 日，追授骑士铁十字；
      1942 年 1 月 6 日，勋章交到他遗孀手中。

timeline:
  - date: 1894-03-28
    text: 生于莱茵省韦斯特瓦尔德的阿尔滕基兴，父亲格奥尔格·林德曼是候补法官，后任普鲁士中央土地信贷银行行长。
    src: [kbismarck-crew-lindemann, wiki-en-lindemann]
  - date: 1912-12
    text: 在柏林维尔默斯多夫俾斯麦文理中学取得高中毕业证书，随后半年在伦敦里士满的皇家理工学院就读。
    src: [wiki-en-lindemann]
  - date: 1913-04-01
    text: 以海军候补生（Seekadett）身份加入帝国海军，编入「1913 年班」，先在大型巡洋舰赫塔号上接受舰上训练。
    src: [wiki-de-lindemann, wiki-en-lindemann, admiralty-bismarck-interrogation]
  - date: 1916-03-19
    text: 调任刚服役的战列舰巴伐利亚号，任第二无线电官。英军审讯记录只说他战时在巴伐利亚号上任少尉（Sub-Lieutenant）。
    src: [wiki-de-lindemann, wiki-en-lindemann, admiralty-bismarck-interrogation]
  - date: 1917-10
    text: 随巴伐利亚号参加阿尔比翁行动（波罗的海岛屿登陆）。10 月 12 日该舰触雷，仍完成对托弗里角的岸炮压制。
    src: [wiki-en-lindemann, wiki-de-lindemann]
  - date: 1919-01
    text: 随主力舰队被扣押于斯卡帕湾之前奉命先行返回德国，1 月 12 日抵达基尔，未亲历 1919 年 6 月的自沉。
    src: [wiki-de-lindemann, wiki-en-lindemann]
  - date: 1938-04-01
    text: 晋升海军上校（Kapitän zur See），同年 3 月起出任海军训练处处长至 1939 年 9 月。英军审讯记录的年份与此一致，但月份记为 3 月。
    src: [kbismarck-crew-lindemann, wiki-de-lindemann, admiralty-bismarck-interrogation]
    note: 晋升月份两源相差一个月（德文维基 4 月 1 日，英军审讯记 3 月），两说并列，不裁决。
  - date: 1939-10
    text: 接替海因里希·沃尔达格，出任基尔-维克的海军炮兵学校校长，下辖三个训练处及火炮训练船。
    src: [wiki-de-lindemann]
  - date: 1940-08-24
    text: 12:30 在汉堡布洛姆与福斯船厂主持俾斯麦号服役仪式，升起战旗，该舰正式编入海军序列。
    src: [kbismarck-histoperi, wiki-de-lindemann, admiralty-bismarck-interrogation]
  - date: 1941-05-24
    text: 英舰先开火（kbismarck.com 记 05:52，欧根亲王号战争日志记 05:53），吕特晏斯未下开火令；林德曼越过上级直接给出「开火许可」，德舰随即还击，06:01 胡德号弹药库爆炸沉没。
    src: [kbismarck-denmark-strait, kbismarck-prinz-eugen-ktb, admiralty-bismarck-interrogation]
  - date: 1941-05-24
    text: 战斗结束后与吕特晏斯在下一步行动上出现分歧：他主张追击受创的英舰，并主张经丹麦海峡退回卑尔根；两项均被否决，编队南下达圣纳泽尔。
    src: [kbismarck-chase, admiralty-bismarck-interrogation, nhhc-cruise-of-bismarck]
    note: 细节来自俘虏审讯与僚属追述，无生还的舰桥目击者；两说并列，不裁决。
  - date: 1941-05-24
    text: 09:50 以降以信号灯向欧根亲王号通报本舰受损情况（十三至十四舱段、二十至二十一舱段等处），并告「五名轻伤」。
    src: [kbismarck-prinz-eugen-ktb]
  - date: 1941-05-26
    text: 20:47 之后的空袭中艉部中雷，两舵卡死在左舵 12 度，舰体失去操舵能力；手轮、水下爆破舵杆、螺旋桨操舵、潜艇拖带逐条试过或论证过，均不成立，当夜只能顶风低速漂航。
    src: [kbismarck-last-battle, kbismarck-seamanship]
  - date: 1941-05-27
    text: 09:31 后主炮全部沉默，下令弃舰并准备自沉；英军审讯记录中多名生还者听到的口令为「弃舰，本舰须自沉」。
    src: [kbismarck-last-battle, admiralty-bismarck-interrogation]
  - date: 1941-05-27
    text: 阵亡于北大西洋，遗体未寻获。其死亡过程有「舰桥中弹阵亡」与「舰艏敬礼入水」两说。
    src: [kbismarck-crew-lindemann, wiki-de-lindemann, admiralty-bismarck-interrogation]
    note: 两说并列，不裁决。英军审讯报告原文措辞为「无任何确证」。
  - date: 1941-12-27
    text: 追授骑士铁十字，为海军第 94 位受勋者；1942 年 1 月 6 日由遗孀希尔德加德代领。
    src: [kbismarck-crew-lindemann, wiki-en-lindemann]

