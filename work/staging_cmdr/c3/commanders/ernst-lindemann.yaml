note: >-
  生卒与最终军衔已由 kbismarck.com 舰员页与德文维基交叉核对一致。他与吕特晏斯在航向上的分歧，
  目前所有可查来源都是间接证据（俘虏审讯、舵手施塔特回忆、战后僚属追述），没有舰桥生还者；
  正文按两说并列处理，不裁决。
