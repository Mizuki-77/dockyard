note: >-
  欧根亲王号未参加 5 月 27 日的最终战——该舰 5 月 24 日 18:14 与俾斯麦号分离后单独行动，
  6 月 1 日进布雷斯特，因此 relations.battles 只填 denmark-strait。生卒已由英文维基与德文维基
  交叉核对一致（1895-03-12 吕贝克 / 1983-09-26 迪森）。舰长交接日期两源相差数日，已并列标注。
