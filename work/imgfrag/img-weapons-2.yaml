# 武器配图分片（img-weapons-2 产出，合并进 data/images.yaml）
# 目标实体：weapon:15in-42-mk1（英国 15 in/42 BL Mk I）、weapon:g7a-t1（德国 53.3 cm G7a T1）
# 全部逐张核对 Commons imageinfo.extmetadata；width/height 为 Pillow 实测落盘文件像素。
images:
  - id: 15in-42-mk1-royal-oak-twin-turret
    file: /img/weapons/15in-42-mk1-royal-oak-twin-turret.jpg
    subject: weapon:15in-42-mk1
    title:
      zh: 皇家橡树号 15 in Mk I 双联炮塔正面（1916）
      en: Twin 15-inch Mk I turret of HMS Royal Oak, 1916
    part: turret
    view: detail
    date: "1916"
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Royal Navy official photographer
    credit: Imperial War Museums, Q 17919
    source_url: https://commons.wikimedia.org/wiki/File:The_Royal_Navy_during_the_First_World_War_Q17919.jpg
    width: 1280
    height: 1003
    primary: true
    note: 四根炮管同向、炮口罩着帆布、炮塔正面的防盾折线与顶盖形状全在同一画面里，是这批候选中最纯粹的一张某型 15 in 双联炮塔外形照，也顺带给出炮口内径与炮管在防盾上的开口位置关系。IWM 原说明为「Battleship HMS Royal Oak, showing 15 inch guns and turret」。需要说明的差异：这是复仇级上的双联 Mk I 炮座，胡德号装的是双联 Mk II 炮座，炮身同为 15 in Mk I 而同族不同型的炮座；做胡德号模型时炮塔细节请对照本站胡德号条目的另几张。原件藏帝国战争博物馆（IWM Q 17919），Crown Copyright 已过期，Commons 副本的 LicenseShortName / UsageTerms 均为 Public domain；IWM 官网对其网站副本另有非商业条款，本站引用的是 Commons 的公有领域版本。未裁剪、未改作。
  - id: 15in-42-mk1-renown-forward-turrets
    file: /img/weapons/15in-42-mk1-renown-forward-turrets.jpg
    subject: weapon:15in-42-mk1
    title:
      zh: 声望号舰艏两座双联 15 in 炮塔（1939-1945）
      en: HMS Renown's two forward twin 15-inch turrets
    part: turret
    view: detail
    date: "1939-1945"
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Oulds, D C (Lt), Royal Navy official photographer
    credit: Imperial War Museums, A 29851
    source_url: https://commons.wikimedia.org/wiki/File:HMS_Renown_forward_two_turrets.jpg
    width: 1280
    height: 1666
    primary: false
    note: 从舰艏甲板向来路方向拍，A、B 两座双联炮塔前后背负的关系一次入镜：炮管仰起、炮口罩帆布、炮塔与甲板之间那道防盾基座的高低差都看得清，适合核对「双联炮塔装在背负位置」的体量与间距。前景是列队的舰员，画面下三分之一被人物占去。Commons 未给具体日期，只有 IWM 的 1939-1945 范围。原件藏帝国战争博物馆（IWM A 29851），Crown Copyright 已过期，Commons 副本的 LicenseShortName / UsageTerms 均为 Public domain；IWM 官网对其网站副本另有非商业条款，本站引用的是 Commons 的公有领域版本。未裁剪、未改作。
  - id: g7a-t1-torpedo-tarifa
    file: /img/weapons/g7a-t1-torpedo-tarifa.jpg
    subject: weapon:g7a-t1
    title:
      zh: 塔里法港展出的 G7a 鱼雷（西班牙海军用）
      en: G7a torpedo on display at Tarifa, Spain
    part: other
    view: detail
    date: "2018-11-24"
    license: cc_by_sa
    license_tier: B
    license_raw: CC BY-SA 4.0
    author: User:Zenwort
    credit: 西班牙塔里法港（Puerto de Tarifa）岸上展品，2013 年起陈列
    source_url: https://commons.wikimedia.org/wiki/File:Torpedo-G7a_Tarifa_20181124_1.jpg
    width: 1280
    height: 960
    primary: true
    note: 全雷外形最完整的一张：雷头锥、雷身圆柱段与尾部四叶螺旋桨、上下垂直舵与左右水平舵的比例关系可以直接量，画面上是训练雷的红黄白涂装（不是战时战雷的深灰）。Commons 原描述写明「German made Torpedo Type G7a, used by the Spanish navy」，型号明确无歧义；但它是西班牙海军战后的库存训练雷，与俾斯麦级四联装发射管里那枚战时 G7a T1 的涂装和部分附件可能不同，看外形与雷体分段用这张，看战时使用状态请用本站条目里的装填照。授权：CC BY-SA 4.0，作者 User:Zenwort，条款全称 Creative Commons Attribution-ShareAlike 4.0 International，条款直链 https://creativecommons.org/licenses/by-sa/4.0/deed.zh；本站仅按站内统一宽度缩放到 1280 px，未裁剪、未改作。
  - id: g7a-t1-engine-cutaway
    file: /img/weapons/g7a-t1-engine-cutaway.jpg
    subject: weapon:g7a-t1
    title:
      zh: G7a 鱼雷发动机舱剖面（Wilhelm Bauer 号艇内展品）
      en: Cutaway of a G7a torpedo's engine room, U-boat Wilhelm Bauer
    part: other
    view: detail
    date: "2008-08-18"
    license: cc_by_sa
    license_tier: B
    license_raw: CC BY-SA 3.0
    author: WerWil
    credit: 博物馆潜艇「Wilhelm Bauer」号（不来梅哈芬 / 威廉港）艇内展品
    source_url: https://commons.wikimedia.org/wiki/File:G7a_Motor.JPG
    width: 1280
    height: 960
    primary: false
    note: 雷身开了检修口，能看到 G7a 之所以是「蒸汽鱼雷」的那套东西：四缸 Brotherhood 主机、燃油与压缩空气管路、减速与传动机构，铭牌原文写「Maschinenkammer (mit 4-Zylinder Brotherhood Maschine)」。这张补的是外形照看不到的动力段，做剖面或内构展示时用。局限：切口只露出机器舱一侧，燃烧室与舵机不在画面内。授权：CC BY-SA 3.0，作者 WerWil，条款全称 Creative Commons Attribution-ShareAlike 3.0 Unported，条款直链 https://creativecommons.org/licenses/by-sa/3.0/deed.zh；本站仅按站内统一宽度缩放到 1280 px，未裁剪、未改作。
