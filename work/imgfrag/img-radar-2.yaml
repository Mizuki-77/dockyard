images:
  - id: type-273-belfast-masthead-antenna
    file: /img/weapons/type-273-belfast-masthead-antenna.jpg
    subject: weapon:type-273
    title:
      zh: 贝尔法斯特号主桅雷达天线（现存实物，策略 C）
      en: The preserved radar antenna on HMS Belfast's mainmast
    part: radar
    view: detail
    date: 2007-11-29
    license: cc_by_sa
    license_tier: B
    license_raw: CC BY-SA 3.0
    author: Rémi Kaupp (User:Korrigan)
    credit: Wikimedia Commons, HMS Belfast - Raar antenna.jpg
    source_url: "https://commons.wikimedia.org/wiki/File:HMS_Belfast_-_Raar_antenna.jpg"
    width: 1136
    height: 1280
    primary: true
    note: >-
      这是贝尔法斯特号（现为伦敦泰晤士河上的博物馆舰）主桅上的雷达天线实物近照，
      不是战时照片。天线为网状抛物面反射体、装在可转动的驱动基座上，与英舰战时
      厘米波雷达天线的形态一致。按 data/ships 与本站 type-273 条目，本舰 1944 年
      装的是 Type 273 水面搜索 + Type 284 主炮火控 + Type 277 测高，
      但 Commons 原图注只写「Main radar antenna on HMS Belfast」，未标具体型号，
      因此这张图只能作为「同舰同期舰载雷达天线实物」，不能据图注确认它就是 273。
      局限：型号归属靠推定，若日后查到该桅位确为 277 或 284，应改挂对应实体。
      授权 CC BY-SA 3.0，作者 Rémi Kaupp；条款全文
      https://creativecommons.org/licenses/by-sa/3.0/ ；直链
      https://upload.wikimedia.org/wikipedia/commons/6/64/HMS_Belfast_-_Raar_antenna.jpg ；
      本站仅按站内统一宽度缩放到 1280 px，未裁剪、未改作。

  - id: type-79z-illustrious-norfolk-1941
    file: /img/weapons/type-79z-illustrious-norfolk-1941.jpg
    subject: weapon:type-79z
    title:
      zh: 光辉号 1941 年诺福克船厂改装期间的舰桥与前桅
      en: HMS Illustrious's island and foremast at Norfolk Navy Yard, October 1941
    part: radar
    view: detail
    date: 1941-10-04
    license: pd
    license_tier: A
    license_raw: Public domain
    author: U.S. Navy Bureau of Ships
    credit: U.S. Navy, Norfolk Naval Shipyard, 4 October 1941
    source_url: "https://commons.wikimedia.org/wiki/File:USS_Chaumont_(AP-5)_at_the_Norfolk_Naval_Shipyard_on_4_October_1941.jpg"
    width: 1280
    height: 1243
    primary: true
    note: >-
      1941 年 10 月 4 日诺福克海军船厂，前景即是正在美国做战损修理的光辉号，
      画面为舰桥与前桅一带的高分辨率裁切。本舰自 1940-05-25 至 1941-12-31
      按 data/ships/illustrious.yaml 的 sensors.radar.installed 装的是 Type 79Z，
      1941 年 10 月正处在这个窗口内，因此图中前桅上的对空预警天线即 79Z 系统。
      局限：原图注只说明这是航母光辉号，未点名雷达型号；而 79Z 在光辉号上是
      临时加装的一根杆状天线，在图中与桅杆结构混在一起，无法单凭画面认定型号，
      本图的价值在于给出该时期本舰前桅的真实形态与雷达位置。

  - id: type-79z-illustrious-1940-masthead
    file: /img/weapons/type-79z-illustrious-1940-masthead.jpg
    subject: weapon:type-79z
    title:
      zh: 光辉号 1940 年桅顶与雷达天线架
      en: HMS Illustrious's masthead in 1940, the year Type 79Z was fitted
    part: radar
    view: detail
    date: 1940
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Royal Navy official photographer
    credit: Imperial War Museums, FL 2425
    source_url: "https://commons.wikimedia.org/wiki/File:HMS_ILLUSTRIOUS,_1940._FL2425.jpg"
    width: 836
    height: 1280
    primary: false
    note: >-
      1940 年光辉号官方照的桅顶裁切。本舰 1940 年 5 月完工时即装上 Type 79Z，
      是世界上第一艘完工前就装雷达的航母，因此这张 1940 年照处于 79Z 装舰窗口内。
      画面可见桅顶横桁与加装的杆状天线结构。
      局限：IWM 原图注仅「HMS ILLUSTRIOUS, 1940. Underway.」，没有标注雷达型号；
      79Z 的天线在照片上尺度很小，只能看出桅顶有横杆状加装物，无法据此判型，
      本图用于定位安装位置而非展示天线细部。
      IWM 编号 FL 2425；IWM 官网对其网站副本另有非商业条款，
      本站引用的是 Commons 的公有领域版本。

  - id: type-79b-illustrious-1944-masthead
    file: /img/weapons/type-79b-illustrious-1944-masthead.jpg
    subject: weapon:type-79b
    title:
      zh: 光辉号 1944 年主桅顶的对空预警天线
      en: HMS Illustrious's masthead air-warning antenna, 1944
    part: radar
    view: detail
    date: 1944-04
    license: pd
    license_tier: A
    license_raw: Public domain
    author: U.S. Navy (Commander Joseph C. Clifton album)
    credit: U.S. Navy National Museum of Naval Aviation photo No. 1977.031.085.071
    source_url: "https://commons.wikimedia.org/wiki/File:HMS_Illustrious_bow_1944.jpg"
    width: 692
    height: 1280
    primary: true
    note: >-
      1944 年 3 月至 5 月间光辉号在印度洋与萨拉托加号协同时的舰影，
      此处裁到桅顶。按 data/ships/illustrious.yaml，本舰自 1943-06-01 起
      sensors.radar.installed 记的是 Type 79B 对空预警雷达（同期还有 281B、272、282、285），
      1944 年 4 月在这个窗口内，桅顶这一组对空预警天线即属于 79B 系统。
      局限：原图注只写「HMS Illustrious (87) at sea in the Indian Ocean」，
      未点名 79B；图中桅顶同时叠有多型天线（281B/79B），
      单凭画面无法把某一段结构确指为 79B，型号归属依据是 ships yaml 的装舰清单。

  - id: type-284-hood-1941-last-photo
    file: /img/weapons/type-284-hood-1941-last-photo.jpg
    subject: weapon:type-284
    title:
      zh: 胡德号 1941 年 5 月 24 日最后时刻的前桅
      en: HMS Hood's foremast on 24 May 1941, the ship's last photograph
    part: radar
    view: other
    date: 1941-05-24
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Unknown Royal Navy photographer aboard HMS Prince of Wales
    credit: Imperial War Museums, HU 50190
    source_url: "https://commons.wikimedia.org/wiki/File:HOOD023.jpg"
    width: 1280
    height: 948
    primary: true
    note: >-
      1941 年 5 月 24 日自威尔士亲王号拍下的胡德号最后影像，此处裁到上层建筑与前桅。
      本舰在 1941-03-17 至 1941-05-24 之间按 data/ships/hood.yaml 装的是
      Type 284 主炮测距雷达与 Type 279M 对空预警雷达，拍照当天正在这个窗口内，
      因此桅上确有 284。
      重要局限：照片中胡德号是远景，桅顶天线只占画面极小区域，无法辨认天线结构，
      本图只能用于定位 284 在本舰的安装位置与当时的桅杆形态，不能作为天线细部证据。
      另需注意本站 type-284 条目已记录：为装 284 拆除了前上桅，
      图中前桅形态正是改装后的状态。
      IWM 编号 HU 50190；IWM 官网对其网站副本另有非商业条款，
      本站引用的是 Commons 的公有领域版本。

