  - id: fumo-23-prinz-eugen-seetakt-foretop
    file: /img/weapons/fumo-23-prinz-eugen-seetakt-foretop.jpg
    subject: weapon:fumo-23
    title:
      zh: 欧根亲王号前桅楼的 Seetakt 床垫形天线阵（策略 B）
      en: Seetakt mattress antenna on Prinz Eugen's foretop
    part: radar
    view: detail
    date: 1946-06-14
    license: pd
    license_tier: A
    license_raw: Public domain
    author: U.S. Navy, Naval Photographic Center photo 80-G-627444
    credit: U.S. Navy 80-G-627444, Operation Crossroads, 14 June 1946
    source_url: "https://commons.wikimedia.org/wiki/File:Cruiser_Prinz_Eugen_anchored_in_Bikini_Lagoon_on_14_June_1946.jpg"
    width: 1280
    height: 800
    primary: true
    note: >-
      这是欧根亲王号（姊妹级重巡）上的同族 Seetakt 天线，不是提尔皮茨号本舰。
      图中前桅楼正面那面矩形网状「床垫」（Matratze）阵清晰可辨，
      即德国海军 Seetakt 系列海上搜索雷达的标准天线形态。
      Commons 原图注明确写到「the German radars atop the director and mainmast」。
      为什么可以用：FuMO 23 属 Seetakt 系列、天线就是这种矩形床垫阵，
      提尔皮茨号本舰 1941-02-25 至 1941-12-31 装三台 FuMO 23
      （见 data/ships/tirpitz.yaml）；本舰自身的清楚实照未找到，
      故用同族天线实物补足形态说明。
      局限：这是欧根亲王号 1946 年的状态，那艘舰的具体型号与提尔皮茨号未必相同，
      本图不能证明提尔皮茨号装的就是 23，只说明 Seetakt 天线长什么样。

  - id: fumo-23-prinz-eugen-1941-bedspring
    file: /img/weapons/fumo-23-prinz-eugen-1941-bedspring.jpg
    subject: weapon:fumo-23
    title:
      zh: 1941 年欧根亲王号测距仪护盾前的床垫形雷达天线（策略 B）
      en: Prinz Eugen's 1941 "bedspring" Seetakt antennas on the rangefinder shields
    part: radar
    view: detail
    date: 1941
    license: pd
    license_tier: A
    license_raw: Public domain
    author: U.S. Naval Historical Center Photograph
    credit: U.S. Naval Historical Center, photo h69735c
    source_url: "https://commons.wikimedia.org/wiki/File:Prinz_Eugen_Kiel.jpg"
    width: 1280
    height: 805
    primary: false
    note: >-
      这是欧根亲王号 1941 年在基尔时的同族 Seetakt 天线，不是提尔皮茨号本舰。
      Commons 原图注是同期最直接的一条文字证据：
      「Note "bedspring" radar antennas mounted on the front of her rangefinder shields.
      At this time, German radar was used for rangefinding only, not for deflection.」
      即当时德舰把床垫形天线直接装在测距仪护盾前面。
      为什么可以用：提尔皮茨号的 FuMO 23 同样分装在前桅楼与前后测距仪塔上
      （data/ships/tirpitz.yaml），本图给出的正是「测距仪塔上的 Seetakt 天线」这一安装方式。
      局限：同族不等于同型，欧根亲王号当年装的严格说属 Seetakt 早期型，
      不能据此断定提尔皮茨号那三台的具体型号。

  - id: fumo-26-tirpitz-foretop
    file: /img/weapons/fumo-26-tirpitz-foretop.jpg
    subject: weapon:fumo-26
    title:
      zh: 提尔皮茨号前桅楼的雷达平台与天线
      en: Tirpitz's foretop radar platform and antenna
    part: radar
    view: detail
    date: 1942
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Unknown (German wartime photograph)
    credit: Wikimedia Commons, German Battleship Tirpitz.jpg
    source_url: "https://commons.wikimedia.org/wiki/File:German_Battleship_Tirpitz.jpg"
    width: 1280
    height: 802
    primary: true
    note: >-
      提尔皮茨号本舰艏向近照，此处裁到前桅楼与测距仪平台一带。
      本站 fumo-26 条目记载：1944 年春夏换装约 3 米 × 6 米的大床垫天线，
      专题站据天线尺寸判为 FuMO 26，共三台（data/ships/tirpitz.yaml 记 1944-01-01 起）。
      画面中前桅楼正面的圆形基座与两侧平台结构即雷达安装位。
      重要局限：这张照片的原图注只有「German Battleship Tirpitz」，无日期、无型号、
      无作者；本站无法确认它拍于 1944 年换装之后，也无法从画面辨认出 3×6 米床垫阵的
      完整轮廓，因此型号归属依据是 ships yaml 的装备记录，不是图注，
      本图实际作用是给出该安装位的真实形态。

  - id: fumo-27-tirpitz-altafjord-superstructure
    file: /img/weapons/fumo-27-tirpitz-altafjord-superstructure.jpg
    subject: weapon:fumo-27
    title:
      zh: 阿尔塔峡湾中的提尔皮茨号上层建筑
      en: Tirpitz's superstructure at Alta Fjord, Norway
    part: radar
    view: other
    date: 1943
    license: pd
    license_tier: A
    license_raw: Public domain
    author: tormentor4555 (Commons uploader)
    credit: Wikimedia Commons, Tirpitz Anchored in the Alta Fjord (1943-1944)
    source_url: "https://commons.wikimedia.org/wiki/File:Tirpitz_Anchored_in_the_Alta_Fjord,_in_northern_Norway,_protected_by_anti-torpedo_nets_(1943-1944)._(51055432497).jpg"
    width: 1280
    height: 624
    primary: true
    note: >-
      1943—1944 年提尔皮茨号在挪威阿尔塔峡湾锚地的侧影，裁到上层建筑与前桅一带。
      本站 fumo-27 条目记载：1941 年夏后部测距仪塔先装它的天线，
      次年年初前桅楼又加一座雷达塔装同一型；data/ships/tirpitz.yaml 记
      1942-01-01 至 1943-12-31 为「FuMO 27 + FuMO 4 Samos」时期，本照落在这个窗口内。
      重要局限：Commons 该文件用的是 CC Public Domain Mark，原始出处与拍摄者不明，
      图注只有「Tirpitz Anchored in the Alta Fjord…protected by anti-torpedo nets」，
      没有点名任何雷达型号；照片为远景，桅上天线无法辨认结构，
      本图仅能用于交代 27 型服役期内本舰上层建筑的整体形态与雷达安装位置。

  - id: type-273-kgv-1942-arctic-convoy
    file: /img/weapons/type-273-kgv-1942-arctic-convoy.jpg
    subject: weapon:type-273
    title:
      zh: 1942 年 3 月英王乔治五世号在北极护航行动中
      en: HMS King George V on Arctic convoy duty, March 1942
    part: radar
    view: other
    date: 1942-03
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Royal Navy official photographer
    credit: Imperial War Museums (photographed from HMS Victorious)
    source_url: "https://commons.wikimedia.org/wiki/File:HMS_King_George_V_viewed_from_HMS_Victorious_between_2_and_9_March_1942.jpg"
    width: 555
    height: 450
    primary: false
    note: >-
      1942 年 3 月 2—9 日自胜利号拍下的英王乔治五世号，图为上层建筑与双桅裁切。
      按 data/ships/king-george-v.yaml，本舰 1941-12-01 至 1944-06-30 装 Type 273
      水面搜索雷达，拍照当月正在窗口内。
      重要局限：原图注只写「HMS King George V viewed from HMS Victorious…protecting
      Arctic convoys」，未标注雷达型号；原始文件仅 800 px 宽，本裁切已接近原生像素，
      桅上结构模糊，无法辨认 273 的方形面板天线。本图只作该时期装备状态的位置参照，
      不能作为天线细部证据。IWM 官网对其网站副本另有非商业条款，
      本站引用的是 Commons 的公有领域版本。
