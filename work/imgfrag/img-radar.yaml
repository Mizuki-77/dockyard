  note: 这是陆基 Würzburg-D 的设备图，不是 FuMO 213 的舰上实照——Commons 全库检索（含 insource 正则与 Category:FuMO / Seetakt / Würzburg）均无标为 FuMO 213 的舰载照片，此图是唯一带「Würzburg Type D」原始标注的公开资料。FuMO 213 即 Würzburg-D 的舰载化型，天线碟与机柜同源，图中逐项标出 CRT 显示、距离手轮、方位与俯仰手轮及主显示单元，可用来认这套设备；差异是陆基型基座与操作台为固定式，舰载型另有稳定基座，本图反映不出。型号归属按美军 TM E 11-219 的 Type D 标注，舰载改型部分未经原始标注确认。
