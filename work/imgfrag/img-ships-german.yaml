  - id: bismarck-1940-superstructure
    file: /img/ships/bismarck-1940-superstructure.jpg
    subject: ship:bismarck
    title:
      zh: 俾斯麦号舰桥与测距仪圆顶（1940 年）
      en: "Bismarck's bridge area and rangefinder domes, 1940"
    part: bridge
    view: detail
    date: 1940
    license: cc_by_sa
    license_tier: B
    license_raw: CC BY-SA 3.0 de
    author: Unknown author
    credit: 德国联邦档案馆（Bundesarchiv） · Bild 193-03-1-06
    source_url: "https://commons.wikimedia.org/wiki/File:Bundesarchiv_Bild_193-03-1-06,_Schlachtschiff_Bismarck.jpg"
    width: 799
    height: 515
    note: 舰桥塔楼、测距仪圆顶、吊艇架与存放的小艇同框，是做上层建筑堆叠与吊艇架走线时的关键参考。注意此处圆顶尚未装雷达天线（FuMO 23 是 1941 年初才加装）。

