    subject: ship:bismarck
    title:
      zh: 俾斯麦号靠泊基尔码头（1940-09-23）
      en: "Bismarck alongside at Kiel, 23 September 1940"
    part: hull_side
    view: bow
    date: 1940-09-23
    license: cc_by_sa
    license_tier: B
