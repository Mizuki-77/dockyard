images:
  - id: bismarck-1939-propellers
    file: /img/ships/bismarck-1939-propellers.jpg
    subject: ship:bismarck
    title:
      zh: 俾斯麦号的三叶螺旋桨（1939 年，干船坞）
      en: "Bismarck's three-bladed propellers in dry dock, 1939"
    part: propeller
    view: detail
    date: 1939
    license: cc_by_sa
    license_tier: B
    license_raw: CC BY-SA 3.0 de
    author: Unknown author
    credit: 德国联邦档案馆（Bundesarchiv） · Bild 193-B30-5-32
    source_url: "https://commons.wikimedia.org/wiki/File:Bundesarchiv_Bild_193-B30-5-32,_Schlachtschiff_Bismarck,_Schrauben.jpg"
    width: 800
    height: 533
    note: 三个三叶螺旋桨全部露出，桨毂整流罩、桨叶根部与轴支架结构清晰，是核对桨叶形状与轴系布置的直接依据。署名按 Commons 要求写作「Bundesarchiv, Bild 193-B30-5-32 / Unknown author / CC-BY-SA 3.0」。

  - id: bismarck-1940-bow-anchor
    file: /img/ships/bismarck-1940-bow-anchor.jpg
    subject: ship:bismarck
    title:
      zh: 俾斯麦号舰艏与左舷锚（1940 年）
      en: "Bismarck's bow and port anchor, 1940"
    part: hull_side
    view: bow
    date: 1940
    license: cc_by_sa
    license_tier: B
    license_raw: CC BY-SA 3.0 de
    author: Unknown author
    credit: 德国联邦档案馆（Bundesarchiv） · Bild 193-02-6-17
