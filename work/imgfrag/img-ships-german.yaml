  - id: tirpitz-1942-faettenfjord
    file: /img/ships/tirpitz-1942-faettenfjord.jpg
    subject: ship:tirpitz
    title:
      zh: 提尔皮茨号停泊在法滕峡湾（1942 年）
      en: "Tirpitz in Fættenfjorden, 1942"
    part: hull_side
    view: broadside
    date: 1942
    license: cc_by
    license_tier: B
    license_raw: CC BY 2.0
    author: Unknown photographer / Åsen Museum og Historielag（收藏）
    credit: Åsen Museum og Historielag（挪威 Åsen 博物馆与历史协会） · 数字化 Arne Langås
    source_url: "https://commons.wikimedia.org/wiki/File:%22Tirpitz%22_i_F%C3%A6ttenfjorden_(14535516382).jpg"
    width: 1280
    height: 885
    note: 峡湾锚地的整舰侧视，能看清分裂式迷彩的明暗块在舰体上的分布。Fættenfjord 是 1942 年 1 月至 1943 年 10 月的主要驻泊地，岸上还做了防雷网与伪装措施。

  - id: tirpitz-1943-altenfjord-reconnaissance
    file: /img/ships/tirpitz-1943-altenfjord-reconnaissance.jpg
    subject: ship:tirpitz
    title:
      zh: 阿尔塔峡湾锚地的提尔皮茨号与 L 形防雷网（英军侦察照）
      en: "Aerial reconnaissance of Alten Fjord showing Tirpitz and her L-shaped torpedo net"
    part: hull_side
    view: overhead
    date: 1943
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Royal Navy official photographer
    credit: Imperial War Museums, A 19625
    source_url: "https://commons.wikimedia.org/wiki/File:An_aerial_reconnaissance_photograph_of_Alten_Fjord_showing_the_German_battleship_TIRPITZ_at_her_anchorage.jpg"
    width: 526
    height: 513
    note: 英军侦察机在 X-Craft 袭击前后拍摄，图注明确指出舰体周围那圈 L 形防鱼雷网——这是理解 1943-09-22 Operation Source 为何要用水下爆破筒（鱼雷被网挡住）的关键一张。原图分辨率偏低。原件藏帝国战争博物馆（IWM A 19625），作品本身已属公有领域；IWM 官网对其网站副本另有非商业条款，本站引用的是 Commons 的公有领域版本。

