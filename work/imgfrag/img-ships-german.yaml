  - id: tirpitz-1943-kaafjord-aerial
    file: /img/ships/tirpitz-1943-kaafjord-aerial.jpg
    subject: ship:tirpitz
    title:
      zh: 英军航拍卡峡湾锚地的提尔皮茨号（1943 年 5 月）
      en: "RAF aerial photo of Tirpitz at Kaafjord, May 1943"
    part: hull_side
    view: overhead
    date: 1943-05
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Royal Air Force photographer
    credit: Australian War Memorial
    source_url: "https://commons.wikimedia.org/wiki/File:Battleship_Tirptiz_in_Kaafjord_during_May_1943.JPG"
