    width: 799
    height: 512
    note: 舰艏侧面近景，可见锚链筒、锚冠与艏柱线型，以及甲板边缘的栏杆走向。1941-05-22 出击前舰艏锚被拆除，做 1941 年 5 月状态时注意这一处差异。

  - id: bismarck-1940-kiel-quay-bow
