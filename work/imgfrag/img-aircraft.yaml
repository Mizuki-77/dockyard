images:
  - id: swordfish-hms-victorious-bismarck-strike
    file: /img/weapons/swordfish-hms-victorious-bismarck-strike.jpg
    subject: weapon:swordfish
    title:
      zh: 胜利号后甲板待发的剑鱼式机群（1941-05-24，出击俾斯麦号前）
      en: Swordfish torpedo bombers ranged on the after deck of HMS Victorious, 24 May 1941
    part: aircraft
    view: overhead
    date: 1941-05-24
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Royal Navy official photographer
    credit: Imperial War Museums, A 4090
    source_url: "https://commons.wikimedia.org/wiki/File:Swordfish_on_HMS_Victorious_before_strike_on_Bismarck.jpg"
    width: 1007
    height: 737
    primary: true
    note: 胜利号后甲板上多架剑鱼式密集排开，机翼展开、鱼雷挂载状态与甲板系留索都能看清，是这批图里唯一同时拍到编队停放与「出击俾斯麦号」这一具体行动的甲板全景；湿甲板反光把翼展与轮距的比例交代得比较准，做甲板摆放参考优先用这张。原件藏帝国战争博物馆（IWM），Commons 副本标注为公有领域，按本站 §5.4 的 IWM 判例作 A 档归档；IWM 官网对其网站上的副本另行适用非商业条款，本站引用的是 Commons 的公有领域版本。

