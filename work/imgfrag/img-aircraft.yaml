  - id: fulmar-hms-victorious-hangar-row
    file: /img/weapons/fulmar-hms-victorious-hangar-row.jpg
    subject: weapon:fulmar
    title:
      zh: 胜利号机库内折翼的海燕式（两翼为长鳍式 Albacore）
      en: A row of folded-wing Fairey Fulmars in the hangar of HMS Victorious, flanked by Albacores
    part: aircraft
    view: detail
    date: 1942
    license: pd
    license_tier: A
    license_raw: Public domain
    author: Claude Henry Parnall, Royal Navy official photographer
    credit: Imperial War Museums, A 7279
    source_url: "https://commons.wikimedia.org/wiki/File:The_Royal_Navy_during_the_Second_World_War_A7279.jpg"
    width: 800
    height: 602
    primary: true
    note: 冰岛 Hvalfjörður 锚地，胜利号机库甲板上中间一排是海燕式、两侧各一排 Albacore，全部折翼停放；海燕式只有飞行员与观察员两名乘员、没有后座机枪手，座舱盖到此为止，而两侧的 Albacore 是三座、尾部有明显的后机枪座——这个差别在这张里比任何空中照都容易看出来；机库净高余量也是模型做机库场景的直接依据。Commons 原注日期写「1939 至 1945 之间」，说明文字称摄于搜索提尔皮茨号前后，本站按说明取 1942，精确到月的日期未获取。原件藏帝国战争博物馆（IWM），Commons 副本标注为公有领域，按本站 §5.4 的 IWM 判例作 A 档归档；IWM 官网对其网站上的副本另行适用非商业条款，本站引用的是 Commons 的公有领域版本。

