# ============================================================================
# 状态切片：HMS Sheffield（谢菲尔德号，舷号 24 → C24）
# ----------------------------------------------------------------------------
# 切片边界按「舰上装了什么、能干什么」切，不按「编入哪个舰队」切。
# 本舰的问题在于改装太碎：1938-1945 年间有 8 次以上增减，
# 若按每次改装切一片会碎到没法读，故合并成「服役状态」意义上的 7 片。
#
# 分界依据（逐片都在这几处）：
#   1938 补装弹射器与水机 → 第一次有航空能力
#   1941-07 Rosyth 改装 → 首次有火控雷达与 20 mm，同时拆掉 0.5 英寸机枪
#   1942-04 Tyne 大修 → 79Y 换 281、加 273，这一批定下她整个北极期的电子配置
#   1943-04 Clyde 改装 → 拆掉航空设施（机库保留两台吊车），是外形上的大改
#   1944-07 波士顿大修 → X 炮塔拆除、Bofors 上舰，是火力配置的分水岭
#   1946-07 战后改装完成 → 进入冷战期长期旗舰生涯
# ============================================================================
ship: sheffield
slices:
  - code: P0
    title: 建造与服役（1934-1937）
    from: 1934-12-17
    to: 1937-12-31
    note: >-
      1934-12-17 向 Vickers Armstrong（Newcastle upon Tyne，High Walker 船台）
      订造，1935-01-31 开工，1936-07-23 下水，1937-08-25 完工并同日服役，
      编入本土舰队第 2 巡洋舰分队。

      **服役时她没有航空设施**：navypedia 的改装台账第一条就写
      「1938, Sheffield: received her catapult with seaplanes (she was
      commissioned without it)」。所以这一片只有 12 门 6 英寸主炮、
      8 门 4 英寸、16 门 2-pdr、8 挺 0.5 英寸机枪、6 具鱼雷管。

      建成时的编制 748 人。装甲最薄处是主炮塔，全周 25 mm。

  - code: P1
    title: 战前：弹射器与第一批雷达（1938-1939）
    from: 1938-01-01
    to: 1939-08-31
    note: >-
      两件事挤在同一年：

      一、1938 年补装弹射器与水上飞机，本级才第一次有航空侦察能力。

      二、1938 年 8 月装 Type 79Y 对空警戒雷达。这一条值得单说：
      naval-history 原文「This ship was fitted with a development model of
      aircraft warning radar Type 79Y and was the third RN warship fitted
      with this new device before the outbreak of war」——**战前全皇家海军
      第 3 艘装上对空雷达的军舰**，而且是试装型（development model）。
      1939 年 2 月赴直布罗陀参加联合演习时，还专门用 79Y 做了试验，
      naval-history 记「valuable information was obtained about its
      operational use」。

      1939-08-31 从斯卡帕湾出港进入战时阵位，与 Nelson、Rodney、Ramillies、
      Royal Oak、Royal Sovereign、Hood、Repulse 同队。

  - code: P2
    title: 挪威战役与 H 舰队（1939-09 至 1941-05-25）
    from: 1939-09-01
    to: 1941-05-25
    note: >-
      本舰一生最密的一段，两个战场连着打。

      **北海与挪威**（1939-09 至 1940-07）：编入第 18 巡洋舰分队。
      1939-10-21 截获德国货船 Gloria 押回柯克沃尔；1940 年 4 月挪威战役中
      在 Namsos 登陆、Molde 与 Åndalsnes 撤运部队，4-30 那次从 Åndalsnes
      撤走并载 600 名士兵返航。

      **H 舰队**（1940-08-29 至 1941-06）：接替 Arethusa 进驻直布罗陀，
      与 Renown、Ark Royal 编为 Force H。这段的战事按 naval-history 的月份
      流水全在正文里，切片这里只点出性质：几乎全部是「为马耳他运飞机」
      与「护送去亚历山大的增援运输」两类任务，中间夹了 1940-11-27 的
      斯帕蒂文托角海战（短暂的远距离交火，意军主动撤出）。

      **状态上的变化只有一次**：1941-07 之前她一直是建成配置加 79Y 雷达，
      没有火控雷达、没有 20 mm 炮。这一点解释了 1941-05-26 夜里俾斯麦
      6 次齐射为什么能把她的雷达打坏 —— 那台 79Y 是当时舰上唯一的雷达。

  - code: P3
    title: 俾斯麦追击与「被自己人投雷」（1941-05-26 至 06-30）
    from: 1941-05-26
    to: 1941-06-30
    note: >-
      单独切出一天，因为这一天集中了本舰最出名的两件事。

      **上午到下午**：Force H 从直布罗陀北上来援，1315 前后她被派出
      独自去接触俾斯麦（Admiralty War Diary 原文「SHEFFIELD was detached
      to shadow」），1740 目视发现目标，此后整夜跟踪。

      **1550 的乌龙**：皇家方舟第一波 15 架 Swordfish（Stewart-Moore 少校）
      用 ASV 在预期阵位约 20 英里处发现一艘军舰、穿云攻击 —— 那是她。
      飞行员出发时被告知附近没有友舰。11 枚鱼雷全部落空：
      2 枚入水即爆、3 枚横穿她的尾迹时爆炸、其余 6 枚被规避。
      **她一炮未还**（Tovey 战报与 kbismarck 均记未还击）。
      根因是磁引信故障与情报脱节，不是识别错误 —— 这两点必须分开写。

      **2140 前后的炮击**：俾斯麦在约 9 英里距离上向她打了 6 次齐射，
      无直接命中，但破片打坏雷达、伤 12 人、3 人后来死亡
      （Ordinary Seaman David T. George 当日阵亡；Able Seaman Ambrose Ling
      5-27、Able Seaman Raymond C. Taylor 5-28 伤重不治）。
      她施放烟幕全速转向脱离，随后把敌情方位距离交给 Vian 上校的
      第 4 驱逐舰分队。

      **这一片的收尾是 1941-06-12**：她在回英国途中截获并击沉俾斯麦的
      补给油船 Friedrich Breme，救起 88 名德方幸存者。此后 Force H 由
      Hermione 接替，她于 6 月中归建本土舰队。

  - code: P4
    title: 改装与北极护航（1941-07 至 1943-03）
    from: 1941-07-01
    to: 1943-03-31
    note: >-
      这一段是配置变化最密集的时期，也是她战功最集中的时期。

      **1941-07 Rosyth 改装**：装 Type 284（前部主炮火控）与 Type 285
      （副炮对空火控），拆 2 座四联 0.5 英寸机枪，加 6 门单装 20 mm
      Oerlikon。这是她第一次有火控雷达。

      **1941-11 起转北极**：以冰岛为基地为俄国护航提供掩护。

      **1942-03-04 触雷**：在冰岛东北引爆一枚水雷，艉部重创，
      1 名皇家海军陆战队哨兵阵亡，以 6 节航速驶抵冰岛。

      **1942-04-02 起 Tyne（Palmer's Yard, Hebburn）大修**，这是本舰
      电子配置的分水岭：Type 79Y 换成 Type 281、加 Type 273 水面警戒、
      后部主炮补一台 Type 284、加 IFF 与美制 VHF（TBS）通话设备，
      并再加 20 mm。改装到 7 月试航、7-24 归建。

      **1942-12-31 巴伦支海海战**：与 Jamaica 编为 Force R（Burnett 少将
      坐镇本舰），在 JW51B 护航战中击沉德国驱逐舰 Friedrich Eckoldt，
      并击伤重巡 Admiral Hipper（三发命中）。

      **1943-02-18 巨浪**：JW53 护航途中遭巨浪，A 炮塔顶盖被整个掀掉，
      由 Norfolk 接替，返克莱德修理。

  - code: P5
    title: 地中海、北角与大改（1943-04 至 1945-05）
    from: 1943-04-01
    to: 1945-05-31
    note: >-
      **1943-04 克莱德改装**：拆掉航空设施（两台吊车保留），
      再加 20 mm。这是外形上的大改 —— 此后她没有水上飞机了。

      **1943-09-14 萨勒诺**：Operation AVALANCHE，为滩头部队提供舰炮支援。

      **1943-12-26 北角海战**：与 Belfast、Norfolk 编为第 10 巡洋舰分队，
      为 JW55B 护航。她是**最先发现沙恩霍斯特**的一艘（naval-history 记
      「Obtained radar detection of German battleship SCHARNHORST」，
      第二次交火中她首发即命中）。但随后**左内轴轴承损坏、航速降到 22 节，
      被迫退出**，未能参加当晚对沙恩霍斯特的最后围歼。
      这一点必须写清：她在场，且开了火、有命中，但没有参与击沉那一刻。

      **1944-01-25 利物浦**：修左内轴。

      **1944-03 至 05**：参加对提尔皮茨的舰载机空袭
      （Operation TUNGSTEN，4-3）与后续的护航航母行动。

      **1944-07-18 赴美**：7-25 进波士顿海军船厂大修，一直到 1945-05。
      这次拆了 X 炮塔（9 门 6 英寸），换上 4 座四联 40 mm Bofors，
      并大改 20 mm 配置。**她因此错过了诺曼底。**

  - code: P6
    title: 战后与拆解（1945-06 至 1967-09）
    from: 1945-06-01
    to: 1967-09-18
    note: >-
      **1945-06 至 1946-07**：先在英国船厂装新型火控雷达、目标指示设备与
      新对空雷达，原计划赴英国太平洋舰队；1946-07 改装完成后转地中海训练，
      然后 1946-08-30 抵百慕大，任美洲与西印度群岛站旗舰。

      **1946-1954**：以百慕大为基地，五度巡航、访问 50 个港口、
      航行 60,000 英里。1953 年参加伊丽莎白二世加冕海上阅兵。

      **1955**：在电影《拉普拉塔河口海战》里扮演轻巡 Ajax。

      **1959-01**：在朴次茅斯转入预备役，接替 Vanguard 任预备舰队旗舰。

      **1964-09**：列入处置清单。

      **1967**：拖至 Rosyth 拆除设备；1967-09-18 拖抵 Faslane，
      交 Shipbreaking Industries 拆毁。

      值得单记的一件：她的舰钟是不锈钢的（由谢菲尔德的 Hadfield's 制造），
      连同战旗一并保存在谢菲尔德大教堂。全舰大量使用不锈钢替代传统黄铜
      配件，本舰绰号「Shiny Sheff」即由此而来。
