# ============================================================================
# 来源分片 —— g2-sheffield（HMS Sheffield / Town class）
# ----------------------------------------------------------------------------
# 只登记本组新用的来源。已存在的直接复用，不重复登记：
#   navweaps-6in-50-mk23      主炮炮身（城级 6 英寸）
#   navweaps-2pdr-mk8         40 mm 2-pdr pom-pom
#   navweaps-20mm-oerlikon    20 mm Oerlikon
#   kbismarck-chase / kbismarck-histoperi / kbismarck-admiralty-war-diary
#   hmshood-tovey-dispatch    Tovey 战报（一手，tier A）
#
# ⚠️ 发现一处既有登记错误，已在 RESEARCH-NOTES.md 里记明：
#   data/sources.yaml 里的 `navweaps-45in-45-mk16`，标题写 4.5"/45 QF Mark XVI，
#   但 url 是 WNBR_4-45_mk16.php —— 那是 **4 英寸** Mk XVI 的页面（本组实际抓取
#   该页，页面标题为 "4"/45 (10.2 cm) QF Mark XVI and XVI*"）。
#   4.5 英寸的 Mk XVI 页面应为 WNBR_45-45_mk16.php。本组不改 data/，
#   另立 navweaps-4in-45-mk16 指向正确页面，那条错误的修正请主会话处理。
# ============================================================================

sources:
  - id: naval-history-sheffield
    title: HMS Sheffield — Service History (Royal Navy Warships in World War 2)
    url: https://www.naval-history.net/xGM-Chrono-06CL-HMS_Sheffield.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.net（Gordon Smith 编辑；正文为 Lt Cdr Geoffrey B Mason RN (Rtd)，c. 2003）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      逐月服役年表，覆盖 1936（前期建造段）到 1946，末段另有 Post War Notes
      写到 1967 年拆解。**本组的主力来源**：全部战历、改装月份、雷达型号、
      20 mm 数量、触雷与巨浪损伤日期都出自此页。

      抓取要点：
      - **直连可以，走 web_fetch 会被 SSRF 拦**（www.naval-history.net 在
        本机 hosts 里解析到 198.18.0.99，web_fetch 判定为内网地址）。
        用 Python urllib 直连正常，返回 339 kB。
      - 页面编码是 cp1252，按 utf-8 解会出乱码。
      - 页尾附 Don Kindell 整理的「CONVOY ESCORT MOVEMENTS」护航表，
        本组未逐条摘录（表内日期格式 DD/MM/YY，与正文月份段混排，
        易与正文混淆）。

      口径提示：本页日期精确到日，但改装类条目通常只写到月份
      （如「July Under refit at Dockyard Rosyth」），故本组凡改装类
      fact 的 valid.from 都取该月 1 日，并在各条 note 里写明来源只给到月份。

  - id: navypedia-town
    title: SOUTHAMPTON light cruisers (5, 1937) — Navypedia
    url: https://www.navypedia.org/ships/uk/brit_cr_southampton.htm
    type: website
    tier: D
    role: [data]
    operator: Navypedia（Igogin 主编）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      城级第一组（Southampton 子级，5 艘）的分级页。供给本组：
      主尺度 / 排水量 / 动力 / 装甲分项 / 武备配置 / 编制 748 /
      逐舰建造表（含舷号两段式「24, 1948- C24」）/ 逐月改装台账
      （Modernizations 一节，按舰按月列增减项）。

      口径提示（这三条会直接影响能否直接引用）：
      1) **排水量表头写 t，数值却是长吨**。正文 9,100 / 11,350 是皇家海军
         设计值的长吨数（9,100 lt = 9,246 t），表头只改了字没换算。
         故本组两条排水量 fact 都标 comparable: false。
      2) 只给「6.20 m deep load」一个吃水值，**没有标准排水量状态的平均吃水**。
      3) 全级共用一个编制数 748，未分舰。

      **站点可达性备注（与任务书给的提示不同）**：本轮 navypedia.org
      可以直连（Python urllib，1 次试探 404 后按站内索引找到正确路径），
      未遇到 SSRF 拦截。真正被 SSRF 拦的是 naval-history.net 与 navweaps.com
      （走 web_fetch 工具时）。

  - id: navypedia-gloucester
    title: GLOUCESTER light cruisers (3, 1938 - 1939) — Navypedia
    url: https://www.navypedia.org/ships/uk/brit_cr_gloucester.htm
    type: website
    tier: D
    role: [data]
    operator: Navypedia
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      城级第二组（Gloucester 子级，3 艘）。本组只用它做**舰级划分**的旁证：
      证明 Town 在 navypedia 里是三个独立分级页，以及该子级与 Southampton
      子级的具体差异（标准 9,400 t / 宽 19.0 m / 炮塔正面 102 mm、顶 51 mm /
      甲板 51 mm / 82,500 hp / 32.3 kn）。这些差异写在 classes/town.yaml 的
      前言与 note 里作参照，**不写成 fact**。

  - id: navypedia-edinburgh
    title: EDINBURGH light cruisers (2, 1939) — Navypedia
    url: https://www.navypedia.org/ships/uk/brit_cr_edinburgh.htm
    type: website
    tier: D
    role: [data]
    operator: Navypedia
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      城级第三组（Edinburgh 子级，2 艘：Edinburgh / Belfast）。
      同上，只作舰级划分旁证与该子级差异的来源（标准 10,550 t /
      187.0 m oa / 宽 19.3 m / 6 座双联 4 英寸 / 80,000 hp / 32.5 kn /
      甲板 76–38 mm）。不写成 fact。

  - id: navweaps-4in-45-mk16
    title: 'British 4"/45 (10.2 cm) QF Mark XVI, Mark XVII and Mark XXI'
    url: https://www.navweaps.com/Weapons/WNBR_4-45_mk16.php
    type: website
    tier: D
    role: [data]
    operator: NavWeaps（Tony DiGiulian）
    lang: en
    access: proxy
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      城级的副炮/两用炮。装舰表原文把「Town Cruisers: Southampton class (4)」
      列在 Mark XIX 双联炮座之下，即 4 座双联 8 门，直接印证城级第一组的
      副炮数量与炮座型号。

      **与既有登记 `navweaps-45in-45-mk16` 的关系**：那一条的 url 也是本页，
      但标题写成 4.5"/45 QF Mark XVI —— 标题错了，本页是 4 英寸。本组另立
      本条以区分，既有那条请主会话决定是否改名或作废。

      口径提示：本页「Ship Class Used On」把 4 英寸 Mk XVI 的载舰列得极广
      （含主力舰、航母、驱逐舰、护卫舰、辅助舰），必须靠炮座型号
      （Mark XIX / XX / XXIV）才能定位到具体舰级，不能只看炮身型号。

  - id: arctic-convoys-ships
    title: 'Members'' Ships: Royal Navy P to T — Arctic Convoy Veterans (ACCNZ)'
    url: https://www.arctic.org.nz/RoyalNavyShipsPT.html
    type: website
    tier: D
    role: [narrative]
    operator: Arctic Convoy Club of New Zealand（ACCNZ）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      新西兰北极护航老兵协会的舰只名录页，HMS Sheffield 条目约 4 段。
      本组只取它两样别的来源给不出的东西：

      1) **完整的护航编号清单**（原句：「HMS Sheffield sailed in convoys:
         PQ5 + PQ18 + QP14 + JW51a + JW51b + JW52 + JW55a + JW55b + RA51 +
         RA52 + RA55a」）——这是判断「她在不在场」最硬的一条，
         比逐月的叙述更不容易漏。
      2) 印证舰名归属：「one of the Southampton sub class of the Town class
         cruisers」——与本组把舰级定为 town / 子级 southampton 一致。

      口径提示：本页是老兵协会整理，属 tier D 且偏综述，个别日期与
      naval-history 不同（如触雷记 3 月 3 日，naval-history 与 navypedia
      都记 3 月 4 日）。凡与两份更专的来源冲突的日期，本组不取本页。

      另注：本页**没有** PQ17 的记录 —— 任务书提到的「PQ-17 灾难中她在场」
      未获本页证实，详见 RESEARCH-NOTES.md「卡住的地方」。
