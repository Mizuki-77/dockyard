# ============================================================================
# 舰艇正文 —— 谢菲尔德号（HMS Sheffield, C24）
#
# 本舰正文的抓手是「同一场战斗里挨了两次打，一次来自敌人，一次来自自己人」。
# 项目里其他舰的正文讲设计或结局，这一艘最值得讲的是 1941-05-26 那一天：
# 她整天都在正确的位置上做正确的事，却被自己方的空袭当成目标。
# 另一个值得讲的是她的配置史 —— 她几乎是皇家海军巡洋舰电子设备演变的标本。
#
# 篇幅按「有特殊意义的舰」定：intro 4 段 + history 4 节 23 条事件。
# ============================================================================
ship: sheffield
updated: 2026-11-22

intro:
  lead:
    zh: >-
      谢菲尔德号是城级轻巡洋舰第一组（Southampton 子级）的第 3 艘，
      1937 年 8 月 25 日服役。她在北海、大西洋、地中海、北极四个战场都打过仗，
      获 12 项战功表彰；但最常被提起的一天是 1941 年 5 月 26 日 ——
      那天她先被自己航母上的剑鱼机当成俾斯麦投了 11 枚鱼雷，
      当晚又被真正的俾斯麦打了 6 次齐射。
    en: >-
      HMS Sheffield was the third ship of the Southampton group of the Town
      class, commissioned on 25 August 1937. She fought in the North Sea, the
      Atlantic, the Mediterranean and the Arctic, and was awarded twelve battle
      honours. The day she is remembered for, though, is 26 May 1941: first
      attacked with eleven torpedoes by her own carrier's Swordfish, which had
      taken her for Bismarck, and that evening shelled by the real Bismarck.

  paragraphs:
    - heading: 一条被自己人当成敌人的船
      text:
        zh: >-
          1941 年 5 月 26 日下午，皇家方舟号派出 15 架剑鱼机去攻击俾斯麦。
          飞行员出发时被告知附近没有友方军舰。他们用机载雷达在预期阵位约
          20 英里处发现了一艘船，穿云攻击 —— 那是谢菲尔德号，当天上午刚被
          派出去单独跟踪俾斯麦。11 枚鱼雷全部落空：2 枚入水即爆，
          3 枚横穿她的尾迹时爆炸，其余 6 枚被她规避。她一炮未还。
        en: >-
          On the afternoon of 26 May 1941 Ark Royal flew off fifteen Swordfish
          to attack Bismarck. The aircrew had been told no friendly ships were
          in the vicinity. Using ASV they found a ship about twenty miles from
          the expected position and attacked through cloud. It was Sheffield,
          detached that morning to make contact with Bismarck and shadow her.
          All eleven torpedoes missed: two exploded on hitting the water, three
          on crossing her wake, and the remaining six were avoided. She did not
          fire a round in reply.
      src: [hmshood-tovey-dispatch, kbismarck-chase, kbismarck-admiralty-war-diary]

    - heading: 原因不是她认错了目标
      text:
        zh: >-
          这件事常被写成一次「识别失误」，但责任的落点不在舰上。
          鱼雷装的是磁引信，本来就不可靠 —— 两枚入水即爆是引信问题，
          与目标是谁无关。而飞行员不知道附近有友舰，是情报没有往下传：
          她被派出去的动作，空袭编队并不知道。皇家方舟号当时也不确定要打的
          究竟是俾斯麦还是欧根亲王号，所以第一波的鱼雷定深设在 30 英尺
          而不是 34 英尺。三件事叠在一起，才有了这次乌龙。
        en: >-
          The episode is often described as an identification failure, but the
          fault does not sit with the ship. The torpedoes carried magnetic
          pistols, which were unreliable in any case - two detonating on
          entering the water has nothing to do with who the target was. The
          aircrew not knowing a friendly ship was nearby was a failure to pass
          intelligence down: her detachment was not communicated to the strike
          force. Ark Royal was also unsure whether the target was Bismarck or
          Prinz Eugen, which is why the first wave's torpedoes were set to run
          at thirty feet rather than thirty-four.
      src: [hmshood-tovey-dispatch, kbismarck-chase]

    - heading: 当晚她挨的是真炮弹
      text:
        zh: >-
          同一天夜里，第二波剑鱼机打坏了俾斯麦的舵机，德舰开始不由自主地
          兜圈，航向变化让她与德舰的距离缩短。约 2140，俾斯麦在 9 英里距离上
          向她打了 6 次齐射：前两群偏差很大，第三群跨射。没有直接命中，
          但破片打坏了她的雷达、伤了 12 人，其中 3 人后来死亡 ——
          二等兵 David T. George 当天阵亡，一等兵 Ambrose Ling 与
          Raymond C. Taylor 分别在 27 日和 28 日伤重不治。
          她施放烟幕全速转向脱离，随后把敌情方位与距离交给了 Vian 上校的
          第 4 驱逐舰分队。
        en: >-
          That night the second Swordfish wave wrecked Bismarck's steering, and
          the German ship began to circle involuntarily; the change of course
          closed the range to Sheffield. At about 2140 Bismarck fired six
          salvoes at her at a range of nine miles. The first two groups were
          well off; the third straddled. There was no direct hit, but splinters
          disabled her radar and wounded twelve men, three of whom died later -
          Ordinary Seaman David T. George that day, Able Seaman Ambrose Ling on
          the 27th and Able Seaman Raymond C. Taylor on the 28th. She turned
          away at full speed under a smoke screen and passed the enemy's bearing
          and range to Captain (D) Vian's 4th Destroyer Flotilla.
      src: [hmshood-tovey-dispatch, kbismarck-chase, kbismarck-admiralty-war-diary]

    - heading: 她的电子设备几乎逐次改装都在变
      text:
        zh: >-
          1938 年 8 月，本舰装上一台 Type 79Y 对空警戒雷达，是战前全皇家海军
          第 3 艘装上这种设备的军舰，而且装的是试装型。1939 年 2 月赴直布罗陀
          参加联合演习时，还专门用它做了试验。此后 1941 年 7 月加火控雷达，
          1942 年 4 月把 79Y 换成 281 并加水面警戒雷达，1945 年再加新型对空
          雷达。这条线索比她的战果更能说明一艘条约型巡洋舰在六年战争里
          被改成了什么样子。
        en: >-
          In August 1938 she was fitted with a Type 79Y air warning radar, the
          third Royal Navy warship to carry the set and a development model at
          that. During the Gibraltar exercises of February 1939 trials were run
          with it. After that fire control radar came in July 1941, Type 79Y was
          replaced by Type 281 with a surface warning set added in April 1942,
          and new air warning radar followed in 1945. That line of development
          says more about what happened to a treaty cruiser over six years of
          war than her list of actions does.
      src: [naval-history-sheffield, navypedia-town]

history:
  - id: build
    title: { zh: 建造与服役, en: Building and commissioning }
    range: { from: 1934, to: 1938 }
    events:
      - date: 1934-12-17
        text:
          zh: 向 Vickers Armstrong（Newcastle upon Tyne）订造。
          en: Ordered from Vickers Armstrong at Newcastle upon Tyne.
        src: [naval-history-sheffield]
      - date: 1935-01-31
        text:
          zh: 开工。
          en: Laid down.
        src: [naval-history-sheffield, navypedia-town]
      - date: 1936-07-23
        text:
          zh: 下水。她是皇家海军第 1 艘以此命名的军舰。
          en: Launched; the first Royal Navy ship to bear the name.
        src: [naval-history-sheffield, navypedia-town]
      - date: 1937-08-25
        text:
          zh: >-
            完工并同日服役，编入本土舰队第 2 巡洋舰分队。服役时没有航空设施。
          en: >-
            Completed and commissioned the same day for the 2nd Cruiser
            Squadron, Home Fleet. She commissioned without aviation facilities.
        src: [naval-history-sheffield, navypedia-town]
      - date: 1938-08
        text:
          zh: >-
            补装弹射器与水上飞机；同月装上 Type 79Y 对空警戒雷达，
            为战前全皇家海军第 3 艘。
          en: >-
            Received her catapult and seaplanes; the same month she was fitted
            with a Type 79Y air warning radar, the third Royal Navy warship to
            carry one.
        src: [naval-history-sheffield, navypedia-town]

  - id: homefleet
    title: { zh: 北海、挪威与 H 舰队（1939-1941）, en: The North Sea, Norway and Force H }
    range: { from: 1939-08, to: 1941-05 }
    events:
      - date: 1939-08-31
        text:
          zh: >-
            从斯卡帕湾出港进入战时阵位，与 Nelson、Rodney、Hood、Repulse
            等舰同队；同月转入第 18 巡洋舰分队。
          en: >-
            Sailed from Scapa Flow to take up her war station in company with
            Nelson, Rodney, Hood and Repulse; transferred to the 18th Cruiser
            Squadron that month.
        src: [naval-history-sheffield]
      - date: 1940-04-30
        text:
          zh: >-
            挪威战役中先在 Namsos 卸下水兵与陆战队、舰载机执行侦察
            （Operation HENRY），随后与 Galatea、Arethusa、Southampton 等舰
            从 Åndalsnes 撤运部队，5-01 载 600 名士兵返航斯卡帕湾。
          en: >-
            Landed seamen and marines at Namsos and flew reconnaissance sorties
            (Operation HENRY), then evacuated troops from Andalsnes with
            Galatea, Arethusa and Southampton, reaching Scapa Flow with 600
            troops on 1 May.
        src: [naval-history-sheffield]
      - date: 1940-08-29
        text:
          zh: >-
            抵直布罗陀，接替 Arethusa 编入 H 舰队（Renown、Ark Royal、6 艘驱逐舰）。
          en: >-
            Arrived at Gibraltar and commenced Force H service, relieving
            Arethusa.
        src: [naval-history-sheffield]
      - date: 1940-11-27
        text:
          zh: >-
            参加斯帕蒂文托角海战，与包括两艘战列舰的意大利水面编队短暂交火；
            意军在误判英方兵力后主动撤出。
          en: >-
            Took part in the brief action off Cape Spartivento against an Italian
            force including two battleships; the Italians withdrew after
            misjudging the British strength.
        src: [naval-history-sheffield]
      - date: 1941-02-08
        text:
          zh: >-
            与 Renown、Malaya 一同炮击热那亚，并掩护皇家方舟号对岸上目标
            空袭与布雷（Operation GROG）。
          en: >-
            Bombarded Genoa with Renown and Malaya and covered Ark Royal's air
            attacks and minelaying (Operation GROG).
        src: [naval-history-sheffield]

  - id: bismarck
    title: { zh: 1941-05-26：两次被打, en: '26 May 1941: hit twice' }
    range: { from: 1941-05, to: 1941-06 }
    events:
      - date: 1941-05-24
        text:
          zh: >-
            俾斯麦突入大西洋后，随 Renown、Ark Royal 自直布罗陀紧急出港北上，
            加入本土舰队的搜索。
          en: >-
            After Bismarck broke out into the Atlantic, despatched from Gibraltar
            with Renown and Ark Royal to join the Home Fleet search.
        src: [naval-history-sheffield, kbismarck-admiralty-war-diary]
      - date: 1941-05-26
        text:
          zh: >-
            1315 前后被派出去单独接触俾斯麦；1550 皇家方舟号第一波 15 架剑鱼机
            把她当成俾斯麦攻击，11 枚鱼雷全部落空 —— 2 枚入水即爆、
            3 枚横穿尾迹时爆、6 枚被规避。她一炮未还。
          en: >-
            Detached to shadow around 1315; at 1550 the first Ark Royal striking
            force of fifteen Swordfish attacked her, believing her to be
            Bismarck. All eleven torpedoes missed - two exploded on hitting the
            water, three on crossing her wake, six were avoided. She did not
            fire in reply.
        src: [hmshood-tovey-dispatch, kbismarck-chase, kbismarck-admiralty-war-diary]
      - date: 1941-05-26
        text:
          zh: >-
            1740 目视发现俾斯麦并接管跟踪，保持在西侧约 14 英里。
          en: >-
            Made visual contact with Bismarck at 1740 and took over shadowing,
            keeping about fourteen miles to the westward.
        src: [kbismarck-admiralty-war-diary, kbismarck-chase]
      - date: 1941-05-26
        text:
          zh: >-
            约 2140，俾斯麦在 9 英里距离上打了 6 次齐射。无直接命中，
            但破片打坏雷达、伤 12 人，其中 3 人后来死亡。
          en: >-
            At about 2140 Bismarck fired six salvoes at her at nine miles. No
            direct hit, but splinters disabled her radar and wounded twelve men,
            three of whom died later.
        src: [hmshood-tovey-dispatch, kbismarck-chase, kbismarck-admiralty-war-diary]
      - date: 1941-06-12
        text:
          zh: >-
            在返英途中截获并击沉俾斯麦的补给油船 Friedrich Breme，
            救起 88 名德方幸存者。
          en: >-
            Intercepted and sank Bismarck's supply tanker Friedrich Breme,
            rescuing 88 survivors.
        src: [naval-history-sheffield]

  - id: arctic
    title: { zh: 北极、地中海与北角（1941-1945）, en: The Arctic, the Mediterranean and North Cape }
    range: { from: 1941-07, to: 1945-05 }
    events:
      - date: 1941-07
        text:
          zh: >-
            Rosyth 改装：装 Type 284（前部主炮火控）与 Type 285（副炮对空），
            拆 2 座四联 0.5 英寸机枪，加 6 门单装 20 mm Oerlikon。
          en: >-
            Refit at Rosyth: Type 284 for the forward 6-inch armament and Type
            285 for the secondary AA armament fitted; the two quadruple
            0.5-inch mountings removed and six single 20 mm Oerlikon added.
        src: [naval-history-sheffield, navypedia-town]
      - date: 1942-03-04
        text:
          zh: >-
            在冰岛东北引爆一枚水雷，艉部重创，1 名皇家海军陆战队哨兵阵亡；
            以 6 节航速驶抵冰岛。
          en: >-
            Detonated a mine off north-east Iceland, sustaining major damage aft
            and losing a Royal Marine sentry; reached Iceland at six knots.
        src: [naval-history-sheffield, navypedia-town]
      - date: 1942-04-02
        text:
          zh: >-
            进 Tyne 的 Palmer's Yard（Hebburn）大修：Type 79Y 换为 Type 281、
            加 Type 273 水面警戒、后部主炮补 Type 284、加 IFF 与美制 VHF（TBS）。
          en: >-
            Taken in hand at Palmer's Yard, Hebburn: Type 79Y replaced by Type
            281, Type 273 surface warning added, Type 284 fitted for the after
            6-inch turret, IFF and US-built VHF (TBS) installed.
        src: [naval-history-sheffield]
      - date: 1942-12-31
        text:
          zh: >-
            与 Jamaica 编为 Force R（Burnett 少将坐镇本舰），在 JW51B 护航战中
            击沉德国驱逐舰 Friedrich Eckoldt，并击伤重巡 Admiral Hipper。
          en: >-
            With Jamaica as Force R, under Rear-Admiral Burnett in Sheffield,
            she sank the German destroyer Friedrich Eckoldt and damaged the heavy
            cruiser Admiral Hipper in the defence of Convoy JW51B.
        src: [naval-history-sheffield, arctic-convoys-ships]
      - date: 1943-02-18
        text:
          zh: >-
            JW53 护航途中遭巨浪，A 炮塔顶盖被整个掀掉，由 Norfolk 接替后
            返克莱德修理；4 月改装中拆掉航空设施。
          en: >-
            In appalling weather during JW53 a heavy sea tore away the top of 'A'
            turret; relieved by Norfolk she returned to the Clyde, where her
            aircraft facilities were removed during the April refit.
        src: [naval-history-sheffield]
      - date: 1943-09-14
        text:
          zh: 在萨勒诺为岸上作战提供舰炮支援（Operation AVALANCHE）。
          en: >-
            Provided naval gunfire support for the Salerno landings (Operation
            AVALANCHE).
        src: [naval-history-sheffield]
      - date: 1943-12-26
        text:
          zh: >-
            北角海战：与 Belfast、Norfolk 为 JW55B 护航，取得对沙恩霍斯特的
            雷达接触，并以第二次齐射命中；随后左内轴轴承损坏、航速降至 22 节，
            被迫退出，未参加当晚的击沉。
          en: >-
            Battle of the North Cape: screening JW55B with Belfast and Norfolk,
            she obtained radar detection of Scharnhorst and obtained hits with
            her second salvo; damage to the port inner shaft bearing cut her
            speed to 22 knots and forced her to disengage before the sinking.
        src: [naval-history-sheffield]
      - date: 1944-07-25
        text:
          zh: >-
            进波士顿美国海军船厂大修，持续到 1945 年 5 月。期间拆除 X 炮塔
            （6 英寸减为 9 门），换装 4 座四联 40 mm Bofors。她因此未参加诺曼底。
          en: >-
            Taken in hand by the US Navy Yard at Boston until May 1945, losing
            'X' turret (nine 6-inch guns remaining) in exchange for four
            quadruple 40 mm Bofors. She therefore missed the Normandy landings.
        src: [naval-history-sheffield, navypedia-town]

  - id: postwar
    title: { zh: 战后与拆解, en: Post-war and disposal }
    range: { from: 1946, to: 1967 }
    events:
      - date: 1946-08-30
        text:
          zh: >-
            完成英国改装与地中海训练后抵百慕大，任美洲与西印度群岛站旗舰。
          en: >-
            After her UK refit and work-up in the Mediterranean, arrived at
            Bermuda as flagship on the America and West Indies Station.
        src: [naval-history-sheffield]
      - date: 1959-01
        text:
          zh: >-
            在朴次茅斯转入预备役，接替 Vanguard 任预备舰队旗舰。
          en: >-
            Reduced to reserve at Portsmouth, becoming Flagship of the Reserve
            Fleet in place of Vanguard.
        src: [naval-history-sheffield]
      - date: 1967-09-18
        text:
          zh: >-
            1964-09 列入处置清单；1967 年在 Rosyth 拆除设备后于 9-18 拖抵
            Faslane，交 Shipbreaking Industries 拆毁。不锈钢舰钟与战旗
            现存谢菲尔德大教堂。
          en: >-
            Placed on the Disposal List in September 1964; de-equipped at Rosyth
            and towed to Faslane on 18 September 1967 for demolition by
            Shipbreaking Industries. Her stainless-steel bell, made by
            Hadfield's of Sheffield, and her battle ensign hang in Sheffield
            Cathedral.
        src: [naval-history-sheffield, navypedia-town, arctic-convoys-ships]
