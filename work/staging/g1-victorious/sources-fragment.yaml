# ============================================================================
# 来源分片：HMS Victorious（胜利号，38）调研新登记的来源
# ----------------------------------------------------------------------------
# 已在 data/sources.yaml 登记、本次直接复用的（不重复登记）：
#   navypedia-illustrious / ac-design / ac-staff-requirements / ac-worthwhile
#   ac-techdata / ac-pacops / naval-history-illustrious / navweaps-* /
#   hmshood-tovey-dispatch / kbismarck-admiralty-war-diary / kbismarck-last-battle
#
# 抓取方式说明（2026-11-22 实测）：本会话的 web_fetch / research 对全部域名
# 返回 SSRF blocked（解析到 198.18.0.x 假地址），改用本机 Invoke-WebRequest
# 直连，十处全部 200。因此 access 一律 direct。
# 未取到的：iwm.org.uk（403）、hmshood.org.uk（403，Tovey 电文原件）；
# 这两处的内容改引 wc-victorious 的二次转述，并在 RESEARCH-NOTES 里标明。
# ============================================================================

sources:
  - id: naval-history-victorious
    title: 'HMS Victorious — Illustrious-class Fleet Aircraft Carrier (Service Histories of Royal Navy Warships in World War 2)'
    url: https://www.naval-history.net/xGM-Chrono-04CV-Victorious.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.net（Geoffrey B. Mason 撰，Gordon Smith 编）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      逐月服役年表，覆盖 1941-03 至 1969-07，末尾附 Don Kindell 的护航船团表
      （PQ 12/13/14/15/16/17、QP 8/9/10/11/12/13、WS8X、DERVISH、WS21S）。
      口径提示：① 建造段写「laid down on 5th May」，与 navypedia 的 4.5.1937
      差一天，两说并列；② 完工日写 15 May 1941、服役日写 29 March 1941，
      这两个不是同一事件；③ 年表把 1941-05-24 的空袭与 05-31 编入 WS8X
      护航分开记，可据此确认她 05-26 前后已脱离追击；④ 错字较多
      （"Victors-Armstrong"、"sere embarked"、"cut strikes"），引用时按原意转写。

  - id: ac-vic-charcard
    title: 'HMS Victorious — Ship Characteristics Card (RN 0314, 24 March 1943)'
    url: https://www.armouredcarriers.com/hms-victorious-ship-characteristics-card
    type: archive
    tier: A
    role: [data]
    operator: armouredcarriers.com（转录美国海军 1943-03-24 编成的舰艇特性卡）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      **本舰技术数据最硬的一份**：美国海军在夏威夷为「编入 USS Saratoga 编队」
      而编成的规格摘要，1943-03-24，SECRET。含干舷、回转直径、装甲磅数、
      燃油/汽油容量、全速段续航表、拦阻索数、弹药基数、六部雷达的型号/频率/用途。
      口径提示：① 全部为英美混用单位（英尺、磅、美制加仑、桶），本站换算为公制，
      换算过程写在 RESEARCH-NOTES；② 装甲以磅计（120 lbs = 3 in），不是毫米；
      ③ 编制 1,790 人；④ 站方标注 "Transcript in progress"，个别词有 OCR 噪声
      （"nalvage"、"Iterragator"、"me/s"），不影响数值；⑤ 它描述的是
      1943-03 珍珠港改装**进行中**的状态，不是建成状态。

  - id: ac-vic-kamikaze
    title: 'HMS Victorious — Kamikaze attack damage, April 1 & May 9, 1945 (Task Force 57 off Sakishima Gunto)'
    url: https://www.armouredcarriers.com/hms-victorious-kamikaze
    type: website
    tier: C
    role: [data, narrative]
    operator: armouredcarriers.com
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      1945 年两次神风攻击的逐帧记述，附 Denny 舰长的直接引语与损管细节；
      另含 1944-08 起反复发作的舵机故障、1945-03-14 中央锅炉房火灾、
      1945-05-17 着舰事故。伤亡数字与 ac-kami-co 的原件有小差，两说并列。

  - id: ac-kami-co
    title: 'Commanding Officer, HMS Victorious — report on Operation Iceberg, 7th and 8th periods (10 May 1945)'
    url: https://www.armouredcarriers.com/document-commanding-officer-hms-victorious-kamikaze-may-9
    type: archive
    tier: A
    role: [data, narrative]
    operator: armouredcarriers.com（转录舰长 M. M. Denny 1945-05-10 报告 No. 0247/8270）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      1945-05-09 四次神风攻击的**当舰原始报告**，逐分钟（1647/1656/1659/1703）。
      含阵亡者姓名与军籍号。雷达型号记作「Victorious' Type 277」。
      口径提示：报告写「20 others wounded」，同页另处写「3 killed」，
      而 ac-vic-kamikaze 汇总为「3 killed and 19 wounded」，差 1 人，并列不裁决。

  - id: ac-kami-vian
    title: 'Vice Admiral, Second in Command, British Pacific Fleet — May 9 Kamikaze Attacks (Operation Iceberg, Enclosure No. 3)'
    url: https://www.armouredcarriers.com/document-vice-admiral-british-pacific-fleet-kamikaze-attacks-may-9-hms-formidable-victorious
    type: archive
    tier: A
    role: [data, narrative]
    operator: armouredcarriers.com（转录 BPF 副司令 1945-05-14 报告 No. 0109/12/867）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      1945-05-09 防御性空战的上层汇总：五架低空目标、两波 Seafire 拦截、
      四架 Zeke 突入。给出 04-01 与 05-09 两次攻击的共同结论
      「敌方在中高空突不进来，现在改走低空，头两次都成功了」。

  - id: ac-pedestal-co
    title: 'Report from Commanding Officer, HMS Victorious — Operation Pedestal, 10-12 August 1942 (ADM 199/1242)'
    url: https://www.armouredcarriers.com/adm1991242-operation-pedestal-report-from-commanding-officer-hms-victorious
    type: archive
    tier: A
    role: [data, narrative]
    operator: armouredcarriers.com（转录舰长 H. C. Bovell 1942-08-15 报告）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      Pedestal 的当舰报告，含逐日航海日志、弹药消耗（4.5 in HE 1,056、
      20 mm 1,553、2-pdr 5,673）、以及对本舰 Fighter Direction Office 的
      自评附录（「现有装备是按 4 名军官 3 名士兵设计的」）。
      **关键旁证**：附录第 10 段提到「Victorious 的 Type 279 雷达」——
      这是 1942-08 本舰已装 279 的一手依据，与 navypedia 说 1943-04 才换 279 冲突。

  - id: ac-pedestal
    title: 'Operation Pedestal — HMS Indomitable & Victorious, August 10-12, 1942'
    url: https://www.armouredcarriers.com/operation-pedestal-august-10-12-1942
    type: website
    tier: C
    role: [data, narrative]
    operator: armouredcarriers.com
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      Pedestal 全景页，Victorious 的部分主要是：她被指定负责「低空掩护」
      （Fulmar 爬升率差，巡逻高度限 10,000 ft）、战斗机管制交由她的
      管制室与 Type 281 雷达统一指挥、Sirius 为她配属的防空巡洋舰、
      以及 08-12 两架 Re.2001 投下的两枚炸弹（一枚在甲板上弹开落海）。
      引用的雷达型号在同一页内自相矛盾（正文 281 / 脚注 79B），
      本站按「两说并列」处理，见 RESEARCH-NOTES。

  - id: ac-tf57
    title: 'Task Force 57 — British Pacific Fleet off Sakishima Gunto, Okinawa'
    url: https://www.armouredcarriers.com/task-force-57-british-pacific-fleet
    type: website
    tier: C
    role: [data, narrative]
    operator: armouredcarriers.com
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      TF 57 编成与作战背景。含 TF 57 战斗序列（1st Aircraft Carrier Squadron：
      Indomitable 旗舰、Victorious、Illustrious、Indefatigable、Formidable）、
      逐舰机群编成（Victorious：849 Sqn 14 Avenger、1834/1836 Sqn 37 Corsair、
      2 Walrus）、以及 BPF 的机尾识别字母（Victorious = P）
      与甲板识别字母（Victorious = V / S）。

  - id: wc-tungsten
    title: 'Admiralty Battle Summary No. 27 — Operation Tungsten (T.S.D. 759/44, November 1944)'
    url: https://wartimechapters.com/sources/yt-t22/
    type: official_publication
    tier: B
    role: [data, narrative]
    operator: Wartime Chapters（转录英国海军部战史处 1944-11 编 CB 3081(20)）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      Tungsten 的官方战术总结。本站采用的是它的**编成与计划**部分：
      两波各 21 架 Barracuda，每波 Victorious 出 12 架、Furious 出 9 架；
      两舰互换了中队，使每个受训机翼能整体上舰；Victorious 另出 Corsair 护航。
      口径提示：① 站方明说「是一份合成的官方总结，不是两舰签署的原始报告」；
      ② 「计划表不是执行日志」；③ 该页的 HMS Victorious 条目
      「16 × 4.5-in guns / 24 Barracuda + 21 Corsair」是本站可用的最直接编成数。

  - id: wc-victorious
    title: 'HMS Victorious — a connected ship profile (Wartime Chapters)'
    url: https://wartimechapters.com/ships/victorious/
    type: website
    tier: C
    role: [data, narrative]
    operator: Wartime Chapters
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >-
      专题站舰史页，价值在两个方面：① 直接引用 Tovey 1941 年电文
      （London Gazette p.4853，段落 32-39 与海军部脚注）中关于 05-24 夜袭的
      原始表述——「九架 Swordfish 起飞、八架攻击、第九架在云中失去联络」，
      以及海军部脚注的更正（真正导致 5-26 拦截的是皇家方舟号的舵机命中）；
      ② 1943-02-13 至 1943-08-19 借调美国太平洋舰队的时间窗，
      引自 IWM 照片目录 A 19682 的图注。
      本站**未取得** Tovey 电文原件（hmshood.org.uk 返回 403），
      因此该条按转述登记，tier 记 C 而非 A。
