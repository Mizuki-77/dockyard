# ============================================================================
# 状态切片：Victorious（胜利号，38）
# ----------------------------------------------------------------------------
# 切片只对某一艘船成立，所以放 data/slices/ 而不是 data/classes/。
# 切片边界必须落在 data/ships/victorious.yaml 里真实存在的时间窗上。
# 切片是「给人看的标签」，数据本身仍由 fact 的 valid 窗口决定。
#
# 本舰的一生可以粗分成「六段半」，与同级首舰的关键差别在于：
#   ① 1941 年它没挨过一发重弹（同级唯一），但也没打出过塔兰托那种战果；
#   ② 1943 年它被借调美国海军三个月，这一段的改装不是英国人做的；
#   ③ 1944 年它参加了对提尔皮茨的钨作战，此后一年在挪威海域反复扑空；
#   ④ 1945 年它挨了两次神风，两次都是「擦边」，两次都当场恢复作战；
#   ⑤ 它是本级唯一活到战后并做大规模重建的一艘，1958 年变成另一条船。
#
# 每一段都注明四项最容易变的东西：雷达、涂装、飞行甲板、防空配置。
# 查不到的写「未获取」，不拿相邻时段的色号或配置顶上。
# ============================================================================

ship: victorious

slices:
  - code: V0
    title: 订购与舾装（1937-1941）
    from: 1937-01-13
    to: 1941-03-28
    note: >-
      1937-01-13 向 Vickers-Armstrong（泰恩河畔 Walker 船厂）下单，
      船台号 11；1937-05-04 开工（naval-history 记 05-05，两说并列）；
      1939-09-14 下水，掷瓶人 Lady Inskip。
      下水十一天后二战爆发，舾装期被拉长到 20 个月。
      这一段在时间轴上没有切片，拖动滑块时下方是空白的；补上后切片范围
      与 fact 的实际时间范围对齐。

  - code: V1
    title: 建成与本土舰队（1941-03 至 1941-12）
    from: 1941-03-29
    to: 1941-12-31
    note: >-
      1941-03-29 服役，05-15 完工，造价 £4.05M。
      配置（建成态）：8 座双联 4.5 in + 6 座八联 pom-pom，**无 20 mm**
      （20 mm 要到 1941-10 才加 8 门）；雷达按 navypedia 记 Type 79B；
      飞行甲板可用长度 204.2 m；6 道拦阻索；1 部 BH-III 弹射器；
      机库系留位 33 个（同舰级）。
      战历：05-22 随 KGV 出击搜俾斯麦，**05-24 22:10 起飞 825 中队全部
      9 架 Swordfish，8 架攻击、1 架在云中失联，命中 1 雷（打在舯部装甲带上，
      损伤极小），此后即脱离，5-26 已在赴克莱德湾加油途中**；
      06 月 TRACER 运喷火去马耳他；07-30 EF 行动袭击 Kirkenes，
      一次损失 11 架 Albacore + 2 架 Fulmar；08-26 掩护首支赴阿尔汉格尔斯克
      的船团（Dervish）；09 月三次空袭 Tromso / Bodo；11 月起驻冰岛。
      涂装色号**未获取**。

  - code: V2
    title: 北极护航与地中海（1942-01 至 1942-11）
    from: 1942-01-01
    to: 1942-11-21
    note: >-
      这一段的关键词是「船团」。03-06 起为 PQ12 / QP8 提供掩护，
      03-09 对提尔皮茨发起未果的 Albacore 攻击（损失 2 架）；
      随后 PQ13/QP9、PQ14/QP10、PQ15/QP11、PQ16/QP12、PQ17/QP13 一路接着来。
      08-10 至 08-12 参加 Pedestal（编入 Force Z），本舰负责**低空掩护**
      （Fulmar 爬升率差，巡逻高度限 10,000 ft），战斗机管制由她的管制室
      统一指挥；08-12 两架 Re.2001 投下两枚炸弹，一枚在甲板上弹开落海。
      09-10 月在本土改装，**装了原型机 Aircraft Direction Room**；
      11-08 参加 Torch。
      配置变化：1942-08 时已装 Type 279（有一手报告为证），
      而非建成时的 79B——这是本舰雷达史上第一处与 navypedia 打架的地方。
      机群：1942-08 为 18 Fulmar + 6 Sea Hurricane + 14 Albacore；
      Pedestal 时全舰 40 架。
      涂装色号**未获取**。

  - code: V3
    title: 借调美国海军：USS Robin 时期（1942-11-22 至 1943-09-26）
    from: 1942-11-22
    to: 1943-09-26
    note: >-
      **本舰最有价值也最容易被写错的一段。**
      1942-11-23 在 Greenock 秘密补给，12-20 出航，载 40 架 Martlet 备用机；
      12-31 抵诺福克海军船厂。1943-01 的改装是美方做的，清单见当舰报告
      （ADM 199/534）：把尾部 round-down 填平延长甲板 10 ft、在艉悬下
      加一层平台装 8 门 20 mm（全舰 20 mm 增至 30 门）、拆前部探照灯
      换成 2 门 20 mm、加垂直绘图板、拆 Type 72 归航信标换美制 YE、
      加 3 台柴油消防泵与雾状灭火系统、加机库调度席、加 2 台电动密码机、
      修舰首风暴损伤。装 36 架 Martlet + 16 架 Avenger（共 52 架），
      全机改涂美制白星。
      02-03 离诺福克，02-11 过巴拿马（**「USS Robin」是此时对美军战列舰
      报出的无线电呼号，不是改名**），03-04 抵珍珠港再改装：
      在 1 号拦阻索之后加两道美制索、加双联与四联 40 mm、加空调、
      全舰改刷美制蓝灰。04-29 尼米兹登舰检阅。
      05-08 出港，05-17 与 Saratoga 会合；06 月编入 TG 36.3，
      作为「战斗机航母」带 58～60 架 Martlet/Wildcat（ac-pacops 记 60 架，
      ac-design 记「6 月装上 Saratoga 的 22 架 VF-5 F4F-4，战斗机总数 58 架」，
      两说并列），自己的 Avenger 借给 Saratoga；连续海上 28 天、
      航程 12,233 海里、614 架次、仅 8 次事故。
      07-31 离努美阿，08-09 过珍珠港，09-01 回诺福克拆掉全部美制设备，
      09-26 返抵克莱德河。
      借调窗口 1943-02-13 至 08-19（IWM 图注口径）；离英到返英是
      1942-11-23 至 1943-09-26（ac-pacops 口径）。两个窗口都写进单舰
      service.unit，不合并。
      涂装：美制蓝灰单色；甲板中央漆一个假升降机方框。

  - code: V4
    title: 本土改装与钨作战（1943-10 至 1944-06-11）
    from: 1943-09-27
    to: 1944-06-11
    note: >-
      1943-10-15 重返本土舰队；12 月起在 Liverpool 商船船厂改装至 1944-03。
      这一轮装了新雷达（navypedia 的「4/1943」条目：272、277、279、281B、
      282 ×6、293），并首次上 40 mm Bofors（四联 ×2 + 双联 ×2）。
      1944-03-28 与本土舰队各航母做 Tungsten 全装彩排；03-30 掩护 JW58。
      04-03 **钨作战**：与 Furious 分担两波各 21 架 Barracuda
      （每波本舰出 12 架、Furious 出 9 架，两舰互换中队使每个机群能整体上舰），
      本舰另出 Corsair 护航；损失 3 架 Barracuda，提尔皮茨修复花了一个多月。
      此后一连串扑空：04-24 Planet（天气取消）、05-15 Brawn（云层遮目标）、
      05-28 Tiger Claw（天气）、05-30 遭 U-957 声导鱼雷攻击未中、
      06 月 Lombard 击沉 1 艘扫雷舰与 1 艘商船。
      机群：Tungsten 时 46 架（28 Corsair + 21 Barracuda，四源口径有 45/46/49 三说）。
      涂装色号**未获取**。

  - code: V5
    title: 东方舰队与舵机故障（1944-06-12 至 1945-02-09）
    from: 1944-06-12
    to: 1945-02-09
    note: >-
      1944-06-12 与 Indomitable 经地中海赴锡兰，07 月抵 Colombo 归队。
      战历：07-25 Crimson（与 Illustrious 空袭 Sabang 机场）、
      08-23 Boomerang（为美军空袭苏门答腊提供海空救援）、
      08-29 Banquet（空袭 Padang / Indaroeng / Emmahaven，载 50 架）、
      09-18 Light（Sigli 铁路场，误击英潜艇 Spirit，无人伤亡）、
      10-17 Millet（Nicobar，损失 4 架、伤 5 架）。
      **这一段的主线其实是舵机**：08-20 首次卡舵（失控 30 分钟）、
      10-17 与 10-19 两次复发、11-16 在 Bombay 入坞修舵；
      1945-02-11 抵 Sydney 时因泊位优先给 Illustrious 而没有彻底检修。
      11-22 转隶英国太平洋舰队。
      机群：1944-11 起 36 Corsair + 19 Avenger + 2 Walrus。
      1945-01-04 Lentil、01-24 Meridian I、01-29 Meridian II。
      涂装色号**未获取**；能证实的只是「东方舰队涂装」这一制度存在，
      本舰是否改刷、色号为何，均未取得。

  - code: V6
    title: 太平洋：TF 57 / TF 37 与两次神风（1945-02-10 至 1945-08-31）
    from: 1945-02-10
    to: 1945-08-31
    note: >-
      1945-02-10 在 Sydney 编为 TF 113；03-14 在 Manus 演习时中央锅炉房
      15:25 起火爆炸，半小时后归队；03-25 抵 Ulithi 加入美军第五舰队改称 TF 57。
      机群（TF 57 编成表）：849 中队 14 Avenger + 1834/1836 中队 37 Corsair
      + 2 Walrus；机尾字母 P，甲板字母 S。
      **04-01 神风**：一架低空突入，Denny 大舵角甩开，日机右翼撞甲板左缘后
      翻入海中，炸弹在舷外 80 ft 水下爆炸；甲板 8 架飞机基本无损，2 名甲板人员受伤。
      **05-09 两次命中**：第一次 1656 撞在 B2 4.5 in 炮座与弹射器之间的甲板
      （Frame 31，3 in 与 1.5 in D 级甲板板交接处），炸开 12 ft 直径的洞、
      甲板下陷 3 in、B2 炮座炮组阵亡、前升降机一台电机失效、弹射器报废
      （余战未修复）；第二次 6 分钟后擦过左舷 Frame 135 落海，
      毁 1 道拦阻索、1 部 40 mm 指挥仪、4 架 Corsair。
      伤亡 3 死（另有 4 死一说）20 伤。
      **05-17 着舰事故**：一架受损 Corsair 高速撞甲板，撞断 6 号与 8 号索，
      撞上前甲板另一架 Corsair 后坠海，3 人死亡，甲板停摆近 3 小时，
      在空 20 架被迫降落到其它航母。
      06-05 抵 Sydney 修 6 天；06-16 转 TF 37；07-17 空袭东京区机场；
      07-24 在大阪击沉一艘护航航母；08-09 空袭北本州与北海道；
      08-31 参加 Sydney 胜利游行。

  - code: V7
    title: 战后运兵、预备役与重建（1945-09 至 1958-01-13）
    from: 1945-09-01
    to: 1958-01-13
    note: >-
      1945-09 自澳洲启航，10-27 抵英；随后三轮远东运兵，
      1947-10 第三轮结束后转预备役，1948 年编入本土舰队训练中队。
      1950 至 1957 年在船厂大规模重建（下文按日期记）：
      船体切开加长加宽加深（全长 228.3 → 238.0 m）、
      锅炉整批换 Foster Wheeler、两部 44 m 蒸汽弹射器、
      两部新式快速升降机、8.75° 斜角甲板、**机库净高 4.9 → 5.25 m**、
      发电容量翻倍、雷达全换（Type 984 三维对空 + 963 + 974 + 293Q + Mk 34 ×3）、
      武备全换（拆 4.5 in，改 6 座双联 76 mm/50 Mk 33）。
      涂装色号**未获取**。

  - code: V8
    title: 重建后服役与拆解（1958-01-14 至 1969-07-13）
    from: 1958-01-14
    to: 1969-07-13
    note: >-
      1958-01-14 重新服役，编入舰队至 1967 年；
      1961 年参加 Operation Vantage（科威特危机）；
      1963-08 加固斜角甲板以适配 Buccaneer。
      1966 年计划再改装，1967-11-11 在朴次茅斯改装期间舱室起火、死 1 名水兵；
      11-27 国防大臣 Healey 在下院宣布退役拆解。
      随后退入预备役、1969 年列入处置名单，同年售予 British Shipbreakers，
      **1969-07-13 拖抵 Faslane 拆解**。
      除籍日另有 1968-03（navypedia）一说，与 1969 年的出售/拖走
      不是同一事件，并列不裁决。
