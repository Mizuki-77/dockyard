  # ============================================================ 动力（1941 建成态）
  - field: propulsion.power.trial
    unit: hp
    value: 111164
    src: [ac-techdata]
    valid: { from: 1941-05-15 }
    confidence: B
    note: >-
      本站 ac-techdata 逐舰对照栏：Victorious 31 kt @ 111,164 shp，
      Formidable 30.6 kt @ 112,018 shp。这是**试航/实测**口径，
      与舰级的设计值 111,000 hp 只差 164 hp，属于不同来源的独立记录。

  - field: propulsion.speed.trial
    unit: kn
    value: 31
    src: [ac-techdata]
    valid: { from: 1941-05-15 }
    confidence: B
    note: >-
      同一条对照。另一说见 ac-design 的同句「Estimates placed her top speed
      at 31 knots」与「All three ships achieved maximum speeds under
      operational conditions of 30.5kts」——31 kt 是推算/试航上限，
      30.5 kt 是作战条件下的实测，两者不矛盾，分别记在本条与舰级文件。
      1943 年美方卡片只肯写「Maximum Practical - 30 knots」。

  - field: propulsion.range.max
    unit: nmi
    value: 10949
    src: [ac-vic-charcard]
    valid: { from: 1943-03-24 }
    confidence: A
    note: >-
      **换算值，非来源直给。** 1943 年美方卡片的续航表表头写的是
      「Endurance - miles」，是 statute mile（法定英里）不是海里：
      14 kt 时 12,600 miles。按 1 statute mile = 1.609344 km、
      1 nmi = 1.852 km 换算得 20,277.7 km ÷ 1.852 = 10,949 nmi。
      同表另两档：12 kt 12,400 mi → 10,775 nmi；10 kt 11,500 mi → 9,992 nmi。
      **与舰级的 9,250 nm @14 kt 仍差约 1,700 nm**，两说并列、不裁决：
      舰级那条来自 navypedia 的设计栏，本条的燃油基准（95% 容量 33,270 桶）
      写在卡片上，很可能是战时超载状态。引用时务必注明口径与换算。

  - field: propulsion.range.at_speed
    unit: kn
    value: 14
    src: [ac-vic-charcard]
    valid: { from: 1943-03-24 }
    confidence: A

  - field: propulsion.turning_diameter
    unit: m
    value: 1326
    src: [ac-vic-charcard]
    valid: { from: 1943-03-24 }
    confidence: A
    note: >-
      「20 degrees Rudder (Normal) 1450 yards」= 1,326 m。卡片原文附注
      「(Speed is not a factor)」——即该值不随航速变化，这在当时的实测里
      属于少见结论，照录。**同一次实测的另一个值**：满舵（hard-over）
      1,050 yards = 960 m；因为注册表这个字段是单值的，本文件只写正常舵角，
      满舵值记在这里不单列，免得被当成两源打架。ac-design 转引同一组数据，
      可交叉核对。

