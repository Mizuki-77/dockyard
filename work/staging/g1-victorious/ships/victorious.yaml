    src: [ac-vic-charcard]
    valid: { from: 1943-03-24 }
    confidence: A
    note: >-
      「Draught: Deep 31 feet. Normal 29 feet.」。本文件取正常排水量 29 ft =
      8.84 m；深载 31 ft = 9.45 m 另列一条。原文还有一句「Pitometer
      projection +4 feet」，是计程仪伸出船底的修正量，不计入吃水。

  - field: dimensions.draught.max
    unit: m
    value: 9.45
