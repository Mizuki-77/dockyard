      Waterline 96 feet.」三档并列。本字段取**去掉舷台后**的 107 ft = 32.6 m，
      它与舰级文件的 32.5 m 实质吻合，可横向比较。
      卡片另给「Overall 124 feet」= 37.8 m，**本站未采用**：
      该值比本级飞行甲板宽（95 ft）大出近 30 ft，卡片没有说明它含哪些悬出部，
      无法与任何已知的甲板宽/舷宽对上，因此不在 fact 里给这个数。

