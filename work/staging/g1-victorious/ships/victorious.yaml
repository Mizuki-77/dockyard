# ============================================================================
# 单舰：Victorious（胜利号航空母舰，舷号 38）
# ----------------------------------------------------------------------------
# 与 illustrious.yaml 同一套约定：
#   1) 建造/服役/结局等单舰事件
#   2) 单舰实测值与状态变化——与舰级设计值不是分歧，是两件事
#   3) 状态切片：随时间变化的字段，用 valid 窗口表达「当时是什么样」
#
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
# 本文件命中即覆盖舰级，**不算分歧**。
#
# 本舰是光辉级里改装次数最多、也是唯一活到 1969 年的一艘。它的技术数据
# 因此有两个「硬锚点」，本文件以这两个锚点为中心组织：
#
#   锚点一：1943-03-24 美国海军编成的 Ship Characteristics Card（RN 0314）。
#     这是一份**一手档案级**的规格摘要，含干舷、回转直径、装甲磅数、
#     全速段续航表、拦阻索数、弹药基数、七部雷达的型号与频率。
#     本文件凡是 1943 年前后的值，优先取它。
#   锚点二：navypedia 的「Victorious, 1958 modernization」栏。
#     1950-1958 年重建后的主尺度、排水量、动力、装甲与武备。
#
# 三条真实性说明：
#   ① 1941-05-24 对俾斯麦的空袭：本舰当日 22:10 起飞 825 中队全部 9 架
#      Swordfish，8 架攻击、1 架在云中失去联络，命中 1 雷（打在舯部装甲带上，
#      损伤极小）。**她 05-26 已脱离，不在最终战场**——本站
#      data/battles/last-battle.yaml 文首已就此留有更正记录，本文件不重犯。
#   ② 1943 年借调美国海军期间的「USS Robin」：Robin 是无线电呼号。
#      一手材料里只有「过巴拿马运河时对美军战列舰报出 USS Robin」这一处，
#      「改名 USS Robin」是战后史学与通俗叙述的说法。本文件写「借调美国
#      太平洋舰队、使用呼号 Robin」，不写「改名」。
#   ③ 1941 年的雷达型号：navypedia 记建成时装 Type 79B；
#      但本舰 1942-08 的 Pedestal 报告附录里写的是「Victorious 的 Type 279」。
#      两说并列，不裁决（见下 sensors.radar.installed）。
# ============================================================================

id: victorious
name:
  zh: 胜利
  en: Victorious
class: illustrious

open_ended_note: |
  本文件中 valid.to 留空的 fact，均为「至今为止仍成立的单舰事实」
  （结局、除籍、1958 年重建后的定案参数），不存在后续变化事件。
  时间窗成对出现的地方（如 1941 与 1958 两套主尺度、排水量、动力），
  两组窗口互不重叠，读的时候按日期取当前态即可。
  涂装一条例外：1943 年改刷美制蓝灰之后到 1969 年拆解之间的色号**未获取**，
  所以 to 也留空并在 note 里写明「下一个可证时点未知」。

