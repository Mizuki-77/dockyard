  - field: dimensions.freeboard
    unit: m
    value: 11.89
    src: [ac-vic-charcard]
    valid: { from: 1943-03-24 }
    confidence: A
    note: >-
      「Height: Top of Radar Mast 145 feet. Flight Deck 39 feet.」39 ft = 11.89 m，
      即到飞行甲板。与舰级的 11.6 m（38 ft）差 1 ft，是同一处的两种记载。

  - field: displacement.full
    unit: t
    value: 30481
    src: [ac-vic-charcard]
    valid: { from: 1943-03-24 }
    confidence: C
    note: >-
      「Tonnage (designed) 27,500 tons. Tonnage actual 30,000 tons.」——
      **吨制未注明**，本文件按长吨换算 30,000 × 1.01605 = 30,481 t。
      两处存疑：① 若原文是短吨则应为 27,216 t，若是公吨则为 30,000 t，
