    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      **本组唯一给出阿斯托里亚号伤亡明细与 1942-06/07 改装细节的来源，
      但它同时是最需要注意口径的一个。**
      原站 ussastoria.org 现已跳到域名停放页（返回 114 bytes 的
      「window.location.href="/lander"」跳转），只能走 Wayback 快照。
      本文件实际用到该站 6 个页面，全部经 2021-01-20 前后快照：
        · The_Pineapple_Fleet.html（1941-04/07 改装：1.1 英寸四联、桅顶截短、
          雷达基座、Measure 1 涂装）
        · Offensive_Preparations.html（1942-06-14 换舰长、Mk 3 火控雷达、
          Measure 21 涂装、1942-07 炮术演习）
        · Iron_Bottom_Sound.html（萨沃岛，**含 CAPT Greenman 战报的转录**）
        · Construction_Shakedown.html（建造：干船坞建造、捞瓶下水）
        · Lines_of_Advance.html（珍珠港至中途岛）
        · Home.php（站主页）
      关键原句（战报转录）：
      「Out of a total of 83 officers, 990 enlisted men, and one civilian
       newspaper correspondent, Joe J. Custer, on board, incomplete information
       now at hand indicated 61 officers, the news correspondent and 629 men
       were rescued. ... 20 officers known dead, 2 unaccounted for.
       138 enlisted men are known to be dead.」
      「ASTORIA FC [fire control] radar range gave 5640 yards.」
      口径提示：
      ① 站主是老兵后人与研究者，非官方机构；战报是**转录**不是影像，
         无法逐字核对原件，故凡出自此页的一手内容一律按 D 级站记 C
         （SCHEMA §2.1：「来源是 D 级主题站，confidence 填 C」）；
      ② 该站照片图注里的日期与档案号（NARA 80-G-xxxxx、NH xxxxx）
         可与 NHHC 藏品号交叉核对，这部分可信度高于其正文叙述。

  - id: navalenc-portland
    title: Portland class heavy cruisers (1931) — naval encyclopedia
    url: https://naval-encyclopedia.com/ww2/us/portland-class-heavy-cruisers-1931.php
    type: website
    tier: D
    role: [data, narrative]
    operator: naval-encyclopedia.com
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      本组唯一**独立于 navypedia** 给出波特兰级雷达与防空改装序列的来源，
      因此被用来交叉核对 navypedia 的改装表。关键原句：
      「The Portland class started the war without radar. They were however
       fitted in early 1942 with an SC, Mk 3, and Mk 4 radars. By May 1943,
       they received SK radars in addition.」
      「starting in early 1942: Four quadruple 1.1in were fitted abreast the
       bridge and close to the 5in guns. Later, twelve 20mm guns were added
       instead of the twin 0.5 in cal HMGs.」
      「The AA saw four extra quadruple and four twin 40 mm Bofors, plus 12
       supplementary 20 mm Oerlikon guns.」
      口径提示：
      ① 该页「autumn 1944 ... both were installed Mk 3, Mk 4 radars and
         Mk 8, Mk 18 radars」一句自身矛盾（同一句既说拆 Mk3/4 又说装
         Mk3/4），按 navypedia 的「- Mk 3, Mk 4; + Mk 8, Mk 18」处理；
      ② 该页把本级 40 mm 总数写成一串（四联 ×4 + 双联 ×4），
         与 navypedia 只记「4 x 4」不一致，两说并列；
      ③ 该站是新近（2021 起）建立的大型专题站，但其正文不逐句标出处，
         故与 navypedia 同级记 D，不作裁决依据。

  - id: navweaps-8in55-mk12-15
    title: 'USA 8"/55 (20.3 cm) Marks 12 and 15 — NavWeaps'
    url: https://www.navweaps.com/Weapons/WNUS_8-55_mk12-15.php
    type: website
    tier: C
    role: [data]
    operator: NavWeaps（Tony DiGiulian 编）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      **用来证明「阿斯托里亚与波特兰的主炮从没装过 Mk 12/15」这一否定命题。**
      关键原句（三句连读才能得出这个结论）：
      「Mark 12: Tuscaloosa (CA-37) sub-class, Wichita (CA-45) and
       Baltimore (CA-68)」
      「Mark 15: All other Baltimore class and Oregon City (CA-122) class」
      「Minneapolis (CA-36) was regunned with Mark 15 Mod 1 in 1945」
      另注「The Tuscaloosa sub-class consisted of Tuscaloosa (CA-37),
      San Francisco (CA-38), Quincy (CA-39) and Vincennes (CA-44).」
      ——即 Mk 12/15 的装舰名单里，新奥尔良级只有 CA-37/38/39/44 这四艘，
      CA-32/34/36 一艘都不在其中；CA-36 明尼阿波利斯是 1945 年单独换装的，
      而 CA-34 阿斯托里亚 1942-08 已沉没。
      因此「中途岛时两舰主炮是 Mk 9 系列」有正面（navweaps-8in55-mk9）与
      反面（本条）双重依据。
      口径提示：本页只给炮本身（含药室 79.6 dm3、初速与 Mk 9 系列同表另列），
      炮座数据在 navweaps-8in55-mk9 那一页。
