sources:
  - id: navweaps-8in55-mk9
    title: USA 8"/55 (20.3 cm) Marks 9, 10, 11, 13 and 14 — NavWeaps
    url: https://www.navweaps.com/Weapons/WNUS_8-55_mk9.php
    type: website
    tier: C
    role: [data]
    operator: NavWeaps（Tony DiGiulian 编）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      单页覆盖 8"/55 的五个 Mark（9/10/11/13/14），是「Astoria 中途岛时装的是
      Mk 9 不是 Mk 14」这条结论的唯一直接依据。关键原句：
      「Mark 9 was the original design and was used on ships built in the 1920s」
      「The Mark 14 was used for most regunnings during World War II」。
      炮座数据同页，且明分 twin mount / triple mount / triple turret 三档，
      其中「Triple Turrets: New Orleans (CA-32, 34 and 36 only) (3)」正是本组
      阿斯托里亚号那一档，与波特兰号的「Triple Mounts」在重量上差 45 吨。
      **口径提示**：同页「Ship Class Used On」一行写
      「New Orleans (CA-32, 34 and 36 only)」，不要理解成整级 7 艘。

  - id: navweaps-oob-midway
    title: Battle of Midway, 4-7 June 1942 — Orders of Battle（NavWeaps Order of Battle Archive）
    url: https://www.navweaps.com/index_oob/OOB_WWII_Pacific/OOB_WWII_Midway.htm
    type: website
    tier: D
    role: [data]
    operator: NavWeaps（Order of Battle 档案）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      **TG 17.2 编成的直接来源**，实测 178,648 bytes。原文块：
      「Task Group 17.2 Cruiser Group / RA William Ward Smith /
       Position: ComCruTF-17 / Notes: USNA09 [95] /
       USS Astoria (CA-34) (flagship)
       Commanding officer: Capt. Francis Worth Scanland (Notes: USN09 [216].) /
       USS Portland (CA-33)
       Commanding officer: Capt. Laurance T. DuBose」。
      任务书里「RA William W. Smith / 阿斯托里亚为旗舰 / 两舰同属 17.2」
      三点由此页全部坐实，**无需修正**。
      口径提示：它只给编成与舰长姓名，**不给任何装备、雷达或排水量数据**；
      舰长姓名后的「USN09 [216]」一类方括号是编者标注的毕业年级与档案号，
      不是舰上职务。

  - id: savo-nwc-3
    title: >
      The Battle of Savo Island, August 9th, 1942: Strategical and Tactical
      Analysis, Part I — Chapter 3（Allied Arrangements）
    url: https://www.ibiblio.org/hyperwar/USN/rep/Savo/NWC/NWC-Savo-3.html
    type: document
    tier: C
    role: [data, narrative]
    operator: Naval War College（Richard W. Bates, 1950），HyperWar 转录
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >
      **它是本组唯一给出「1942-08 瓜岛登陆时波特兰号到底在哪一群」的来源。**
      该页兵力编成表原文（节选）：
      「(b) TG 61.2, Amphibious Force (TF 62 plus SW Pac TF 44)
       (1) TG 62.1, Transport Group XRAY ...
       (2) TG 62.2, Transport Group YOKE ...
       (3) TG 62.3 Fire Support Group LOVE
       Quincy, Vincennes, Astoria, Hull, Dewey, Ellet, Wilson 4 DD
       (4) TG S62.4 Fire Support Group MIKE
       San Juan 1 CL (AA) / Monssen, Buchanan 2 DD」
      而在它上面的另一段：
      「(2) TG 61.1.2 (Pacific Fleet Task Force 16)
       Enterprise (38 VF, 36 VD, 10 VT) 1 CV
       North Carolina 1 BB / Portland 1 CA / Atlanta 1 CL (AA)
       Balch, Maury, Gwin, Benham, Grayson 5 DD」
      ——**波特兰号在 TG 61.1.2（企业号群），不在 TG 62.3，所以萨沃岛夜战里
      没有她。** 这条推翻了「两舰中途岛同属 17.2，所以瓜岛也在一起」的想当然。
      口径提示：该报告是战后（1950）海军战争学院的分析著作，
      属权威二次文献记 C，不是一手战报；本章其余内容（航空搜索、日军编成）
      与本组两舰无直接关系，未使用。

  - id: navypedia-neworleans
    title: New Orleans class — Navypedia（CA32/34/36 与 CA37-44 分组同页）
    url: https://www.navypedia.org/ships/usa/us_cr_new_orleans.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Navypedia
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      本组主尺度、排水量、动力、装甲、武备的主要骨架来源。**它的价值在于
      把本级 7 艘按装甲与主炮分成三组写**，这是「阿斯托里亚不是和昆西一样」
      这条判据的来源。关键原句：
      「CA32, 34, 36: belt: 127 - 76 ... barbettes: 127 ...
       CA37, 38: ... barbettes: 152 ... CA39, 44: ... barbettes: 133」
      「Armament | CA32, 34, 36: 3 x 3 - 203/55 Mk 9.11.13/14」
      口径提示：
      ① 船舶表的服役日把 Astoria 写成「1.6.1934」，与 DANFS/navsource 的
         1934-04-28 冲突，判为本页笔误（同页下水日 16.12.1933 与另两源一致）；
      ② 装甲与武备全部是级表，不是某一天的实况；逐期变化看 Modernizations 段；
      ③ 「CA37-39, 44: 3 x 3 - 203/55 Mk 12.15」里的 12/15 是另两组的炮，
         **不要填给 CA32/34/36**。

