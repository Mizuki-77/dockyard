  - id: danfs-astoria
    title: Astoria II (CA-34) — Dictionary of American Naval Fighting Ships
    url: https://www.ibiblio.org/hyperwar/USN/ships/danfs/CA/ca34.html
    type: official_publication
    tier: B
    role: [data, narrative]
    operator: Naval History Division, Office of the Chief of Naval Operations
              （HyperWar 转录，Patrick Clancey 编）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >
      **本文件的 URL 是 ibiblio 的转录版，不是 history.navy.mil 原站。**
      原因：history.navy.mil 在本机 TLS 握手阶段即被断开（Python urllib
      报 SSL UNEXPECTED_EOF，curl 报 schannel failed to receive handshake，
      Invoke-WebRequest 报「基础连接已经关闭」），三次尝试均不通，故改用
      HyperWar 的官方转录本。转录本页脚写明「Transcribed and formatted for
      HTML by Patrick Clancey」，内容与 NHHC 版一致。
      价值：本舰全生涯叙事的最完整单一来源，含中途岛逐时刻、萨沃岛逐分钟、
      舰长姓名、伤亡与弃舰过程。舰首数据行
      「(CA-34: dp. 9.950; l. 588'0"; b. 61'9" (l.); dr. 19'5" (mean);
       s. 32.7 k.; cpl. 899; a. 9 8", 8 5", 2 3-pdrs., 8 .50-cal. mg.;
       cl. New Orleans)」是骨架字段的主要来源。
      口径提示：DANFS 不给伤亡总数，也不给雷达型号——这两项要从别处找。

