# ============================================================================
# 武器正文 —— Blackburn Skua（B-24）
#
# 主线四条，全部落在原文上：
#   1. 它是英国舰队航空兵第一架单翼机（1938 年末服役），也是开战时唯一在役的单翼机；
#   2. 它是「战斗机 + 俯冲轰炸机」两用设计，而这两个角色本身不兼容；
#   3. 1940-04-10  Bergen，它击沉了柯尼斯堡号 —— 第一艘被空袭击沉的主力作战舰；
#   4. 1940-06-13 特隆赫姆，15 架出动损失 8 架，这是它作为战斗机型的终局。
#
# 参数来源分两路：性能数字取 naval-history 在本舰 1939-09 编制处的机型说明，
# 结构/规格取 historyofwar 的 Specification (Mk. II) 表。两处个别数字不一致
# （最大速度对应高度 6,700 ft vs 6,500 ft），正文并列。
# ============================================================================
weapon: skua
updated: 2026-11-22

intro:
  lead:
    zh: >-
      Blackburn Skua 是英国舰队航空兵第一架进入服役的单翼机，
      1938 年末随 800 与 803 中队登上皇家方舟号。
      它被要求同时当战斗机和俯冲轰炸机用，而设计者自己也知道这两个角色并不兼容。
      它留下两个「第一」：1939-09-26 打下第一架被确认击落的德国飞机；
      1940-04-10 在卑尔根击沉柯尼斯堡号，这是历史上第一艘被空袭击沉的主力作战舰。
      两个月后，它在特隆赫姆一天损失了 15 架里的 8 架。
    en: >-
      The Blackburn Skua was the first monoplane to enter service with the Fleet Air Arm,
      joining Nos. 800 and 803 Squadrons aboard HMS Ark Royal late in 1938. It was
      required to serve as both a fighter and a dive bomber, roles its designers knew to
      be not entirely compatible. It left two firsts behind: on 26 September 1939 it
      shot down the first confirmed German aircraft, and on 10 April 1940 at Bergen it
      sank the Konigsberg, the first major operational warship ever sunk by air attack.
      Two months later, at Trondheim, it lost eight of fifteen aircraft in a single day.
  paragraphs:
    - heading: 它是「两用」，而两用本身就是它的问题
      text:
        zh: >-
          historyofwar 把这件事写成三个层层叠加的原因，不是一句「设计不好」。
          第一层是体制：Skua 是按空军部 O.27/34 号规范设计的，
          那份规范发布时海军还没有收回自己航空兵的管辖权；
          「1939 年舰队航空兵飞机质量差，常被归咎于皇家空军掌管海军航空的时期」。
          第二层是当时的判断：「战前那些年人们相信，正在研制的新一代高性能战斗机
          无法从航空母舰上使用」；同时也相信「海军飞机需要两名乘员
          才能应付海上导航的复杂性」—— 而这必然增加飞机重量。
          第三层是传统：「还有一种多用途飞机的传统，目的是充分利用
          每艘航母有限的容量。就 Skua 而言，它被设计成既当战斗机又当俯冲轰炸机，
          而这两个角色并不完全兼容。」
        en: >-
          historyofwar sets this out as three stacked causes rather than a single verdict
          of bad design. The first is institutional: the Skua was designed to Air
          Ministry Specification O.27/34, issued before the Navy had regained control of
          its own aircraft, and "the poor quality of Fleet Air Arm aircraft in 1939 had
          often been blamed on the period of RAF control of naval aviation". The second is
          contemporary belief: "In the pre-war years it was believed that the new
          generation of high performance fighters then under development would not be
          able to operate from aircraft carriers", and also that "naval aircraft needed
          two crewmen to cope with the complexity of navigation over water, inevitably
          increasing the weight of the aircraft". The third is tradition: "there was a
          tradition of multi-purpose aircraft, designed to make the best use of the
          limited capacity of each aircraft carrier. In the case of the Skua it was
          designed to perform as both a fighter and a dive bomber, not entirely
          compatible roles."
      src: [historyofwar-skua]
    - heading: 它是技术进步，但一服役就已经落后
      text:
        zh: >-
          这两句话必须一起写，不然会读成纯粹的失败品。
          原型机 1937-02-09 首飞，在 Blackburn 接到 190 架订单之后六个月。
          它「相对当时装备舰队航空兵的蒙布双翼机是一次显著进步：
          金属结构、襟翼、变距螺旋桨、可收放起落架，
          这些都是英国舰载机上的第一次」。
          然后是同一位作者紧接着的判断：「即使在这个很早的日期，
          它作为战斗机已经无可救药地过时了。」
          比较是具体的：它替换的 Hawker Nimrod 能飞 193 mph，
          Skua 只比它快 32 mph，而且最高速度还是在更低的高度上取得的；
          同一时期皇家空军正在引入最高速度 362 mph 的 Spitfire Mk I。
          结论也写得很直：「Skua 会被 Bf 109 远远压制，
          而且比 1939 年在用的德国轰炸机还慢。」
        en: >-
          These two statements have to be written together or the type reads as a pure
          failure. The prototype first flew on 9 February 1937, six months after Blackburn
          had received an order for 190 aircraft, and it was "a significant advance on the
          fabric covered biplanes that then equipped the Fleet Air Arm, featuring metal
          construction, flaps, a variable pitch propeller and retractable landing gear,
          all firsts for a British deck landing naval aircraft". Then comes the same
          author's immediate verdict: "Even at this early date it was hopelessly outdated
          as a fighter aircraft." The comparison is specific: the Hawker Nimrod it
          replaced could reach 193 mph and the Skua was only 32 mph faster, achieving its
          top speed at a lower altitude, while the RAF was introducing the Spitfire Mk I
          at 362 mph. The conclusion is equally blunt: the Skua "would be very badly
          outclassed by the Messerschmitt Bf 109, and was slower than the German bombers
          in use in 1939".
      src: [historyofwar-skua]
    - heading: 两个互相矛盾的最大速度数字，来自两个来源
      text:
        zh: >-
          这一条按规矩并列，不裁决。naval-history 在皇家方舟号 1939 年 9 月
          编制说明里给的机型数据是：最大速度 225 mph（6,700 英尺高度）、
          204 mph（海平面），最大航程约 760 英里；
          武器为翼内四挺 .303 英寸 Browning 机枪、每挺 600 发，
          后座一挺 .303 英寸 Lewis 机枪（后座枪手「只要可能就会把这挺换成
          Vickers K 机枪，因为后者更可靠、射速更高」）；挂弹量 500 磅。
          historyofwar 的 Mk. II 规格表给的是：最大速度 225 mph（6,500 英尺）、
          巡航速度 165 mph（15,000 英尺）、升限 20,200 英尺、航程 760 英里，
          武器同样是翼内四挺 .303 英寸机枪加后座一挺 Lewis，
          挂弹为机身上一枚 500 磅炸弹、翼下八枚 30 磅练习弹。
          两个来源的最大速度都是 225 mph，只是标注的高度差 200 英尺；
          本页把两个高度都写出来，不改写成单一数字。
        en: >-
          This is set out side by side, without adjudication. Naval-history's type note in
          the ship's September 1939 establishment gives a maximum speed of 225 mph at
          6,700 ft and 204 mph at sea level, a maximum range of approximately 760 miles,
          four Browning .303 inch machine guns in the wings with 600 rounds per gun, one
          Lewis .303 inch machine gun in the rear cockpit (the gunner replacing it with a
          Vickers K whenever possible, "which was more reliable and had a higher rate of
          fire"), and a bomb load of 500 lb. historyofwar's Mk. II specification gives
          225 mph at 6,500 ft, a cruising speed of 165 mph at 15,000 ft, a ceiling of
          20,200 ft and a range of 760 miles, with the same four wing guns and rear Lewis
          and a bomb load of one 500 lb bomb on the fuselage plus eight 30 lb practice
          bombs under the wings. Both sources give 225 mph; the quoted heights differ by
          200 ft. Both heights are recorded here rather than reduced to a single figure.
      src: [naval-history-arkroyal, historyofwar-skua]
    - heading: 它最出名的战果不是在皇家方舟号上取得的
      text:
        zh: >-
          这一点必须写清楚，因为很容易被写成「皇家方舟号的 Skua 击沉了柯尼斯堡号」。
          事实是：1940 年 4 月，皇家方舟号被调往地中海时，
          800 与 803 两个中队被留在了岸上，驻奥克尼群岛的 Hatston。
          historyofwar 的原文是：「到 1940 年 4 月，800 与 803 两个中队都已驻在
          奥克尼的 Hatston，此前皇家方舟号被派往地中海。4 月 10 日，
          两个中队的二十架飞机攻击并击沉了卑尔根的德国巡洋舰柯尼斯堡号。
          这是主力作战舰第一次被飞机击沉。」
          historyofwar 的另一处（本舰页）给了更细的战果：
          「命中三枚，引起内部爆炸并点燃了柯尼斯堡号；随后另一次爆炸把它炸成两截。
          只损失一架 Skua。」所以战果属于这两个中队的 Skua，
          但起飞地点是岸上机场，不是本舰甲板。
        en: >-
          This has to be stated plainly, because it is easily written as "Ark Royal's
          Skuas sank the Konigsberg". The fact is that in April 1940, when the ship was
          sent to the Mediterranean, Nos. 800 and 803 Squadrons were left behind ashore at
          Hatston in the Orkneys. historyofwar's words are: "By April 1940 both Nos. 800
          and 803 squadrons were based at Hatston on Orkney, after the Ark Royal was sent
          to the Mediterranean. On 10 April twenty aircraft from the two squadrons
          attacked and sank the German cruiser Konigsberg at Bergen. This was the first
          time a major operational warship had been sunk by aircraft." Its ship page adds
          the detail of the result: "Three hits were scored, causing internal explosions
          and setting the Konigsberg on fire. She was then destroyed by another explosion,
          which split her in half. Only one Skua was lost." The credit therefore belongs
          to these two squadrons' Skuas, but they flew from a shore airfield, not from
          this ship's deck.
      src: [historyofwar-skua, historyofwar-arkroyal]
    - heading: 击沉巡洋舰之后，它作为战斗机就走到头了
      text:
        zh: >-
          historyofwar 的叙述把这次成功直接当作转折点：
          「这次成功同时也是 Skua 蜜月期的结束。
          两个中队在 4 月 21 日对纳尔维克的攻击中损失惨重。
          6 月 12 日，在光荣号损失之后，它们被派去特隆赫姆攻击沙恩霍斯特号与格奈森瑙号。
          在那里它们撞上了德国战斗机和猛烈的高射炮火。
          十五架中有八架在攻击中损失。」
          然后是一句解释它为什么还得继续飞的话：
          「由于缺乏任何替代机型，Skua 不得不留在服役中直到 1941 年 8 月，
          才由 Fairey Fulmar 和 Hawker Sea Hurricane 取代。」
          也就是说：它不是因为打得不好而被撤，是因为有了替代品才被撤。
        en: >-
          historyofwar's narrative makes the success itself the turning point: "This
          success was also the end of the honeymoon period for the Skua. The squadrons
          suffered heavy losses in an attack on Narvik on 21 April. On 12 June, in the
          aftermath of the loss of HMS Glorious they were sent to attack the Scharnhorst
          and Gneisenau at Trondheim. There they ran into German fighters and heavy flak.
          Eight out of fifteen aircraft were lost in the attack." Then comes the sentence
          that explains why it kept flying: "A lack of any alternative aircraft meant that
          the Skua had to stay in service until August 1941, when it was replaced by the
          Fairey Fulmer and the Hawker Sea Hurricane." It was not withdrawn because it
          fought badly; it was withdrawn when there was finally something to replace it.
      src: [historyofwar-skua]
history:
  - id: origin
    title: { zh: 设计、首飞与服役, en: Design, first flight and service entry }
    range: { from: 1934, to: 1938-12 }
    lead:
      zh: >-
        一份发布在海军还没有航空兵管辖权的时期的规范，决定了它要干两件不兼容的事。
      en: >-
        A specification issued while the Navy did not yet control its own aircraft
        decided that it should do two incompatible jobs.
    events:
      - date: 1934
        text:
          zh: >-
            按空军部 O.27/34 号规范设计，要求一机兼任战斗机与俯冲轰炸机。
            该规范发布于海军收回航空兵管辖权之前。
          en: >-
            Designed to Air Ministry Specification O.27/34, which called for one aircraft
            to serve as both fighter and dive bomber. The specification was issued before
            the Navy regained control of its own aircraft.
        src: [historyofwar-skua]
      - date: 1937-02-09
        text:
          zh: >-
            原型机首飞，此时 Blackburn 已接到 190 架订单六个月。
            机上首次在英国舰载机上采用金属结构、襟翼、变距螺旋桨与可收放起落架。
          en: >-
            The prototype first flew, six months after Blackburn had received an order for
            190 aircraft. It introduced metal construction, flaps, a variable pitch
            propeller and retractable landing gear - all firsts for a British deck landing
            naval aircraft.
        src: [historyofwar-skua]
      - date: 1938-12
        text:
          zh: >-
            1938 年末随 800 与 803 中队进入服役，两中队均编给皇家方舟号，
            替换原有的 Hawker Nimrod 与 Osprey。它是舰队航空兵第一架服役的单翼机，
            开战时仍是舰队里唯一的单翼机。
          en: >-
            Entered service late in 1938 with Nos. 800 and 803 Squadrons, both allocated
            to HMS Ark Royal, replacing Hawker Nimrods and Ospreys. It was the first
            monoplane to enter service with the Fleet Air Arm and was still the only
            monoplane serving with the fleet at the start of the war.
        src: [historyofwar-skua]
  - id: firstblood
    title: { zh: 第一次击落, en: The first kill }
    range: { from: 1939-09, to: 1939-09 }
    lead:
      zh: >-
        1939-09-26，一架 803 中队的 Skua 打下了第一架被确认击落的德国飞机。
      en: >-
        On 26 September 1939 a Skua of 803 Squadron shot down the first confirmed German
        aircraft.
    events:
      - date: 1939-09-26
        text:
          zh: >-
            当日在 57-36N 03-18E 附近发现三架德国空军 Do 18D 水上飞机
            （Kustenstaffel 1./KuGr 506，驻叙尔特岛 Harnum See）。
            皇家方舟号先派出 803 中队 A7A、A7B、A7K 三架拦截，11:30 又派出
            A7C、A7F、A7M 三架增援。A7C（飞行员 Lt B S McEwen，观察员
            代理 PO B M Seymour）击落一架 Do 18，该机落水后四名乘员
            被驱逐舰 SOMALI 救起。
          en: >-
            Three Luftwaffe Do 18D flying boats of Kustenstaffel 1./KuGr 506 from Harnum
            See on Sylt were sighted near 57-36N 03-18E. Ark Royal first flew off three
            Skuas of 803 Squadron, A7A, A7B and A7K, to intercept, and at 1130 sent three
            more, A7C, A7F and A7M. A7C, piloted by Lt B S McEwen with acting PO B M
            Seymour as observer, shot one Dornier down; it landed on the sea and its four
            crewmen were picked up by the destroyer SOMALI.
        src: [naval-history-arkroyal]
      - date: 1939-09-26
        text:
          zh: >-
            这一条要并列两说，因为「第一架」这个说法本身有争议。
            naval-history 在同一段的方括号注里写明：这次击落「常被称作
            二战中英国飞机的第一个战果，但事实上第一个是 1939-09-20
            皇家空军 88 中队一架 Fairey Battle 上的观察员/机枪手
            Sgt F.A. Letchford 取得的。只是 Letchford 的战果没有立即被确认；
            所以 Lt McEwen 这次是第一个被确认的」。
            historyofwar 则直接写「一架皇家方舟号 803 中队的 Skua 成为
            二战中第一架击落德国飞机的英国战斗机」，未提 Letchford。
            两说并列，本站不裁决。
          en: >-
            Two accounts have to stand together here, because "the first" is itself
            contested. In a bracketed note in the same passage naval-history records that
            this shooting down "is often cited as the first kill by a British Aircraft in
            World War II, but in fact the first was by Sgt F.A. Letchford, an
            observer/gunner in a Fairy Battle Bomber of 88 Sqd RAF on the 20/9/39. But
            Sgt Letchford's claim was not confirmed straight away; so Lt McEwen's was the
            first confirmed." historyofwar states without qualification that "A Skua of
            No. 803 squadron of HMS Ark Royal became the first British fighter to shoot
            down a German aircraft during the Second World War", and does not mention
            Letchford. Both are recorded without adjudication.
        src: [naval-history-arkroyal, historyofwar-skua]
  - id: konigsberg
    title: { zh: 柯尼斯堡号与特隆赫姆, en: Konigsberg and Trondheim }
    range: { from: 1940-04, to: 1940-06 }
    lead:
      zh: >-
        两个月里它先做成了第一件没人做成过的事，然后一天损失了半个中队。
      en: >-
        In two months it first did something nobody had done, then lost half a squadron
        in a day.
    events:
      - date: 1940-04-10
        text:
          zh: >-
            800 与 803 中队共二十架 Skua 从奥克尼的 Hatston 起飞，
            攻击卑尔根的德国巡洋舰柯尼斯堡号并将其击沉，
            这是主力作战舰第一次被飞机击沉。命中三枚，引起内部爆炸并点燃该舰，
            随后另一次爆炸把它炸成两截；只损失一架 Skua。
            两个中队当时已留在岸上，因为本舰被调往地中海。
          en: >-
            Twenty Skuas of Nos. 800 and 803 Squadrons flew from Hatston in the Orkneys,
            attacked the German cruiser Konigsberg at Bergen and sank her - the first time
            a major operational warship had been sunk by aircraft. Three hits caused
            internal explosions and set her on fire, and another explosion split her in
            two; only one Skua was lost. Both squadrons were ashore at the time because
            the ship had been sent to the Mediterranean.
        src: [historyofwar-skua, historyofwar-arkroyal]
      - date: 1940-04-21
        text:
          zh: >-
            两个中队在 4 月 21 日对纳尔维克的攻击中损失惨重。
            historyofwar 把这次损失与 4 月 10 日的成功并列叙述，
            作为「蜜月期结束」的标志。该页没有给出当日的损失数字，本站不补。
          en: >-
            Both squadrons suffered heavy losses in an attack on Narvik on 21 April.
            historyofwar narrates this loss alongside the success of 10 April as marking
            the end of the honeymoon period; it gives no figure for the day's losses, and
            none is supplied here.
        src: [historyofwar-skua]
      - date: 1940-06-13
        text:
          zh: >-
            这一条先说一处日期口径差异：historyofwar 记这次攻击发生在「6 月 12 日」，
            naval-history 记的是 6 月 13 日 00:02 起飞 —— 午夜刚过。
            起飞时刻落在 13 日凌晨，所以两说实质指向同一次夜间出动，本站按
            naval-history 的逐刻记录取 6 月 13 日，并在此并列另一说。
            00:02 本舰起飞 15 架 Skua（800 中队 6A、6C、6F、6G、6H、6K，
            803 中队 7A、7B、7C、7F、7G、7L、7P、7Q、7R），
            各挂一枚 500 磅半穿甲弹，攻击特隆赫姆港内的敌舰。
            803 中队由 Lt Cdr J Casson（7A）率领，分三个三机小队在前；
            800 中队由 Capt R J Partridge RM（6A）率领，两个三机小队在后。
            原定的 254 中队 Blenheim IV 战斗机因计算航程出错未能按时到达会合点，
            Skua 因时间压力在没有护航的情况下进入。
            22 中队 4 架 Beaufort 对 Vaernes 机场的攻击反而起了反作用：
            为保卫机场紧急起飞的 II./JG77 的 Bf 109 与 I./ZG76 的 Me 110
            正好占据了攻击 Skua 的位置。
            803 中队后尾小队 6F、6G、6H 首先被击落。
          en: >-
            One date discrepancy first: historyofwar records this attack as 12 June,
            while naval-history records take-off at 0002 on 13 June - just past midnight.
            The launch falls in the small hours of the 13th, so the two accounts point at
            the same night sortie; this article follows naval-history's timed record and
            uses 13 June, with the other date recorded here.
            At 0002 the ship flew off fifteen Skuas - 6A, 6C, 6F, 6G, 6H and 6K of 800
            Squadron and 7A, 7B, 7C, 7F, 7G, 7L, 7P, 7Q and 7R of 803 - each armed with
            one 500 lb SAP bomb, to attack enemy warships in Trondheim harbour. 803
            Squadron led in three flights of three under Lt Cdr J Casson in 7A, with 800
            Squadron following in two flights of three under Capt R J Partridge RM in 6A.
            The Blenheims of 254 Squadron failed to reach the rendezvous on time through
            an error in calculating the range, so the Skuas went in unescorted under time
            pressure. The attack by four Beauforts of 22 Squadron on Vaernes aerodrome had
            the opposite effect to the one intended: the Bf 109s of II./JG77 and Me 110s
            of I./ZG76 scrambled to defend the airfield were perfectly placed to attack
            the Skuas before they reached their target. The rear section of 803 Squadron,
            6F, 6G and 6H, went down first.
        src: [naval-history-arkroyal]
      - date: 1940-06-13
        text:
          zh: >-
            损失清单：6G（L3028，Mid L H Gallagher）、6H（L3047，Mid D T R Martin）、
            6F（L3000，Lt G E D Finch-Noyes）先被 Bf 109 击落；
            随后 6A（L2995，Capt R J Partridge RM）、7A（L2896，Lt Cdr J Casson）
            被 Bf 109 击落，7F（L2963，Lt C H Filmer）、7L（L2992，Sub Lt J A Harris）、
            7Q（L2955，Sub Lt R E Bartlett）被 Me 110 击落。
            共八架，15 架出动损失 8 架。
            战果方面：航空母舰部队司令（VA Aircraft Carriers）在攻击后分析中
            认为取得两枚命中，但实际上只有一枚命中，而且那枚没有爆炸。
            返航的七架（800 中队 2 架、803 中队 5 架）于 03:45 前全部降落。
            本舰全程未打破无线电静默，返航机组是靠舰上旋转信标定位飞回来的。
          en: >-
            The losses: 6G (L3028, Mid L H Gallagher), 6H (L3047, Mid D T R Martin) and
            6F (L3000, Lt G E D Finch-Noyes) were shot down first by Bf 109s; then 6A
            (L2995, Capt R J Partridge RM) and 7A (L2896, Lt Cdr J Casson) by Bf 109s, and
            7F (L2963, Lt C H Filmer), 7L (L2992, Sub Lt J A Harris) and 7Q (L2955, Sub Lt
            R E Bartlett) by Me 110s. Eight aircraft out of fifteen. On the result, the VA
            Aircraft Carriers considered after the attack that two hits had been achieved,
            but in fact only one hit had been achieved and that failed to explode. The
            seven that returned, two from 800 Squadron and five from 803, had all landed by
            0345. The ship never broke radio silence, and the returning crews navigated
            back by taking a fix on her revolving beacon.
        src: [naval-history-arkroyal]
      - date: 1940-06-13
        text:
          zh: >-
            这一天的代价被记录为超出飞机数量本身：高损失率影响了全舰士气，
            「尤其是那些策划这次任务的人。总损失几乎相当于一整个中队，
            实际上把舰队航空兵两个首屈一指的战斗机中队削减成了
            一小撮有经验的飞行员。」
          en: >-
            The cost of the day was recorded as more than airframes: the high loss rate
            affected the morale of the entire ship's company, "but particularly affected
            were those that had planned the mission. The total losses amounted to almost
            an entire squadron, and effectively reduced the FAA's two premiere fighter
            squadrons to a small nucleus of experienced flyers."
        src: [naval-history-arkroyal]
