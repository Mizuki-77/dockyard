sources:
  - id: navweaps-vickers-50
    title: 'Britain 0.50"/62 (12.7 mm) MG Mark III'
    url: https://www.navweaps.com/Weapons/WNBR_5-62_mk3.php
    type: website
    tier: D
    role: [data, narrative]
    operator: NavWeaps（Tony DiGiulian 编辑）
    lang: en
    access: proxy
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      维克斯 .50 四联高射机枪的完整数据页。

      **URL 更正**：任务下发的 http://www.navweaps.com/Weapons/WNBR_05_50_vickers.php
      实测 404。NavWeaps 英国武器索引（WNBR_Main.php）里这一条的 href 是
      WNBR_5-62_mk3.php，标题「0.50"/62 (12.7 mm) MG Mark III」。
      正文全部取自该页，url 填实际抓到的这一页。

      本页对皇家方舟号有一条直接点名，是本页最关键的引文：
      「Large ships usually had four quad mountings, but HMS Ark Royal had eight.
       Cruisers had two to four and destroyers had two.」

      口径提示：
      ① **Date Of Design 与 Date In Service 都写 1926，但 Description 段说
         「service introduction on British ships does not seem to have taken place
         prior to 1932」** —— 同一页两处互斥，正文已并列，不要合并成 1926 或 1932；
      ② 「Gun Length oa about 35 in」与「Bore Length 31.25 in」是两个量；
         该页在 Description 里另注「Actual bore length was 62.5 calibers」；
      ③ 四联装不是单一型号：Mark I / I* / II / II* / III 五档，
         重量 728 / 998 / 1,310 / 1,170 kg 不等，俯仰 -10/+70 或 -10/+80 不等；
      ④ 射速三个数并列：循环 600-700、加延时棘爪 450、实际 150-200；
      ⑤ 「Effective Range 800 码 / Maximum 约 5,000 码」是该页给的仅有两个射程值。

      关键原句（正文直接引用处）：
      "This weapon was used on almost all British warships during World War II,
       many in quad mounts like the ones shown below."
      "This was a recoil-operated, water-cooled gun with link-belt ammunition feed
       and was significantly less powerful than the USN's 0.50" (12.7 mm) Browning
       M2 BMG."
      "Like the US and most other nations, the British found small-caliber machine
       guns like these to be ineffective against modern aircraft. Nonetheless, this
       weapon was still produced in large numbers during the war with an overall
       total of 12,500 being built."

      「被 20 mm Oerlikon 取代」这一判断，本页没有直接写；正文用的是
      navypedia-town 的逐舰改装台账（"- 2 x 4 - 12.7/62 …… + 6 x 1 - 20/70
      Oerlikon Mk II/IV"）作为替换事实的来源，navweaps 页只支撑「英国判定无效」。

  - id: navweaps-3pdr-hotchkiss
    title: 'Britain Hotchkiss 3-pdr (1.4 kg) [1.85"/40 (47 mm)] QF Marks I and II'
    url: https://www.navweaps.com/Weapons/WNBR_3pounder_H_mk1.php
    type: website
    tier: D
    role: [data, narrative]
    operator: NavWeaps（Tony DiGiulian 编辑）
    lang: en
    access: proxy
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      Hotchkiss 3-pdr 的完整数据页。**这是本组唯一能支撑「礼炮」用途的来源**，
      因为 NavWeaps 是兵器站，它讲的正是这型炮被降级为礼炮的整个过程。

      **URL 说明**：任务没有下发 3-pdr 的 URL。NavWeaps 英国武器索引里
      这一条的 href 是 WNBR_3pounder_H_mk1.php（同索引另有
      WNBR_3pounder_V_mk1.php，那是 Vickers 3-pdr，不是本型，别混）。

      本页最关键的引文，是「降级 → 复役」这条链，正文整段引用：
      "As did other nations, the British found that these small-caliber
       projectiles were too light to be effective and many guns were converted
       following World War I to sub-caliber training and saluting guns.
       This last use meant that a number of these guns survived until World War II
       when they were converted back to shooting guns and used on MLs and other
       minor auxiliary warships."

      口径提示：
      ① **本页完全没有提到皇家方舟号。** 本舰装 4 门 Mk I 礼炮这一事实，
         来源是 navypedia-arkroyal（装备栏「4 x 1 - 47/40 3pdr Hotchkiss Mk I」）
         与 historyofwar-arkroyal（「Four 3pdr saluting guns」），不是本页；
      ② 「Marks I and II」是炮身，炮座另有 Mark I / I*（低角）与
         Mark IV HA / V HA / VI HA（高角）之分，以及改装型 Mark IC HA，
         不要把炮身编号当炮座编号；
      ③ 数量口径：海军服役过约 2,950 门，1939 年仍有约 1,950 门可用，
         「almost all surviving guns in 1939 were Mark I」；
      ④ 射程栏标题写「Range with 3.3 lbs. (1.5 kg) HE」，即该页给的射程
         对应 HE 弹，不是穿甲弹。

  - id: historyofwar-skua
    title: 'Blackburn B-24 Skua'
    url: https://www.historyofwar.org/articles/weapons_blackburn_skua.html
    type: website
    tier: D
    role: [data, narrative]
    operator: History of War（Dr John Rickard）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      Skua 的专页，作者署名「Rickard, J (22 November 2007)」。
      本页提供本组关于 Skua 的**结构史与战历**主线，
      性能数字则与 naval-history-arkroyal 的机型说明并列（见下）。

      本页不可替代的三段：
      ① 两用设计的三个成因（O.27/34 规范、RAF 掌管期的判断传统、
         多用途飞机传统），原文含「not entirely compatible roles」；
      ② 「进步但一服役就过时」的对照（Nimrod 193 mph、Skua 只快 32 mph、
         Spitfire Mk I 362 mph、比 1939 年德国轰炸机还慢）；
      ③ 柯尼斯堡号的归属 ——「By April 1940 both Nos. 800 and 803 squadrons
         were based at Hatston on Orkney, after the Ark Royal was sent to the
         Mediterranean.」**这一句是「战果不属于本舰甲板」的关键依据**，
         正文据此写明起飞地点是岸上机场。

      口径提示：
      ① 最大速度「225mph at 6,500ft」与 naval-history 的「225 mph at 6700 ft」
         高度差 200 ft，正文并列；
      ② 规格表只给 Mk. II，不给 Mk. I；
      ③ 该页把 Fulmar 拼作「Fulmer」（原文如此），引文照录不改；
      ④ 「first British fighter to shoot down a German aircraft」一句
         未提 RAF 88 中队 Letchford 的争议说法，正文已与 naval-history 并列。

  - id: historyofwar-roc
    title: 'Blackburn Roc'
    url: https://www.historyofwar.org/articles/weapons_blackburn_roc.html
    type: website
    tier: D
    role: [data, narrative]
    operator: History of War（Dr John Rickard）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      Roc 的专页，署名「Rickard, J (2 November 2008)」。

      **本页与本组其它来源存在一处直接冲突，正文并列不裁决：**
      「Nos.801 and 806 Squadrons both received the type during 1940, operating
       them alongside their Skuas. Both squadrons were land-based, and the Roc was
       never used from an aircraft carrier.」
      而 naval-history-arkroyal 的 1939-09-11 / 09-22 / 09-25 三处均记
      「Blackburn Skuas and Rocs of 803 Sqd embarked」，1940-03-22 记
      「landed on six Skuas and five Rocs of 800 and 801 Sqds」；
      faa-arkroyal-archive 记 803 中队「April-Oct 1940, Skua II/Roc I」；
      navypedia-arkroyal 机群表 4.1940 记「5 Roc」。
      两种说法不能同时成立，**不要在校对时把任一边删掉**。

      本页不可替代的两段：
      ① Roc 与 Defiant 的战术差别（Roc 是「飞到来袭轰炸机旁边侧射」，
         前提是敌机必须平直飞行以攻击军舰）；
      ② 炮塔重量吃掉性能的判决句：「the extra weight of the turret reduced the
         moderate performance of the Skua to a point where it could not have
         caught up with any modern German bomber」。

      口径提示：
      ① 机高、全重、最大速度只有本页给，naval-history 未给 Roc 的速度数字；
      ② 水上型产量原文先写「Only two more were produced」，即首架坠毁后再造两架，
         正文按「合计三架」表述并同时保留原文；
      ③ 合同数 136 架（1937-04-28），与本页「Nos.801 and 806」两中队编制并存，
         不据此推算实际交付数 —— 本页没有给交付总数。

  - id: historyofwar-albacore
    title: 'Fairey Albacore'
    url: https://www.historyofwar.org/articles/weapons_fairey_albacore.html
    type: website
    tier: D
    role: [data, narrative]
    operator: History of War（Dr John Rickard）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      Albacore 的专页，署名「Rickard, J (31 October 2008)」。

      **本页有两句话分属不同页面层级的矛盾，必须留意：**
      机型页写「the Albacore gradually replaced the Swordfish on the larger fleet
      carriers, serving on HMS Ark Royal, HMS Formidable, HMS Furious,
      HMS Illustrious, HMS Indomitable and HMS Victorious」——
      而同站的本舰页（historyofwar-arkroyal）写「No.828's Albacores were
      briefly on the Ark Royal after transferring from the Argus in early
      October 1941. Flew off to Hal Far, Malta on 18 October.」
      前者会被读成作战服役，后者才是准确形态。正文把两者并列，
      并以 naval-history-arkroyal 的逐日记录（10-08 并靠转机、10-18 0140 飞送
      11 架 Albacore 与 2 架 Swordfish 往 Hal Far）作为判定依据。

      本页不可替代的三段：
      ① 服役与首次作战：1940-03 随 826 中队服役，1940-05-31 首次出动
         （轰炸 Westende 与泽布吕赫 E 艇，不是鱼雷攻击）；
      ② 首次上舰：1940-11-26，826 与 829 中队登 Formidable 号；
      ③ 「不如 Swordfish 适应性强」的真正原因（护航航母太小，
         装不下更快更重的 Albacore）。

      口径提示：
      ① 两个并列值不要替作者取舍：机高「12ft 6in or 15ft 3in」、
         升限「20,700ft or 18,800ft」；
      ② 产量口径同一段内出现两个数：「798 production aircraft」与
         「All 800 Albacores were produced」—— 差额是两架原型机，
         正文按「原型机 + 798 量产 = 800」表述并保留原文用词；
      ③ 服役年份 1940-03 与首次上舰 1940-11-26 相差八个月，
         这解释了为什么本舰（1941-11 沉没）与它的重叠窗口只有 1941 年下半年。

