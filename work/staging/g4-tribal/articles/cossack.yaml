# ============================================================================
# 舰艇正文 —— 哥萨克号
#
# 本舰正文的抓手是「一艘因为一件与炮无关的事而出名的驱逐舰」。
# 项目里其他舰讲设计与炮术，这一艘最值得讲的是 1940 年 2 月的那个夜晚：
# 一艘 1,959 吨的驱逐舰开进中立国领海的峡湾，登上一条 13,580 吨的油船，
# 从货舱里带出 299 个人。
# ============================================================================
ship: cossack
updated: 2026-11-22

intro:
  lead:
    zh: >-
      哥萨克号是部族级里最有名的一艘，而出名的原因与炮无关。
      1940 年 2 月 16 日深夜，它开进挪威的中立水域，强行登上德国补给船
      Altmark，从货舱里救出 299 名英国战俘。同年 4 月它又在纳尔维克
      被打得失去机动、搁浅在峡湾里。1941 年 5 月它作为第 4 驱逐舰分队旗舰
      参加了对俾斯麦的最后追击，10 月在直布罗陀以西被 U-563 雷击，
      四天后在拖带途中沉没。
    en: >-
      Cossack is the most famous of the Tribals, and the reason has nothing to
      do with her guns. Late on 16 February 1940 she entered neutral Norwegian
      waters and boarded the German supply ship Altmark, taking 299 British
      prisoners out of her holds. In April the same year she was left
      unmanoeuvrable and aground in a Norwegian fjord at Narvik. In May 1941 she
      flew the flag of the 4th Destroyer Flotilla through the final pursuit of
      Bismarck, and in October she was torpedoed west of Gibraltar by U-563,
      sinking four days later under tow.

  paragraphs:
    - heading: 部族级为什么比同期英国驱逐舰大一圈
      text:
        zh: >-
          这一级不是按「英国标准驱逐舰」放大出来的，是对手的产物。
          1930 年代中期，日本吹雪型已经装上三座双联 127 毫米炮和三座三联
          鱼雷发射管，意大利与德国也在造接近两千吨的驱逐舰，而皇家海军
          当时的标准舰还在 1,300 吨、四门 120 毫米炮。
          海军部最初的要求是装十门 120 毫米炮，但 1930 年伦敦会议给「领舰」
          定的上限是 1,850 吨，十门炮在吨位里放不下。经过不少于八个方案，
          最后定在八门 120 毫米（四座双联）、一座四联 40 毫米 pom-pom、
          一座四联 21 英寸鱼雷发射管。造价约三十四万英镑，
          含海军部供给的武备后平均约五十二万。
        en: >-
          The class was not a scaled-up British destroyer; it was a response to
          foreign ships. By the mid-1930s the Japanese Fubuki class already
          carried three twin 127 mm mountings and three triple torpedo tubes,
          Italy and Germany were building destroyers close to two thousand tons,
          while the standard Royal Navy ship was still around 1,300 tons with
          four 120 mm guns. The Admiralty initially asked for ten 120 mm guns,
          but the 1930 London Conference capped leaders at 1,850 tons and ten
          guns would not fit. After no fewer than eight design proposals the
          class settled at eight 120 mm guns in four twin mountings, one
          quadruple 40 mm pom-pom and one quadruple 21-inch torpedo tube set.
          Cost was about £340,000 a ship, roughly £520,000 with Admiralty-supplied
          armament.
      src: [navypedia-tribal, uboat-tribal-class]

    - heading: 那个夜晚：约辛峡湾
      text:
        zh: >-
          1940 年 2 月，皇家海军得知德国的补给油船 Altmark 正沿挪威海岸
          返航，船上关着被施佩伯爵号俘获的英国商船船员。挪威是中立国，
          英国舰艇不能在挪威领海内登上德国船。经过与挪威方面交涉，
          舰长 Vian 获准靠近该船并派出登船队。
          23 时 12 分，哥萨克号靠上去，德船试图用沉重的舰尾撞击驱逐舰的薄船壳，
          没有成功。登船队由三名军官和三十名士兵组成，
          在货舱里找到并救出了 299 名被关押者。行动中德方 4 人死亡、5 人受伤，
          本舰舰首外板被撞出轻微结构损伤。
        en: >-
          In February 1940 the Royal Navy learned that the German supply tanker
          Altmark was returning down the Norwegian coast with British merchant
          seamen from ships taken by Admiral Graf Spee locked aboard. Norway was
          neutral, and British warships could not board a German ship in
          Norwegian waters. After negotiation with the Norwegians, Captain Vian
          was permitted to approach and land a boarding party. At 2312 Cossack
          came alongside; the tanker tried to crash her heavy stern into the
          destroyer's thin plating and failed. The boarding party of three
          officers and thirty men found and freed 299 prisoners in the holds.
          Four Germans were killed and five wounded, and Cossack's bow plating
          was slightly buckled.
      src: [naval-history-cossack, uboat-cossack]

    - heading: 「299」这个数字不要改成「约三百」
      text:
        zh: >-
          两个独立来源给出的都是 299 这个具体数字，不是概数。
          这一条看起来是细节，但它决定了这件事能不能被核。
          同样值得留下的细节是：这次行动之后本舰并没有立刻成为「名舰」——
          它 1940 年 1 月才刚接任分队旗舰，靠的是 Afridi 进厂修理时
          两舰舰长对调；救出的人 2 月 17 日在莱斯上岸，
          报纸的报道是在那之后才开始铺开的。
        en: >-
          Two independent sources both give the specific figure of 299 rather
          than an approximation, and that distinction is what makes the episode
          checkable. An equally worth-keeping detail is that the ship did not
          become famous immediately: she had only taken over as flotilla leader
          in January 1940, when Afridi went into dockyard hands and the two
          commanding officers swapped ships; the rescued men were landed at
          Leith on 17 February, and the press coverage built from there.
      src: [naval-history-cossack, uboat-cossack]

    - heading: 纳尔维克：被打瘫在峡湾里
      text:
        zh: >-
          1940 年 4 月 13 日的第二次纳尔维克海战中，本舰与 Foxhound 一同
          击沉了德国驱逐舰 Erich Giese，又与另外两艘本土舰队驱逐舰合力
          攻击已经受伤的 Diether von Roeder。回击中被命中九发 5 英寸炮弹，
          11 人阵亡、23 人受伤。一发炮弹在前部结构内爆炸，
          把 A 炮的整个供弹组炸死；锅炉舱中弹后失去机动，舰搁浅。
          第二天涨潮时脱浅，以倒车的方式驶往 Skelfjord。
        en: >-
          In the Second Battle of Narvik on 13 April 1940 Cossack and Foxhound
          sank the German destroyer Erich Giese, and with two other Home Fleet
          destroyers engaged the already crippled Diether von Roeder. In return
          she took nine 5-inch hits, losing 11 killed and 23 wounded. One shell
          burst inside the forward structure and killed the entire ammunition
          supply party for A gun; hits in the boiler rooms left her unable to
          manoeuvre and she grounded. She refloated on the next rising tide and
          made her way to Skelfjord under stern way.
      src: [naval-history-cossack]

    - heading: 一处必须并列的损伤记载
      text:
        zh: >-
          同一次战斗的损伤，两个来源给的数字不一样。naval-history 记
          「九发 5 英寸炮弹」（5 英寸即 127 毫米），navypedia 记
          「四发 127 毫米炮弹」。口径一致，数目不同（9 对 4）。
          这两条都不删，也不判谁对 —— 战伤统计本身就是最容易出现
          计入口径差异的一项（是否含近失、是否含破片造成的结构损伤）。
          正文与 fact 都并列保留。
        en: >-
          Two sources give different damage figures for the same action.
          Naval-History records nine 5-inch hits (5 inch being 127 mm), while
          Navypedia records four 127 mm hits. The calibre agrees; the count does
          not, nine against four. Neither is deleted and neither is adjudicated:
          battle-damage returns are precisely the kind of record where counting
          conventions differ, over near misses or splinter damage to structure.
          Both are kept, in the article and in the data.
      src: [naval-history-cossack, navypedia-tribal]

    - heading: 皇家海军驱逐舰上的第一部雷达
      text:
        zh: >-
          1940 年 5 月起，本舰在 Southampton 的 J I Thornycroft 大修，
          同时做了两件改变它战力的事。一是装上了 286 型雷达，
          naval-history 的原话是「皇家海军驱逐舰上装的第一部雷达」。
          二是把 X 炮座的双联 4.7 英寸炮座换成双联 4 英寸高平两用炮座，
          主炮从八门减到六门。后一项是这一级在战争中反复做的同一件事：
          用主炮数量换对空能力。
        en: >-
          From May 1940 the ship was in J I Thornycroft at Southampton for a
          major refit, which changed two things about her fighting power. First,
          Type 286 radar was fitted, which Naval-History describes as the first
          radar outfit fitted in a Royal Navy destroyer. Second, the twin 4.7-inch
          mounting in X position was replaced by a twin 4-inch HA mounting,
          cutting the main battery from eight guns to six. The second change is
          the same trade the class made repeatedly through the war: gun count
          for anti-aircraft capability.
      src: [naval-history-cossack]

    - heading: 俾斯麦：把四条鱼雷打光
      text:
        zh: >-
          1941 年 5 月 26 日夜到 27 日凌晨，第 4 驱逐舰分队的四艘部族级
          加上波兰的 Piorun 在俾斯麦周围轮番接近。本舰打了两次：
          零时四十分从 6,000 码一次齐射三条鱼雷，观测到一条命中，
          俾斯麦舰首起火但很快熄灭；三时三十五分从 4,000 码射出最后一条，
          未命中。四条雷全部打光，所以此后它退出接触不是因为被击退，
          是没雷可放了。
        en: >-
          Through the night of 26/27 May 1941 the four Tribals of the 4th
          Destroyer Flotilla, with the Polish Piorun, worked around Bismarck in
          turn. Cossack attacked twice: at 0140 she fired three torpedoes from
          6,000 yards and a hit was observed, with flames on Bismarck's forecastle
          that were quickly extinguished; at 0335 she fired her last torpedo from
          4,000 yards and missed. All four torpedoes were gone, so her
          subsequent withdrawal from contact was not a matter of being driven
          off but of having nothing left to fire.
      src: [naval-history-cossack, uboat-cossack]

    - heading: 一夜命中，还是观测到命中
      text:
        zh: >-
          上文中「观测到一条命中」是来源的原话表述，不是确认战果。
          战后对俾斯麦残骸的调查一般认为驱逐舰在夜战中的雷击没有取得
          确认命中。这两件事并不互相否定：一枚在夜暗与暴雨中击中
          战列舰水线的鱼雷，与一份战后逐条比对破口的清单，说的是两种
          不同强度的证据。本站两条都写，不裁决。
        en: >-
          The phrase "a hit was observed" above is the source's own wording, not
          a confirmed result. Post-war examination of Bismarck's wreck is
          generally taken to show that the destroyers' night torpedo attacks
          achieved no confirmed hits. The two statements do not cancel each
          other: a torpedo seen to strike a battleship's waterline in darkness
          and rain, and a post-war list of individual holes, are evidence of two
          different strengths. Both are recorded here without adjudication.
      src: [naval-history-cossack, uboat-cossack]

    - heading: 沉没要分三段
      text:
        zh: >-
          1941 年 10 月 23 日，本舰在 HG.75 护航中位于船队尾部，
          被 U-563 的一条鱼雷命中舰桥之前。舰桥前的结构被摧毁，
          舰长 Berthon 与 158 人阵亡、29 人受伤，弹药发生爆炸，
          一号锅炉舱进水，幸存者乘救生浮具离舰。但舰没有立刻沉：
          幸存者返回舰上做损管，让它能以倒车航行，拖船 Thames 赶到接拖。
          四天后的 10 月 27 日 10 时 43 分，天气恶化，人员转移到轻护卫舰
          Jonquil，舰在 35°12'N 08°17'W 沉没。
        en: >-
          On 23 October 1941, stationed astern of convoy HG.75, Cossack was hit
          forward of the bridge by a torpedo from U-563. The structure forward of
          the bridge was destroyed, Captain Berthon and 158 of her company were
          killed and 29 wounded, ammunition exploded, No. 1 boiler room flooded,
          and the survivors abandoned to Carley floats. She did not sink at once:
          the survivors returned and worked damage control until she could make
          stern way, and the tug Thames came out to take her in tow. Four days
          later, at 1043 on 27 October, with the weather worsening, the men were
          taken off by the sloop Jonquil and she sank at 35°12'N 08°17'W.
      src: [naval-history-cossack, uboat-cossack]

    - heading: 两个日期不是矛盾
      text:
        zh: >-
          uboat.net 的该舰页与 U 艇战果表把本舰的损失日记为 10 月 24 日，
          而 naval-history 记 10 月 27 日沉没。这不是记载冲突：
          前者是判定为战损（经攻击后不再具备战力）的日期，
          后者是舰体实际沉入水中的日期。两个日期都成立，各自的口径都写清了。
          本站两条并列，不合并成一个日期。
        en: >-
          Uboat.net's ship page and U-boat success table give the loss date as
          24 October, while Naval-History records the sinking on 27 October.
          This is not a conflict of record: the first is the date the ship was
          assessed as a war loss, no longer a fighting unit after the attack;
          the second is the date the hull actually went under. Both are true and
          each states its own basis. They are kept side by side rather than
          merged into one date.
      src: [naval-history-cossack, uboat-cossack]

history:
  - id: build
    title: { zh: 建造, en: Building }
    range: { from: 1936, to: 1938 }
    events:
      - date: 1936-03-10
        text:
          zh: 在 1935 年造舰计划下向 Vickers-Armstrong 下单。
          en: Ordered from Vickers-Armstrong under the 1935 Build Programme.
        src: [naval-history-cossack]
      - date: 1936-06-09
        text:
          zh: 在 Vickers-Armstrong（Newcastle-on-Tyne）开工。
          en: Laid down at Vickers-Armstrong, Newcastle-on-Tyne.
        src: [naval-history-cossack, uboat-cossack]
      - date: 1937-06-08
        text:
          zh: 下水。
          en: Launched.
        src: [naval-history-cossack, uboat-cossack]
      - date: 1938-06-07
        text:
          zh: 完工服役，编入第 1 部族驱逐舰分队，舷号 L03。
          en: >-
            Completed and commissioned into the 1st Tribal Destroyer Flotilla,
            pennant L03.
        src: [naval-history-cossack, uboat-cossack]

  - id: altmark
    title: { zh: 阿尔特马克与纳尔维克, en: Altmark and Narvik }
    range: { from: 1940, to: 1940 }
    events:
      - date: 1940-01
        text:
          zh: >-
            Afridi 进厂修理，两舰舰长对调，本舰接任第 4 驱逐舰分队旗舰。
          en: >-
            With Afridi in dockyard hands the two commanding officers swapped
            ships, and Cossack became leader of the 4th Destroyer Flotilla.
        src: [uboat-cossack]
      - date: 1940-02-16
        text:
          zh: >-
            在挪威约辛峡湾强行登上德国补给船 Altmark，救出 299 名英国战俘；
            德方 4 死 5 伤；本舰舰首外板轻微受损。
          en: >-
            Boarded the German supply ship Altmark in Jøssingfjord, Norway, and
            freed 299 British prisoners; four Germans were killed and five
            wounded; Cossack's bow plating was slightly buckled.
        src: [naval-history-cossack, uboat-cossack]
      - date: 1940-02-17
        text:
          zh: 获救人员在莱斯上岸，随后引发大范围报纸报道。
          en: The rescued men were landed at Leith, followed by wide press coverage.
        src: [naval-history-cossack]
      - date: 1940-04-13
        text:
          zh: >-
            第二次纳尔维克海战：与 Foxhound 击沉 Erich Giese，合击
            Diether von Roeder；被命中九发 5 英寸炮弹，11 死 23 伤，
            失去机动后搁浅。
          en: >-
            Second Battle of Narvik: sank Erich Giese with Foxhound and helped
            engage Diether von Roeder; took nine 5-inch hits, 11 killed and 23
            wounded, lost manoeuvrability and grounded.
        src: [naval-history-cossack]
      - date: 1940-04-14
        text:
          zh: 涨潮脱浅，以倒车方式驶往 Skelfjord。
          en: Refloated on the rising tide and made for Skelfjord under stern way.
        src: [naval-history-cossack]

  - id: radar
    title: { zh: 改装与雷达, en: Refits and radar }
    range: { from: 1940, to: 1941 }
    events:
      - date: 1940-05
        text:
          zh: >-
            在 J I Thornycroft（Southampton）大修改装：装 286 型雷达
            （皇家海军驱逐舰上的第一部），X 炮座换为双联 4 英寸高平两用炮座。
          en: >-
            Major refit at J I Thornycroft, Southampton: Type 286 radar fitted
            (the first in an RN destroyer) and the X mounting replaced by a twin
            4-inch HA mounting.
        src: [naval-history-cossack]
      - date: 1941-01-07
        text:
          zh: 再次入 J I Thornycroft 改装，286 型改为可旋转天线，编制增至 236 人。
          en: >-
            Second refit at J I Thornycroft; Type 286 modified for a rotating
            aerial and complement increased to 236.
        src: [naval-history-cossack]
      - date: 1941-02-20
        text:
          zh: 完成试航，返斯卡帕湾归队。
          en: Completed post-refit trials and rejoined the flotilla at Scapa Flow.
        src: [naval-history-cossack]

  - id: bismarck
    title: { zh: 俾斯麦追击, en: The pursuit of Bismarck }
    range: { from: 1941-05, to: 1941-05 }
    events:
      - date: 1941-05-22
        text:
          zh: 在克莱德加入开往印度洋的运兵船队 WS8B 担任近程护航。
          en: >-
            Joined troopship convoy WS8B in the Clyde as local escort for the
            passage to the Indian Ocean.
        src: [naval-history-cossack]
      - date: 1941-05-25
        text:
          zh: 与 Maori、Sikh、Zulu 和波兰 Piorun 一同脱离船队，参加对俾斯麦的搜索。
          en: >-
            Detached with Maori, Sikh, Zulu and the Polish Piorun to join the
            search for Bismarck.
        src: [naval-history-cossack]
      - date: 1941-05-27
        text:
          zh: >-
            0140 从 6,000 码齐射三条鱼雷，观测到一条命中；0335 从 4,000 码
            射出最后一条，未命中。四条雷全部打光。
          en: >-
            At 0140 fired three torpedoes from 6,000 yards and a hit was
            observed; at 0335 fired her last from 4,000 yards and missed. All
            four torpedoes expended.
        src: [naval-history-cossack, uboat-cossack]

  - id: loss
    title: { zh: HG.75 与沉没, en: HG.75 and loss }
    range: { from: 1941-10, to: 1941-10 }
    events:
      - date: 1941-10-23
        text:
          zh: >-
            在 HG.75 护航中于 35°36'N 10°04'W 被 U-563 雷击，舰长 Berthon
            与 158 人阵亡、29 人受伤；舰体未立即沉没。
          en: >-
            Torpedoed by U-563 at 35°36'N 10°04'W while escorting HG.75;
            Captain Berthon and 158 men killed, 29 wounded; the ship did not
            sink at once.
        src: [naval-history-cossack, uboat-cossack]
      - date: 1941-10-27
        text:
          zh: >-
            1043，天气恶化，人员转移到 Jonquil，舰在 35°12'N 08°17'W 沉没。
          en: >-
            At 1043, with the weather worsening, the crew was taken off by
            Jonquil and she sank at 35°12'N 08°17'W.
        src: [naval-history-cossack]
