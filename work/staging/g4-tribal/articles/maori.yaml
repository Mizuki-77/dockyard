# ============================================================================
# 舰艇正文 —— 毛利人号
#
# 本舰正文的抓手是「一艘死在港里的驱逐舰」。
# 项目里其他舰的沉没都有过程，这一艘没有：一枚炸弹从机舱上方落下来，
# 舰当场爆炸沉没，全舰只死了 1 个人 —— 而舰彻底报废。
# 这两个数字放在一起才是它的一生，单独看任何一个都会读错。
# ============================================================================
ship: maori
updated: 2026-11-22

intro:
  lead:
    zh: >-
      毛利人号是部族级里唯一一艘「沉在港里」的舰。1942 年 2 月 12 日凌晨，
      它停泊在马耳他瓦莱塔大港的应急浮标上，一枚炸弹落进机舱与齿轮舱，
      舰当场爆炸沉没。全舰只有 1 人阵亡 —— 因为驻马耳他期间舰员按惯例
      夜宿岸上的防空掩体。数字低不等于损失轻：整艘舰就此报废。
      它的战史高点在此前两个月：1941 年 12 月 13 日邦角夜战，
      它与 Sikh 等三舰一同击沉了两艘意大利轻巡洋舰。
    en: >-
      Maori is the only Tribal that died in harbour. In the early hours of
      12 February 1942 she was moored at an emergency buoy in Grand Harbour,
      Valletta, when a bomb fell into her engine and gear rooms and she blew up
      and sank on the spot. Only one man was killed, because while based at
      Malta the off-duty crew customarily slept ashore in shelters. A low figure
      is not a light loss: the ship was a total wreck. Her high point had come
      two months earlier, on 13 December 1941 at Cape Bon, when with Sikh and
      two others she helped sink two Italian light cruisers.

  paragraphs:
    - heading: 这一级为什么要装八门 120 毫米炮
      text:
        zh: >-
          部族级不是英国自己想做大的结果，是对手的产物。1930 年代中期
          日本吹雪型已装三座双联 127 毫米炮和三座三联鱼雷发射管，
          意大利与德国也在造接近两千吨的驱逐舰，而皇家海军标准舰还在
          1,300 吨、四门炮。海军部最初要十门 120 毫米，但 1930 年伦敦会议
          给「领舰」定的上限是 1,850 吨，十门炮放不下。
          经过不少于八个方案，最后定在八门 120 毫米（四座双联）、
          一座四联 40 毫米 pom-pom、一座四联 21 英寸鱼雷发射管。
          四座炮座是 CPXIX —— 英国第一个专门为驱逐舰设计的动力炮座。
        en: >-
          The Tribal class was not Britain deciding to build big; it was a
          response. By the mid-1930s the Japanese Fubuki class carried three
          twin 127 mm mountings and three triple torpedo tube sets, and Italy and
          Germany were building destroyers near two thousand tons, while the
          standard RN ship was still 1,300 tons with four guns. The Admiralty
          initially wanted ten 120 mm guns, but the 1930 London Conference capped
          leaders at 1,850 tons and ten would not fit. After no fewer than eight
          proposals the class settled at eight 120 mm in four twin mountings, one
          quadruple 40 mm pom-pom and one quadruple 21-inch tube set. The four
          mountings were CPXIX, the first British power mounting designed
          specifically for destroyers.
      src: [navypedia-tribal, uboat-tribal-class, navweaps-4-7in-45-mk12]

    - heading: 一门打不到飞机的炮，和一条必须付的代价
      text:
        zh: >-
          CPXIX 解决了人力问题，但没有解决根本问题：它的仰角上限只有 40 度。
          navweaps 对这一族炮的评价写得毫不含糊 ——
          整个战争期间英国驱逐舰「死于空袭多于其他任何原因」，
          而这型炮没有对空能力。所以在 1940 年 12 月到 1941 年 1 月，
          本舰进泰恩河畔赫伯恩的船厂，把 X 炮座的双联 4.7 英寸换成了
          双联 4 英寸高平两用炮座：主炮从八门降到六门，换来朝天的能力。
          naval-history 对这次改动给的理由很直接：这是为了弥补
          挪威战役中暴露出来的对空防御不足。
        en: >-
          CPXIX solved the manpower problem but not the fundamental one: its
          elevation limit was only 40 degrees. NavWeaps is blunt about the
          family: throughout the war more British destroyers were sunk by air
          attack than from any other cause, and these guns had no DP function. So
          between December 1940 and January 1941 the ship went into a Hebburn-on-Tyne
          yard and swapped the twin 4.7-inch in X for a twin 4-inch HA mounting,
          dropping the main battery from eight guns to six in exchange for the
          ability to shoot upwards. Naval-History gives the reason plainly: it
          was to overcome the lack of suitable defence against air attack
          established during the operations in Norway.
      src: [navweaps-4-7in-45-mk12, naval-history-maori, navypedia-tribal]

    - heading: 1940 年 5 月 2 日：第一次受伤
      text:
        zh: >-
          纳姆索斯撤退那天，两枚带啸声装置的炸弹在本舰两侧近失：
          一枚在左舷舰桥正横，一枚在右舷鱼雷发射管附近。
          两艘汽艇和一艘捕鲸艇被炸成碎片，破片穿透舰体、烟囱与上层建筑。
          约二十人受伤，其中五人伤重不治。伤员在苏格兰上岸，舰在斯卡帕湾修补。
          这一战之后不到一个月，德国入侵挪威带来的教训就被写进了这一级的
          改装计划 —— 上面那段 X 炮座的换装，起因就在这里。
        en: >-
          On the day of the Namsos evacuation two bombs fitted with screamers
          burst close alongside, one to port abreast the bridge and one to
          starboard near the torpedo tubes. Both motor boats and a whaler were
          blown to pieces, and splinters pierced the hull, the funnels and the
          superstructure. About twenty men were injured, five of them dying of
          their wounds. The casualties were landed in Scotland and the ship was
          patched up at Scapa Flow. Less than a month later the lessons of the
          Norwegian campaign were written into the class's refit programme - the
          X mounting swap described above had its origin here.
      src: [naval-history-maori, uboat-maori]

    - heading: 1941 年 12 月 13 日：邦角
      text:
        zh: >-
          这是本舰战史的最高点。1941 年 12 月，本舰与 Sikh、Legion、
          荷兰的 Isaac Sweers 一同东调，13 日在突尼斯邦角外海拦住了
          意大利轻巡洋舰 Alberico da Barbiano 与 Alberto di Giussano。
          这是一次夜间鱼雷攻击：da Barbiano 被鱼雷命中沉没，
          di Guissano 被击中起火后沉没。意方 960 人阵亡，
          650 人被意方的鱼雷艇 Cigno 救起。
          三天后（12 月 18/19 日）意军人操鱼雷重创了停泊在亚历山大的
          伊丽莎白女王号与勇士号，Force K 又在的黎波里外海触雷 ——
          地中海的战局随即逆转。邦角因此成了 1941 年 12 月皇家海军
          唯一一次干净的胜利。
        en: >-
          This is her high point. In December 1941 she moved east with Sikh,
          Legion and the Dutch Isaac Sweers, and on the 13th they caught the
          Italian light cruisers Alberico da Barbiano and Alberto di Giussano off
          Cape Bon. It was a night torpedo attack: da Barbiano was torpedoed and
          sank, di Guissano was hit and set on fire and sank later. 960 Italians
          died and 650 were rescued by the Italian torpedo boat Cigno. Three
          days later, on 18/19 December, Italian human torpedoes crippled Queen
          Elizabeth and Valiant at Alexandria and Force K ran into a minefield
          off Tripoli; the Mediterranean balance turned over immediately.
          Cape Bon therefore stands as the one clean Royal Navy victory in the
          Mediterranean in December 1941.
      src: [naval-history-maori, uboat-maori]

    - heading: 1942 年 2 月 12 日：一枚炸弹，一个人
      text:
        zh: >-
          1942 年 2 月 12 日凌晨两点左右，本舰停泊在瓦莱塔大港
          Dockyard Creek 入口的应急驱逐舰浮标上，德国轰炸机的一枚炸弹
          落进机舱与齿轮舱。舰当场爆炸沉没，燃着的油在水面上铺开，
          其他舰的舰员参与了救援。全舰只有一人阵亡。
          这个数字低得反常，原因必须一起写：驻马耳他期间，非值更人员
          按惯例夜宿岸上的防空掩体。也就是说，一舰人活着，舰没了。
        en: >-
          At about 0200 on 12 February 1942, moored at the emergency destroyer
          buoy at the entrance to Dockyard Creek in Grand Harbour, Valletta, she
          took a German bomb in her engine and gear rooms. The ship blew up and
          sank where she lay, blazing oil spread across the water, and crews from
          other ships helped with the rescue. One man was killed. The figure is
          abnormally low and the reason has to be given with it: while based at
          Malta the off-duty crew customarily slept ashore in shelters. The crew
          lived; the ship did not.
      src: [naval-history-maori, uboat-maori]

    - heading: 沉在港里比沉在海里更麻烦
      text:
        zh: >-
          沉在瓦莱塔大港里是一件比战沉更麻烦的事：舰首还露出水面，
          严重妨碍港内航行，而舰上的 A、B 两门炮状态良好，
          一度有人提议把它们拆下来架到 Ricassoli 防波堤上给陆军用。
          此后的空袭里炸弹还不断落在残骸上。1942 年底海军部决定打捞，
          把它移出大港、沉放在 Sliema 对开的水域；1945 年再次打捞，
          拖到马耳他外海深水沉放。两个来源对最后这一次的日期不完全一致
          （1945 年 5 月 / 1945 年 7 月 5 日），两说并列。
        en: >-
          Sinking inside Grand Harbour was more nuisance than a loss at sea: her
          forepart still showed above water and seriously obstructed movement in
          the harbour, while her A and B guns were in good order, and it was
          suggested they be mounted on the Ricassoli breakwater for the Army's
          use. Bombs continued to fall on the wreck during later raids. By the end
          of 1942 the Admiralty decided to lift her, move her out of Grand
          Harbour and set her down off Sliema; in 1945 she was raised again and
          sunk in deep water away from the island. The two sources do not give
          the same date for that last move (May 1945 versus 5 July 1945), and
          both are kept.
      src: [naval-history-maori, uboat-maori]

history:
  - id: build
    title: { zh: 建造, en: Building }
    range: { from: 1936, to: 1938 }
    events:
      - date: 1936-03-10
        text:
          zh: 在 1935 年造舰计划下向 Fairfield（Govan）下单。
          en: Ordered from Fairfield, Govan, under the 1935 Build Programme.
        src: [naval-history-maori]
      - date: 1936-07-06
        text:
          zh: 开工。
          en: Laid down.
        src: [naval-history-maori, uboat-maori]
      - date: 1937-09-02
        text:
          zh: 下水。
          en: Launched.
        src: [naval-history-maori, uboat-maori]
      - date: 1938-11-30
        text:
          zh: 建造完工，合同价 340,622 英镑（不含海军部供给的武备与通信设备）。
          en: >-
            Build completed at a tender cost of £340,622, excluding
            Admiralty-supplied weapons and communications outfits.
        src: [naval-history-maori]
      - date: 1939-01-02
        text:
          zh: 服役（uboat.net 口径），随后开赴马耳他加入第 1 部族驱逐舰分队。
          en: >-
            Commissioned (per uboat.net), then sailed for Malta to join the 1st
            Tribal Destroyer Flotilla.
        src: [uboat-maori, naval-history-maori]

  - id: norway
    title: { zh: 本土海域与挪威, en: Home waters and Norway }
    range: { from: 1939, to: 1940 }
    events:
      - date: 1939-11-30
        text:
          zh: 与 Inglefield 一同在大风中救援失事的潜艇 Triad，带缆并拖至斯塔万格附近。
          en: >-
            With Inglefield, went to the aid of the disabled submarine Triad in a
            gale, got a line aboard and towed her into a fjord near Stavanger.
        src: [naval-history-maori, uboat-maori]
      - date: 1940-05-02
        text:
          zh: >-
            纳姆索斯撤退中遭德机轰炸，两枚近失弹造成约 20 人受伤、5 人伤重不治。
          en: >-
            Bombed during the Namsos evacuation; two near misses injured about
            twenty men, five of whom died of their wounds.
        src: [naval-history-maori, uboat-maori]
      - date: 1940-06-20
        text:
          zh: 与 Tartar、Mashona 一同赴法罗群岛，依非常征用权接收瑞典自意大利购入的军舰。
          en: >-
            With Tartar and Mashona, went to the Faeroes to requisition under the
            Right of Angary the warships Sweden had acquired from Italy.
        src: [uboat-maori]

  - id: bismarck
    title: { zh: 俾斯麦与改装, en: Bismarck and refits }
    range: { from: 1940-12, to: 1941-10 }
    events:
      - date: 1940-12
        text:
          zh: >-
            在赫伯恩改装：X 炮座的双联 4.7 英寸换为双联 4 英寸高平两用炮座，
            主炮减为六门。
          en: >-
            Refit at Hebburn: the twin 4.7-inch in X replaced by a twin 4-inch HA
            mounting, reducing the main battery to six guns.
        src: [naval-history-maori, uboat-maori]
      - date: 1941-05-27
        text:
          zh: >-
            0137 从 4,000 码在俾斯麦左舷舰尾方向齐射两条鱼雷，观测到水线有一道
            明亮闪光；0656 从 9,000 码再射两条，均未命中。
          en: >-
            At 0137 fired two torpedoes from 4,000 yards on Bismarck's port
            quarter and a bright glow was observed at the waterline; at 0656 fired
            two more from 9,000 yards, both missing.
        src: [naval-history-maori, uboat-cossack]
      - date: 1941-08-22
        text:
          zh: >-
            在伦敦皇家船坞的商业船厂改装：加装 285 型炮术火控雷达，拆除主桅以
            改善近程高炮射界。
          en: >-
            Refit at a commercial yard in the Royal Docks, London: Type 285
            gunnery radar fitted and the mainmast removed to improve arcs of fire
            for close-range AA armament.
        src: [naval-history-maori]

  - id: loss
    title: { zh: 地中海与沉没, en: The Mediterranean and loss }
    range: { from: 1941-11, to: 1942-02 }
    events:
      - date: 1941-12-13
        text:
          zh: >-
            邦角夜战：与 Sikh、Legion、荷兰 Isaac Sweers 一同击沉意大利轻巡洋舰
            Alberico da Barbiano 与 Alberto di Giussano。
          en: >-
            Night action off Cape Bon: with Sikh, Legion and the Dutch Isaac
            Sweers, sank the Italian light cruisers Alberico da Barbiano and
            Alberto di Giussano.
        src: [naval-history-maori, uboat-maori]
      - date: 1941-12-17
        text:
          zh: 参加第一次锡尔特湾海战。
          en: Took part in the First Battle of Sirte.
        src: [naval-history-maori]
      - date: 1942-02-12
        text:
          zh: >-
            约 0200，停泊在瓦莱塔大港 Dockyard Creek 入口的应急浮标上，
            被一枚炸弹命中机舱与齿轮舱，当场爆炸沉没；1 人阵亡。
          en: >-
            At about 0200, moored at the emergency buoy at the entrance to
            Dockyard Creek, Grand Harbour, took a bomb in her engine and gear
            rooms and blew up and sank on the spot; one man killed.
        src: [naval-history-maori, uboat-maori]
      - date: 1945-07-05
        text:
          zh: 残骸（1942 年已打捞并移出大港）再次被打捞，拖至马耳他外海深水沉放。
          en: >-
            The hulk, raised and moved out of Grand Harbour in 1942, was raised
            again and sunk in deep water off Malta.
        src: [uboat-maori]
