# ============================================================================
# 来源分片 —— g4-tribal（部族级四艘：Cossack / Maori / Zulu / Sikh）
#
# 新登记 6 条：
#   navypedia-tribal          舰级骨架（主尺度/排水量/动力/编制/武备/改装表）
#   uboat-tribal-class        uboat.net 舰级页（互证 + 造价 + 设计沿革）
#   naval-history-cossack     Cossack 逐月年表
#   naval-history-maori       Maori 逐月年表
#   naval-history-zulu        Zulu 逐月年表
#   naval-history-sikh        Sikh 逐月年表
#
# ⚠️ navweaps-4-7in-45-mk12 **不重复登记** —— 它已由 g7-weapons 组登记，
#    指向 https://www.navweaps.com/Weapons/WNBR_47-45_mk9.php
#    （Mark IX 与 Mark XII 同页；WNBR_47-45_mk12.php 实测 404）。
#    本组全部武器参数都引用这一条，不要再登记第二个 4.7"/45 来源。
#
# ⚠️ 现有的 navweaps-4-7in-40-mk8 是老的 4.7"/40 Mark VIII（纳尔逊级、
#    KGV 级的高炮），**不是**部族级的 4.7"/45 Mk XII。两者不可互换引用。
# ============================================================================
sources:
  - id: navypedia-tribal
    title: Navypedia — Tribal type destroyers (AFRIDI), 27 ships 1938-1948
    url: https://www.navypedia.org/ships/uk/brit_dd_tribal.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: navypedia.org
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      部族级舰级页，覆盖全部 27 艘（英国 16、澳大利亚 3、加拿大 8）。
      本组的主尺度、排水量、动力、编制、武备概览、逐次改装表全部出自此页。

      **该页有几处必须带着用的口径提示：**

      1. **数值栏是「as completed」与「加拿大 1951-55 现代化」两列并排。**
         不带限定地抄第二列会得出错误的排水量与吃水（加拿大舰 2,200 t /
         11.4 m 宽）。本组一律取 as completed 列。
      2. 排水量给 **标准 1,959 t / 满载 2,519 t**（"later 2,710"），
         与 uboat.net 的 1,883 / 2,559 差 76 t 与 40 t。两源都没说口径，
         本组并列登记，不裁决。英制长吨换算成公吨恰好会得到 1,959 / 2,559，
         但来源没有明说，**不据此改写数值**。
      3. 航速栏 "36.25 - 36.5" 未注明试航实测还是设计上限，
         故只登记 propulsion.speed.max，不冒充 speed.trial。
      4. 鱼雷发射管只写 "1 x 4 - 533 TT"，无鱼雷型号。

      「Naval service」段是全级战损的集中记载，本组用它交叉核对四艘的
      结局与沉没原因（Cossack / Maori / Zulu / Sikh 四条各自的原句见
      RESEARCH-NOTES.md）。

      **2026-11-22 实测直连 200，未走代理。**

  - id: uboat-tribal-class
    title: uboat.net — Tribal class Destroyers（Allied Warships, 26 ships）
    url: https://uboat.net/allies/warships/class/1.html
    type: database
    tier: D
    role: [data, narrative]
    operator: uboat.net（Guðmundur Helgason）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      舰级总页。本组用它做**独立互证**：主尺度（377 ft oa）、
      排水量（1,883 t / 2,559 full）、编制（190，四艘旗舰 219）、
      功率（44,000 hp）、航速（36 kn）、武备（8×4.7in 4x2 / 4×2pdr 1x4 /
      8×0.5in MG 4x2 / 4×21in TT 1x4）与 navypedia 逐项对照。

      **设计沿革与造价的原句出处：**
      "The Tribal class destroyers trace their roots to 1934 when the British
      Admiralty evaluated the threat posed by much larger destroyers being built
      in Japan, Italy and even Germany..."
      "The Tribal was finally accepted after no less than 8 design proposals."
      "Estimated cost per ship was 340,000 pounds excluding Admiralty supplied
      armaments putting the average cost around 520,000."
      "The first 7 Tribals were ordered on 10 March, 1936 with the latter group
      of 9 Tribals being ordered on 9 June."
      "The Tribals were not really U-boat hunters but rather fleet destroyers."
      "Pennant numbers were changed from F .. to G .. in late 1940 (in or around
      December)."

      ⚠️ 该页把排水量单位标成 "BRT"（容积吨位），军舰不适用；
      数值本身应理解成吨位数字。本组照录数值，单位在 fact 里按 t 记，
      并在 note 里说明来源标注有误。

  - id: naval-history-cossack
    title: Naval-History.Net — HMS Cossack (i)（逐月服役年表）
    url: https://www.naval-history.net/xGM-Chrono-10DD-34Tribal-HMS_Cossack1.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.Net（Lt Cdr Geoffrey B Mason RN (Rtd) 撰，Gordon Smith 编）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      本舰逐月年表，覆盖全生涯（1936 开工至 1941-10-27 沉没），
      附 Don Kindell 编制的护航记录表。本组绝大多数战史细节出自此页。

      **该页两条独家记载，是整个四舰组里最不可替代的：**
      ① 1940-05 改装的 286 型雷达 ——
         "Installation of Radar Type 286, which was an RAF air/surface
         equipment modified for naval use and **the first radar outfit to be
         fitted in RN destroyers**."
      ② 阿尔特马克事件救出 299 人的具体登船队编成与德方伤亡。

      ⚠️ 该页把 1941-10-23 的中雷位置记为 35.36N 10.04W、
      沉没位置 35.12N 08.17W，与 uboat.net 的 35°56'N 10°04'W 略有差异
      （前者 35.36 应读作 35°36'），本组按度分换算后取一致值。

      URL 说明：`xGM-Chrono-05DD-HMS_Cossack.htm` 与
      `xGM-Chrono-10DD-HMS_Cossack.htm` 均实测 404，
      正确形式是带舰种批次的 `10DD-34Tribal-HMS_Cossack1.htm`。

  - id: naval-history-maori
    title: Naval-History.Net — HMS Maori（逐月服役年表）
    url: https://www.naval-history.net/xGM-Chrono-10DD-34Tribal-HMS_Maori.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.Net（Lt Cdr Geoffrey B Mason RN (Rtd) 撰）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      本舰逐月年表，覆盖 1936-07 开工至 1942-02-12 沉没，附护航记录表。

      **该页独有的两条：**
      ① 造价 "Tender cost was £340,622 which excluded items supplied by the
         Admiralty, such as weapons and communications outfits."
      ② 1940-12 改装 X 炮座的理由 ——
         "to overcome the lack of suitable defence against air attacks as
         established during the operations in Norway."

      ⚠️ 该页的服役/完工口径与 uboat.net 不同（见 ships/maori.yaml 的两条
      construction.commissioned）。本组两条并列，不裁决。

  - id: naval-history-zulu
    title: Naval-History.Net — HMS Zulu（逐月服役年表）
    url: https://www.naval-history.net/xGM-Chrono-10DD-34Tribal-HMS_Zulu.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.Net（Lt Cdr Geoffrey B Mason RN (Rtd) 撰）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      本舰逐月年表，覆盖 1936-08 开工至 1942-09-14 沉没。

      **该页独有的两条：**
      ① lead ship 的由来 —— "Because of speedy construction achieved, she was
         nominated as Lead Ship for this Class."
      ② 合同价 "a contract price of £351,135"。

      ⚠️ 该页把下单日写成「1935-03-10 / 1935 年计划」，
      与 uboat.net 的 1936-03-10 不一致（见 ships/zulu.yaml）。
      ⚠️ 该页记 1942-09-14 的失踪人数为 24，uboat.net 记 27，两说并列。

  - id: naval-history-sikh
    title: Naval-History.Net — HMS Sikh（逐月服役年表）
    url: https://www.naval-history.net/xGM-Chrono-10DD-34Tribal-HMS_Sikh.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.Net（Lt Cdr Geoffrey B Mason RN (Rtd) 撰）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      本舰逐月年表，覆盖 1936-09 开工至 1942-09-14 沉没。

      **该页独有的两条：**
      ① 造价 "Build was completed on 12 October 1938 at a cost of £337,704 5s."
      ② 邦角海战的意方伤亡数字（960 阵亡 / 650 被 Cigno 救起）。
      ③ 击沉 U-372 的共享战果（与 Zulu、Croome、Tetcott 及 RAF 221 中队）。

      ⚠️ **该页有三处需带着用：**
      1. 沉没位置写成 "32.05N 42.00E" —— 经度 42 度深入埃及内陆，
         应为 24°00'E（navypedia 与 uboat.net 均记 24°00E）。
      2. 1941 年初改装写成 "replacement of single 4.7in gun by twin 4in
         mounting" —— 本级无单装 4.7 英寸炮，应为 "twin 4.7in"。
      3. 服役日（1938-10-12）与完工日（1938-11-02）的表述与 uboat.net
         不一致，见 ships/sikh.yaml。

      URL 说明：`xGM-Chrono-10DD-34Tribal-HMS_Sikh.htm` 与
      `...-34Tribal-Sikh.htm` 两个形式都存在（后者为 2003 年初版）。
      本组取带 HMS_ 前缀的现行版。

