  - id: uboat-zulu
    title: uboat.net — HMS Zulu (F 18)
    url: https://uboat.net/allies/warships/ship/4428.html
    type: database
    tier: D
    role: [data, narrative]
    operator: uboat.net（Guðmundur Helgason）
