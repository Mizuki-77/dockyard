    license: all_rights_reserved
    note: |
      本舰页：建造数据、逐段舷号、舰长任期表、沉没经过（1600 中弹、
      Croome 接人、Hursley 接拖、1900 沉没于 32°00'N 28°56'E）、
      伤亡数字（12 死 / 27 失踪 / 1 伤 —— 失踪数与 naval-history 的 24 不同）。

      另有一条该页独有的观察：本舰下水时锅炉与烟囱已装好
      （"Perhaps being launched with boilers and funnels in place makes a
      happy ship"），是它建造速度快的直接说明。

  - id: uboat-sikh
    title: uboat.net — HMS Sikh (F 82)
    url: https://uboat.net/allies/warships/ship/4434.html
    type: database
    tier: D
    role: [data, narrative]
    operator: uboat.net（Guðmundur Helgason）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: |
      **本组最重要的一份单舰来源** —— 托布鲁克沉没的逐发命中记录只有这一处
      写得最细（六发 88 mm 炮弹各自打中什么部位、Zulu 两次试图靠帮、
      舰长自沉与最后巡查、沉没位置 32°05'N 24°00'E）。

      同时提供：服役早于完工一个月的原句（"she was completed on 2 November
      1938 even though she had been commissioned a month earlier"）、
      舰长任期表（含 1942-02-03 至 02-21 的 Lt. Cole-Hamilton 代理期）。

      ⚠️ 该页**不给阵亡数**，只写 "All the survivors were taken as prisoner
      of war"。故 ships/sikh.yaml 里 service.casualties 未登记。

