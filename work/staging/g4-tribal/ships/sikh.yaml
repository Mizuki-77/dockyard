  # ============================================================ 邦角海战（1941-12-13）
  # ============================================================ 托布鲁克（1942-09-13/14）
  - field: armament.gun_failures
    value: >-
      1942-09-13/14 托布鲁克突袭（Operation Agreement）：本舰运送皇家海军陆战队
      登岸。0505 在用小艇接运部队时被岸上探照灯照住，随即遭岸防炮射击。
      第一发 88 mm 炮弹在齿轮舱爆炸，损坏润滑供油系统与操舵装置；
      第二发在前部爆炸，引燃 A 炮的待发弹药架，正在登舰的陆战队员
      死伤殆尽，并困住更多在住舱甲板待命的陆战队员；
      第三发击中测距指挥仪，此后全部火炮只能本地控制；
      第四发在拖带中引爆 Y 炮座周围的发射药；第五发击中 B 炮座杀死炮组；
      第六发在拖带准备阶段击毁舰桥，舰长 Micklethwait 当时正在前甲板
      监督拖带作业。最终拖缆被 88 mm 炮弹打断，舰长下令引爆自沉阀，
      弃舰，生还者全部被俘。
    src: [naval-history-sikh, uboat-sikh]
    valid: { from: 1942-09-13, to: 1942-09-14 }
    confidence: B
    note: >
      uboat.net 原句（逐条命中记录）："One 88mm shell exploded in Sikh's Gear
      Room, damaging the lubrication feed system and the steering gear. A second
      hit forward, blew up the ready-use ammunition locker for 'A' gun ...
      A third shell struck her range finder director and from then on, all her
      guns had to fire under local control ... a forth shell hit the unlucky
      destroyer setting off the charges around Sikh's 'Y' mounting ...
      a fifth shell struck 'B' mounting killing the gun crew ... a sixth shell
      smashed the bridge ... another 88mm shell hit the towline and severed it."

      以及 "Captain Micklethwait fired the scuttling charges which flooded the
      engine and boiler rooms. He made a final tour of his ship and left.
      Sikh took a long time to die, heeling over to starboard as she sank in
      position 32º05'N, 24º00'E while shells continued to hit.
      All the survivors were taken as prisoner of war."

      naval-history 简记："During attempts to land Royal Marines came under fire
      from shore batteries. ... Sustained major damage and taken in tow by
      HMS ZULU. Sank in position 32.05N 42.00E after further damage by 88mm
      shore fire."（经度 42 为 24 之误，见 construction.fate_date 的 note）

  # ============================================================ 改装与设备（逐次）
  - field: armament.mount.summary
    value: >-
      建成：8 × 4.7 in/45 QF Mk XII（4 座双联）+ 4 × 40 mm 2-pdr（1 座四联）
      + 8 × 12.7 mm 机枪 + 1 座四联 21 in 鱼雷发射管 + 深弹 30 枚。
      1941-01 至 03 利斯（Leith）修理兼改装：X 炮座的双联 4.7 in 换为
      双联 4 in 高平两用炮座（主炮减为 6 门），装 286M 型雷达。
      1941-06-13 前后（普利茅斯）：舰桥两舷各加 1 门单装 2-pdr，用于打 E 艇。
      1941-08-18 至 09 法尔茅斯改装：加装 285 型炮术火控雷达与
      2 门单装 20 mm Oerlikon。
    src: [naval-history-sikh, navypedia-tribal]
    valid: { from: 1938-10-12, to: 1942-09-14 }
    confidence: B
    note: >
      1941 年初改装原句（naval-history）："Work carried out included
      replacement of single 4.7in gun by twin 4in mounting to improve AA
      defence. Modified RAF air-surface radar fitted (Naval Type 286M.)"

      **注意原文写 "replacement of single 4.7in gun"，与本级实际配置
      （4 座双联，无单装 4.7 in）不符** —— 应为 "twin 4.7in mounting" 之误。
      同级 Cossack / Maori 的同一改装，naval-history 均写作
      "Twin 4.7in mounting in X position was replaced by twin 4in HA mounting"。
      本条按「X 炮座换装」登记，并在 RESEARCH-NOTES.md 记录该处笔误。

      1941-06 普利茅斯加 2-pdr 原句："Taken in hand for fit of two additional
      2Pdr mountings in Bridge wings to carry out attacks on E-Boats in defence
      of coastal convoys."

      1941-08 法尔茅斯原句："Work included fit of fire control radar Type 285
      and two single 20mm Oerlikon guns for close range AA defence."

