# ============================================================================
# 单舰：HMS Sikh（锡克人号，L82 → F82 → G82）
# ----------------------------------------------------------------------------
# 部族级第五艘。本舰的结局是本组最容易被讲错的一条：
#   **1942-09-14 在托布鲁克（Tobruk）外海被德军岸防炮击沉，不是 1944 年，
#   不在的黎波里，也与圣纳泽尔突袭（Operation Chariot）无关。**
# 主会话下发的任务表在这一点上写错了三处，核实过程见 RESEARCH-NOTES.md。
#
# 实况：1942-09-13/14 的托布鲁克突袭（Operation Agreement）中，
# 本舰运送皇家海军陆战队登岸，被岸上探照灯照住后遭 88 mm 岸炮连续命中六发，
# 拖带失败，舰长下令自沉并弃舰，全舰生还者被俘。
#
# 本舰另有一处战功：1941-12-13 邦角夜战，与 Maori / Legion / Isaac Sweers
# 一同击沉两艘意大利轻巡洋舰。
# ============================================================================

