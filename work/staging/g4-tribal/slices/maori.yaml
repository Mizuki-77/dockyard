# ============================================================================
# 状态切片：HMS Maori（毛利人号，L24 → F24 → G24）
# ----------------------------------------------------------------------------
# 本舰的分界逻辑抓两件事：X 炮座换装（1940-12/1941-01）与
# 最后一次伦敦改装（1941-08 至 10）—— 后者是它沉没时的配置。
# 与 Cossack 不同，本舰没有大量「进厂就换身份」的循环，
# 切片数因此少一些，不硬凑。
# ============================================================================
ship: maori
slices:
  - code: P0
    title: 建造（1936-1938）
    from: 1936-07-06
    to: 1938-11-29
    note: >-
      1936-07-06 在 Fairfield（Govan, Glasgow）开工，1937-09-02 下水。
      合同价 340,622 英镑，不含海军部供给的武备与通信设备。
      1938-11 开始船厂试航与服役手续，1938-11-30 完工。

      **服役日两说并列**：uboat.net 记 1939-01-02（口径明确写 Commissioned），
      naval-history 把 1938-11 整段记为 "Contractors trials and commissioning"，
      并把完工日 1938-11-30 写在前面。见单舰 fact。

  - code: P1
    title: 地中海分队与本土海域（1938-11 至 1940-03）
    from: 1938-11-30
    to: 1940-04-07
    note: >-
      编入第 1 部族驱逐舰分队，1939-01 开赴马耳他加入分队，
      1939-04 分队改称第 4 驱逐舰分队。

      1939-10 随分队调回本土，在北海执行巡逻与护航。
      1939-11-30 与 Inglefield 一同救援失事的潜艇 Triad：
      在大风中成功带缆并把潜艇拖到斯塔万格附近的峡湾。

      1940-01 因推进机械故障频发与舰体渗漏（影响锅炉给水）退出现役，
      02-02 在 Govan 由建造厂修理 —— naval-history 注明这类汽轮机叶片缺陷
      与高速航行导致的结构应力在本级中是普遍问题。

  - code: P2
    title: 挪威战役（1940-04 至 1940-06）
    from: 1940-04-08
    to: 1940-06-04
    note: >-
      1940-04-08 由克莱德返回斯卡帕湾归队。04-19 为开往纳姆索斯的
      四艘法国运兵船补充护航，04-23 护送商船 Blackheath 进入纳姆索斯。

      05-02 纳姆索斯撤退中遭德机轰炸：两枚带啸声装置的炸弹在舰侧近失，
      一在左舷舰桥正横、一在右舷鱼雷发射管附近，两艘汽艇与一艘捕鲸艇被炸碎，
      破片穿透舰体、烟囱与上层建筑，约 20 人受伤、5 人伤重不治。
      伤員在苏格兰上岸，舰在斯卡帕湾修补。

      1940-06-05 随队前往冰岛方向拦截据报出现的德军舰艇，
      奉命探查 Seidisfjord。

  - code: P3
    title: 法罗群岛征用与本土任务（1940-06 至 1940-11）
    from: 1940-06-05
    to: 1940-12-01
    note: >-
      1940-06-20 与 Tartar、Mashona 一同前往法罗群岛，依「非常征用权」
      （Right of Angary）接收瑞典从意大利购入的四艘军舰。
      瑞典方面拒绝交出并一度准备对抗，但那些旧意舰连适航都做不到，
      最终移交；英方检查后判定缺陷过多，决定归还瑞典。

      此后在本土海域执行护航与反入侵巡逻。

  - code: P4
    title: 首次改装：X 炮座换成 4 英寸高平两用炮（1940-12 至 1941-01）
    from: 1940-12-02
    to: 1941-04-30
    note: >-
      **本舰最重要的一次火力配置变更。** 在泰恩河畔赫伯恩（Hebburn-on-Tyne）
      大修，除例行修理外：

      X 炮座的双联 4.7 英寸炮座换为双联 4 英寸高平两用炮座，
      主炮从 8 门减为 6 门，换来对空能力。

      naval-history 对这次改动的评价写得很直白：这是为了
      "overcome the lack of suitable defence against air attacks as
      established during the operations in Norway" —— 即挪威战役暴露的问题。

      1941-01 完成后编入西部海口（Western Approaches）护航，与 Cossack、
      Sikh、Zulu 同队，并参加了随后的俾斯麦搜索。

  - code: P5
    title: 俾斯麦追击与英吉利海峡（1941-05 至 1941-07）
    from: 1941-05-01
    to: 1941-07-31
    note: >-
      1941-05-26/27 参加对俾斯麦的夜间跟踪与雷击。

      0137/27 从 4,000 码在俾斯麦左舷舰尾方向齐射 2 条鱼雷，
      转向时观测到敌舰水线有一道明亮闪光（记录为命中）；
      随即遭猛烈还击并被夹叉，转向全速脱离，未中弹。
      0656/27 从 9,000 码再射 2 条，均未命中，被夹叉后以 28 节脱离。

      **原文用「观测到命中」，不是确认战果。** 战后对俾斯麦残骸的调查
      一般认为驱逐舰夜战未取得确认命中，两说并列。

      此后调往英吉利海峡防备德军 E 艇，本舰在此期间可能加装了
      单装 2-pdr（uboat.net 记四艘同级舰 1941-07 均在舰桥两舷各加 1 门；
      navypedia 记本舰加的是 20 mm Oerlikon，两说并列）。
      另曾赴伦敦德里装 286M 型雷达（uboat.net，未记月份）。

  - code: P6
    title: 伦敦大改装（1941-08-22 至 1941-10-31）
    from: 1941-08-22
    to: 1941-10-31
    note: >-
      在伦敦皇家船坞的商业船厂改装，改动幅度大于前一次：

      ① 加装 285 型炮术火控雷达（主炮用）；
      ② **拆除主桅**，以改善近程高炮的射界。

      10 月完成港口试航，10-31 出海试航后返斯卡帕湾归队。
      这套配置就是它沉没时的配置。

  - code: P7
    title: 地中海：邦角、锡尔特与马耳他（1941-11 至 1942-02-12）
    from: 1941-11-01
    to: 1942-02-12
    note: >-
      **本舰战史的最高点与终点都在这一段。**

      1941-12 与 Sikh、Legion、荷兰 Isaac Sweers 一同东调，
      12-13 在邦角外海夜袭击沉意大利轻巡洋舰 Alberico da Barbiano 与
      Alberto di Giussano（意方 960 人阵亡、650 人被 Cigno 救起）。
      12-17 参加第一次锡尔特湾海战，12-19 抵亚历山大加入第 14 驱逐舰分队。

      1942-01 起改驻马耳他，编为第 22 驱逐舰分队（与 Sikh、Zulu 同队），
      作为水面打击兵力袭击轴心国北非补给线。

      1942-02-12 约 0200：**在瓦莱塔大港 Dockyard Creek 入口的应急驱逐舰浮标
      系泊状态下被一枚炸弹命中机舱与齿轮舱，当场爆炸沉没。**
      驻马耳他期间非值更人员按惯例夜宿岸上掩体，因此仅 1 人阵亡 ——
      数字低不等于损失轻，舰本身完全报废。

      残骸处理：1942 年内打捞后移到 Sliema Creek 自沉；
      1945 年再次打捞，拖至马耳他外海沉放（naval-history 记 1945-05，
      uboat.net 记 1945-07-05，两说并列）。
