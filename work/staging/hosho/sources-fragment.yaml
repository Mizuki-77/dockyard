sources:
  - id: combinedfleet-hosho-trom
    title: IJN HOSHO — Tabular Record of Movement (combinedfleet.com)
    url: https://www.combinedfleet.com/Hosho.htm
    type: website
    tier: D
    role:
      - data
      - narrative
    operator: combinedfleet.com（Anthony P. Tully / Gilbert Casse，2014 修订增强版）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      本舰主力来源。逐条年月日，覆盖 1920-12-16 起工至 1947-05-01 解体完毕全生涯。
      「世界第一艘 purpose-built 航母」的原句在此（1922-12-27 条）。
      注意地址大小写：/Hosho.htm 可通，/hosho.htm 与 /hosho_t.htm 均 404；
      该链接由 combinedfleet 的 /cv.htm 航母索引页反查得到。
      口径提示：文中 1922-01-10 写 "Completed"，但与同页 "Commissioning is delayed …
      March~December 1922" 及 1922-12-27 "Commissioned" 冲突，本轮不采用该完成日。

  - id: navypedia-hosho
    title: HOSHO light aircraft carrier (1922) — Navypedia
    url: http://www.navypedia.org/ships/japan/jap_cv_hosho.htm
    type: website
    tier: D
    role:
      - data
    operator: navypedia.org
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      主尺度/排水量/动力/燃料/续航/武备骨架，另含各期改装逐条与 1923-1942 逐年舰载机表。
      口径提示一：起工记 16.12.1919、竣工记 16.12.1922，与 combinedfleet 的 1920/12-27 冲突，两说并存。
      口径提示二：武备栏写「4 x 1 - 76/40」，但同页 Modernizations 又只写「- 2 x 1 - 76/40」，内部不自洽。
      口径提示三：舰载机表把 1942-06 记为「8 B5N2」，与「凤翔无法运用 B5N」的记载矛盾，疑为笔误，不采纳但记录。

  - id: kasado-hosho
    title: 鳳翔型航空母艦 Hosho class Aircraft Carrier — 日本海軍艦艇データ（kasado.net）
    url: https://www.kasado.net/AircraftCarriers/Japan/Hosho_1922.html
    type: website
    tier: D
    role:
      - data
    operator: kasado.net
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      竣工時 / 1945-08 两列对照表，是本轮唯一同时给出两个时期锅炉型式、飞行甲板、
      升降机、拦阻装置与装甲分部位的来源。
      口径提示：装甲栏用「N/A」与「-」两种符号——比较可知「-」表示「该处无此项」、
      「N/A」表示「未查到」，但同一张表的雷达/声呐栏也全用「-」，故该栏不能当「无雷达」的证据。

  - id: naval-encyclopedia-hosho
    title: Hōshō (1921) — naval encyclopedia
    url: https://naval-encyclopedia.com/ww2/japan/hosho.php
    type: website
    tier: D
    role:
      - data
      - narrative
    operator: naval-encyclopedia.com
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      设计沿革（最初按 Campania 式水上机母舰起案 → 改为 Furious 式）、武备布置与射界、
      动力（4 座专烧 + 4 座混烧）、试航 26.66 kn、「no protection or armor」、
      「no catapult」两句原文出自此页。引 Conway's 1906-1921 / 1922-1947 为据。

  - id: japanese-warship-hosho
    title: 鳳翔【航空母艦】 Hosho — 大日本帝国軍 主要兵器（japanese-warship.com）
    url: https://japanese-warship.com/carrier/hosho/
    type: website
    tier: D
    role:
      - data
      - narrative
    operator: japanese-warship.com（旧「大日本帝国軍 主要兵器」）
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      日文技术细节 + 结构解说。1922 竣工時 / 1944 改造時两期要目对照。
      引『艦船要目公表範囲』（海軍省）为一手依据。含纵索式制动装置与前后机库
      「互不相通、高度也不同」的结构描述，以及 1944 甲板延长致复原性恶化的说明。

