  - id: navweaps-14cm-50-3ns
    title: Japan 14 cm/50 (5.5") 3rd Year Type — NavWeaps
    url: https://www.navweaps.com/Weapons/WNJAP_55-50_3ns.php
    type: website
    tier: C
    role:
      - data
    operator: navweaps.com
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      五十口径三年式 14cm 炮本体数据（炮身重 5,600-5,700 kg、初速 850-855 mps、
      射速 6-10 发/分、弹重 38.0 kg）。
      口径提示：本页 "Ship Class Used On" 只列主力舰与轻巡，**未提凤翔**，
      故本页只用于 weapon.* 本体字段，不用来证明「凤翔装过这门炮」——那句由
      combinedfleet TROM 与 naval-encyclopedia 支撑。

  - id: navweaps-8cm-40-3ns
    title: Japan 8 cm/40 (3") 3rd Year Type, 11th Year Type and Type 88 — NavWeaps
    url: https://www.navweaps.com/Weapons/WNJAP_3-40_3ns.php
    type: website
    tier: C
    role:
      - data
    operator: navweaps.com
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      三年式 40 口径 8cm 高角炮本体数据。**关键一句：「Although the Japanese designation was
      "8 cm," the actual bore diameter of all these weapons was 7.62 cm (3.0")」**——名义 8cm、
      实际 76.2 mm，录 bore 时必须按 76.2 记。
      口径提示：本页 "Mount/Turret Data" 只列战舰与轻巡的装舰（Ise、Nagato、Tenryu 等），
      **未提凤翔**，故只用于 weapon.* 本体字段；「凤翔装过它」由 combinedfleet TROM 与
      naval-encyclopedia 支撑。
      注意 navweaps 的炮位编号 WNJAP_8-40_3ns.htm 已 404，可用地址是 .php 结尾这一条。

