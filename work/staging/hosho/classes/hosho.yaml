# ============================================================================
# 凤翔级 / 凤翔 —— 世界上第一艘专门设计建造（purpose-built）并建成服役的航空母舰
#
# 2026-11-23 建 · 组 hosho · 采集 jp-cvl
# 原始页面与逐条英文原句见 work/staging/hosho/RESEARCH-NOTES.md
#
# 本文件放该级的设计值（船体、动力、防护、固定航空设施、舰炮/舰载机本体）。
# 凤翔是单舰级：计划中的二号舰「翔鹤（初代）」在华盛顿条约后从未起工
#（navypedia：「The planned second sister-ship Shokaku was never laid down
#  in accordance with decisions of Washington conference of 1922.」）
# 因此「同级舰差异」这一层实际不存在；随时间变化的武备/外形仍写进
# ships/hosho.yaml 与 slices/hosho.yaml。
#
# 三条「世界第一」的边界，写在这里免得后人再搞混：
#   1. 「全通式飞行甲板」的第一艘是英国改装航母 Argus（货客船改装）。
#   2. 「从设计阶段就按航母设计」最早开工的是英国 Hermes（1918-01）。
#   3. 「从设计阶段就按航母设计」最早**建成服役**的是凤翔（1922-12-27），
#      比 Hermes 早 13 个月 —— 这一条才是本站「世界第一」的准确含义。
#      原句见 combinedfleet TROM 1922-12-27 条与光人社 No.6 英译。
# ============================================================================

id: hosho
name:
  zh: 凤翔级
  en: Hōshō class
class_of:
  - hosho

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。
  例外：本级的排水量、飞行甲板、升降机等项在 1924 / 1936 / 1939 / 1944 四次
  改装中先后改变，凡有明确时点的都按改装的段落分条写，不合并。

facts:
  # ============================================================
  # 身份
  # ============================================================
  - field: identity.name_original
    value: 鳳翔（ほうしょう）
    src: [combinedfleet-hosho-trom, japanese-warship-hosho]
    valid: { from: 1921-11-13 }
    confidence: C
    note: >-
      combinedfleet：舰名与下水同日给出——「13 November 1921: **Launched and named HOSHO
      (Flying Phoenix).**」
      **日文读音**：日文维基要目写「ほうしょう/ホウシヤウ」，但那是 tier E 来源，不作 fact 依据；
      本轮可用的 D 级日文来源（japanese-warship）只写「鳳翔【航空母艦】 Hosho」，
      未标假名。故本条的读音部分不入库，只留汉字与拉丁转写。
      ⚠️ **改名日期未获取**：日文维基（E，仅线索）称计划时舰名是「竜飛（龍飛）」、1919 年 10 月改凤翔，
      本轮无第二个来源印证该日期，故 valid.from 只写到可确认的 1921-11-13（命名日）。

  - field: identity.name_zh
    value: 凤翔号
    src: [japanese-warship-hosho]
    valid: { from: 1919-10 }
    confidence: C

  - field: identity.name_en
    value: Hōshō
    src: [combinedfleet-hosho-trom]
    valid: { from: 1921-11-13 }
    confidence: C
    note: >-
      combinedfleet 在 1921-11-13 下水条给出英文舰名释义：
      「Launched and named HOSHO (Flying Phoenix).」

  # identity.name_note 写在 ships/hosho.yaml：本舰是单舰级，舰名释义（含「龍飛 / 飛龍」两说）
  # 属本舰特有内容，两处都写会让同一时间窗出现两个值。

  - field: identity.ship_type
    value: aircraft_carrier
    src: [navypedia-hosho]
    valid: { from: 1922-12-27 }
    confidence: C
    note: >-
      navypedia 页标题即「HOSHO light aircraft carrier (1922)」。
      hazegray 另有一句「Officially known as an aircraft depot ship」——
      即日本海军当年在舰种分类上把它挂在「航空母艦」的同时也当过特務船扱い，
      本条按注册表枚举取 aircraft_carrier。

  - field: identity.nation
    value: japan
    src: [combinedfleet-hosho-trom]
    valid: { from: 1922-12-27 }
    confidence: C

  - field: identity.operator
    value: 大日本帝国海軍（Imperial Japanese Navy）
    src: [combinedfleet-hosho-trom]
    valid: { from: 1922-12-27 }
    confidence: C
    note: "原句「27 December 1922: Commissioned in the IJN.」"

  - field: identity.era
    value: ww2
    src: [combinedfleet-hosho-trom]
    valid: { from: 1922-12-27 }
    confidence: C
    note: >-
      按注册表「按服役期定位」的说明：本舰 1922-12-27 服役至 1945 年，横跨战间期与二战。
      取 ww2 与本站既有日方航母（赤城 1927 服役、加贺 1928 服役、苍龙 1937 服役）
      的取值口径一致；若日后要按「大部分生涯在战间期」重排，本条应改 interwar。

  - field: identity.building_program
    value: 计划时舰种为特務船（仮称船名 第七号特務船）；建造訓令上由横須賀海軍工廠承造，实际请负给浅野造船所
    src: [japanese-warship-hosho]
    valid: { from: 1920-12-16 }
    confidence: C
    note: >-
      **「大正 7 年度／八六艦隊案」本轮不入库**：该说只见于日文维基要目栏（tier E，不能作 fact 来源），
      本轮可用的 D 级来源里没有第二个印证。
      可用部分（japanese-warship，日文 D 级）原句：
      「建造訓令上は横須賀海軍工廠が建造することになっていたが、第一次世界大戦後の不況に伴う
      救済政策の一環として、1916年（大正5年）に創業したばかりの浅野造船所に請負の形で建造が委託された」。
      即：训令上的建造者是横須賀海軍工廠，因一战后的不景气救济政策请负给浅野造船所。
      「特務船 / 第七号特務船」一项同样只见于 E 级来源，**保留在 note 里当线索，不作 fact 依据。**

