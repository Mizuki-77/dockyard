  # ============================================================
  # 防护 —— 全舰无装甲
  # ============================================================
  - field: protection.scheme
    value: none
    src: [hazegray-ijn-carriers, naval-encyclopedia-hosho, kasado-hosho]
    valid: { from: 1922-12-27 }
    confidence: C
    note: >-
      **这是「设计上就无装甲」，不是「查不到」，更不是「厚度 0」。**
      按注册表规定，scheme 取 none 时不写 armor.thickness，也不填 0。
      原句三条：
      ① hazegray「Hosho experimental aircraft carrier … **Armor: none**」；
      ② naval-encyclopedia「The Hōshō was armed like a light cruiser, but with a superior tonnage …
         and **received no protection or armor. She already relied on an escort to operate safely.**」；
      ③ kasado 装甲防御表（竣工時／1945-08 两列）：水線部舷側装甲 N/A／N/A、
