    value: ロ号艦本式水管锅炉 8 座（重油专烧 4 座 + 煤油混烧 4 座）；后改全重油专烧
    src: [kasado-hosho, navypedia-hosho, naval-encyclopedia-hosho, japanese-warship-hosho]
    valid: { from: 1922-12-27 }
    confidence: C
    note: >-
      **「凤翔是混烧还是重油专烧」的答案：竣工时是混烧。** 本条是全站该问题的唯一登记处，
      `ships/hosho.yaml` 不重复。
      竣工时原句四条一致：
      ① kasado「ロ号艦本式重油専焼水管罐:4基／ロ号艦本式炭油混焼水管罐:4基」（4+4=8）；
      ② 日文维基要目「ロ号艦本式専焼缶4基、同混焼缶4基」；
      ③ naval-encyclopedia「eight Type B water-tube Kampon boilers, four oil-fired and the other
         coal/fuel mixed-fired」；
      ④ japanese-warship「ロ号艦本式ボイラー 重油4基、混焼4基」。
      燃料侧证：重油 2,700 t + 石炭 940 t（navypedia「Fuel, t oil 2700, coal 940」／
      kasado「重油:2,695t／石炭:940t」）。
      ⚠️ **改烧重油的时间三说并存，不裁决，故本条不给 valid.to：**
      · navypedia（Project history）：「In 1934-1936 … **boilers were converted to oil-firing.**」
      · 日文维基（tier E，仅线索）：「機関関係では、**1926年から1928年にかけて混焼缶を
        重油専焼缶に換装した**。」
      · **反向证据**：kasado 的 1945-08 栏仍一字不差地写「重油専焼水管罐:4基／炭油混焼水管罐:4基」
        ——即该表认为到终战都还是混烧。japanese-warship 亦记改装含「混焼缶を重油専用缶に変更」但未给年份。
      日文维基另记最终时锅炉为「大型缶4基、小型缶4基」（仍 8 座，型号已换）。

