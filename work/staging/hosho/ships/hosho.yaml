id: hosho
name:
  zh: 凤翔号
  en: Hōshō
class: hosho
note: 世界上第一艘「从设计阶段起就作为航空母舰设计、并建成服役」的军舰（1922-12-27 服役， 比英国 Hermes 早 13 个月建成）。注意边界：全通甲板的第一艘是改装航母 Argus； 最早按航母设计**开工**的是 Hermes（1918-01）。
open_ended_note: 本舰参数自 1922-12-27 服役至 1945-10-05 除籍，此后至 1947-05-01 解体期间作为复员运输舰。 与舰级共用的设计值写在 classes/hosho.yaml；此处只写分期数据与本舰特有的记载。
facts:
- field: identity.name_original
  value: 鳳翔（ほうしょう）
  src:
  - combinedfleet-hosho-trom
  - japanese-warship-hosho
  valid:
    from: 1921-11-13
  confidence: C
  note: '命名时点：combinedfleet「13 November 1921: Launched and named HOSHO (Flying Phoenix).」 japanese-warship 记「そうして2年で竣工した【鳳翔】（**建造当初は「龍飛」**）は…」， 即建造当初（起工前后）的舰名不是凤翔。 **读音**「ほうしょう」出自日文维基要目（tier E），本轮可用来源未标假名，
    本条读音部分只作注音参考，不作独立依据。 ⚠️ **改名日期未获取。** 日文维基（E，仅线索）称计划时舰种为特務船、 按特務艦命名基准预定取津軽半島最北端「竜飛（龍飛）崎」→「竜飛（龍飛）」， 1919 年（大正 8 年）10 月改名鳳翔——**1919-10 这个日期本轮没有非 E 级来源印证，不写进值。** 另有一说称原始舰名是「飛龍」：navypedia 表头「鳳翔 [Hosho] (**ex-飛龍
    [Hiryu]**)」， hazegray 在舰名条目下另起一行写「**ex-Hiryu**」。 「龍飛」与「飛龍」是两个不同的名字（前者取自津軽半島龍飛崎，后者是「飞龙」）， 两类来源各持一说，**并列不裁决**。'
