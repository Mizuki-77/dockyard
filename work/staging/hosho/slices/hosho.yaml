# 凤翔 状态切片
# 2026-11-23 建 · 组 hosho
#
# 分片依据：本舰外形的四次实质变化点（1924 撤岛、1936 烟囱固定与武备换装、
# 1939 升降机扩大、1944 甲板延长）+ 两次身份变化（1942-07 转练习舰、1945-10 转复员舰）。
# 每片的 note 写「这一片到底变在哪」，不抄日期表。

ship: hosho
slices:
  - code: P0
    title: 起工、下水与艤装（1920-1922）
    from: 1920-12-16
    to: 1922-12-26
    note: >-
      1920-12-16 在横浜鶴見的浅野造船所以「航空母舰」名义起工（计划时舰种是特務船）。
      训令上建造者是横須賀海軍工廠，实际因一战后的不景气救济政策，以请负形式委托给
      1916 年才创业的浅野造船所——这是本舰建造关系上最容易写错的一处。
      1921-11-13 下水并命名「鳳翔」，当天下水后即被拖往横須賀海軍工廠进行艤装。
      1922-11-30 全力公试测得 26.66 节（设计 25 节）。
      起工年份另有 1919 一说（navypedia / kasado，及『艦船要目公表範囲』），两说并列。

  - code: P1
    title: 竣工时外形（1922-1924）——有舰岛的「不彻底」平甲板
    from: 1922-12-27
    to: 1924-06-05
    note: >-
      世界第一艘 purpose-built 航母建成服役（比英国 Hermes 早 13 个月）。
      外形：右舷前部一个小舰岛（含舰桥与航空指挥所）+ 三脚桅 + 可倒式吊车；
      飞行甲板全长 168.25 m、宽 22.62 m，**前部约五分之一向下倾斜 -5°** 帮飞机加速；
      右舷三部可倒式烟囱。
      武备：14cm 单装炮 4 门（舷侧前后各一，左右共四）+ 8cm 单装高角炮 2 门
      （装在后升降机前方、可降入甲板下）+ 路易斯 7.7mm 单装机枪 2 挺。
      动力：8 座 ロ号艦本式锅炉，其中 4 座重油专烧、4 座煤油混烧；燃油 2,700 t + 燃煤 940 t。
      制动：英国式**纵索式**（日本海军与英国海军当年都用这一式），后期才换横索。
      无弹射器，全生涯都没有。
      服役当日（1922-12-27）大部分航空设备仍未到位——combinedfleet 原句
      「However much of her aviation equipment is still lacking.」

  - code: P2
    title: 第一次改装后——确立平甲板外形（1924-1936）
    from: 1924-06-06
    to: 1936-03-30
    note: >-
      **本舰外形变化里最关键的一次。** 1924-06-06 入横須賀海軍工廠船坞，08-20 出坞：
      舰岛、三脚桅、吊车全部拆除（原因原文：它们部分遮挡飞行甲板与飞行员视线），
      飞行甲板前部改为水平，两门 8cm 高角炮前移。
      飞行指挥改在**从飞行甲板侧面向外伸出的平台**上进行——这就是此后日本航母
      「平甲板（flush deck）」传统的起点，navypedia 原文说它
      「has become characteristic for whole generation of Japanese aircraft carriers」。
      1925-07-02 在前升降机后方加装液压防冲网（3 秒立起）。
      1925-1928 大量试验：各种拦阻装置、光学助降装置、航母运用战术都在本舰上试出来的。
      1928-04-01 编入第一航空战队（与赤城）。1926-1928 或 1934-1936 间锅炉改全重油专烧（两说）。
      1932 年第一次上海事变与加贺同赴长江口，1932-02-05 日本海军首次空战。

  - code: P3
    title: 第四舰队事件后的大改装（1936-1941）——烟囱固定、武备换代
    from: 1936-03-31
    to: 1941-12-06
    note: >-
      1935-09-25 第四舰队事件中飞行甲板与上部结构受损（naval-encyclopedia 记
      「the forward flight deck collapsed」）。1935-11-22 入横須賀船坞，1936-03-31 出坞：
      · **三部可倒式烟囱固定为水平（口部略朝下）**，起倒机构整体废除——日文维基记此举减重约 60 t；
      · 前部飞行甲板支撑加强并增加数量；
      · 撤去 8cm 高角炮、吊车、上部航空燃油舱（8cm 何时撤另有 1940-10 一说）；
      · 加装九三式 13.2mm 连装机枪 6 座 12 挺；
      · 前部机库与舰桥前侧、后部机库附近舰体加强。
      复原性改善后稳心高降到 1.11 m（naval-encyclopedia），横摇减小，着舰反而好转。
      **1939-08 升降机扩大**（为新一代舰载机）：前 12.8 × 8.5 m、后 13.7 × 7.0 m。
      1937 年中日战争：上海、广东方面；1937-12-01 转预备。
      1940-10 换装九六式 25mm 连装机枪（4 座 8 挺，一说 6 座 12 挺），舷侧增设突出炮座。
      1940-12-23 海军结论：本舰无法运用 A6M / D3A / B5N 等新机。

  - code: P4
    title: 太平洋战争前期（1941-12～1942-06）——主力部队的 8 架九六舰攻
    from: 1941-12-07
    to: 1942-06-14
    note: >-
      1941-12-07/08 珍珠港：编入主力部队航空部队，与瑞凤同行动；12-10 夜放飞后因无线电静默
      与主力失联，12-11 在小笠原以东 500 海里被找回。
      1942-05-29 中途岛出击：位于山本主力部队战列舰纵队之间、大和号左后方，
      护航为川内 + 第 11、19 驱逐队；主力部队在南云机动部队后 300 英里，全程未与美军交战。
      **舰载机：8 架九六式舰攻 B4Y1**（combinedfleet 原句「her meager complement of eight
      Type-96 Yokosuka B4Y "Jeans" aircraft」）。日文维基另记同时期有九六舰战 9 架 + 补用 2，
      合计 19 架定数；navypedia 则误记为 8 架 B5N2。三说并列。
      1942-06-05 0420 一架 B4Y 发现漂流中的飞龙并拍照——这是本舰在整场战争里最著名的一个动作。
      1942-06-14 返泊柱岛，06-20 全部九六式机下舰。

  - code: P5
    title: 练习航母（1942-07～1944-05）
    from: 1942-07-14
    to: 1944-05-31
    note: >-
      1942-07-14 转第三舰队附属，成为着舰练习舰；此后不再有固定编制机。
      1943-01-15 与龙鳯、鹿屋空、筑城空、夕风编成第五十航空战队，专司舰载机乘员养成。
      1944-02-02 起为第三舰队训练航母飞行员。全程在濑户内海，护航驱逐舰夕风。
      梅谷舰长把自己的差事形容为「幼稚園の保母さんの役目」（日文维基引）。
      这一段外形基本没变，但**舰上已无实战编制**——1942-08 起定数 0。

  - code: P6
    title: 1944 年改装——甲板延长到 180.8 m，主炮撤除
    from: 1944-06
    to: 1945-03-18
    note: >-
      1944-06 中旬入吴船坞，06-24 出坞。飞行甲板前后延长至 **180.8 m**（宽度仍是 22.7 m，
      受船宽限制无法加宽），升降机再扩大为前 8.5 × 12.8 m、后 13.7 × 11.0 m，烟囱改为下倾。
      **14cm 单装炮 4 门撤除**——时点两说：navypedia 与日文维基记 1942 年，combinedfleet 记 1944-06。
      副作用有原文：舰桥前方视界与复原性显著恶化，外洋航行事实上不可能，只能在内海用。
      1944-09 参与东宝电影《雷撃隊出動》拍摄（片中扮演美军航母）。

  - code: P7
    title: 终战前后（1945-03～1945-09）——伪装系泊与唯一一次被弹
    from: 1945-03-19
    to: 1945-09-30
    note: >-
      **全生涯唯一确认的被弹**：1945-03-19 0532，吴军港空袭中遭 7 机攻击，
      后部飞行甲板中 3 弹，弹重不超过 50 kg，伤轻，甲板 4 个小洞（最大约 1 m），
      **战死 6 名**。03-21 入吴修理，03-27 完工。
      1945-04-20 定为三等舰（仍保有运用飞机的能力）；1945-06-01 定为四级预备舰，
      附吴港防备队，乘员减半 50%。
      1945-05-28 起系泊于西海町（西ノ見島）东岸、龙鳯泊地以南的小湾，**施以严密伪装**；
      07-05 仍在原处。07-30 吴镇守府命在凤翔、龙鳯周边陆上配置 25mm 机枪阵地，
      并从大破着底的利根、大淀抽调 25mm 单装机枪与乘员——本舰最后成了防空炮台。
      1945-08-15 终战时几乎无伤（日文维基：终战时可航行的航母仅凤翔、龙鳯、葛城三艘，
      其中几乎无伤只有凤翔）。
      07-24 吴空袭另有「中 1 弹」一说，但 combinedfleet 注 3 明言当日无损伤记录，两说并列。

  - code: P8
    title: 复员运输与解体（1945-10～1947-05）
    from: 1945-10-05
    to: 1947-05-01
    note: >-
      1945-10-05 除籍，转盟军使用。与轻巡鹿岛同行，赴 Wotje、Eniwetok、Jaluit 接运日方人员：
      1945-10-16 Wotje 上船 700 人，10-22 Jaluit 上船，11-03 返浦贺（700 + 311 人）。
      日文维基记共 9 个往返、运送约 4 万人。
      **外形在这一段又变了一次**：1945-12-05 入日立造船因岛船厂船坞，
      拆掉覆盖舰首的前部飞行甲板，以改善舰桥视野——所以复员期的本舰与战时外形不同。
      1946-06 从海军退役；1946-08-31 移交内务省、同日开始解体；
      1947-05-01 在日立造船桜島工场解体完毕。
      同一工场随后拆解了日本最后的航母葛城——日本航母的第一艘与最后一艘在同一处消失。
