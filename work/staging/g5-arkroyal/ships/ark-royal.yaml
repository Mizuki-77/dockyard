      historyofwar 原文「Fortunately only one crewman was killed」。
      对照：中雷时舰上有约 1,700 人（1,487 人先撤到 LEGION，之后舰上仍留
      250 人继续抢救），沉没时的横倾是缓慢发展的（10° → 12° → 18° → 20° →
      27° → 35° → 45° → 90°），整个过程给了十几小时离舰时间 ——
      这是「只死一人」的直接原因。

