  en: HMS Ark Royal
class: ark-royal
open_ended_note: >
  本舰参数的有效期到 1941-11-14 沉没为止。
  服役三年间防空配置变过一次（1941-05 增加两座八联 pom-pom）、
  舰载机编制换过三轮，这些问题落在状态切片与对应的 fact 时间窗里，
  不在本节重复。

