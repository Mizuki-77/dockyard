      poor training of personnel in the correct way to deal with extensive
      flooding … Following an inquiry into her loss extensive design changes were
      introduced into all new ships and arrangements for damage control in
      existing ships were modified」。
      **调查委员会的原件（ADM 编号）本站未取得**，故不写具体档号。

