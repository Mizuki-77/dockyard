# ============================================================================
# 单舰：HMS Ark Royal（皇家方舟号，舷号 91）
# ----------------------------------------------------------------------------
# 本文件只写「皇家方舟号这一艘船」的事实：建造、逐期改装、战历、损失。
# 该级的设计值（主尺度、动力、装甲方案、航空设施、固定武备）写在
# work/staging/g5-arkroyal/classes/ark-royal.yaml。
#
# 解析顺序：单舰 fact → 舰级 fact → 未记载。单舰命中即覆盖舰级。
#
# 【这一条船为什么值得单列】
# 它是皇家海军第一艘「从铺龙骨起就按航母设计」的大型舰队航母，也是二战中
# 英国最出名的航母 —— 出名有一半是因为德国宣传机构反复宣布它已被击沉
# （1939-09 到 1941-11 之间至少宣布过十几次），另一半是因为它真的打了
# 几乎所有早期战场：挪威、米尔斯克比尔、达喀尔、斯帕蒂文托、追击俾斯麦、
# 马耳他补给。它最后死于一次鱼雷命中 —— 而那次命中之所以致命，
# 不是因为装甲不够厚，是因为**它在设计上把三组锅炉房排成一列横贯全船，
# 又没有柴油发电机**：一发鱼雷打掉右舷锅炉房 + 主配电板之后，
# 全船失去电力，排水泵就再也转不起来。
#
# 【置信度说明】
# 技术数据取自 navypedia（D 档）与 uboat.net（D 档）两条独立专题站互校，
# 冲突处并列。战历年份取自 naval-history.net 的逐月年表（D 档，但是本站
# 目前唯一覆盖全生涯的非百科来源）。
# 逐条标注「未获取」的地方是本项目的硬规则 —— 不推算、不按姊妹舰类推。
# ============================================================================

id: ark-royal
name:
