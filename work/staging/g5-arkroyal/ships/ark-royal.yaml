    value: 1487
    unit: persons
    src: [naval-history-arkroyal]
    valid: { from: 1941-11-13 }
    confidence: B
    note: >
      naval-history 原文「By 1648 LEGION had embarked 1487 crew from ARK ROYAL」。
      这是**第一批撤走的人数**，不是最终生还总数：
      之后 04:30 又有 250 名留守人员离舰（多数顺绳下到拖船 ST DAY），
      而更早还有部分人员在 17:40 前后经小艇转运。
      **最终生还总人数来源没有给 —— 未获取**，故不写第二条 fact。

  - field: service.fate_category
    value: >-
      单枚航空鱼雷命中右舷舯部 → 右舷锅炉房、主配电板、下层操舵位置同时进水 →
      全船失电、无柴油发电机备用 → 排水泵无法运转 → 拖带中缓慢横倾，
      次日晨翻沉
    src: [naval-history-arkroyal, navypedia-arkroyal, historyofwar-arkroyal]
    valid: { from: 1941-11-13 }
    confidence: A
    note: >
      **这是本舰最该被讲清楚的一件事：它不是因为「装甲薄」沉的。**
      一发 300 kg 战雷头就把一艘 22,000 t 的航母弄沉了，原因是一条设计链：
      ① 三组锅炉房排成一列横贯全船（historyofwar：「She had three boilers and
         three engine rooms, carried in a row across the ship」），
         所以右舷中雷会同时打穿右舷锅炉房与相邻舱室；
      ② 主配电板就在那个位置，一炸即失；
      ③ **全船没有柴油发电机**，电力全靠汽轮发电机
         （navypedia：「Absence of diesels-generators (all electric power was
         produced by steam turbine-generators) was a significant lack …
         and has played a fatal role in her fate」）；
      ④ 失电 → 泵停 → 进水不受控（naval-history：「she didn't have a diesel
         generator back up, the pumps could not be operated; so water flowed in
         unchecked」）；
      ⑤ 更隐蔽的一条：三组锅炉的烟道从下层机库底下穿过
         （historyofwar：「The smoke ducts linking the three sets of machinery ran
         below the lower hanger, and would prove to be a fatal weakness」）——
         水位上升后海水从烟道灌进另外两个锅炉房。
      破口约 130 × 30 ft（naval-history 另处写 115 ft 长，见下方并列条）。
      英国海军部事后调查引入了全面设计修改：电力分配改造、加装柴油发电机、
      强化损管规程、增加电池应急照明（naval-history 有整段记述）。

  - field: service.fate_authority
    value: 事后调查认定损管处置与人员训练不足是沉没的重要成因，并据此修改全部新造舰的电力与损管设计
    src: [naval-history-arkroyal]
    valid: { from: 1942-01-01 }
    confidence: B
    note: >
      naval-history 原文：「Her loss after being hit by a torpedo from U81 clearly
