sources:
  - id: naval-history-arkroyal
    title: HMS Ark Royal — Service History (Royal Navy Warships in World War 2)
    url: https://www.naval-history.net/xGM-Chrono-04CV-HMS_Ark_Royal.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.net（正文 Lt Cdr Geoffrey B Mason RN (Rtd)，c. 2003；编制与动态编辑 Mike Simmonds）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      逐日/逐月服役年表，覆盖 1934 年下单到 1941-11 沉没，另附 2002 年残骸发现
      与战后调查结论。**是本站目前唯一覆盖本舰全生涯的非 E 档来源**，
      也是唯一给出损失过程逐刻时刻（15:41 中雷 / 16:48 撤离 1,487 人 /
      次晨 06:19 翻沉）的来源。
      口径提示：
      ① 大量引用方括号内的编队与作战背景注，正文与注要分开读 ——
         例如 1940-04-10 击沉 KÖNIGSBERG 那一段，执行者是留在岸上的
         800/803 中队，不是本舰本身；
      ② 沉没时刻与该站自己的 uboat.net 引用（08:13）不一致，已并列；
      ③ 破口尺寸同一页出现 130×30 ft 与 115 ft 两个数字，已并列；
      ④ 本页的「General Information」段是本站全篇技术参数的主要来源之一，
         但锅炉台数写「Three Boiler Rooms」而不写每室台数，
         与 navypedia 的 6 座说法并存。
      **SSRF 提示**：本机 DNS 把该域解析到 198.18.x.x（代理网段），
      web_fetch 会被 SSRF 拦。用 PowerShell 的 Invoke-WebRequest 直连可抓（实测 200）。

  - id: navypedia-arkroyal
    title: ARK ROYAL fleet aircraft carrier (1, 1938)
    url: https://www.navypedia.org/ships/uk/brit_cv1_ark_royal.htm
    type: website
    tier: D
    role: [data]
    operator: navypedia.org
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      主尺度、排水量、动力、装甲分区、航空设施（机库/升降机/弹射器/航空汽油）
      与逐月舰载机编制表的最全单页来源。本舰绝大多数尺寸类 fact 取自此页。
      口径提示：
      ① 长度栏「208.8 pp / 243.8 oa」并存，而 243.8 m 含舰艉飞行甲板悬伸段
         （本页自己写「the big aft overhang of a flight deck which at the expense
         of it significantly exceeded a hull length」）——
         拿它跟别的舰排高低会高估船体长度；
      ② 飞行甲板栏「219.5 (useful length)」是可用长度，不是甲板全长；
      ③ 装甲栏「lower hangar deck: 89 over engines, magazines and aviation
         fuel tanks」是局部覆盖，不是整层；
      ④ 站内对本舰无柴油发电机的评论（「Absence of diesels-generators …
         has played a fatal role in her fate」）是理解沉没原因的关键句。
      本页「Armament」栏把 47 mm 3-pdr 礼炮与 12.7 mm 机枪都列进了装备表 ——
      本站照录进 armament.mount.summary，但为它们单建的武器实体
      只有型号身份三条，没有任何性能参数（NavWeaps 无对应页可引）。

  - id: uboatnet-arkroyal-class
    title: Ark Royal class Aircraft Carriers — Allied Warships of WWII
    url: https://uboat.net/allies/warships/class/99.html
    type: website
    tier: D
    role: [data, narrative]
    operator: uboat.net（Guðmundur Helgason）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      舰级页 + 「Notes on class」整段技术描述，是本站关于本舰**水下防护构造**
      与**装甲甲板布置**最详细的一段英文原文：
      「a sandwich type underwater protection with a 1½in protective bulkhead
      13ft 4½in from the side amidships … designed to withstand a 750lb charge
      but trials while Ark Royal was building showed that the bulkhead
      stiffeners had to be modified」；
      「there was a 3½in armour deck at the various levels of the upper edge and
      over the steering gear」。
      同页还给了几处别处没有的细节：升降机是双层平台（所以下层机库到甲板要三次动作）、
      战术直径大到 1010 码（「the tactical diameter was undesirably large at
      1010yds」）、4.5 in 炮座可越过飞行甲板向另一舷开火、
      1941-05 增加两座 pom-pom。
      口径提示：
      ① **编制记 1,570，与 navypedia/historyofwar 的 1,580 差 10 人**；
      ② **排水量用 BRT 这个商船吨位单位记 22000**，与「22,000 t 标准排水量」
         数值相同但单位含义不同，本站按 t 记并在 fact note 里说明；
      ③ 上层机库 568 ft（173.1 m）与本舰页的「usable area 720ft x 95ft」
         是两个不同的量（长度 vs 可用面积），不要混。

  - id: uboatnet-arkroyal
    title: HMS Ark Royal (91) — Allied Warships of WWII
    url: https://uboat.net/allies/warships/ship/3257.html
    type: website
    tier: D
    role: [data, narrative]
    operator: uboat.net（Guðmundur Helgason；本页 2022-03 建立、2024-04 最后更新）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      单舰页。给出建造/服役/损失的四个日期（Ordered 1935-04-17、Laid down
      1935-09-16、Launched 1937-04-13、**Commissioned 1938-12-16**）、
      沉没位置 36°03'N 4°45'W、**沉没时刻 08:13**、三任舰长姓名与任期，
      以及一份极长的「Notable events」逐次行动记述。
      口径提示：
      ① **服役日 1938-12-16 与 navypedia/naval-history/FAA 的 1938-11-16 冲突**，
         本站并列不裁决；
      ② **沉没时刻 08:13 与 naval-history 年表的 06:19/06:24 冲突**，并列；
      ③ 本页对 1941-05-26 的空中误击有一段独立记述，可作 naval-history 的互证：
         「the supposed enemy was HMS Sheffield which managed to avoid all
         torpedoes. The Bismarck at that time was some 15 nautical miles to the
         southward」；
      ④ 本页自注「information regarding operations by the Fleet Air Arm (FAA)
         aircraft of HMS Ark Royal is not complete on this page」——
         舰载机出动细节要以 naval-history 年表为准。
      页面规模很大（约 83 万字符纯文本），引用时注意定位到具体日期段。

  - id: uboatnet-u81
    title: The Type VIIC U-boat U-81 — German U-boats of WWII
    url: https://uboat.net/boats/u81.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: uboat.net（Guðmundur Helgason）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      U-81 的艇史页。本舰沉没段的德方视角来源：
      「U-81, having recently entered the Mediterranean, learned the British
      Force H was passing through on its way to Gibraltar. She managed to
      intercept, and fired from extreme range to sink the aircraft carrier
      HMS Ark Royal. The destroyer escort delivered a punishing depth charge
      attack with 130 depth charges counted, but the boat escaped.」
      口径提示：
      ① **深水炸弹数 130 与 naval-history 记的 162 枚冲突**，两说并列；
      ② 该页把 U-81 的成功记作「1 warship sunk, total tonnage 22,600 tons」，
         这个 22,600 t 与本站的 22,000 t 标准排水量/27,720 t 满载都不是同一口径，
         是 uboat.net 自己的战果计量方式，不引用为舰艇参数；
      ③ 击沉日期该页记 1941-11-13（命中日），与本舰页的沉没日 11-14 是两个事件。

  - id: historyofwar-arkroyal
    title: HMS Ark Royal (1937-1941)
    url: https://www.historyofwar.org/articles/weapons_HMS_Ark_Royal.html
    type: website
    tier: D
    role: [data, narrative]
    operator: HistoryOfWar.org（Dr John Rickard，2010-07-14）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      独立的二次叙述，篇幅不长但在三处提供了别处没有的关键判读：
      ① **干舷对照**：「The flight deck was 56ft above the deep load waterline
         (compared to 38ft on the Illustrious class)」—— 这是把本舰与继承它的
         装甲航母路线做量化对比的唯一直接来源；
      ② **沉没机理的因果链**：「As she settled lower in the water the engine
         intakes were submerged. This allowed water to flood into all three
         boiler rooms」，以及「The smoke ducts linking the three sets of
         machinery ran below the lower hanger, and would prove to be a fatal
         weakness」；
      ③ **1940-06-13 对 SCHARNHORST 的战果更正**：英方当时判两弹命中，
         实际只有一弹且未爆。
      口径提示：
      ① 该页技术参数栏写「She had three boilers」，与 6 座说并存，
         本站并列不裁决；
      ② 该页把 4.5 in 炮座记作「open-backed mountings … could fire across
         the flight deck」，与 uboat.net 的「apart from blast effects could
         fire across the flight deck」互证；
      ③ 该页 1940-04-10 的 KÖNIGSBERG 空袭明确写「Nos.800 and 803 Squadrons
         had been left behind during that move」，即岸基出击、本舰不在场 ——
         这条与 naval-history 互证，是本站正文特别注明「本舰的飞机而非本舰」的依据。

  - id: faa-arkroyal-archive
    title: HMS Ark Royal II — Aircraft Carrier Database (Fleet Air Arm Archive 1939-1945)
    url: https://web.archive.org/web/20081002151503/http://www.fleetairarmarchive.net/Ships/Ark_Royal2.html
    type: website
    tier: D
    role: [data, narrative]
    operator: Fleet Air Arm Archive 1939-1945（原站已下线，本 URL 为 Wayback Machine 快照）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      中队勤务表（逐中队 × 在舰起止月 × 机型）是目前最详细的一份，
      本舰逐期舰载机编制的第二个独立来源。原文格式：
      「800 Jan 1939-April 1941 Skua II」「803 April-Oct 1940 Skua II/Roc I」
      「828 Oct 1941 Albacore I/Swordfish I」等。
      同页还给出：
      ① 尺寸「685 pp, 721.5 wl, 800 oa x 94.75 x 27.75 feet」——
         **这是本站唯一给出水线长的来源**（721.5 ft = 219.9 m，本站换算）；
      ② 排水量「22,352 tons standard ; 28,143 tons full load」，与
         navypedia/historyofwar 的 22,000/27,720 各差约 400 t，并列不裁决；
      ③ 续航「7,600 nmiles at 20 knots」，与 navypedia 的 10,300(16)、
         historyofwar 的 11,200 miles at 11 knots 三说并列；
      ④ 战后残骸位置「45nm ESE of Gibraltar」。
      口径提示：该站成文于 2001 年，无残骸实际勘测数据；
      沉没时该页写「13 November 1941」，与本站并列的 11-14 说不同，属命中/沉没
      两个事件的日期混用。**原站已下线，只能通过 Wayback 访问。**

  - id: how-arkroyal-open-sided
    title: Open-sided versus closed hangars (document)
    url: https://www.armouredcarriers.com/opensided-versus-closed-hangars-in-aircraft-carriers
    type: website
    tier: A
    role: [data]
    operator: armouredcarriers.com
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      1930 年代海军部内部备忘录的转录（对比开放式与封闭式机库）。
      本组**未直接引用它的数值进 fact** —— 它讲的「the new ARK ROYAL has a
      displacement of 32,500 tons」「the new Light Carrier has a standard
      displacement of 18,000 tons」指的是 1942-43 年的**新一代**设计，
      不是本舰（本舰 22,000 t）。这条登记的目的是留一个易错点的记录：
      该站上的「ARK ROYAL」字样**大多指后续舰或后续设计**，
      引用前必须核对年份语境。
      本组在 `RESEARCH-NOTES.md` 的「卡住的地方」一节记了这件事。
