# 1. `losses.note`（日方）写「飞机损失约 248 架」。核实：248 是**编制总数**（NHHC 原句
#    "All 248 carrier aircraft were lost"），而南云战斗详报的**空中战损只有 44 架**。
#    两个词必须分开，否则读者会以为来源打架。建议改成：
#    「舰载机编制 248 架全损（多数随舰沉没）；其中空中战损 44 架（南云战斗详报 Table 8）」。
#
# 2. `losses.note`（日方）写「舰载机飞行员阵亡约 110 名」。110 有硬出处（NHHC H-006-1：
#    36 舰上 + 74 空中），**可以保留并升级为 A 级**；但同文紧接着说
#    「It was not the loss of pilots at Midway that crippled Japan's ability to wage offensive
#    naval operations」——**建议把「这批熟练飞行员比航母更难补充」这句改成
#    「NHHC 认为决定性损失是航母本身与约 700 名航空机务人员，而非飞行员」**，
#    否则与最新官方史学口径相反。
#
# 3. `losses.note`（美方）写「TBD 三队几乎全灭（41 架出击、35 架被击落）」。
#    「35 架被击落」宜改为「35 架损失、6 架返回航母（其中仅 3 架仍可用）」——
#    NHHC 原句是 "only six of the TBDs made it back to the carriers; only three of the aircraft
#    were flyable"，没有说全部 35 架都「被击落」。
