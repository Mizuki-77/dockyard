    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      **大本営発表（1942-06-10 15:30）的日文原文转引**，是本轮唯一拿到日文原始措辞的来源：
      「米航空母艦エンタープライズ型１隻とホーネット型１隻撃沈▽飛行機約１２０機撃墜」。
      并附现代表述「大本営は虚構の戦果を発表し、京都新聞など全国の新聞は追従して「大戦果」と報道」。
      ⚠️ 这是**报纸引大本営発表**，不是大本営发表原件；引用层级应写「转引自《京都戦時新聞》第 4 号」。

