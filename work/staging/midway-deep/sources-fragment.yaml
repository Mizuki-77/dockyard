  - id: ss-introduction-shattered-sword
    title: Shattered Sword — Introduction (free sample PDF, Potomac Books)
    url: https://www.shatteredswordbook.com/ShatteredSwordIntroduction.pdf
    type: document
    tier: C
    role:
      - narrative
    operator: Jonathan Parshall & Anthony Tully / Potomac Books
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      正式出版物的导言（非讲稿），比已登记的 `parshall-midway-brief`（2006 Historicon 讲义）更适合作
      正文依据。**核心价值：把「精英飞行员全灭」明确列为谬见**：
      "• Japan's elite carrier aviators were all but wiped out during the battle. All of these are
      **fallacious**." 另有「after six months of war, Japan's naval aviation arm was already balanced
      on a knife's edge」等战略判断。
      ⚠️ 仅导言 7 页，无页码级附录，引用时不得冒充全书数据。

  - id: usni-messaging-after-midway
    title: 'Timeless Lessons From the Messaging After Midway (Naval History, June 2025)'
    url: https://www.usni.org/magazines/naval-history/2025/june/timeless-lessons-messaging-after-midway
    type: paper
    tier: C
    role:
      - narrative
    operator: Lieutenant Jack Tribolet, USN / U.S. Naval Institute
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      **日方宣传口径分阶段释放的唯一成体系叙述**：6/11 Japan Times 头条「Navy Scores Another Epochal
      Victory」自称击沉 2 艘美航母、**同时承认损失 2 艘**；6/21 才承认另 2 艘「因不明损伤无法运作」。
      另有对轴心盟友说谎→意大利在阿拉曼后公开归咎日本海军；以及「把生还者隔离一年以上，反而自损
      经验」这条长期后果。
      ⚠️ **该文自身有硬伤**：称美国头条「7 July 1942, hitting the stands three days after the battle」，
      但中途岛是 6/4-7，距 7/7 已一个月。**「三天后」这句不可引用。**
      直连 403，经 Wayback：20260604112236id_

  - id: kyoto-shimbun-midway-daiseika
    title: 【京都戦時新聞を読む】ミッドウェー海戦「大戦果」 嘘の「勝利」、どう伝えたのか（京都新聞）
