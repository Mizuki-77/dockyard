sources:
  # ---------------------------------------------------------------- A 级：一手
  - id: navweaps-midway-oob
    title: Orders of Battle — Battle of Midway and Aleutians, 3-7 June 1942 (NavWeaps)
    url: https://www.navweaps.com/index_oob/OOB_WWII_Pacific/OOB_WWII_Midway.php
    type: website
    tier: C
    role:
      - data
    operator: NavWeaps（contributed by Mark Horan, Richard Worth, David Williams, Richard Leonard）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      全站唯一**逐 Buntai（分队）列出日方航空队编制**的中途岛战斗序列，同时给出美方各中队
      「编制数（operational 数）」双数。关键口径提示：
      （a）每个航空队单列一行「Unit commander … 1 x B5N2/D3A1」，该行与 Buntai 行是否重复计
      未明说；按分队相加后与 combinedfleet TROM 一致，但属结构解读，不可写成来源断言。
      （b）约克城 VS-5 19 / VB-3 18 与行动报告 18/18、出击 17 冲突，两说并列。
      （c）VMSB-241 SB2U-3 标「21 (14 operational)，Only 12 crews」——飞机比机组多，是中途岛
      岸基航空兵的真实窘境。
      （d）本页同时收录阿留申作战，检索时必须分段（见 docs/51-midway-oob-verification.md）。

  - id: ussbs-ijo-1-amagi-kaga
    title: USSBS Interrogation Nav No. 1 — Captain Amagai Takahisa, Air Officer of Kaga at Midway
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-1.html
    type: primary_archive
    tier: A
    role:
      - data
      - narrative
    operator: US Strategic Bombing Survey, 1945-10-06
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      加贺飞行长一手证言。三处关键：
      （1）加贺航空队编制「21 fighters (0) Type: 27 VB (99 Type); 18 VT (97 Type); **same as all
      other carriers**」——与其他来源（18/18/27）不一致，属受访者记忆偏差，**不可作编制依据**，
      只作旁证。
      （2）加贺阵亡「About 800 lost. About 1000 saved.」；飞行员「About 40 pilots. About 50% pilots saved.」
      （3）**雷达矛盾的关键来源**：先说「By radar. It was an experiment at MIDWAY」，又说「Did the
      Kaga have it? No, island too small」。两句都引，不裁决。
      另有加贺被弹 4 发逐发部位、CAP 常态 28 机（每两舰 8/8/6/6）等。

  - id: ussbs-ijo-2-kawaguchi-hiryu
    title: USSBS Interrogation Nav No. 2 — Captain Kawaguchi Susumu, Air Officer of Hiryu at Midway
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-2.html
    type: primary_archive
    tier: A
    role:
      - data
      - narrative
    operator: US Strategic Bombing Survey, 1945-10-10
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      飞龙航空参谋一手证言。**飞龙飞行员阵亡「About 60 pilots and a total of 500 men of crew of
      1500」的唯一出处**。另有两句决定性的：
      （1）飞龙被弹「hit **six** times during the fourth attack」（与详报/ TROM 的 4 弹冲突，并列）。
      （2）**日方雷达时间点**："No, not any. As soon as we got back they put them on the carriers.
      **July 1942** both battleships and carriers received them."
      注意：该页把山本座舰记作「Third Fleet / Third Task Force, commanded by Vice Admiral NAGUMO」，
      部队番号有误（应为第一航空舰队），引用时不要照抄番号。

  - id: ussbs-ijo-13-watanabe
    title: USSBS Interrogation Nav No. 13 — Captain Watanabe Yasuji, Gunnery Officer on Yamamoto's Staff
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-13.html
    type: primary_archive
    tier: A
    role:
      - data
      - narrative
    operator: US Strategic Bombing Survey, 1945-10-15
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      山本幕僚视角。三处可用：
      （1）日方总损失估计「**The total lost was about 4,500**」（与 ONI 的 4,800 并列）。
      （2）战后盘点「**Many planes and a number of pilots were lost in the action, which, weakened
      the Navy Air Force, requiring training to replace them.**」
      （3）雷达「No, about **August 1942** it was installed.」（与川口的「7 月」冲突，并列。）
      该访谈把山本记作在 YAMATO 上指挥「entire operation」，且说「Admiral NAGANO commanded carrier
      forces」——后者有误（南云，非永野），引用时需剔除。

  - id: ussbs-ijo-31-katsumata-attrition
    title: USSBS Interrogation Nav No. 31 — Rear Admiral Katsumata Seizo, Aircraft Ferrying and Pilot Attrition, JNAF
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-31.html
    type: primary_archive
    tier: A
    role:
      - data
      - narrative
    operator: US Strategic Bombing Survey, 1945-10-25
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      **「中途岛不是飞行员损耗率修订主因」这条反证的原句出处**：
      "I believe the Battle of GUADALCANAL and the actions at RABAUL had more to do with the revision
      than the Battle of MIDWAY." 另给训练体系崩坏路径：损耗率假设 20-30% → 1943 上调 50%；
      1943 年末因汽油短缺废弃中级训练阶段，"This increased operational losses."

  - id: ussbs-ijo-39-ohara-soryu
    title: USSBS Interrogation Nav No. 39 — Captain Ohara Hisashi, Executive Officer of Soryu at Midway
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-39.html
    type: primary_archive
    tier: A
    role:
      - data
      - narrative
    operator: US Strategic Bombing Survey
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      苍龙副长一手证言。苍龙阵亡「About 700 were lost **including about 30 pilots**」；被弹 3 发逐发
      部位；「About 250 planes were lost. Some were lost in the attack on the island, some at the
      American carriers, the remainder were lost on the Japanese carriers.」——这是 44（空中）与 248
      （编制）两个口径之间唯一讲清「损失去哪了」的一手说法。
      另有「The planes were delayed while changing bombs to attack the carriers.」——换弹影响出击的
      日方原始表述。

  - id: ussbs-ijo-50-aircraft-wastage
    title: USSBS Interrogation Nav No. 50 — Commander Fukamizu, Aircraft Availability and Loss Reports
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-50.html
    type: primary_archive
    tier: A
    role:
      - data
    operator: US Strategic Bombing Survey, 1945-10-31 / 11-01
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      **Annex B 是唯一一份逐月「生产 / 损耗」双列的海军航空兵力表**，脚注 7 把 1942 年 6 月标注为
      "Midway, Aleutians"。
      ⚠️ 该页**没有给 `a/b` 的图例**，按表头 "Number of Planes Expended = Combat Losses/Operational
      Losses" 与列位推断为「生产/损耗」，**属推断，不是来源断言**。除非先核对原表图例，否则只引
      「6 月标注为 Midway/Aleutians」这一事实，不引具体数字。

  - id: ussbs-ijo-64-takata-planning
    title: USSBS Interrogation Nav No. 64 — Rear Admiral Takata Toshitane, Japanese Naval Planning after Midway
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-64.html
    type: primary_archive
    tier: A
    role:
      - data
      - narrative
    operator: US Strategic Bombing Survey, 1945-11-01
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      第三舰队参谋，负责中途岛后的航空队重建。三处关键：
      （1）飞行员「**30% of the pilots were killed and 40% were injured**」（唯一按比例给出的口径）。
      （2）生还者去向：「30% came back to JAPAN to convalesce, 40% were shifted to the Third Fleet,
      at KYUSHU」，随后「forced to send these pilots prematurely to RABAUL」，最终「most of them were
      killed in action at PORT MORESBY, BUNA and SANTA CRUZ」——**「长期损失」的真实路径**。
      （3）「**I think failure of the MIDWAY Campaign was the beginning of total failure.**」

  - id: ussbs-ijo-66-midway-solomons
    title: USSBS Interrogation Nav No. 66 — Midway, Eastern Solomons, Philippines
    url: https://www.ibiblio.org/hyperwar/AAF/USSBS/IJO/IJO-66.html
    type: primary_archive
    tier: A
    role:
      - narrative
    operator: US Strategic Bombing Survey
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      补强用的旁证访谈（中途岛→东所罗门→菲律宾一线的连续性）。本轮未逐句引用，登记备用。

  # ---------------------------------------------------------------- B 级：官方战史/综述
  - id: nhhc-h006-1-battle-of-midway
    title: 'NHHC H-gram 006-1: The Battle of Midway (S. J. Cox)'
    url: https://www.history.navy.mil/about-us/leadership/director/directors-corner/h-grams/h-gram-006/h-006-1.html
    type: official_publication
    tier: A
    role:
      - data
      - narrative
    operator: Naval History and Heritage Command
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      **本轮最重要的一份**，因为它同时给出三组此前拿不到的数字：
      （1）**日方飞行员阵亡「only 36 were lost on the carriers and 74 in the air, mostly from Hiryu」**
      —— 这就是常被引用的 110。
      （2）「All 248 carrier aircraft were lost」；「Over 3,000 Japanese sailors were killed …
      including **over 700 aircraft technicians/maintainers**」。
      （3）**决定性的反证句**："**It was not the loss of pilots at Midway** that crippled Japan's
      ability to wage offensive naval operations, but rather the loss of … **the irreplaceable
      aircraft carriers**."
      另有美方空勤「Well over 150 U.S. aviators」；鱼雷机「Of the 99 men in the 42 torpedo planes
      that were lost, only three survived」。
      该页直连 TLS 握手失败（history.navy.mil 全线），**本次经 Wayback 抓取**：
      http://web.archive.org/web/20251208122218id_/https://www.history.navy.mil/about-us/leadership/director/directors-corner/h-grams/h-gram-006/h-006-1.html

  - id: nhhc-h006-4-flight-to-nowhere
    title: 'NHHC H-gram 006-4: The Flight to Nowhere (S. J. Cox)'
    url: https://www.history.navy.mil/about-us/leadership/director/directors-corner/h-grams/h-gram-006/h-006-4.html
    type: official_publication
    tier: A
    role:
      - narrative
    operator: Naval History and Heritage Command
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >-
      大黄蜂航空团「flight to nowhere」（Ring 的 265° 航向）专题。含 2019 年作者自注：该说法
      「differs from the traditional view [and Samuel Eliot Morison's] and provokes heated dissent」，
      反证是大黄蜂两名战斗机飞行员称途中见到库雷环礁。**争议本身要写明**，不要单方面采用。
      本轮仅登记，未作为正文主依据。
      直连 TLS 失败，经 Wayback：20251208121820id_

  # ---------------------------------------------------------------- C 级：权威二次文献/专题
  - id: ethw-radar-fighter-directors-midway
    title: 'Midway — Chapter 7 of Radar and the Fighter Directors (Engineering and Technology History Wiki)'
    url: https://ethw.org/Midway_-_Chapter_7_of_Radar_and_the_Fighter_Directors
    type: website
    tier: C
    role:
      - data
      - narrative
    operator: ETHW / IEEE（章节作者引 [5][9][11][15][32][33] 页码）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      **美方 CXAM 四次接触的唯一逐次叙述来源**：0815 利根 4 号机（30 mi / 185°）、1159 飞龙第一波
      （46 mi / 250°，ONI 同）、约 1430 飞龙第二波（45 mi）、1615 利根 3 号机。另有反事实判断
      「If the Japanese carriers had radar equivalent to the American CXAM they most likely would not
      have been surprised」——C 级作者判断，引用须标层级。
      ⚠️ 该页称中途岛岸基雷达是「SCR-270, a close cousin of the CXAM」，与 ONI 只说「Midway radar」
      不同，型号归属存疑，不要写成定论。

