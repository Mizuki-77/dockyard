# ============================================================================
# 单舰：USS New Orleans（CA-32，新奥尔良号重巡洋舰）
# ----------------------------------------------------------------------------
# 只写本舰与舰级（new-orleans）不同的值与本舰特有的事实。
# 本舰是**本级命名舰**，但按 historyofwar 的记载，级别名是 1942 年阿斯托里亚号
# 沉没之后才正式定在它头上的（此前部分资料称 Astoria 级）。
#
# 【本舰最该说清的三件事】
#   1) 1942-06 中途岛：与明尼阿波利斯号同属 TG 16.2 的 CTU 16.2.2，
#      编队内担任 Hornet（大黄蜂号）的掩护（navweaps 战斗序列页原文
#      「USS New Orleans (CA-32) … Escorting Hornet」）。
#   2) 1942-11-30 塔萨法隆加：紧随旗舰明尼阿波利斯号之后 1,000 码，
#      旗舰中雷后右满舵规避，正好撞进另一条鱼雷的航迹——**舰艏在 2 号炮塔
#      炮座处整段被切掉**。WDR-38 的结论是：真正致命的是鱼雷引爆了旁边的
#      航空炸弹库（160 lb 拆除装药 + 49 枚 100 lb 炸弹），不是鱼雷本身。
#   3) 生还方式与明尼阿波利斯不同：本舰艏部整段漂到港侧，把舷侧撞出几个洞
#      （frames 53 / 130 / 136），航速掉到 2 节，但**靠自身动力**驶入 Tulagi；
#      用椰木临时接了个艏，1943-03 到 Puget Sound 换真艏。
#
# 【与姊妹舰的硬差别】
#   · 主炮：CA-32/34/36 一批，8"/55 Mk 9 族（与明尼阿波利斯同，与文森斯不同）。
#   · 副炮炮座：本舰是 5"/25 **Mark 19**（手动），而 Quincy 与 Vincennes 是
#     Mark 23（动力驱动）——navweaps 原文「New Orleans (except Quincy and
#     Vincennes) (8): Mark 19」「Quincy (8), Vincennes (8) and Brooklyn (8):
#     Mark 23」。这三艘同级舰的副炮座不是一回事。
#   · 舰长：中途岛当天是谁，两源打架（见 service.commander 条）。
#
# 【未获取】
#   试航实测功率/航速、1942 年以前的雷达型号与装舰日期、各次战斗弹药消耗、
#   塔萨法隆加阵亡人数、造价、水线宽实测（WDR-38 给了一个 60'-1-3/8"，
#   与 DANFS 的 61'9" 不同，已并列）。
# ============================================================================

id: new-orleans
name:
  zh: 新奥尔良号
  en: USS New Orleans
class: new-orleans

open_ended_note: >
  CA-32，本级命名舰。1931-03-14 开工（原名 CL-32）、1933-04-12 下水、
  1934-02-15 服役。1942-06 中途岛属 TG 16.2 掩护大黄蜂号；
  1942-11-30 塔萨法隆加被鱼雷切断舰艏仍生还，1943-08 重返前线；
  1947-02-10 退役，1959-09-22 售拆。17 枚战斗之星（navsource 作战勋表栏）。

