  - field: protection.armor.thickness
    value: 57
    unit: mm
    qual: { part: deck, region: main }
    src: [navypedia-neworleans, wdr-38]
    valid: { from: 1942-11-30, to: 1942-11-30 }
    confidence: C
    note: >
      **本条的作用是给断艏事故留一个对照点。** navypedia 记弹药库段的
      主装甲甲板在「1st platform level」、厚 57 mm；WDR-38 记断艏后
      「The second deck was missing forward of frame 31 … The explosion had torn
      out everything below the second deck forward of frame 31」，
      并在照片说明里提到「Armored bulkhead 53 apparently prevented further
      damage」（frame 53 处的装甲舱壁挡住了破口继续扩大）——
      这是**装甲舱壁确实起了作用**的一手证据，与「装甲无效」的笼统说法相反。

  - field: service.fate_category
    value: 1942-11-30 塔萨法隆加被一条鱼雷切断舰艏（2 号炮塔炮座处），靠自航驶入 Tulagi 并以椰木假艏返修，1943-08 重返前线，战后拆解
    src: [oni-combat-narrative-tassafaronga, wdr-38, danfs-ca32]
    valid: { from: 1942-11-30, to: 1959-09-22 }
    confidence: A
    note: >
      ONI 原文：「When the Minneapolis was torpedoed, the New Orleans had to come
      hard right to avoid ramming her … Rarely a minute passed before the New
      Orleans herself received a torpedo hit on her port bow. The gasoline stowage
      and magazine groups 1 and 3 exploded, and the entire bow as far aft at the
      barbette of turret II was blown away. All personnel in both forward turrets
      lost their lives. The bow floated aft along the port side, tearing gaping
      holes at frames 130 and 136 just above the waterline」。
      WDR-38 的官方因果结论：「this Bureau is of the opinion that the severe
      damage to NEW ORLEANS was the result of the combined effects of the torpedo
      detonation and a mass detonation of aircraft bombs and demolition charge
      caused by fragments produced by the torpedo. The Bureau of Ordnance concurs
      with this opinion」——即**炸弹库殉爆放大了损伤**，鱼雷本身不足以断艏。
      DANFS 的对照叙述：「a torpedo which ripped off her bow. Bumping down the
      ship's port side, the severed bow punched several holes in New Orleans'
      hull. A fifth of her length gone, slowed to 2 knots」。
      两处对「断到哪里」一致（2 号炮塔炮座），对「是否靠自航进港」也一致
      （DANFS「under her own power she entered Tulagi Harbor near daybreak
      1 December」）。

