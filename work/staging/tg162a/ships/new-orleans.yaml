    value: 1121
    unit: persons
    src: [ibiblio-ships-ca]
    valid: { from: 1943, to: 1945-09 }
    confidence: C
    note: >
      ibiblio 与 USS Vincennes Association 给本级「Complement: 1042-1121」。
      本条取上限并限定在 1943 年以后——**这是按年份推断的限定，不是来源明说**，
      故给 C。对照 DANFS 的 708 与 navypedia 的 868，三者口径全不同。
