  # ============================================================ 主尺度（实测）
  - field: dimensions.length.wl
    value: 176.19
    unit: m
    src: [wdr-38]
    valid: { from: 1942-11-30, to: 1943-04-03 }
    confidence: A
    note: >
      War Damage Report No.38 扉页的实测值：「Length (W.L.) 578'-5/16"」= 176.19 m。
      与 navypedia 的 class 值 176.2 m 在 0.01 m 内吻合，两源独立互证。

  - field: dimensions.beam.wl
    value: 18.32
    unit: m
    src: [wdr-38]
    valid: { from: 1942-11-30, to: 1943-04-03 }
    confidence: A
    note: >
      **这里与舰级值冲突，两说并列。** WDR-38 扉页实测
      「Beam (W.L.) 60'-1-3/8"」= 18.32 m；而 DANFS / navsource 给 61'9"
      （18.82 m），navypedia 给 18.8 m。差的 0.5 m 落在「水线宽」与
      「最大宽」两个口径之间——前者是水线处的实测，后者是含舷弧的最大宽。
      本舰这条取 WDR-38 的实测水线宽（一手档案），舰级那条取 18.8（多源）。
      哪一个是水线处实测、哪一个是含舷弧最大宽，来源均未明说，故不合并。

  - field: dimensions.draught.mean
    value: 7.24
    unit: m
    src: [wdr-38]
    valid: { from: 1942-11-30, to: 1942-11-30 }
    confidence: A
    note: >
      WDR-38 扉页「Draft … 23'-9" (Before Damage)」= 7.24 m。
      **注意两点**：① 这个「Draft」未说明是平均还是最大；② 它注明了
