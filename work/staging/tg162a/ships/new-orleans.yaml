    src: [navypedia-neworleans, danfs-ca32]
    valid: { from: 1942-01 }
    confidence: B
    note: >
      DANFS 记 1942-01 在旧金山「returned … for engineering repairs and
      installation of new search radar and 20mm guns」；navypedia 记
      「mid-1942, all: … + SC, Mk 3 radars」。两条在时间上可接续，
