      「Minneapolis was flagship of TF-67」。**注意 ONI 官方叙述不用 TF 67 而用
      「Task Force WILLIAM」这个代字**（「Task Force WILLIAM was, therefore,
      constituted as follows … Minneapolis (FF), Capt. Charles K. Rosendahl」），
      两者指同一支部队。编成：4 重巡（Minneapolis 旗舰、New Orleans、Northampton、
      Pensacola）+ 1 轻巡（Honolulu，Tisdale 座舰）+ 4 驱逐舰，司令
      Rear Admiral Carleton H. Wright（ONI：「He was replaced by Rear Admiral
      Carleton H. Wright, who had just made port in the Minneapolis」）。
      **本舰是这支舰队的旗舰**（FF = flagship）。

