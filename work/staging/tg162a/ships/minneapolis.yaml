# ============================================================================
# 单舰：USS Minneapolis（CA-36，明尼阿波利斯号重巡洋舰）
# ----------------------------------------------------------------------------
# 只写本舰与舰级（new-orleans）不同的值与本舰特有的事实。
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
#
# 【本舰最该说清的三件事】
#   1) 1942-06 中途岛：本舰是 TG 16.2 巡洋舰群司令 Kinkaid 的旗舰
#      （Kinkaid 传记第 208 页编成表：CTG 16.2 = RADM Kinkaid，
#      其直辖的 CTU 16.2.2 就是 Minneapolis / New Orleans / Vincennes）。
#      同页又记本舰与 New Orleans「Escorting Hornet」、Vincennes「Escorting
#      Enterprise」（navweaps 战斗序列页）。
#   2) 1942-11-30 塔萨法隆加：被两条鱼雷命中，**舰艏在 frame 22 处整段撕裂**，
#      1、2、3 号锅炉舱进水，全部炮塔失电，但舰没沉——靠损管与本舰自航回 Tulagi。
#      这是全级、也是整场战争里最有名的一次「断艏生还」。
#   3) 战后：1947-02-10 退役，1959-03-01 除名，1959-08-14 卖拆。
#      拿到 16 枚战斗之星（DANFS 原文「Minneapolis received 16 battle stars」）。
#
# 【与姊妹舰的两处硬差别】
#   · 主炮：本舰属 CA-32/34/36 一批，用 8"/55 Mk 9 族；
#     文森斯（CA-44）用 Mk 12。且本舰 1945 年**换装过 Mk 15 Mod 1 炮身**
#     （navweaps：「at least USS Minneapolis (CA-36) was regunned in 1945 with
#     the Mark 15 Mod 1 which had adapter sleeves that allowed it to replace the
#     older guns」）——本级唯一有此记载的一艘。
#   · 炮座：本舰用「triple turret」（有旋转中心柱），炮座重 299 t。
#
# 【未获取】
#   本舰试航实测功率与航速、逐次改装的精确月份、1942 年以前的具体雷达型号、
#   各次战斗的弹药消耗数、阵亡/生还人数、造价。
# ============================================================================

id: minneapolis
name:
  zh: 明尼阿波利斯号
  en: USS Minneapolis
class: new-orleans

open_ended_note: >
  CA-36。1931-06-27 开工、1933-09-06 下水、1934-05-19 服役。
  1942-06 中途岛时属 TG 16.2（Kinkaid 旗舰）；1942-11-30 塔萨法隆加被两条
  鱼雷击中、舰艏断裂但生还；1943-08 重返前线，此后参加太平洋几乎所有主要作战
  （仅缺硫磺岛）；1947-02-10 退役，1959-08-14 卖拆。16 枚战斗之星。

