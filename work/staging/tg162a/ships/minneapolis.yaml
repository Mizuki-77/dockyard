  - field: service.unit
    value: 第 6 巡洋舰分队（CruDiv 6）· TG 16.2 巡洋舰群 · 太平洋舰队
    src: [ibiblio-midway-oob, kinkaid-bio, navweaps-midway-oob]
    valid: { from: 1942-05-16, to: 1942-06-30 }
    confidence: A
    note: >
      **本舰在中途岛的确切位置**：ibiblio 官方战斗序列「Task Group 16.2 (TG 16.2)
      / Cruiser Group / Rear Admiral Thomas C. Kinkaid, USN / Commander Cruiser
      Division 6 (Comcrudiv 6)」，下辖含 USS Minneapolis (CA-36)；
      navweaps 序列页给分派「USS Minneapolis (CA-36) … Notes: Escorting Hornet」。
      Kinkaid 传记第 208 页把 TG 16.2 拆成 CTU 16.2.1（Chandler：
      Northampton/Pensacola/Atlanta）与 CTU 16.2.2（Kinkaid 本人：
      Minneapolis/New Orleans/Vincennes），并标「CTG 16.2 Cruiser Group
      RADM Thomas C. Kinkaid」。
      **本舰是 CruDiv 6 的「常任旗舰」**，同传记原文：「The day after returning to
      Pearl Harbor Kinkaid shifted his flag from Astoria to Minneapolis,
      the regular flagship of CRUDIV 6」——1942-01 移旗，此后一直坐镇本舰，
      直到 7 月转去企业号（「This ship would be home until July when the admiral
      would move to the carrier Enterprise」）。这一句把「TG 16.2 旗舰」
      这件事钉死在**本舰**上，而不是别的同级舰。
      起始日 1942-05-16 的依据：Kinkaid 传记原文「The next morning, 16 May,
      Kinkaid's cruiser force joined the TF 16 screen and came under the direct
      command of Rear Admiral Raymond A. Spruance」。

  - field: service.unit
    value: 第 67 特混舰队（TF 67）旗舰 · 南太平洋部队
    src: [danfs-ca36, navsource-ca36, oni-combat-narrative-tassafaronga]
    valid: { from: 1942-11-27, to: 1942-11-30 }
    confidence: A
