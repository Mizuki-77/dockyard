  - field: identity.name_original
    value: New Orleans class
    src: [navypedia-neworleans, historyofwar-neworleans-class]
    valid: { from: 1929 }
    confidence: C
    note: >
      美国海军官方分类是「heavy cruiser (CA)」，级别名随命名舰 New Orleans 而定。
      historyofwar 原文另记一层：本级「was also sometimes known as the Astoria class,
      as she was the first of the class to have been laid down. The New Orleans name
      was officially adopted after the loss of the Astoria in 1942」——
      即 1942 年阿斯托里亚号沉没之前，本级在部分资料里叫 Astoria 级。
      本站统一用 New Orleans class，别名记在此处不另立级别。

