  # ============================================================ 防护
  - field: protection.scheme
    value: incremental
    src: [navypedia-neworleans, pwencycl-neworleans]
    valid: { from: 1934-02-15 }
    confidence: C
    note: >
      **属归类判定，不是来源原话。** 本级不是 all-or-nothing：装甲带只覆盖动力舱段，
      弹药库用独立的窄装甲带+前后 37 mm 舱壁围成盒子，舰体首尾无舷侧装甲，
      主装甲甲板为单层 57 mm（弹药库段在 1 层平台、动力舱段在 2 层甲板，
