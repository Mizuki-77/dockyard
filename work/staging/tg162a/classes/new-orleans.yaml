  # ============================================================ 排水量
  - field: displacement.standard
    value: 10136
    unit: t
    src: [navypedia-neworleans, historyofwar-neworleans-class]
    valid: { from: 1934-02-15 }
    confidence: C
    note: >
      navypedia 表头写「Displacement standard, t 10136」——来源自述是标准排水量，
      故可直接作主值。historyofwar 给「Displacement (standard) 10,136t」，两源一致。
      **另有三套不同口径的数字，不得混用**：
        DANFS 每舰技术行「dp. 9,950」（未标口径；CA-44 更写 9,400）；
        navsource 三舰页「Displacement 9,950 Tons」；
        ibiblio 与 USS Vincennes Association「9375-9973 tons (normal)」。
      9,950 短吨 = 10,110 mt，与 10,136 t 相差在四舍五入范围内，但仍属不同口径，
      本站只把 10,136 t 当标准排水量（华盛顿口径）。

  - field: displacement.full
    value: 12463
    unit: t
    src: [navypedia-neworleans, historyofwar-neworleans-class]
    valid: { from: 1934-02-15 }
    confidence: C
    note: >
      navypedia「Displacement full, t 12463」；historyofwar「Displacement (loaded)
