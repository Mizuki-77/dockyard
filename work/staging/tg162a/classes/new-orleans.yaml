# ============================================================================
# 舰级：New Orleans class（新奥尔良级重巡洋舰）
# ----------------------------------------------------------------------------
# 本文件覆盖全部 7 艘（CA-32/34/36/37/38/39/44），但本站入库的只有三艘：
#   CA-32 New Orleans、CA-36 Minneapolis、CA-44 Vincennes（1942-06 同属 TG 16.2）
# 另四艘（Astoria CA-34、Tuscaloosa CA-37、San Francisco CA-38、Quincy CA-39）
# 只在本文件的「子级差异」中出现，不建单舰文件。
#
# 【本级为什么长成这样 —— 全级一句话】
# 华盛顿条约把重巡锁在 10,000 t（10,160 mt）标准排水量 / 8 英寸主炮。
# 美国前三级（Pensacola / Northampton / Portland）造下来普遍**欠重约 1,000 t**，
# 这笔省下的余量被拿去做装甲 —— 于是本级成了美国第一条能挡 8 英寸弹的条约重巡。
# 关键手法不是加厚舷侧，而是把动力舱从「交替布置」改成「纵列布置」，
# 舰体因此缩短、装甲带跟着缩短、同样的重量就能摊到更厚的甲上。
#
# 【与北安普敦级的关键差别 = 弹药库装甲】
# 北安普敦级：belt 95–76 / deck 51–25 / barbettes 38 / turrets 64–19 / CT 32 mm，
#   弹药库只靠「免疫区对 152 mm 弹」撑着，对 8 英寸弹无免疫区（navypedia 原话
#   「Under 203mm shells immune zone was absent」），设计时提议加强弹药库装甲
#   最终只做到「splinterproof protection of ammunition elevators」。
# 新奥尔良级：belt 127–76，**弹药库段另有一道窄装甲带 102 mm（下缘 76 mm）**，
#   弹药库前后有 37 mm 舱壁，炮塔面板 203 mm、炮座 127 mm。
#   代价是 CA-37/38 把装甲加过头、逼近吨位上限，于是 CA-39/44 又减回去
#   （炮座 152→133 mm）——这条「加-减」的往复就是本级的子级差异主线。
#
# 【哪些东西没查到 —— 必须如实留着】
#   垂线间长（pp）、型深、干舷、方形系数、水线面积、稳心高、
#   水下防护纵深（本级无防雷突出部，也没有任何纵深数值）、
#   蒸汽压力与温度、螺旋桨直径、舵数、发电机功率、
#   造价（英文来源一致地不给）、装甲重量分配明细表。
#   以上一律写「未获取」，不用姊妹舰或他级数值填充。
# ============================================================================

id: new-orleans
name:
  zh: 新奥尔良级重巡洋舰
  en: New Orleans-class heavy cruiser
class_of: [new-orleans, minneapolis, vincennes]
open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。
  例外：本级的装甲、主炮与副炮**逐子级不同**（CA32/34/36 一批、CA37/38 一批、
  CA39/44 一批），凡涉及子级差异的 fact 一律在 note 里写明「本值属哪一批」，
  并尽量把适用批次写进 valid 或 note，不在单舰文件里重复整套值。

