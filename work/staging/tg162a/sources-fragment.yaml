  - id: navweaps-8in-55-mk9
    title: USA 8"/55 (20.3 cm) Marks 9, 10, 11, 13 and 14 — NavWeaps
    url: https://www.navweaps.com/Weapons/WNUS_8-55_mk9.php
    type: website
    tier: D
    role: [data]
    operator: Tony DiGiulian
    lang: en
    access: direct
    fetched: 2026-11-23
    note: >
      **拆三舰主炮差别的关键页**。原文「Ship Class Used On: Lexington (CV-2),
      Pensacola (CA-24), Northampton (CA-26), New Orleans (CA-32, 34 and 36 only)
      and Portland (CA-33) classes」——即 CA-32/34/36 用 Mk 9 族，
      CA-37 以后的 Tuscaloosa 子级用另一页的 Mk 12。
      另给：炮身 30.0 tons、膛线长 373.65 in、药室 5,300 in³、初速 2,800 fps、
      炮管寿命 715 发、每炮 150 发；炮座为「triple turret」并注明
      「the later mountings used on New Orleans (CA-32), Astoria (CA-34) and
      Minneapolis (CA-36) were classified as "triple turrets" as they did have
      a rotating stalk」；「RPC was used in the New Orleans class as built」。

