  - id: wdr-29
    title: 'War Damage Report No. 29: U.S.S. Quincy (CA-39), U.S.S. Astoria (CA-34) and U.S.S. Vincennes (CA-44), Gunfire and Torpedo Damage, Savo Island, 9 August 1942'
    url: http://www.ibiblio.org/hyperwar/USN/rep/WDR/U.S.S.%20QUINCY%20(CA-39),%20U.S.S.%20ASTORIA%20(CA-34)%20and%20U.S.S.%20VINCENNES%20(CA-44),%20GUNFIRE%20AND%20TORPEDO%20D.pdf
    type: primary_archive
    tier: A
    role: [data, narrative]
    operator: Preliminary Design Branch, Bureau of Ships, Navy Department（HyperWar 数字化）
    lang: en
    access: direct
    fetched: 2026-11-23
    note: >
      一手战损报告（26 页，本地 work/staging/tg162a/_raw/wdr29-quincy-astoria-vincennes.pdf）。
      **命中的权威计数**：「ASTORIA received at least 65 known hits. QUINCY
      received at least 36 known hits as well as two torpedo hits …
      VINCENNES received 57 known hits as well as one torpedo hit (possibly two)
      on the port side in way of the forward magazine group」。
