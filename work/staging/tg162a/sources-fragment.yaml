    title: 'War Damage Report No. 38: U.S.S. New Orleans (CA-32) Torpedo Damage, Lunga Point, 30 November 1942'
    url: http://www.ibiblio.org/hyperwar/USN/rep/WDR/U.S.S.%20NEW%20ORLEANS%20(CA-32),%20TORPEDO%20DAMAGE%20-Lunga%20Point,%20November%2030,%201942.pdf
