# 状态切片 —— USS Vincennes（CA-44）
# 本舰生涯只有 5 年 5 个月，切片不宜多。
ship: vincennes
slices:
  - code: P0
    title: 建造与服役（1934-1937）
    from: 1934-01-02
    to: 1937-02-24
    note: >-
      1934-01-02 在 Bethlehem 的 Fore River 厂（Quincy, Mass.）开工，船台号 1449；
      1936-05-21 下水（掷瓶人 Harriet Virginia Kimmell，文森斯市市长之女）；
      1937-02-24 服役，首任舰长 Burton H. Hepburn Green。
      **建成配置与另两艘同级舰不同**：主炮是 8"/55 **Mk 12**（更轻的新炮 +
      更紧凑炮塔），副炮座是 5"/25 **Mark 23**（动力驱动，配 Mk 33 指挥仪）；
      炮座装甲减薄到 133 mm（CA-32/34/36 是 127 mm，CA-37/38 是 152 mm）；
      比另两艘多两门 3 磅礼炮。

  - code: P1
    title: 试航与中立巡逻（1937-1941）
    from: 1937-02-25
    to: 1941-12-06
    note: >-
      1937-04-19 离波士顿试航，访斯德哥尔摩、赫尔辛基、勒阿弗尔、朴茨茅斯。
      1938-01 编入 CruDiv 7，经巴拿马运河至圣迭戈，03 月参加第 19 次舰队演习。
      1939 年 Mare Island 大修后调大西洋。1939-09 起执行中立巡逻（加勒比、
      尤卡坦湾）。1940-05~06 赴亚速尔与法属摩洛哥运金；1941-03 赴开普敦
      运英国黄金；1941-11 随 WS-12 护航队运送英军赴开普敦。
      **本片无结构性改装记录。**

  - code: P2
    title: 太平洋：杜立特空袭与中途岛（1941-12-07 ~ 1942-07-13）
    from: 1941-12-07
    to: 1942-07-13
    note: >-
      1941-12-07 本舰正随 WS-12 护航队在海上，风暴中撞坏一艘救生艇并从
      中部井甲板扯下一架 SOC 水上飞机。1942-01 护送 Hornet 试航；
      03-04 离纽约、03-11 过巴拿马运河赴太平洋。
      1942-04-02 随 TF 18（Hornet 为核心）出旧金山，04-18 参加杜立特空袭
      （B-25 提前起飞）。05 月赶珊瑚海不及。
      **1942-06-03~07 中途岛**：属 TG 16.2 的 CTU 16.2.2（Kinkaid 直辖），
      但实际掩护企业号（"Escorting Enterprise"）；06-04 下午被派去支援约克城，
      以 5"/25、20 mm 与 1.1"/75 对「凯特」机开火，击落 1 架（距左舷首 150 码落海）。
      06-06 日潜艇 I-168 穿过驱逐舰幕击沉约克城与 Hammann，本舰无力阻止。
      返珍珠港后入船坞修理改装至 7 月初，随后与 TF 11 在夏威夷外战术演习。
      **本片新增：1941-12~1942-04 一轮改装，加装 4 座四联装 1.1"/75、
      换 20 mm、加 SC 与 Mk 3 雷达。**

  - code: P3
    title: 瓜岛登陆与萨沃岛沉没（1942-07-14 ~ 1942-08-09）
    from: 1942-07-14
    to: 1942-08-09
    note: >-
      1942-07-14 离夏威夷，07-26 与 San Juan、Quincy 一同加入 TF 62，
      **任 TG 62.3 旗舰**。08-07 掩护「Yoke」运输队抵瓜岛，拂晓弹射校射机后
      以主副炮对岸轰击；13:20 后日机反击，本舰是最先开火的舰之一，击落 2 架。
      08-08 正午前 27 架「贝蒂」低空雷击，本舰以全炮（8 英寸到 20 mm）开火，
      协助击落至少 7 架，规避 1 条从舰艉下方通过的鱼雷与 1 枚左舷艉部近失弹。
      08-08 夜本舰与 Quincy、Astoria 编为北区掩护队，在萨沃岛外巡逻。
      **08-09 0145 后**：日舰探照灯于 0155 照中本舰，本舰以 8,250 码雷达距离
      还击一个齐射；随即被跨射，舰桥、木工房、Battle II、无线电天线筒先后命中，
      机库内飞机起火；0200 右转规避时被 1–2 条「长矛」鱼雷击中 1 号锅炉舱；
      0205 失舵、数分钟内停车；全舰中弹 57 发（8 英寸与 5 英寸）。
      0210 日舰停火；0230 Riefkohl 下令弃舰；约 0250 翻转沉没于萨沃岛以东
      约 2.5 海里、约 500 英寻深处。1942-11-02 除名。
