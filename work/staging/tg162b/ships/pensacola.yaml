# ============================================================================
# 彭萨科拉号（USS Pensacola, CL/CA-24）—— 彭萨科拉级首舰
#
# 2026-11-23 tg162b 入库。舰级共用参数见 classes/pensacola.yaml。
#
# 四件必须记住的事：
#   1. **主炮 10 门 = 2 座三联 + 2 座双联，共 4 座炮座。**
#      这个布置在美国条约重巡里是独一份：双联在首尾两端（低位），
#      三联背负在它们上面。navypedia 原句
#      "end twin turrets and superfiring triple ones"。
#      NavWeaps 炮座表把它拆成两行：双联 "Pensacola (2)"、三联 "Pensacola (2)"，
#      两源独立、结果一致。
#   2. **1942-06 中途岛时本舰属 TG 16.2，护卫企业号。**
#      NavWeaps 原句 "USS Pensacola (CA-24) ... Notes: Escorting Enterprise;
#      joined TF-17."；企业号战报 06-06 条把本舰列在 ENTERPRISE 组内。
#   3. **1942-11-30 塔萨法隆加被一条鱼雷命中，重伤但存活。**
#      伤亡 7 名军官 + 118 名士兵阵亡，1 名军官 + 67 名士兵受伤（DANFS 原文）。
#      注意与北安普敦号的区别：彭萨科拉中雷 1 条且活下来，北安普敦中 2 条而沉没。
#   4. **战后参加十字路口核试，两次爆炸都存活，1948-11-10 作为靶舰沉没。**
#      DANFS 只给沉没日期，NavSource 给了"华盛顿州外海"这个地点。
# ============================================================================

id: pensacola
name:
  zh: 彭萨科拉号
  en: USS Pensacola
class: pensacola
note: >-
  彭萨科拉级首舰，舷号 CL-24（1931-07-01 改 CA-24）。
  以佛罗里达州埃斯坎比亚县的彭萨科拉湾与彭萨科拉市命名。DANFS 原句：
  "A bay and city in Escambia County, Fla."
  二战获 13 颗战斗之星（本舰为 13 颗，是美军巡洋舰中较多的一艘）。

open_ended_note: >-
  本舰活到战后（1946-08-26 退役、1948-11-10 作为靶舰沉没），
  故多数 fact 的 valid.to 取 1948-11-10（最终沉没）或 1946-08-26（退役），
  视字段性质而定，每条 note 里说明取哪个及原因。

