  - field: armament.gun_failures
    value: >-
      塔萨法隆加（1942-11-30 2339 中雷后）：3 号主炮塔（turret III）因弹药库
      进水与火灾而失效；全部转向控制丢失，两台陀螺罗经均被震坏；
      后部火控（after FC）在向第二个雷达目标开火时被首轮齐射震毁。
    src: [oni-tassafaronga]
    valid: { from: 1942-11-30, to: 1942-12-01 }
    confidence: A
    note: >-
      **这是一手战斗叙事里的故障清单，不是事后归纳。**
      原文四句：
      ①"Water flooded the engine room and the port shaft from the forward engine
      broke. The water level rose in the after fireroom, while flooded magazines
      and fires rendered **turret III useless**."
      ②"Pensacola ... had lost all steering control when the torpedo struck.
      Central Control attempted unsuccessfully to take over. **Both gyros were
      knocked out.**"
      ③"the first salvo **disabled the after FC**"（对第二个目标时）。
      ④"DANFS"另记主桅中弹起火："a soaked torch of her mast"，
      与之呼应的是 ONI 的 "transforming the mainmast into a blazing torch and
      roasting all the personnel in Control Aft to death."
      **DANFS 的说法是「三座炮塔失效」**：
      "Her engine room flooded, **three gun turrets went out of commission**,
      and her oil tanks ruptured"——ONI 只点名 turret III 一座。
      **两说并列不裁决**：DANFS 3 座 vs ONI 明确 1 座（III）。
      DANFS 的 "three" 可能包含动力/通信中断导致的间接失效，ONI 记的是直接损毁。

