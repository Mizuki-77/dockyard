  # ============================================================ 战历节点
  - field: service.fate_category
    value: 十字路口核试靶舰，试验后留存，1948 年作为靶舰击沉
    src: [danfs-pensacola, navsource-pensacola]
    valid: { from: 1948-11-10 }
    confidence: B
    note: >-
      **这是任务书里点名要核实的「十字路口核试？」——结论：是，且两次都存活。**
      DANFS 原句："Pensacola departed San Pedro 29 April to stage with units of
      Joint Task Force One at Pearl Harbor in preparation for operation
      "Crossroads," the atomic bomb experiments at Bikini Atoll. She stood out of
      Pearl Harbor 20 May and reached Bikini the 29th to serve as a target ship.
      She survived the tests of 1 July and 25 July 1946."
      NavSource 逐条列了两次爆炸："Survived atomic aerial burst on 1 JUL 1946 /
      Survived atomic subsurface burst on 25 JUL 1946"。
      即：1946-07-01 空爆与 1946-07-25 水下爆都存活。

