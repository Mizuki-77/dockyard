  - field: service.unit
    value: 第 16 特混舰队（TF 16），中途岛战役期间护卫大黄蜂号（CV-8）
    src: [danfs-atlanta, navweaps-midway-oob, enterprise-war-diary-midway]
    valid: { from: 1942-05-28, to: 1942-06-13 }
    confidence: B
    note: >-
      **这是任务书点名要核实的第二件事，结论：成立，且有三源印证。**
      DANFS 长稿："Atlanta sailed with TF 16 again on the morning of the 28th.
      Over the days that followed, she screened the carriers as they operated
      northwest of Midway ... At the report of Japanese ships to the southwest,
      on the morning of 4 June, Atlanta cleared for action as she screened Hornet."
      NavWeaps 中途岛序列："USS Atlanta (CL-51) ... Notes: Escorting Hornet."
      企业号战报 06-05 条反向印证了本舰在 TF 16 编队内且是基准舰：
      "Guide in ATLANTA, OTC & CTF 16 in ENTERPRISE."
      （即本舰担任整个 TF 16 的航行基准舰，这是屏卫阵位里最靠内的位置之一。）
      **任务书说「亚特兰大护卫大黄蜂」——成立。**
      但要注意时间的细分：DANFS 说 06-04 当天"cleared for action as she
      screened Hornet"，06-06 战报里本舰已随大黄蜂组
      （"The HORNET group ... consists of HORNET, MINNEAPOLIS, NEW ORLEANS,
      ATLANTA, ..."），两处一致。

  - field: service.unit
    value: 第 64.2 特混大队（TG 64.2）旗舰，RA Norman Scott 坐舰
    src: [danfs-atlanta]
    valid: { from: 1942-10-28, to: 1942-11-13 }
