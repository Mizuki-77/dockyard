  - field: construction.fate_type
    value: sunk_by_enemy
    src: [danfs-atlanta, navsource-atlanta]
    valid: { from: 1942-11-13 }
    confidence: B
    note: >-
      **这是一个需要解释的选择。**
      事实链：1942-11-13 夜战中被日军驱逐舰晓号（Akatsuki）的鱼雷
      打中前部机舱，又被旧金山号（CA-38）误击约 19 发 8 英寸弹，
      丧失全部动力、艏部下沉、左倾；
      次日晨由拖船 Bobolink (AT-131) 拖往库库姆，
      舰长判断无法挽救，经南太平洋部队司令授权后弃舰并用爆破装药凿沉。
      DANFS 原句："Authorized by Commander, South Pacific Forces, to act his own
      discretion regarding the destruction of the ship, Capt. ordered that Atlanta
      be abandoned and sunk with a demolition charge."
      **起因是敌火损伤，自沉只是终结手段**，故 fate_type 取 sunk_by_enemy
      而非 sunk_by_scuttling 或 sunk_by_own_forces。
      本站已有先例：sikh 号同样是"敌火致瘫后自沉"，判为 sunk_by_enemy。

