      **这是本舰生涯里唯一一次当旗舰，也是斯科特少将阵亡的地方。**
      斯科特 1942-11-13 夜在本舰舰桥上被旧金山号的误击破片打死：
      DANFS "fragments from their impact killed many men—including Admiral Scott
      and members of his staff."
      时间窗起点 1942-10-28（接斯科特上舰），终点本舰沉没日。

  - field: service.unit
    value: 第 62.4 特混大队（TG 62.4），RA Norman Scott 指挥，掩护瓜岛隆加锚地卸货
    src: [danfs-atlanta, oni-guadalcanal]
    valid: { from: 1942-11-11, to: 1942-11-12 }
    confidence: B
    note: >-
      **本条补的是 11-11 至 11-12 日那段「卸货掩护」任务。**
      ONI 战斗叙事对这段的编队描述很清楚：
      "Espiritu Santo Group, Section Two, Rear Admiral Norman Scott:
      One light cruiser (antiaircraft): **Atlanta (FF)**, Capt. Samuel P. Jenkins.
      Four destroyers ... Aaron Ward (F) ... Fletcher ... Lardner ... McCalla.
      Three cargo vessels: Betelgeuse ... Libra ... Zeilin."
      以及 "At 0920 Admiral Scott got under way and formed antiaircraft disposition
      as follows: The Betelgeuse, Libra, and Zeilin were in column. The Atlanta was
      several hundred yards ahead of them."
      即本舰此时是斯科特支队的**旗舰（FF）**，掩护三艘运输船。
      **注意与本文件 service.unit 里那条 TG 64.2 的分别**：
      TG 64.2 是 10-28 至 11-11 的番号，TG 62.4 是 11-11 之后的番号，
      两段前后相接，来源分别给出。
      同一来源还记了 10-30 的一次炮击支援（可作叙事素材）：
      "Beginning at 0030 on 30 October, the light cruiser Atlanta and four
      destroyers bombarded enemy positions back of Point Cruz for 8 hours."

  - field: service.unit
    value: 第 67.4 特混大队（TG 67.4），RA Daniel J. Callaghan 指挥
    src: [danfs-atlanta]
    valid: { from: 1942-11-12, to: 1942-11-13 }
    confidence: B
    note: >-
      DANFS 原句："The next day, Atlanta was still off Lunga Point, screening the
      unloading, as part of TF 67 under Rear Admiral Daniel J: Callaghan in
      San Francisco."
      后又写 "Accordingly, TG 67.4 departed Lunga Point about 1800 and steamed
      eastward through Sealark Channel"。
      即：11-12 属 TF 67，11-13 夜战属其下的 TG 67.4。
      **注意 Callaghan 本人也在旧金山号上阵亡**——与斯科特同夜、同一条舰的
      误击区域，这是瓜岛夜战里最沉重的一次指挥层损失。

  # ============================================================ 伤亡
  - field: service.casualties
    value: 172
    unit: persons
    src: [danfs-atlanta-brief]
    valid: { from: 1942-11-13 }
    confidence: B
    note: >-
      DANFS 简史页原句："One hundred seventy-two men died with their ship and
      79 were wounded."
      **这个数字只有简史页有，长稿页没有伤亡数。**
      长稿页的间接表述是 "a third of his crew was dead or missing"，
      与 172 人对 650 编制（26%）大致吻合，可作为交叉印证但不当数据用。
      位置：DANFS 简史页另写 "Today the cruiser rests at the bottom of Savo Sound
      about three miles off Lunga Point, Guadalcanal."
      **ONI 战斗叙事没有给本舰的单独伤亡数**，只给了整个编队的分类损失表
      （"CLAA 2 (Atlanta, Juneau)" 沉没），故无法交叉核对 172 这个数。

  - field: armament.gun_failures
    value: >-
      1942-11-13 夜战：中雷前已被日舰击中 13 发 5.5 英寸弹、若干 3 英寸弹
      （多落在舰桥区）与 12 发 5 英寸弹（来自驱逐舰）；中雷后除辅助柴油机外
      全部动力丧失、舵卡死在左满舵，舰体开始向南打转。
    src: [oni-guadalcanal]
    valid: { from: 1942-11-13 }
    confidence: A
    note: >-
      一手战斗叙事，两句原文：
      ①"At this point the Atlanta had received **thirteen 5.5-inch hits and some
      3-inch** from the light cruiser, mostly in the **bridge section**, and
      **twelve 5-inch from the destroyers**. There were fires forward."
      ②"As the enemy ceased fire, our cruiser was struck by one or two torpedoes
      forward on the port side, perhaps from the destroyer to port. **All power was
      lost, except the auxiliary Diesel, and the rudder was jammed left.** The ship
      began to circle back toward the south."
      **这份清单比 DANFS 细**：DANFS 只说 "took at least one torpedo and
      approximately 50 major-caliber hits"（简史页），
      ONI 把「日舰打的」与「旧金山号打的」分开记：
      日舰 13 发 5.5 in + 12 发 5 in，友军 19 发 8 in。
      **三个数字来源不同、统计范围不同，不能相加成一个「总中弹数」。**

  # service.survivors 本条不写。
  # 简史页给了 172 死、79 伤，但没有给编制总数或生还数。
  # 由 650 − 172 倒推 478 属推算，违反红线，故整条留空。
  # 长稿页只有撤离过程的定性描述，不含数字：
  # "all remaining men except the captain and a demolition party boarded Higgins
  # boats sent out from Guadalcanal for the purpose."

  # ============================================================ 1942 年状态的武备差异
  # armament.aa_25mm.count 本文件不写。本舰是美军舰，没有 25 mm 炮；
  # 注册表要求「未获取」与「0」严格区分，而这一项既不是未获取也不是 0——
  # 它是「该舰不存在这个类别的武器」，写 0 会被读成「装了但数量为零」。
  # 同理 armament.aa_20mm.count 因两源冲突（navypedia 无 / NavSource 8 门）
  # 也不在此写，见 classes/atlanta.yaml 与 RESEARCH-NOTES.md §6。

  - field: armament.mount.summary
    value: >-
      1942 年（中途岛至沉没）：8 × 双联 5 in/38（Mark 29，16 门）
      + 4 × 四联 1.1 in/75（16 门）
      + 2 × 四联 21 in 鱼雷管（8 管，Mark 15 鱼雷）。
      无 40 mm（本舰到沉没都没装过）。
    src: [navypedia-atlanta, navweaps-5in38-mk12, navweaps-us-torpedoes]
    valid: { from: 1942-01, to: 1942-11-13 }
    confidence: C
    note: >-
      依据：5 in/38 8 座（NavWeaps "Atlanta (8) ... Mark 29"）；
      1.1 in 建成 3 座 + 1942 年初加 1 座 = 4 座
      （navypedia "early 1942, Atlanta, Juneau: + 1 x 4 - 28/75 Mk 1"）；
      鱼雷管 2 座四联（navypedia "2 x 4 - 533 TT"）。
      **无法确认的两点**：①第 4 座 1.1 in 是否在中途岛（1942-06）之前装好；
      ②本舰有无 20 mm（navypedia 说没有、NavSource 说 8 门，两说并列，
      见 classes/atlanta.yaml 的同名分歧条目）。故本条只写有共识的三项。

  # ============================================================ 战历节点
  - field: service.fate_category
    value: 夜战中被鱼雷与友军误击致瘫，拖带失败后爆破凿沉
    src: [danfs-atlanta, navsource-atlanta, oni-guadalcanal]
    valid: { from: 1942-11-13 }
    confidence: B
    note: >-
      DANFS 全过程原句（按时间顺序摘录）：
      ①中雷："at least one of Akatsuki's torpedoes plowed into Atlanta's forward
      engine room from the port side. She lost all but auxiliary diesel power,
      suffered the interruption of her gunfire, and had to shift steering control
      to the steering engine room aft."
      ②友军误击："Atlanta reeled under the impact of a flurry of what was
      estimated as 19 8-inch hits when San Francisco ... fired into her. Though
      almost all of the shells passed through the thin skin of the ship without
      detonating ... fragments from their impact killed many men—including
      Admiral Scott and members of his staff."
      ③拖带："Bobolink (AT-131) arrived on the scene at 0930 on 13 November and
      took Atlanta under tow—an operation made more difficult by the fact that
      the cruiser was dragging her anchor"
      ④凿沉："After the charge had been set and exploded, the last men left the
      battered ship. Ultimately, at 2015 on 13 November 1942, Atlanta sank three
      miles west of Lunga Point in 30 fathoms."
      **「19 发 8 英寸弹」这个数字 DANFS 自己加了 "what was estimated as"，
      即来源本身标注为估计值**，本条照抄不改写。
      DANFS 简史页另给了一个更大的数："approximately 50 major-caliber hits
      including several from battleship Hiei"——**两说并列，不裁决**
      （19 发 8 英寸 vs 约 50 发大口径，含日舰战列舰比叡的命中）。

  - field: service.fate_authority
    value: Commander, South Pacific Forces（南太平洋部队司令）
    src: [danfs-atlanta]
