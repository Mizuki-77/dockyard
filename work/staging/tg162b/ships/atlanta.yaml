# ============================================================================
# 亚特兰大号（USS Atlanta, CL-51）—— 亚特兰大级首舰
#
# 2026-11-23 tg162b 入库。舰级共用参数见 classes/atlanta.yaml。
#
# 五件必须记住的事：
#   1. **1942-06 中途岛时本舰已服役 5 个多月**（1941-12-24 服役）。
#      任务书里问「1942-06 是否已服役」——已服役，且确实在场。
#      DANFS 原句："During the crucial 4-6 June 1942 Battle of Midway Atlanta
#      was in the screen for Enterprise and Hornet, but these ships did not
#      come under attack."
#      **注意这句的后半段**：中途岛时本舰一炮未发（日机没打到 TF 16）。
#      这一点与很多叙述里"亚特兰大在中途岛大显身手"的印象相反。
#   2. **主炮 8 座双联 5 in/38，16 门。** 不是 8 门。
#   3. **1942-11-13 的夜战里，本舰受的伤有一部分是自己人打的。**
#      DANFS 原句："Atlanta reeled under the impact of a flurry of what was
#      estimated as 19 8-inch hits when San Francisco, "in the urgency of battle,
#      darkness, and confused intermingling of friend or foe" fired into her."
#      旧金山号（CA-38）的 8 英寸炮弹打穿了本舰薄壳，多数未爆，
#      但破片炸死了斯科特少将（RA Norman Scott）——他当时就在本舰上，
#      本舰是 TG 64.2 的旗舰。
#   4. **沉没方式是自沉（爆破），不是被击沉的那一刻。**
#      被鱼雷与炮弹打瘫后拖到库库姆附近，舰长判断无法挽救，
#      经南太平洋部队司令授权后下令弃舰、用爆破装药凿沉。
#      故 fate_type 取 sunk_by_enemy（起因是敌火），与 sikh 号的判定口径一致；
#      但"自主凿沉"这个动作必须写清楚。
#   5. **伤亡 172 死 79 伤**，出自 DANFS 简史页；长稿页没有伤亡数字。
# ============================================================================

id: atlanta
name:
  zh: 亚特兰大号
  en: USS Atlanta
class: atlanta
note: >-
  亚特兰大级首舰，舷号 CL-51（本级后续舰 1949 年改 CLAA，本舰未及）。
  以佐治亚州亚特兰大市命名。
  二战获 5 颗战斗之星与总统单位嘉奖（Presidential Unit Citation）。
  DANFS 简史页原句："The only light cruiser to be awarded the Presidential Unit
  Citation in World War II"。

open_ended_note: >-
  本舰生涯极短（1941-12-24 服役 → 1942-11-13 沉没，不到 11 个月），
  故绝大多数 fact 的 valid.to 取 1942-11-13。
  武备状态在两个时点之间只有一次变化（1942 年初加装第 4 座 1.1 in），
  逐期差别见 classes/atlanta.yaml 与下面的 note。

