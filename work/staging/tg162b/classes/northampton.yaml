  # ============================================================ 防护
  - field: protection.scheme
    value: incremental
    src: [navypedia-northampton]
    valid: { from: 1930-05-17 }
    confidence: C
    note: >-
      **属归类判定，不是来源原话。** navypedia 没有用 all-or-nothing 或
      incremental 这两个词。判定依据是本页的两句自述：
      "At the designing an immune zone was not defined, however the calculations
      conducted in 1933 have shown, that protection against 130mm shells on a
      distance from more than 40 cables was provided, the immune zone against
      152mm shells laid in a 50-105 cables interval, but only for magazines"
      以及 "Under 203mm shells immune zone was absent."
      即：要害局部加厚（弹药库段 95 mm）、机舱段减薄（76 mm）、
      水平防护按部位分 51 / 25 mm，**对 8 英寸弹完全没有免疫区**——
      「要害局部加厚 + 其余薄板」的叠加式防护，归 incremental。

