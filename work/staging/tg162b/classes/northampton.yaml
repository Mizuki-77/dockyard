# ============================================================================
# 北安普敦级重巡洋舰（Northampton class heavy cruiser）
#
# 2026-11-23 tg162b 建。本级共 6 艘（CL/CA-26 Northampton、27 Chester、28 Louisville、
# 29 Chicago、30 Houston、31 Augusta），本轮只入库首舰北安普敦。
# 同级另 5 艘的 dates 与战历**不进本文件**，将来入库时各写自己的单舰文件。
#
# 三件必须记住的事：
#   1. **建成时有 2 座三联 21 in 鱼雷管，1931 年全部拆除。**
#      所以 1942 年中途岛时本舰没有鱼雷管。navypedia 改装表原句
#      "1931, all: - 2 x 3 - 533 TT"；NavSource 1930 年代照片说明
#      "prior to the removal of her torpedo tubes" 是旁证。
#      「本级有鱼雷管」这句话只对 1931 年以前成立。
#   2. 主炮是三座三联 8"/55 Mk 9（**Mk 9 不是英国郡级的 Mk VIII**，
#      两者的 NavWeaps 页面不同，本站已有 navweaps-8in-50-mk8 是英国炮）。
#   3. 装甲数字来自 navypedia 的「belt: 95 - 76」这种双值写法，
#      本文件按 navypedia 自己的正文拆开登记（机舱段 76 / 弹药库段 95），
#      没有自行取平均或取上限。
# ============================================================================

id: northampton
name:
  zh: 北安普敦级
  en: Northampton class
class_of:
  - northampton
note: >-
  北安普敦级重巡洋舰。本级为 1929 财年计划（navypedia 原句 "All 6 ships were built
  under FY1929 program"）。设计上是彭萨科拉级的改进型：把彭萨科拉级那个
  「首尾双联、背负三联」的怪异主炮布置改成统一的三座三联，
  换来更宽裕的舰容与更好的适航性。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从首舰服役（1930-05-17）起到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。
  valid.from 取首舰北安普敦的服役日 1930-05-17，不是设计定案日
  （navypedia 未给设计定案日）。

