  # ============================================================ 武备概览
  - field: armament.mount.summary
    value: >-
      建成时：3 × 三联 8 in/55 Mk 9（203 mm）主炮 + 4 × 单装 5 in/25 高平两用炮
      + 2 × 三联 21 in 鱼雷管 + 2 具弹射器、4 架水上飞机。
      1931 年拆除全部鱼雷管；1938-39 年副炮由 4 门增至 8 门；
      1941 年末以 4 座四联 1.1 in/75 取代 3 in 高炮；
      1942 年拆除 8 挺 0.5 in 机枪、加装 14 门 20 mm 厄利孔。
    src: [navypedia-northampton]
    valid: { from: 1930-05-17, to: 1942-12-01 }
    confidence: C
    note: >-
      概览条，逐项依据在下面各 mount 实体与单舰文件的武备 fact 里。
      navypedia 原句（建成态）：
      "Armament 3 x 3 - 203/55 Mk 9.10.11/13/14, 4 x 1 - 127/25 Mk 10.11.13,
      2 x 3 - 533 TT, 2 catapults, 4 seaplanes (OL, O2U, O3U)"。
      改装链原句：1931 "all: - 2 x 3 - 533 TT"；1933 "+ 8 x 1 - 12.7/90"；
      1938-39 "+ 4 x 1 - 127/25 Mk 10.11.13"；mid-1941 "+ 4 x 1 - 76/50 Mk 20"；
      late-1941 "- 4 x 1 - 76/50; + 4 x 4 - 28/75 Mk 1"；
      1942 "- 8 x 1 - 12.7/90; + 14 x 1 - 20/70 Mk 4, Mk 3, Mk 4 radars"。

