# ============================================================================
# 彭萨科拉级重巡洋舰（Pensacola class heavy cruiser）
#
# 2026-11-23 tg162b 建。本级共 2 艘：彭萨科拉 CA-24、盐湖城 CA-25。
# 本轮只入库彭萨科拉。盐湖城的日期与战历不进本文件。
#
# 四件必须记住的事：
#   1. **主炮是 10 门，装在 4 座炮座上：2 座三联 + 2 座双联。**
#      布置方式与任何其他美国条约巡洋舰都不同——双联在首尾两端（低），
#      三联是背负在双联之上的。navypedia 原句：
#      "As a result cruisers had rather unusual arrangement of main turrets:
#      end twin turrets and superfiring triple ones."
#      这不是「几座」的问题，是「两种座型混装」的问题。
#   2. 本级是美国第一级「华盛顿条约重巡」（navypedia 原句
#      "First USN 'Washington' cruisers."），因此一切设计都是被
#      10,000 t / 8 in 两个上限逼出来的妥协。
#   3. 与北安普敦级相反：本级**弹药库段装甲厚（102 mm）、机舱段薄（64 mm）**，
#      北安普敦级是 95 / 76。两个数字不要互换。
#   4. 建成时有 2 座三联 21 in 鱼雷管，1930 年代中期拆除。
#      1942 年中途岛时无鱼雷管。navypedia "mid-1930s, both: - 2 x 3 - 533 TT"。
# ============================================================================

id: pensacola
name:
  zh: 彭萨科拉级
  en: Pensacola class
class_of:
  - pensacola
note: >-
  彭萨科拉级重巡洋舰，共 2 艘（CA-24 彭萨科拉、CA-25 盐湖城）。
  本级是美国海军第一级按华盛顿条约建造的重巡洋舰，主炮 10 门混装两种座型，
  是条约时代最典型的「火力优先、防护让路」设计。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从首舰服役（1930-02-06）起到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。
  valid.from 取首舰彭萨科拉的服役日 1930-02-06，不是设计定案日
  （navypedia 未给设计定案日，只给了「1925 年定稿」这个年份，
  严格说 valid.from 应更早，但本站以服役日为首舰起点）。

