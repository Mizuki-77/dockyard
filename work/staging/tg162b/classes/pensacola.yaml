    src: [navypedia-pensacola]
    valid: { from: 1930-02-06, to: 1946-08-26 }
    confidence: C
    note: >-
      逐项依据在下面 mount 实体与单舰文件里。navypedia 原句（建成态）：
      "Armament 2 x 3 - 203/55 Mk 9.10.11/13/14, 2 x 2 - 203/55 Mk 9.10.11/13/14,
      4 x 1 - 127/25 Mk 10.11.13, 2 x 3 - 533 TT, 2 catapults, 4 seaplanes (OL, O2U)"。
      改装链：mid-1930s "- 2 x 3 - 533 TT; + 8 x 1 - 12.7/90"；
      early 1941 "- 8 x 1 - 12.7/90; + 4 x 1 - 127/25 Mk 10.11.13"；
      11/1941 "+ 2 x 4 - 28/75 Mk 1"；1942 "+ 2 x 4 - 28/75 Mk 1, 8 x 1 - 20/70 Mk 4"；
      late 1942 "- 4 x 4 - 28/75; + 4 x 4 - 40/56 Mk 1.2, 4 x 1 - 20/70 Mk 4"。

