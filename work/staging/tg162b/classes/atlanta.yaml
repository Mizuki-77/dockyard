# ============================================================================
# 亚特兰大级防空巡洋舰（Atlanta class anti-aircraft cruiser）
#
# 2026-11-23 tg162b 建。本级共 11 艘，分两批设计：
#   原设计 4 艘（CL-51 Atlanta、52 Juneau、53 San Diego、54 San Juan），
#   改进设计 4 艘（CL-95 Oakland、96 Reno、97 Flint、98 Tucson），
#   战后 3 艘（CL-119 Juneau、120 Spokane、121 Fresno）。
# 本轮只入库首舰亚特兰大 CL-51。
#
# 五件必须记住的事：
#   1. **主炮是 8 座双联 5"/38（Mark 29 炮座），共 16 管。**
#      这是本级与重巡的根本区别，也是 docs/32 已记录的纠正：
#      七艘重巡装 5"/25，只有亚特兰大装 5"/38。
#      注意「8 座」不是「8 门」——8 座双联 = 16 门。
#      NavWeaps 炮座段原句 "Atlanta (8) ... Mark 29"，括注是**座数**。
#   2. 本级建成时**有鱼雷管**：2 座四联 21 in，用 Mark 15 鱼雷。
#      NavWeaps 鱼雷页原句 "Ship Class Used On: Destroyers and
#      Atlanta (CL-51) Class Cruisers"。
#   3. 建成时轻高炮是 3 座四联 1.1"/75（28 mm），1942 年初 Atlanta 与 Juneau
#      各再加 1 座成 4 座。**不是 40 mm**——本级换 40 mm 是 1943 年以后
#      在 CL-95 起的改进型上做的，CL-51 到沉没都没装过 40 mm。
#      NavSource 题头把 40 mm 写进 CL-51 的武备行，与本舰战历矛盾，见分歧表。
#   4. 主炮 16 门的说法只在「管数」口径下成立。若按「座」记，是 8 座。
#      两种口径混用时最容易被误读成「16 座」。
#   5. 本级超重严重（navypedia "on lead-ship CL51 it was above 700t"），
#      设计 35 节从未达到。DANFS 题头写 33.6 节、navypedia 写 32.5 节，
#      两者都不是 35。见 propulsion.speed.design 的 note。
# ============================================================================

id: atlanta
name:
  zh: 亚特兰大级
  en: Atlanta class
class_of:
  - atlanta
note: >-
  亚特兰大级防空巡洋舰。最初设想为驱逐舰分队领舰（flotilla leader），
  最终成为二战美军最专用的防空巡洋舰。DANFS 原句：
  "the first of a new class of ships originally conceived as flotilla leaders
  but which became known as particularly effective antiaircraft cruisers"。

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从首舰服役（1941-12-24）起到该级最后一艘退役或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。
  注意：本级的两个设计批次（CL-51~54 原设计 / CL-95~98 改进型）武备不同，
  本文件的时间窗与数值一律以 CL-51~54 原设计批次为准，
  改进型的差异写在各自的 note 里，不混算。

