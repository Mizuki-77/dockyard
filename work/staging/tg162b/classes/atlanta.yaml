    note: >-
      navypedia 改装表 "early 1942, Atlanta, Juneau: + 1 x 4 - 28/75 Mk 1"。
      建成 3 座 + 加 1 座 = 4 座。
      **时间窗从 1942-01 起是「early 1942」的粒度落点，不是来源原话。**
      这带来一个必须标注的不确定性：**无法确认这第 4 座是否在
      1942-06 中途岛之前装好**。DANFS 说中途岛时本舰在 TG 16.2 护卫大黄蜂，
      但没有逐座清点防空炮。故本条只声明「1942 年内存在 4 座」，
