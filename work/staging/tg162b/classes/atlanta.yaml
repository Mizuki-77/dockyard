      "St. Louis (4), Atlanta (8), Oakland (6) and Juneau (ii) (6): Mark 29"。
      **括注的 8 是本级原设计批次的座数，不是管数。**
      8 座 × 2 管 = 16 管，这才是 DANFS 题头 "16 5"""" 的含义。
