  - id: oni-tassafaronga
    title: The Battle of Tassafaronga — ONI Combat Narrative（HyperWar 转录）
    url: https://www.ibiblio.org/hyperwar/USN/USN-CN-Tassafaronga/index.html
    type: official_publication
    tier: B
    role: [data, narrative]
    operator: Office of Naval Intelligence, US Navy（HyperWar Foundation 转录）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain
    note: >-
      **本轮补到的最高价值来源。** ONI 官方战斗叙事（Combat Narrative 系列），
      带逐分钟时间线与逐舰战损。本轮靠它补到了四项别处没有的数据：
      ①北安普敦生还数「57 officers and 716 men」；
      ②北安普敦塔萨法隆加舰长 Capt. Willard A. Kitts, III（中途岛时是 Chandler，已换人）；
      ③彭萨科拉中雷时刻 2339 与 turret III 失效、两台陀螺震坏等故障清单；
      ④TF WILLIAM 四舰合计伤亡「19 officers and 398 enlisted men」。
      **注意**：该文把参战编队称为 "Task Force WILLIAM"（按司令姓氏的
      保密代号），全文**没有出现 "TF 67" 这个番号**。番号出自 DANFS 彭萨科拉页。

  - id: oni-guadalcanal
    title: The Battle of Guadalcanal, 12-15 November 1942 — ONI Combat Narrative（HyperWar 转录）
    url: https://www.ibiblio.org/hyperwar/USN/USN-CN-Guadalcanal/USN-CN-Guadalcanal-1.html
    type: official_publication
    tier: B
    role: [data, narrative]
    operator: Office of Naval Intelligence, US Navy（HyperWar Foundation 转录）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain
    note: >-
      亚特兰大号 1942-11-13 夜战的权威叙事。本轮靠它补到了四项：
      ①亚特兰大在挨旧金山号误击**之前**已被日舰击中「thirteen 5.5-inch hits
      and some 3-inch ... and twelve 5-inch from the destroyers」；
      ②中雷后「All power was lost, except the auxiliary Diesel, and the rudder
      was jammed left」；
      ③旧金山号误击「19 hits ... with 8-inch armor-piercing ammunition ...
      The shells were loaded with green dye, the San Francisco's color」；
      ④10-30 那次对肖特兰角（Point Cruz）的炮击「Beginning at 0030 on 30 October,
      the light cruiser Atlanta and four destroyers bombarded enemy positions back
      of Point Cruz for 8 hours」。
      **该文把亚特兰大归为 CLAA**："CLAA 2 (Atlanta, Juneau)"——与本站按
      light_cruiser 登记的口径不同，见 RESEARCH-NOTES §6.9。

