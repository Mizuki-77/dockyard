# ============================================================================
# 来源分片 —— tg162b（北安普敦 CA-26 / 彭萨科拉 CA-24 / 亚特兰大 CL-51）
#
# 只登记本轮**实际采用**的来源。已在 data/sources.yaml 登记的直接复用，不重复：
#   navweaps-5in25-mk10 / navweaps-5in38-mk12 / navweaps-11in75-mk1 /
#   navweaps-20mm-oerlikon / nhhc-midway-us-order-of-battle
#
# 抓取方式说明（主会话合并时请读 RESEARCH-NOTES.md §0）：
#   本机对 history.navy.mil 与 navsource.org 的 TLS 握手被重置
#   （SSL: UNEXPECTED_EOF_WHILE_READING，Python/curl 均失败），
#   DANFS 正文改由 web.archive.org 快照或 ibiblio 转录取得。
#   因此 danfs-northampton / danfs-pensacola 的 access 记 proxy。
# ============================================================================
