  - id: enterprise-war-diary-midway
    title: U.S.S. Enterprise (CV6) War Diary, June 1942（midway1942.com 转录）
    url: https://midway1942.com/docs/usn_doc_21.shtml
    type: document
    tier: B
    role: [data, narrative]
    operator: 转录站点 midway1942.com；原件为 USN 舰艇战报（1942-06）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain
    note: >-
      一手战报的转录本。**本轮最关键的一条证据在这里**：
      "Task Group 16.2, Rear Admiral T.O. Kinkaid in MINNEAPOLIS, NORTHAMPTON, PENSACOLA,
      ATLANTA, NEW ORLEANS, VINCENNES" —— 明确旗舰是明尼阿波利斯。
      另 06-06 条目把 TF 16 分成 ENTERPRISE 组（含 NORTHAMPTON、PENSACOLA）与
      HORNET 组（含 MINNEAPOLIS、NEW ORLEANS、ATLANTA），可交叉验证"谁护谁"。
