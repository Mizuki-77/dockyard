  - id: facta-nautica-piorun
    title: 'Polska Marynarka Wojenna: ORP "Piorun" (ex HMS "Nerissa")'
    url: https://facta-nautica.graptolite.net/Piorun.html
    type: website
    tier: D
    role: [data, narrative]
    operator: dr Piotr Mierzejewski（Facta Nautica）
    lang: pl
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      **本文件最重要的一条波兰方证据在这里：它转录了一份波兰海军一手文件。**

      文件为波兰海军首长办公室（Kierownictwo Marynarki Wojennej）
      1940-11-13 第 20 号密令（伦敦，TAJNE 密级），原文转录见该页。
      内容要点：
      （1）英制驱逐舰 Nerissa 于 1940-11-05（5.XI.40）升波兰军旗、
      编入波兰海军，经总司令同意得名 ORP Piorun，同日进入战时编制；
      （2）该舰不属驱逐舰分队建制；
      （3）为登记与供给之目的，确认 Piorun 舰员自 1940-10-24 至 11-04
      按 Nerissa 编制在册，此期间按一级预备役待遇。
      签署人：海军参谋长 Świrski 少将。
      来源标注：Polska Marynarka Wojenna 1939-1947, Wybór dokumentów,
      t. 1, Gdynia 1999, 文件选编 Zbigniew Wojciechowski。

      **定级说明：** 转录件本身是 D 级网站，命令原件属 A 级。
      按「只能引到手的东西」原则登记为 D，但在 note 里全程注明
      「这是对 A 级文件的转录」，引用时以命令原文为准、不以该站叙述为准。

      同一页另给：波兰旗下服役期 1940-11-05 至 1946-09-28，
      战后改名 HMS Noble（舷号 D165），1955 年除籍、
      在 Clayton & Davie（Dunston）拆解。

  - id: navweaps-4-7in-45-mk9
    title: Britain 4.7"/45 (12 cm) QF Mark IX and Mark XII — NavWeaps
    url: https://www.navweaps.com/Weapons/WNBR_47-45_mk9.php
    type: website
    tier: D
    role: [data]
    operator: NavWeaps（Tony DiGiulian）
    lang: en
    access: proxy
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      **本舰主炮的唯一数据来源**（weapon id `47in-45-mk12`）。
      覆盖 Mark IX / Mark XII 两型的炮身、弹药、弹道、装座全套参数。

      关键条目：
      - 装舰一览：Mark XII 用于 "Tribal, J, K and N destroyer classes"，
        以及 "Netherlands: Van Galen (ii) class (ex-RN "N" destroyers)"。
        —— 这一句是「N 级用 Mark XII」的直接证据。
      - 装座一览：**"Abdiel (3), Tribal (4), J (3), K (3) and N (3): CPXIX"**
        —— 括注是装座数，**N 级 3 座**。这是「N 级主炮 6 门不是 8 门」
        最硬的一条证据，直接回答本站本轮的核心疑问。
      - 炮身重 Mark XII 3.238-3.245 长吨；Mark IX 2.963-2.984 长吨。
      - 弹重 HE / SAP 均 50 lbs（22.68 kg）；初速 2,650 fps（808 m/s）；
        装药 SC 109 11.58 lbs（5.25 kg）或 NF/S 164-048 13.13 lbs（5.96 kg）。
      - 射程 40° 时 17,000 yd（15,545 m）；30° 时 15,800 yd（14,450 m）。
      - 射速 CPXIX 10-12 发/分，其余单装座 7-10 发/分。
      - 身管寿命 1,400 发；药室 628 in³（10.29 dm³）。
      - 备弹：只给部族级（Tribals: 200 SAP + 50 HE + 50 星弹 per ship），
        并注 "Others: N/A, but probably similar to Tribals"。
        **N 级无逐炮备弹数据**，本文件的 weapon.ammo_outfit 因此
        只能用部族级的整舰数并在 note 里标注口径。
      - 一句重要的评价：这些炮 "were of limited use in the anti-aircraft
        role"、缺 DP 功能是二战英国驱逐舰被空袭击沉多于其它原因的重要背景。

      **口径提示：** navweaps 把 Mark IX 与 Mark XII 合在一页，
      数值凡未特别标注者两型共用；标注 "Mark XII" 或 "Mark IX" 的
      才是分型值（炮重、炮身长）。本文件逐条按标注取。

      该站被本地网络判为 proxy（历史抓取需经代理），沿用既有
      navweaps-* 条目的 access: proxy 约定。

      原始页面与提取文本存 work/staging/g6-piorun/_raw/（转引自
      work/staging/g4-tribal/_raw/navweaps-47-45-mk9.{html,txt}）。

