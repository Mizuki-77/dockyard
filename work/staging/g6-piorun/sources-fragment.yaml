  - id: navypedia-jkn
    title: '"J", "K" and "N" destroyers (JERVIS) (24, 1939 - 1942) — Navypedia'
    url: https://www.navypedia.org/ships/uk/brit_dd_j_k_n.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Navypedia（Ivan Gogin 主编）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      J/K/N 三级合页，**舰级文件的主力来源**。给出：
      八舰完整建造表（厂号、下水、建成、结局）、
      本级技术数据（标准 1760-1773 / 满载 2330-2384，后期 2540-2555）、
      各舰逐条武备配置（含 Noble 1946 年状态）、
      1940-1946 年逐次改装清单、本级设计史与「两锅炉舱」的取舍理由。

      **口径提示一：本级 "Displacement standard, t" 写 1760-1773。**
      1760 是 J/K 级的值，1773 是 N 级的值，同栏混列。
      本文件按 N 级取 1773，并在 fact note 里写明单位（长吨/公吨）存疑。

      **口径提示二：本级合页写 "Power, h.p. 40000"，但页首
      J/K 级数据写 44,000 shp。** 40,000 才是 N 级值，本文件取 40,000。

  - id: naval-history-nerissa
    title: HMS NERISSA / Polish ORP PIORUN (G 85) — Service History
    url: https://www.naval-history.net/xGM-Chrono-10DD-45N-HMS_Nerissa.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval-History.net（Lt Cdr Geoffrey B. Mason RN (Rtd) 编）
    lang: en
    access: direct
    fetched: 2026-11-22
    license: all_rights_reserved
    note: >
      **本舰逐月服役年表，战历部分主力来源。** 覆盖 1940-10 至 1945-08
      的编制调动、护航船队编号、各次行动代号，以及战后至 1955-12-02 拆解的
      完整处置链（Harwich 封存 → Sheerness → Chatham → Hartlepool →
      BISCO → Dunston, Clayton & Davie）。

      还给出两个别处没有的数：建造费 £400,963.16s（不含海军部供给的武备），
      波兰旗下累计航程 218,000 海里。

      **必须注意的两处错误：**

      一、页首标题写 "PIORUN (G 85)"，**舷号写错了**，应为 G65。
      同页正文又写 "HMS NERISSA/Polish ORP PIORUN (G 85)"。
      G85 是同级 Jupiter 的舷号。本文件不采用该舷号。

      二、正文写 "her build was completed 4th November **1941**" ——
      **年份错了，应为 1940**。同页 1940 年 11 月 4 日的条目自证。
      本文件的建造/服役日取 1940-11-04，并已在 fact note 里与波兰方
      一手文件（1940-11-13 第 20 号密令）交叉核对。

      另有 "NAPIER-Class destroyer" 的写法，属该站对 J/K/N 系列的旧称，
      不是新舰级。

