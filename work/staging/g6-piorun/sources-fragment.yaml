      本页写 "traded fire with German battleship achieving several hits.
      Of course, 4.7" shells were able only to destroy some light AA guns"
      —— 而一手战报明写本舰 "was not hit"（本舰未被命中），
      且未记载本舰有任何命中。
      按 SCHEMA §1.2，两说并列保留，**主值取一手战报**（未命中），
      分歧记在 RESEARCH-NOTES.md「有争议的记载」一节。

      另一处：本页记 1946-10-26 归还英国，与 naval-history 的 1946-09-28
      差近一个月，两说并列不裁决（详见 ships/piorun.yaml 的 note）。

