# ============================================================================
# 单舰：ORP Piorun（闪电号，舷号 G65）/ 原 HMS Nerissa / 战后 HMS Noble
# ----------------------------------------------------------------------------
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 【本舰是本站第一艘波兰军舰，也是唯一一艘「换过三次国籍」的舰】
#   1939-07-26 以 HMS Nerissa 开工（英国）→ 1940-10 借给波兰海军、
#   1940-11-04 建成即交船（波兰）→ 1946-09-28 归还英国、改名 HMS Noble（英国）。
#   所以本文件的 identity.nation / identity.operator / service.flag 全部按
#   时间窗分段写，**不是互相冲突，是三段不同的国籍状态**。
#
# 【本舰存在的价值只有一个：1941-05-26 夜里那一次交火】
#   她是追猎俾斯麦的驱逐舰群里第一艘发现目标的舰，
#   也是唯一一艘在极近距离上与德国战列舰对射的波兰军舰。
#   这一夜之后的事情（5-27 最终战）她不在场，必须写清。
#
# 调研底稿：work/staging/g6-piorun/RESEARCH-NOTES.md
# 一手材料：London Gazette 1947-10-16 增刊（Tovey 战报 §73-75），
#          登记为 london-gazette-38098，tier A。
# ============================================================================

id: piorun
name:
  zh: 闪电号
  en: ORP Piorun
class: n-class
open_ended_note: >
  N 级八舰中唯一一艘在波兰海军旗下作战的舰，也是本站入库的第一艘波兰军舰。
  1939-07-26 以 HMS Nerissa 开工，1940-10 借调波兰海军，
  1940-11-04 建成即交船改名 ORP Piorun（G65）。
  1941-05-26 夜在追猎俾斯麦时与德舰交火约一小时，是波兰海军二战最著名的一次行动。
  1946-09-28 归还英国、改名 HMS Noble（D165），1955-12-02 抵 Dunston 拆解。

facts:
