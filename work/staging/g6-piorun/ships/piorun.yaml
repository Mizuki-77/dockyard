  # ============================================================ 1941-05-26 夜战
  # 本节是本舰存在的理由，数据全部来自一手战报（London Gazette 增刊）
  # 与同期官方战史叙述。
  - field: armament.mount.summary
    value: >-
      1941-05-26 夜对俾斯麦交火：约 2238 发现目标（距 9 海里），
      2242 德舰向其开火，本舰接近至 13,500 码（约 12,340 m）开始还击，
      发射 3 次齐射后被一发近失弹夹叉（落点距舷侧约 20 码 / 18 m），
      随即停止射击、左转施放烟幕脱离。全程在德舰火力下约一小时，未被命中。
    src: [london-gazette-38098, uboat-piorun]
    valid: { from: 1941-05-26, to: 1941-05-26 }
    confidence: A
    note: >
      **这一段最容易被写错的两个数字，先说清楚：**

      一、**开火距离是 13,500 码，不是 3,500 码。**
      一手战报（London Gazette 增刊，Tovey 战报第 75 段）与同期官方战史
      转述都是 "opened fire from 13500 yards"。中文与英文通俗叙述里
      流传的「3,500 码极近距离」没有一手依据，本站不采用。
      13,500 码 ≈ 12,340 m ≈ 6.7 海里。

      二、「发射三齐射」与「德舰第三齐射夹叉」是两件事，别混。
      本舰打了三发齐射后停火；夹叉她的是**德舰**的一发齐射，
      落点距舷侧约 20 码。两个「三」在通俗叙述里常被并成一个故事。

      三、战果：**双方均无命中。** 一手战报只说德舰火力 "unpleasantly
      accurate" 而未命中；本舰 4.7 英寸炮弹即使命中也无法击穿俾斯麦的
      220-320 mm 装甲带。通俗叙述里的「命中数发、摧毁高炮」出自
      二手转述（uboat.net 的叙述页），与一手战报不符，按 §1.2 并列保留
      但不作主值，详见正文与 RESEARCH-NOTES。

