    note: >
      **归还日用 1946-09-28，不用 1946-10-26。** 两个日期都出自可靠来源：
      uboat.net 与 navypedia J/K/N 页写 1946-10-26 "returned to the Royal Navy"；
      波兰海军博物馆所藏文件与 naval-history.net 写 1946-09-28 在 Harwich 归还。
      本站取 09-28（归还动作），10-26 更可能是英方重新服役（recommissioned）日。
      两说并列，不裁决，差异记在本 note 里。
