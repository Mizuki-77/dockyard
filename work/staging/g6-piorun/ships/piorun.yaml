    valid: { from: 1940-10-10, to: 1946-09-27 }
    confidence: C
    note: >
      ORP = Okręt Rzeczypospolitej Polskiej（波兰共和国军舰）。
      navypedia 记转交日 1940-10-10，波兰方文件记升旗日 1940-11-05。
      两个日期是两件事：10-10 是英方转交决定/手续，11-05 是波兰海军
      正式升旗入编。本字段的起始日取前者（舰名自转交即改）。

  - field: identity.name_original
