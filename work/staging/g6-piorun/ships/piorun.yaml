  - field: identity.name_original
    value: HMS Nerissa
    src: [navypedia-piorun, uboat-piorun]
    valid: { from: 1939-07-26, to: 1940-10-09 }
    confidence: C
    note: >
      皇家海军原名。本级八舰按 N 字头命名，Nerissa 是唯一例外
      （Nerissa 出自《威尼斯商人》，不是字母序命名）。
      本条的终止日取借调生效前一日，因为舰名在借调时即改为 Piorun。
      正式改名文件是 1940-11-13 波兰海军 Kierownictwo Marynarki Wojennej
      第 20 号密令，追认 11-05 升波兰旗、命名 ORP Piorun；
      但英方记录与交接手续都把 1940-10 记作转交月。

  - field: identity.name_original
