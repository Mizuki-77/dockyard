# ============================================================================
# 来源分片：us-dd 组（美国海军三艘驱逐舰：Hammann / Monaghan / Benham）
# ----------------------------------------------------------------------------
# 只登记本组新用的来源。已存在且被复用的（不在此重复登记）：
#   navweaps-5in38-mk12          5"/38 Mk 12 炮本体
#   navweaps-20mm-oerlikon       20 mm 厄利孔
#   navweaps-40mm-bofors         40 mm 博福斯
#   nhhc-yorktown-midway-report  约克城号中途岛行动报告（tier A）
#   nhhc-midway-us-order-of-battle 中途岛美军编成（tier B）
#   combinedfleet-i168           I-168 战历（tier B）
#
# 抓取方式说明：history.navy.mil 与 navsource.org 在本机 TLS 握手失败
# （SSL: UNEXPECTED_EOF_WHILE_READING），改用 web.archive.org 的快照镜像抓取。
# url 一律登记原始地址，note 里给出实际取用的快照时间戳。
# ============================================================================

sources:
  # ---------------------------------------------------------------- 官方舰史
  - id: nhhc-danfs-hammann
    title: Hammann I (DD-412) — DANFS / NHHC
    url: https://www.history.navy.mil/research/histories/ship-histories/danfs/h/hammann-i.html
    type: official_publication
    tier: B
    role: [data, narrative]
    operator: Naval History and Heritage Command
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >
      美海军官方舰史（DANFS）。**直连 TLS 失败**，经 Wayback 快照
      20251209201923 取得。页首技术行原文是
      "(DD-112; dp. 1620; l. 348' 4" ; b. 36'1" ; dr. 11'5" ; a. 35 k.;
      cpl. 192; a. 4 5", 8 21" tt.; cl. Sims)" —— 舷号写成 DD-112 是 NHHC
      页面自身的录入错误（正文与人名页均写 DD-412）；dp. 1620 与
      "a. 4 5""（4 门 5 英寸）也和别处口径不同，**本条只取日期与人名，不取排水量与炮数**。

