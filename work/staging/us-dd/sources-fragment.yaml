      平甲板型）。经 Wayback 快照 20251208175037 取得。页内技术行原文
      "(DD-354: displacement 1,726; length 341'3"; beam 34'3"; draft 8'10";
      speed 36.5 knots; complement 100; armament 5 5-inch, 4 .30 caliber
