  # ---------------------------------------------------------------- 一手战报
  - id: nhhc-hammann-action-report
    title: USS Hammann (DD-412) Action Report, 4-6 June 1942
    url: https://www.history.navy.mil/research/archives/digital-exhibits-highlights/action-reports/wwii-battle-of-midway/uss-hammann-action-report.html
    type: primary_archive
    tier: A
    role: [data, narrative]
    operator: C-in-C Pacific Fleet Serial 01849 of 28 June 1942
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >
      **本组最重要的一份来源。** DD412/P6-1 Serial 2，1942-06-16 签发，
      舰长（Commander）报告 + 副舰长（Acting Executive Officer，
      署名 C. C. Hartigan, Jr., Lieut.(jg)）补充报告两份合成。
      开篇自述 "In view of the fact that the Hammann was sunk about 1600
      on June 6, with total loss of all records, this report must be made
      entirely from memory." —— 时间与位置均系事后凭记忆，**坐标与时刻按约值处理**。
      含 6 月 6 日约克城号周围完整兵力清单，是反驳「Hammann 是唯一在场驱逐舰」的直接证据。
      经 Wayback 快照 20251208125454 取得。

  - id: nhhc-dessron6-action-report
    title: Commander Destroyer Squadron Six Action Report, Battle of Midway, 4-7 June 1942
    url: https://www.history.navy.mil/research/archives/digital-exhibits-highlights/action-reports/wwii-battle-of-midway/commander-destroyer-squadron-six-action-report.html
    type: primary_archive
    tier: A
    role: [data, narrative]
    operator: Commander Destroyer Squadron Six (Capt. E. P. Sauer), Serial 094 of 12 June 1942
    lang: en
    access: direct
    fetched: 2026-11-23
    license: public_domain_us_gov
    note: >
      中途岛 TG 17.4（Balch / Benham / Morris / Anderson / Hammann /
      Hughes / Russell）的统一战报，含 6 月 4 日各舰救起幸存者人数表。
      注意它只覆盖 6 月 4 日，**不覆盖 6 月 6 日 Hammann 沉没**。
      经 Wayback 快照 20251208124920 取得。

