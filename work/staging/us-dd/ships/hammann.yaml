    from: 1942-06-06
  confidence: A
  note: '日方记录（combinedfleet-i168）给出的时刻与美方不同： "At 1331, from 1,900 yards, he fires two torpedoes at the overlapping formation, followed by two more three seconds later. The first torpedo hits HAMMANN, breaks
    her back and sinks her in about four minutes." 日方用 JST（GMT+9），美方战报用 "Zone plus ten"（GMT+10）， 1331 JST 对应 1431 GMT+10，与美方 1536 不符。 **两方时刻并列，不裁决**——时区换算之外可能还有一方记录误差。

