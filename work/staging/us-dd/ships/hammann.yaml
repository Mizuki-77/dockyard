  - nhhc-danfs-hammann
  valid:
    from: 1942-06-06
  confidence: B
  note: 'NavSource 原文 "80 of her crew were lost with the ship and remain on duty." DANFS 原文给出的是同一口径的另一种算法："the toll in dead to over 80"。 **但一手战报给的分解数字与之不同，并列不裁决**（见下一条 note）。 两源同为 B 级（官方舰史 / 官方照片档案），取 80。

    '
- field: service.casualties
  value: 81
  unit: persons
  src:
  - nhhc-hammann-action-report
  valid:
    from: 1942-06-06
  confidence: A
  note: '与上一条并列，**两说并列，不裁决**。 一手战报第 9 节原文："Of a total of 13 officers and 228 men on board, two officers were known dead and seven missing, twenty five men were known dead and forty seven missing." 即 (2
    + 7) + (25 + 47) = 81 人。 战报同段另写 "injured about eighty five more of whom twenty six died on board U.S.S. Benham enroute to Pearl Harbor" —— 若把那 26 人计入，总数将达 107。 **三个数字（80 / 81 / 107）并列，不裁决**：差别在于「在 Benham
    上伤重不治的 26 人 算不算本舰阵亡」。一手战报的两个环节都写清了，读者可自行判断。 日方记录（combinedfleet-i168）亦写 "kill 81 of her 241-strong crew"，与 81 吻合。

    '
- field: service.survivors
  value: 160
  unit: persons
  src:
  - nhhc-hammann-action-report
  valid:
    from: 1942-06-06
  confidence: A
  note: '**这是本站由一手战报的编制数与伤亡数相减得到的派生值，不是来源直接给出的数字， 引用时必须说明。** 推算过程：在舰 13 名军官 + 228 名士兵 = 241 人； 已知死亡与失踪 = 81 人；241 − 81 = 160。 若改按 DANFS/NavSource 的 80 人计，派生值将是 161。 战报另有一句旁证："all were rescued by U.S.S.
    Benham and returned to Pearl Harbor excepting the Commanding Officer and one man picked up by U.S.S. Balch and later transferred to U.S.S. Gwin" —— 即 Balch 救了 2 人（舰长 + 1 人），其余由 Benham 救起。 因该值为推算，若主会话认为不宜入库，可直接删除本条。

    '
