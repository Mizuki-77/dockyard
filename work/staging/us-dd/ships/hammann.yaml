  note: 'DANFS 原文："Charles Hazeltine Hammann was born in Baltimore, Md., 16 March 1892, and was appointed to the provisional rank of Ensign, Naval Reserve, Flying Corps, 14 October 1918, while serving overseas.
    Ens. Hammann was awarded the Medal of Honor, when, as a pilot of a seaplane 21 August 1918, off the coast of Italy, he dived down and landed next to a downed fellowpllot, brought him aboard... Hazeltine
    was killed while on active duty at Langley Field, Va., 14 June 1919." NavSource 补充了被救者的姓名与地点："landed on the Adriatic Sea to rescue Ensign George H. Ludlow"、"returned to the base at Porto Corsini, Italy"。

