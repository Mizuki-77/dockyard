  # ============================================================ 武备：1942-06 实况
  - field: armament.mount.summary
    value: >-
      1942-06 中途岛时：4 × 5"/38 单装（1942 年 5-9 月拆除 No.3 炮位）+ 8 × 20 mm 厄利孔单装
      + 2 座四联 21 in 鱼雷管（8 管）+ 4 座深弹投射器 + 2 座滑轨（共 48 枚）
    src: [navypedia-farragut]
    valid: { from: 1942-06, to: 1942-09 }
    confidence: C
    note: >
      **本条完全是 navypedia 改装年表的迭代结果，未与第二来源交叉验证。**
      逐条原文：
      (1) "mid-1941, all: + 2 DCR (14)"（加 2 座深弹滑轨，14 枚）
      (2) "5 - 9.1942, all: - 1 x 1 - 127/38 (No 3), 4 x 1 - 12.7/90; + 8 x 1 - 20/70 Mk 4,
          4 DCT (48 DC at all)"（拆 No.3 炮与全部 12.7 mm 机枪，加 8 门 20 mm 与 4 座投射器）
      (3) "late 1942, all: - 3 x 1 - 20/70; + 2 x 2 - 40/56 Mk 1.2. Full displacement was
          2307-2335t."（1942 年末减 3 门 20 mm，加 2 座双联 40 mm）

      **时间窗的边界需要说明**：第 (2) 条记的是「1942 年 5-9 月」这一段，
      中途岛（6 月 4-6 日）落在这个窗口内部，**但来源没有给出本舰具体哪一天完成改装**。
      因此「中途岛当天已经是 4 门 5 英寸」这个结论**无法从 navypedia 确证**，
      只能说「1942 年 5-9 月之间某一时点」。
      一手战报里也没有本舰的炮数记载（本组未获取 Monaghan 的中途岛行动报告全本）。
      **这是本文件最弱的一条，请主会话按需降级或删除。**

