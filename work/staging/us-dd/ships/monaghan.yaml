# ============================================================================
# 单舰：USS Monaghan（莫纳汉号，DD-354，法拉格特级）
# ----------------------------------------------------------------------------
# 本级第 7 舰。本舰有三件必须分清、极容易被混为一谈的事：
#
# 一、**珍珠港当日撞沉过一艘日本微型潜艇。** 这不是战功叙述，是一手行为记录：
#    DANFS："Monaghan cast off her mooring pendants at 0827 and began passing the north
#    end of Ford Island through the midst of the attack"；destroyerhistory：
#    "Monaghan headed for the trespasser, rammed it glancingly, then sank it with two
#    depth charges."
#
# 二、**1942-06-06 她就在约克城号现场，属于屏护圈里的五艘驱逐舰之一。**
#    这与本组另一艘 Hammann 的关系直接相关：Hammann 一手战报写
#    "About 0400, sighted Yorktown, screened by Hughes, Gwin and Monaghan"，
#    约克城号行动报告写 "The other five destroyers, Balch, Benham, Gwin, Anderson,
#    and Monaghan ... formed anti-submarine and anti-aircraft screen around Yorktown"。
#
# 三、**本舰不是战沉。** 1944-12-18 在菲律宾以东台风中倾覆沉没，
#    性质是「恶劣天气海事损失（foundered）」，不是被敌火击沉。
#    这一点必须写清，因为本站 fate_type 枚举里 sunk_by_enemy 与 wrecked 是两回事。
#
# 调研底稿：work/staging/us-dd/RESEARCH-NOTES.md
# ============================================================================

