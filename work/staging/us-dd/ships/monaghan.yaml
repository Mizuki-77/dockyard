  # ============================================================ 珍珠港事件
  - field: service.fate_authority
    value: >
      1941-12-07 珍珠港：本舰在港内以冲撞与深水炸弹击沉日本微型潜艇 I-22tou；
      舰长 Cmdr. William P. Burford 因此获海军十字勋章。
      本条目记录的是「本舰当日的行为与认定机构」，不是结局判定。
    src: [nhhc-danfs-monaghan]
    valid: { from: 1941-12-07, to: 1941-12-07 }
    confidence: B
    note: >
      DANFS 原文（完整过程）："In the midst of this bedlam Cmdr. William P. Burford,
      Monaghan's commanding officer, ordered the ship to ring up flank speed and to ram the
      submarine. ... Monaghan fired a 5-inch round that passed over the submarine and
      ricocheted off a derrick moored off Beckoning Point, and the enemy fired a second
      torpedo at the oncoming ship but it missed and detonated against the shore.
      Monaghan's bow glanced off the submarine at 0843, but the destroyer dropped two depth
      charges that detonated in the shallow harbor and sank the enemy boat, northwest of
      Ford Island."
      战果确认旁的证据："The Americans subsequently raised I-22tou, examined the boat, and
      then buried her as landfill while expanding the Submarine Base at Pearl Harbor."
      **注意与 destroyerhistory 的措辞差别**：后者写 "rammed it glancingly, then sank it
      with two depth charges"（擦碰后以两枚深弹击沉），DANFS 更精确地写 bow glanced off
      at 0843。两者不矛盾，DANFS 更细。
      Burford 的勋章评语原文："presence of mind, and devotion to duty and disregard for his
      personal safety"。
      **本条借用了 service.fate_authority 字段，属权宜之计**——该字段原设计用于记录结局判定机构，
      而本条记录的是战功认定。若主会话认为不宜占用该字段，请整条删除，内容已在
      RESEARCH-NOTES 的战历一节里。

