# ============================================================================
# 舰级：Sims class（西姆斯级驱逐舰，DD-409 – DD-420）
# ----------------------------------------------------------------------------
# 本级十二舰：Sims / Hughes / Anderson / Hammann / Mustin / Russell /
#             O'Brien / Walke / Morris / Roe / Wainwright / Buck
# 本组只入库其中一艘：USS Hammann (DD-412)。
#
# 【本级必须说清的两件事，网络上抄错最多】
#
# 一、**本级不是「1,500 吨级」。** 它是 FY1937 计划里在 Benham 级基础上放大出来的
#    1,570 长吨设计，navypedia 给标准排水量 1,764 t。destroyerhistory 原话
#    "1,570 long tons design; 1,770 long tons to design waterline"。
#    虽然常与 Farragut/Mahan/Bagley/Gridley/Benham 并称「1,500 吨级谱系」，
#    但那是谱系说法，不是本级的吨位。
#
# 二、**本级十二舰的鱼雷管分两批，建成态不同。** navypedia 原文
#    "DD409 - 413: ... 3 x 4 - 533 TT (16)"，而 "DD414 - 420: ... 2 x 4 - 533 TT (8)"。
#    1940 年夏 DD409-413（含 Hammann）拆掉一座四联，才与后一批拉平到 2 座 8 管。
#    所以「西姆斯级建成时 12 管」这句话只对前五艘成立。
#
# 五座主炮的炮座型号是本组的核实重点，navweaps 有明确分型，见下方 mount 实体。
#
# 调研底稿：work/staging/us-dd/RESEARCH-NOTES.md
# ============================================================================

id: sims
name:
  zh: 西姆斯级驱逐舰
  en: Sims class destroyer
class_of: [hammann]
open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: Sims class
    src: [navypedia-sims, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      级名取首舰 USS Sims (DD-409)。destroyerhistory 原文 "The 1,570-ton Sims class,
      authorized in 1937"，navypedia 原文 "12 destroyers of the FY1937 program"。

  - field: identity.name_zh
    value: 西姆斯级
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: C

  - field: identity.name_en
    value: Sims class
    src: [navypedia-sims, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C

  - field: identity.ship_type
    value: destroyer
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: A
    note: >
      navypedia 把本级归入 "TORPEDO SHIPS" 大类下的驱逐舰；美军官方分类即 destroyer，
      本级无加大舰体的 flotilla leader 子型。

  - field: identity.nation
    value: united_states
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: A

  - field: identity.operator
    value: United States Navy
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: A

  - field: identity.era
    value: ww2
    src: [navypedia-sims]
    valid: { from: 1939-08-11, to: 1946-07-01 }
    confidence: A
    note: >
      按服役期定位。首舰 Sims 1939-08 服役、末舰 Buck 1940-05 服役；
      本级在二战中损失四艘（Sims / Hammann / O'Brien / Walke），
      其余七艘 1946-1948 年间作为比基尼靶舰或拆解处理（destroyerhistory 有完整清单）。

  - field: identity.building_program
    value: FY1937 造舰计划（12 艘），由 Benham 级方案放大而来
    src: [navypedia-sims]
    valid: { from: 1936 }
    confidence: C
    note: >
      navypedia 原句："12 destroyers of the FY1937 program originally were planned to
      build under slightly changed project of Benham class, but after long-term
      discussions on the General Board supporters of strong artillery were possible
      manage on returning the fifth 127mm gun at the expense of reduction of number
      of quadruple TTs to 3."
      即：本级相对 Benham 级，用「少一座四联鱼雷管」换回「第五门 5 英寸炮」。
      同段还有一句解释吨位为什么是 1,570 而不是 1,500：
      "Originally her standard displacement was defined 'contractual' 1500t, however
      in May, 1936 the Senate ratified the total document of London Naval Conference
      according to which upper limit of destroyer displacement was lifted to 3000t.
      ... standard displacement of new destroyer has increased at 70t: simply real
      overload included in the design initially was officially claimed."
      这句话是本级「不是 1,500 吨级」的直接出处。

  - field: identity.namesake
    value: 首舰以西姆斯海军少将（William Sowden Sims）命名；本级其余各舰均以美海军人物命名
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: C

  # ============================================================ 排水量
  - field: displacement.standard
    value: 1764
    unit: t
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: C
    comparable: false
    note: >
      **口径警告，本条不参与高低比较。** navypedia 标为 "Displacement standard, t" 给 1764。
      另有两个不同口径的数并存：
      (a) destroyerhistory 原文 "Displacement: 1,570 long tons design; 1,770 long tons
          to design waterline."（1,570 lt = 1,595 t，设计值；1,770 lt = 1,798 t，到设计水线）
      (b) nhhc-danfs-hammann 页首技术行给 "dp. 1620"，该页同一行还把舷号误写成 DD-112，
          整行可信度存疑，不采用。
      三者基准不同（设计值 / 条约标准排水量 / DANFS 旧口径），无法换算对齐，
      故只登记 navypedia 值并标 comparable: false。

  - field: displacement.full
    value: 2313
    unit: t
    src: [navypedia-sims, navsource-hammann]
    valid: { from: 1939 }
    confidence: C
    note: >
      两源一致。navypedia "Displacement full, t | 2313"；
      navsource-hammann "Displacement 2313 Tons (Full)"。
      注意 destroyerhistory 另给 "Fuel bunkerage: 451.39 tons full load (95%)"，
      但未给满载排水量总数，故不与本条冲突。

  # ============================================================ 主尺度
  - field: dimensions.length.oa
    value: 106.2
    unit: m
    src: [navypedia-sims, navsource-hammann]
    valid: { from: 1939 }
    confidence: C
    note: >
      navypedia "Length, m | 103.9 wl 106.2 oa"；navsource-hammann "348' 4"(oa)" = 106.17 m。
      destroyerhistory 给更精确的英制原值 "Length: 348' 1-3/4" overall"（= 106.11 m），
      与 106.2 差 9 cm，属四舍五入，并列于此。

  - field: dimensions.length.wl
    value: 103.9
    unit: m
    src: [navypedia-sims, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      navypedia "103.9 wl"；destroyerhistory "340' 10-1/8" design waterline"（= 103.88 m）。

  - field: dimensions.beam.wl
    value: 11.0
    unit: m
    src: [navypedia-sims, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      navypedia "Breadth, m | 11.0"；destroyerhistory "Beam: 36' 1-1/8""（= 11.00 m）。
      该值同时是最大宽（本级舷侧无外飘），故不另登记 beam.max。

  - field: dimensions.draught.mean
    value: 3.91
    unit: m
    src: [navypedia-sims, navsource-hammann]
    valid: { from: 1939 }
    confidence: C
    note: >
      **装载状态已绑定：满载。** navypedia 原文 "Draught, m | 3.91 full load"；
      navsource-hammann "12' 10" (Max)"（= 3.91 m）。
      **第三个值无法调和，并列在此不裁决**：destroyerhistory 给
      "Draft: 17' 4" max."（= 5.28 m），脚注 3 指向 Friedman。
      5.28 m 与 3.91 m 差 1.37 m，不可能是同一装载状态的四舍五入，
      本站未找到能判定谁对的来源，故只按两源一致的 3.91 登记。

  # ============================================================ 动力
  - field: propulsion.plant_type
    value: steam_turbine
    src: [navypedia-sims, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: A
    note: >
      两级齿轮传动蒸汽轮机 + 锅炉。destroyerhistory 引 Friedman 指出本级是
      **最后一级没有把动力装置拆成「锅炉舱/机舱成对分隔」的美军驱逐舰**
      （"the last without a powerplant 'split' into pairs of firerooms and engine rooms
      for increased survivability, as betrayed by their single stack"）——
      这一句同时解释了本级为什么只有一根烟囱，也是与后继 Benson/Gleaves 级的分水岭。

  - field: propulsion.shafts
    value: 2
    unit: count
    src: [navypedia-sims, navsource-hammann]
    valid: { from: 1939 }
    confidence: A

  - field: propulsion.boiler.count
    value: 3
    unit: count
    src: [navypedia-sims, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      两源一致。navypedia "3 Babcock & Wilcox boilers"；
      destroyerhistory "Propulsion machinery: 3 x Babcock & Wilcox boilers; 665 psi, 715° F."
      三锅炉汇入单烟囱，是本级外形的直接成因。

  - field: propulsion.boiler.type
