  # ============================================================ 武备概览
  - field: armament.mount.summary
    value: >-
      建成态：5 × 5"/38（12.7 cm）Mk 12 单装（前二、后三；1、2、5 号炮位为封闭式
      Mk 30 Mods 0/2，3、4 号炮位为敞开式 Mk 30 Mod 1）
      + 4 × 12.7 mm（0.5 in）机枪
      + DD409-413：3 座四联 21 in 鱼雷管（12 管，备雷 16 枚）；
        DD414-420：2 座四联（8 管）
      + 2 座深弹滑轨（10 枚）
    src: [navypedia-sims, navweaps-5in38-mk12, destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      **这是建成态，不是 1942 年中途岛时的状态。** 本级在 1940-1942 年间经过三轮
      加改装（见 RESEARCH-NOTES 的改装年表），Hammann 沉没时的实际配置写在她自己的
      单舰文件里。本条只描述设计与建成状态，避免「建成态被当成战历配置」这个常见错误。

      炮位型号的直接出处是 navweaps-5in38-mk12 的 Mount/Turret Data 表，原文分两行：
      "Single Enclosed Base Ring Mounts ... Sims (3) Mark 30: Mods 0 and 2 [mounts 1, 2 and 5]"
      与 "Single Open Base Ring Mounts ... Sims (2), Benson (2) and Gleaves (2): Mark 30 Mod 1
      [mounts 3 and 4]"。
      ——这正是本组任务书里标为「待核实」的西姆斯级炮座型号问题，至此有据。

      注意 destroyerhistory 的措辞略有出入："Main gun battery: four (initially five) dual
      purpose 5-inch/38: two forward in enclosed base ring mounts; two, (initially three) aft
      in open and/or enclosed base ring mounts." 与 navweaps 的分型一致（前二封闭、后部混合）。

  - field: armament.torpedo.tubes
    value: 12
    unit: count
    src: [navypedia-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      **只对 DD409-413 成立。** navypedia 原文 "DD409 - 413: ... 3 x 4 - 533 TT (16)"，
