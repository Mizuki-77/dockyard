      1940 年夏 DD409-413 拆掉一座四联，本级遂全部统一到 8 管 —— 见单舰切片。
      **NavSource 与 DANFS 对该级的记载已采用 8 管口径**（navsource-hammann
      "8 x 21" tt.(2x4)"、danfs-hammann "8 21" tt."），与 navypedia 的「建成 12 管」并列，
      两说并列不裁决。

  - field: armament.torpedo.diameter
