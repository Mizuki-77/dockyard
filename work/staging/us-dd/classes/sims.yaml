  - about: mount:sims-torpedo-quad
    field: mount.position
    value: midships
    src: [destroyerhistory-sims]
    valid: { from: 1939 }
    confidence: C
    note: >
      destroyerhistory 原文 "as designed: twelve 21-inch: one quadruple centerline mount
      abaft the stack; one quadruple wing mount on each side of the main deck;
      in service: eight 21-inch in two quadruple centerline mounts abaft the stack".
      即设计是「中线 1 座 + 两舷各 1 座」，服役态改为「烟囱后中线 2 座」，
      原因是舷侧鱼雷管在北大西洋海况下锈蚀严重且易被浪打坏（navypedia 有完整说明）。
