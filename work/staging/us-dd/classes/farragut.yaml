  # ============================================================ 武备概览
  - field: armament.mount.summary
    value: >-
      建成态：5 × 5"/38（12.7 cm）Mk 12 单装，全部为 Mark 21 敞开式基座炮架
      （前二、后二，No.3 在第二烟囱之后）
      + 4 × 12.7 mm（0.5 in）机枪
      + 2 座四联 21 in 鱼雷管（8 管，中线布置）
    src: [navypedia-farragut, navweaps-5in38-mk12, destroyerhistory-farragut]
    valid: { from: 1934-06 }
    confidence: C
    note: >
      **炮座型号有明确出处**：navweaps-5in38-mk12 的 Mount/Turret Data 表原文
      "Single Open or Open-back Shield Pedestal Mounts — Farragut (5) and Mahan (5): Mark 21"。
      即本级五座炮位全部是 Mark 21 基座式炮架，**没有一座是封闭式**——
      这与后来的 Sims 级（3 座封闭 + 2 座敞开）和 Benham 级（2 座封闭 + 2 座敞开）不同，
      是识别本级炮位外形的直接依据。

      destroyerhistory 的措辞："Main gun battery: as built: 5 x 5-inch/38 caliber dual
      purpose guns; as modified: 4 x 5-inch/38 caliber dual purpose guns: 2 forward in
      shielded pedestal mounts; 2 aft in open pedestal mounts."
      与 navweaps 一致：建成 5 门、改装后 4 门。

      鱼雷：navypedia 原文 "2 x 4 - 533 TT"，destroyerhistory
      "Torpedo battery: 8 x 21-inch torpedo tubes in two trainable quadruple centerline mounts."
      两源一致，8 管，与设计中途放弃的「3 座三联」相对。

