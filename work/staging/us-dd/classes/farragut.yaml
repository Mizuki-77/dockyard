# ============================================================================
# 舰级：Farragut class（法拉格特级驱逐舰，DD-348 – DD-355）
# ----------------------------------------------------------------------------
# 本级八舰：Farragut / Dewey / Hull / Macdonough / Worden / Dale / Monaghan / Aylwin
# 本组只入库其中一艘：USS Monaghan (DD-354)。
#
# 【本级是美军第一代「条约型 1,500 吨驱逐舰」，也是第一级装上 5"/38 的军舰】
#   destroyerhistory 原文：The original "goldplaters" were eight ships of the Farragut
#   class, which surpassed the preceding flush deckers in speed, maneuverability,
#   seaworthiness, range, armament and habitability.
#   navweaps 的 5"/38 Mk 12 条目里 "First used on USS Farragut (DD-348)" ——
#   这句话让本级成为整个 5"/38 炮族的起点，不是随便一级老驱逐舰。
#
# 【「四烟囱」这个说法在本组的来源里查不到】
#   本组任务书说本级是「老式 4 烟囱驱逐舰」。可查到的来源只支持**两根烟囱**：
#     - destroyerhistory：五门炮中的 No.3 炮位在 "abaft the second stack"（第二烟囱之后）
#     - NavSource DD-348 图注：'the red Engineering Excellence "E" painted on her
#       after smokestack'（她的后烟囱上）
#   即本级有前、后两根烟囱。四烟囱是一战平甲板型（Wickes/Clemson）的特征，
#   本级恰恰是取代它们的下一代。此事已写入 RESEARCH-NOTES 的「任务书更正」一节。
#
# 调研底稿：work/staging/us-dd/RESEARCH-NOTES.md
# ============================================================================

id: farragut
name:
  zh: 法拉格特级驱逐舰
  en: Farragut class destroyer
class_of: [monaghan]
open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

