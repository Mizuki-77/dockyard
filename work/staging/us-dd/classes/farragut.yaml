      "Design works of new generation destroyer have begun in the first half of 1928
      ... 127/25mm AA guns were used as main calibre, however soon have refused:
      by this time the new DP 127/38mm guns were ready which so exceeded short-barrelled
      127/25mm gun that has followed immediate deciding to rearm designed ships.
      Simultaneously three triple TT have given way to two quadruple."
      即设计中途从「3 座三联鱼雷管」改为「2 座四联」。

  # ============================================================ 排水量
  - field: displacement.standard
    value: 1358
    unit: t
    src: [navypedia-farragut]
    valid: { from: 1934-06 }
    confidence: C
    comparable: false
    note: >
      **三个口径并存，本条不参与高低比较。**
      (a) navypedia "Displacement standard, t | 1358"
      (b) navsource-monaghan "Displacement 1365 Tons"（未写是标准还是满载口径）
      (c) destroyerhistory "Displacement: 1,500 long tons design; 1,758 long tons
          to design waterline."（1,500 lt 是**条约设计上限**，不是实测标准排水量）
      三者基准不同（实测标准 / 未标口径 / 设计上限），无法换算对齐，故标 comparable: false。

  - field: displacement.full
    value: 2064
    unit: t
    src: [navypedia-farragut]
    valid: { from: 1934-06 }
    confidence: C
    note: >
      navypedia "Displacement full, t | 2064"。
      destroyerhistory 只给到设计水线（1,758 lt = 1,786 t）与满载燃油（600.07 lt），
      未给满载排水量总数，故不冲突。
      **注意 navypedia 改装年表另有一句**："late 1942, all: ... Full displacement was
      2307-2335t." —— 那是 1942 年加装 20 mm/40 mm 与深弹后的满载值，不是建成态。

