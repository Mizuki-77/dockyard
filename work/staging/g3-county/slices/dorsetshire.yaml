# ============================================================================
# 状态切片：HMS Dorsetshire（多塞特郡号，舷号 40）
# ----------------------------------------------------------------------------
# 本舰的分界逻辑与姊妹舰 Norfolk 完全不同：
# **Norfolk 活到 1950 年，一生被五轮改装切成七片；本舰只活到 1942-04-05，
# 只有两轮真正的改装（1937、1941）。** 所以本舰的切片边界主要落在
# 「换了战场」而不是「换了装备」上 —— 这是两舰同类不同命的直接体现。
#
# 特别注意：本舰**没有** 1944 年那轮「拆 X 炮塔换防空」的大改装。
# 任何把本级「X 塔 1944 年被拆」的描述套到本舰头上的写法都是错的。
# ============================================================================
ship: dorsetshire
slices:
  - code: P0
    title: 建造与服役（1927-1930）
    from: 1927-09-21
    to: 1930-09-29
    note: >-
      1927-09-21 在朴茨茅斯海军船厂开工，1929-01-29 下水
      （掷瓶人 Countess of Shaftesbury），1930-09-30 完工服役，
      随即任第 2 巡洋舰中队旗舰。
      naval-history 把完工日写成「30th September 1929」，与它自己的
      下水年及另外两源冲突，属明显笔误。

      建成时武备与 Norfolk 同：8 门 8 英寸（4 座双联 Mk II）+
      4 门单装 4 英寸 + 4 门单装 2-pdr + 4 门 47 mm 礼炮 +
      2 座四联 21 英寸鱼雷管，无弹射器、无水上飞机。

  - code: P1
    title: 战前：本土、非洲站与中国站（1930-1939）
    from: 1930-09-30
    to: 1939-09-01
    note: >-
      1930–1933 大西洋舰队第 2 巡洋舰中队旗舰，期间经历 1931 年因弗戈登兵变
      （本舰部分舰员起初拒绝集合值勤，一个半小时后由军官恢复秩序，
      此后未再卷入）；1933–1935 任非洲站总司令旗舰；
      1935 年底调中国站，一直留到二战爆发。
      1937-02-01 至 04 与航母 Hermes、重巡 Cumberland 一起参加
      检验新加坡对假想日军进攻防御的演习。

      技术变化（navypedia 改装表）：1931 年配水机、1932 年加弹射器、
      1933 年加 2 座四联 12.7 mm 机枪、**1937 年大改装**——
      4 门单装 4 英寸换 4 座双联 Mk XVI、4 门单装 2-pdr 换 2 座八联装、
      弹射器换 E-IV-H 并配 Walrus、加第二部 HACS Mk I 高炮指挥仪、
      4 英寸弹药库扩容。1939 年拆 4 门 47 mm 礼炮。

      **1937 年改装明确没有加装甲**（combinedfleet 专题文原文
      「No additional armour was fitted」），加装后标准排水量约 10,400 t、
      满载 13,775 t。

  - code: P2
    title: 中国站开战与南大西洋（1939-09 至 1940-05）
    from: 1939-09-02
    to: 1940-05-24
    note: >-
      开战时本舰在第 5 巡洋舰中队（中国站）。1939-09-02 从上海出航黄海巡逻，
      此后在日本以南、长江口一带执行贸易破交与拦截任务。
      1939-10-18 调东印度站，10-25 抵科伦坡，与 Gloucester、Cornwall 编组；
      10-28 编入 Hunting Force I（航母 Eagle、巡洋舰 Cornwall、澳驱 Waterhen/Vendetta）。

      1939-12-03 转南大西洋站，12-19 奉命赴蒙得维的亚外海参与围堵 Graf Spee，
      但**该舰已于 12-17 自沉，本舰赶到时战斗已结束**。

      1940-02-13 在巴西弗里奥角外（22°42'S, 41°38'W）截住德国补给船 Wakama
      （3,771 GRT），德方自沉，本舰救起 46 名船员。
      **这次行动引发了外交抗议**：巴拿马总统 Augusto Samuel Boyd
      就本舰侵犯泛美安全区向英国政府正式抗议（英文维基记，
      原文引 Cressman）。1939-02 至 1940-03 间本舰已航行约 10 万英里。

      1940-03 送 Exeter 的伤员与 Wakama 的战俘到开普敦，进西蒙斯敦船坞修理；
      04-24 启程返英；05-25 抵普利茅斯，进德文波特船厂改装。

  - code: P3
    title: 法国舰队危机：达喀尔与黎塞留（1940-06 至 1940-07）
    from: 1940-06-09
    to: 1940-07-31
    note: >-
      **这是本舰 1940 年的真实战场，不是挪威。**
      法国停战后英国最担心的是法国舰队落到德国手里，本舰被派去盯最重要的那一艘：
      尚未完工的战列舰 Richelieu（約 95% 完工，1940-06-18 从布雷斯特驶往达喀尔）。

      1940-06-12 与从弗里敦出发的 US 3 运兵船团会合（护航另有 Shropshire、Cumberland），
      06-14 离队赴直布罗陀，06-16 抵港。06-23 奉命赴达喀尔监视 Richelieu。
      06-25 下午 Richelieu 出港驶向卡萨布兰卡，本舰奉命跟踪；
      06-26 05:30 弹射 Walrus 搜索，07:30 发现目标（19°27'N, 18°52'W，
      航向 010°、18.5 节），14:30 后追上并自舰尾方向跟踪。
      Richelieu 当天被达尔朗召回达喀尔，本舰继续监视。

      07-03 至 07-07 本舰与 Hermes、澳巡 Australia、单桅帆船 Milford
      一起在达喀尔外海执行「 catapult 」施压（要求法国舰队要么归英国、
      要么自沉）。**法国潜艇 Le Héros 与 Le Glorieux 奉命出击本舰，
      本舰以高速机动规避了全部鱼雷**，法方随后召回潜艇。
      07-08 英方用小艇在 Richelieu 舰尾下投深水炸弹试图炸坏其螺旋桨，
      因水浅失败。

      本舰在此期间还**创下一个未执行的方案**：舰长 Martin 曾建议
      用快速摩托艇投深水炸弹破坏 Richelieu 的螺旋桨，海军部一度令其准备，
      两小时后以「恐无效」为由否决。

      1940-07 底结束监视返弗里敦。09-04 进德班船坞，09-20 回西蒙斯敦，次日赴塞拉利昂。

  - code: P4
    title: 印度洋与截沉 Python（1940-08 至 1941-05-25）
    from: 1940-08-01
    to: 1941-05-25
    note: >-
      1940-11-18 炮击意属索马里兰的 Zante（Dante）港，发射约 200 发炮弹，
      并向码头发射鱼雷以防其被继续使用。
      1940-12-18 起参与搜捕德国袖珍战列舰 Admiral Scheer（该舰刚击沉
      英国冷藏船 Duquesa），未获。

      1941-01-21 截住维希法国商船 Mendoza，派押解组押往弗里敦。
      1941-05-11 从弗里敦出发接替护航 SL 74 船团（05-12 会合）。

      **这段末尾就是最终战的起点**：05-26 本舰奉命脱离 SL 74 参加追歼俾斯麦，
      当时它在俾斯麦位置以南约 360 海里。全速北上途中因海况恶劣
      先后降到 25 节、20 节；05-27 08:33 遇到整夜与俾斯麦交火的驱逐舰 Cossack，
      08:50 已能看到德舰炮口闪光，距离仅 6 海里。

  - code: P5
    title: 最终战：执行最后雷击（1941-05-27）
    from: 1941-05-27
    to: 1941-05-27
    note: >-
      **本舰一生最值得记的一天，也是它与姊妹舰唯一并肩作战的一天。**

      09:04 加入射击，全天发射 8 英寸弹 254 发（对照 Norfolk 527 发）。
      射击距离 20,000 码（约 18,000 m），因能见度差多次长时间停火。

      10:22 自 3,000 m 向右舷发射 2 枚 21 英寸 Mark VII 鱼雷，均命中，
      「几乎没有使她震动」；10:36 转向后自 2,200 m 向左舷再射 1 枚，命中。
      **命中数 2 中 / 3 中两说并列**（见 ships/dorsetshire.yaml 的 note）。

      战后救援：放下绳索让水中的人攀舷而上，与驱逐舰 Maori 一起捞起
      85–86 人；11:40 因瞭望报告下风出现疑似潜望镜而中止救援，
      约 800 人仍在水中。**该瞭望判断很可能有误**——德方最高生还军官
      Junack 记附近并无 U 艇，英方一手审讯也认为当时附近可能只有那一艘
      且是几小时后才赶到的。
      本舰在此战无一伤亡。

  - code: P6
    title: 大西洋搜捕与东方舰队（1941-05-28 至 1942-04-04）
    from: 1941-05-28
    to: 1942-04-04
    note: >-
      1941-05-29 返克莱德，途中遭一架德机轰炸未受损；05-30 抵南希尔兹，
      战俘移交军方。此后进泰恩河船厂改装，**加装对空警戒雷达**（型号未记）。

      1941-06 至 08 编入本土舰队第 1 巡洋舰中队，08-08 舰长由 Agar 接任。
      09-18 起在圣赫勒拿一带活动；10 月为 WS 12 运兵船团护航。
      11-11 奉命搜捕德国袭击舰 Atlantis 与其潜艇补给船 Python。
      **12-01 截住 Python**（3,664 GRT），德方自沉，U-A 向本舰发射 5 枚鱼雷
      均未命中；本舰因两艘 U 艇在场未能接收生还者。
      **注意：击沉 Atlantis 的是重巡 Devonshire（1941-11-22），不是本舰。**

      1942-01 在孟买—杜班—孟买之间护航；02 月转调保卫新加坡的船团；
      02-27 为开往仰光的 MR 5 船团护航；03-02 在缅甸撤退中派出
      皇家海军陆战队分遣队操纵近岸小艇队的摩托艇，随后护送仰光撤运船团。

      **03-24 进科伦坡船坞开始改装，03-27 入坞，03-31 因日军水面舰艇
      出现在印度洋而中断改装、出坞随东方舰队出海**
      （combinedfleet 附录 2 时间线：27 March「Dorsetshire enters dock at Colombo
      and commences refit」；31 March 1400 东方舰队出海，1900 本舰离科伦坡归队）。
      04-02 随 Cornwall 一起被派回锡兰继续改装，04-04 又被紧急召回。
      **它的位置是「被命令挪来挪去」的结果，不是主动搜敌。**

  - code: P7
    title: 印度洋空袭与沉没（1942-04-05）
    from: 1942-04-05
    to: 1942-04-05
    note: >-
      04-05 本舰与 Cornwall 一起奉召回舰队，途中在锡兰西南
      01°54'N 77°45'E 被重巡 Tone 的侦察机发现，随后遭 53 架 D3A1
      「Val」俯冲轰炸机攻击（来自 Akagi / Hiryu / Soryu）。

      命中与后果（逐条来自 Agar 战报，经 combinedfleet 专题文转述）：
      第一枚在舰艏附近爆炸，摧毁前部右舷高炮组与 A 锅炉舱；
      随后命中后甲板（X 炮塔失效）、后烟囱基部（烟囱倒塌 + 高射弹药库爆炸，
      同时打哑两座 pom-pom）；共有 10 发 250–550 磅炸弹命中与多枚近失弹；
      首次攻击 4 分钟（Agar 首份报告记 5 分钟）后舰体明显左倾，
      舰桥与全舰通信全断。**约 8 分钟后（13:50 前后）舰尾先沉。**

      姊妹舰 Cornwall 被命中 8 发，晚约 10 分钟以舰艏先沉。
      两舰共 1,546 人，次日（04-06）由巡洋舰 Enterprise 与驱逐舰 Paladin、
      Panther 救起 1,122 人；本舰单独阵亡 234 人。
      106 名日军空勤无一伤亡。

      **一个必须说清的因果**：本级的水平装甲只覆盖弹药库（1–3 英寸）、
      机舱（1⅜ 英寸）与舵机（1½ 英寸），而 250 kg 炸弹正好落在没有装甲的
      后甲板与烟囱基部。combinedfleet 专题文把损失原因列为
      「limited horizontal armour, lack of effective radar and weak anti-aircraft
      suite」三项叠加，但结论是**近因是「错误时间出现在错误位置」**——
      即被命令反复往返造成的暴露，而不是单舰性能问题。
