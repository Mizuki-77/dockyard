# ============================================================================
# 舰艇正文 —— 多塞特郡号
#
# 本舰正文的抓手是「一艘把最后两件事都做完了的船」：
# 1941-05-27 用鱼雷结束了俾斯麦号，1941-12-01 截住了 Python；
# 然后 1942-04-05 被 250 kg 炸弹在八分钟内解决。
#
# 与姊妹舰的分野在正文里明写：它没等到 1944 年那轮改装。
# 另外必须点明一条常见混淆：击沉德国袭击舰 Atlantis 的是 Devonshire，
# 本舰击沉的是补给船 Python。
# ============================================================================
ship: dorsetshire
updated: 2026-11-22

intro:
  lead:
    zh: >-
      多塞特郡号是郡级（Norfolk 子级）二号舰，一生不到十二年。
      它做过两件别人记住它的事：1941 年 5 月 27 日，它奉命贴近已经失去战斗力的
      俾斯麦号，用三枚鱼雷结束了那场追击；1941 年 12 月 1 日，它截住了德国袭击舰
      Atlantis 的姊妹补给船 Python。五个月后，1942 年 4 月 5 日，它在锡兰西南
      被日本舰载俯冲轰炸机在八分钟内击沉。
    en: >-
      Dorsetshire was the second of the two Norfolk sub-class cruisers and lived less
      than twelve years. She did two things she is remembered for: on 27 May 1941 she
      was ordered to close the crippled Bismarck and finish the chase with three
      torpedoes, and on 1 December 1941 she intercepted Python, the supply ship that
      served Atlantis. Five months later, on 5 April 1942, Japanese dive bombers sank
      her southwest of Ceylon in eight minutes.

  paragraphs:
    - heading: 本级最薄的一层装甲，账记在它的沉没上
      text:
        zh: >-
          郡级的设计是在一万吨条约上限里做取舍。英国选了长舰体、高航速、大航程，
          代价几乎全部落在装甲上：只有弹药库有一个装甲盒，机舱一又八分之三英寸，
          舵机一又二分之一英寸，其余靠二十五毫米防破片板。
          这套防护在 1942 年 4 月 5 日付了账——二百五十公斤炸弹落在没有装甲的
          后甲板和烟囱基部，引爆了高射弹药库，八分钟后舰尾先沉。
          把它写成「设计失败」并不准确：本级本来就是按「打得过同级、跑得过更快」造的，
          问题在于它被派去面对它没准备过的攻击方式。
        en: >-
          The County class was a set of trade-offs inside the 10,000-ton treaty limit.
          Britain chose a long hull, high speed and long range, and the price fell
          almost entirely on armour: only the magazines had an armoured box, machinery
          one and three-eighths inches, steering gear one and a half, everything else
          25 mm splinter plating. That protection was paid for on 5 April 1942, when
          250 kg bombs landing on the unarmoured quarterdeck and funnel base set off the
          high-angle magazine and she sank stern first eight minutes later. Calling it
          a design failure is not accurate: the class was built to outgun its equals and
          outrun anything faster. The problem was that she was sent against a form of
          attack she had never been designed for.
      src: [combinedfleet-cornwall-dorsetshire, navypedia-norfolk]

    - heading: 1940 年它不在挪威，它在南大西洋和达喀尔
      text:
        zh: >-
          常见叙述把郡级诸舰的挪威作战泛化到本舰头上，这与本舰的服役记录不符。
          1940 年 4 月到 6 月，本舰在朴茨茅斯与德文波特改装；随后它去了弗里敦，
          任务是盯住法国舰队最重要的一艘：尚未完工的战列舰黎塞留号。
          6 月 25 日黎塞留号从达喀尔出港，本舰弹射水上飞机搜索并将其跟踪；
          7 月 3 日到 7 日，本舰与竞技神号航母、澳大利亚号一起在达喀尔外海
          执行对法施压，其间被法国潜艇英雄号与光荣号攻击，
          以高速机动规避了全部鱼雷。整个 1940 年，本舰没有参加过挪威战役。
        en: >-
          It is often assumed that the Counties' Norwegian service included this ship.
          Her record says otherwise. From April to June 1940 she was refitting at
          Portsmouth and Devonport, and then went to Freetown with one task above all:
          watching the French battleship Richelieu, still incomplete. When Richelieu
          sailed from Dakar on 25 June, Dorsetshire catapulted her Walrus to find her and
          shadowed her; from 3 to 7 July she was off Dakar with Hermes and Australia
          applying pressure to the French, and was attacked there by the submarines
          Le Héros and Le Glorieux, whose torpedoes she avoided by high-speed
          manoeuvring. She took no part in the Norwegian campaign.
      src: [naval-history-dorsetshire, uboat-dorsetshire, rohwer-1940-06]

    - heading: 1941 年 5 月 27 日：它被派去结束那场追击
      text:
        zh: >-
          5 月 26 日，本舰正在为 SL 74 船团护航，奉命脱离编队参加追歼俾斯麦，
          当时它在俾斯麦号以南约三百六十海里。全速北上，夜里因海况恶化先后减速。
          27 日 08:33 它遇到整夜与俾斯麦交火的哥萨克号驱逐舰，08:50 已经能看到
          德舰的炮口闪光，距离只有六海里。
          09:04 加入射击，全天打了二百五十四发八英寸弹——不到诺福克号的一半，
          因为能见度差，它多次长时间停火。
          10:22 它自三千米向右舷发射两枚二十一英寸鱼雷，均命中，但「几乎没有使她震动」；
          十时三十六分转向后自二千二百米向左舷再射一枚，命中。
          命中数是两枚还是三枚，来源不一致，本站两个说法都记下，不做裁定。
        en: >-
          On 26 May she was escorting convoy SL 74 when ordered to leave it and join the
          hunt, some 360 nautical miles south of Bismarck. She steamed north at full
          speed, reduced during the night by heavy seas. At 0833 on 27 May she met
          Cossack, which had been engaging Bismarck all night, and by 0850 the German
          ship's gun flashes were visible only six miles away. She opened fire at 0904
          and fired 254 eight-inch rounds that day - less than half of Norfolk's total,
          because poor visibility forced lengthy checks. At 1022 she fired two 21-inch
          torpedoes from 3,000 metres into the starboard side; both hit, with almost no
          visible effect. She turned and fired one more from 2,200 metres into the port
          side at 1036, which hit. Sources differ on whether two or three torpedoes hit,
          and both accounts are recorded here without adjudication.
      src: [kbismarck-last-battle, kbismarck-histoperi, naval-history-dorsetshire]

    - heading: 击沉 Atlantis 的不是它
      text:
        zh: >-
          这里有一条容易混的账。德国袭击舰 Atlantis 是一艘战绩极高的辅助巡洋舰，
          在海上活动了六百多天。1941 年 11 月本舰确实奉命参与搜捕它，
          但真正在 11 月 22 日把它击沉的是重巡洋舰德文郡号。
          本舰一个星期后的战果是另一条船：Atlantis 的姊妹补给船 Python，
          12 月 1 日在圣赫勒拿以西被本舰截住。Python 当时正在给 U-68 与 U-A 补给，
          德方自沉，U-A 向本舰发射五枚鱼雷全部落空；
          本舰因为两艘潜艇还在附近，没有接收生还者。
        en: >-
          One account is easily confused. The German raider Atlantis was a highly
          successful auxiliary cruiser that operated for more than six hundred days.
          Dorsetshire was indeed ordered to join the search for her in November 1941,
          but the ship that actually sank Atlantis on 22 November was the heavy cruiser
          Devonshire. Dorsetshire's own success came a week later against a different
          ship: Python, Atlantis's sister supply vessel, intercepted west of St Helena on
          1 December while fuelling U-68 and U-A. The Germans scuttled her, U-A fired
          five torpedoes at Dorsetshire and missed with all of them, and Dorsetshire did
          not pick up survivors because two U-boats were still in the area.
      src: [naval-history-dorsetshire, uboat-dorsetshire]

    - heading: 沉没：位置是被命令挪出来的
      text:
        zh: >-
          1942 年 3 月 27 日，本舰进科伦坡船坞开始改装。三月三十一日日军水面舰艇
          出现在印度洋，改装中断、出坞随东方舰队出海；四月二日随康沃尔号一起被派回
          锡兰继续改装；四月四日又因新的敌情报告被紧急召回。四月五日上午，
          它在返回舰队的途中被重巡利根号的侦察机发现，随后遭到五十三架
          九九式舰爆攻击。
          第一枚炸弹摧毁了前部右舷高炮组与 A 锅炉舱；接着命中后甲板、后烟囱基部，
          引爆高射弹药库并打哑两座 pom-pom。八分钟后舰尾先沉。
          两舰共一千五百四十六人，次日被救起一千一百二十二人，本舰单独阵亡二百三十四人。
          把它归因于「装甲太薄」只对了一半：真正的近因是它在错误的时间
          被反复命令往返，撞上了准备充分的攻击。
        en: >-
          On 27 March 1942 she entered dock at Colombo to begin a refit. Japanese
          surface forces appeared in the Indian Ocean on 31 March, the refit was
          suspended, and she sailed with the Eastern Fleet. On 2 April she was sent back
          to Ceylon with Cornwall to resume the refit, and on 4 April she was recalled
          again on a fresh report. On the morning of 5 April, on her way back to the
          fleet, she was sighted by a reconnaissance aircraft from the heavy cruiser
          Tone and attacked by 53 Val dive bombers. The first bomb destroyed the forward
          starboard high-angle group and A boiler room; further hits on the quarterdeck
          and at the base of the after funnel set off the high-angle magazine and put
          both pom-poms out of action. She sank stern first eight minutes later. Of
          1,546 men in the two ships, 1,122 were rescued the next day; Dorsetshire
          alone lost 234. Attributing this to thin armour is only half the answer: the
          proximate cause was being ordered back and forth at the wrong moment and
          meeting a well-prepared attack.
      src: [naval-history-dorsetshire, combinedfleet-cornwall-dorsetshire, uboat-dorsetshire]

history:
  - id: build
    title: { zh: 建造与战前, en: Building and the interwar years }
    range: { from: 1927, to: 1939 }
    events:
      - date: 1927-09-21
        text:
          zh: 在朴茨茅斯海军船厂开工。
          en: Laid down at Portsmouth Dockyard.
        src: [navypedia-norfolk]
      - date: 1929-01-29
        text:
          zh: 下水，掷瓶人为沙夫茨伯里伯爵夫人。
          en: Launched by the Countess of Shaftesbury.
        src: [navypedia-norfolk, naval-history-dorsetshire]
      - date: 1930-09-30
        text:
          zh: 完工服役，任第 2 巡洋舰中队旗舰。
          en: Completed and commissioned as flagship of the 2nd Cruiser Squadron.
        src: [navypedia-norfolk, uboat-dorsetshire]
      - date: 1931
        text:
          zh: >-
            因弗戈登兵变期间，部分舰员起初拒绝集合值勤，一个半小时后由军官恢复秩序。
          en: >-
            During the Invergordon Mutiny some of her men initially refused to assemble
            for duty; order was restored by her officers after an hour and a half.
        src: [naval-history-dorsetshire]
      - date: 1933
        text:
          zh: 调任非洲站总司令旗舰，至 1935 年。
          en: Flagship of the Commander-in-Chief, Africa, until 1935.
        src: [naval-history-dorsetshire]
      - date: 1935
        text:
          zh: 调中国站第 5 巡洋舰中队，至二战爆发。
          en: Joined the 5th Cruiser Squadron on the China Station until the war.
        src: [naval-history-dorsetshire]
      - date: 1937-02-01
        text:
          zh: 与航母竞技神号、重巡坎伯兰号一起参加检验新加坡防御的演习。
          en: >-
            With the carrier Hermes and the cruiser Cumberland, took part in an exercise
            testing the defence of Singapore.
        src: [naval-history-dorsetshire]

  - id: south
    title: { zh: 南大西洋与法国舰队, en: The South Atlantic and the French fleet }
    range: { from: 1939, to: 1940 }
    events:
      - date: 1939-09-02
        text:
          zh: 开战时在中国站，从上海出航黄海执行巡逻。
          en: On the China Station at the outbreak of war; sailed from Shanghai to patrol the Yellow Sea.
        src: [naval-history-dorsetshire, uboat-dorsetshire]
      - date: 1939-12-19
        text:
          zh: >-
            奉命赴蒙得维的亚外海参与围堵施佩伯爵号，但该舰已于 12 月 17 日自沉，
            本舰赶到时战斗已结束。
          en: >-
            Ordered to Montevideo to help contain Admiral Graf Spee, which had already
            been scuttled on 17 December before she arrived.
        src: [naval-history-dorsetshire]
      - date: 1940-02-13
        text:
          zh: >-
            在巴西弗里奥角外截住德国补给船 Wakama（3,771 GRT），德方自沉，救起 46 人。
            此次行动引发巴拿马政府就侵犯泛美安全区向英国抗议。
          en: >-
            Intercepted the German supply ship Wakama off Cape Frio; her crew scuttled
            her and 46 men were picked up. Panama protested officially at the violation
            of the Pan-American Security Zone.
        src: [uboat-dorsetshire, naval-history-dorsetshire]
      - date: 1940-06-25
        text:
          zh: >-
            黎塞留号从达喀尔出港驶向卡萨布兰卡，本舰奉命跟踪；06-26 弹射水上飞机搜索，
            当日午后追上并自舰尾方向跟踪，法舰随后被召回。
          en: >-
            Ordered to shadow Richelieu when she sailed from Dakar; catapulted her Walrus
            to search on 26 June, made contact that afternoon and shadowed from astern
            until the French ship was recalled.
        src: [uboat-dorsetshire, rohwer-1940-06]
      - date: 1940-07-03
        text:
          zh: >-
            与竞技神号、澳大利亚号、米尔福德号在达喀尔外海对法施压；被法国潜艇
            英雄号与光荣号攻击，以高速机动规避全部鱼雷。
          en: >-
            Off Dakar with Hermes, Australia and Milford applying pressure to the French;
            attacked by the submarines Le Héros and Le Glorieux and avoided all their
            torpedoes by high-speed manoeuvring.
        src: [naval-history-dorsetshire, rohwer-1940-07]
      - date: 1940-11-18
        text:
          zh: 炮击意属索马里兰的 Zante（Dante）港，发射约 200 发炮弹并向码头射鱼雷。
          en: >-
            Bombarded Zante (Dante) in Italian Somaliland, firing about 200 rounds and
            torpedoing the wharves.
        src: [naval-history-dorsetshire]

  - id: bismarck
    title: { zh: 最终战：最后雷击, en: The final action - the last torpedoes }
    range: { from: 1941-05, to: 1941-05 }
    events:
      - date: 1941-05-26
        text:
          zh: 奉命脱离 SL 74 船团参加追歼俾斯麦，当时在德舰以南约 360 海里。
          en: Detached from convoy SL 74 to join the hunt, then about 360 miles south of Bismarck.
        src: [naval-history-dorsetshire]
      - date: 1941-05-27
        text:
          zh: >-
            08:33 遇到哥萨克号，08:50 已能看到德舰炮口闪光（6 海里）；09:04 加入射击，
            全天发射 254 发八英寸弹。
          en: >-
            Met Cossack at 0833 and sighted the German gun flashes at six miles by 0850;
            opened fire at 0904 and fired 254 eight-inch rounds.
        src: [kbismarck-last-battle, naval-history-dorsetshire]
      - date: 1941-05-27
        text:
          zh: >-
            10:22 自 3,000 m 向右舷发射 2 枚鱼雷，均命中；10:36 转向后自 2,200 m
            向左舷再射 1 枚，命中。命中数 2 中或 3 中两说并列。
          en: >-
            Fired two torpedoes into the starboard side at 3,000 m, both hitting; then
            turned and fired one more into the port side at 2,200 m. Whether two or
            three hit is given differently by different sources.
        src: [kbismarck-last-battle, kbismarck-histoperi]
      - date: 1941-05-27
        text:
          zh: >-
            与毛利人号一起救援德方生还者，捞起 85–86 人；11:40 因疑似潜望镜中止救援，
            约 800 人仍在水中。
          en: >-
            With Maori, rescued German survivors, picking up 85-86 men; the rescue was
            abandoned at 1140 on a possible periscope sighting with about 800 men still
            in the water.
        src: [kbismarck-last-battle, hmshood-tovey-dispatch]

  - id: late
    title: { zh: 大西洋搜捕与东方舰队, en: The Atlantic hunt and the Eastern Fleet }
    range: { from: 1941-11, to: 1942-04 }
    events:
      - date: 1941-11-11
        text:
          zh: 奉命搜捕德国袭击舰 Atlantis 与其补给船 Python。
          en: Ordered to search for the raider Atlantis and her supply ship Python.
        src: [naval-history-dorsetshire]
      - date: 1941-12-01
        text:
          zh: >-
            在圣赫勒拿以西截住 Python（3,664 GRT），该船正为 U-68 与 U-A 补给；
            德方自沉，U-A 发射 5 枚鱼雷全部落空。击沉 Atlantis 的是德文郡号，
            不是本舰。
          en: >-
            Intercepted Python west of St Helena while she was fuelling U-68 and U-A;
            the Germans scuttled her and U-A's five torpedoes all missed. Atlantis
            itself had been sunk by Devonshire, not by this ship.
        src: [uboat-dorsetshire, naval-history-dorsetshire]
      - date: 1942-03-27
        text:
          zh: 进科伦坡船坞开始改装。
          en: Entered dock at Colombo to begin a refit.
        src: [naval-history-dorsetshire, combinedfleet-appendex-dorsetshire]
      - date: 1942-04-04
        text:
          zh: 改装中断后随东方舰队出海，又被紧急召回；位置由反复调令造成。
          en: >-
            Sailed with the Eastern Fleet after the refit was suspended, then was
            recalled again; her position was the product of repeated orders.
        src: [naval-history-dorsetshire]
      - date: 1942-04-05
        text:
          zh: >-
            在锡兰西南 01°54'N 77°45'E 被利根号侦察机发现，遭 53 架九九式舰爆攻击。
            命中 10 发 250–550 磅炸弹，高射弹药库爆炸，8 分钟后舰尾先沉。
          en: >-
            Sighted by a Tone reconnaissance aircraft at 01°54'N 77°45'E southwest of
            Ceylon and attacked by 53 Val dive bombers; ten 250-550 lb bombs hit, the
            high-angle magazine exploded and she sank stern first eight minutes later.
        src: [naval-history-dorsetshire, navypedia-norfolk, combinedfleet-cornwall-dorsetshire]
      - date: 1942-04-06
        text:
          zh: >-
            两舰生还者 1,122 人由巡洋舰企业号与驱逐舰帕拉丁号、黑豹号救起；
            本舰单独阵亡 234 人。
          en: >-
            1,122 survivors from both cruisers were rescued by the cruiser Enterprise and
            the destroyers Paladin and Panther; Dorsetshire alone lost 234 men.
        src: [naval-history-dorsetshire, uboat-dorsetshire]
