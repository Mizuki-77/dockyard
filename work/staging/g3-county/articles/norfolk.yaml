# ============================================================================
# 舰艇正文 —— 诺福克号
#
# 本舰正文的抓手是「一艘被改装了五次、最终活下来的船」。
# 项目里其他舰的正文多讲设计或某一场决战；这一艘最值得讲的是**时间与消耗**：
# 它是郡级唯一打满全程的那一艘，也是本级「防护薄、只能靠加装补课」的活标本。
#
# 与姊妹舰的分野在正文里明写：Dorsetshire 连 1944 年那轮改装都没等到。
# ============================================================================
ship: norfolk
updated: 2026-11-22

intro:
  lead:
    zh: >-
      诺福克号是郡级（Norfolk 子级）首舰，也是这一级唯一打满二战全程、活到战后的那艘。
      它 1941 年 5 月 23 日发出对俾斯麦的首次接触报告，5 月 27 日整夜绕到东北
      为战列舰做 flank marking，当天打出 527 发 8 英寸弹——同战四舰里最多的一艘巡洋舰。
      它经五轮改装、1944 年拆掉 X 炮塔，1950 年在纽波特拆解。
    en: >-
      Norfolk was the lead ship of the Norfolk sub-class and the only member of her
      class to serve right through the Second World War. She made the first sighting
      report on Bismarck on 23 May 1941 and spent the night of 26/27 May working round
      to the north-east to mark the flank for the battleships, firing 527
      eight-inch rounds that day - more than any other cruiser present. She was
      refitted five times, lost her X turret in 1944, and was broken up at Newport
      in 1950.

  paragraphs:
    - heading: 它是「条约巡洋舰」这个思路的产物
      text:
        zh: >-
          1922 年华盛顿条约给重巡定下两个上限：标准排水量一万吨、主炮不超过八英寸。
          英国要的是一艘能守帝国贸易航线的远洋巡洋舰，需要航程、航速和独立战斗力，
          于是拿出了长舰体加四座双联炮塔这个组合——美国用三联装缩短舰体省下装甲重量，
          英国反过来做：留着长舰体保航速与航程，装甲几乎全部放弃。
          直接后果就是本级只有弹药库有一个装甲盒，舷侧只有二十五毫米的防破片板。
          诺福克号的一生，基本上就是这套账本的支出与补救记录。
        en: >-
          The Washington Treaty of 1922 set two limits for heavy cruisers: 10,000 tons
          standard displacement and eight-inch guns. Britain wanted an ocean-going
          cruiser able to police imperial trade routes - range, speed and independent
          fighting power - and produced a combination of a long hull and four twin
          turrets. The United States shortened the hull with triple turrets to buy
          armour weight; Britain did the opposite, keeping the long hull for speed and
          range and giving up almost all armour. The consequence was a class with an
          armoured box around the magazines and nothing but 25 mm splinter plating on
          the sides. Norfolk's career is essentially the ledger of that trade-off and
          of the attempts to make it good.
      src: [navypedia-norfolk, combinedfleet-cornwall-dorsetshire, navweaps-8in-50-mk8]

    - heading: 丹麦海峡：它先看见了俾斯麦，也被俾斯麦打过
      text:
        zh: >-
          1941 年 5 月 19 日诺福克号接替萨福克号进入丹麦海峡巡逻，5 月 23 日两舰
          联合巡逻时由本舰发出对俾斯麦的首次接触报告，随即遭到俾斯麦五次主炮齐射，
          未命中，本舰借风雪脱离。此后两天它和萨福克号一起用雷达跟踪德舰，
          为本土舰队提供引导。
        en: >-
          On 19 May 1941 Norfolk relieved Suffolk on the Denmark Strait patrol. On
          23 May, while the two cruisers worked together, it was Norfolk that made the
          first sighting report on Bismarck, and she immediately came under five main
          battery salvoes. None hit, and she escaped into the snow. For the next two
          days she and Suffolk shadowed the German ships by radar and fed the Home
          Fleet the information it needed.
      src: [naval-history-norfolk, admiralty-bismarck-interrogation, hmshood-tovey-dispatch]

    - heading: 丢失接触，问题出在天线不会转
      text:
        zh: >-
          5 月 25 日凌晨俾斯麦号向右转向脱离，英方发现得太晚。技术原因值得单独写一句：
          诺福克号当时装的 286M 型雷达天线是固定的，不能旋转，只能覆盖一个扇面。
          英舰为防潜艇开始之字形航行之后，本舰只能在之字形的第一段上保持跟踪。
          德舰转向的那一刻，它恰好不在能看见的位置上。
        en: >-
          Bismarck turned away to starboard early on 25 May and the British detected it
          too late. The technical reason deserves a sentence of its own: Norfolk's
          Type 286M set had a fixed aerial that could not rotate and covered only one
          arc. Once the British ships began zig-zagging against U-boats, she could hold
          the German ship only on the first leg of each zig-zag. At the moment Bismarck
          turned, Norfolk was not looking at her.
      src: [naval-history-norfolk]

    - heading: 最终战：527 发，以及一门只打了 8 发的炮
      text:
        zh: >-
          5 月 27 日拂晓，诺福克号整夜已经绕到东北方向，为战列舰做 flank marking。
          08:20 它与战列线建立目视联系，08:54 加入射击，全天发射 527 发 8 英寸弹，
          是同战四舰里巡洋舰发射最多的一艘。同一天它还至少两次发射鱼雷，均未命中。
          这份记录里有一个不显眼但很真实的细节：X 炮塔的右炮全天只打了 8 发，
          而 B 炮塔的右炮打了 103 发。来源给的原因是药包被推了两次，
          但原话带着「可能」，所以这里也只记到「可能」。
        en: >-
          By dawn on 27 May Norfolk had worked round to the north-east during the night
          to mark the flank for the battleships. She established visual contact with the
          line at 0820, opened fire at 0854 and fired 527 eight-inch rounds that day -
          more than any other cruiser engaged. She also fired torpedoes at least twice,
          all of which missed. One unglamorous but very real detail survives in the
          record: the right gun of X turret fired only eight rounds all day, against
          103 from the right gun of B turret. The source attributes this to double
          ramming of the cordite charges, but says "probably", so it stays at
          "probably" here.
      src: [navweaps-8in-50-mk8, kbismarck-last-battle, hmshood-tovey-dispatch]

    - heading: 五轮改装：本级防护薄的账单，最后是拿主炮去付的
      text:
        zh: >-
          诺福克号在战争期间经过五轮改装与修理。每一轮的主题都一样：加雷达、加近程高炮。
          1944 年那一轮最彻底，也最能说明这一级的设计困局——它拆掉了 X 炮塔、
          拆掉了弹射器与水上飞机，换来六座四联 2-pdr 与十一座双联 20 mm，
          再加一整套新雷达。主炮从八门降到六门，标准排水量却涨了将近一千吨。
          最有讽刺意味的是：八英寸炮塔从设计起就有七十度仰角，本来是想让重巡能打飞机，
          但这个设想一直缺火控支撑，要到 1944 年装上 283 型雷达和专用弹幕指挥仪，
          才第一次真正实现。
        en: >-
          Norfolk went through five refits and repairs during the war, each with the
          same theme: more radar, more close-range anti-aircraft guns. The 1944 refit
          was the most thorough and the clearest statement of the class's design trap.
          She lost X turret, the catapult and the floatplane, and received six
          quadruple 2-pounder mounts, eleven twin 20 mm mounts and a complete new radar
          suite. Her main battery fell from eight guns to six while her standard
          displacement rose by nearly a thousand tons. Most ironically, the eight-inch
          turrets had been given 70 degrees of elevation from the start so that a heavy
          cruiser could engage aircraft; that idea never had the fire control to support
          it, and only became real in 1944 with Type 283 radar and a dedicated barrage
          director.
      src: [navypedia-norfolk, naval-history-norfolk]

    - heading: 与姊妹舰的分野：不是谁更强，是谁活得更久
      text:
        zh: >-
          多塞特郡号与诺福克号同级同型，同在 1941 年 5 月 27 日合击俾斯麦，
          但 1942 年 4 月 5 日在印度洋被日本舰载俯冲轰炸机击沉。这意味着两件事：
          一是本级的「拆 X 炮塔」改装只发生在诺福克号身上，不能当成全级通例；
          二是那一仗暴露的正是本级防护的短板——水平装甲只覆盖弹药库、机舱与舵机，
          二百五十公斤炸弹落在没有装甲的后甲板和烟囱基部，八分钟就沉了。
          诺福克号活得久，不是因为它更结实，是因为它没遇上那种攻击。
        en: >-
          Dorsetshire was of the same class and was in action alongside Norfolk on
          27 May 1941, but was sunk by Japanese dive bombers in the Indian Ocean on
          5 April 1942. Two consequences follow. First, the removal of X turret
          happened only to Norfolk and is not a class-wide fact. Second, that action
          exposed exactly the class's weak point: horizontal armour covered only the
          magazines, machinery and steering gear, and 250 kg bombs landing on the
          unarmoured quarterdeck and funnel base sank her in eight minutes. Norfolk
          lived longer not because she was tougher, but because she never met that kind
          of attack.
      src: [naval-history-dorsetshire, combinedfleet-cornwall-dorsetshire, navypedia-norfolk]

history:
  - id: build
    title: { zh: 建造与战前, en: Building and the interwar years }
    range: { from: 1927, to: 1939 }
    events:
      - date: 1927-07-08
        text:
          zh: 在 Fairfield（Govan, Glasgow）开工，船台号 628。
          en: Laid down at Fairfield, Govan, Glasgow, yard number 628.
        src: [navypedia-norfolk]
      - date: 1928-12-12
        text:
          zh: 下水。
          en: Launched.
        src: [navypedia-norfolk, naval-history-norfolk]
      - date: 1930-04-30
        text:
          zh: >-
            完工服役。naval-history 记完工日为 1930-05-01，与 navypedia 差一天，
            两说并列。
          en: >-
            Completed and commissioned. Naval-History gives the completion date as
            1 May 1930, one day later than navypedia.
        src: [navypedia-norfolk, naval-history-norfolk]
      - date: 1931-07
        text:
          zh: 与德文郡号成为首批访问德国基尔港的英国军舰。
          en: With Devonshire, among the first British warships to visit Kiel.
        src: [naval-history-norfolk]
      - date: 1931-09
        text:
          zh: 舰员卷入因弗戈登兵变。
          en: Her crew was caught up in the Invergordon Mutiny.
        src: [naval-history-norfolk]
      - date: 1935
        text:
          zh: 调东印度站，至 1939 年返英大改装。
          en: Transferred to the East Indies Station until returning home for refit in 1939.
        src: [naval-history-norfolk]

  - id: north
    title: { zh: 开战与北方水域, en: The war opens in northern waters }
    range: { from: 1939, to: 1940 }
    events:
      - date: 1939-09-06
        text:
          zh: 改装完成，编入本土舰队第 8 巡洋舰中队。
          en: Completed her refit and joined the 8th Cruiser Squadron, Home Fleet.
        src: [naval-history-norfolk]
      - date: 1939-11-27
        text:
          zh: >-
            在奥克尼外被 U-47 攻击，鱼雷在舰尾后方爆炸，未受损。德方宣传称击沉该舰，
            不实。
          en: >-
            Attacked by U-47 off the Orkneys; the torpedoes exploded astern and she was
            undamaged. German propaganda claimed the cruiser sunk.
        src: [naval-history-norfolk]
      - date: 1940-03-16
        text:
          zh: >-
            斯卡帕湾空袭中被一枚 250 kg 炸弹（Ju 88）命中后甲板 Y 炮塔附近，
            穿透三层甲板，X 与 Y 弹药库进水，修理约三个月。命中舷别两源不一致。
            伤亡数字只见于百科来源，此处不引。
          en: >-
            Hit at Scapa Flow by a 250 kg bomb from a Ju 88 near Y turret; it passed
            through three decks and flooded the X and Y magazines, with about three
            months of repairs. The side hit is given differently by different sources,
            and no casualty figure is cited here because it appears only in encyclopedic
            sources.
        src: [naval-history-norfolk]
      - date: 1940-06-24
        text:
          zh: 修理完成归队第 1 巡洋舰中队。
          en: Rejoined the 1st Cruiser Squadron on completion of repairs.
        src: [naval-history-norfolk]
      - date: 1940-10
        text:
          zh: 在泰恩河船厂装上第一部雷达（286M 型，固定天线）。
          en: Fitted with her first radar at a Tyne yard - Type 286M with a fixed aerial.
        src: [naval-history-norfolk]

  - id: bismarck
    title: { zh: 丹麦海峡与最终战, en: Denmark Strait and the final action }
    range: { from: 1941-05, to: 1941-05 }
    events:
      - date: 1941-05-19
        text:
          zh: 接替萨福克号执行丹麦海峡巡逻。
          en: Relieved Suffolk on the Denmark Strait patrol.
        src: [naval-history-norfolk]
      - date: 1941-05-23
        text:
          zh: >-
            与萨福克号联合巡逻时发出对俾斯麦的首次接触报告，随即遭俾斯麦五次主炮齐射，
            未命中。
          en: >-
            Made the first sighting report on Bismarck while on joint patrol with
            Suffolk, and came under five main battery salvoes without being hit.
        src: [naval-history-norfolk, admiralty-bismarck-interrogation]
      - date: 1941-05-25
        text:
          zh: >-
            凌晨俾斯麦号向右转向脱离。本舰的固定天线雷达只能在之字形第一段保持跟踪，
            德舰转向时本舰不在能看见的位置上。
          en: >-
            Bismarck turned away to starboard in the early hours. With a fixed-aerial
            radar Norfolk could hold her only on the first leg of each zig-zag, and was
            not looking at the moment of the turn.
        src: [naval-history-norfolk]
      - date: 1941-05-27
        text:
          zh: >-
            整夜绕至东北为战列舰做 flank marking，08:20 与战列线建立目视联系，
            08:54 加入射击，全天发射 527 发 8 英寸弹，至少两次发射鱼雷（均未命中）。
          en: >-
            Worked round to the north-east overnight to mark the flank, established
            visual contact with the line at 0820, opened fire at 0854 and fired 527
            eight-inch rounds, with at least two torpedo firings, all misses.
        src: [navweaps-8in-50-mk8, kbismarck-last-battle, hmshood-tovey-dispatch]

  - id: arctic
    title: { zh: 北极护航与北角海战, en: Arctic convoys and North Cape }
    range: { from: 1941, to: 1943 }
    events:
      - date: 1941-07
        text:
          zh: >-
            在南希尔兹改装，装 273 / 281 / 284 / 285 四型雷达，拆 12.7 mm 机枪与
            UP 火箭，换装 6 门 20 mm。
          en: >-
            Refitted at South Shields with Types 273, 281, 284 and 285, the 0.5-inch
            machine guns and UP rockets removed and six 20 mm added.
        src: [navypedia-norfolk, naval-history-norfolk]
      - date: 1941-10-18
        text:
          zh: 与驱逐舰 Icarus、Eclipse 等一起为 PQ 2 船团护航至阿尔汉格尔斯克。
          en: Escorted convoy PQ 2 to Archangel with the destroyers Icarus and Eclipse.
        src: [naval-history-norfolk]
      - date: 1942-07-01
        text:
          zh: >-
            为 PQ 17 船团提供近距掩护，7 月 4 日船团奉命解散。三十五艘船中损失二十三艘。
          en: >-
            Provided close cover for PQ 17 until the convoy was ordered to scatter on
            4 July; twenty-three of thirty-five ships were lost.
        src: [naval-history-norfolk]
      - date: 1943-12-26
        text:
          zh: >-
            北角海战：09:30 起对沙恩霍斯特号开火，6 次齐射命中 2 发，打掉德舰后部雷达。
            随后本舰被命中 2 发 283 mm 弹，X 炮塔失效。阵亡人数两说（7 人与 6 人），
            并列记录。
          en: >-
            Battle of North Cape: opened fire on Scharnhorst at 0930, fired six salvoes
            for two hits and disabled her after radar. Norfolk was then hit twice by
            283 mm shells and X turret was put out of action. The death toll is given as
            seven by one source and six by another; both are recorded.
        src: [navypedia-norfolk, naval-history-norfolk]

  - id: late
    title: { zh: 大改装、挪威与战后, en: The 1944 refit, Norway and after the war }
    range: { from: 1944, to: 1950 }
    events:
      - date: 1944-02
        text:
          zh: >-
            进泰恩河船厂大改装：拆 X 炮塔、弹射器与水上飞机，加 6 座四联 2-pdr、
            11 座双联 20 mm 与一整套新雷达。标准排水量升至 10,900 t。
          en: >-
            Major refit in a Tyne yard: X turret, catapult and floatplane removed; six
            quadruple 2-pounders, eleven twin 20 mm and a new radar suite added.
            Standard displacement rose to 10,900 tons.
        src: [navypedia-norfolk, naval-history-norfolk]
      - date: 1945-01-11
        text:
          zh: 参加 SPELLBINDER 行动，在挪威沿岸击沉德方两艘船与一艘护航舰。
          en: >-
            Took part in Operation Spellbinder, sinking two German ships and an escort
            off the Norwegian coast.
        src: [naval-history-norfolk]
      - date: 1945-06-05
        text:
          zh: 载挪威国王哈康七世返回奥斯陆。
          en: Carried King Haakon VII of Norway back to Oslo.
        src: [naval-history-norfolk]
      - date: 1949-05-03
        text:
          zh: 从东印度群岛返抵德文波特，退入预备役，封存于法尔茅斯。
          en: >-
            Returned from the East Indies to Devonport, paid off into reserve and laid
            up at Falmouth.
        src: [naval-history-norfolk]
      - date: 1950-02-19
        text:
          zh: 1950-01-03 售予 BISCO；2 月 19 日拖抵纽波特（Cashmore）拆解。
          en: >-
            Sold to BISCO on 3 January 1950; arrived under tow at Cashmore, Newport, on
            19 February for breaking up.
        src: [naval-history-norfolk, navypedia-norfolk]
