    note: >
      **属归纳判定，不是来源原话。** 本级防护不是 all-or-nothing：
      只有弹药库/弹药提升井有「装甲盒」（侧 102 mm、顶 76 mm），
      机舱只有 25 mm 舱壁 + 32 mm 甲板，舵机 38 mm，
      其余全舰靠 25 mm 防破片板。combinedfleet 专题文原话：
      「horizontal armour, some of it rather thin, was provided only over the
      magazines and shell rooms (from 1 to 3 inches), the machinery spaces
      (1⅜ inches), and the steering gear (1½ inches)」。
      「要害局部加厚 + 全舰薄板」的叠加式防护归入 incremental。

