  # ============================================================ 武备概览
  - field: armament.mount.summary
    value: >-
      8 × 8 in/50 BL Mk VIII（4 座双联 Mk II 炮塔，前二后二背负式；A/B/X/Y 各 1 座，共 8 门）
      + 4 × 4 in/45 QF Mk V（4 座单装；1937 年改装为 8 门双联 Mk XVI）
      + 4 × 2-pdr 40 mm（单装；1937 年改装为 16 门八联装）
      + 2 × 四联 21 in 鱼雷发射管（8 管）
    src: [navypedia-norfolk, navweaps-8in-50-mk8, navweaps-4in-45-mk16]
    valid: { from: 1930-04-30, to: 1942-04-05 }
    confidence: A
    note: >
      建成时配置（navypedia 原文「4 x 2 - 203/50 BL Mk VIII, 4 x 1 - 102/45 QF Mk V,
      4 x 1 - 47/40 Hotchkiss Mk I, 4 x 1 - 40/39 2pdr QF Mk II, 2 x 4 - 533 TT」）。
      本条**省略了 4 门 47 mm 礼炮**（Hotchkiss Mk I），因为 navypedia 自己在
      1939 年改装项里把它们拆了，写进概览会与后续切片打架 —— 逐舰增减见各舰切片。

      三个必须说清的形制后果：

      一、主炮塔为 Mk II，比前两个子级的 Mk I 简化了装填但**更重**
      （Mk II 建成时 220.3 吨 / 224 t，Mk I 205 吨 / 208 t，navweaps 原值
      220.3 tons / 205 tons 为英吨），为守条约吨位只能在别处继续抠重量。

      二、副炮单装 4 in Mk V 只有 4 门，且位置被挪到前部以免挡住弹射器 ——
      这是与 London 子级的差别之一。

      三、鱼雷管是四联装两座（8 管），不是双联。navypedia 的「2 x 4」是
      「两座四联」，不是「两管」。

