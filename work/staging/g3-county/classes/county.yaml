# ============================================================================
# 舰级：County class（郡级重巡洋舰）—— 本文件只建 Norfolk 子级
# ----------------------------------------------------------------------------
# 【重要：County 级有三个子级，本站只建 county 一个 class 文件】
#   Kent   —— Suffolk / Cornwall / Cumberland / Kent / Berwick（+ RAN Australia / Canberra）
#   London —— London / Devonshire / Sussex / Shropshire
#   Norfolk —— **Norfolk / Dorsetshire**（13 艘里的最后两艘，1926–27 年计划）
# 本文件写的是 Norfolk 子级两名成员共有的设计值；Kent / London 两个子级不入库。
# 判据见 SCHEMA §5：换一艘同级舰就变的值写 data/ships/<id>.yaml
# （两舰的雷达配置、防空炮数、实测排水量因此都在单舰文件里，不在这里）。
#
# 【这一级为什么长成这样 —— 本级的定义性特征】
# 华盛顿条约（1922）把重巡卡在 10,000 t 标准排水量与 8 英寸主炮。
# 英国要的是能守殖民地贸易航线的远洋巡洋舰 —— 要航程、要航速、要独立战斗力，
# 于是只能拿出**长舰体 + 4 座双联**这一组合（美国用三联装缩短舰体换装甲，
# 英国反过来：留长舰体保航速与航程，装甲几乎全放弃）。
# 直接后果就是本级只有「弹药库装甲盒 + 25 mm 防破片板」，舷侧没有主装甲带。
# 1942-04-05 Dorsetshire 被 250 kg 炸弹在 8 分钟内击沉，就是这套防护的账单。
#
# 【哪些数据没查到 —— 必须如实留着】
#   装甲总重（Norfolk 无值）、装甲占比、重量分配表、型深、方形系数、水线面积、
#   干舷、蒸汽温度、发电机台数/功率、螺旋桨直径、舵面积、舱段划分、造价、
#   水下防护纵深（本级无防雷突出部，且没有任何纵深数值）。
#   本级与 Nelson 级同样是「装甲总重缺失」的老问题，不要用别级的值填充。
# ============================================================================

id: county
name:
  zh: 郡级重巡洋舰（Norfolk 子级）
  en: County-class heavy cruiser (Norfolk sub-class)
class_of: [norfolk, dorsetshire]

open_ended_note: |
  本文件绝大多数 fact 的 valid.to 都留空，这是结构性的，不是漏填：
  舰级设计参数的生效期从设计定案/服役起，到该级最后一艘损失或拆解为止，
  期间不因改装而改变；实际战备状态随时间的变化写在 data/ships/<id>.yaml 的
  状态切片里，由单舰 fact 覆盖。因此这里的 open 时间窗表示「无已知终止事件」。

facts:
