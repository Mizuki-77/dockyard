# ============================================================================
# 单舰：HMS Norfolk（诺福克号重巡洋舰，舷号 78）
# ----------------------------------------------------------------------------
# 只写本舰与郡级（Norfolk 子级）不同的值与本舰特有的事实。
# 解析顺序（docs/00-framework.md §3.6）：单舰 fact -> 舰级 fact -> 未记载。
#
# 【本舰与姊妹舰 Dorsetshire 的分野 —— 这份文件最该说清的事】
#   两舰同级同型，但一生走了完全相反的两条路：
#     Norfolk  —— 打满全场六年，五轮改装，1950 年拆解；
#     Dorsetshire —— 1942-04-05 被日本舰爆击沉，连 1944 年那轮大改装都没等到。
#   所以「哪一艘最终装了什么」这件事不能互相顶替：
#   Norfolk 1944 年拆掉 X 炮塔时 Dorsetshire 已经沉了两年多。
#
# 【最有据的一块：1941-05-27 最终战的射击数据】
#   527 发 8 英寸弹这个数字有两个独立来源：
#   ① navweaps 引本舰舰长 A.J.L. Phillips 的战报评语（一手口径转述）；
#   ② kbismarck 全战弹药统计表。
#   两条独立且吻合，故 confidence 给 A。
#   但**X 炮塔右炮只打了 8 发**这件事只有 navweaps 一处，
#   且它给的原因带 probably，照原样保留，不写成定论。
# ============================================================================

id: norfolk
name:
  zh: 诺福克号
  en: HMS Norfolk
class: county

open_ended_note: >
  Norfolk 子级首舰（舷号 78，1948 年改 C78）。一生打满二战全程：
  丹麦海峡与最终战（1941）、北极护航（1941–43）、北角海战（1943）、
  挪威沿岸作战（1945）。经五轮改装，1944 年拆 X 炮塔。
  1950-01-03 售予 BISCO，1950-02-19 抵 Newport 拆解。

