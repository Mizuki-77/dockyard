  # ============================================================ 1941-05-27 最终战
  # 以下事实全部锚定在这一天，valid 窗口故意写死成单日，
  # 避免与其它时段的武备/战绩混淆。
  - field: armament.mount.summary
    value: >-
      1941-05-27 最终战：08:54 加入射击，全天发射 8 英寸弹 527 发；
      至少两次发射鱼雷（合计 4 枚以上，均未命中）。
    src: [navweaps-8in-50-mk8, kbismarck-last-battle, hmshood-tovey-dispatch]
    valid: { from: 1941-05-27, to: 1941-05-27 }
    confidence: A
    note: >
      **527 发这个数有两个独立来源且吻合，故 A。**
      ① navweaps 引本舰舰长 Phillips 战报：「HMS Norfolk in about 90 minutes
      fired 527 rounds with minor problems」；
      ② kbismarck 全战统计表：「527 of 20.3 cm from Norfolk」。
      对照：同战 Rodney 380 发 16 英寸、KGV 339 发 14 英寸、
      Dorsetshire 254 发 20.3 cm。四舰合计 2,876 发。

      加入时间与角色：Tovey 战报记 0735 时本舰「shadowing from the north-westward,
      prepared to carry out flank marking for the battleships」，
      0820 与战列线建立目视联系，0948「stopped flank marking and had joined in the action」。
      **注意时间口径不一致**：navweaps／英文维基记 0854 加入，
      Tovey 战报记 0948 才停止 flank marking 转入射击 —— 两者说的不是同一个事件
      （前者是第一轮开火，后者是角色转换），不要合并成一个时间点。

      鱼雷：两次记录口径不同，并列不裁。
      navweaps／英文维基：09:10 自 16,000 码（约 15,000 m）发射 4 枚，全部落空；
      kbismarck：1000 之后自约 3,600 m 发射 4 枚，可能 1 发命中右舷（无确证）。

  - field: armament.gun_failures
    value: >-
      X 炮塔右炮全天只发射 8 发（同期 B 炮塔右炮发射 103 发），
      原因可能是药包双次推弹（double ramming of the cordite charges）。
    src: [navweaps-8in-50-mk8]
    valid: { from: 1941-05-27, to: 1941-05-27 }
    confidence: B
    note: >
      **原话照译，不做定论。** navweaps 原文：
