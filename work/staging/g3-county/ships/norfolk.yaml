      (compared to 103 rounds from the right gun in "B" turret),
      probably because of double ramming of the cordite charges」。
      「probably」是来源自己留的余地，故本条 confidence 降 B。
      出处是 navweaps 转述本舰舰长战报，不是战报原件（未取得）。

  # ============================================================ 1943-12-26 北角海战
  - field: service.casualties
    value: 7
    unit: persons
    src: [naval-history-norfolk]
    valid: { from: 1943-12-26, to: 1943-12-26 }
    confidence: B
    note: >
      **两说并列，不裁决；fact 取有 tier D 支撑的那个数。**
      naval-history 原文：「Twice hit by enemy fire which damaged X turret and
      radar equipment. Seven of ships company were killed and five wounded.」
      英文维基 Norfolk 条目记「killed six men」。差 1 人，
      可能是「当场阵亡」与「含伤重不治」的口径差，但两源均未说明，故不合并。
      取 7 的理由只有一条：7 有 tier D 来源，6 只出现在 tier E
      （按红线 §2.1，tier E 不能当 fact 来源）。

      命中细节（两源一致的部分）：第一发使 X 炮塔失效；
      第二发在舯部主甲板下方爆炸。本舰亦以 6 次齐射命中 Scharnhorst 两发，
      打掉了德舰的后部雷达。

  - field: armament.gun_failures
    value: >-
      1943-12-26 北角海战：X 炮塔被 Scharnhorst 的 283 mm 弹命中失效，
      随后送修并于 1944 年 8 月装回；全舰其它修理直到 11 月才完工。
    src: [navweaps-8in-50-mk8]
    valid: { from: 1943-12-26, to: 1944-11-30 }
    confidence: A
    note: >
      navweaps 原文：「"X" turret on HMS Norfolk was also removed for repairs
      after being badly damaged in her fight with Scharnhorst in December 1943.
      It was reinstalled in August 1944, although her other repairs took until
      November to complete」。
      **这条与「1944 年 11 月改装时拆除 X 炮塔」不是同一件事**，
      时间上前后相接、很容易混：先拆去修（1944-08 装回），
      再在大改装中连炮塔带弹射器一起永久拆除。两件事都记，不许合并。

