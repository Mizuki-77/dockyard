# ============================================================================
# 武器正文 —— 8"/50 (20.3 cm) Mark VIII
#
# 这一型是华盛顿条约吨位限制之下，英国重巡的标准主炮。
# 主线：口径与吨位都被条约锁死，于是「高射角」被当成了条约舰的补偿手段 ——
# 而炮座的回转/俯仰机构做不到，这个补偿从未兑现。
# 另一条必须写清的事：装它的四型炮座（Mk I / I* / II / II*）不是一回事，
# 诺福克号属 Mark II，而「8 英寸炮不可靠」的印象主要来自早期的 Mark I。
# ============================================================================
weapon: 8in-50-mk8
updated: 2026-11-22

intro:
  lead:
    zh: >-
      8"/50 (20.3 cm) Mark VIII 是英国 1920 年代条约型重巡的主炮，
      装在肯特、伦敦、诺福克与约克四级巡洋舰上。
      华盛顿条约把非主力舰的火炮口径上限定在 8 英寸，
      于是这型炮成了英国重巡火力的天花板 —— 也成了皇家海军
      「重巡口径不能再大」这条线的物证。
    en: >-
      The 8"/50 (20.3 cm) Mark VIII was the main battery of Britain's 1920s
      treaty cruisers, arming the Kent, London, Norfolk and York classes. The
      Washington Treaty capped the gun calibre of non-capital ships at 8 inches,
      so this weapon became the ceiling of British heavy-cruiser firepower - and
      the physical evidence for the Royal Navy's line that a heavy cruiser could
      not be more heavily armed.

  paragraphs:
    - heading: 条约锁死口径，也锁死了它的上限
      text:
        zh: >-
          华盛顿条约第十二条原文写着：任何缔约国此后开工的非主力舰，
          「不得装载口径超过 8 英寸（203 毫米）的火炮」。
          第十一条同时把非主力舰的排水量上限定在 10,000 吨（10,160 公吨）。
          两条合起来，就是英国重巡的全部设计空间：一万吨、8 英寸。
          炮本身 1923 年完成设计、1927 年服役，正是这两条生效之后。
        en: >-
          Article XII of the Washington Treaty states that no warship of any
          contracting power thereafter laid down, other than a capital ship,
          "shall carry a gun with a calibre in excess of 8 inches (203
          millimetres)". Article XI capped non-capital displacement at 10,000
          tons (10,160 metric tons). Together the two articles defined the whole
          design space of a British heavy cruiser: ten thousand tons, eight
          inches. The gun itself was designed in 1923 and entered service in
          1927, with both articles already in force.
      src: [washington-treaty-1922, navweaps-8in-50-mk8]

    - heading: 高射角是条约舰的补偿，但它从未兑现
      text:
        zh: >-
          navweaps 对这一点的因果写得直接：这批炮座被赋予很高的最大仰角，
          目的是让它们具备防空能力。但俯仰与回转换算机构效率低下，
          两者的速度都太慢，这些炮座在这个角色上毫无用处。
          换句话说，「高射角」是吨位受限的重巡在纸面上给自己找的补偿，
          而机构做不到，补偿就没有发生。
        en: >-
          NavWeaps draws the causal line plainly: the mountings for these weapons
          were given a high maximum elevation in order to provide an
          anti-aircraft capability, but the training and elevation gear was
          inefficient and both rates were too slow for the mountings to be useful
          in that role. The high elevation was, in effect, a paper compensation
          for a tonnage-limited cruiser - and because the machinery could not
          deliver it, the compensation never happened.
      src: [navweaps-8in-50-mk8]

    - heading: 四种炮座不是一回事，可靠性的名声要分开算
      text:
        zh: >-
          装这型炮的炮座有四型：肯特级与澳大利亚级用 Mark I，伦敦级用 Mark I*，
          诺福克级与约克级用 Mark II，埃克塞特号用 Mark II*。
          早期 Mark I 与 Mark I* 结构复杂，这些问题困扰了多年，
          1927 与 1928 年在这批舰入役前被集中处理过。
          而较晚的 Mark II 要可靠得多：约克号 1930 年 2 月的首次射击试验
          只用了四小时就顺利完成；1941 年 5 月对俾斯麦的战斗里，
          诺福克号约 90 分钟打出 527 发，只有小问题。
          舰长 A.J.L. Phillips 的报告原话是：
          「就 8 英寸 Mark II 炮座而言，最终状态与输出百分比被认为非常令人满意。」
        en: >-
          Four mounting marks carried this gun: Mark I in the Kent and Australia
          classes, Mark I* in the London class, Mark II in the Norfolk and York
          classes, and Mark II* in Exeter. The complex nature of the early Mark I
          and Mark I* gave trouble for a number of years, and considerable
          attention was paid to those faults in 1927 and 1928 before the ships
          were accepted into service. The later Mark II was much more reliable:
          the first gun trials for York in February 1930 took only four hours to
          complete, and in the action against Bismarck in May 1941 Norfolk fired
          527 rounds in about 90 minutes with minor problems. Her commander,
          Capt. A.J.L. Phillips, reported: "For 8in Mark II mountings, the final
          state of affairs and the percentage output are considered most
          satisfactory."
      src: [navweaps-8in-50-mk8]

    - heading: 那 527 发里有 95 发没打出去
      text:
        zh: >-
          同一个段落里还有一个必须写下的细节：诺福克号「X」炮塔的右炮
          只打出 8 发，而「B」炮塔的右炮打出 103 发。
          navweaps 给出的原因是发射药包被重复推弹（double ramming），
          原文用的是「probably」。这 95 发的差额不是战绩，是故障 ——
          「527 发、只有小问题」这句评语，与隔壁炮塔几乎没开火这件事是同时成立的。
        en: >-
          The same passage records a detail that has to be written down: the right
          gun in Norfolk's "X" turret fired only eight rounds, against 103 from
          the right gun in "B" turret. NavWeaps attributes this to double ramming
          of the cordite charges, and uses the word "probably". Those ninety-five
          rounds are not a score, they are a failure - and the verdict "527
          rounds with minor problems" holds at the same time as a neighbouring
          turret barely firing at all.
      src: [navweaps-8in-50-mk8]

    - heading: 1929 年德文郡号的那次爆炸
      text:
        zh: >-
          1929 年 7 月 26 日，德文郡号「X」炮塔左炮发生迟发火。
          一名舰员不知情，过早打开了炮闩，涌入的空气引燃了药包，
          一发炮弹与若干药包被点燃，掀掉炮塔顶盖，1 名军官与 17 名舰员死亡。
          调查认定该炮的闭锁（salvo latch）装错了，使得炮未击发也能开闩。
          炮座的防火设计挡住了火焰，没让它窜进弹药库 ——
          这一条是这型炮座设计上真正救了船的地方。烧毁的炮塔被拆走换上一座备用的，
          德文郡号 1930 年 1 月前重新服役。
        en: >-
          On 26 July 1929 the left gun in Devonshire's "X" turret misfired. A
          crewman, unaware, opened the breech too soon and the inrush of oxygen
          set off the charges; one shell and a number of cordite bags ignited,
          blowing off the turret roof and killing one officer and seventeen
          crewmen. The investigation found the interlock (salvo latch) for that
          gun had been incorrectly assembled, allowing the breech to be opened
          even though the gun had not fired. The mounting's flash protection
          prevented the explosion from reaching the magazine - this is where the
          design did save the ship. The burned-out turret was replaced with a
          spare and Devonshire was back in commission by January 1930.
      src: [navweaps-8in-50-mk8]

    - heading: 炮座超重，是条约舰必须付的账
      text:
        zh: >-
          这型炮座的预估重量与实际重量差得很远：Mark I 预估 155 吨、
          完工时 205 吨；Mark II 预估 168.8 吨、完工时 220.3 吨。
          navweaps 把这件事的性质写明了：这些是受条约限制的军舰，
          主炮这样的超重必须从别处扣回来，比如减少船体构件。
          原本希望 Mark II 能比 Mark I 轻得多，结果正好相反。
          埃克塞特号用的 Mark II* 是减重版，代价是把最大仰角从 +70 度降到 +50 度。
        en: >-
          The estimated and actual weights of these mountings differ widely:
          Mark I was estimated at 155 tons and weighed 205 tons as completed;
          Mark II was estimated at 168.8 tons and weighed 220.3 tons. NavWeaps is
          explicit about what that meant: these were Treaty-limited warships, so
          such overruns on the main armament had to be compensated for by taking
          weight out of other areas, such as reducing the number of hull
          scantlings. It had been hoped the Mark II would be much lighter than the
          Mark I, and the reverse turned out to be the case. The Mark II* used in
          Exeter was the weight-saving version, paid for by cutting maximum
          elevation from +70 to +50 degrees.
      src: [navweaps-8in-50-mk8]

history:
  - id: origin
    title: { zh: 条约之下定型, en: Defined by the Treaty }
    range: { from: 1922, to: 1930 }
    lead:
      zh: >-
        口径上限由条约写死，炮与炮座在 1923 到 1927 年间走完设计与服役。
      en: >-
        The calibre ceiling was fixed by treaty; gun and mounting went from design
        to service between 1923 and 1927.
    events:
      - date: 1922-02-06
        text:
          zh: >-
            华盛顿海军条约签订。第十二条禁止非主力舰装载口径超过 8 英寸的火炮，
            第十一条把这类舰的排水量上限定在 10,000 吨。英国重巡的口径与吨位
            从此都被写死。
          en: >-
            The Washington Naval Treaty was signed. Article XII forbade guns over
            8 inches in any non-capital ship and Article XI capped such ships at
            10,000 tons standard displacement, fixing both the calibre and the
            tonnage of a British heavy cruiser.
        src: [washington-treaty-1922]
      - date: 1923
        text:
          zh: >-
            完成设计。同一时期服役的还有装它的四型炮座，其中 Mark I 与 Mark I*
            结构复杂，可靠性问题一直拖到 1920 年代末。
          en: >-
            Design completed. The four mounting marks that carried it date from the
            same period; the Mark I and Mark I* were complex and their reliability
            problems persisted into the late 1920s.
        src: [navweaps-8in-50-mk8]
      - date: 1927
        text:
          zh: >-
            进入服役。入役前的 1927 与 1928 两年，海军把大量注意力放在
            修正早期炮座的俯仰与回转机构上；试验之后，这两项速度在服役前
            被下调，1930 年代又进一步下调。
          en: >-
            Entered service. Considerable attention was paid in 1927 and 1928 to
            the faults in the early mountings; after the initial trials the
            elevation and training rates were reduced before commissioning and
            reduced further during the 1930s.
        src: [navweaps-8in-50-mk8]
      - date: 1929-07-26
        text:
          zh: >-
            德文郡号「X」炮塔左炮迟发火，舰员过早开闩，1 名军官与 17 名舰员死亡，
            炮塔顶盖被掀掉。调查认定闭锁装错；炮座防火挡住了火焰，弹药库未殉爆。
          en: >-
            The left gun in Devonshire's "X" turret hangfired; a crewman opened the
            breech too soon and one officer and seventeen ratings were killed, the
            turret roof blown off. The interlock was found incorrectly assembled;
            the mounting's flash protection kept the explosion out of the magazine.
        src: [navweaps-8in-50-mk8]
      - date: 1930-02
        text:
          zh: >-
            约克号首次射击试验完成，只用了四小时。这型炮座（Mark II）
            与早期 Mark I 的可靠性差距，从这一次试验开始就很明显。
          en: >-
            York's first gun trials were completed in only four hours. The
            reliability gap between this Mark II mounting and the earlier Mark I was
            already visible in that first trial.
        src: [navweaps-8in-50-mk8]

  - id: service
    title: { zh: 战时使用, en: Wartime service }
    range: { from: 1938, to: 1944-08 }
    lead:
      zh: >-
        战前它还有明确的技术抱怨，战时它在 Mark II 炮座上打出了正面评价。
      en: >-
        There were still explicit technical complaints before the war; in action the
        Mark II mounting drew a positive verdict.
    events:
      - date: 1938-06
        text:
          zh: >-
            伦敦号报告：「人们会希望 8 英寸炮座与鱼雷能按它们应该的方式工作。
            伦敦号连续 20 发/门的射击，在器材方面令人失望。」
            这是距开战一年多时的原话，说的正是早期炮座遗留的问题。
          en: >-
            London reported: "one would wish that the 8in mountings and torpedoes
            would behave as they should. The prolonged firing of 20 rounds per gun
            from London was a disappointment on the material side." This is the
            wording from barely a year before the war, and it concerns the legacy
            faults of the early mountings.
        src: [navweaps-8in-50-mk8]
      - date: 1941-05
        text:
          zh: >-
            诺福克号在对俾斯麦的战斗中约 90 分钟打出 527 发，只有小问题；
            舰长 Phillips 对这型 Mark II 炮座的评价是「most satisfactory」。
            但同一份记录里，「X」炮塔右炮只打出 8 发（「B」炮塔右炮 103 发），
            navweaps 归因于发射药包被重复推弹。两条并列，不合并成一句评语。
          en: >-
            Norfolk fired 527 rounds in about ninety minutes against Bismarck with
            minor problems, and Capt. Phillips called the Mark II mountings "most
            satisfactory". In the same record, however, the right gun of "X" turret
            fired only eight rounds against 103 from the right gun of "B", which
            NavWeaps attributes to double ramming of the cordite charges. The two
            statements stand side by side here.
        src: [navweaps-8in-50-mk8]
      - date: 1943-12
        text:
          zh: >-
            诺福克号「X」炮塔在与沙恩霍斯特号交战后因严重损伤被拆下修理。
            1944 年 8 月装回，而全舰其余修理到 11 月才完成。
          en: >-
            Norfolk's "X" turret was removed for repairs after being badly damaged
            in her fight with Scharnhorst. It was reinstalled in August 1944,
            although the ship's other repairs took until November to complete.
        src: [navweaps-8in-50-mk8]
