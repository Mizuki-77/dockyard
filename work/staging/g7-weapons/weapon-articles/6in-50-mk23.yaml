# ============================================================================
# 武器正文 —— 6"/50 (15.2 cm) BL Mark XXIII
#
# ⚠️ 这一型不是纳尔逊级副炮。纳尔逊级那门是 Mark XXII（见 6in-50-mk22.yaml）。
#    两型弹重恰好都是 112 磅，但初速不同（Mk XXII 898 mps / Mk XXIII 841 mps），
#    Mark XXIII 装的是巡洋舰。
#
# 主线三条：
#   1. 它之所以是 6 英寸，是 1929 年伦敦海军会议把巡洋舰炮口径压到 6 英寸的直接结果；
#   2. 「射速快」是轻巡相对 8 英寸重巡的优势，但这个优势有一整条链在限制它——
#      手动推弹、手动开闩、要压到装填角，指挥仪控制下真实射速只有 6 发/分；
#   3. 早期城级有严重的散布问题，根因是发射药远小于药室导致的炮管不均匀振动。
# ============================================================================
weapon: 6in-50-mk23
updated: 2026-11-22

intro:
  lead:
    zh: >-
      6"/50 (15.2 cm) BL Mark XXIII 是英国 1930 年代轻巡的主炮，
      装在利安得、珀斯、林仙、城级、爱丁堡、斐济、锡兰与迅捷各级巡洋舰上。
      它之所以是一门 6 英寸炮而不是 8 英寸，是 1929 年伦敦海军会议
      把巡洋舰主炮口径压到 6 英寸的直接结果。
      它的价值在于射速：名义射速 6 到 8 发/分，而 8"/50 那门重巡主炮是
      3 到 6 发/分（战时实际持续 3 到 4 发/分）——
      也就是说轻巡在单位时间内的投射量接近重巡的两倍，
      代价是弹重只有重巡的一半略多。
      而这个「高射速」在实战里要打不少折扣。
    en: >-
      The 6"/50 (15.2 cm) BL Mark XXIII was the main battery of Britain's 1930s
      light cruisers, arming the Leander, Perth, Arethusa, Town, Edinburgh, Fiji,
      Ceylon and Swiftsure classes. It was a 6-inch gun rather than an 8-inch one
      because the London Cruiser Conference of January 1929 restricted cruiser gun
      size to 6 inches. Its value lay in rate of fire: nominally 6 to 8 rounds per
      minute, against 3 to 6 - and only 3 to 4 sustained in action - for the
      8"/50 heavy-cruiser gun, so a light cruiser threw close to twice as many
      rounds per minute at the cost of a projectile a little over half the weight.
      In action that high rate carried a number of qualifications.

  paragraphs:
    - heading: 它是伦敦会议的直接产物
      text:
        zh: >-
          navweaps 开头第一句就是这个因果：这型炮是 1929 年 1 月
          伦敦巡洋舰会议把巡洋舰火炮口径限制到 6 英寸（15.2 厘米）之后
          才发展出来的。换句话说，它不是一门「选出来的」炮，
          是一门「被规定的」炮。设计 1930 年完成，1933 年服役。
        en: >-
          NavWeaps opens with the causal statement: this weapon was developed as a
          result of the London Cruiser Conference of January 1929, which restricted
          cruiser gun size to 6 inches (15.2 cm). It was not so much a gun that was
          chosen as one that was specified. Design was completed in 1930 and the gun
          entered service in 1933.
      src: [navweaps-6in-50-mk23]

    - heading: 主要参数
      text:
        zh: >-
          口径 6 英寸（15.2 厘米）；身管全长 7.869 米，膛线长 6.486 米，药室 28.7 立方分米；
          炮重 7.017 公吨；穿甲弹（CPBC）与高爆弹均为 112 磅（50.8 公斤）——
          唯有利安得号一门按 100 磅（45.36 公斤）弹设计；
          初速 841 米/秒（新炮）；射速 6 到 8 发/分；
          45 度仰角时最大射程 25,480 码（23,300 米）。
          身管寿命约 1,100 发（另有一说 1,020 发，两说并列）。
          备弹每门 200 发 —— 城级为符合条约要求按 150 发登记，实际弹库可容 200 发。
          需要留意的是，射程表是按初速 823 米/秒算的，低于服役初速 841 米/秒。
        en: >-
          Calibre 6 inches (15.2 cm); gun length overall 7.869 m with 6.486 m of
          rifling and a 28.7 dm3 chamber; gun weight 7.017 tonnes. Both the CPBC
          and HE projectiles weighed 112 lb (50.8 kg) - only Leander was designed
          around the 100 lb (45.36 kg) shell. Muzzle velocity 841 m/s new gun; rate
          of fire 6 to 8 rounds per minute; maximum range 25,480 yards (23,300 m)
          at 45 degrees. Barrel life about 1,100 rounds, with one source giving
          1,020 - both figures are recorded here. Stowage was 200 rounds per gun;
          the Town class were rated at 150 for Treaty compliance but had space for
          200. Note that the range table is calculated for 823 m/s, below the
          service muzzle velocity of 841 m/s.
      src: [navweaps-6in-50-mk23]

    - heading: 射速的优势，与 8 英寸炮的直接对比
      text:
        zh: >-
          这一点用同站两页的数据对比最清楚：8"/50 Mark VIII 的射速是 3 到 6 发/分，
          而《British Cruisers of World War Two》说它在战时实际持续射速只有 3 到 4 发/分；
          6"/50 Mark XXIII 的名义射速是 6 到 8 发/分，实际被认为 6 发/分。
          也就是说，轻巡在单位时间内的投射量上确实占优，
          代价是弹重只有重巡的一半略多（50.8 公斤对 116.1 公斤）。
          城级之所以被造出来，正是这个交换的结果。
        en: >-
          The comparison with the 8-inch weapon makes the point: the 8"/50 Mark VIII
          is rated at 3 to 6 rounds per minute, with British Cruisers of World War
          Two putting the maximum sustained rate in action at 3 to 4; the 6"/50 Mark
          XXIII is rated at 6 to 8 nominally and 6 in practice. The light cruiser
          therefore genuinely delivered more rounds per minute, at the cost of a
          projectile a little over half the weight - 50.8 kg against 116.1 kg. The
          Town class existed because of that trade.
      src: [navweaps-6in-50-mk23, navweaps-8in-50-mk8]

    - heading: 它的「进步」全在炮座上，不在炮上
      text:
        zh: >-
          navweaps 对这型炮本体的评价并不高：可靠，但在使用分装药包、
          手动推弹与手动开闩这几点上已经有些过时。
          真正改进的是炮座：与更早的巡洋舰相比，这型炮座的弹药供应更好，
          有动力驱动的扬弹机与重力辅助的装填托盘，用来提高射速。
          这些改进再加上封闭式炮座，还降低了炮组疲劳，
          于是较高的射速能维持更久 —— 这三件事是一条链，不是三件独立的好事。
        en: >-
          NavWeaps is not generous about the gun itself: a reliable weapon, although
          somewhat obsolescent in its use of bag ammunition, manual ramming and a
          manually operated breech. The improvement was in the mounting, which had
          better ammunition supply than earlier cruisers - power-operated hoists and
          gravity-assisted loading trays - to raise the rate of fire. Those changes,
          plus enclosed mountings, also reduced crew fatigue, so the higher rate
          could be sustained longer. That is one chain of cause, not three separate
          virtues.
      src: [navweaps-6in-50-mk23]

    - heading: 「8 发/分」是怎么算出来的，以及为什么实战只有 6 发
      text:
        zh: >-
          这一条必须写全，因为只留一个数字就是失真。
          navweaps 给的射速是 6 到 8 发/分，然后引 Peter Cannon 的说明：
          名义上的 8 发/分是在局部控制下、把炮压到装填角时才能达到的 ——
          瞄具手在「装填间隔」结束、两盏「Gun Ready」灯亮起时立刻击发，
          这个间隔就是炮组装填所需的净时间。实战不是这样：
          在指挥仪控制下还要算上「控制间隔」（指挥仪瞄准手稳定瞄准所需时间，
          平均约 3 秒），以及远距离射击时要把炮压到装填角再抬回射角的时间。
          把这些都算进去，这座炮座的实际射速被认为是 6 发/分 ——
          而且原文补了一句「多数战斗里这种机会都很少」。
          本站的处理是：8 发/分（局部控制、理论值）与 6 发/分（指挥仪控制、实际值）
          并列，两个数字各带各自的限定条件，不合并成一个「射速」。
        en: >-
          This has to be set out in full, because a single number would distort it.
          NavWeaps gives 6 to 8 rounds per minute, then quotes Peter Cannon: the
          nominal eight was achievable in local control with the guns laid to
          loading elevations, the local sight layer pulling the trigger as soon as
          his two "Gun Ready" lamps lit after the loading interval - the bare time it
          took the crew to reload. Reality in action was different, particularly
          under director control, which had to account for the control interval
          (about three seconds on average for the director layer to steady his aim)
          as well as depressing and elevating the gun to loading angles while firing
          at long range. With all of that, six rounds per minute was considered the
          practical rate of the mounting - and NavWeaps adds that "during most
          actions such opportunities were rare". Both figures stand here, each with
          its own conditions, rather than being merged into one "rate of fire".
      src: [navweaps-6in-50-mk23]

    - heading: 河床海战那 10 发/分，出处本身是转述
      text:
        zh: >-
          navweaps 还记了另一种说法：阿基里斯号（HMNZS Achilles）的「Y」双联炮塔
          在河床海战开头几分钟里打到 10 发/分，直到炮组疲劳，
          之后降到约 6 发/分；同一场战斗里「B」炮塔平均 5 发/分。
          必须说明的是，navweaps 对这一句用的是「is said to have been able to」——
          它本身没有给出处，是在转述一个流传的说法。
          因此本站把 10 发/分这条只作并列记载，
          不当作结论，也不与上面 8 发/分的机构上限混为一谈。
          另据 Raven 与 Roberts 的《British Cruisers of World War Two》，
          三联装炮座在实战中约为 5 到 6 发/分/门。
        en: >-
          NavWeaps also records another claim: the twin "Y" turret on HMNZS
          Achilles is said to have been able to fire at 10 rounds per minute for a
          few minutes at the Battle of the River Plate before the crews tired, after
          which the rate fell to about six; "B" turret averaged five in the same
          action. It matters that NavWeaps frames this as "is said to have been able
          to fire" - it cites nothing and is repeating a received account. This
          article therefore records the ten-round figure only as a parallel claim,
          does not treat it as a finding, and does not conflate it with the
          eight-round mechanical ceiling above. Raven and Roberts, in British
          Cruisers of World War Two, give about five to six rounds per gun per
          minute for the triple mountings in action.
      src: [navweaps-6in-50-mk23]

    - heading: 早期城级的散布问题，根因找到了
      text:
        zh: >-
          早期南安普顿（城）级有严重的散布问题，记录到的散布达 700 码（640 米）。
          最初怀疑是两侧炮口冲击波影响了中间那发弹的弹道 ——
          中间那门炮本来就是为此后移安装在炮座上的。
          1937 年 10 月在 Shoeburyness 负责纽卡斯尔号射击试验的 Hay 教授
          提出了另一个解释：发射药包比药室小得多，燃烧时药室顶部压力高于底部与两侧，
          于是沿炮管产生了不均匀的振动。炮塔内加装的高速摄影机证实，
          确实有炮弹在炮口处是偏斜的，这就是散布变大的原因。
          解决办法是加一个延时电路，把中间那门炮的击发推迟，
          让三发弹之间的间隔变大，散布随之减小。
        en: >-
          The early Southampton ("Town") class suffered dispersion problems, with
          spreads of up to 700 yards (640 m) recorded. The first suspicion was that
          air currents set up by the wing shells were affecting the centre
          projectile - which was why the centre gun had been set back in the
          mounting. Professor Hay, in charge of Newcastle's gunnery trials at
          Shoeburyness in October 1937, proposed another explanation: the cordite
          charge was much smaller than the chamber, so its burning caused more
          pressure at the top of the chamber than at the bottom and sides, producing
          an uneven vibration along the barrel. High-speed cameras mounted in the
          turret showed that some shells were indeed canted at the muzzle, which
          increased dispersion. The remedy was a timing circuit that delayed the
          firing of the centre gun, increasing shell separation and reducing
          dispersion.
      src: [navweaps-6in-50-mk23]

    - heading: 它装在哪几艘船上，以及为什么多数舰拆了「X」炮塔
      text:
        zh: >-
          装舰名单按炮座分三档，不能混：双联装 Mark XXI 装在利安得级（4 座）
          与林仙级（3 座）；三联装 Mark XXII 装在早期城级 ——
          南安普顿级 4 座、格洛斯特级（后期城级）4 座；
          三联装 Mark XXIII 装在爱丁堡级（4 座）、斐济级（4 座）、
          锡兰级（3 座）与迅捷级（3 座）。
          注意炮与炮座的编号不同：城级的炮是 Mark XXIII，炮座是 Mark XXII。
          爱丁堡级原本计划装四联装，1936 年初在 Shoeburyness 用等间距
          42 英寸（106.7 厘米）的四炮模型试验，出现严重的弹道干扰与碰撞，
          散布很大；改成两两成对的布局也不达标，四联装遂取消，改为改进型三联装。
          战争后期多数幸存巡洋舰拆掉了「X」炮塔，作为加装电子设备与轻型防空炮的
          重量补偿；贝尔法斯特号是唯一一艘全程保留四座 6 英寸炮座的
          —— 她拆掉的是两座双联 4 英寸炮座。
        en: >-
          The ship list has to be kept apart by mounting: the twin Mark XXI armed
          the Leander (4) and Arethusa (3) classes; the triple Mark XXII the early
          Town class, four in Southampton and four in Gloucester; the triple Mark
          XXIII the Edinburgh (4), Fiji (4), Ceylon (3) and Swiftsure (3) classes.
          Gun and mounting marks are not the same number: the Town class's gun was
          the Mark XXIII and its mounting the Mark XXII. The Edinburgh class had
          originally been planned with quadruple mountings; tests at Shoeburyness in
          early 1936 with a mock-up where all four guns were equally spaced 42
          inches (106.7 cm) apart showed considerable shell interference and
          collision, and a later two-pairs layout was also unacceptable, so the
          quadruple was cancelled in favour of an improved triple. Later in the war
          most surviving cruisers had "X" turret removed as weight compensation for
          added electronics and light AA; Belfast was unique in keeping all four of
          her 6-inch mountings, having lost two twin 4-inch mountings instead.
      src: [navweaps-6in-50-mk23]

history:
  - id: origin
    title: { zh: 伦敦会议与定型, en: The London Conference and the design }
    range: { from: 1929, to: 1937 }
    lead:
      zh: >-
        口径是会议定的，炮是 1930 年设计的，最严重那个毛病的根因是 1937 年在靶场上找到的。
      en: >-
        The conference set the calibre, the design followed in 1930, and the root
        cause of its worst fault was found on a range in 1937.
    events:
      - date: 1929-01
        text:
          zh: >-
            伦敦巡洋舰会议把巡洋舰火炮口径限制到 6 英寸（15.2 厘米）。
            这型炮就是该限制的直接产物 —— 英国轻巡的主炮口径从此定在 6 英寸。
          en: >-
            The London Cruiser Conference restricted cruiser gun size to 6 inches
            (15.2 cm). This weapon was developed as a direct result, fixing the
            British light cruiser's main armament at that calibre.
        src: [navweaps-6in-50-mk23]
      - date: 1930
        text:
          zh: >-
            完成设计。炮为分装药包、手动推弹、手动开闩；
            提升射速的手段全部放在炮座上（动力扬弹机与重力辅助装填托盘）。
          en: >-
            Design completed. The gun used bag ammunition, manual ramming and a
            hand-operated breech; every measure to raise the rate of fire was put
            into the mounting instead - power hoists and gravity-assisted loading
            trays.
        src: [navweaps-6in-50-mk23]
      - date: 1933
        text:
          zh: >-
            进入服役，首装利安得号 —— 她是唯一一艘按 100 磅（45.36 公斤）弹
            设计的舰。建造期间决定把弹重提高到 112 磅（50.8 公斤），
            这个改动对利安得号来得太晚，后续各舰都装了重弹。
            navweaps 指出改动「相对较小」，但没有记录利安得号后来改装成能打重弹。
          en: >-
            Entered service, first in Leander, the only ship designed around the
            100 lb (45.36 kg) shell. During her build the decision was taken to
            increase shell weight to 112 lb (50.8 kg); that came too late for
            Leander, while all subsequent ships got the heavier shell. NavWeaps
            notes the modifications were "relatively minor" but records no later
            conversion of Leander to the heavier projectile.
        src: [navweaps-6in-50-mk23]
      - date: 1936
        text:
          zh: >-
            爱丁堡级原定的四联装炮座在 Shoeburyness 试验失败：四炮等间距
            42 英寸时弹道干扰与碰撞严重，散布过大；改为两两成对仍不可接受，
            四联装取消，改用改进型三联装。
          en: >-
            The quadruple mounting planned for the Edinburgh class failed at
            Shoeburyness: with all four guns equally spaced at 42 inches there was
            considerable shell interference and collision with large dispersal, and
            a two-pairs layout was no better, so the quadruple was cancelled for an
            improved triple.
        src: [navweaps-6in-50-mk23]
      - date: 1936-07-03
        text:
          zh: >-
            南安普顿号的「Y」炮座（三联装 Mark XXII）吊装就位。
            炮与炮座编号不同：这一级的炮是 Mark XXIII，炮座是 Mark XXII，
            防盾正面为圆弧形，这一点与后来的 Mark XXIII 炮座的方切形不同。
          en: >-
            Southampton's "Y" mounting, a triple Mark XXII, was lowered into place.
            Gun and mounting carry different numbers: this class's gun was the Mark
            XXIII while the mounting was the Mark XXII, and its glacis plate was
            rounded rather than the squared-off form of the later Mark XXIII
            mounting.
        src: [navweaps-6in-50-mk23]
      - date: 1937-10
        text:
          zh: >-
            纽卡斯尔号在 Shoeburyness 做射击试验，Hay 教授提出散布的根因是
            药包远小于药室造成的炮管不均匀振动；炮塔内高速摄影证实弹丸在炮口偏斜，
            加装延时电路推迟中间炮击发之后，散布减小。
          en: >-
            Newcastle's gunnery trials were held at Shoeburyness, where Professor
            Hay attributed the dispersion to uneven barrel vibration caused by a
            charge much smaller than the chamber; high-speed cameras in the turret
            confirmed shells leaving the muzzle canted, and a timing circuit
            delaying the centre gun reduced the spread.
        src: [navweaps-6in-50-mk23]

  - id: service
    title: { zh: 战时使用与战后遗存, en: Wartime service and survivors }
    range: { from: 1939-12, to: 1978 }
    lead:
      zh: >-
        它在河床海战里开过火，在北大西洋与太平洋上都在役；
        战后有两座炮塔被拆下来当纪念物。
      en: >-
        It fired at the River Plate and served in the North Atlantic and the Pacific;
        two of its turrets survive as memorials.
    events:
      - date: 1939-12-13
        text:
          zh: >-
            河床海战。阿基里斯号的「Y」炮塔与「B」炮塔参战。
            据 navweaps 转述的说法，「Y」炮塔开局打 10 发/分、随后降到约 6 发/分，
            「B」炮塔平均 5 发/分。**10 发/分这一条 navweaps 用的是「is said to」，
            未给一手依据，本站只并列记载，不作论断。**
          en: >-
            The Battle of the River Plate. Achilles' "Y" and "B" turrets were
            engaged. Per the account NavWeaps repeats, "Y" opened at ten rounds per
            minute before falling to about six and "B" averaged five. **NavWeaps
            frames the ten-round figure as "is said to", with no primary reference;
            it is recorded here in parallel only, not as a finding.**
        src: [navweaps-6in-50-mk23]
      - date: 1941-06-12
        text:
          zh: >-
            谢菲尔德号在北大西洋击沉德国油船 Friederich Breme 号。
            这一条留作本型的舰级归属凭据：谢菲尔德号属城级（南安普顿级），
            她的 6 英寸炮就是本页这型 Mark XXIII，炮座为 Mark XXII ——
            不是纳尔逊级的 Mark XXII 炮（两者编号相同但一个是炮、一个是炮座）。
          en: >-
            Sheffield sank the German tanker Friederich Breme in the North Atlantic.
            The event is kept as evidence of class attribution: Sheffield was a
            Town (Southampton) class cruiser, so her 6-inch guns are this Mark XXIII,
            in Mark XXII mountings - not the Nelson class's Mark XXII gun. The two
            share a number but one is a gun and the other a mounting.
        src: [navweaps-6in-50-mk23]
      - date: 1945-06
        text:
          zh: >-
            加拿大皇家海军乌干达号（HMCS Uganda）的炮组在为炮击特鲁克
            设定高爆弹弹头引信。这一型在太平洋战场同样在役。
          en: >-
            The guncrew of HMCS Uganda setting HE nose fuzes before bombarding
            Truk - the weapon was in service in the Pacific as well.
        src: [navweaps-6in-50-mk23]
      - date: 1948
        text:
          zh: >-
            战后贝尔法斯特号的备弹统计：1,384 发 CPC、960 发 HE、474 发练习弹、
            44 发教练弹，合计 2,862 发。这组数字保留了战时备弹构成的变化 ——
            1940 年 CPBC 与 HE 的比例由 180:20 调整为 170:30，反映空中威胁上升。
          en: >-
            Belfast's post-war outfit was recorded as 1,384 CPC, 960 HE, 474
            practice and 44 drill, a total of 2,862 projectiles. The figures preserve
            a wartime shift in the ammunition mix: in 1940 the CPBC-to-HE ratio was
            changed from 180:20 to 170:30, reflecting the increased air threat.
        src: [navweaps-6in-50-mk23]
      - date: 1978
        text:
          zh: >-
            印度海军德里号（原新西兰海军阿基里斯号）退役，其「Y」炮塔拆下
            赠予新西兰政府，现存奥克兰德文波特海军基地入口；
            另一座炮塔保存在印度纳西克的炮兵团博物馆。
            贝尔法斯特号则整舰作为博物馆舰保存在伦敦。
          en: >-
            INS Delhi, formerly HMNZS Achilles, was decommissioned; her "Y" turret
            was removed and given to the New Zealand government and now stands at
            the entrance to Devonport Naval Base, Auckland, while a second turret is
            preserved at the Regiment of Artillery Museum in Nashik, India. Belfast
            is preserved complete as a museum ship in London.
        src: [navweaps-6in-50-mk23]
