  - id: combinedfleet-atully08
    title: 'Located & Surveyed Shipwrecks of the Japanese Navy (Anthony P. Tully, combinedfleet.com)'
    url: https://www.combinedfleet.com/atully08.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: combinedfleet.com（Anthony P. Tully；筑摩段落的图证分析由 Ed Low 作，2005-04）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      IJN 沉舰调查合集。筑摩条目（Heavy Cruiser - CHIKUMA）是**目前可得的最细致损失分析**：
      0853 鱼雷打掉舰尾、打坏舵、只剩内侧左螺旋桨（原地打转）；1105 被 VC-5 两雷打停、
      左倾；1130 野分靠上左舷被 VC-76 拍到；1415 被 OMMANEY BAY 的 VC-75 三雷致向左翻覆
      尾部下沉。**结论措辞最谨慎**："All the evidence roughly agrees with NOWAKI commencing
      rescue operations about now."——即倾向「野分只救人」。同页亦记该舰残骸**至今未找到**。
      ⚠ 同一作者更详的 TullyLeyte.pdf 是纯扫描图无文字层，未采用。

  - id: navypedia-tone
    title: 'TONE heavy cruisers (1938 - 1939) — Navypedia'
    url: https://www.navypedia.org/ships/japan/jap_cr_tone.htm
    type: website
    tier: D
    role: [data]
    operator: navypedia.org
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      主尺度/装甲/动力骨架 + 逐期改装表 + 两舰建造日期与结局。
      口径提示：① 标准排水量 11215 t、全长 201.6 m、4 轴 8 炉 152000 hp、35 kt；
      ② 装甲写 "belt 100 (machinery) - 145 (magazines), deck 65 - 31, turrets 25"，
      与日文维基的「舷側 145 / 甲板 35」**口径不同，不可混用**；
      ③ 舰载机写 "6 seaplanes (3 E7K1, 3 E8N1), 2 catapults"，与 combinedfleet「5 架」冲突；
      ④ 结局写 "Chikuma … sunk by destroyer Nowaki"、"Tone … sunk 24.7.1945"，
      两处都与 combinedfleet 的日期/方式不完全一致，引用时并列。

  - id: tone-class-design-ja
    title: '利根型重巡洋艦 — ウィキペディア日本語版'
    url: https://ja.wikipedia.org/wiki/%E5%88%A9%E6%A0%B9%E5%9E%8B%E9%87%8D%E5%B7%A1%E6%B4%8B%E8%89%A6
    type: encyclopedia
    tier: E
    role: [lead]
    operator: Wikipedia（日本語版）
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa_4
    note: >-
      **tier E，只能当线索，不能当 fact 或正文来源。** 本笔记只用它两条设计说明并已在
      RESEARCH-NOTES 里标明 tier：
      ① 「後檣より後ろすべてが航空兵装」，主炮全前置使舰载机不致被主炮爆风损坏、
         故可随时全主炮齐射（并举妙高、高雄被自家爆风毁机的例子）；
      ② 无机库、露天系止、弹射甲板比系止甲板高一级、低处甲板易上浪维护性差，
         故后来的大淀改设机库；并给 `呉式2号射出機2基`（**此型号未得第二源，不可入 fact**）。
      另给逐期搭载定数表：计划 6 机 → 1942-06-25 前 零式 3 + 九五式 2 → 之后 零式 5。

  - id: tone-ca-ja
    title: '利根 (重巡洋艦) — ウィキペディア日本語版'
    url: https://ja.wikipedia.org/wiki/%E5%88%A9%E6%A0%B9_(%E9%87%8D%E5%B7%A1%E6%B4%8B%E8%89%A6)
    type: encyclopedia
    tier: E
    role: [lead]
    operator: Wikipedia（日本語版）
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa_4
    note: >-
      **tier E，只能当线索。** 本笔记用它的三处：
      ① **利根 4 号机延误**：「利根のカタパルトが故障し…発進が30分遅れ…**とする文献がある**」
         ——注意日文原文自己就把「30 分钟」标成「有文献如此说」；同段还给土井美二参谋
         「4 号机罗盘失准才得以发现美舰队」的说法，以及近年研究「迟发反而发现、准时反而
         错过」的反向结论。**三条都是线索，正文须另找 C/D 级来源。**
      ② **利根 1945 年结局**：3-19 吴空袭至近弹致 3 号炮塔不可用 → 移能美岛海岸伪装 →
         7-24 左舷中部直击弹 → 7-28 左舷后部 2 直击（1000 磅、瞬发信管、未穿水平装甲）
         + 6 近失、左倾 20 度以上 → 7-29 着底。
      ③ 1943-11-05「利根は隼鷹を曳航、11月6日呉に到着」——**TROM 未点名拖带者，此处为单源。**

  - id: chikuma-ca-ja
    title: '筑摩 (重巡洋艦) — ウィキペディア日本語版'
    url: https://ja.wikipedia.org/wiki/%E7%AD%91%E6%91%A9_(%E9%87%8D%E5%B7%A1%E6%B4%8B%E8%89%A6)
    type: encyclopedia
    tier: E
    role: [lead]
    operator: Wikipedia（日本語版）
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa_4
    note: >-
      **tier E，只能当线索。** 本笔记用它的两处：
      ① 1944-10-25 经过的日方表述：8:53 前后被护卫航母 NATOMA BAY 起飞的 TBF 以 1 雷
         命中舰尾起火 → 弹药耗尽后用演习弹應战 → 下午 4 时前后舰中部复数命中 → 左倾 →
         发出总员退舰 → 「その後、駆逐艦野分により雷撃処分された」；
      ② 幸存者：野分救起 120 余名，野分当晚被击沉；未被野分救起的 1 名短期现役士官
         漂 3 天后被美舰救起、战后回国。「筑摩・野分の生存者は、筑摩航空機搭乗員を除けば
         1名のみ」；「舞鶴鎮守府は、単艦で帰投した利根を見て筑摩の沈没を覚った」。
      ⚠ 注意：① 的「雷撃処分」与 combinedfleet-chikuma 的「翻覆沉没」冲突，**两说并列**。

  - id: imodeler-scout4
    title: 'Scout 4 Is Late — 1/48 Battle of Midway Group Build, Aichi E13A "Jake" (iModeler)'
    url: https://imodeler.com/2017/06/scout-4-is-late/
    type: website
    tier: D
    role: [narrative]
    operator: iModeler（模型作者帖，2020-06-20）
    lang: en
    access: proxy
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      **本笔记关于「利根 4 号机延误原因众说纷纭」的唯一英文汇总来源**，是模型作者的考据帖
      而非史学论文，故 tier D、role 只给 narrative，**不可作 fact 来源**。
      它列举了四种说法：弹射器故障（most commonly reported）、发动机故障、
      日方指挥文化轻慢侦察导致机组干等命令、以及（转述 Shattered Sword）机组为避开
      Catalina 而自行缩短航程。并给出与 ONI 换算后完全吻合的四个报文时刻：
      0728 / 0758 / 0809 / 0820（当地时）。
      **access 记 proxy**：imodeler.com 直连 403，正文经 Wayback 存档读取
      （http://web.archive.org/web/20260517143345/https://imodeler.com/2017/06/scout-4-is-late/）。
