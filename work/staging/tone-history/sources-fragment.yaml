# ============================================================================
# 来源分片：利根型重巡洋舰（利根 / 筑摩）调研新登记的来源
# ----------------------------------------------------------------------------
# 已在 data/sources.yaml 登记、本次直接复用的（**不重复登记**）：
#   combinedfleet-mikuma        （三隈号 TROM，同期同站，格式可参照）
#   combinedfleet-i168          （伊-168 TROM，筑摩 2 号机引导其找到约克城）
#   oni-japanese-story-midway   （ONI P32-1002，利根 4 号机逐时报文，东京时）
#   jm93-midway-operations      （Japanese Monograph No.93，日方中途岛作战记录）
#   nhhc-h006-2-isr-midway      （S. J. Cox，推翻「利根 4 号机延误＝败因」）
#   navweaps-20cm-3ns / navweaps-127cm-89 / navweaps-25mm-96  （利根级武备）
#   navypedia-soryu 等既有 navypedia-*  系列（命名格式可参照）
#
# 抓取方式说明（2026-11-23 实测）：
#   web_fetch / research 对全部域名返回 SSRF blocked，全程改用 Python urllib
#   + Chrome UA 直连，原始页面存 work/staging/tone-history/_raw/。
#   combinedfleet.com / navypedia.org / ibiblio.org / wikipedia 全部可直连 → access: direct
#
#   ⚠ history.navy.mil（NHHC）整站 TLS 握手失败（UNEXPECTED_EOF_WHILE_READING），
#     curl/schannel 亦不通。nhhc-h006-2 的正文改从 Wayback 存档取得，
#     但该来源已在 data/sources.yaml 登记且 url 为 NHHC 原始 URL，故此处不重复登记；
#     正文引用时请在 note 里补一句「经 Wayback 存档读取」。
#   ⚠ usni.org 403、jstor.org 需订阅 → Tully 2000 年那篇原文未获取，未登记。
# ============================================================================

sources:
  - id: combinedfleet-tone
    title: 'IJN TONE — Tabular Record of Movement (combinedfleet.com)'
    url: https://www.combinedfleet.com/tone_t.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: combinedfleet.com（Bob Hackett / Sander Kingsepp，Revision 22）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      利根号全生涯逐日年表（1934-12 起工 → 1948-09 拆解完）。本笔记 TROM 主表的主力来源。
      口径提示：① 中途岛段用**中途岛当地时**（1942-06 当地为 UTC−12），与同站引用的
      ONI 东京时相差 21 小时，换算规则见 RESEARCH-NOTES §0.2；
      ② 个别条目带 "Reportedly"（如 1943-10-31「离特鲁克时把全部水侦留下」），
      转写正文时不可去掉该限定词；
      ③ 原页有多处排印错误（"28 June July 1942"、"pursuit of of Halsey's ships"），
      引用时按原文照抄，另在 note 里标注。
      ④ 该页 1943-11-05 只写隼鹰被雷击后拖回吴，**未点名拖带者是利根**；
      利根当时在本土近海，不在拉包尔——英文维基把「拉包尔受损」写在利根身上是错的。

  - id: combinedfleet-chikuma
    title: 'IJN CHIKUMA — Tabular Record of Movement (combinedfleet.com)'
    url: https://www.combinedfleet.com/chikuma_t.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: combinedfleet.com（Bob Hackett / Sander Kingsepp，Revision 20）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      筑摩号全生涯逐日年表（1935-10 起工 → 1945-04-20 除籍）。**萨马岛沉没逐时链的一手转述**：
      0853 被 Taffy 2 的 TBM 雷击失速 → 0907/0920/0930 三次报大和 → 1105 被 KITKUN BAY
      机命中 2 雷 → 1415 被 OMMANEY BAY 机命中 3 雷 → 约 1430 向左翻覆、尾部下沉于
      11-52N 126-36E，野分救起约 120 人。尾注记「唯一未被野分救起的 1 名幸存者 3 天后
      被美舰捞起」。口径：与 navypedia「sunk by destroyer Nowaki」、日文维基「野分により
      雷撃処分」冲突——本页写的是「翻覆沉没」，三说并列不裁决。

