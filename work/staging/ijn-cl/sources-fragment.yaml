    title: Sendai class Cruisers (1923) — naval encyclopedia
    url: https://naval-encyclopedia.com/ww2/japan/sendai-class-cruisers.php
    type: website
    tier: D
    role: [data, narrative]
    operator: naval-encyclopedia.com
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      川内级的英文综述。**本组只用它做旁证**。
      **关于鱼雷再装填的最重要一句（本组唯一的英文「reload」原话）**：
      「Before the war in 1942 their torpedo tubes were augmented, at last on Naka and
      Jintsu which had their forward twin tubes banks eliminated and the hull plated over
      for better seakeeping, but keeping their aft banks, now upgraded to quadruple ones
      for the same "long lance". Eight tubes, but the same number or reloads
      (so 16 torpedoes in all).」
      —— 这句说明那珂/神通换四连装后仍是 8 门 + 8 条备份 = 16 条，
      **但它说的是那珂与神通，不是川内**；且「reloads」在这里指备份鱼雷，
      **不等于「次発装填装置」这种机械装填装置**。引用时必须区分。
      另：该页对长良级鱼雷段亦有「Twenty-four inch torpedoes」表述，
      但未给长良级的 reload 数。

