         又写「range of 6,000 nmi at 14 knots」，后文又写「9,000 nautical miles at 10 knots」
         —— 同一页两个续航值；
      ② 「armoured belt 60 mm ... armored deck 30 mm」与 navypedia 的 63/29、
         kasado 的 38/29 三方并存；
      ③ 鱼雷段称本级换装的是「Type 93 Long Lance」，但同句又说是「same number」
         （4 座连装）—— **与「1944 年才换四连装」的其他来源时序矛盾**，
         本站不采用该页的换装时序。

