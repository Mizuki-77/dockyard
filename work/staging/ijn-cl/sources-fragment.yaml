      射速 6–10 发/分、弹重 38.0 kg、初速 850–855 mps、身管寿命 500–600 发、
      单装炮座约 20 t、旋回 ±150°、俯仰/旋回均 8°/s 人力。
      **本页不给**单一「最大射程 @ 仰角」值，只给分仰角射程表 —— 故本组未写 weapon.range.max。

  # ---------------------------------------------------------------- 鱼雷（再装填装置的取证）
  - id: dougakan-cl4
    title: 日本海軍史 軽巡洋艦４（軽巡の発射管と魚雷）— 図鑑置場
    url: http://dougakan675.blog49.fc2.com/blog-entry-90.html
    type: website
    tier: D
    role: [data, narrative]
    operator: dougakan675.blog49.fc2.com
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      日文长篇技术随笔，逐条讲 5500 吨型轻巡的鱼雷发射管沿革。本组用它取证
      「长良型/川内型各带多少条鱼雷、发射管怎么布置」。
      **可用的关键原话**：
      ① 「八年式六一センチ魚雷搭載数は両舷各二斉射分の一六本であった」
         —— 长良型带 16 条鱼雷 = 两舷各两个齐射份 = 8 门发射管各 1 条备份；
      ② 「長良型の八年式連装水上発射管装備位置は…艦橋後部の船首楼甲板下の上甲板両舷に各一基、
         第3煙突後方の上甲板両舷に各一基の合計四基八門」—— 四基八门的具体位置；
      ③ 「発射管は…楯を有さず、管体むき出しのままであったが、魚雷を装填すると
         全備重量は一三トンを越えるものとなり、旋回は…五馬力の電動機による機力旋回であった。
         三六〇度旋回時間は約一分」—— 单座全备 13 t 余、5 hp 电机驱动、360° 约 1 分钟；
      ④ 川内型条目「魚雷発射管＝八年式六一センチ連装発射管四基 / 魚雷＝八年式六一センチ魚雷一六本」。
      **重要局限**：全文**没有出现「次発装填装置」这个词**。
      它只说「16 条鱼雷」和「每舷两个齐射份」，即**推论上存在 8 条备份雷**，
      但**没有任何一句说这些备份雷是靠机械再装填装置上膛的**。
      本站因此不写「装几组再装填装置」，见 RESEARCH-NOTES 的「卡住的地方」。

  - id: nsl-torpedoes-2
    title: Imperial Japanese Navy Torpedoes, Part II — Naval Submarine League Archive
    url: https://archive.navalsubleague.org/2002/imperial-japanese-navy-torpedoes-part-ii
    type: website
    tier: D
    role: [data, narrative]
    operator: Naval Submarine League（archive.navalsubleague.org）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      英文的日本鱼雷发展综述，用来做「本级为什么换 61 cm」的英文原句依据。
      **可用原话**：
      ① 「These huge weapons were mounted on cruisers beginning with the Nagara class,
         laid down in 1920-21, and on destroyers beginning with the Mutsuki class」
         —— 长良级是日本巡洋舰用 61 cm 鱼雷的起点；
      ② 「During WWII the torpedo armament was twelve or sixteen 24 inch tubes and usually
         twenty-four Type 93 torpedoes including reloads.」—— 这句讲的是**重巡**（A 类），
         不是轻巡，引用时**必须限定范围，不可拿来套长良/川内**；
      ③ 「Fifteen of the light cruisers that were commissioned in the Japanese Navy after
         WWI were built with 24 inch tubes. ... All of these cruisers probably were capable
         of firing Type 93 torpedoes, but some may not have been issued oxygen torpedoes
         until some time after Pearl Harbor if at all.」
         —— 注意原文用的是「probably」与「may not」，**是推测措辞，不可当定论引用**。

