# ============================================================================
# 川内（せんだい / Sendai）· 川内型 1 番舰
#
# 2026-11-23 入库。舰级共享设计值见 classes/sendai.yaml，本文件只写：
#   ① 建造四日期；② 逐次改装（时间窗）；③ 本舰独有的值；④ 战历关键节点。
#
# 【任务书核对结果 —— 两处需订正，一处确认】
#   ① 结局年份：任务书写「两舰结局都沉于 1943 年」。**川内确实沉于 1943-11-02**，
#      这条对。但她不是「在布干维尔被潜艇/飞机击沉」，是**布干维尔岛冲海战
#      （Battle of Empress Augusta Bay）中被美军巡洋舰雷达射击命中、次日凌晨沉没**。
#      任务书写的「川内在布干维尔？」地点正确、方式不对。
#   ② 中途岛编队：任务书写「第 3 水雷战队旗舰（主力部队）」。**正确**。
#      精确表述：DesRon 3 旗舰，随山本五十六亲率的主力部队（第一战队 大和・长门・陆奥
#      等），全程未与美军接触。见下方 service.unit 各条与 RESEARCH-NOTES。
#   ③ 「川内是 5500 吨型里唯一实际跑出 36 节」：来源支持（公试 36.189 kn / 97,657 hp，
#      见 propulsion.speed.trial）。这是 japanese-warship 引日文技术文的孤值，
#      且该站把出处标成中文网络文章，本站按单源 C 级处理。
# ============================================================================

id: sendai
name:
  zh: 川内
  en: Sendai
class: sendai

note: >-
  川内型命名舰。1922-02-16 三菱长崎造船所开工，1923-10-30 下水，1924-04-29 竣工。
  太平洋战争全程任第三水雷战队（DesRon 3）旗舰，参与马来半岛登陆、埃达乌海战、
  瓜岛多次炮击与运输、第二次瓜岛海战，1943-11-02 在布干维尔岛奥古斯塔皇后湾海战中
  被美军巡洋舰击沉。她是川内型三舰中唯一有「击沉敌舰认定」战果的一艘（埃达乌海战）。

open_ended_note: >-
  本文件 fact 的 valid 窗口按「该状态从何时起」记录；改装造成的中断由下一条 fact
  接续（同一 field 多个时间窗），不合并、不覆盖。

