# 长良 状态切片
# 2026-11-23 建。切片边界落在 1920-09-09 至 1944-08-07 之间。
# 判据：外形/武备/探测三者的可见变化。日常巡航与换装之间的空档不硬凑片。

ship: nagara
slices:
  - code: P0
    title: 建造与竣工（1920-09 至 1922-04）
    from: 1920-09-09
    to: 1922-04-21
    note: >-
      1920-09-09 佐世保海军工厂开工，1921-04-25 下水命名，1922-04-21 竣工。
      竣工形态：14 cm 单装炮 7 门、8 cm/40 单装高角炮 2 门、6.5 mm 机炮 2 挺、
      61 cm 八年式连装发射管 4 基 8 门（鱼雷 16 条）、机雷 48 个、
      **滑走台（无弹射器）** 1 基、水上机 1 机、三烟囱。

  - code: P1
    title: 两次大战之间的改装（1922 至 1937）
    from: 1922-04-22
    to: 1937-08-31
    note: >-
      本片是长良外形变化最大的时期，四项主要改动：
      ① 1932-1934 年间撤 8 cm 高角炮，换九三式 13 mm 连装机枪 2 基；
        6.5 mm 机炮换留式 7.7 mm 机枪（navypedia「1932 - 1934, all: - 2 x 1 - 6.5/115;
        + 2 x 1 - 7.7/80」「1932 - 1937, all: - 2 x 1 - 76/40; + 2 x 1 - 13.2/76」）。
      ② 1933 年装弹射器，位置在第 6、7 番炮之间（navypedia「1933, Nagara, Isuzu:
        + 1 x 4 - 13.2/76, 1 catapult (between No 6 & 7 guns)」），
        **滑走台随之撤除，滑走台空间改装机枪座**。
      ③ 1934-1935 年友鹤事件后加固体压载（固体 + 液体），满载排水量升至约 8,000 t，
        速力降到 32 节（navypedia：「after incident with torpedo boat Tomozuru for
        stability raise in 1934-1935 ... Full displacement has come nearer to 8000t,
        and maximal speed has decreased to 32kts」）。
      ④ 1935-1936 年锅炉改重油专烧，载油 1,600 t。

  - code: P2
    title: 开战至中途岛（1937-09 至 1942-06）
    from: 1937-09-01
    to: 1942-06-13
    note: >-
      1938-1940 年 13 mm 连装机枪换九六式 25 mm 连装 2 基 4 挺
      （navypedia「1938 - 1940, all: - 2 x 1 - 13.2/76; + 2 x 2 - 25/60 96-shiki」）。
      1942-04-11 舞鹤入港修理，**舰桥前的 13 mm 四连装机枪换为九三式 13 mm 连装机枪 1 基**
      （japanese-warship 与日文维基均记此次换装；combinedfleet 同日条目写的是
      「Two twin Type 93 13-mm machine guns are installed」，**数量口径不同，两说并列**）。
      1942-05-27 以第十水雷战队旗舰身份随南云机动部队出击中途岛。
      本片结束于返回吴港前（1942-06-13）。

  - code: P3
    title: 所罗门战役期（1942-06 至 1942-12）
    from: 1942-06-14
    to: 1942-12-26
    note: >-
      本片武备变化小，主要是身份与损伤：
      1942-06-14 在柱岛卸下中途岛伤员 338 人（转给医院船 TALASAGO MARU）与 280 人
      （转给 HIKAWA MARU）；07-14 随第十水雷战队转入第三舰队；
      08-09 至 08-14 吴港修理，装 7.7 mm 单装机枪 2 挺；
      11-12/13 第一次瓜岛海战被圣弗朗西斯科号 1 发 5 英寸炮弹命中，阵亡 6 人，舰体轻伤；
      11-15 第二次瓜岛海战以鱼雷与炮火攻击美军第 64 特混舰队；
      11-20 改任第四水雷战队旗舰（第十水雷战队旗舰由新造阿贺野接任）。

  - code: P4
    title: 舞鹤两次改装（1942-12 至 1943-08）
    from: 1942-12-27
    to: 1943-08-15
    note: >-
      ① 1942-12-27 入舞鹤，12-28 入坞，**撤 5 番 140 mm 炮**，1943-01-13 出坞
         （combinedfleet）。同时装 25 mm 连装 4 基（8 挺），使 25 mm 总数达 12 挺。
      ② 1943-07-15 在卡维恩触雷，舰尾轻损，5、6 番炮一度无法回旋；
         在拉包尔应急修理（combinedfleet 引 FRUMEL 截获电文原话）。
      ③ 1943-07-20 改任第二水雷战队旗舰（接神通），08-20 由新造能代接任，
         转属第八舰队。
      本片结束于进舞鹤改装前。

  - code: P5
    title: 对空强化与雷达（1943-08-16 至 1944-01）
    from: 1943-08-16
    to: 1944-01-25
    note: >-
      1943-08-16 入舞鹤入坞改装：**装一号对空电探（Type 21）**、
      装电波探知机、撤须式探照灯换九六式探照灯、撤 2.5 m 测距仪、换装射出机，
      并装 25 mm 连装 4 基（combinedfleet 与 japanese-warship 两源记载，
      **navypedia 把这次电探记为 1943-10 的「一号二型」，型号与月份两说并列**）。
      1943-11-01 转属第四舰队并任旗舰；11-12 至 11-16 拖曳被潜艇击伤的阿贺野回特鲁克。
      1943-12-04/05 在夸贾林遭第 50 特混舰队空袭，近失弹引起搭载鱼雷诱爆
      （combinedfleet 记「damaged slightly」，日文来源记 48 死 112 伤，两说并列）。

  - code: P6
    title: 终末改装（1944-01 至 1944-08）
    from: 1944-01-26
    to: 1944-08-07
    note: >-
      1944-01-26 入舞鹤，至 04-10 出坞，是**长良最大的一次改装**：
      ① 撤 7 番 140 mm 炮，原位装 12.7 cm 连装高角炮 1 基（无防盾）；
      ② 撤前后连装鱼雷发射管，**改为后部四连装 2 基**（总数仍 8 门）；
      ③ 撤弹射器，原位装 25 mm 三连装 2 基，25 mm 总数升至 22 挺（2×3 + 6×2 + 4×1）；
      ④ 舰尾装深弹投放轨，舰首装九三式水中听音机。
      1944-07-02 在横须贺再装 25 mm 单装 10 基，总数达 32 挺（2×3 + 6×2 + 14×1），
      并装二号对水上电探（Type 22）。
      1944-08-07 自鹿儿岛赴佐世保途中，在天草诸岛以西被 USS Croaker 击沉。
