# 川内 正文
# 2026-11-23 建。数据来源见 sources-fragment.yaml，逐条原句见 RESEARCH-NOTES.md。

ship: sendai
updated: 2026-11-23

intro:
  lead:
    zh: >-
      川内是 5500 吨型轻巡的末组首舰，也是三艘川内型里唯一有击沉认定的那一艘：
      1942-01-27 的埃达乌海战，她与白雪等舰一起打沉了英国驱逐舰 THANET。
      太平洋战争的大部分时间里她是第三水雷战队的旗舰，
      但在中途岛，她跟着的是山本五十六亲率的主力部队，离战场 600 海里，一炮未发。
    en: >-
      Sendai was the lead ship of the last group of Japan's 5,500-ton light cruisers and
      the only ship of her class credited with a sinking: the British destroyer Thanet,
      off Endau on 27 January 1942. For most of the Pacific War she flew the flag of
      Destroyer Squadron 3, but at Midway she sailed with Yamamoto's Main Body,
      600 miles behind Nagumo's carriers, and never engaged.

  paragraphs:
    - heading: 四根烟囱是她的识别特征
      text:
        zh: >-
          天龙门到长良型的所有日本轻巡都是三根烟囱，只有川内型是四根——这是她在海面上
          最好认的地方。原因不在武备而在燃料：1921 年前后日本已经感到重油不足，
          于是把川内型的混烧锅炉由长良型的 2 基增加到 4 基，重油专烧锅炉相应减少，
          锅炉舱分成四组，烟囱就多了一根。代价是标准排水量增加 25 吨、计划速力从
          36 节降到 35.25 节。
        en: >-
          Every Japanese light cruiser from the Tenryu class through the Nagara class had
          three funnels; only the Sendai class had four, and that is what makes her easiest
          to identify at sea. The cause was fuel, not armament: with heavy oil already
          short around 1921, the class went from two mixed-firing boilers to four and cut
          back the oil-only boilers, splitting the boiler rooms into four groups and adding
          a funnel. The price was 25 tons more standard displacement and a design speed
          down from 36 to 35.25 knots.
      src: [navypedia-sendai, japanese-warship-sendai]

    - heading: 实测比设计快
      text:
        zh: >-
          川内的公试成绩是 97,657 马力、36.189 节，是 5500 吨型里唯一跑过 36 节的。
          姊妹舰没有达到：神通的记述是 35.1 节，那珂 34.8 节。
          这组数字来自单一来源，且该来源把它标为引自一篇中文技术文章而不是原始公试记录，
          所以本站按较低的证据等级收录，并在这里写明。
        en: >-
          Sendai made 97,657 shp and 36.189 knots on trials, the only 5,500-ton cruiser to
          reach 36 knots. Her sisters fell short: Jintsu is recorded at 35.1 knots and Naka
          at 34.8. The figures come from a single source which itself credits a Chinese
          technical article rather than an original trials report, so they are recorded here
          at a lower evidence level and flagged as such.
      src: [japanese-warship-sendai, dougakan-cl4]

    - heading: 她的鱼雷发射管到最后都没换
      text:
        zh: >-
          1941 年那珂与神通撤掉前部连装发射管、把后部换成四连装，川内不在这次改装之列。
          她到 1943-11-02 战沉为止，一直是四座连装、8 门、16 条鱼雷，
          舰桥后与第 3 烟囱后各两座。1943-05 的佐世保改装动了主炮、机枪、电探、深弹，
          唯独没动鱼雷。
          至于这 16 条鱼雷是怎么补进发射管的——本站在这一项上只查到「16 条」，
          没查到长良与川内各带几组机械再装填装置的可靠记载，因此不写。
        en: >-
          In 1941 Naka and Jintsu had their forward twin tubes removed and their after banks
          upgraded to quadruple mounts; Sendai was not included. To her loss on 2 November
          1943 she kept four twin mounts, eight tubes and sixteen torpedoes, two mounts
          abaft the bridge and two abaft the third funnel. The Sasebo refit of May 1943
          changed her guns, machine guns, radar and depth charges but not her torpedoes.
          How those sixteen torpedoes were reloaded into the tubes is a question this site
          could not answer from the sources it reached, so no reloading-gear figure is given.
      src: [navypedia-sendai, dougakan-cl4, combinedfleet-sendai]

    - heading: 沉没那晚
      text:
        zh: >-
          1943-11-02 凌晨的奥古斯塔皇后湾海战开场不到十分钟，四艘美军轻巡
          （MONTPELIER、CLEVELAND、COLUMBIA、DENVER）就用雷达射击把川内罩住，
          第一轮齐射即命中并引起火灾。她转向准备发射鱼雷，随后舵机故障、主机停转，
          第三锅炉舱被鱼雷击毁，锅炉用的淡水全部流失。舰上用海水强行给第一锅炉舱升汽，
          烟囱喷出浓烟，但螺旋桨已损，彻底失去航行能力。0200 弃舰，0430 沉于
          06-10S, 154-20E。庄司喜一郎舰长与 184 名乘员随舰阵亡，驱逐舰救起 236 人；
          第三水雷战队司令官伊集院松治少将及 75 人由潜艇 RO-104 救起。
        en: >-
          In the opening ten minutes of the Battle of Empress Augusta Bay on 2 November
          1943, four US light cruisers — Montpelier, Cleveland, Columbia and Denver — took
          Sendai under radar-directed fire and hit her with their first salvo, setting her
          afire. She turned to fire torpedoes, then lost steerage and engines; her No. 3
          boiler room was destroyed by a torpedo and all the fresh water for the boilers
          drained away. The crew ran the No. 1 boiler on seawater and the funnel threw out
          smoke like a screen, but the screws were damaged and she could no longer move.
          She was abandoned at 0200 and sank at 0430 in 06-10S, 154-20E. Captain Shoji
          Kiichiro and 184 crewmen went down with her; destroyers rescued 236 men, and the
          submarine RO-104 rescued Rear Admiral Ijuin Matsuji and 75 others.
      src: [combinedfleet-sendai, japanese-warship-sendai]

history:
  - id: build
    title: { zh: 建造与战前, en: Building and pre-war service }
    range: { from: 1922, to: 1941 }
    events:
      - date: 1922-02-16
        text:
          zh: 在三菱长崎造船所开工，作为轻巡洋舰起工。
          en: Laid down as a light cruiser at Mitsubishi's Nagasaki yard.
        src: [combinedfleet-sendai]

      - date: 1923-10-30
        text:
          zh: 下水并命名川内。
          en: Launched and named Sendai.
        src: [combinedfleet-sendai]

      - date: 1924-04-29
        text:
          zh: 竣工，登记入日本海军，为川内型首舰。
          en: Completed and registered in the IJN as lead ship of the Sendai class.
        src: [combinedfleet-sendai]

      - date: 1935-09-26
        text:
          zh: 在第四次舰队事件中遭台风损伤，其后进厂修理。
          en: Damaged by a typhoon in the Fourth Fleet Incident and subsequently repaired.
        src: [combinedfleet-sendai]

      - date: 1937-08-14
        text:
          zh: >-
            淞沪会战期间在上海前沿，其一架九五式水上侦察机升空迎击中国空军编队，
            击落一架中国飞机。
          en: >-
            Off Shanghai, one of her Type 95 floatplanes intercepted Chinese Air Force
            formations and shot down a Chinese aircraft.
        src: [combinedfleet-sendai]

      - date: 1941-11-20
        text:
          zh: >-
            就任桥本信太郎少将的第三水雷战队旗舰，随第 11、12、19、20 驱逐队
            从柱岛出发（第一护卫队）。
          en: >-
            Became flagship of Rear Admiral Hashimoto Shintaro's DesRon 3 and departed
            Hashirajima with DesDivs 11, 12, 19 and 20 as the No. 1 Escort Unit.
        src: [combinedfleet-sendai]

  - id: southern
    title: { zh: 马来与南方作战, en: Malaya and the southern operations }
    range: { from: 1941, to: 1942 }
    events:
      - date: 1941-12-07
        text:
          zh: 当地时间 2345，率驱逐队开始炮击马来亚哥打巴鲁。
          en: At 2345 local time she and her destroyers opened a bombardment of Kota Bharu, Malaya.
        src: [combinedfleet-sendai]

      - date: 1941-12-08
        text:
          zh: >-
            0045 掩护第 19 驱逐队的綾波、磯波、敷波、浦波与扫雷艇等在哥打巴鲁登陆。
            0210 遭澳大利亚皇家空军第 1 中队七架「哈德逊」攻击，运输船淡路山丸被击中起火。
          en: >-
            Covered the Kota Bharu landings at 0045; at 0210 seven RAAF No. 1 Squadron
            Hudsons attacked and set the transport Awajisan Maru afire.
        src: [combinedfleet-sendai]

      - date: 1941-12-09
        text:
          zh: 率第 19 驱逐队南下准备夜袭英国「Z 舰队」（威尔士亲王号与反击号）。
          en: >-
            Sailed south with DesDiv 19 for a night attack on Force Z, the Prince of Wales
            and Repulse.
        src: [combinedfleet-sendai]

      - date: 1941-12-19
        text:
          zh: >-
            1115，其水上侦察机（来源记为「可能是 E7N2」）发现并轰炸荷兰潜艇 O-20，
            随后綾波、夕雾以深水炸弹攻击，当晚 O-20 自沉。
          en: >-
            At 1115 her floatplane, probably an E7N2, spotted and bombed the Dutch submarine
            O-20; Ayanami and Yugiri depth-charged her and she was scuttled that night.
        src: [combinedfleet-sendai]

      - date: 1942-01-27
        text:
          zh: >-
            埃达乌海战：英国驱逐舰 THANET 与澳大利亚驱逐舰 VAMPIRE 夜袭登陆船团。
            川内与白雪还击，0400 前后 THANET 机舱与锅炉舱被击中，0415 沉没。
            这是川内型唯一被认定的击沉战果。
          en: >-
            Battle off Endau: the British destroyer Thanet and the Australian Vampire made
            a night attack on the transports. Sendai and Shirayuki returned fire; Thanet was
            hit in her engine and boiler rooms around 0400 and sank at 0415. It is the only
            sinking credited to the Sendai class.
        src: [combinedfleet-sendai, japanese-warship-sendai]

      - date: 1942-03-23
        text:
          zh: 掩护日本陆军第 18 师团一个大队在布莱尔港无抵抗登陆（D 作战）。
          en: Covered the unopposed landing of an Imperial Japanese Army battalion at Port Blair.
        src: [combinedfleet-sendai]

      - date: 1942-04-22
        text:
          zh: 返佐世保入坞整备，4-25 森下信卫大佐接任舰长。
          en: Arrived at Sasebo for refit; Captain Morishita Nobuei took command on 25 April.
        src: [combinedfleet-sendai]

  - id: midway
    title: { zh: 中途岛, en: Midway }
    range: { from: 1942, to: 1942 }
    events:
      - date: 1942-05-29
        text:
          zh: >-
            自宿毛湾出击，随山本五十六亲率的主力部队：以战列舰大和、长门、陆奥为核心，
            另有凤翔、千代田、日进与补给部队；川内率第 11、19 驱逐队担任护卫。
          en: >-
            Sailed from Sukumo Bay with Yamamoto's Main Body — Yamato, Nagato and Mutsu,
            with Hosho, Chiyoda, Nisshin and the supply group — screening with DesDivs 11
            and 19.
        src: [combinedfleet-sendai]

      - date: 1942-06-04
        text:
          zh: >-
            主力部队始终位于南云机动部队后方 600 海里，全程未与美军交战。
            川内在此役没有任何战斗记录。
          en: >-
            The Main Body remained 600 miles behind Nagumo's carrier striking force and did
            not engage American forces. Sendai has no combat record in this battle.
        src: [combinedfleet-sendai, japanese-warship-sendai]

  - id: solomons
    title: { zh: 所罗门战役, en: The Solomons campaign }
    range: { from: 1942, to: 1943 }
    events:
      - date: 1942-08-31
        text:
          zh: 抵肖特兰，此后以拉包尔—肖特兰为基地执行瓜岛运输与炮击任务。
          en: Arrived at Shortland and thereafter operated from Rabaul and Shortland on Guadalcanal runs.
        src: [combinedfleet-sendai]

      - date: 1942-09-12
        text:
          zh: 2130，与驱逐舰敷波、吹雪、铃风一同炮击亨德森机场附近的「血岭」。
          en: At 2130 bombarded "Bloody Ridge" near Henderson Field with the destroyers Shikinami, Fubuki and Suzukaze.
        src: [combinedfleet-sendai]

      - date: 1942-10-14
        text:
          zh: 2200，与水机母舰日进、轻巡由良及四艘驱逐舰把 1,100 名陆军送上瓜岛埃斯佩兰斯角。
          en: >-
            At 2200 landed 1,100 troops at Cape Esperance with the seaplane tender Nisshin,
            the light cruiser Yura and four destroyers.
        src: [combinedfleet-sendai]

      - date: 1942-11-15
        text:
          zh: >-
            第二次瓜岛海战：0016 被华盛顿号以 16 英寸主炮射击，川内施放烟幕、
            转向脱离，未受损。
          en: >-
            Second Naval Battle of Guadalcanal: at 0016 Washington opened fire on her with
            her 16-inch battery; Sendai made smoke, put about and retired undamaged.
        src: [combinedfleet-sendai]

      - date: 1943-01-21
        text:
          zh: 从油船三洋丸移来 2 门 25 mm 机枪。
          en: Two 25 mm guns were transferred to her from the oiler Sanyo Maru.
        src: [combinedfleet-sendai]

      - date: 1943-02-25
        text:
          zh: 第三水雷战队由第一舰队转属三川军一第八舰队。
          en: DesRon 3 was reassigned from the First Fleet to Mikawa Gunichi's Eighth Fleet.
        src: [combinedfleet-sendai]

      - date: 1943-04-21
        text:
          zh: 在卡维恩拖曳被空袭重创的重巡青叶，4-25 拖抵特鲁克。
          en: Took the bomb-damaged heavy cruiser Aoba under tow at Kavieng and brought her to Truk on 25 April.
        src: [combinedfleet-sendai, japanese-warship-sendai]

      - date: 1943-05-05
        text:
          zh: >-
            佐世保改装：装一号对空电探，撤 5 番 140 mm 炮，
            装 25 mm 三连装 2 基，加装深弹投放轨。
          en: >-
            Sasebo refit: Type 21 radar fitted, No. 5 14 cm gun removed, two triple 25 mm
            mounts added and depth-charge rails installed.
        src: [combinedfleet-sendai, navypedia-sendai]

      - date: 1943-06-25
        text:
          zh: 第三水雷战队旗舰职能移交驱逐舰新月，川内不再任旗舰。
          en: The destroyer Niizuki became flagship of DesRon 3; Sendai ceased to be the flagship.
        src: [combinedfleet-sendai]

      - date: 1943-10-31
        text:
          zh: 自拉包尔出发赴布干维尔，掩护由驱逐舰改装的运输队（天雾、夕凪、卯月、文月）。
          en: >-
            Sailed from Rabaul for Bougainville covering the destroyer-transports Amagiri,
            Yunagi, Uzuki and Fuzuki.
        src: [combinedfleet-sendai]

  - id: loss
    title: { zh: 奥古斯塔皇后湾海战与沉没, en: Empress Augusta Bay and loss }
    range: { from: 1943, to: 1943 }
    events:
      - date: 1943-11-02
        text:
          zh: >-
            随大森仙太郎少将的部队自拉包尔出击，护卫 1,000 名陆军增援奥古斯塔皇后湾。
          en: >-
            Sortied from Rabaul with Rear Admiral Omori Sentaro's force to escort 1,000
            troops to Empress Augusta Bay.
        src: [combinedfleet-sendai]

      - date: 1943-11-02
        text:
          zh: >-
            0031 美军第 39 特混舰队（四艘轻巡、八艘驱逐舰）在梅里尔少将指挥下拦截。
            0045 驱逐舰时雨转向时几乎与川内相撞；随后五月雨号与白露号碰撞。
          en: >-
            At 0031 Rear Admiral Merrill's TF 39 — four light cruisers and eight destroyers —
            intercepted the force. At 0045 Shigure barely avoided colliding with Sendai, and
            Samidare side-swiped Shiratsuyu.
        src: [combinedfleet-sendai]

      - date: 1943-11-02
        text:
          zh: >-
            0050，四艘美军轻巡以雷达射击集火川内，第一轮齐射即命中并引起火灾。
          en: >-
            At 0050 all four US light cruisers took Sendai under radar-directed 6-inch fire,
            hitting her with their first salvo and setting her afire.
        src: [combinedfleet-sendai]

      - date: 1943-11-02
        text:
          zh: >-
            0200 弃舰，0430 沉没于 06-10S, 154-20E。庄司舰长与 184 人阵亡，驱逐舰救起 236 人，
            潜艇 RO-104 另救起伊集院少将与 75 人。
            Navypedia 另记她被美军驱逐舰 CHARLES AUSBURN、CONVERSE、DYSON 补射鱼雷，
            combinedfleet 无此说，两说并列。
          en: >-
            Abandoned at 0200 and sunk at 0430 in 06-10S, 154-20E. Captain Shoji and 184 men
            were killed; destroyers rescued 236 and the submarine RO-104 rescued Rear Admiral
            Ijuin and 75. Navypedia adds that she was later torpedoed by the destroyers
            Charles Ausburn, Converse and Dyson, a claim combinedfleet does not make.
        src: [combinedfleet-sendai, navypedia-sendai]

      - date: 1944-01-05
        text:
          zh: 从海军舰艇名册除籍。
          en: Removed from the Navy List.
        src: [combinedfleet-sendai]
