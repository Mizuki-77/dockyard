# ============================================================================
# 榛名（はるな / Haruna）—— 金刚型三番舰，川崎神户建造
#
# 2026-11-23 建。舰级共用数据见 classes/kongo.yaml，本文件只写与舰级不同的、
# 本舰特有的、以及随时间变化的部分。
#
# **本舰三个必须记住的识别点：**
#   1. 唯一在**川崎造船所（神户）**建造的金刚型，也是日本**民间船厂建造的
#      第一艘战列舰**之一（与雾岛同为民间船厂首例）。原文：「初の超弩級戦艦
#      【金剛】、初の国産超弩級戦艦【比叡】、そしてこの【榛名】は、四番艦
#      【霧島】とともに、初の民間造船所建造の戦艦となりました。」
#   2. 第二次改装**四舰中最早**完成（1934-09-30），且是唯一保留**垂直后部
#      舰桥**的一艘：「3隻では【榛名】だけが、後部艦橋が垂直に立っていて、
#      残り3隻は後部煙突と距離を離すために少し後ろに倒れています。」
#      → 这是模型制作者区分榛名与另三舰的第一处外形特征。
#   3. 1930 年代大改装后**锅炉 11 座**（重油专烧），而同期的金刚/雾岛只有
#      8 座；炮塔侧板是**曲面**（金刚/比叡为平面）。
#
# 结局：1945-07-28 吴港空袭坐底（浅水），1946-1948 浮扬解体。
# 与雾岛（1942-11-15 战没）截然不同——本舰活到了战争结束。
# ============================================================================

id: haruna
name:
  zh: 榛名
  en: Haruna
  ja: 榛名（はるな）
class: kongo
note: >-
  金刚型三番舰。川崎造船所（神户）建造，1915-04-19 竣工。
  四舰中第二次改装最早完成（1934-09-30），后部舰桥保持垂直。

open_ended_note: |
  本文件里 valid.to 留空的 fact 都是「无已知终止事件」的项：
  该舰 1945-07-28 坐底后舰体仍存在至 1946-1948 年解体，
  故部分参数的时间窗终点不是战没日而是解体完成。
  具体的终止事件在各条 note 里注明。

