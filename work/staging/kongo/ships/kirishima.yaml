# ============================================================================
# 雾岛（きりしま / Kirishima）—— 金刚型四番舰，三菱长崎建造
#
# 2026-11-23 建。舰级共用数据见 classes/kongo.yaml。
#
# **本舰三个必须记住的识别点：**
#   1. **三菱长崎造船所建造**（navypedia：「霧島 [Kirishima] 225 Mitsubishi,
#      Nagasaki」），不是英国造。与榛名同为日本民间船厂建造的首批战列舰。
#      但机器与材料国产化程度比榛名高：combinedfleet「Most of the parts used in
#      her construction are manufactured in Japan.」
#   2. 第二次改装完成 **1936-06-08**（比榛名晚约 20 个月），之后锅炉为 **8 座**
#      （榛名/比叡为 11 座），涡轮为艦本式齿轮传动 4 台。
#      且**有试航实测数据**：公试全力 29.80 kn / 136,940 轴马力，
#      过荷全力 30.08 kn / 144,500 轴马力 —— 这是四舰里唯一有实测值的一艘。
#   3. 与金刚同为**炮塔侧板平面**，榛名/雾岛炮塔侧面是**曲面**
#      （「【榛名】と【霧島】の類似点としては、砲塔の側面に曲面があるところ。」）。
#      → 这与任务书给的「榛名与雾岛都…」无关，但反过来是区分四舰的外形依据。
#
# 结局：1942-11-15 第三次所罗门海战（瓜岛第二次夜战）被 USS Washington 击沉，
# 是太平洋战争中**第一场战列舰对战列舰交战**的战败方，也是日本海军唯一
# 与敌战列舰正面交火的主力舰。212 人阵亡，1,098 人生还。
# ============================================================================

id: kirishima
name:
  zh: 雾岛
  en: Kirishima
  ja: 霧島（きりしま）
class: kongo
note: >-
  金刚型四番舰。三菱长崎造船所建造，1915-04-19 竣工（与榛名同日）。
  1942-11-15 在萨沃岛西北被 USS Washington 击沉。

open_ended_note: |
  本舰 1942-11-15 沉没，故所有 valid.to 为空且无终止事件的 fact，
  其实际终点都是 1942-11-15；个别参数（如 1942-07 换装的机型）
  终点更早，已在各条 note 内注明。
  1942-12-20 从海军籍除籍（「KIRISHIMA is removed from the Navy List.」）。

