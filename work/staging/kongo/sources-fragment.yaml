  - id: japanese-warship-haruna
    title: 榛名【金剛型戦艦 三番艦】 — 大日本帝国軍 主要兵器
    url: https://japanese-warship.com/battleship/haruna/
    type: website
    tier: D
    role: [data, narrative]
    operator: japanese-warship.com（大日本帝国軍 主要兵器）
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      日文舰艇资料页，公开 2018-01-27、更新 2024-07-11。**本轮不可替代的一部分**
      是它按三个时点（1915 竣工 / 1928 一次改装后 / 1934 二次改装后）
      **逐型列兵装与锅炉**，且 1944-10-05 那一栏把 25 mm 按三联/双联/单装
      **分型给管数**——这是全库唯一能直接读出「108 挺」的构成的地方。
      **口径提示**：
      ① 锅炉逐舰差异记全：「一次改装：混焼10基、重油専焼6基 → 二次改装：
         重油専焼11基[1-P88]」，并与金刚/雾岛的 8 基明确区分。
      ② 基准排水量 26,330 / 29,330 / 32,156 t 三个时点，与 navypedia 的
         31,720（金刚）等逐舰值体系不同源，但 32,156 与 navypedia 的 Haruna
         值一致，可互证。
      ③ 「水線下幅」② 31.02 m / ③ 31.01 m 与 navypedia 的 29.3 m 差 1.7 m
         ——**两说并列不裁决**（日文用「水線下幅」、英文用 Breadth，可能不是
         同一测量位置）。
      ④ 引用的两本日文书：『船の科学』矢杉正一「舶用蒸気主機関の技術の変遷（7）」、
         『経済学雑誌』坂上茂樹「艦本式ボイラについて（2/3）」。
      ⑤ **本页马力栏只有设计值（64,000 / 136,000），没有试航实测**，
         故榛名的 propulsion.power.trial 与 speed.trial 为「未获取」。
      **抓取**：Python urllib 直连，HTTP 200，47,218 bytes。

  - id: japanese-warship-kirishima
    title: 霧島【金剛型戦艦 四番艦】 — 大日本帝国軍 主要兵器
    url: https://japanese-warship.com/battleship/kirishima/
    type: website
    tier: D
    role: [data, narrative]
    operator: japanese-warship.com（大日本帝国軍 主要兵器）
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      日文舰艇资料页，公开 2018-01-27、更新 2024-07-11。
      **本轮最有价值的一段是试航实测**：「第二次改装後の公試運転では、公試全力で
      29.80ノット・136,940軸馬力、過荷全力で30.08ノット・144,500軸馬力を記録して
      います[3]」，出处 [3] 为『軍艦霧島第二回改装公試運転成績』（一手试航记录）。
      这是四舰里**唯一**有试航实测马力/航速的一艘，故榛名页没有的数据
      不得用本页值代入。
      **口径提示**：
      ① 锅炉栏自己并列两说：「重油専焼10基[1-P88] or 重油専焼4基＋混焼6基[5]」
         ——混烧/专烧构成未定，本站并列不裁决。
      ② 速力栏把 ③ 标为「29.8ノット（公試全力）[3]」，与 navypedia 的
         30.5 kn（最大速度）是不同口径，本站分列 speed.trial / speed.max。
      ③ 第二次改装完成日记 1936（昭和 11），具体日 06-08 取自 combinedfleet。
      ④ 炮塔侧面曲面的外形差异记于此：「【榛名】と【霧島】の類似点としては、
         砲塔の側面に曲面があるところ。【金剛】と【比叡】は平面で構成されています。」
      **抓取**：Python urllib 直连，HTTP 200，47,000 bytes。

