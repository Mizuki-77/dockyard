  - id: navweaps-36cm-45-t41
    title: Japan 36 cm/45 (14") 41st Year Type — NavWeaps
    url: https://www.navweaps.com/Weapons/WNJAP_14-45_t41.php
    type: website
    tier: C
    role: [data]
    operator: navweaps.com（Tony DiGiulian）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      金刚级主炮完整数据页。同页含三型：14"/45 Vickers Mark "A"（英造）、
      43rd Year Type、41st Year Type（日产）。
      **口径提示**：
      ① **金刚装英造 43rd Year Type，榛名/雾岛装日产 41st Year Type**——
         本页开头即写明这套命名沿革，是修正「四舰主炮同型」误解的直接依据。
      ② 初速、药室、炮座重量等多项原文给区间（如 APC 初速 770-775 mps、
         炮管寿命 250-280 发），本站只收单值并在 note 保留区间，不取平均。
      ③ 弹道染料（1941 起）：榛名 Black、雾岛 Blue、金刚 Red、比叡 None(White)
         ——这是识别弹着的实用数据。
      ④ 内页明确「Automatic air purging was added during refits in 1940-1941 on
         at least the Kongô class.」
      ⑤ 炮座重量「Kongô: About 654 tons (664 mt)」是**炮座**总重，不是炮身重。
      **抓取**：Python urllib 直连，HTTP 200，41,436 bytes。

