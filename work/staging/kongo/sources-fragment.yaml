# ============================================================================
# 金刚型（榛名・雾岛）来源分片 —— 2026-11-23
#
# 登记前已核对 data/sources.yaml（363 条既有条目），确认：
#   - 不含 navypedia 的 Kongo 级页（既有只有 bismarck/hood/illustrious/yorktown/
#     akagi/soryu/hiryu/kaga/town/gloucester/edinburgh/norfolk/tribal/arkroyal/
#     piorun/jkn/hipper/nelson/kgv 等，**无 kongo**）
#   - 不含 combinedfleet 的 haruna / kirishima / kongo / hiei TROM
#   - 不含 navweaps 的 14"/45 四一式（WNJAP_14-45_t41）与 6"/50 四一式
#     （WNJAP_6-50_t41）
#   - 不含 japanese-warship.com 的榛名/雾岛/金刚页
# 因此本文件全部为**新登记**，无重复。
#
# 已存在、本轮直接复用（不重复登记）：
#   navweaps-127cm-89   日本 12.7 cm/40 八九式（tier C）
#   navweaps-25mm-96    日本 25 mm/60 九六式（tier C）
# ============================================================================

sources:
  - id: navypedia-kongo
    title: KONGO battlecruisers (1913 - 1915) — Navypedia
    url: https://www.navypedia.org/ships/japan/jap_bb_kongo.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: navypedia.org
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      金刚级主尺度/排水量/动力/装甲骨架，四舰合成一页、按三个状态列
      （as completed / 1928-1931 modernization / 1934-1940 modernization）。
      **口径提示（用前必读）**：
      ① 标准排水量栏在 as completed 列填「---」，只给「Displacement normal, t
         27500」——normal 与条约 standard 不是同一口径，不可当标准排水量用；
         本站的 26,330 t 取自日文来源的「基準排水量」。
      ② 第二次改装后的标准排水量是**逐舰给**的（Kongo 31720 / Hiei 32350 /
         Kirishima 31980 / Haruna 32156），而其上各项（全长、宽、吃水、马力、
         燃油、续航）全级共用一个值——**不可把逐舰值当全级值，也不可反过来**。
      ③ 动力栏把四舰分两组：「Kongo, Kirishima: … 8 Kampon boilers /
         Haruna, Hiei: … 11 Kampon boilers」——这是本级最重要的逐舰差异。
      ④ 装甲栏是纵列字符串，多数项为区间（如 belt: 203 - 76），区间内部
         如何分配到具体部位原文未写；同页文字段落与表格数字有若干处对不上
         （deck 57 在文字叙述里无对应），引用时以逐条 note 为准。
      ⑤ 燃油栏 as completed 记「coal 4200 + oil 1000」——含煤，本站
         propulsion.fuel.capacity 只收油 1000 t，煤量仅在 note 保留。
      **抓取**：Python urllib 直连，1 次成功（HTTP 200，56,591 bytes）。

  - id: combinedfleet-haruna
    title: IJN Battleship HARUNA — Tabular Record of Movement (combinedfleet.com)
    url: http://www.combinedfleet.com/haruna.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: combinedfleet.com (Bob Hackett / Sander Kingsepp / Lars Ahlberg)
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      榛名逐日年表，Revision 22，© 2000-2017。覆盖 1908（造舰缘起）至 1946-48
      （残骸浮扬解体），是本轮榛名战历与改装节点的主要来源。
      **口径提示**：
      ① **URL 注意**：`haruna_t.htm` 实测 404，正确路径是 `haruna.htm`
         （雾岛则是首字母大写的 `Kirishima.htm`，小写 404）——同站大小写不统一，
         抓之前先试两种。
      ② 编制数字来自 navypedia，本页不含编制表。
      ③ 1943-03 的 25 mm 增装本页记「Two 25-mm triple mounts are installed」
         （+2 座三联），navypedia 同一改装记「+ 7 x 2 - 25/60 96-shiki」
         （+7 座双联）——**两源冲突，本站并列不裁决**。
      ④ 1945-07 两日空袭的命中数记「13 bomb hits and 10 near misses」，
         navypedia 记「3 and 9 direct hits」——两说并列不裁决。
      ⑤ 注 [1] 主动质疑「榛名 1917 年触雷」这一流传说法：作者列出反证
         （无照片、无修理记录，且日本海军史家中川努称其从未触雷）。
         本站不采用「触雷」情节。
      ⑥ 注 [2] 说明第一次改装起始日两本日文书的说法不同（石桥孝雄记
         1923-11-28，本页取 Gakken Pictorial Vol.65 的 1924-02-08）。
      **抓取**：Python urllib 直连，HTTP 200，78,280 bytes。

  - id: combinedfleet-kirishima
    title: IJN Battleship KIRISHIMA — Tabular Record of Movement (combinedfleet.com)
    url: http://www.combinedfleet.com/Kirishima.htm
    type: website
    tier: D
    role: [data, narrative]
    operator: combinedfleet.com (Bob Hackett / Sander Kingsepp / Lars Ahlberg)
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >-
      雾岛逐日年表，Revision 19，© 2001-2016。覆盖 1912-03-17 开工至 1992-08
      Ballard 发现残骸，第三次所罗门海战第二夜（1942-11-14/15）逐分钟记录尤详。
      **口径提示**：
      ① **URL 注意**：本站路径大小写敏感，`kirishima.htm` 实测 404，
         必须用 `Kirishima.htm`。
      ② **本页有一条不可替代的否定性记载**（注 [3]）：「Several sources suggest
         that KIRISHIMA was fitted with a "Type 21 Model 1" radar in early August.
         This is not correct: KIRISHIMA was scheduled to receive a Type 21 radar,
         but departed without it.」——沉没时**无雷达**，本站据此驳回「1942-08
         装二一号电探」的流行说法。
      ③ 命中数存疑（注 [5]）：「USSBS postwar analysis … suggests that KIRISHIMA
         received nine 16-inch shell hits and forty 5-inch shell hits. This is
         consistent with Admiral Lee's estimate of eight 16-inch shell hits…
         However … Robert Lundgren has completed an analysis suggesting that the
         real number might be some 20 major caliber hits and seventeen smaller
         caliber hits.」→ 三说（USSBS 9+40 / Lee 8 / Lundgren 20+17）并存，
         本站不采用任何单一数字作事实。
      ④ 出发日与榛名页差两天：本页记 1942-05-27 出发，榛名页记 05-29。
         并列不裁决。
      **抓取**：Python urllib 直连，HTTP 200，67,304 bytes。

