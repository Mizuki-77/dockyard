# ============================================================================
# 单舰：利根（Tone）—— 利根级重巡洋舰 1 番舰
# ----------------------------------------------------------------------------
# 解析顺序：单舰 fact -> 舰级 fact -> 未记载。
# 本文件只写「与舰级不同 / 本舰独有」的值：建造日期、逐次改装（雷达与
# 25 mm 机铳的加装时点）、本舰结局。
# 全部技术骨架见 classes/tone.yaml。
#
# 【本舰与筑摩的三处真差异，都在本文件里】
#   1) 雷达：利根 1943-02 装 21 号（舞鹤）；1944-06/07 加 22 号 ×2 + 13 号 ×1（呉）；
#      1944-11/1945-02 撤 21 号、加 22 号 ×1（舞鹤）。
#   2) 鱼雷：同型同数，但利根没有筑摩那种「发射管被近失弹打瘫」的战损记录。
#   3) 结局：利根是唯一活到 1945-07 的一艘，沉在呉港浅水，战后浮起拆解。
#
# 调研底稿：work/staging/tone/RESEARCH-NOTES.md
# ============================================================================

id: tone
name:
  zh: 利根
  en: Japanese cruiser Tone

class: tone

open_ended_note: >
  本舰 1938-11-20 竣工于三菱长崎，1945-07-24 在呉港被美军舰载机击伤、
  07-29 沉坐浅底，1948-09-30 拆解完毕。战时无大规模改装，
  只有雷达与 25 mm 机铳逐次加装（见下）。

facts:
  # ============================================================ 身份
  - field: identity.name_original
    value: 利根（とね）
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1937-11-21 }
    confidence: C
    note: >
      combinedfleet TROM 原文："21 November 1937: Launched and named TONE."
      即下水日即命名日。

  - field: identity.name_zh
    value: 利根
    src: [navypedia-tone]
    valid: { from: 1937-11-21 }
    confidence: C
    note: navypedia 舰名栏原文 "利根 [Tone]"。

  - field: identity.name_en
    value: Japanese cruiser Tone
    src: [combinedfleet-tone-trom]
    valid: { from: 1937-11-21 }
    confidence: C

  - field: identity.ship_type
    value: heavy_cruiser
    src: [navypedia-tone]
    valid: { from: 1938-11-20 }
    confidence: C
    note: >
      日方内规上本舰长期按「二等巡洋舰」处理（因设计起点是轻巡），
      但 navypedia 归入 heavy cruisers、主炮为 20 cm 级，本站按 heavy_cruiser 登记。

  - field: identity.nation
    value: japan
    src: [navypedia-tone]
    valid: { from: 1938-11-20 }
    confidence: C

  - field: identity.operator
    value: Imperial Japanese Navy（大日本帝国海軍）
    src: [combinedfleet-tone-trom]
    valid: { from: 1938-11-20, to: 1945-11-20 }
    confidence: C
    note: >
      combinedfleet TROM 原文："20 November 1938: Completed and registered in the IJN.
      Attached to Yokosuka Naval District."
      除籍日见下条：原文 "20 November 1945: Removed from the Navy List."

  - field: identity.era
    value: ww2
    src: [combinedfleet-tone-trom]
    valid: { from: 1939-09-03, to: 1945-09-02 }
    confidence: C

  # ============================================================ 建造
  - field: construction.builder
    value: Mitsubishi Heavy Industries（三菱重工業）
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1934-12-01 }
    confidence: C
    note: navypedia 建造厂栏 "Mitsubishi, Nagasaki"；combinedfleet "Nagasaki. Laid down at Mitsubishi's Shipyard."

  - field: construction.builder_location
    value: Nagasaki（長崎）
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1934-12-01 }
    confidence: C

  - field: construction.yard_number
    value: '600'
    src: [navypedia-tone]
    valid: { from: 1934-12-01 }
    confidence: C
    note: navypedia 的 Yard No 栏原文 "600"（筑摩为 670）。

  - field: construction.laid_down
    value: 1934-12-01
    unit: date
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1934-12-01 }
    confidence: C
    note: >
      两源一致。combinedfleet 原文："1 December 1934: Nagasaki. Laid down at
      Mitsubishi's Shipyard."

  - field: construction.launched
    value: 1937-11-21
    unit: date
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1937-11-21 }
    confidence: C
    note: navypedia "21.11.1937"；combinedfleet 同日并记命名。

  - field: construction.commissioned
    value: 1938-11-20
    unit: date
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1938-11-20 }
    confidence: C
    note: >
      navypedia "20.11.1938"；combinedfleet "Completed and registered in the IJN."
      同日起首任舰长原鼎三（Hara Teizo）就任。

  # ============================================================ 战历编制
  - field: service.unit
    value: >-
      CruDiv 8 / 第八戦隊（至 1944-01-01 解散，本舰与筑摩同队，真珠湾攻击时隶属南云机动部队）
      → CruDiv 7 / 第七戦隊（1944-01-01 起，与熊野、铃谷同队）
      → 第二艦隊 CruDiv 5 / 第五戦隊（1944-11-21 起，与熊野同队）
      → 呉鎮守府練習艦队（1945-01-01 起）
    src: [combinedfleet-tone-trom]
    valid: { from: 1941-11-26, to: 1945-07-24 }
    confidence: C
    note: >
      **本条只登记 TROM 能直接佐证的编制节点，倒推的起始日不可靠。**
      「CruDiv 8」在 TROM 里作为本舰所属反复出现，最早一处是
      "26 November 1941: Operation "Z": CruDiv 8's TONE and CHIKUMA depart Hitokappu Bay"，
      故本条 from 取该日；**CruDiv 8 的成立日期 TROM 未记**（日文来源记 1939-11-15，
      属 tier E，未采用）。
      后续节点原文："1 January 1944: CruDiv 8 is disbanded. TONE and CHIKUMA are assigned
      to ... CruDiv 7 with KUMANO and SUZUYA." /
      "21 November 1944: CruDiv 7 is disbanded. TONE is assigned to the Second Fleet's
      CruDiv 5 with KUMANO." /
      "1 January 1945: Redesignated as a training vessel. Reassigned to Kure Training
      Flotilla with IWATE, IZUMO and YAKUMO."
      另有一处与编制相关的位移记录："1 December 1939: Attached to Maizuru Naval District
      with CHIKUMA."（镇守府籍，非战队编制）。

  - field: service.commander
    value: >-
      Hara Teizo（原鼎三，1938-11-20 起）→ Onishi Shinzo（大西新蔵，1939-11-15 起）
      → Nishida Masao（西田正雄，1940-10-15 起）→ Okada Tametsugu（岡田為次，1941-09-10 起）
      → Kobe Yuji（兄部勇次，1942-07-14 起）→ Mayuzumi Haruo（黛治夫，1943-12-01 起）
      → Okada Yusaku（岡田有作，1945-01-06 起）
    src: [combinedfleet-tone-trom]
    valid: { from: 1938-11-20, to: 1945-08-15 }
    confidence: B
    note: >
      全部七任均由 TROM 逐一按日期点名，原文句式一致：
      "20 November 1938: ... Captain Hara Teizo is the Commanding Officer." /
      "15 November 1939: Captain ... Onishi Shinzo ... is appointed the CO." /
      "15 October 1940: Captain Nishida Masao ... is appointed the CO." /
      "10 September 1941: Captain ... Okada Tametsugu ... is appointed the CO." /
      "14 July 1942: Captain ... Kobe Yuji ... is appointed the CO." /
      "1 December 1943: Captain Mayuzumi Haruo ... is appointed the CO." /
      "6 January 1945: Captain Okada Yusaku ... is appointed the CO."
      罗马字拼写取自 TROM 原文；汉字写法来自日文来源（tier E），
      仅作对照，不作为本条的依据。

  # ============================================================ 战时改装：雷达
  # sensors.radar.installed 是 multi 字段：同时并存的不同型号各占一条，不是分歧。
  - field: sensors.radar.installed
    value: 二一号電波探信儀（Type 21  air-search radar）
    src: [combinedfleet-tone-trom]
    valid: { from: 1943-02-21, to: 1944-11-17 }
    confidence: C
    note: >
      TROM 原文："21 February 1943: Arrives at Maizuru for a refit. Two additional
      25-mm twin AA guns are installed and a Type 21 air-search radar is fitted."
      终止日取 1944-11-17 撤换当天（见下一条）。

  - field: sensors.radar.installed
    value: 二二号電波探信儀 ×2（Type 22 surface-search radar）
    src: [combinedfleet-tone-trom]
    valid: { from: 1944-07-08 }
    confidence: C
    note: >
      TROM 原文："26 June-8 July 1944: In drydock at Kure. ... New antennas are installed
      for the two Type 22 surface-search radars and a Type 13 air-search radar is fitted."
      起始日取该次干船坞作业的结束日 1944-07-08（区间原文给到日）。
      **本舰的 22 号此后一直保留**（1944-11 那次只是又加了第三座），故 valid.to 留空。

  - field: sensors.radar.installed
    value: 一三号電波探信儀（Type 13 air-search radar）
    src: [combinedfleet-tone-trom]
    valid: { from: 1944-07-08 }
    confidence: C
    note: 同上一条 TROM 原文。

  - field: sensors.radar.installed
    value: 二二号電波探信儀 ×1（第三座，替换 21 号）
    src: [combinedfleet-tone-trom]
    valid: { from: 1944-11-17 }
    confidence: C
    note: >
      TROM 原文："17 November 1944: Arrives at Maizuru. Drydocked. ... Her Type 21 radar
      is replaced with a Type 22."
      **与 navypedia 在月份上不一致，两说并列不裁决。** navypedia 把这次改装记在
      "2/1945, Tone: - 7 x 1 - 25/60, 21-go radar; + 4 x 3 - 25/60 96-shiki,
      2-shiki 2-go radar (3rd)"，即 1945 年 2 月。本文件采用 combinedfleet 的
      1944-11-17（该次进坞的确切日期），差异写进 RESEARCH-NOTES。

  # ============================================================ 战时改装：25 mm 机铳
  # 1943-02 那次改装后的总数 **故意不登记**：TROM 只说 "Two additional 25-mm twin AA
  # guns are installed"，没给总数；用 12 加 4 得 16 属自算（SCHEMA §1 红线 3：
  # 推断值不进 fact）。该期间的机铳数记进 RESEARCH-NOTES 的「未获取」一节。

  - field: armament.aa_25mm.count
    value: 20
    unit: count
    src: [combinedfleet-tone-trom]
    valid: { from: 1943-12-14, to: 1944-07-08 }
    confidence: C
    note: >
      TROM 原文："6 November 1943: Arrives at Kure Navy Yard. Begins a refit. The forward
      25-mm twin AA mounts are replaced by four triple mounts, bringing the total number
      of 25-mm guns to 20 (4 x 3 and 4 x 2)." / "14 December 1943: The refit is completed."
      即 4 座三联 + 4 座双联 = 20 挺，**总数是原文直接给的**。起始日取改装完工日。

  - field: armament.aa_25mm.count
    value: 57
    unit: count
    src: [combinedfleet-tone-trom]
    valid: { from: 1944-07-08, to: 1944-11-17 }
    confidence: C
    note: >
      TROM 原文："... bringing the TONE's total 25-mm AA suite to 57 barrels
      (8x3, 4x2, 25x1)."
      括号里就是分型明细，直接引用，未做换算。

  - field: armament.aa_25mm.count
    value: 62
    unit: count
    src: [combinedfleet-tone-trom]
    valid: { from: 1944-11-17, to: 1945-07-24 }
    confidence: C
    note: >
      TROM 原文："Four 25-mm triple mounts are installed aft, removing seven single mounts
      and bringing TONE's total 25-mm AA suite to 62 barrels (12x3, 4x2, 18x1)."
      这是本站能查到的利根最终状态数字，来自 tier D 站点的逐次记录。

  # ============================================================ 结局
  - field: construction.fate_date
    value: 1945-07-24
    unit: date
    src: [navypedia-tone, combinedfleet-tone-trom, pwe-tone-class]
    valid: { from: 1945-07-24 }
    confidence: C
    note: >
      三源一致指向 7 月 24 日这次空袭为致命打击：
      navypedia "sunk 24.7.1945"；pwe "Sunk by aircraft 1945-7-24 at Hashirajima"；
      combinedfleet 原文 "24 July 1945 ... TONE receives three direct hits and several
      near misses."
      **但沉坐发生于 07-29，不是 07-24**，两者不要混：combinedfleet 原文
      "28 July 1945: ... TONE receives two direct hits to port side ... and six near
      misses." / "29 July 1945: Settles on the bottom in shallow water."
      本字段取「被击毁、丧失作战能力」的 07-24。

  - field: construction.fate_type
    value: sunk_by_enemy
    src: [navypedia-tone, combinedfleet-tone-trom]
    valid: { from: 1945-07-24 }
    confidence: C
    note: >
      沉在呉港浅水，不是外海沉没，故技术上是「坐沉」。战后处置链条：
      combinedfleet 原文 "20 November 1945: Removed from the Navy List." /
      "7 April 1947: Harima Shipyard starts the removal of superstructure and turrets." /
      "4 May 1948: The hull is refloated." / "30 September 1948: The scrapping of the
      hull is completed."

  - field: service.fate_category
    value: 停泊于呉港时被美军舰载机击沉（坐沉浅底），战后浮起拆解；非战沉于外海
    src: [combinedfleet-tone-trom, navypedia-tone]
    valid: { from: 1945-07-24 }
    confidence: C
    note: >
      navypedia 原文："Tone 24.7.1945 was sunk on shallow water off Kure by American
      carrier aircraft of TF.38. Wreck was additionally damaged 28.7.1945 and abandoned
      5.8.1945. She was later salvaged and scrapped in 1947 - 1948."

  # 阵亡人数未获取：combinedfleet 与 navypedia 均未给利根 1945-07 的伤亡数，
  # 故不登记 service.casualties / service.survivors。见 RESEARCH-NOTES。
