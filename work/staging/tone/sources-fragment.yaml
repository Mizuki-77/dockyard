# ============================================================================
# 利根级分片：新登记来源
# ----------------------------------------------------------------------------
# 已存在、直接复用、不重复登记：
#   navweaps-20cm-3ns   （20 cm/50 三年式，含 No.2 炮与本级 E3 炮座数据）
#   navweaps-127cm-89   （12.7 cm/40 八九式，含 Tone (4): A1 Mod 1）
#   navweaps-25mm-96    （25 mm/60 九六式）
#   navweaps-torpedoes-wwii  （德国鱼雷，与本级无关，未引用）
#
# 本轮新增 5 条。另登记 3 条 tier E 百科来源，**只作线索**，
# 没有任何 fact 以它们为 src（校验器会报错，已逐一确认）。
# ============================================================================

sources:
  - id: navypedia-tone
    title: Navypedia — TONE heavy cruisers (1938 - 1939)
    url: https://www.navypedia.org/ships/japan/jap_cr_tone.htm
    type: website
    tier: D
    role: [data]
    operator: navypedia.org
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      本级主尺度、动力、装甲按部位厚度、武备概览、编制、两舰建造日期与结局的主来源。
      装甲段落写得比多数专题站细（按「机舱段 / 弹药库段」两段分别给上下缘厚度），
      但**未给材质**、也**未声明各厚度是设计值还是实测值**。
      与本级另一来源 pwe-tone-class 在载油、续航、司令塔厚度、横向隔壁厚度四处不一致，
      四处都按 SCHEMA §1.2 并列保留，不裁决。

  - id: combinedfleet-tone-trom
    title: IJN TONE — Tabular Record of Movement（combinedfleet.com）
    url: http://www.combinedfleet.com/tone_t.htm
    type: website
    tier: B
    role: [data, narrative]
    operator: combinedfleet.com（Bob Hackett & Sander Kingsepp，Rev. 22）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      利根逐日年表，逐次改装（雷达型号与加装月、25 mm 机铳分型明细）与结局链条
      （07-24 中弹 / 07-29 坐沉 / 1947-04-07 起拆上层建筑 / 1948-05-04 浮起 /
      1948-09-30 拆解完毕）的唯一逐条来源。tier 取 B 与本站已登记的
      combinedfleet-mikuma（同为 Hackett & Kingsepp 的 TROM）保持一致。
      **口径提示**：本站按「首次出现该装备的改装节点」取 valid.from；
      区间原文（如 "26 June-8 July 1944"）取末日。

  - id: combinedfleet-chikuma-trom
    title: IJN CHIKUMA — Tabular Record of Movement（combinedfleet.com）
    url: http://www.combinedfleet.com/chikuma_t.htm
    type: website
    tier: B
    role: [data, narrative]
    operator: combinedfleet.com（Bob Hackett & Sander Kingsepp）
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      筑摩逐日年表。萨马岛海战段落给到分钟级（08:53 中雷、09:07/09:20/09:30 三次报损、
      11:05 再中两雷、14:15 后三雷、14:30 倾覆），是判定「击沉原因」的主要依据。
      **口径提示**：该 TROM 的 1944-06/07 改装段只写 "26 June 1944: Arrives at Kure.
      Drydocked."，**没有像利根那样列出加装明细**——筑摩这一段的雷达/机铳构成
      因此改用 navypedia 的月份区间，两舰记录粒度不同源，须在页面上说明。

  - id: combinedfleet-tone-class
    title: Tone-class Heavy Cruiser（combinedfleet.com 舰级页）
    url: http://www.combinedfleet.com/tone_c.htm
    type: website
    tier: D
    role: [data]
    operator: combinedfleet.com
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      舰级速览页。**唯一用处**：为「四座主炮塔全部前置、舰尾无一门主炮」提供
      独立于 navypedia 的第二条表述，原文 "Their main gun layout was sort of bizarre,
      with four dual turrets forward (some of which suffered from very poor firing arcs),
      and none aft."
      编制 850 亦与本页一致。其余数据（排水量、尺寸）为取整值，未采用。

  - id: pwe-tone-class
    title: Tone Class, Japanese Heavy Cruisers（The Pacific War Online Encyclopedia）
    url: http://pwencycl.kgbudge.com/T/o/Tone_class.htm
    type: website
    tier: D
    role: [data]
    operator: Kent G. Budge
    lang: en
    access: direct
    fetched: 2026-11-23
    license: all_rights_reserved
    note: >
      **本级唯一按部位逐条给装甲材质与厚度的来源**（NVNC / CNC 分写、司令塔分层、
      舵机舱分层、烟道口 105 mm）。标准排水量 11,215、编制 850 与 navypedia 互证。
      与本级 navypedia 的四处不一致见 navypedia-tone 的 note。
      **口径提示**：pwe 的部分尺寸同时给英制与公制，两者换算不完全自洽
      （661'1" = 201.50 m，但与 navypedia 的 201.6 m 差 0.1 m），
      本站两条并列，不取平均。

  # ---------------------------------------------------------------- 线索层（tier E）
  # 以下三条**不作任何 fact 的 src**，仅用于定位线索与交叉核对。
  # 凡只在这些来源里出现的数值（11,213 / 15,443 / 13,320 / 869 / 874 /
  # 35.55 kn / 35.44 kn / 152,189 hp / 152,915 hp / 6.23 m / 2,700 t / 9,240 nmi /
  # 55 挺 25 mm），一律不进 fact，逐条记进 RESEARCH-NOTES 的「未获取」与「争议」两节。

  - id: wiki-en-tone-class
    title: Tone-class cruiser（English Wikipedia）
    url: https://en.wikipedia.org/wiki/Tone-class_cruiser
    type: encyclopedia
    tier: E
    role: [lead]
    lang: en
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >
      仅作线索。用于确认「本级原为最上型第 5、6 号舰」「No.1 前向、No.3/No.4 朝后、
      No.2 背负」这类结构描述的存在，再去原始出处找依据。
      **该页的装甲数字（belt 145 / 225 mm、deck 65-30 mm）与 navypedia、pwe 均不一致**，
      尤其 225 mm 弹药库装带在任何非 E 级来源里都找不到，故未采用，见 NOTES 争议节。

  - id: wiki-ja-tone-class
    title: 利根型重巡洋艦（日本語版ウィキペディア）
    url: https://ja.wikipedia.org/wiki/利根型重巡洋艦
    type: encyclopedia
    tier: E
    role: [lead]
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >
      仅作线索。公试排水量 13,320 t、公试速力 35.55 kn、乘员 869 名、申报排水量 8,636 t、
      主炮塔布置（第 1・2 炮塔背负、第 3・4 炮塔在最上甲板层朝后）等
      只在此处出现的数值，全部不进 fact。
      该页自称其数值有防卫省防卫研究所档案编号（Ref.C05110625500 等），
      但档案正文本轮未抓取，故不能作为本站事实依据。

  - id: wiki-ja-tone-ship
    title: 利根 (重巡洋艦)（日本語版ウィキペディア）
    url: https://ja.wikipedia.org/wiki/利根_(重巡洋艦)
    type: encyclopedia
    tier: E
    role: [lead]
    lang: ja
    access: direct
    fetched: 2026-11-23
    license: cc_by_sa
    note: >
      仅作线索。其「兵装変遷」一节对 25 mm 与电探的逐年推定，与 combinedfleet TROM
      在月份上互有出入（如 21 号电探的撤除时间：本页 1945-02、TROM 1944-11-17），
      差异记进 NOTES 争议节，不据此改 fact。
      该页另有搭载机编制的变化（1942-06-25 前 零式水偵 3 + 九五式水偵 2；
      之后 零式水偵 5），属 tier E，未采用。
