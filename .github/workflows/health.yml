name: 凭据与数据健康自检

# 为什么需要这个 workflow：
#
# 推送依赖本机的 `gh auth` 凭据（存在 Windows 凭据管理器里）。
# 它不会「到期」，但可能因为重装系统、清空凭据管理器、换机器而失效 ——
# 而失效的那一刻不会有任何提示，只会等到某天推送时才报错。
#
# 这个 workflow 每周跑一次，在 GitHub 的服务器上验证**数据层本身**是否健康。
# 它替代不了本机自检（这边看不到你电脑上的凭据），两者互补：
# 本机挂了它照跑，数据坏了它在网页上有红叉。
#
# 本机凭据自检见 scripts/check_auth.ps1 与 docs/40-p5-issues.md §3。
#
# 注意：validate.py 依赖 PyYAML，必须显式安装。
# 本机早就装了，所以本地跑一直是绿的 —— 第一次上 CI 才发现漏了这一步。

on:
  schedule:
    # 每周一 09:00 Asia/Shanghai（UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 依赖清单见 requirements.txt（只有 PyYAML 一条）。
      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 全量校验
        run: python scripts/validate.py

      - name: 自测
        run: python scripts/selftest.py
